name: BridgePoint street placement V14
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-street-placement-v14.yml','street-detail-v1/street-placement-v14.mjs']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: false
jobs:
  street-placement:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore and verify exact currently published baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/horizon-site"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false and (.name|startswith("bridgepoint-v5000-"))) | [.workflow_run.id,.name] | @tsv' > "$RUNNER_TEMP/candidates"
          cat "$RUNNER_TEMP/candidates"
          found=0
          while IFS=$'\t' read -r run name; do
            if [ "$run" = "$GITHUB_RUN_ID" ]; then continue; fi
            # A Pages deployment can succeed even if later live verification fails.
            # Accept that candidate only if its deploy step succeeded; all live byte comparisons below still must pass.
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.conclusion')" != success ]; then
              deployed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?per_page=100" --jq 'any(.jobs[].steps[]?; .name == "Publish the preserved production snapshot" and .conclusion == "success")')" || continue
              if [ "$deployed" != true ]; then continue; fi
            fi
            rm -rf "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/horizon-site"
            mkdir -p "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/horizon-site"
            if ! timeout 240s gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "$RUNNER_TEMP/baseline"; then continue; fi
            if ! test -s "$RUNNER_TEMP/baseline/artifact.tar"; then continue; fi
            tar -xf "$RUNNER_TEMP/baseline/artifact.tar" -C "$RUNNER_TEMP/horizon-site"
            same=1
            for p in index.html app/index.html landing.js app.js world-v2300-map.js app/world-v2300-map.js world-v2300-water.js app/world-v2300-water.js bridgepoint-bottom-card-mobile-v2.js bridgepoint-bottom-card-categories-v1.js vendor/bp-nyc-bus-v1.mjs vendor/bp-bus-models-v3.mjs vendor/bp-street-detail-v1.mjs assets/street-detail-v1/manifest.json assets/street-detail-v1/busshelter.glb.gz world-v2300-tree-instanced.js app/world-v2300-tree-instanced.js vendor/bp-tree-canopy-source-v3.mjs vendor/bp-tree-canopy-worker-v3.mjs assets/street-detail-v1/pavers.png bridgepoint-app-space-explorer-v1.js vendor/bp-sketchfab-road-models-v1.mjs; do
              if ! curl --retry 2 --retry-all-errors --max-time 35 -fsSL -H 'Cache-Control: no-cache' "https://bridgepointintelligence.online/$p?baseline=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/current" || ! cmp -s "$RUNNER_TEMP/horizon-site/$p" "$RUNNER_TEMP/current"; then same=0; break; fi
            done
            if [ "$same" = 1 ]; then echo "Verified live baseline $run $name"; found=1; break; fi
          done < <( { grep -E '^46102329762[[:space:]]' "$RUNNER_TEMP/candidates" || true; head -15 "$RUNNER_TEMP/candidates"; } | awk '!seen[$0]++' )
          test "$found" = 1 || { echo 'No exact current release found; refusing rollback'; exit 1; }
      - name: Install only requested street placement changes
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/horizon-site"
          python3 - "$SITE" <<'PY'
          import sys,re,hashlib,shutil
          from pathlib import Path
          site=Path(sys.argv[1])
          allowed={'vendor/bp-street-placement-v14.mjs','vendor/bp-street-detail-v1.mjs','world-v2300-map.js','app/world-v2300-map.js','world-v2300-tree-instanced.js','app/world-v2300-tree-instanced.js','index.html','app/index.html','landing.js','app.js','app/landing.js','app/app.js'}
          def snapshot():
              return {p.relative_to(site).as_posix():hashlib.file_digest(p.open('rb'),'sha256').hexdigest() for p in site.rglob('*') if p.is_file() and p.relative_to(site).as_posix() not in allowed}
          before=snapshot()
          shutil.copyfile('street-detail-v1/street-placement-v14.mjs',site/'vendor/bp-street-placement-v14.mjs')
          p=site/'vendor/bp-street-detail-v1.mjs';s=p.read_text()
          anchor="if(!kind||kind==='stormdrain'"
          assert s.count(anchor)==1
          p.write_text(s.replace(anchor,"if(!kind||kind==='hydrant'||kind==='stormdrain'"))
          for base in (site,site/'app'):
              p=base/'world-v2300-tree-instanced.js';s=p.read_text()
              s="import {placementIndex} from '/vendor/bp-street-placement-v14.mjs';\n"+s
              anchor='    const all = getSourceTrees(map).filter(feature => {'
              assert s.count(anchor)==1
              s=s.replace(anchor,'    const placement=placementIndex(map);let rejectedPlacement=0;\n'+anchor)
              anchor='      const provisional = { coordinates: coordinate };'
              assert s.count(anchor)==1
              s=s.replace(anchor,'      if(!placement.treeAllowed(coordinate)){rejectedPlacement++;return false;}\n'+anchor)
              anchor='    const normalized = normalizeViewportTrees('
              assert s.count(anchor)==1
              s=s.replace(anchor,'    state.placementRejected=rejectedPlacement;state.placementRoads=placement.roads.length;state.placementBuildings=placement.buildings.length;\n    if(rejectedPlacement&&!all.length)authoritative=true;\n'+anchor)
              s=s.replace('if (activeMeshes.length && terrainPending','if (!rejectedPlacement && activeMeshes.length && terrainPending')
              s=s.replace("      restoreLegacyVisibility();\n      publish('waiting-for-source-trees', {","      if(rejectedPlacement)setLegacyVisibility(map,'none');else restoreLegacyVisibility();\n      publish('waiting-for-source-trees', {")
              p.write_text(s)
              p=base/'world-v2300-map.js';s=p.read_text()
              anchor="map.on('idle',bpAttachSketchfabRoadModels);"
              assert s.count(anchor)==1
              s=s.replace(anchor,anchor+" let bpPlacementAttached=false;const bpAttachPlacement=()=>{if(bpPlacementAttached||map.getZoom()<12)return;bpPlacementAttached=true;import('/vendor/bp-street-placement-v14.mjs?v=20261127-v14').then(m=>m.attachStreetPlacement(map)).catch(e=>{bpPlacementAttached=false;console.error('Street placement',e)});};map.on('move',bpAttachPlacement);map.on('moveend',bpAttachPlacement);map.on('idle',bpAttachPlacement);bpAttachPlacement();")
              s,n=re.subn(r'world-v2300-tree-instanced\.js\?v=[^\'"\s]+','world-v2300-tree-instanced.js?v=20261127-street-placement-v14',s);assert n>=1
              s,n=re.subn(r'(/vendor/bp-street-detail-v1\.mjs)(?:\?v=[^\'"\s]+)?',r'\g<1>?v=20261127-street-placement-v14',s);assert n>=1
              p.write_text(s)
              for name in ('index.html','landing.js','app.js'):
                  p=base/name
                  if p.exists():
                      s=p.read_text();n=re.sub(r'world-v2300-map\.js\?v=[^\'"\s<>]+','world-v2300-map.js?v=20261127-street-placement-v14',s)
                      if s!=n:p.write_text(n)
          assert before==snapshot(),'Unrelated production file changed'
          print('STREET_PLACEMENT_ONLY_BYTE_PRESERVATION_PASS',len(before))
          PY
          for f in vendor/bp-street-placement-v14.mjs vendor/bp-street-detail-v1.mjs world-v2300-map.js app/world-v2300-map.js world-v2300-tree-instanced.js app/world-v2300-tree-instanced.js; do node --input-type=module --check < "$SITE/$f"; done
          test -s "$SITE/assets/street-detail-v1/hydrant.glb.gz"
      - name: Verify mapped street geometry
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {placementIndex,crossingQuads} from './street-detail-v1/street-placement-v14.mjs';
          const f=(type,coordinates,properties)=>({geometry:{type,coordinates},properties});
          const road=f('LineString',[[-.001,0],[.001,0]],{class:'residential',width:7});
          const cross=f('LineString',[[0,-.00006],[0,.00006]],{subclass:'crossing'});
          const building=f('Polygon',[[[.0002,.0001],[.0004,.0001],[.0004,.0003],[.0002,.0003],[.0002,.0001]]],{building:'yes'});
          const map={getCenter:()=>({lng:0,lat:0}),getSource:id=>id==='ofm',querySourceFeatures:(id,o)=>o.sourceLayer==='transportation'?[road,cross]:o.sourceLayer==='building'?[building]:[]};
          const i=placementIndex(map);
          assert(!i.treeAllowed([0,0]));assert(!i.treeAllowed([.0003,.0002]));assert(i.treeAllowed([-.0003,.0003]));
          assert(crossingQuads(i).length>0);
          assert(i.hydrant([.0001,.00004]));assert(!i.hydrant([0,0]));
          console.log('STREET_PLACEMENT_GEOMETRY_PASS');
          JS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-v5000-${{ github.run_attempt }}
          path: ${{ runner.temp }}/horizon-site
          include-hidden-files: true
      - name: Wait for Pages artifact indexing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "bridgepoint-v5000-'"$GITHUB_RUN_ATTEMPT"'") | .id')
            if [ -n "$ID" ]; then sleep 15; exit 0; fi
            sleep 4
          done
          exit 1
      - name: Publish validated street placement only
        id: deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deploy-pages-extended.mjs
      - name: Verify live street placement and preserved production assets
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/horizon-site"
          for p in vendor/bp-street-placement-v14.mjs vendor/bp-street-detail-v1.mjs world-v2300-tree-instanced.js app/world-v2300-tree-instanced.js vendor/bp-sketchfab-road-models-v1.mjs world-v2300-map.js app/world-v2300-map.js index.html app/index.html landing.js app.js world-v2300-water.js app/world-v2300-water.js assets/street-detail-v1/hydrant.glb.gz; do
            for i in 1 2 3 4 5 6; do
              if curl --max-time 45 -fsSL -H 'Cache-Control: no-cache' "https://bridgepointintelligence.online/$p?preload=$GITHUB_SHA-$i" -o "$RUNNER_TEMP/live" && cmp -s "$SITE/$p" "$RUNNER_TEMP/live"; then break; fi
              if [ "$i" = 6 ]; then echo "LIVE_MISMATCH $p"; exit 1; fi
              sleep 5
            done
          done
          echo STREET_PLACEMENT_LIVE_BYTES_PASS

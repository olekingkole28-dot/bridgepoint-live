name: BridgePoint PC Photogrammetry Readiness
on:
  push:
    branches:
      - codex/pc-photogrammetry-readiness
    paths:
      - .github/workflows/bridgepoint-pc-photogrammetry-readiness.yml
permissions:
  contents: read
concurrency:
  group: bridgepoint-pc-photogrammetry-readiness
  cancel-in-progress: false
jobs:
  inspect-pc:
    runs-on: [self-hosted, windows, x64, horizon-ue58, gpu]
    timeout-minutes: 5
    steps:
      - name: Confirm the existing PC runner is connected
        shell: pwsh
        run: |
          Write-Output "BRIDGEPOINT_PC_RUNNER=connected"
          foreach ($tool in @("nvidia-smi", "docker", "cloudflared", "python", "colmap")) {
            if (Get-Command $tool -ErrorAction SilentlyContinue) {
              Write-Output ("TOOL_READY=" + $tool)
            }
          }

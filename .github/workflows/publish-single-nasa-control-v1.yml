name: Publish BridgePoint Single NASA Night Lights Control V1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-single-nasa-control-v1.yml']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download exact successful ocean control removal release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/45469897362 --jq '.conclusion')" = success
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/baseline"
            mkdir -p "$RUNNER_TEMP/baseline"
            if timeout 150s gh run download 45469897362 --repo "$GITHUB_REPOSITORY" --name bridgepoint-v5000-1 --dir "$RUNNER_TEMP/baseline" && test -s "$RUNNER_TEMP/baseline/artifact.tar"; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Remove only the redundant X-Ray NASA button
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/wind-site"
          mkdir -p "$SITE"
          tar -xf "$RUNNER_TEMP/baseline/artifact.tar" -C "$SITE"
          export SITE
          python3 - <<'PY'
          import os,re,hashlib
          from pathlib import Path
          site=Path(os.environ['SITE']);name='world-v2300-sensor-layers.js'
          allowed={name,'app/'+name,'landing.js','app.js','index.html','app/index.html'}
          def snap():return {p.relative_to(site).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in site.rglob('*') if p.is_file() and p.relative_to(site).as_posix() not in allowed}
          before=snap()
          for rel in (name,'app/'+name):
              p=site/rel
              if not p.exists():continue
              s=p.read_text()
              anchor='bLiquid.remove();status.hidden=true;'
              assert s.count(anchor)==1
              assert 'installNasaNightProtocol()' in s and 'autoOceanDive' in s
              s=s.replace(anchor,'bLiquid.remove();bl.remove();status.hidden=true;',1)
              p.write_text(s)
          assert 'data-nasa-nightlights' in (site/'world-v2300-time-slider.js').read_text()
          for rel in ('landing.js','app.js'):
              p=site/rel;s=p.read_text()
              s,n=re.subn(r'(world-v2300-sensor-layers\.js\?[^"\']+)',lambda m:m[1]+'&singlenasa=20261124v1',s)
              assert n>=1,(rel,n)
              p.write_text(s)
          for rel,entry in (('index.html','landing.js'),('app/index.html','app.js')):
              p=site/rel;s=p.read_text()
              s,n=re.subn(r'('+re.escape(entry)+r'\?[^"\s\']+)',lambda m:m[1]+'&singlenasa=20261124v1',s)
              assert n>=1,(rel,n)
              # A narrowly scoped fallback also hides stale cached legacy controls.
              tag='<style id="bp-single-nasa-control-v1">#bp-sensor-layers-v5945 button[data-l]{display:none!important}</style>'
              assert s.count('</head>')==1
              s=s.replace('</head>',tag+'\n</head>',1)
              assert all(k in s for k in ('timelinefooter=20261124v1','aircraftrestore=20261124v1','windbright=20261124v1','nooceanbutton=20261124v1'))
              p.write_text(s)
          assert before==snap(),'Unexpected unrelated asset changed'
          print('SINGLE_NASA_CONTROL_ONLY_BYTE_PRESERVATION_PASS',len(before))
          PY
          for f in world-v2300-sensor-layers.js app/world-v2300-sensor-layers.js landing.js app.js; do node --input-type=module --check < "$SITE/$f"; done
      - name: Verify one NASA button and actual latest renderer on off
        run: |
          set -euo pipefail
          TEST="$RUNNER_TEMP/nasa-control-test"
          mkdir -p "$TEST"
          npm install --prefix "$TEST" --no-audit --no-fund playwright-core@1.56.1
          export BP_SITE="$RUNNER_TEMP/wind-site"
          cat > "$TEST/test.mjs" <<'JS'
          import {chromium} from 'playwright-core';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          try{
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true,serviceWorkers:'block'});
            await page.route('https://bridgepointintelligence.online/**',async route=>{
              const u=new URL(route.request().url()),rel=u.pathname.replace(/^\//,'');
              if(rel===''||rel==='index.html'||rel==='app/'||rel==='app/index.html'||rel==='landing.js'||rel==='app.js'||rel.endsWith('world-v2300-sensor-layers.js')){
                const f=path.join(process.env.BP_SITE,rel===''?'index.html':rel==='app/'?'app/index.html':rel);
                if(fs.existsSync(f))return route.fulfill({status:200,contentType:rel.endsWith('.js')?'text/javascript':'text/html',body:fs.readFileSync(f)});
              }
              return route.continue();
            });
            await page.goto('https://bridgepointintelligence.online/?single-nasa-verify=20261124v1',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>window.__BP_MOBILE_CARD_V2__?.ready&&window.__BP_SENSOR_LAYERS_V5945__?.liquid===true&&document.querySelector('[data-nasa-nightlights]'),null,{timeout:120000});
            await page.evaluate(()=>document.querySelector('[data-bpv-v2-tab="visuals"]').click());
            const report=await page.evaluate(()=>({standalone:document.querySelectorAll('[data-nasa-nightlights]').length,duplicate:document.querySelectorAll('#bp-sensor-layers-v5945 [data-l]').length,ground:!!document.querySelector('#bp-sensor-layers-v5945 [data-g]'),ocean:document.querySelectorAll('#bp-sensor-layers-v5945 [data-liquid]').length,liquid:window.__BP_SENSOR_LAYERS_V5945__.liquid}));
            console.log('SINGLE_NASA_CONTROL',JSON.stringify(report));
            assert(report.standalone===1&&report.duplicate===0&&report.ground&&report.ocean===0&&report.liquid);
            await page.evaluate(()=>document.querySelector('[data-nasa-nightlights]').click());
            await page.waitForFunction(()=>{const s=window.__BP_SENSOR_LAYERS_V5945__;return s?.lights&&s.map.getLayer('bp-nightlights-v5945')&&document.querySelector('[data-nasa-nightlights]').getAttribute('aria-pressed')==='true'},null,{timeout:90000});
            const renderer=await page.evaluate(()=>{const s=window.__BP_SENSOR_LAYERS_V5945__,source=s.map.getStyle().sources['bp-nightlights-src-v5945'];return {tiles:source.tiles,liquid:s.liquid,opacity:s.map.getPaintProperty('bp-nightlights-v5945','raster-opacity')}});
            console.log('SINGLE_NASA_LATEST_RENDERER',JSON.stringify(renderer));
            assert(renderer.tiles[0].startsWith('bp-nasa-night-v6512://')&&renderer.opacity===1&&renderer.liquid);
            await page.evaluate(()=>document.querySelector('[data-nasa-nightlights]').click());
            await page.waitForFunction(()=>{const s=window.__BP_SENSOR_LAYERS_V5945__;return !s.lights&&!s.map.getLayer('bp-nightlights-v5945')&&s.liquid&&document.querySelector('[data-nasa-nightlights]').getAttribute('aria-pressed')==='false'},null,{timeout:30000});
            console.log('SINGLE_NASA_ON_OFF_PASS');
          }finally{await browser.close();}
          JS
          node "$TEST/test.mjs"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-v5000-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wind-site
          include-hidden-files: true
      - name: Wait for artifact indexing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "bridgepoint-v5000-'"$GITHUB_RUN_ATTEMPT"'") | .id')
            if [ -n "$ID" ]; then sleep 15; exit 0; fi
            sleep 4
          done
          exit 1
      - name: Publish preserved site
        id: deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deploy-pages-extended.mjs
      - name: Verify live single NASA control and preserved globe
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/wind-site"
          for p in world-v2300-time-slider.js world-v2300-sensor-layers.js app/world-v2300-sensor-layers.js landing.js app.js bridgepoint-bottom-card-mobile-v2.js bridgepoint-aircraft-visuals-v2.js app/bridgepoint-aircraft-visuals-v2.js bridgepoint-view-v5917.js bridgepoint-volumetric-fields-v5978.js app/bridgepoint-volumetric-fields-v5978.js bridgepoint-global-wind-rf-v1.js app/bridgepoint-global-wind-rf-v1.js wind-rf-global-v1.json index.html app/index.html bridgepoint-neo-watch-v1.js bridgepoint-emrf-starlink-global-v2.js bridgepoint-emrf-spectrogram-v1.js world-v2300-water.js bridgepoint-drone-awareness-v1.js bridgepoint-vessel-awareness-v1.js bridgepoint-power-outages-v1.js bridgepoint-wildfire-realistic-mesh-v4.js world-v2300-seismic-layer-v1.js; do
            curl --retry 8 --retry-all-errors --retry-delay 4 --max-time 40 -fsSL -H 'Cache-Control: no-cache' "https://bridgepointintelligence.online/$p?wind=$GITHUB_SHA" -o "$RUNNER_TEMP/wind-live"
            cmp "$SITE/$p" "$RUNNER_TEMP/wind-live"
          done
          echo BRIDGEPOINT_SINGLE_NASA_CONTROL_LIVE_PASS

name: Deploy BridgePoint Live

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download audited BridgePoint Flutter release
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          curl -L --fail --retry 3 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-7874-822f-baf5-f4114eafebc4/raw?se=2026-08-16T17%3A11%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=b317b8bf-a69d-5eac-bf4f-956f90d9fc01&skoid=bbd22fc4-f881-4ea4-b2f3-c12033cf6a8b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-16T13%3A58%3A44Z&ske=2026-08-17T13%3A58%3A44Z&sks=b&skv=2026-02-06&sig=kZVW3Tl4O%2BTO91bzGv9qNLVHcZJUEF/2npfogxg2HKc%3D' -o /tmp/bridgepoint.zip
          unzip -q /tmp/bridgepoint.zip -d site
          touch site/.nojekyll
          sed -i 's#<base href="/">#<base href="./">#' site/index.html
          test -s site/index.html
          test -s site/main.dart.js
          test -s site/bridgepoint-release.json
          grep -q '32dbcd559cc1d99ca331ace535d902a212b0edd0' site/bridgepoint-release.json
          echo "BridgePoint v216 audited release staged successfully for public hosting."
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish BridgePoint
        id: deployment
        uses: actions/deploy-pages@v4
name: Inspect CelesTrak Mirror OMM Schema Only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-starlink-mirror-schema-v1.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read first real mirrored orbital record, with no changes
        run: |
          python3 - <<'PY'
          import urllib.request,json,collections,datetime
          url='https://raw.githubusercontent.com/satvisorcom/satvisor-data/master/celestrak/json/starlink.json'
          req=urllib.request.Request(url,headers={'User-Agent':'BridgePointReadOnly/1.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=40) as r:d=json.load(r)
          print('MIRROR_TOP_TYPE',type(d).__name__,'COUNT',len(d))
          print('MIRROR_FIRST_TYPE',type(d[0]).__name__)
          for i in (0,1,100):
            print('MIRROR_SAMPLE_INDEX',i,json.dumps(d[i])[:1700])
          if isinstance(d[0],dict):
            print('MIRROR_KEYS',list(d[0].keys()))
          PY
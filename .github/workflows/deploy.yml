name: Deploy BridgePoint Live

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download audited BridgePoint Flutter release
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          curl -L --fail --retry 3 'https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-4b48-81fb-889b-9e589ee0b03a/raw?se=2026-08-16T09%3A50%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=143fc6c1-6bc7-5b33-8b90-ec84c25cbffe&skoid=add8ee7d-5fc7-451e-b06e-a82b2276cf62&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-15T21%3A30%3A43Z&ske=2026-08-16T21%3A30%3A43Z&sks=b&skv=2026-02-06&sig=mMXzROjJAValpluqWRYdwLIreyTeKT3hxhPalS/59Bc%3D' -o /tmp/bridgepoint.zip
          unzip -q /tmp/bridgepoint.zip -d site
          touch site/.nojekyll
          sed -i 's#<base href="/">#<base href="./">#' site/index.html
          test -s site/index.html
          test -s site/main.dart.js
          test -s site/bridgepoint-release.json
          grep -q '3c6bbd468c375c208c56741390ec9dbbce170fba' site/bridgepoint-release.json
          echo "BridgePoint run 103 staged successfully for project-path or custom-domain hosting."
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish BridgePoint
        id: deployment
        uses: actions/deploy-pages@v4

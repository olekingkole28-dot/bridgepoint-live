          const tag=(f,k)=>lower(f.properties?.[k]);
          const isGrass=f=>['grass','meadow','grassland','lawn','village_green','grass_verge'].includes(tag(f,'class'))||['grass','meadow','grassland','lawn','grass_verge'].includes(tag(f,'subclass'))||tag(f,'part')==='grass_verge'||tag(f,'surface')==='grass';
          const isPave=f=>['paving_stones','sett','cobblestone','brick','pavers'].includes(tag(f,'surface'))||['paving_stones','sett','cobblestone','brick','pavers'].includes(tag(f,'surface_material'));
          function roadWidth(f){const p=f.properties||{},w=parseFloat(p.width||p.width_m);if(Number.isFinite(w)&&w>0&&w<80)return w;const c=lower(p.class),sub=lower(p.subclass);if(['path','footway','sidewalk','cycleway','steps','pedestrian'].includes(c)||['footway','sidewalk','cycleway'].includes(sub))return 2.4;return ({motorway:22,trunk:17,primary:13,secondary:10,tertiary:8,minor:6,residential:6,service:4,track:3,rail:4})[c]||5;}
          function roadBlocks(f,out){if(['bridge','tunnel'].includes(tag(f,'brunnel')))return;for(const line of lines(f))for(let i=1;i<line.length;i++){const a=line[i-1],b=line[i],dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy);if(len<.01)continue;const r=(roadWidth(f)/2+.35)/Math.max(.1,Math.cos(ll(a)[1]*D)),nx=-dy/len*r,ny=dx/len*r,ex=dx/len*r,ey=dy/len*r;out.push([[[a[0]-ex+nx,a[1]-ey+ny],[b[0]+ex+nx,b[1]+ey+ny],[b[0]+ex-nx,b[1]+ey-ny],[a[0]-ex-nx,a[1]-ey-ny],[a[0]-ex+nx,a[1]-ey+ny]]]);}}

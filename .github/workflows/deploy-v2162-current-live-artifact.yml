name: Publish Current BridgePoint Living World

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v2162-current-live-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout rebuilt app artifact
        uses: actions/checkout@v4
        with:
          ref: live-artifact
          fetch-depth: 1

      - name: Verify current living-world runtime
        shell: bash
        run: |
          set -euo pipefail
          test -s app/index.html
          test -s app/map-v1997.js
          test -s app/map-v1997-weather-hotfix.js
          test -s app/map-v2060-immersive-world.js
          test -s app/map-v2080-cinematic-weather.js
          test -s app/map-v2162-game-world.js
          test -s app/map-v2163-photorealistic-adapter.js
          test -s app/map-v2170-living-world.js
          grep -Fq 'map-v2162-game-world.js?v=2162' app/map-v1997-weather-hotfix.js
          grep -Fq 'map-v2163-photorealistic-adapter.js?v=2163' app/map-v1997-weather-hotfix.js
          grep -Fq 'map-v2170-living-world.js?v=2170' app/map-v1997-weather-hotfix.js
          grep -Fq 'bp2162-state-boundary' app/map-v2162-game-world.js
          grep -Fq 'bp2162-county-boundary' app/map-v2162-game-world.js
          grep -Fq 'bp2162-stream' app/map-v2162-game-world.js
          grep -Fq 'bp2162-bridge-deck' app/map-v2162-game-world.js
          grep -Fq 'bp2162-tree-canopy' app/map-v2162-game-world.js
          grep -Fq "type:'globe'" app/map-v2170-living-world.js
          grep -Fq 'bp2170-asphalt-parking' app/map-v2170-living-world.js
          grep -Fq 'bp2170-osm-buildings' app/map-v2170-living-world.js
          grep -Fq 'bp2170-flood-depth' app/map-v2170-living-world.js
          grep -Fq 'bridgepoint_request_country_expansion_v2170' app/map-v2170-living-world.js
          node --check app/map-v2162-game-world.js
          node --check app/map-v2163-photorealistic-adapter.js
          node --check app/map-v2170-living-world.js
          node --check app/map-v1997-weather-hotfix.js

      - name: Assemble exact rebuilt site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir site
          tar --exclude=.git --exclude=site -cf - . | tar -xf - -C site
          touch site/.nojekyll site/app/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-v2170
          path: site

      - name: Publish rebuilt app
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-v2170

      - name: Verify public app received Living World V2170
        shell: bash
        run: |
          set -euo pipefail
          origin='https://bridgepointintelligence.online'
          ok=0
          for attempt in $(seq 1 36); do
            salt="${GITHUB_SHA}-${attempt}-$(date +%s)"
            curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${origin}/app/map-v2170-living-world.js?verify=${salt}" -o /tmp/v2170.js || true
            curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${origin}/app/map-v1997-weather-hotfix.js?verify=${salt}" -o /tmp/loader.js || true
            if grep -Fq 'bp2170-osm-buildings' /tmp/v2170.js && grep -Fq 'bp2170-flood-depth' /tmp/v2170.js && grep -Fq 'bridgepoint_request_country_expansion_v2170' /tmp/v2170.js && grep -Fq 'map-v2170-living-world.js?v=2170' /tmp/loader.js; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
          echo V2170_PUBLIC_APP_PASS

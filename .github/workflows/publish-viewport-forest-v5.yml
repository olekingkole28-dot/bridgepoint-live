            function schedule(){if(dead||timer)return;timer=setTimeout(()=>{timer=0;try{refresh()}catch(e){state.error=String(e).slice(0,180)}},mobile?420:250)}
            async function init(){
              if(dead||loading||geometry||map.getZoom()<5.5||Date.now()-lastAttempt<5000)return;
              loading=true;lastAttempt=Date.now();
              try{
                const [three,loaderModule]=await Promise.all([import('/vendor/three.module.js?v=169-local'),import('/vendor/GLTFLoader.bundle.js?v=169-local')]);T=three;
                const gltf=await loadStreetGLTF(new loaderModule.GLTFLoader(),{url:'/assets/street-detail-v1/oak.glb.gz'});if(dead)return;
                geometry=sourceLOD(T,gltf.scenes[0]);material=new T.MeshLambertMaterial({vertexColors:true,side:T.DoubleSide});
                map.addLayer({id:ID,type:'custom',renderingMode:'3d',
                  onAdd(m,gl){renderer=new T.WebGLRenderer({canvas:m.getCanvas(),context:gl,antialias:false});renderer.autoClear=false;camera=new T.Camera();scene=new T.Scene();scene.add(new T.HemisphereLight(0xe6f3ff,0x35442b,2.2));const sun=new T.DirectionalLight(0xfff2d8,1.7);sun.position.set(-30,70,45);scene.add(sun);schedule()},
                  render(gl,args){if(!mesh||!anchor||!renderer||map.getZoom()<6||(map.getZoom()>=17&&detailed()))return;const raw=map.transform?.getMatrixForModel?.(anchor.center,anchor.height);if(!raw)return;camera.projectionMatrix.fromArray(args.defaultProjectionData.mainMatrix).multiply(new T.Matrix4().fromArray(raw));renderer.resetState();renderer.render(scene,camera);state.drawCalls=renderer.info.render.calls;state.frames=(state.frames||0)+1;},
                  onRemove(){release();geometry?.dispose();material?.dispose();renderer?.dispose();}
                });state.status='loading-forest-tiles';schedule();

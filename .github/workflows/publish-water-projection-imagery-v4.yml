name: Publish BridgePoint water projection and close imagery V4
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-water-projection-imagery-v4.yml']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact successful continuous water coverage V3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/45654484109 --jq '.conclusion')" = success
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/baseline"
            mkdir -p "$RUNNER_TEMP/baseline"
            if timeout 180s gh run download 45654484109 --repo "$GITHUB_REPOSITORY" --name bridgepoint-v5000-1 --dir "$RUNNER_TEMP/baseline" && test -s "$RUNNER_TEMP/baseline/artifact.tar"; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Correct projection elevation units and high-resolution imagery
        run: |
          set -euo pipefail
          export SITE="$RUNNER_TEMP/horizon-site"
          mkdir -p "$SITE"
          tar -xf "$RUNNER_TEMP/baseline/artifact.tar" -C "$SITE"
          for p in index.html app/index.html bridgepoint-auto-reality-v1.js world-v2300-water.js; do
            curl --retry 3 --retry-all-errors --max-time 40 -fsSL -H 'Cache-Control: no-cache' "https://bridgepointintelligence.online/$p?baseline=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/current"
            cmp "$SITE/$p" "$RUNNER_TEMP/current"
          done
          python3 - <<'PY'
          import os,re,hashlib
          from pathlib import Path
          site=Path(os.environ['SITE'])
          water='world-v2300-water.js';world='world-v2300-map.js'
          allowed={water,'app/'+water,world,'app/'+world,'index.html','app/index.html','landing.js','app.js'}
          def snapshot():
              return {p.relative_to(site).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in site.rglob('*') if p.is_file() and p.relative_to(site).as_posix() not in allowed}
          before=snapshot()
          def one(s,a,b):
              assert s.count(a)==1,('PROJECTION_IMAGERY_ANCHOR',a[:160],s.count(a))
              return s.replace(a,b,1)
          for rel in (water,'app/'+water):
              p=site/rel;s=p.read_text()
              assert 'api.closeWaterCoverage=' in s and 'window.__BP_DEVICE_QUALITY_V1__?.waterBudget' in s
              a=s.index('const vertexSource = [');b=s.index('const fragmentSource = [',a)
              v=s[a:b];oldfragment=s[b:s.index('function compile(',b)]
              # In the non-globe MapLibre shader, elevation is conformal Mercator units,
              # NOT metres. Passing metres produces planet-sized vertical spikes whenever
              # the camera temporarily uses the non-rebased projection path.
              v=one(v,"'  }else{gl_Position=globalOcean?projectTile(worldPos):projectTileFor3D(displacedPosition, a_height + offsetM);}',","""'  }else{',
              '    float projectedHeight=a_height+offsetM;',
              '    if(a_kind>2.5&&a_kind<3.5)projectedHeight=clamp(projectedHeight,-15.0,15.0);',
              '    #ifndef GLOBE',
              '      projectedHeight/=40075016.6856*cLat;',
              '    #endif',
              '    gl_Position=globalOcean?projectTile(worldPos):projectTileFor3D(displacedPosition,projectedHeight);',
              '  }',""")
              v=one(v,"'    float h=a_height+offsetM;',","'    float h=a_height+offsetM;',\n    '    if(a_kind>2.5&&a_kind<3.5)h=clamp(h,-15.0,15.0);',")
              # Every close surface vertex stays at its mapped horizontal location.
              # Retain the vertical motion and existing modeled breaker shape.
              v=one(v,"'  vec2 displacedPosition = worldPos+curlOffset;',","'  if(u_oceanZoom>=10.0){curlOffset=vec2(0.0);if(a_kind>2.5&&a_kind<3.5)offsetM=clamp(offsetM,-3.0,3.0);}',\n    '  vec2 displacedPosition = worldPos+curlOffset;',")
              v,n=re.subn(r'&&u_oceanZoom>=3\.5&&u_localProjectionEnabled<0\.5', '&&u_oceanZoom>=3.5&&u_oceanZoom<10.0&&u_localProjectionEnabled<0.5',v,count=1)
              assert n==1,('DEPTH_BIAS',rel)
              s=s[:a]+v+s[b:]
              # A close view must never draw the previous coarse/global buffer using a
              # new local camera. The opaque source polygon fill remains visible until
              # a geographically registered replacement is committed.
              s=one(s,'const center=map.getCenter(),local=map.getZoom()>=10;','const center=map.getCenter(),local=map.getZoom()>=10;\n      this.meshBuiltAtZoom=map.getZoom();')
              a=s.index('    render(gl, args)');b=s.index('    onRemove(',a)
              r=s[a:b]
              r=one(r,'const z = map.getZoom();','''const z = map.getZoom();
                  if(z>=11&&(!api.localPrecisionGeometry||Number(this.meshBuiltAtZoom||0)<10)){
                    api.staleCoarseBufferSuppressed=true;
                    return;
                  }
                  api.staleCoarseBufferSuppressed=false;''')
              r=one(r,'const useLocal=isLocal&&z>=9&&planar&&projection?.mainMatrix?.length===16;','const useLocal=isLocal&&z>=9&&!/\\bGLOBE\\b/.test(args.shaderData?.define||\'\')&&projection?.mainMatrix?.length===16;')
              s=s[:a]+r+s[b:]
              # Match the higher-detail imagery stacking policy without changing its
              # underlying source-clipped, opaque polygon coverage.
              s=one(s,"['gta-foundation','gta-nasa','gta-esri','gta-usgs','gta-oam'].map(id=>ids.indexOf(id))","['gta-foundation','gta-nasa','gta-esri','gta-usgs','gta-oam','gta-nyc-ortho-2024'].map(id=>ids.indexOf(id))")
              assert s[s.index('const fragmentSource = ['):s.index('function compile(',s.index('const fragmentSource = ['))]==oldfragment,'UNRELATED LIQUID OPTICS CHANGED'
              p.write_text(s)
          for rel in (world,'app/'+world):
              p=site/rel;s=p.read_text()
              # Esri advertises levels through 23; permit real higher resolution tiles
              # instead of forcing every scene to interpolate level 19.
              s,n=re.subn(r"(esri\s*:\s*\{[^{}]*\{z\}[^{}]*\{y\}[^{}]*\{x\}[^{}]*?maxzoom\s*:\s*)19\b",r"\g<1>22",s,count=1)
              if n!=1:
                  s,n=re.subn(r"(esri\s*:\s*\{[^\n]*?maxzoom\s*:\s*)19\b",r"\g<1>22",s,count=1)
              assert n==1,('ESRI_SOURCE_MAXZOOM',rel)
              # NYC OTI official 2024 orthophotography, restricted to its service bounds.
              # Tile requests occur only at close zoom in the covered area.
              match=re.search(r"(?m)^(\s*)usgs\s*:\s*\{type:'raster'",s)
              assert match,('NYC_SOURCE_INSERTION',rel)
              src="nycOrtho2024:{type:'raster',tiles:['https://tiles.arcgis.com/tiles/yG5s3afENB5iO9fj/arcgis/rest/services/NYC_Orthos_2024/MapServer/tile/{z}/{y}/{x}'],tileSize:256,minzoom:16,maxzoom:21,bounds:[-74.278,40.49,-73.69,40.94],attribution:'NYC Office of Technology and Innovation · 2024 orthophotography'},\n"
              i=match.start();s=s[:i]+'  '+src+s[i:]
              match=re.search(r"(?m)^(\s*)\{id:'gta-oam',type:'raster'[^\n]*\n",s)
              assert match,('NYC_LAYER_INSERTION',rel)
              layer="  {id:'gta-nyc-ortho-2024',type:'raster',source:'nycOrtho2024',minzoom:16,maxzoom:24,layout:{visibility:'visible'},paint:{'raster-opacity':1,'raster-resampling':'linear','raster-fade-duration':0}},\n"
              s=s[:match.end()]+layer+s[match.end():]
              s,n=re.subn(r"'gta-foundation','gta-nasa','gta-esri','gta-usgs','gta-oam'(?!,'gta-nyc-ortho-2024')","'gta-foundation','gta-nasa','gta-esri','gta-usgs','gta-oam','gta-nyc-ortho-2024'",s)
              assert n>=2,('RASTER_STACK',rel,n)
              s=s.replace('Esri World Imagery EPSG:3857 raster tiles z0-19','Esri World Imagery EPSG:3857 raster tiles up to z22 where available').replace('Esri World Imagery raster tiles z0-19, overzoomed through z22','Esri World Imagery raster tiles up to z22 where available')
              p.write_text(s)
          for rel in ('landing.js','app.js'):
              p=site/rel;s=p.read_text()
              for key in (water,world):
                  s,n=re.subn(r'('+re.escape(key)+r'\?[^"\'\s]+)',lambda m:m[1]+'&projectionimagery=20261125v4',s)
                  assert n>=1,(rel,key,n)
              p.write_text(s)
          for rel,entry in (('index.html','landing.js'),('app/index.html','app.js')):
              p=site/rel;s=p.read_text()
              s,n=re.subn(r'('+re.escape(entry)+r'\?[^"\'\s]+)',lambda m:m[1]+'&projectionimagery=20261125v4',s)
              assert n>=1,(rel,n)
              p.write_text(s)
          assert before==snapshot(),'UNRELATED RELEASE FILE CHANGED'
          print('WATER_PROJECTION_IMAGERY_SCOPE_PASS',len(before))
          PY
          for p in world-v2300-water.js app/world-v2300-water.js world-v2300-map.js app/world-v2300-map.js landing.js app.js; do node --input-type=module --check < "$SITE/$p"; done
          node --input-type=module <<'JS'
          import fs from 'node:fs';import assert from 'node:assert/strict';
          const root=process.env.SITE;
          for(const prefix of ['', 'app/']){
           const w=fs.readFileSync(root+'/'+prefix+'world-v2300-water.js','utf8'),m=fs.readFileSync(root+'/'+prefix+'world-v2300-map.js','utf8');
           assert(w.includes('projectedHeight/=40075016.6856*cLat;'));
           assert(w.includes('if(u_oceanZoom>=10.0){curlOffset=vec2(0.0);'));
           assert(w.includes('staleCoarseBufferSuppressed=true')&&w.includes('api.closeWaterCoverage='));
           assert(m.includes("source:'nycOrtho2024'")&&m.includes("NYC Office of Technology and Innovation"));
           assert(/esri\s*:\s*\{[^\n]*?maxzoom\s*:\s*22/.test(m));
           assert(m.includes('bpDeviceQuality.bind(map)'));
          }
          console.log('WATER_UNITS_AND_IMAGERY_SOURCE_PASS');
          JS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-v5000-${{ github.run_attempt }}
          path: ${{ runner.temp }}/horizon-site
          include-hidden-files: true
      - name: Wait for artifact indexing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "bridgepoint-v5000-'"$GITHUB_RUN_ATTEMPT"'") | .id')
            if [ -n "$ID" ]; then sleep 15; exit 0; fi
            sleep 4
          done
          exit 1
      - name: Publish only the validated recovery
        id: deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Retry only explicit transient HTTP 5xx responses to deployment creation.
          # Never retry a deployment which has already received an ID.
          for attempt in 1 2 3 4 5; do
            set +e
            node scripts/deploy-pages-extended.mjs 2>&1 | tee "$RUNNER_TEMP/pages-deploy.log"
            result=${PIPESTATUS[0]}
            set -e
            if [ "$result" -eq 0 ]; then exit 0; fi
            if grep -q 'Created GitHub Pages deployment' "$RUNNER_TEMP/pages-deploy.log"; then exit "$result"; fi
            if ! grep -Eq 'POST .*pages/deployments returned HTTP 5[0-9][0-9]' "$RUNNER_TEMP/pages-deploy.log"; then exit "$result"; fi
            if [ "$attempt" -eq 5 ]; then exit "$result"; fi
            sleep $((attempt * 20))
          done
      - name: Verify live bytes and preserved scan
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/horizon-site"
          for p in bridgepoint-device-quality-v1.js world-v2300-water.js app/world-v2300-water.js world-v2300-map.js app/world-v2300-map.js index.html app/index.html landing.js app.js bridgepoint-auto-reality-v1.js data/bp-auto-reality-v1.json assets/manhattan-photogrammetry-v1/registration.json; do
            curl --retry 8 --retry-all-errors --retry-delay 4 --max-time 40 -fsSL -H 'Cache-Control: no-cache' "https://bridgepointintelligence.online/$p?recovery=$GITHUB_SHA" -o "$RUNNER_TEMP/live"
            cmp "$SITE/$p" "$RUNNER_TEMP/live"
          done
          echo RENDER_RECOVERY_LIVE_BYTES_PASS

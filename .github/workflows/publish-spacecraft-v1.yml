name: Publish BridgePoint Spacecraft & Launch Sites v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-spacecraft-v1.yml'
      - 'rebuild-v5000/bridgepoint-spacecraft-columbia-v1.js'
      - 'tests/spacecraft-columbia-v1.test.mjs'
      - 'rebuild-v5000/bridgepoint-spacecraft-discovery-v1.js'
      - 'tests/spacecraft-discovery-v1.test.mjs'
      - 'docs/spacecraft-launch-sites-v1.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Queued additive publisher: preserve the latest verified Plane Wrecks / Shipwrecks Pages baseline,
# then publish SLS + Mobile Launcher, Columbia, and the Smithsonian Discovery scan with local viewers.
concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download and validate Smithsonian Apollo 11 Columbia exterior scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/spacecraft
          SOURCE='https://3d-api.si.edu/content/document/3d_package:d8c6457e-4ebc-11ea-b77f-2e728ce88125/resources/apollo_exterior-150k-4096.glb'
          UA='BridgePointIntelligence/1.0 (+https://bridgepointintelligence.online)'
          curl --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 -fL -A "$UA" "$SOURCE" -o assets/spacecraft/smithsonian-apollo11-exterior-combined.glb
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          path=Path("assets/spacecraft/smithsonian-apollo11-exterior-combined.glb")
          raw=path.read_bytes()
          assert 100_000 <= len(raw) < 100*1024*1024, ("combined GLB size",len(raw))
          assert raw[:4]==b"glTF" and struct.unpack_from("<I",raw,8)[0]==len(raw)
          n=struct.unpack_from("<I",raw,12)[0]
          doc=json.loads(raw[20:20+n].decode("utf-8"))
          assert doc.get("asset",{}).get("version")=="2.0" and doc.get("meshes")
          print("SMITHSONIAN_COLUMBIA_COMBINED_GLB_PASS",len(raw),"bytes")
          PY

      - name: Download and validate Smithsonian Space Shuttle Discovery high-resolution 3D scan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/spacecraft
          SOURCE='https://3d-api.si.edu/content/document/3d_package:d8c636ce-4ebc-11ea-b77f-2e728ce88125/resources/Orbiter_Space_Shuttle_OV-103_Discovery-150k-4096.glb'
          UA='BridgePointIntelligence/1.0 (+https://bridgepointintelligence.online)'
          curl --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 -fL -A "$UA" "$SOURCE" -o assets/spacecraft/smithsonian-space-shuttle-discovery-150k-4096.glb
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          path=Path('assets/spacecraft/smithsonian-space-shuttle-discovery-150k-4096.glb')
          raw=path.read_bytes()
          assert 500_000 <= len(raw) < 50*1024*1024, ('Discovery GLB size',len(raw))
          assert raw[:4]==b'glTF' and struct.unpack_from('<I',raw,8)[0]==len(raw)
          n=struct.unpack_from('<I',raw,12)[0]
          doc=json.loads(raw[20:20+n].decode('utf-8'))
          assert doc.get('asset',{}).get('version')=='2.0' and doc.get('meshes')
          assert doc.get('materials') and doc.get('images'), 'Discovery textured GLB must retain material/image data'
          accessors=[a for a in doc.get('accessors',[]) if a.get('type')=='VEC3' and a.get('min') and a.get('max')]
          assert accessors, 'Discovery GLB has no bounded vertex accessors'
          extents=[max(a['max'][i]-a['min'][i] for a in accessors) for i in range(3)]
          assert max(extents)>10 and max(extents)<60, ('Discovery source extents',extents)
          print('SMITHSONIAN_DISCOVERY_HIGH_GL_B_PASS',len(raw),'bytes; source bounds',extents)
          PY
      - name: Validate the additive Spacecraft renderers and hosted NASA model
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < rebuild-v5000/bridgepoint-spacecraft-v1.js
          node --input-type=module --check < rebuild-v5000/bridgepoint-spacecraft-columbia-v1.js
          node --input-type=module --check < rebuild-v5000/bridgepoint-spacecraft-discovery-v1.js
          node tests/spacecraft-launch-sites-v1.test.mjs
          node tests/spacecraft-columbia-v1.test.mjs
          node tests/spacecraft-discovery-v1.test.mjs
          test -s assets/spacecraft/nasa-mobile-launcher.glb
          test -s assets/spacecraft/smithsonian-space-shuttle-discovery-150k-4096.glb
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          asset=Path('assets/spacecraft/nasa-mobile-launcher.glb')
          raw=asset.read_bytes()
          assert 0 < len(raw) < 100*1024*1024
          assert raw[:4] == b'glTF' and struct.unpack_from('<I', raw, 8)[0] == len(raw)
          n=struct.unpack_from('<I', raw, 12)[0]
          doc=json.loads(raw[20:20+n].decode('utf-8'))
          assert doc.get('asset', {}).get('version') == '2.0'
          assert 'KHR_draco_mesh_compression' in doc.get('extensionsUsed', [])
          assert len(doc.get('materials', [])) >= 2 and len(doc.get('images', [])) >= 2
          accessors=[a for a in doc.get('accessors', []) if a.get('type')=='VEC3' and a.get('min') and a.get('max')]
          assert accessors and max(a['max'][1]-a['min'][1] for a in accessors) > 200
          print('BRIDGEPOINT_NASA_MOBILE_LAUNCHER_GLB_PASS', len(raw), 'bytes')
          PY

          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          asset=Path('assets/spacecraft/smithsonian-space-shuttle-discovery-150k-4096.glb')
          raw=asset.read_bytes()
          assert 500_000 <= len(raw) < 50*1024*1024
          assert raw[:4]==b'glTF' and struct.unpack_from('<I',raw,8)[0]==len(raw)
          n=struct.unpack_from('<I',raw,12)[0]
          doc=json.loads(raw[20:20+n].decode('utf-8'))
          assert doc.get('asset',{}).get('version')=='2.0' and doc.get('meshes')
          assert doc.get('materials') and doc.get('images')
          assert any(a.get('type')=='VEC3' and a.get('min') and a.get('max') for a in doc.get('accessors',[]))
          print('BRIDGEPOINT_SMITHSONIAN_DISCOVERY_GLB_PASS',len(raw),'bytes')
          PY

      - name: Select the latest successful deployed GitHub Pages artifact
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ["REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          headers={"Accept":"application/vnd.github+json",
                   "Authorization":"Bearer "+token,
                   "X-GitHub-Api-Version":"2022-11-28"}
          def api(path):
              req=urllib.request.Request("https://api.github.com/repos/"+repo+path,headers=headers)
              with urllib.request.urlopen(req,timeout=35) as response:
                  return json.load(response)
          runs=api("/actions/runs?branch=main&per_page=100").get("workflow_runs",[])
          selected=None
          for run in runs:
              if run.get("status")!="completed" or run.get("conclusion")!="success":
                  continue
              jobs=api(f"/actions/runs/{run['id']}/jobs?per_page=100").get("jobs",[])
              steps=[s for job in jobs for s in (job.get("steps") or []) if s.get("conclusion")=="success"]
              uploaded=any("upload" in str(s.get("name","")).lower() and ("page" in str(s.get("name","")).lower() or "preserved production site" in str(s.get("name","")).lower()) for s in steps)
              deployed=any(("publish" in str(s.get("name","")).lower() or "deploy" in str(s.get("name","")).lower()) for s in steps)
              if not (uploaded and deployed):
                  continue
              artifacts=api(f"/actions/runs/{run['id']}/artifacts?per_page=100").get("artifacts",[])
              match=next((a for a in artifacts if not a.get("expired") and
                          (str(a.get("name","")).startswith("github-pages-") or
                           str(a.get("name","")).startswith("bridgepoint-v5000-"))),None)
              if match:
                  selected=(str(run["id"]),match["name"])
                  print("LATEST_SUCCESSFUL_PAGES_BASELINE",run["id"],run.get("name"),match["name"],match.get("size_in_bytes"))
                  break
          if not selected:
              fallback_run="44246111711"
              fallback_name="github-pages-plane-wrecks-v1"
              fallback=api(f"/actions/runs/{fallback_run}")
              if fallback.get("conclusion")!="success" or fallback.get("path")!=".github/workflows/publish-plane-wrecks-v1.yml":
                  raise SystemExit("Pinned fallback is no longer a successful Plane Wrecks Pages deployment.")
              fallback_jobs=api(f"/actions/runs/{fallback_run}/jobs?per_page=100").get("jobs",[])
              deploy_ok=any(job.get("conclusion")=="success" and any(
                  step.get("conclusion")=="success" and "Publish BridgePoint Plane Wrecks" in str(step.get("name",""))
                  for step in (job.get("steps") or [])) for job in fallback_jobs)
              fallback_artifacts=api(f"/actions/runs/{fallback_run}/artifacts?per_page=100").get("artifacts",[])
              fallback_artifact=next((a for a in fallback_artifacts if a.get("name")==fallback_name and not a.get("expired")),None)
              if not deploy_ok or not fallback_artifact:
                  raise SystemExit("Pinned successful Plane Wrecks Pages artifact is missing or expired; refusing to publish.")
              selected=(fallback_run,fallback_name)
              print("USING_PINNED_VERIFIED_PLANE_WRECKS_PAGES_FALLBACK",fallback_run,fallback_name,fallback_artifact.get("size_in_bytes"))
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write("run_id="+selected[0]+"\n")
              out.write("artifact_name="+selected[1]+"\n")
          PY

      - name: Download the preserved production Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.baseline.outputs.artifact_name }}
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/spacecraft-baseline

      - name: Restore the exact live site, then add only the spacecraft module and model
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find "$RUNNER_TEMP/spacecraft-baseline" -type f -name artifact.tar -print -quit)"
          test -n "$ARCHIVE"
          SITE="$RUNNER_TEMP/spacecraft-site"
          mkdir -p "$SITE"
          tar -xf "$ARCHIVE" -C "$SITE"

          for file in index.html app/index.html landing.js app.js bridgepoint-drone-awareness-v1.js \
            bridgepoint-plane-wrecks-v1.js app/bridgepoint-plane-wrecks-v1.js \
            bridgepoint-shipwrecks-v1.js app/bridgepoint-shipwrecks-v1.js \
            vendor/three.module.js vendor/GLTFLoader.bundle.js vendor/DRACOLoader.bundle.js \
            vendor/draco/draco_decoder.js vendor/draco/draco_decoder.wasm vendor/draco/draco_wasm_wrapper.js; do
            test -s "$SITE/$file" || { echo "SPACECRAFT_BASELINE_MISSING $file; refusing to publish"; exit 1; }
          done

          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          site=Path(os.environ["RUNNER_TEMP"])/"spacecraft-site"
          before={p.relative_to(site).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in site.rglob("*") if p.is_file()}
          (Path(os.environ["RUNNER_TEMP"])/"spacecraft-before.json").write_text(json.dumps(before,sort_keys=True))
          print("SPACECRAFT_BASELINE_FINGERPRINT_PASS",len(before),"files")
          PY

          mkdir -p "$SITE/app" "$SITE/assets/spacecraft"
          cp rebuild-v5000/bridgepoint-spacecraft-v1.js "$SITE/bridgepoint-spacecraft-v1.js"
          cp rebuild-v5000/bridgepoint-spacecraft-v1.js "$SITE/app/bridgepoint-spacecraft-v1.js"
          cp rebuild-v5000/bridgepoint-spacecraft-columbia-v1.js "$SITE/bridgepoint-spacecraft-columbia-v1.js"
          cp rebuild-v5000/bridgepoint-spacecraft-columbia-v1.js "$SITE/app/bridgepoint-spacecraft-columbia-v1.js"
          cp rebuild-v5000/bridgepoint-spacecraft-discovery-v1.js "$SITE/bridgepoint-spacecraft-discovery-v1.js"
          cp rebuild-v5000/bridgepoint-spacecraft-discovery-v1.js "$SITE/app/bridgepoint-spacecraft-discovery-v1.js"
          cp assets/spacecraft/nasa-mobile-launcher.glb "$SITE/assets/spacecraft/nasa-mobile-launcher.glb"
          cp assets/spacecraft/smithsonian-apollo11-exterior-combined.glb "$SITE/assets/spacecraft/smithsonian-apollo11-exterior-combined.glb"
          cp assets/spacecraft/smithsonian-space-shuttle-discovery-150k-4096.glb "$SITE/assets/spacecraft/smithsonian-space-shuttle-discovery-150k-4096.glb"

          python3 - "$SITE" <<'PY'
          import hashlib, json, re, sys
          from pathlib import Path
          site=Path(sys.argv[1])
          spacecraft_attach="""void import('./bridgepoint-spacecraft-v1.js?v=1-sls-mobile-launcher-lc39b')
           .then(m=>{window.__BP_SPACECRAFT_V1__=m.initSpacecraftRenderer(world)})
           .catch(e=>console.warn('BridgePoint Spacecraft & Launch Sites layer unavailable',e));"""
          columbia_attach="""void import('./bridgepoint-spacecraft-columbia-v1.js?v=2-apollo11-columbia-principal-axis')
           .then(m=>{window.__BP_SPACECRAFT_COLUMBIA_V1__=m.initSpacecraftColumbiaRenderer(world)})
           .catch(e=>console.warn('BridgePoint Smithsonian Columbia layer unavailable',e));"""
          discovery_attach="""void import('./bridgepoint-spacecraft-discovery-v1.js?v=1-smithsonian-space-shuttle-discovery')
           .then(m=>{window.__BP_SPACECRAFT_DISCOVERY_V1__=m.initSpacecraftDiscoveryRenderer(world)})
           .catch(e=>console.warn('BridgePoint Smithsonian Space Shuttle Discovery layer unavailable',e));"""
          plane_catch=".catch(e=>console.warn('BridgePoint Plane Wrecks layer unavailable',e));"
          for rel in ("landing.js","app.js"):
              p=site/rel
              data=p.read_text(encoding="utf-8")
              if "initSpacecraftRenderer(world)" not in data:
                  at=data.find("initPlaneWrecksRenderer(world)")
                  end=data.find(plane_catch,at) if at>=0 else -1
                  if at<0 or end<0:
                      raise SystemExit(f"{rel}: missing existing Plane Wrecks import anchor")
                  end += len(plane_catch)
                  data=data[:end]+"\n"+spacecraft_attach+data[end:]
              if "initSpacecraftColumbiaRenderer(world)" not in data:
                  spacecraft_catch=".catch(e=>console.warn('BridgePoint Spacecraft & Launch Sites layer unavailable',e));"
                  at=data.find(spacecraft_catch)
                  if at<0:
                      raise SystemExit(f"{rel}: missing existing Spacecraft import anchor for Columbia")
                  end=at+len(spacecraft_catch)
                  data=data[:end]+"\n"+columbia_attach+data[end:]
              if "initSpacecraftDiscoveryRenderer(world)" not in data:
                  columbia_catch=".catch(e=>console.warn('BridgePoint Smithsonian Columbia layer unavailable',e));"
                  at=data.find(columbia_catch)
                  if at<0:
                      raise SystemExit(f"{rel}: missing existing Smithsonian Columbia import anchor for Discovery")
                  end=at+len(columbia_catch)
                  data=data[:end]+"\n"+discovery_attach+data[end:]
              p.write_text(data,encoding="utf-8")

          for rel,needle in (("index.html","landing.js"),("app/index.html","app.js")):
              p=site/rel
              data=p.read_text(encoding="utf-8")
              matches=list(re.finditer(r'src="([^"]*'+re.escape(needle)+r'(?:\?[^\"]*)?)"',data))
              if len(matches)!=1:
                  raise SystemExit(f"{rel}: expected one {needle} script URL; found {len(matches)}")
              url=matches[0].group(1)
              if "spacecraft=sls-mobile-launcher-pad39b-v1" not in url:
                  updated=url+("&" if "?" in url else "?")+"spacecraft=sls-mobile-launcher-pad39b-v1"
                  data=data.replace(url,updated,1)
              p.write_text(data,encoding="utf-8")

          before=json.loads((Path(__import__("os").environ["RUNNER_TEMP"])/"spacecraft-before.json").read_text())
          after={p.relative_to(site).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in site.rglob("*") if p.is_file()}
          removed=set(before)-set(after)
          added=set(after)-set(before)
          changed={p for p in before if p in after and before[p]!=after[p]}
          allowed_changed={"landing.js","app.js","index.html","app/index.html",
                           "bridgepoint-spacecraft-v1.js","app/bridgepoint-spacecraft-v1.js",
                           "bridgepoint-spacecraft-columbia-v1.js","app/bridgepoint-spacecraft-columbia-v1.js"}
          allowed_added={"bridgepoint-spacecraft-v1.js","app/bridgepoint-spacecraft-v1.js",
                         "assets/spacecraft/nasa-mobile-launcher.glb",
                         "bridgepoint-spacecraft-columbia-v1.js","app/bridgepoint-spacecraft-columbia-v1.js",
                         "assets/spacecraft/smithsonian-apollo11-exterior-combined.glb",
                         "bridgepoint-spacecraft-discovery-v1.js","app/bridgepoint-spacecraft-discovery-v1.js",
                         "assets/spacecraft/smithsonian-space-shuttle-discovery-150k-4096.glb"}
          if removed or not changed.issubset(allowed_changed) or not added.issubset(allowed_added):
              raise SystemExit("SPACECRAFT_OVERLAY_SCOPE_FAILURE "+json.dumps({
                "removed":sorted(removed),"changed":sorted(changed),"added":sorted(added)}))
          required=allowed_added
          missing=required-set(after)
          if missing:
              raise SystemExit("SPACECRAFT_REQUIRED_FILES_MISSING "+json.dumps(sorted(missing)))
          assert (site/"bridgepoint-spacecraft-v1.js").read_bytes()==(site/"app/bridgepoint-spacecraft-v1.js").read_bytes()
          for name in ("bridgepoint-plane-wrecks-v1.js","app/bridgepoint-plane-wrecks-v1.js",
                       "bridgepoint-shipwrecks-v1.js","app/bridgepoint-shipwrecks-v1.js",
                       "bridgepoint-drone-awareness-v1.js"):
              assert before[name]==after[name], name+" changed unexpectedly"
          print("SPACECRAFT_ADDITIVE_ONLY_OVERLAY_PASS",len(changed),"existing files changed",len(added),"files added; no removals")
          PY

          node --check "$SITE/landing.js"
          node --check "$SITE/app.js"
          node --input-type=module --check < "$SITE/bridgepoint-spacecraft-v1.js"
          node --input-type=module --check < "$SITE/bridgepoint-spacecraft-columbia-v1.js"
          node --input-type=module --check < "$SITE/bridgepoint-spacecraft-discovery-v1.js"
          cmp -s "$SITE/bridgepoint-spacecraft-v1.js" "$SITE/app/bridgepoint-spacecraft-v1.js"
          cmp -s "$SITE/bridgepoint-spacecraft-columbia-v1.js" "$SITE/app/bridgepoint-spacecraft-columbia-v1.js"
          cmp -s "$SITE/bridgepoint-spacecraft-discovery-v1.js" "$SITE/app/bridgepoint-spacecraft-discovery-v1.js"
          grep -Fq 'initSpacecraftRenderer(world)' "$SITE/landing.js"
          grep -Fq 'initSpacecraftRenderer(world)' "$SITE/app.js"
          grep -Fq 'data-bp-local-spacecraft-viewer' "$SITE/bridgepoint-spacecraft-v1.js"
          grep -Fq 'not a photogrammetry scan' "$SITE/bridgepoint-spacecraft-v1.js"
          grep -Fq 'Apollo 11 Command Module' "$SITE/bridgepoint-spacecraft-columbia-v1.js"
          grep -Fq 'bp-spacecraft-toggle-v1' "$SITE/bridgepoint-spacecraft-columbia-v1.js"
          grep -Fq 'data-bp-local-spacecraft-viewer' "$SITE/bridgepoint-spacecraft-columbia-v1.js"
          grep -Fq 'Space Shuttle Orbiter OV-103' "$SITE/bridgepoint-spacecraft-discovery-v1.js"
          grep -Fq 'bp-spacecraft-toggle-v1' "$SITE/bridgepoint-spacecraft-discovery-v1.js"
          grep -Fq 'data-bp-local-spacecraft-viewer' "$SITE/bridgepoint-spacecraft-discovery-v1.js"
          grep -Fq 'smithsonian-space-shuttle-discovery-150k-4096.glb' "$SITE/bridgepoint-spacecraft-discovery-v1.js"
          test -s "$SITE/assets/spacecraft/nasa-mobile-launcher.glb"
          test -s "$SITE/assets/spacecraft/smithsonian-apollo11-exterior-combined.glb"
          test -s "$SITE/assets/spacecraft/smithsonian-space-shuttle-discovery-150k-4096.glb"
          echo "BRIDGEPOINT_SPACECRAFT_SLS_COLUMBIA_DISCOVERY_OVERLAY_PASS"

      - uses: actions/configure-pages@v5

      - name: Upload the preserved production site with the additive Spacecraft overlay
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-spacecraft-v1
          path: ${{ runner.temp }}/spacecraft-site
          include-hidden-files: true

      - name: Publish BridgePoint Spacecraft & Launch Sites v1
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-spacecraft-v1

      - name: Verify the live Spacecraft module, model and both globe entry points
        shell: bash
        run: |
          set -euo pipefail
          O='https://bridgepointintelligence.online'
          Q="$GITHUB_SHA-spacecraft-v1"
          D="$RUNNER_TEMP/spacecraft-live"
          mkdir -p "$D"
          for item in \
            "root.html:$O/?spacecraft=$Q" \
            "app.html:$O/app/?spacecraft=$Q" \
            "landing.js:$O/landing.js?verify=$Q" \
            "app.js:$O/app.js?verify=$Q" \
            "spacecraft.js:$O/bridgepoint-spacecraft-v1.js?verify=$Q" \
            "app-spacecraft.js:$O/app/bridgepoint-spacecraft-v1.js?verify=$Q" \
            "spacecraft.glb:$O/assets/spacecraft/nasa-mobile-launcher.glb?verify=$Q" \
            "columbia.js:$O/bridgepoint-spacecraft-columbia-v1.js?verify=$Q" \
            "app-columbia.js:$O/app/bridgepoint-spacecraft-columbia-v1.js?verify=$Q" \
            "columbia-combined.glb:$O/assets/spacecraft/smithsonian-apollo11-exterior-combined.glb?verify=$Q" \
            "discovery.js:$O/bridgepoint-spacecraft-discovery-v1.js?verify=$Q" \
            "app-discovery.js:$O/app/bridgepoint-spacecraft-discovery-v1.js?verify=$Q" \
            "discovery.glb:$O/assets/spacecraft/smithsonian-space-shuttle-discovery-150k-4096.glb?verify=$Q"; do
            name="${item%%:*}"; url="${item#*:}"
            curl --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 -fL \
              -H 'Cache-Control: no-cache' "$url" -o "$D/$name"
          done
          grep -Fq 'BP_FRONTEND_V5000' "$D/root.html"
          grep -Fq 'bridgepoint-spacecraft-v1.js?v=1-sls-mobile-launcher-lc39b' "$D/landing.js"
          grep -Fq 'bridgepoint-spacecraft-v1.js?v=1-sls-mobile-launcher-lc39b' "$D/app.js"
          grep -Fq 'SLS Block 1' "$D/spacecraft.js"
          grep -Fq 'data-bp-local-spacecraft-viewer' "$D/spacecraft.js"
          grep -Fq 'nasa-mobile-launcher.glb' "$D/spacecraft.js"
          grep -Fq 'initSpacecraftColumbiaRenderer(world)' "$D/landing.js"
          grep -Fq 'initSpacecraftColumbiaRenderer(world)' "$D/app.js"
          grep -Fq 'Apollo 11 Command Module' "$D/columbia.js"
          grep -Fq 'computeColumbiaPrincipalFrame' "$D/columbia.js"
          grep -Fq 'Smithsonian' "$D/columbia.js"

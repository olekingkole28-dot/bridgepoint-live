name: Publish Current BridgePoint Living World

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v2162-current-live-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout rebuilt app artifact
        uses: actions/checkout@v4
        with:
          ref: live-artifact
          fetch-depth: 1

      - name: Verify living-world, structure-lab, Live Earth and World Effects runtimes
        shell: bash
        run: |
          set -euo pipefail
          test -s app/index.html
          test -s app/map-v1997.js
          test -s app/map-v1997-weather-hotfix.js
          test -s app/map-v2162-game-world.js
          test -s app/map-v2163-photorealistic-adapter.js
          test -s app/map-v2174-smooth-world.js
          test -s app/map-v2180-structure-lab.js
          test -s app/map-v2185-live-earth.js
          test -s app/map-v2190-world-effects.js
          test -s app/trial-countdown-v1994.js
          grep -Fq 'map-v2174-smooth-world.js?v=2174' app/map-v1997-weather-hotfix.js
          grep -Fq 'map-v2180-structure-lab.js?v=2180' app/map-v1997-weather-hotfix.js
          grep -Fq 'map-v2185-live-earth.js?v=2185' app/map-v1997-weather-hotfix.js
          grep -Fq 'map-v2190-world-effects.js?v=2190' app/map-v1997-weather-hotfix.js
          ! grep -Fq 'map-v2170-living-world.js?v=2170' app/map-v1997-weather-hotfix.js
          ! grep -Fq 'map-v2172-performance-world.js?v=2172' app/map-v1997-weather-hotfix.js
          ! grep -Fq 'map-v2081-gpu-weather-runtime.js?v=2081' app/map-v1997-weather-hotfix.js
          grep -Fq "setProjection({type:'globe'})" app/map-v2174-smooth-world.js
          grep -Fq 'bp2174-context-buildings' app/map-v2174-smooth-world.js
          grep -Fq 'bp2174-tree-crown' app/map-v2174-smooth-world.js
          grep -Fq 's.layers.properties=false' app/map-v2174-smooth-world.js
          grep -Fq 's.layers.radar=true' app/map-v2174-smooth-world.js
          grep -Fq 'bridgepoint_structure_study_v2180' app/map-v2180-structure-lab.js
          grep -Fq 'bridgepoint_opportunity_buildings_viewport_v2180' app/map-v2180-structure-lab.js
          grep -Fq 'WHITE_CASING_BLACKTOP_YELLOW_OR_WHITE_CENTERLINES' app/map-v2180-structure-lab.js
          grep -Fq 'bridgepoint-live-earth-v2185' app/map-v2185-live-earth.js
          grep -Fq 'Ocean currents' app/map-v2185-live-earth.js
          grep -Fq 'NOAA CO-OPS currents/water levels' app/map-v2185-live-earth.js
          grep -Fq 'bridgepointWorldEffectsV2190' app/map-v2190-world-effects.js
          grep -Fq 'bridgepoint-world-effects-v2190' app/map-v2190-world-effects.js
          grep -Fq 'World Effects · V2190' app/map-v2190-world-effects.js
          grep -Fq 'BridgePointWorldEffects' app/map-v2190-world-effects.js
          grep -Fq 'Your 7-day intelligence trial has ended' app/trial-countdown-v1994.js
          node --check app/map-v2162-game-world.js
          node --check app/map-v2163-photorealistic-adapter.js
          node --check app/map-v2174-smooth-world.js
          node --check app/map-v2180-structure-lab.js
          node --check app/map-v2185-live-earth.js
          node --check app/map-v2190-world-effects.js
          node --check app/map-v1997-weather-hotfix.js
          node --check app/trial-countdown-v1994.js

      - name: Assemble exact rebuilt site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir site
          tar --exclude=.git --exclude=site -cf - . | tar -xf - -C site
          touch site/.nojekyll site/app/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-v2190
          path: site

      - name: Publish rebuilt app
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-v2190

      - name: Verify public app received V2190
        shell: bash
        run: |
          set -euo pipefail
          origin='https://bridgepointintelligence.online'
          ok=0
          for attempt in $(seq 1 36); do
            salt="${GITHUB_SHA}-${attempt}-$(date +%s)"
            curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${origin}/app/map-v2190-world-effects.js?verify=${salt}" -o /tmp/v2190.js || true
            curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${origin}/app/map-v1997-weather-hotfix.js?verify=${salt}" -o /tmp/loader.js || true
            curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${origin}/app/map-v2180-structure-lab.js?verify=${salt}" -o /tmp/v2180.js || true
            if grep -Fq 'bridgepointWorldEffectsV2190' /tmp/v2190.js && grep -Fq 'map-v2190-world-effects.js?v=2190' /tmp/loader.js && grep -Fq 'bridgepoint_structure_study_v2180' /tmp/v2180.js; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
          echo V2190_PUBLIC_APP_PASS

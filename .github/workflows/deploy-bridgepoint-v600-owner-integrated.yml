name: Deploy BridgePoint V600 — Integrated Owner AI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-bridgepoint-v600-owner-integrated.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble V600 from current durable app
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site && mkdir site
          git archive --format=tar origin/live-artifact | tar -xf - -C site
          test -s site/owner/index.html
          test -s site/app/index.html
          test -s site/owner/completion/index.html
          test -s site/owner/local-ai/index.html
          test -s site/owner/ai/control/index.html

          python - <<'PY'
          from pathlib import Path
          p=Path('site/owner/index.html')
          s=p.read_text(encoding='utf-8')

          # Remove earlier integrated block if this release is ever replayed.
          a=s.find('<!-- BP_OWNER_INTEGRATED_AI_V600_START -->')
          b=s.find('<!-- BP_OWNER_INTEGRATED_AI_V600_END -->')
          if a>=0 and b>a:
              s=s[:a]+s[b+len('<!-- BP_OWNER_INTEGRATED_AI_V600_END -->'):]

          style='''<style id="bp-owner-integrated-v600-style">
          #bp-owner-integrated-v600{margin-top:14px}.bp600-hero{border:1px solid rgba(188,155,255,.5);background:linear-gradient(145deg,#181c3b,#0b1c30);border-radius:18px;padding:18px}.bp600-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.bp600-title{font-size:21px;font-weight:950}.bp600-sub{color:#9eb3c7;font-size:12px}.bp600-input{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:13px}.bp600-input textarea{width:100%;min-height:82px;resize:vertical;border:1px solid #36536d;background:#071624;color:#fff;border-radius:12px;padding:12px;font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}.bp600-input button{border:0;border-radius:12px;padding:11px 16px;background:linear-gradient(135deg,#7657db,#3c6de4);color:#fff;font-weight:950;cursor:pointer;min-width:150px}.bp600-msg{margin-top:8px;color:#9eb3c7;font-size:11px}.bp600-metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}.bp600-m{border:1px solid #29445e;background:#0a1727;border-radius:12px;padding:10px}.bp600-m span{display:block;color:#9eb3c7;font-size:9px;text-transform:uppercase;letter-spacing:.06em}.bp600-m b{display:block;margin-top:2px;font-size:18px}.bp600-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;margin-top:10px}.bp600-card{border:1px solid #29445e;background:#0b1929;border-radius:13px;padding:12px;min-width:0}.bp600-card h3{margin:0 0 7px;font-size:13px}.bp600-row{padding:6px 0;border-bottom:1px solid #1e3448;font-size:11px}.bp600-row:last-child{border:0}.bp600-pill{display:inline-flex;border:1px solid #45617a;border-radius:999px;padding:2px 6px;margin:2px 3px 2px 0;font-size:9px;font-weight:900}.bp600-ok{color:#68e1a6;border-color:#32694f}.bp600-wait{color:#ffca5e;border-color:#715d2f}.bp600-bad{color:#ff7d88;border-color:#79424c}.bp600-linkgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;margin-top:10px}.bp600-linkgrid a{display:flex;align-items:center;justify-content:center;min-height:42px;text-align:center;border:1px solid #31506b;border-radius:10px;background:#10243a;color:#fff;text-decoration:none;font-size:10px;font-weight:900}.bp600-table{max-height:270px;overflow:auto;border:1px solid #20384d;border-radius:10px}.bp600-table table{min-width:660px}.bp600-table th,.bp600-table td{padding:6px;font-size:10px}.bp600-live{display:inline-flex;align-items:center;gap:5px;color:#68e1a6;font-size:10px;font-weight:950}.bp600-dot{width:7px;height:7px;border-radius:50%;background:#68e1a6;box-shadow:0 0 14px #68e1a6}@media(max-width:1100px){.bp600-metrics{grid-template-columns:repeat(3,1fr)}.bp600-grid{grid-template-columns:1fr 1fr}.bp600-linkgrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.bp600-input{grid-template-columns:1fr}.bp600-input button{width:100%}.bp600-metrics{grid-template-columns:1fr 1fr}.bp600-grid{grid-template-columns:1fr}.bp600-linkgrid{grid-template-columns:1fr 1fr}}
          </style>'''

          block='''<!-- BP_OWNER_INTEGRATED_AI_V600_START -->
          <section id="bp-owner-integrated-v600" class="section">
            <div class="bp600-hero">
              <div class="bp600-head"><div><div class="bp600-live"><span class="bp600-dot"></span> LIVE OWNER SYSTEM · V600</div><div class="bp600-title">🧠 BridgePoint Owner AI + Completion</div><div class="bp600-sub">Tell BridgePoint what you want in normal words. The system turns it into governed worker tasks while the ledger, national build and overnight machinery keep moving.</div></div><div><span class="bp600-pill bp600-ok">OWNER ONLY</span><span class="bp600-pill bp600-ok">LOCAL_FIRST</span><span class="bp600-pill bp600-ok">CUSTOMER AI SEPARATE</span></div></div>
              <div class="bp600-input"><textarea id="bp600-command" placeholder="Tell BridgePoint what you want done... Example: Finish the highest-priority national data gaps, fix anything broken, verify it, and keep revenue priority zero."></textarea><button id="bp600-send" type="button">Assign to BridgePoint AI</button></div><div id="bp600-command-status" class="bp600-msg">Safe reversible internal work can run automatically. Sensitive money, securities, regulated, destructive or credential actions remain gated.</div>
              <div id="bp600-metrics" class="bp600-metrics"></div>
              <div class="bp600-grid"><div class="bp600-card"><h3>✅ Master Completion · no forgotten work</h3><div id="bp600-ledger"></div></div><div class="bp600-card"><h3>🇺🇸 National data depth</h3><div id="bp600-national"></div></div><div class="bp600-card"><h3>🖥 Local AI + overnight machine</h3><div id="bp600-local"></div></div></div>
              <div class="bp600-grid"><div class="bp600-card" style="grid-column:span 2"><h3>🤖 Active / waiting worker work</h3><div id="bp600-tasks" class="bp600-table"></div></div><div class="bp600-card"><h3>⏱ Automatic overnight jobs</h3><div id="bp600-jobs"></div></div></div>
              <div class="bp600-linkgrid"><a href="/owner/completion/?v=600">✅ Full Master Ledger</a><a href="/owner/ai/control/?v=600">🎛 AI Control</a><a href="/owner/ai/executive/?v=600">🧠 Executive</a><a href="/owner/ai/reasoning/?v=600">🔬 Reasoning</a><a href="/owner/growth-swarm/?v=600">📈 Growth Swarm</a><a href="/owner/local-ai/?v=600">🖥 Local AI Setup</a></div>
            </div>
          </section>
          <script id="bp-owner-integrated-v600-script">(()=>{const B='https://xdfsjztwgsbmabshzsjw.supabase.co',K='sb_publishable_lM9oWQeHjBmgOIiteeOicQ_PTyAeF25',g=id=>document.getElementById(id);let busy=false;const e=v=>String(v??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]));function tok(){const ss=sessionStorage.getItem('bp_owner_access_token');if(ss)return ss;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||'';if(k.startsWith('sb-')&&k.endsWith('-auth-token')){const d=JSON.parse(localStorage.getItem(k)||'{}'),t=d?.access_token||d?.currentSession?.access_token||d?.session?.access_token;if(t)return t}}}catch(_){}return''}async function rpc(n,b={}){const t=tok();if(!t)throw new Error('Owner session not ready');const r=await fetch(B+'/rest/v1/rpc/'+n,{method:'POST',headers:{apikey:K,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(b)}),d=await r.json();if(!r.ok)throw new Error(d.message||n);return d}function pill(x){x=String(x??'—');const c=/PROVEN|ACTIVE|ONLINE|SUCC|READY|TRUE/i.test(x)?'bp600-ok':/FAIL|BLOCK|ERROR|DEFER/i.test(x)?'bp600-bad':'bp600-wait';return '<span class="bp600-pill '+c+'">'+e(x)+'</span>'}function m(l,v){return '<div class="bp600-m"><span>'+e(l)+'</span><b>'+e(v)+'</b></div>'}async function load(){if(busy)return;busy=true;try{const [c,d]=await Promise.all([rpc('bridgepoint_owner_ai_control_local_v598'),rpc('bridgepoint_owner_national_depth_v590')]);const lg=c.ledger||{},tc=c.task_counts||{},na=c.national||{},rv=c.revalidation||{},nodes=c.local_nodes||[],tasks=c.tasks||[],jobs=c.automation||[],online=nodes.filter(n=>n.status==='ONLINE');g('bp600-metrics').innerHTML=[m('Ledger open',lg.open||0),m('Priority open',lg.priority_open||0),m('AI queued',tc.ai_queued||0),m('Native queued',tc.native_queued||0),m('Source queued',na.source_tasks_queued||0),m('Local nodes',online.length)].join('');g('bp600-ledger').innerHTML='<div class="bp600-row">'+pill((lg.open||0)+' OPEN')+pill((lg.dispatched_open||0)+' DISPATCHED')+pill((lg.awaiting_verification||0)+' VERIFYING')+'</div><div class="bp600-row">'+Object.entries(lg.counts||{}).map(([k,v])=>pill(k+': '+v)).join('')+'</div><div class="bp600-row"><a style="color:#48ddff" href="/owner/completion/?v=600">Open every requirement, assignment and verification gap →</a></div>';const states=d.states||[],weak=states.filter(s=>(Number(s.parcel_denominator_pct||0)<99.9)||(Number(s.accepted_sources||0)<100)).slice(-5);g('bp600-national').innerHTML='<div class="bp600-row">'+pill((na.jurisdictions||0)+' JURISDICTIONS')+pill((na.property_foundation||0)+' FOUNDATION')+pill((na.signals_or_later||0)+' SIGNALS+')+'</div><div class="bp600-row">'+pill((rv.validated||0)+' SOURCES ACCEPTED')+pill((rv.endpoint_validated||0)+' ENDPOINT ONLY')+pill((rv.queued||0)+' REVALIDATING')+'</div><div class="bp600-row"><span class="muted">Depth policy: 100% reconciled parcels + broad authoritative source depth + matching/signals/scoring/opportunities/refresh gates.</span></div>';g('bp600-local').innerHTML='<div class="bp600-row">'+pill(c.provider_mode)+pill('HOSTED DEFAULT OFF')+'</div>'+(nodes.length?nodes.map(n=>'<div class="bp600-row"><b>'+e(n.node_name)+'</b> '+pill(n.status)+'<br><span class="muted">'+e(n.primary_model)+' · reviewer '+e(n.reviewer_model)+'</span></div>').join(''):'<div class="bp600-row">'+pill('PC NODE NOT ENROLLED')+'<br><a style="color:#48ddff" href="/owner/local-ai/?v=600">Set up local reasoning on this computer →</a></div>');g('bp600-tasks').innerHTML='<table><thead><tr><th>Worker</th><th>Work</th><th>Status</th><th>Mode</th><th>P</th></tr></thead><tbody>'+tasks.slice(0,35).map(t=>'<tr><td>'+e(t.worker_key)+'</td><td>'+e(t.task_type)+'</td><td>'+pill(t.status)+'</td><td>'+e(t.requires_ai?'LOCAL AI':'NATIVE')+'</td><td>'+e(t.priority)+'</td></tr>').join('')+'</tbody></table>';g('bp600-jobs').innerHTML=jobs.map(j=>'<div class="bp600-row"><b>'+e(j.jobname)+'</b> '+pill(j.active?'ACTIVE':'OFF')+' '+pill(j.last_status||'NO RUN')+'<br><span class="muted">'+e(j.schedule||'')+'</span></div>').join('')||'<div class="bp600-row">No job status returned.</div>'}catch(err){g('bp600-command-status').textContent='Owner AI status error: '+(err.message||err)}finally{busy=false}}async function send(){const v=g('bp600-command').value.trim();if(!v)return;const b=g('bp600-send');b.disabled=true;g('bp600-command-status').textContent='Handing this to BridgePoint AI...';try{const r=await rpc('bridgepoint_owner_intent_submit_v572',{p_message:v});g('bp600-command-status').innerHTML='✅ Accepted by Owner AI. Intent: <b>'+e(r.intent_id||r.id||'created')+'</b>. The worker fleet will plan, execute allowed work and verify it.';g('bp600-command').value='';setTimeout(load,1200)}catch(err){g('bp600-command-status').textContent='Could not submit: '+(err.message||err)}finally{b.disabled=false}}function start(){if(!g('bp-owner-integrated-v600'))return;g('bp600-send').onclick=send;load();setInterval(load,20000)}setTimeout(start,1300)})();</script>
          <!-- BP_OWNER_INTEGRATED_AI_V600_END -->'''

          insert_before='<section class="grid2 section"><div class="card"><h2>🔥 What needs you</h2>'
          if insert_before not in s:
              raise SystemExit('known Owner Center insertion point missing')
          s=s.replace(insert_before, style+block+insert_before, 1)
          s=s.replace('Founder cockpit · V599','Founder cockpit · V600').replace('Founder cockpit · V551','Founder cockpit · V600')
          s=s.replace('LIVE OWNER RELEASE V599','LIVE OWNER RELEASE V600')
          p.write_text(s,encoding='utf-8')

          Path('site/owner/ai/v600-release.json').write_text('{"version":600,"release":"Integrated Owner AI + Master Completion in Owner Center","owner_center_integrated_ai":true,"owner_command_input":true,"master_completion_embedded":true,"national_depth_embedded":true,"local_ai_embedded":true,"worker_queue_embedded":true,"overnight_jobs_embedded":true,"provider_mode":"LOCAL_FIRST","customer_ai_system_changing":false}\n',encoding='utf-8')
          PY

          grep -q 'BP_OWNER_INTEGRATED_AI_V600_START' site/owner/index.html
          grep -q 'Tell BridgePoint what you want done' site/owner/index.html
          grep -q 'bridgepoint_owner_intent_submit_v572' site/owner/index.html
          grep -q 'bridgepoint_owner_ai_control_local_v598' site/owner/index.html
          grep -q 'bridgepoint_owner_national_depth_v590' site/owner/index.html
          grep -q 'Founder cockpit · V600' site/owner/index.html
          if grep -R -E -i 'SUPABASE_SERVICE_ROLE_KEY|sb_secret_|OPENAI_API_KEY|ANTHROPIC_API_KEY|sk-proj-|sk-ant-|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' site/owner/index.html; then exit 1; fi
          touch site/.nojekyll site/app/.nojekyll

      - name: Persist exact V600 durable artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/final-live && mkdir /tmp/final-live
          cp -a site/. /tmp/final-live/
          cd /tmp/final-live
          git init
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m 'BridgePoint V600 integrated owner AI'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish V600
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify V600 live Owner Center
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 10 --retry-delay 3 'https://bridgepointintelligence.online/owner/?v=600' -o /tmp/owner.html
          test -s /tmp/owner.html
          grep -q 'BP_OWNER_INTEGRATED_AI_V600_START' /tmp/owner.html
          grep -q 'Tell BridgePoint what you want done' /tmp/owner.html
          grep -q 'Founder cockpit · V600' /tmp/owner.html

name: Publish BridgePoint Independent Building Card V3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-independent-building-card-v1.yml']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download exact successful turbine performance release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/45473677961 --jq '.conclusion')" = success
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/baseline"
            mkdir -p "$RUNNER_TEMP/baseline"
            if timeout 150s gh run download 45473677961 --repo "$GITHUB_REPOSITORY" --name bridgepoint-v5000-1 --dir "$RUNNER_TEMP/baseline" && test -s "$RUNNER_TEMP/baseline/artifact.tar"; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Detach only the existing building inspector after native mounting
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/wind-site"
          mkdir -p "$SITE"
          tar -xf "$RUNNER_TEMP/baseline/artifact.tar" -C "$SITE"
          export SITE
          python3 - <<'PY'
          import os,hashlib
          from pathlib import Path
          site=Path(os.environ['SITE'])
          allowed={'index.html','app/index.html'}
          def snap():return {p.relative_to(site).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in site.rglob('*') if p.is_file() and p.relative_to(site).as_posix() not in allowed}
          before=snap()
          view=(site/'bridgepoint-view-v5917.js').read_text()
          assert "propertySlot.appendChild(previewCard)" in view and "propertySlot.appendChild(bp)" in view
          overlay=r'''<style id="bpv-independent-building-card-css">
          body #previewCard.bpv-independent-building-card,body #buildingPanel.bpv-independent-building-card{position:fixed!important;z-index:calc(var(--bpv-ui-z,1200) + 30)!important;top:max(76px,env(safe-area-inset-top))!important;bottom:auto!important;right:12px!important;left:auto!important;width:min(430px,calc(100vw - 24px))!important;max-height:calc(100dvh - 100px)!important;height:auto!important;overflow:auto!important;overscroll-behavior:contain;box-sizing:border-box;pointer-events:auto;margin:0!important;transform:none!important}
          body #previewCard.bpv-independent-building-card[hidden],body #buildingPanel.bpv-independent-building-card[hidden]{display:none!important}
          #bpv-close-public-building{float:right;position:sticky;top:0;z-index:2;min-width:36px;min-height:36px;font-size:22px!important;padding:0!important;margin:0 0 6px 8px;border-radius:10px}
          @media(max-width:700px){body #previewCard.bpv-independent-building-card,body #buildingPanel.bpv-independent-building-card{top:max(64px,env(safe-area-inset-top))!important;left:8px!important;right:8px!important;width:auto!important;max-height:calc(100dvh - 88px)!important}}
          </style>
          <script id="bpv-independent-building-card-v2">
          (()=>{
            'use strict';
            let discovery=null,slotObserver=null,slot=null;
            function detach(){
              if(!slot)return;
              for(const id of ['previewCard','buildingPanel']){
                const card=document.getElementById(id);
                if(!card||!slot.contains(card))continue;
                card.classList.add('bpv-independent-building-card');
                if(id==='previewCard'&&!card.querySelector('#bpv-close-public-building')){
                  const close=document.createElement('button');
                  close.id='bpv-close-public-building';close.type='button';close.textContent='×';
                  close.setAttribute('aria-label','Close building details');
                  close.addEventListener('click',()=>{card.hidden=true;});
                  card.prepend(close);
                }
                document.body.appendChild(card);
              }
            }
            function locate(){
              const next=document.getElementById('bpv-property-card-slot');
              if(!next)return;
              if(slot!==next){
                slotObserver?.disconnect();slot=next;
                slotObserver=new MutationObserver(detach);
                slotObserver.observe(slot,{childList:true,subtree:true});
              }
              detach();
              discovery?.disconnect();discovery=null;
            }
            function start(){
              locate();
              if(!slot){discovery=new MutationObserver(locate);discovery.observe(document.body,{childList:true,subtree:true});}
            }
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
          })();
          </script>'''
          for rel in ('index.html','app/index.html'):
              p=site/rel;s=p.read_text()
              assert s.count('</head>')==1
              assert 'bpv-independent-building-card-v2' not in s
              s=s.replace('</head>',overlay+'\n</head>',1)
              assert all(k in s for k in ('turbineperf=20261124v1','turbineicons=20261124v1','singlenasa=20261124v1','timelinefooter=20261124v1'))
              p.write_text(s)
          assert before==snap(),'Unexpected unrelated asset changed'
          print('BUILDING_CARD_ONLY_BYTE_PRESERVATION_PASS',len(before))
          PY
      - name: Test actual shipped inspector markup and mount lifecycle on mobile and desktop
        run: |
          set -euo pipefail
          TEST="$RUNNER_TEMP/building-card-test"
          mkdir -p "$TEST"
          npm install --prefix "$TEST" --no-audit --no-fund playwright-core@1.56.1
          export BP_SITE="$RUNNER_TEMP/wind-site"
          cat > "$TEST/test.mjs" <<'JS'
          import {chromium} from 'playwright-core';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const site=process.env.BP_SITE;
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          try{
            for(const mode of ['public','app']){
              const file=mode==='public'?'index.html':'app/index.html';
              const html=fs.readFileSync(path.join(site,file),'utf8');
              const overlay=html.match(/<script id="bpv-independent-building-card-v2">([\s\S]*?)<\/script>/)[1];
              const css=html.match(/<style id="bpv-independent-building-card-css">([\s\S]*?)<\/style>/)[1];
              const styles=['bridgepoint-view-v5917.css',mode==='public'?'landing.css':'styles.css'].map(f=>fs.readFileSync(path.join(site,f),'utf8')).join('\n');
              for(const viewport of [{width:390,height:844},{width:1440,height:960}]){
                const page=await browser.newPage({viewport,deviceScaleFactor:1});
                // Real release markup and CSS, isolated from globe and network startup.
                // Exercise the exact native slot insertion and inspector hidden transition.
                await page.route('**/*',route=>route.abort());
                await page.setContent(html.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi,'').replace(/<link\b[^>]*>/gi,''),{waitUntil:'domcontentloaded'});
                await page.addStyleTag({content:styles+'\n'+css});
                await page.evaluate(mode=>{
                  document.body.classList.add(mode==='public'?'bpv-home':'bpv-app');
                  // At building zoom the welcome scene is not an active modal.
                  // The isolated fixture does not run the welcome renderer, so
                  // explicitly represent that post-intro state here.
                  const gate=document.getElementById('bpWelcomeGateV1');
                  if(gate){gate.hidden=true;gate.style.setProperty('display','none','important');}
                },mode);
                await page.addScriptTag({content:overlay});
                const cardId=mode==='public'?'previewCard':'buildingPanel';
                await page.evaluate(({cardId,mode})=>{
                  const card=document.getElementById(cardId);
                  if(!card)throw Error('Missing original inspector '+cardId);
                  const dock=document.createElement('section');dock.id='bpv-dock';dock.className='bpv-dock bpv-mobile-v2';
                  dock.style.cssText='position:fixed;bottom:8px;height:320px;width:96%;overflow:hidden;z-index:1200';
                  const slot=document.createElement('div');slot.id='bpv-property-card-slot';
                  dock.appendChild(slot);document.body.appendChild(dock);
                  window.originalCard=card;window.originalNodes=[...card.children];window.originalDockHeight=dock.getBoundingClientRect().height;
                  const button=card.querySelector('button');window.originalListenerCalls=0;
                  button?.addEventListener('bp-test',()=>window.originalListenerCalls++);
                  window.originalButton=button;
                  slot.appendChild(card);
                },{cardId,mode});
                await page.waitForFunction(id=>document.getElementById(id).parentElement===document.body&&document.getElementById(id).classList.contains('bpv-independent-building-card'),cardId,{timeout:10000});
                const r=await page.evaluate(id=>{
                  const c=document.getElementById(id),d=document.getElementById('bpv-dock');c.hidden=false;
                  const rect=c.getBoundingClientRect(),style=getComputedStyle(c);
                  window.originalButton?.dispatchEvent(new Event('bp-test'));
                  return {outside:!d.contains(c),sameNode:c===window.originalCard,allChildren:window.originalNodes.every(n=>c.contains(n)),listener:window.originalListenerCalls===1,fixed:style.position==='fixed',visible:rect.width>0&&rect.height>0,withinViewport:rect.left>=0&&rect.right<=innerWidth+1&&rect.bottom<=innerHeight+1,aboveDock:Number(style.zIndex)>Number(getComputedStyle(d).zIndex),dockUnchanged:window.originalDockHeight===d.getBoundingClientRect().height};
                },cardId);
                console.log('BUILDING_CARD_LAYOUT',mode,viewport,JSON.stringify(r));assert(Object.values(r).every(Boolean));
                if(mode==='public'){
                  assert(await page.locator('#previewCard [data-preview-cap]').count()>=8);
                  await page.locator('#bpv-close-public-building').click();
                }else{
                  assert(await page.locator('#buildingPanel #closeBuilding').count()===1);
                  await page.evaluate(id=>document.getElementById(id).hidden=true,cardId);
                }
                assert(await page.evaluate(id=>document.getElementById(id).hidden&&getComputedStyle(document.getElementById(id)).display==='none',cardId));
                await page.evaluate(id=>{document.getElementById('bpv-property-card-slot').appendChild(document.getElementById(id));},cardId);
                await page.waitForFunction(id=>document.getElementById(id).parentElement===document.body,cardId);
                if(mode==='public')assert(await page.locator('#bpv-close-public-building').count()===1);
                await page.close();
              }
            }
            console.log('BUILDING_CARD_STANDALONE_LAYOUT_PASS');
          }finally{await browser.close();}
          JS
          node "$TEST/test.mjs"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-v5000-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wind-site
          include-hidden-files: true
      - name: Wait for artifact indexing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "bridgepoint-v5000-'"$GITHUB_RUN_ATTEMPT"'") | .id')
            if [ -n "$ID" ]; then sleep 15; exit 0; fi
            sleep 4
          done
          exit 1
      - name: Publish preserved site
        id: deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deploy-pages-extended.mjs
      - name: Verify live standalone building card and preserved globe
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/wind-site"
          for p in bridgepoint-wind-turbines-v1.js app/bridgepoint-wind-turbines-v1.js world-v2300-time-slider.js world-v2300-sensor-layers.js app/world-v2300-sensor-layers.js landing.js app.js bridgepoint-bottom-card-mobile-v2.js bridgepoint-aircraft-visuals-v2.js app/bridgepoint-aircraft-visuals-v2.js bridgepoint-view-v5917.js bridgepoint-volumetric-fields-v5978.js app/bridgepoint-volumetric-fields-v5978.js bridgepoint-global-wind-rf-v1.js app/bridgepoint-global-wind-rf-v1.js wind-rf-global-v1.json index.html app/index.html bridgepoint-neo-watch-v1.js bridgepoint-emrf-starlink-global-v2.js bridgepoint-emrf-spectrogram-v1.js world-v2300-water.js bridgepoint-drone-awareness-v1.js bridgepoint-vessel-awareness-v1.js bridgepoint-power-outages-v1.js bridgepoint-wildfire-realistic-mesh-v4.js world-v2300-seismic-layer-v1.js; do
            curl --retry 8 --retry-all-errors --retry-delay 4 --max-time 40 -fsSL -H 'Cache-Control: no-cache' "https://bridgepointintelligence.online/$p?wind=$GITHUB_SHA" -o "$RUNNER_TEMP/wind-live"
            cmp "$SITE/$p" "$RUNNER_TEMP/wind-live"
          done
          echo BRIDGEPOINT_INDEPENDENT_BUILDING_CARD_LIVE_PASS

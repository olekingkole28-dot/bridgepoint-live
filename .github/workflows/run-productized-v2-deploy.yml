name: Run Productized V2 Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-productized-v2-deploy.yml'

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy exact productized V2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-productized-v2.yml --ref main --repo olekingkole28-dot/bridgepoint-live

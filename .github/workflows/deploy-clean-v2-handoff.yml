name: Deploy BridgePoint Clean V2 Handoff

on:
  push:
    branches: [main]
    paths:
      - 'handoff/clean-v2/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy-clean-v2:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify private-source V2 handoff
        shell: bash
        run: |
          set -euo pipefail
          test -s handoff/clean-v2/manifest.json
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, tarfile
          root=Path('handoff/clean-v2')
          manifest=json.loads((root/'manifest.json').read_text())
          chunks=sorted(root.glob('chunk-*'))
          expected=int(manifest['chunk_count'])
          if len(chunks)!=expected:
              raise SystemExit(f'Expected {expected} chunks, found {len(chunks)}')
          encoded=b''.join(p.read_bytes() for p in chunks)
          archive=base64.b64decode(encoded, validate=True)
          actual=hashlib.sha256(archive).hexdigest()
          if actual != manifest['archive_sha256']:
              raise SystemExit(f'Handoff SHA mismatch: {actual} != {manifest["archive_sha256"]}')
          out=Path('/tmp/bridgepoint-v2-delta.tar.gz')
          out.write_bytes(archive)
          target=Path('/tmp/bridgepoint-v2-delta')
          target.mkdir(parents=True, exist_ok=True)
          with tarfile.open(out,'r:gz') as tf:
              for member in tf.getmembers():
                  resolved=(target/member.name).resolve()
                  if not str(resolved).startswith(str(target.resolve())):
                      raise SystemExit('Unsafe archive path')
              tf.extractall(target)
          required=['index.html','main.dart.js','flutter_bootstrap.js','manifest.json','bridgepoint-v2-release.json','bridgepoint-release.json','public-promotion-v682.json']
          missing=[p for p in required if not (target/p).is_file()]
          if missing: raise SystemExit('Handoff missing: '+', '.join(missing))
          print(json.dumps({'source_sha':manifest['source_sha'],'chunks':len(chunks),'archive_bytes':len(archive)},indent=2))
          PY

      - name: Assemble durable public site with Clean V2 app
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site && mkdir site
          git archive --format=tar origin/live-artifact | tar -xf - -C site
          test -s site/index.html
          test -d site/app/assets
          test -d site/app/canvaskit
          test -d site/app/icons
          cp -a /tmp/bridgepoint-v2-delta/. site/app/
          touch site/.nojekyll site/app/.nojekyll

          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          manifest=json.loads(Path('handoff/clean-v2/manifest.json').read_text())
          release=json.loads(Path('site/app/bridgepoint-v2-release.json').read_text())
          compat=json.loads(Path('site/app/bridgepoint-release.json').read_text())
          promotion=json.loads(Path('site/app/public-promotion-v682.json').read_text())
          if release.get('architecture')!='clean-v2': raise SystemExit('Clean V2 marker missing')
          if release.get('version')!=manifest.get('source_sha'): raise SystemExit('V2 release/source SHA mismatch')
          if compat.get('version')!=manifest.get('source_sha'): raise SystemExit('Compatibility release/source SHA mismatch')
          if promotion.get('compiled_source_sha')!=manifest.get('source_sha'): raise SystemExit('Promotion/source SHA mismatch')
          if promotion.get('source_repo_private') is not True: raise SystemExit('Private-source provenance missing')
          actual=hashlib.sha256(Path('site/app/main.dart.js').read_bytes()).hexdigest()
          if actual!=promotion.get('main_js_sha256'): raise SystemExit('Compiled JS digest mismatch')
          index=Path('site/app/index.html').read_text(encoding='utf-8',errors='ignore')
          if '<base href="/app/">' not in index: raise SystemExit('App base href is not /app/')
          if 'Install BridgePoint' not in index: raise SystemExit('Install BridgePoint marker missing')
          if 'bp-expansion-launcher' in index: raise SystemExit('Legacy expansion overlay leaked into Clean V2 host')
          if not Path('site/app/assets/assets/images/bridgepoint-intelligence-background-v1.webp').is_file(): raise SystemExit('Existing app assets were not preserved')
          if not Path('site/app/canvaskit/canvaskit.wasm').is_file(): raise SystemExit('Existing CanvasKit runtime was not preserved')
          print('Clean V2 public site contract verified for '+manifest['source_sha'])
          PY

      - name: Persist exact durable live-artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/final-live && mkdir /tmp/final-live
          cp -a site/. /tmp/final-live/
          cd /tmp/final-live
          git init -q
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m 'Publish BridgePoint Clean V2 durable app'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy Clean V2
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public Clean V2 app
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(python -c "import json;print(json.load(open('handoff/clean-v2/manifest.json'))['source_sha'])")"
          ORIGIN='https://bridgepointintelligence.online'
          for attempt in $(seq 1 24); do
            marker="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/bridgepoint-v2-release.json?verify=${EXPECTED}" 2>/dev/null || true)"
            app="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/?verify=${EXPECTED}" 2>/dev/null || true)"
            root="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/?verify=${EXPECTED}" 2>/dev/null || true)"
            if printf '%s' "$marker" | grep -q "$EXPECTED" && printf '%s' "$marker" | grep -q 'clean-v2' && printf '%s' "$app" | grep -q 'flutter_bootstrap.js' && [ "${#root}" -gt 200 ]; then
              echo "BridgePoint Clean V2 verified live at ${ORIGIN}/app/"
              exit 0
            fi
            sleep 10
          done
          echo 'Public Clean V2 marker did not converge.' >&2
          exit 1

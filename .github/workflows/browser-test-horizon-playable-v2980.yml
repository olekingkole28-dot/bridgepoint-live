name: Browser Test Horizon Playable v4340

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/horizon-playable/v2-entry.html'
      - 'app/horizon-playable/index.html'
      - 'app/horizon-playable/horizon-v2.js'
      - 'app/horizon-playable/horizon-v2.css'
      - 'app/horizon-playable/assets/characters/**'
      - 'scripts/browser-horizon-v2-live.mjs'
      - '.github/workflows/browser-test-horizon-playable-v2980.yml'

permissions:
  contents: read

concurrency:
  group: horizon-playable-v4340
  cancel-in-progress: true

jobs:
  match-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser driver
        run: npm install --no-save --no-audit --no-fund playwright-core@1.55.0
      - name: Static syntax and asset gates
        run: |
          set -euo pipefail
          node --check app/horizon-playable/horizon-v2.js
          test -s app/horizon-playable/v2-entry.html
          test -s app/horizon-playable/horizon-v2.css
          for f in female_31.glb male_32.glb police_male.glb swat_male.glb hazmat_suit_male.glb; do
            test -s "app/horizon-playable/assets/characters/mesh2motion/models/$f"
          done
          grep -Fq 'id="aimBtn"' app/horizon-playable/v2-entry.html
          grep -Fq 'id="shootBtn"' app/horizon-playable/v2-entry.html
          grep -Fq 'id="runBtn"' app/horizon-playable/v2-entry.html
          grep -Fq 'id="buildBtn"' app/horizon-playable/v2-entry.html
          grep -Fq 'id="killFeed"' app/horizon-playable/v2-entry.html
          grep -Fq 'id="killCam"' app/horizon-playable/v2-entry.html
          grep -Fq 'id="miniMap"' app/horizon-playable/v2-entry.html
          grep -Fq 'id="weaponBar"' app/horizon-playable/v2-entry.html
          grep -Fq 'id="backpackBar"' app/horizon-playable/v2-entry.html
          grep -Fq 'id="fireUtilityBtn"' app/horizon-playable/v2-entry.html
          grep -Fq 'id="wallLive"' app/horizon-playable/v2-entry.html
          grep -Fq 'id="activePlayers"' app/horizon-playable/v2-entry.html
          ! grep -Fq 'id="viewBtn"' app/horizon-playable/v2-entry.html
          grep -Fq "let cameraMode='first'" app/horizon-playable/horizon-v2.js
          grep -Fq "cameraMode='first';localStorage.setItem('horizon-camera-mode','first')" app/horizon-playable/horizon-v2.js
          grep -Fq 'id="crouchBtn"' app/horizon-playable/v2-entry.html
          grep -Fq 'id="jumpBtn"' app/horizon-playable/v2-entry.html
          grep -Fq 'id="contextBtn"' app/horizon-playable/v2-entry.html
          grep -Fq 'id="healthBar"' app/horizon-playable/v2-entry.html
          grep -Fq 'id="shieldBar"' app/horizon-playable/v2-entry.html
          grep -Fq '(now-pickupStarted)/3000' app/horizon-playable/horizon-v2.js
          grep -Fq 'bridgepoint_horizon_year_one_checkpoint_v4337' app/horizon-playable/horizon-v2.js
          grep -Fq 'build:4340' app/horizon-playable/horizon-v2.js
          grep -Fq 'bridgepoint_horizon_year_one_zone_v4340' app/horizon-playable/horizon-v2.js
          grep -Fq 'bridgepoint_horizon_weapon_catalog_v4340' app/horizon-playable/horizon-v2.js
          grep -Fq 'bridgepoint_horizon_death_drop_claim_v4340' app/horizon-playable/horizon-v2.js
          grep -Fq 'bridgepoint_horizon_record_player_kill_v4340' app/horizon-playable/horizon-v2.js
          grep -Fq 'syncFiniteLoot' app/horizon-playable/horizon-v2.js
          grep -Fq 'inventoryWeaponKeys' app/horizon-playable/horizon-v2.js
          grep -Fq 'function buildCampfire' app/horizon-playable/horizon-v2.js
          grep -Fq 'const target=100' app/horizon-playable/horizon-v2.js
          ! grep -Fq 'id="useBtn"' app/horizon-playable/v2-entry.html
          ! grep -Fq 'id="lightBtn"' app/horizon-playable/v2-entry.html
          ! grep -Fq 'id="weatherBtn"' app/horizon-playable/v2-entry.html
      - name: Start checked-out Horizon server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/horizon-http.log 2>&1 &
          echo $! >/tmp/horizon-http.pid
          sleep 1
          curl --fail --silent http://127.0.0.1:4173/app/horizon-playable/v2-entry.html >/dev/null
      - name: Verify FPS-only Android match client
        env:
          HORIZON_TEST_BASE: http://127.0.0.1:4173
        run: node scripts/browser-horizon-v2-live.mjs

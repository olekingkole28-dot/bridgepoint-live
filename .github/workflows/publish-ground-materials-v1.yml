           }
           async function init(){if(loading||dead)return;loading=true;try{T=await import(TURL);if(dead)return;install();schedule();}catch(e){d.error=String(e);d.status='error'}finally{loading=false}}
           function before(){return ['gta-road-major-shadow','gta-road-major','gta-context-building-footprints','gta-water-label'].find(id=>map.getLayer(id))}
           function install(){if(!map.getStyle()?.layers?.length)return;if(!map.hasImage('bp-ground-grass-texture-v1'))map.addImage('bp-ground-grass-texture-v1',makeGrassTexture(),{pixelRatio:2});

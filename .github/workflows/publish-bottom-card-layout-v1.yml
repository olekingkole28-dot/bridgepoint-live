# A workflow-only change retriggers the final snapshot merge without firing layer publishers.
name: Publish BridgePoint Compact Bottom Card Layout v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-bottom-card-layout-v1.yml'
      - 'rebuild-v5000/bridgepoint-bottom-card-compact-v1.css'
      - 'rebuild-v5000/index.html'
      - 'rebuild-v5000/app-index.html'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-v5000-bottom-card-layout-v1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Wait for a same-commit full-site build
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          sleep 8
          RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" --jq '.workflow_runs[] | select(.path == ".github/workflows/deploy-intelligence-rebuild-v5000.yml") | .id' | head -n 1 || true)"
          if [ -z "$RUN_ID" ]; then
            echo "No same-commit full-site build is registered; continuing with the current production snapshot."
            exit 0
          fi
          echo "Waiting for full-site build run $RUN_ID without cancelling either workflow."
          while true; do
            STATUS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.status')"
            CONCLUSION="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.conclusion // ""')"
            if [ "$STATUS" = "completed" ]; then
              echo "FULL_SITE_BUILD_FINISHED run=$RUN_ID conclusion=$CONCLUSION"
              exit 0
            fi
            sleep 15
          done

      - name: Resolve the latest successful production Pages snapshot
        id: baseline
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=success&branch=main&per_page=100" --jq '.workflow_runs | map(select(.conclusion == "success")) | .[].id')"
          BASELINE_ID=""
          ARTIFACT=""
          for run_id in $RUNS; do
            candidate="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" --jq '.artifacts[]? | select((.expired|not) and (.name | startswith("bridgepoint-v5000-"))) | .name' | head -n 1 || true)"
            if [ -n "$candidate" ]; then
              BASELINE_ID="$run_id"
              ARTIFACT="$candidate"
              break
            fi
          done
          test -n "$BASELINE_ID"
          test -n "$ARTIFACT"
          echo "run_id=$BASELINE_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "PRODUCTION_BASELINE run=$BASELINE_ID artifact=$ARTIFACT"

      - name: Download the production snapshot
        uses: actions/download-artifact@v4
        with:
          name: "${{ steps.baseline.outputs.artifact_name }}"
          run-id: "${{ steps.baseline.outputs.run_id }}"
          repository: "${{ github.repository }}"
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          path: "${{ runner.temp }}/bp-pages-baseline"

      - name: Restore production and fingerprint every non-target file
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find "$RUNNER_TEMP/bp-pages-baseline" -type f -name artifact.tar -print -quit)"
          test -n "$ARCHIVE"
          SITE="$RUNNER_TEMP/bp-site"
          mkdir -p "$SITE"
          tar -xf "$ARCHIVE" -C "$SITE"
          test -s "$SITE/index.html"
          test -s "$SITE/app/index.html"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          site=Path(os.environ['RUNNER_TEMP'])/'bp-site'
          targets={'index.html','app/index.html','bridgepoint-bottom-card-compact-v1.css'}
          def digest(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return h.hexdigest()
          before={}
          target_before={}
          for path in sorted(site.rglob('*')):
              if not path.is_file(): continue
              rel=path.relative_to(site).as_posix()
              if rel in targets: target_before[rel]=digest(path)
              else: before[rel]=digest(path)
          if not {'index.html','app/index.html'} <= set(target_before):
              raise SystemExit('Production snapshot is missing a root or app entrypoint')
          tmp=Path(os.environ['RUNNER_TEMP'])
          (tmp/'bp-compact-card-preservation-before.json').write_text(json.dumps(before,sort_keys=True))
          (tmp/'bp-compact-card-target-before.json').write_text(json.dumps(target_before,sort_keys=True))
          print('NON_TARGET_PRODUCTION_FILES_FINGERPRINTED',len(before))
          PY

      - name: Overlay compact card stylesheet and root/app links
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/bp-site"
          cp rebuild-v5000/bridgepoint-bottom-card-compact-v1.css "$SITE/bridgepoint-bottom-card-compact-v1.css"
          python3 - <<'PY'
          import re,os
          from pathlib import Path
          site=Path(os.environ['RUNNER_TEMP'])/'bp-site'
          tag='<link rel="stylesheet" href="/bridgepoint-bottom-card-compact-v1.css?v=6515-compact-button-card">'
          for rel in ('index.html','app/index.html'):
              path=site/rel
              html=path.read_text(encoding='utf-8')
              html=re.sub(r'<link rel="stylesheet" href="/bridgepoint-bottom-card-compact-v1\.css[^"]*">','',html,flags=re.I)
              if not re.search(r'</head>',html,re.I):
                  raise SystemExit(rel+' has no closing head tag')
              html=re.sub(r'</head>',tag+'\n</head>',html,flags=re.I,count=1)
              path.write_text(html,encoding='utf-8')
          for rel in ('index.html','app/index.html'):
              html=(site/rel).read_text(encoding='utf-8')
              if html.count(tag)!=1:
                  raise SystemExit(rel+' must load the compact card stylesheet exactly once')
          source_tag=tag
          root_source=Path('rebuild-v5000/index.html').read_text(encoding='utf-8')
          app_source=Path('rebuild-v5000/app-index.html').read_text(encoding='utf-8')
          css=Path('rebuild-v5000/bridgepoint-bottom-card-compact-v1.css').read_text(encoding='utf-8')
          if source_tag not in root_source or source_tag not in app_source:
              raise SystemExit('Source root/app entrypoints are missing the compact card stylesheet')
          required=('#bpv-dock .bpv-command-heading','#bp-world-time-slider-v5908 .bpwt-filters','grid-template-columns:repeat(4')
          if not all(rule in css for rule in required):
              raise SystemExit('Compact card CSS is missing a required layout or wording rule')
          print('COMPACT_CARD_SOURCE_LINKS_AND_BUTTON_ONLY_LAYOUT_PASS')
          PY
      - name: Prove no non-target production files changed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          site=Path(os.environ['RUNNER_TEMP'])/'bp-site'
          tmp=Path(os.environ['RUNNER_TEMP'])
          before=json.loads((tmp/'bp-compact-card-preservation-before.json').read_text())
          target_before=json.loads((tmp/'bp-compact-card-target-before.json').read_text())
          targets={'index.html','app/index.html','bridgepoint-bottom-card-compact-v1.css'}
          def digest(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return h.hexdigest()
          after={}
          target_after={}
          for path in sorted(site.rglob('*')):
              if not path.is_file(): continue
              rel=path.relative_to(site).as_posix()
              if rel in targets: target_after[rel]=digest(path)
              else: after[rel]=digest(path)
          if before != after:
              raise SystemExit('UNRELATED_PRODUCTION_FILE_CHANGE '+json.dumps({
                  'missing':sorted(set(before)-set(after))[:20],
                  'added':sorted(set(after)-set(before))[:20],
                  'changed':sorted(k for k in before.keys() & after.keys() if before[k]!=after[k])[:20]
              }))
          if set(target_after) != targets:
              raise SystemExit('COMPACT_BOTTOM_CARD_LAYOUT_TARGET_PATHS_MISSING '+repr(sorted(targets-set(target_after))))
          print('NON_TARGET_PRODUCTION_FILES_BYTE_FOR_BYTE_PRESERVED',len(before))
          print('COMPACT_BOTTOM_CARD_LAYOUT_TARGET_FILES_PRESENT',len(target_after),'previous_target_files',len(target_before))
          PY

      - uses: actions/configure-pages@v5

      - name: Upload the preserved production site with Compact Bottom Card Layout
        uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-v5000-${{ github.run_attempt }}
          path: "${{ runner.temp }}/bp-site"
          include-hidden-files: true

      - name: Publish the preserved production snapshot
        id: deployment
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: node scripts/deploy-pages-extended.mjs

      - name: Verify compact bottom card layout is live on root and app routes
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://bridgepointintelligence.online'
          DIR="$RUNNER_TEMP/bp-compact-card-live"
          mkdir -p "$DIR"
          curl --retry 7 --retry-all-errors --retry-delay 3 --max-time 35 -fsSL -H 'Cache-Control: no-cache' "$ORIGIN/?verify=$GITHUB_SHA-compact-card" -o "$DIR/root.html"
          curl --retry 7 --retry-all-errors --retry-delay 3 --max-time 35 -fsSL -H 'Cache-Control: no-cache' "$ORIGIN/app/?verify=$GITHUB_SHA-compact-card" -o "$DIR/app.html"
          curl --retry 7 --retry-all-errors --retry-delay 3 --max-time 35 -fsSL -H 'Cache-Control: no-cache' "$ORIGIN/bridgepoint-bottom-card-compact-v1.css?verify=$GITHUB_SHA-compact-card" -o "$DIR/layout.css"
          cmp -s "$DIR/layout.css" rebuild-v5000/bridgepoint-bottom-card-compact-v1.css
          grep -Fq 'bridgepoint-bottom-card-compact-v1.css?v=6515-compact-button-card' "$DIR/root.html"
          grep -Fq 'bridgepoint-bottom-card-compact-v1.css?v=6515-compact-button-card' "$DIR/app.html"
          grep -Fq '#bpv-dock .bpv-command-heading' "$DIR/layout.css"
          grep -Fq '#bp-world-time-slider-v5908 .bpwt-filters' "$DIR/layout.css"
          echo 'BRIDGEPOINT_COMPACT_BOTTOM_CARD_LAYOUT_LIVE_ON_ROOT_AND_APP'

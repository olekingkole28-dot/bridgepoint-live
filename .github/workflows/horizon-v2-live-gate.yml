name: Horizon V4331 Source Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/horizon-v2-live-gate.yml'
      - 'scripts/browser-horizon-v2-live.mjs'
      - 'app/horizon-playable/v2-entry.html'
      - 'app/horizon-playable/index.html'
      - 'app/horizon-playable/horizon-v2.js'
      - 'app/horizon-playable/horizon-v2.css'
  workflow_dispatch:

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund playwright-core@1.55.0
      - name: Static checks
        run: |
          set -euo pipefail
          node --check app/horizon-playable/horizon-v2.js
          grep -Fq 'build:4331' app/horizon-playable/horizon-v2.js
          grep -Fq 'actualCharacterModel:true' app/horizon-playable/horizon-v2.js
          grep -Fq 'sourceBackedTwin:true' app/horizon-playable/horizon-v2.js
          grep -Fq 'exactFootprintCollision:true' app/horizon-playable/horizon-v2.js
          grep -Fq 'registerSolidPoly(pts)' app/horizon-playable/horizon-v2.js
          grep -Fq 'addParcels()' app/horizon-playable/horizon-v2.js
          grep -Fq 'addBuildingParts()' app/horizon-playable/horizon-v2.js
          grep -Fq 'solidCollision:true' app/horizon-playable/horizon-v2.js
          grep -Fq 'firstPerson:true' app/horizon-playable/horizon-v2.js
          grep -Fq 'proceduralInteriors:true' app/horizon-playable/horizon-v2.js
          grep -Fq 'roofTraversal:true' app/horizon-playable/horizon-v2.js
          grep -Fq 'drivableVehicles:true' app/horizon-playable/horizon-v2.js
          grep -Fq 'weaponInventory:true' app/horizon-playable/horizon-v2.js
          grep -Fq 'infectedPatrols:true' app/horizon-playable/horizon-v2.js
          grep -Fq 'adaptivePerformanceGovernor:true' app/horizon-playable/horizon-v2.js
          grep -Fq 'function updatePerformanceGovernor' app/horizon-playable/horizon-v2.js
          grep -Fq 'function perfCadence' app/horizon-playable/horizon-v2.js
          grep -Fq 'id="miniMap"' app/horizon-playable/v2-entry.html
          grep -Fq 'id="viewBtn"' app/horizon-playable/v2-entry.html
          grep -Fq 'id="contextBtn"' app/horizon-playable/v2-entry.html
          grep -Fq 'id="aimBtn"' app/horizon-playable/v2-entry.html
          grep -Fq 'id="buildBtn"' app/horizon-playable/v2-entry.html
      - name: Start local source server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/horizon-v4331-http.log 2>&1 &
          sleep 1
      - name: Browser source gate
        env:
          HORIZON_TEST_BASE: http://127.0.0.1:4173
        run: node scripts/browser-horizon-v2-live.mjs

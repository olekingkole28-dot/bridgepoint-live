name: Publish BridgePoint Sun Globe and Solar Activity V6265

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-welcome-space-v6257.yml'
      - 'recovery/apply_welcome_space_v6257.py'
      - 'tests/test_welcome_space_v6257.py'
      - 'rebuild-v5000/bridgepoint-welcome-space-v6257.js'
      - 'recovery/bridgepoint-welcome-space-v6260.js'
      - 'rebuild-v5000/index.html'
      - 'assets/moon/v1/**'
      - 'assets/sun/v1/**'
      - 'rebuild-v5000/bridgepoint-celestial-sky-v6257.js'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-welcome-space-v6265-solar-globe
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the isolated welcome scene and patch
        run: python3 -m unittest discover -s tests -p 'test_welcome_space_v6257.py' -v

      - name: Download the latest verified Moon and Earth Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: bridgepoint-welcome-space-v6257
          run-id: 42536183741
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: /tmp/bridgepoint-pages-bundle

      - name: Extract the production Pages baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          ARTIFACT_TAR="$(find /tmp/bridgepoint-pages-bundle -type f -name 'artifact.tar' -print -quit)"
          test -n "$ARTIFACT_TAR"
          tar -xf "$ARTIFACT_TAR" -C site
          for p in index.html app/index.html landing.js app.js sw.js manifest.webmanifest app/intelligence-launch/index.html app/intelligence-launch/manifest.webmanifest; do
            test -s "site/$p" || { echo "Missing production entry file: $p"; exit 1; }
          done

      - name: Snapshot deployed files before the isolated change
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('site')
          before={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          Path('/tmp/v6257-before.json').write_text(json.dumps(before,sort_keys=True))
          print('PRODUCTION_FILES_BEFORE',len(before))
          PY

      - name: Reuse and verify the already-published Moon terrain package
        shell: bash
        run: |
          set -euo pipefail
          test -s site/assets/moon/v1/manifest.json
          test -s site/assets/moon/v1/moon-global-height-16ppd-u16.png
          test -s site/assets/moon/v1/moon-global-height-4ppd-u16.png
          test -s site/assets/moon/v1/moon-apollo15-4deg-512ppd-height-u16.png
          test -s site/assets/moon/v1/moon-lroc-color-4k.webp
          test -s site/assets/moon/v1/moon-feature-labels.json
          test "$(find site/assets/moon/v1/sldem-128ppd -type f -name '*.png' | wc -l)" -eq 432
          python3 - <<'PY'
          import struct
          from pathlib import Path
          p=Path('site/assets/moon/v1/sldem-128ppd/moon-sldem-128ppd-y03-x18.png')
          h=p.read_bytes()[:29]
          assert h[:8] == bytes([137,80,78,71,13,10,26,10]), 'SLDEM tile is not PNG'
          assert struct.unpack('>II',h[16:24]) == (1280,1280), 'Unexpected SLDEM tile size'
          assert h[24] == 16, 'SLDEM tile must remain UInt16'
          print('Verified 1280x1280 UInt16 SLDEM2015 tile')
          PY
          echo 'Verified existing deployed Moon terrain: 432 local SLDEM2015 tiles plus global LOLA, Apollo 15 patch, LROC color and feature labels.'
          
      - name: Add the Earth, Moon and materialized Sun scene
        run: |
          cp recovery/bridgepoint-welcome-space-v6260.js site/bridgepoint-welcome-space-v6260.js
          cp rebuild-v5000/bridgepoint-celestial-sky-v6257.js site/bridgepoint-celestial-sky-v6257.js
          mkdir -p site/assets/moon site/assets/sun
          cp -a assets/moon/v1 site/assets/moon/v1
          cp -a assets/sun/v1 site/assets/sun/v1
          test -s site/assets/sun/v1/manifest.json
          test -s site/assets/sun/v1/sun-photosphere-v1.webp
          test -s site/assets/sun/v1/sun-coronal-activity-v1.webp
          test -s site/assets/sun/v1/sun-magnetic-field-v1.webp
          test -s site/assets/moon/v1/moon-global-height-16ppd-u16.png
          test -s site/assets/moon/v1/sldem-128ppd/moon-sldem-128ppd-y03-x18.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('site/assets/moon/v1/manifest.json')
          data=json.loads(p.read_text())
          data['globalHeightFallback']=data.get('globalHeight')
          data['globalHeight']={'file':'moon-global-height-16ppd-u16.png','width':5760,'height':2880,'samplesPerDegree':16,'encoding':'PNG grayscale 16-bit unsigned; elevationMeters = sample - 32768','source':'NASA LRO LOLA LDEM_16; source values are half-meters with +20000 unsigned offset'}
          data['globalHighResolutionHeight']={'source':'NASA LRO LOLA + SELENE SLDEM2015','resolutionPixelsPerDegree':128,'sampleSpacingMetersAtEquator':236.9011752,'coverageLatitudeDegrees':[-60,60],'tileSizeDegrees':10,'tileWidthPixels':1280,'tileHeightPixels':1280,'tilesAcross':36,'tilesDown':12,'filePattern':'sldem-128ppd/moon-sldem-128ppd-yNN-xNN.png','encoding':'PNG grayscale 16-bit unsigned; elevationMeters = sample - 32768'}
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY
          test -s site/assets/moon/v1/manifest.json
          test -s site/assets/moon/v1/moon-global-height-4ppd-u16.png
          test -s site/assets/moon/v1/moon-apollo15-4deg-512ppd-height-u16.png
          test -s site/assets/moon/v1/moon-lroc-color-4k.webp
          test -s site/assets/moon/v1/moon-feature-labels.json

      - name: Apply the launch-only entry patch
        run: python3 recovery/apply_welcome_space_v6257.py site

      - name: Validate module syntax and prove unrelated assets are unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          root=Path('site')
          html=(root/'index.html').read_text(encoding='utf-8')
          m=re.search(r'<script id="bpWelcomeGateScriptV1">([\s\S]*?)</script>',html)
          assert m, 'welcome gate script missing'
          Path('/tmp/bridgepoint-welcome-gate-v6257.js').write_text(m.group(1),encoding='utf-8')
          before=json.loads(Path('/tmp/v6257-before.json').read_text())
          after={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          removed=set(before)-set(after)
          added=set(after)-set(before)
          changed={p for p in before.keys() & after.keys() if before[p]!=after[p]}
          expected={
            'index.html','app/index.html','landing.js','app.js','sw.js','manifest.webmanifest',
            'app/intelligence-launch/index.html','app/intelligence-launch/manifest.webmanifest'
          }
          assert not removed, f'unexpected removed files: {sorted(removed)}'
          expected_added={
            'bridgepoint-welcome-space-v6260.js','bridgepoint-celestial-sky-v6257.js',
            'assets/moon/v1/manifest.json',
            'assets/moon/v1/moon-global-height-4ppd-u16.png',
            'assets/moon/v1/moon-global-height-16ppd-u16.png',
            'assets/moon/v1/moon-apollo15-4deg-512ppd-height-u16.png',
            'assets/moon/v1/moon-lroc-color-4k.webp',
            'assets/moon/v1/moon-feature-labels.json',
          }
          highres_prefix='assets/moon/v1/sldem-128ppd/'
          highres_tiles={p for p in added if p.startswith(highres_prefix) and p.endswith('.png')}
          assert len(highres_tiles)==432, f'expected exactly 432 local SLDEM tiles, found {len(highres_tiles)}'
          assert added==expected_added | highres_tiles, f'unexpected added files: {sorted(added ^ (expected_added | highres_tiles))}'
          assert changed==expected, f'unexpected production changes: {sorted(changed)}'
          print('PASS: eight entry/PWA files changed; two celestial modules, six base Moon assets and 432 local SLDEM tiles added; all unrelated globe/data/map/feature assets byte-identical.')
          PY
          node --check /tmp/bridgepoint-welcome-gate-v6257.js
          node --input-type=module --check < site/bridgepoint-welcome-space-v6260.js
          node --input-type=module --check < site/bridgepoint-celestial-sky-v6257.js
          grep -Fq 'bpWelcomeGateStylesV6257' site/index.html
          grep -Fq 'src="/bridgepoint-welcome-space-v6260.js?v=6265-solar-globe"' site/index.html
          grep -Fq 'data-mode="signup"' site/index.html
          grep -Fq 'data-mode="signin"' site/index.html
          grep -Fq 'new THREE.Raycaster()' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'logarithmicDepthBuffer: true' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'uPhotosphereMap' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'sun-photosphere-v1.webp' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'sun-coronal-activity-v1.webp' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'addCoronalLoop' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'function rotateSunSurface' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'function tiltSunCamera' site/bridgepoint-welcome-space-v6260.js
          test -s site/assets/sun/v1/sun-photosphere-v1.webp
          test -s site/assets/sun/v1/sun-coronal-activity-v1.webp
          test -s site/assets/sun/v1/sun-magnetic-field-v1.webp
                    grep -Fq 'MOON_PERIOD_DAYS = 27.321661' site/bridgepoint-welcome-space-v6260.js
          grep -Fq "runtimeMode: 'local-static-assets'" site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'externalRuntimeTerrainRequests: 0' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'moon-global-height-16ppd-u16.png' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'globalTerrainMeshResolution' site/bridgepoint-welcome-space-v6260.js
          ! grep -Fq 'function enterMoonExploration' site/bridgepoint-welcome-space-v6260.js
          ! grep -Fq 'scene.background=new THREE.Color(0x02040a)' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'moonPivot.visible=true;sunGroup.visible=true;stars.visible=true;haze.visible=true;' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'function moonSurfacePoint(lat, lon, elevationMeters = 0)' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'function refreshGlobalDetailPatch(centerLat, centerLon, force = false)' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'tiltMoonCamera(dy);' site/bridgepoint-welcome-space-v6260.js
          grep -Fq "if(viewState!=='moon')" site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'moon-apollo15-4deg-512ppd-height-u16.png' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'geometry.setIndex(new THREE.BufferAttribute(indices, 1))' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'geometry.setIndex(new THREE.BufferAttribute(indices.subarray(0, indexOffset), 1))' site/bridgepoint-welcome-space-v6260.js
          ! grep -Fq 'uTerrainMask' site/bridgepoint-welcome-space-v6260.js
          ! grep -Fq 'uGlobalDetailMask' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'uAllowDetailCutouts' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'geometry.computeVertexNormals()' site/bridgepoint-welcome-space-v6260.js
          ! grep -Fq 'float crater(' site/bridgepoint-welcome-space-v6260.js
          ! grep -Fq 'crater(p,' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'createMoonPatchMaterial()' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'uniforms: { ...moonMaterial.uniforms' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'vAlpha=color.a' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'THREE.MathUtils.smoothstep(edgeDistance, 0.0, 0.055)' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'function refreshHighResolutionCraterPatch(centerLat, centerLon, force = false)' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'geometry.computeVertexNormals()' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'uGlobalCutoutActive' site/bridgepoint-welcome-space-v6260.js
          ! grep -Fq 'float crater(' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'moonMaterial.uniforms.uCameraLocal.value.copy' site/bridgepoint-welcome-space-v6260.js
          ! grep -Fq 'trek.nasa.gov/tiles/Moon' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'function panMoonSurface(dx, dy)' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'moon-feature-labels.json' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'function refreshLabels(force = false)' site/bridgepoint-welcome-space-v6260.js
          ! grep -Fq 'data-space-ground' site/bridgepoint-welcome-space-v6260.js
          ! grep -Fq 'earthMesh' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'bridgepoint-celestial-sky-v6257.js?v=6257' site/app.js
          grep -Fq 'bridgepoint-celestial-sky-v6257.js?v=6257' site/landing.js
          grep -Fq 'const entryRoute=' site/sw.js
          grep -Fq 'event.persisted' site/index.html
          grep -Fq 'data-skyview' site/world-v2300-time-slider.js
          grep -Fq 'initBridgePointCelestialSky' site/bridgepoint-celestial-sky-v6257.js
          ! grep -Fq 'starCount=lowPower?4200:8200' site/index.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          name: bridgepoint-welcome-space-v6257
          path: site
          include-hidden-files: true

      - name: Publish isolated welcome space scene
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: bridgepoint-welcome-space-v6257

      - name: Verify website, module, app and installed-app routes on the live domain
        shell: bash
        run: |
          set -euo pipefail
          O='https://bridgepointintelligence.online'
          ok=0
          for i in $(seq 1 30); do
            q="${GITHUB_SHA}-${i}-$(date +%s)"
            curl --retry 2 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/?welcome-space-v6257=${q}" -o /tmp/live-root.html || true
            curl --retry 2 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/bridgepoint-welcome-space-v6260.js?verify=${q}" -o /tmp/live-space.js || true
            curl --retry 2 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/assets/sun/v1/manifest.json?verify=${q}" -o /tmp/live-sun-manifest.json || true
            curl --retry 2 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/assets/sun/v1/sun-photosphere-v1.webp?verify=${q}" -o /tmp/live-sun-photosphere.webp || true
            curl --retry 2 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/assets/sun/v1/sun-coronal-activity-v1.webp?verify=${q}" -o /tmp/live-sun-activity.webp || true
            curl --retry 2 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/assets/sun/v1/sun-magnetic-field-v1.webp?verify=${q}" -o /tmp/live-sun-magnetic.webp || true
            curl --retry 2 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/bridgepoint-celestial-sky-v6257.js?verify=${q}" -o /tmp/live-sky.js || true
            curl --retry 2 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/app.js?verify=${q}" -o /tmp/live-app.js || true
            curl --retry 2 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/landing.js?verify=${q}" -o /tmp/live-landing.js || true
            curl --retry 2 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/app/?welcome-space-v6257=${q}" -o /tmp/live-app.html || true
            curl --retry 2 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/app/intelligence-launch/?welcome-space-v6257=${q}" -o /tmp/live-legacy.html || true
            curl --retry 2 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/sw.js?verify=${q}" -o /tmp/live-sw.js || true
            if grep -Fq 'bpWelcomeGateStylesV6257' /tmp/live-root.html 2>/dev/null &&
               grep -Fq 'src="/bridgepoint-welcome-space-v6260.js?v=6265-solar-globe"' /tmp/live-root.html 2>/dev/null &&
               grep -Fq 'new THREE.Raycaster()' /tmp/live-space.js 2>/dev/null &&
               grep -Fq 'uPhotosphereMap' /tmp/live-space.js 2>/dev/null &&
               grep -Fq 'addCoronalLoop' /tmp/live-space.js 2>/dev/null &&
               grep -Fq 'function rotateSunSurface' /tmp/live-space.js 2>/dev/null &&
               grep -Fq 'function tiltSunCamera' /tmp/live-space.js 2>/dev/null &&
               test -s /tmp/live-sun-manifest.json && test -s /tmp/live-sun-photosphere.webp &&
               test -s /tmp/live-sun-activity.webp && test -s /tmp/live-sun-magnetic.webp &&
                              grep -Fq 'MOON_PERIOD_DAYS = 27.321661' /tmp/live-space.js 2>/dev/null &&
               ! grep -Fq 'earthMesh' /tmp/live-space.js 2>/dev/null &&
               grep -Fq 'function moonSurfacePoint' /tmp/live-space.js 2>/dev/null &&
               ! grep -Fq 'function enterMoonExploration' /tmp/live-space.js 2>/dev/null &&
               grep -Fq 'function refreshGlobalDetailPatch' /tmp/live-space.js 2>/dev/null &&
               grep -Fq 'tiltMoonCamera(dy)' /tmp/live-space.js 2>/dev/null &&
               ! grep -Fq 'uTerrainMask' /tmp/live-space.js 2>/dev/null &&
               ! grep -Fq 'uGlobalDetailMask' /tmp/live-space.js 2>/dev/null &&
               grep -Fq 'function refreshHighResolutionCraterPatch' /tmp/live-space.js 2>/dev/null &&
               grep -Fq 'uGlobalCutoutActive' /tmp/live-space.js 2>/dev/null &&
               ! grep -Fq 'float crater(' /tmp/live-space.js 2>/dev/null &&
               grep -Fq 'geometry.computeVertexNormals()' /tmp/live-space.js 2>/dev/null &&
               grep -Fq 'uGlobalCutoutActive' /tmp/live-space.js 2>/dev/null &&
               ! grep -Fq 'float crater(' /tmp/live-space.js 2>/dev/null &&
               grep -Fq 'createMoonPatchMaterial()' /tmp/live-space.js 2>/dev/null &&
               grep -Fq 'vAlpha=color.a' /tmp/live-space.js 2>/dev/null &&
               ! grep -Fq 'data-space-ground' /tmp/live-space.js 2>/dev/null &&
               grep -Fq 'initBridgePointCelestialSky' /tmp/live-sky.js 2>/dev/null &&
               grep -Fq 'bridgepoint-celestial-sky-v6257.js?v=6257' /tmp/live-app.js 2>/dev/null &&
               grep -Fq 'bridgepoint-celestial-sky-v6257.js?v=6257' /tmp/live-landing.js 2>/dev/null &&
               grep -Fq 'entryRoute=' /tmp/live-sw.js 2>/dev/null &&
               grep -Fq '/?return=' /tmp/live-app.html 2>/dev/null &&
               grep -Fq 'content="0;url=/"' /tmp/live-legacy.html 2>/dev/null &&
               grep -Fq "BRIDGEPOINT_LAUNCH_EXPERIENCE_BUILD='v6265-solar-globe'" /tmp/live-sw.js 2>/dev/null &&
               grep -Fq 'runtimeMode' /tmp/live-space.js 2>/dev/null &&
               grep -Fq 'externalRuntimeTerrainRequests: 0' /tmp/live-space.js 2>/dev/null &&
               ! grep -Fq 'trek.nasa.gov/tiles/Moon' /tmp/live-space.js 2>/dev/null &&
               grep -Fq 'function panMoonSurface(dx, dy)' /tmp/live-space.js 2>/dev/null &&
               grep -Fq 'moon-feature-labels.json' /tmp/live-space.js 2>/dev/null &&
               curl --retry 2 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/assets/moon/v1/manifest.json?verify=${q}" -o /tmp/live-moon-manifest.json &&
               curl --retry 2 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/assets/moon/v1/moon-feature-labels.json?verify=${q}" -o /tmp/live-moon-labels.json &&
               curl --retry 2 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/assets/moon/v1/moon-global-height-4ppd-u16.png?verify=${q}" -o /tmp/live-moon-global.png &&
               curl --retry 2 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/assets/moon/v1/moon-global-height-16ppd-u16.png?verify=${q}" -o /tmp/live-moon-global16.png &&
               curl --retry 2 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/assets/moon/v1/sldem-128ppd/moon-sldem-128ppd-y03-x18.png?verify=${q}" -o /tmp/live-moon-128ppd.png &&
               curl --retry 2 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/assets/moon/v1/moon-apollo15-4deg-512ppd-height-u16.png?verify=${q}" -o /tmp/live-moon-patch.png &&
               curl --retry 2 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/assets/moon/v1/moon-lroc-color-4k.webp?verify=${q}" -o /tmp/live-moon-color.webp &&
               test -s /tmp/live-moon-manifest.json && test -s /tmp/live-moon-global.png && test -s /tmp/live-moon-global16.png && test -s /tmp/live-moon-128ppd.png && test -s /tmp/live-moon-patch.png && test -s /tmp/live-moon-color.webp && test -s /tmp/live-moon-labels.json; then
              ok=1
              break
            fi
            sleep 3
          done
          test "$ok" -eq 1
          echo 'LIVE V6265 PASS: locally hosted SDO photosphere, AIA coronal activity and HMI magnetic maps; interactive Sun rotation, surface pinch zoom and two-finger oblique camera tilt; animated 3D coronal loops and flare arcs; Moon DEM crater terrain and existing Earth/world assets preserved.'

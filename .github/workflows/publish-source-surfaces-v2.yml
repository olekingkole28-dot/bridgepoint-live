name: BridgePoint connected street surfaces V3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-source-surfaces-v2.yml']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore and verify exact currently published baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/horizon-site"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false and (.name|startswith("bridgepoint-v5000-"))) | [.workflow_run.id,.name] | @tsv' > "$RUNNER_TEMP/candidates"
          cat "$RUNNER_TEMP/candidates"
          found=0
          while IFS=$'\t' read -r run name; do
            if [ "$run" = "$GITHUB_RUN_ID" ]; then continue; fi
            # A deployment can succeed even if its subsequent live smoke test fails.
            # Accept such a snapshot only when the deploy step succeeded AND every live file matches.
            conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.conclusion')"
            if [ "$conclusion" != success ]; then
              deployed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" --jq '[.jobs[].steps[] | select(.conclusion=="success" and (.name|test("^(Publish the preserved production snapshot|Publish validated|Publish the close-zoom|Deploy to GitHub Pages)")))] | length')"
              if [ "$deployed" = 0 ]; then continue; fi
            fi
            rm -rf "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/horizon-site"
            mkdir -p "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/horizon-site"
            if ! timeout 240s gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "$RUNNER_TEMP/baseline"; then continue; fi
            if ! test -s "$RUNNER_TEMP/baseline/artifact.tar"; then continue; fi
            tar -xf "$RUNNER_TEMP/baseline/artifact.tar" -C "$RUNNER_TEMP/horizon-site"
            same=1
            for p in index.html app/index.html landing.js app.js world-v2300-map.js app/world-v2300-map.js world-v2300-water.js app/world-v2300-water.js bridgepoint-bottom-card-mobile-v2.js bridgepoint-bottom-card-categories-v1.js vendor/bp-nyc-bus-v1.mjs vendor/bp-bus-models-v3.mjs vendor/bp-street-detail-v1.mjs vendor/bp-traffic-furniture-v1.mjs vendor/bp-traffic-overture-v3.mjs assets/street-detail-v1/retro-traffic-signals.glb.gz assets/street-detail-v1/manifest.json assets/street-detail-v1/busshelter.glb.gz world-v2300-tree-instanced.js app/world-v2300-tree-instanced.js vendor/bp-viewport-forest-v5.mjs bridgepoint-app-space-explorer-v1.js; do
              if ! curl --retry 2 --retry-all-errors --max-time 35 -fsSL -H 'Cache-Control: no-cache' "https://bridgepointintelligence.online/$p?baseline=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/current" || ! cmp -s "$RUNNER_TEMP/horizon-site/$p" "$RUNNER_TEMP/current"; then echo "Baseline mismatch $run $p"; same=0; break; fi
            done
            if [ "$same" = 1 ]; then echo "Verified live baseline $run $name"; found=1; break; fi
          done < <( { head -15 "$RUNNER_TEMP/candidates"; grep -E "^45911069876[[:space:]]" "$RUNNER_TEMP/candidates" || true; } | awk '!seen[$0]++' )
          test "$found" = 1 || { echo 'No exact current release found; refusing rollback'; exit 1; }
      - name: Install connected road, curb and sidewalk surfaces V3
        run: |
          set -euo pipefail
          export SITE="$RUNNER_TEMP/horizon-site" BP_TEST="$RUNNER_TEMP/street-browser-test"
          mkdir -p "$BP_TEST" "$SITE/assets/street-detail-v1/surfaces-v2"
          npm install --prefix "$BP_TEST" playwright esbuild polygon-clipping@0.15.7 earcut@3.0.2
          cp street-detail-v1/source-surfaces-v2.mjs "$BP_TEST/source-surfaces.mjs"
          "$BP_TEST/node_modules/.bin/esbuild" "$BP_TEST/source-surfaces.mjs" --bundle --format=esm --platform=browser --target=es2022 --external:/vendor/* --outfile="$BP_TEST/bp-source-surfaces-v2.mjs"
          python3 -m venv "$RUNNER_TEMP/surface-python"
          "$RUNNER_TEMP/surface-python/bin/python" -m pip install --disable-pip-version-check Pillow==11.3.0
          "$RUNNER_TEMP/surface-python/bin/python" - "$SITE" "$BP_TEST" <<'PY'
          import sys, re, json, struct, io, hashlib
          from pathlib import Path
          from PIL import Image, ImageOps
          site=Path(sys.argv[1]);test=Path(sys.argv[2]);out=site/'assets/street-detail-v1/surfaces-v2'
          def hashes():return {str(p.relative_to(site)):hashlib.sha256(p.read_bytes()).hexdigest() for p in site.rglob('*') if p.is_file()}
          before=hashes();allowed=set()
          src=Path('street-detail-v1/surface-source')
          def images(name,expected):
              raw=(src/name).read_bytes();assert hashlib.sha256(raw).hexdigest()==expected
              n=struct.unpack_from('<I',raw,12)[0];j=json.loads(raw[20:20+n]);b=raw[28+n:]
              assert 'CC-BY-4.0' in j['asset']['extras']['license']
              def read(i):
                  v=j['bufferViews'][j['images'][i]['bufferView']];a=v.get('byteOffset',0)
                  return Image.open(io.BytesIO(b[a:a+v['byteLength']])).convert('RGB')
              return read
          asphalt=images('asphalt_texture_3d_scan.glb','97a3c6ce38354dfdf68e0e4a41d7308271be491c24c68f005302e9a9f3617510')
          old=images('old_street_pack.glb','670606d70332127a56606a38b0ea90f135ca616fc0f94ef7b9611b7f573e6042')
          street=images('pack_de_ruas_lw3d_v2.glb','a8643d1f00a65a4b25af10da360cad86cb0b552bd293647d6e4d6ac57b41ff66')
          # The scanned asphalt image is a UV atlas; crop only a continuous stone patch.
          # Mirror repeat produces equal opposite edges and avoids black atlas gaps.
          def save(img,name):
              img=img.resize((128,128),Image.Resampling.LANCZOS)
              tile=Image.new('RGB',(256,256));tile.paste(img,(0,0));tile.paste(ImageOps.mirror(img),(128,0));tile.paste(ImageOps.flip(img),(0,128));tile.paste(ImageOps.flip(ImageOps.mirror(img)),(128,128))
              tile.save(out/name,optimize=True);allowed.add(str((out/name).relative_to(site)))
          save(asphalt(0).crop((64,64,576,576)),'asphalt.png')
          save(street(1),'concrete.png')
          save(old(0).crop((300,380,1800,1550)),'curb.png')
          save(old(1),'old-asphalt.png')
          (out/'credits.html').write_text('<!doctype html><meta charset="utf-8"><h1>BridgePoint surface material credits</h1><p><a href="https://sketchfab.com/3d-models/asphalt-texture-3d-scan-ee52f7306e58449d9ec750d1b8b980f2">Asphalt Texture 3D scan</a> by grafi; <a href="https://sketchfab.com/3d-models/old-street-pack-a633537bfc7c4d99a3a618662513cbf9">Old Street Pack</a> by iagoArt3D; <a href="https://sketchfab.com/3d-models/pack-de-ruas-lw3d-v2-352e537b6cec45f4b5e7ff1580eeca5d">Pack de Ruas LW3D v2</a> by lael.eugenio. All <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>. Textures adapted by cropping and seamless repetition. Road footprints are derived from mapped centerlines and widths, not surveyed curb polygons.</p>')
          allowed.add(str((out/'credits.html').relative_to(site)))
          for rel,source in [('vendor/bp-source-surfaces-v2.mjs',test/'bp-source-surfaces-v2.mjs'),('vendor/bp-traffic-furniture-v1.mjs',Path('street-detail-v1/traffic-furniture.mjs'))]:
              (site/rel).write_bytes(source.read_bytes());allowed.add(rel)
          for rel in ('world-v2300-map.js','app/world-v2300-map.js'):
              p=site/rel;s=p.read_text()
              marker="map.once('load',ensureMapGestures);"
              if "let bpSourceSurfacesAttached=false;" not in s:
                  assert s.count(marker)==1
                  s=s.replace(marker,marker+"""
              let bpSourceSurfacesAttached=false;
              const bpAttachSourceSurfaces=()=>{if(bpSourceSurfacesAttached||map.getZoom()<13.2)return;bpSourceSurfacesAttached=true;import('/vendor/bp-source-surfaces-v2.mjs?v=20261127-connected-street-surfaces-v4').then(m=>m.attachSourceSurfaces(map)).then(()=>{const c=map.getContainer().querySelector('.maplibregl-ctrl-attrib-inner');if(c&&!c.querySelector('[href="/assets/street-detail-v1/surfaces-v2/credits.html"]')){const a=document.createElement('a');a.href='/assets/street-detail-v1/surfaces-v2/credits.html';a.textContent='Surface models';a.target='_blank';a.rel='noopener';c.append(' · ',a);}}).catch(e=>{bpSourceSurfacesAttached=false;console.warn('Surface assets',e);});};
              map.on('zoom',bpAttachSourceSurfaces);map.on('moveend',bpAttachSourceSurfaces);map.once('load',bpAttachSourceSurfaces);
              """)
              else:
                  assert s.count("let bpSourceSurfacesAttached=false;")==1
              s,n=re.subn(r"(/vendor/bp-source-surfaces-v2\.mjs\?v=)[^'\"\s]+",r"\g<1>20261127-connected-street-surfaces-v4",s)
              assert n==1, f"{rel}: expected one source-surface module URL, got {n}"
              s=s.replace('/vendor/bp-traffic-furniture-v1.mjs?v=20261126-traffic-v3','/vendor/bp-traffic-furniture-v1.mjs?v=20261126-surface-alignment-v2')
              guard_start=s.index('function keepSatelliteRasterLayersVisible(')
              guard_end=s.index('function restoreSatelliteRasterStack',guard_start)
              guard=s[guard_start:guard_end]
              if 'const surfaceZoom=map.getZoom()' not in guard:
                  anchor='const underwaterDiveActive=isUnderwaterDiveActive();'
                  assert guard.count(anchor)==1, f'{rel}: underwater state anchor count {guard.count(anchor)}'
                  inject="const surfaceZoom=map.getZoom(),closeZoomSurfaces=!underwaterDiveActive&&!blenderWorldEnabled&&surfaceZoom>=15.8&&!!map.getSource('ofm');\n   base=closeZoomSurfaces?'surface':'satellite';\n   window.__BP_CLOSE_ZOOM_SURFACE_MODE__={enabled:closeZoomSurfaces,zoom:surfaceZoom,ground:'mapped landcover and landuse with 3D road, sidewalk and grass meshes',updatedAt:Date.now()};"
                  guard=guard.replace(anchor,anchor+'\n   '+inject)
              if 'const surfaceLandcoverColor=' not in guard:
                  paint_anchor="let oceanFill='unavailable';"
                  assert guard.count(paint_anchor)==1, f'{rel}: surface paint anchor count {guard.count(paint_anchor)}'
                  paint="const savedSurfacePaint=window.__BP_CLOSE_ZOOM_SURFACE_PAINTS__;\n   if(!savedSurfacePaint||savedSurfacePaint.map!==map)window.__BP_CLOSE_ZOOM_SURFACE_PAINTS__={map,landcoverColor:map.getPaintProperty('gta-landcover','fill-color'),landuseColor:map.getPaintProperty('gta-landuse','fill-color'),waterColor:map.getPaintProperty('gta-water','fill-color'),waterOpacity:map.getPaintProperty('gta-water','fill-opacity')};\n   const surfacePaints=window.__BP_CLOSE_ZOOM_SURFACE_PAINTS__;\n   const setSurfacePaint=(id,prop,value)=>{try{if(map.getLayer(id)&&JSON.stringify(map.getPaintProperty(id,prop))!==JSON.stringify(value))map.setPaintProperty(id,prop,value)}catch(_){}};\n   const surfaceLandcoverColor=['match',['downcase',['to-string',['coalesce',['get','class'],'']]],['wood','forest'],'#365d3d',['grass','meadow'],'#79a953','farmland','#7d834b',['wetland','marsh'],'#477a77',['sand','beach'],'#c3af7f',['desert','dune'],'#b3945b',['bare_rock','rock','scree'],'#777b73',['ice','glacier','snow'],'#d9e4df',['scrub','heath'],'#66824a','#6c756b'];\n   const surfaceLanduseColor=['match',['downcase',['to-string',['coalesce',['get','class'],'']]],['park','recreation_ground'],'#648a53','grass','#7ca75b','cemetery','#617653','residential','#737a73','commercial','#83867f','retail','#8b887d','industrial','#7c807e','school','#778c62','hospital','#a99b8d','#717973'];\n   setSurfacePaint('gta-landcover','fill-color',closeZoomSurfaces?surfaceLandcoverColor:surfacePaints.landcoverColor);\n   setSurfacePaint('gta-landcover','fill-opacity',closeZoomSurfaces ? 0.98 : 0);\n   setSurfacePaint('gta-landuse','fill-color',closeZoomSurfaces?surfaceLanduseColor:surfacePaints.landuseColor);\n   setSurfacePaint('gta-landuse','fill-opacity',closeZoomSurfaces ? 0.62 : 0);\n   setSurfacePaint('gta-water','fill-color',closeZoomSurfaces?'#317486':surfacePaints.waterColor);\n   setSurfacePaint('gta-water','fill-opacity',closeZoomSurfaces ? 0.92 : surfacePaints.waterOpacity);\n   setSurfacePaint('gta-landcover-texture','fill-opacity',closeZoomSurfaces ? 0.38 : 0);\n   vis(map,'gta-landcover-texture',closeZoomSurfaces);\n   "
                  guard=guard.replace(paint_anchor,paint+'\n   let oceanFill=\'unavailable\';')
              effective_line="const effectiveVisibility=blenderWorldEnabled||closeZoomSurfaces?'none':'visible';"
              if effective_line not in guard:
                  previous_effective="const effectiveVisibility=targetVisibility;"
                  assert guard.count(previous_effective)==1, f'{rel}: previous raster visibility expression count {guard.count(previous_effective)}'
                  guard=guard.replace(previous_effective,effective_line,1)
              water_line="if(map.getPaintProperty('gta-water','fill-opacity')!==0)map.setPaintProperty('gta-water','fill-opacity',0);"
              if water_line in guard:
                  guard=guard.replace(water_line,"const surfaceWaterOpacity=closeZoomSurfaces?0.92:0;if(map.getPaintProperty('gta-water','fill-opacity')!==surfaceWaterOpacity)map.setPaintProperty('gta-water','fill-opacity',surfaceWaterOpacity);",1)
              assert "const surfaceWaterOpacity=closeZoomSurfaces?0.92:0;" in guard, f'{rel}: close-zoom water fill missing'
              if "oceanFill=surfaceWaterOpacity;" not in guard:
                  assert guard.count("oceanFill=0;")==1, f'{rel}: original water fill state count {guard.count("oceanFill=0;")}'
                  guard=guard.replace("oceanFill=0;","oceanFill=surfaceWaterOpacity;",1)
              s=s[:guard_start]+guard+s[guard_end:]
              terrain_old="vis(map,'gta-landcover-texture',base!=='satellite'&&z<19.5);"
              if terrain_old in s:
                  s=s.replace(terrain_old,"vis(map,'gta-landcover-texture',(base!=='satellite'||window.__BP_CLOSE_ZOOM_SURFACE_MODE__?.enabled===true)&&z<22);")
              p.write_text(s);allowed.add(rel)
          for rel in ('index.html','app/index.html','landing.js','app.js'):
              p=site/rel;s=p.read_text()
              n=re.sub(r'20261126-(?:traffic-v3|source-surfaces-v2|terrain-asphalt-retained-v6)', '20261127-connected-street-surfaces-v4', s)
              if s!=n:p.write_text(n);allowed.add(rel)
          after=hashes();changed={p for p in after if before.get(p)!=after[p]};assert before.keys()<=after.keys();assert changed<=allowed
          print('SOURCE_SURFACES_SCOPED_PASS',sorted(changed))
          PY
          node --check "$SITE/vendor/bp-source-surfaces-v2.mjs"
          node --check "$SITE/vendor/bp-traffic-furniture-v1.mjs"
          for f in world-v2300-map.js app/world-v2300-map.js; do node --input-type=module --check < "$SITE/$f"; done
          node --input-type=module <<'JS'
          import {pathToFileURL} from 'node:url';
          import assert from 'node:assert/strict';
          const {roadFootprints,contains}=await import(pathToFileURL(process.env.SITE+'/vendor/bp-source-surfaces-v2.mjs'));
          const f=(a,b,p)=>({geometry:{type:'LineString',coordinates:[a,b]},properties:p});
          const polys=roadFootprints([f([0,-.002],[0,.002],{class:'primary',width:14}),f([-.002,0],[.002,0],{class:'secondary',width:10}),f([.001,-.002],[.001,.002],{class:'path',width:4}),f([.0015,-.002],[.0015,.002],{class:'residential',surface:'gravel'})],[0,0],300);
          assert(contains([0,0],polys)&&contains([.00004,.0003],polys)&&!contains([.00012,.0003],polys)&&!contains([.001,.0005],polys)&&!contains([.0015,.0005],polys));console.log('CONNECTED_ROAD_MASK_AND_NONROAD_EXCLUSIONS_PASS');
          JS
      - name: Verify actual source surface rendering and traffic models
        run: |
          set -euo pipefail
          export SITE="$RUNNER_TEMP/horizon-site" BP_TEST="$RUNNER_TEMP/street-browser-test"
          "$BP_TEST/node_modules/.bin/playwright" install --with-deps chromium
          node street-detail-v1/verify-traffic-furniture.mjs
          python3 - <<'PY'
          from pathlib import Path
          s=Path('street-detail-v1/verify.mjs').read_text()
          a=s.index("try{const p=await browser.newPage")
          b=s.index("}finally{await browser.close()",a)
          s=s[:a]+"""try{
           const p=await browser.newPage({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
           p.on('pageerror',e=>console.log('STREET_PAGE_ERROR',e.message));
           await p.goto(origin+'/',{waitUntil:'domcontentloaded',timeout:90000});
           const world=()=>window.__BP_LANDING_WORLD__||window.__BP_V5000_WORLD||window.__bpLandingWorldV5420;
           await p.waitForFunction(()=>{const w=window.__BP_LANDING_WORLD__||window.__BP_V5000_WORLD||window.__bpLandingWorldV5420;return !!w?.map?.getCanvas?.()},null,{timeout:120000});
           await p.evaluate(()=>{const w=window.__BP_LANDING_WORLD__||window.__BP_V5000_WORLD||window.__bpLandingWorldV5420;w.map.jumpTo({center:[-73.98565,40.75843],zoom:17.3,pitch:36,bearing:0});});
           const diag=()=>p.evaluate(()=>{const w=window.__BP_LANDING_WORLD__||window.__BP_V5000_WORLD||window.__bpLandingWorldV5420,m=w?.map,d=window.__BP_SOURCE_SURFACES_V2__,ids=m?.getStyle?.()?.layers?.map(l=>l.id)||[];return {zoom:m?.getZoom?.(),moving:m?.isMoving?.(),d,mesh:ids.indexOf('bp-source-road-mesh-v5'),center:ids.indexOf('gta-road-center-gold-bp'),crosswalk:ids.indexOf('gta-crosswalk-v2300')}});
           await p.waitForFunction(()=>window.__BP_SOURCE_SURFACES_V2__?.assets?.length===4,null,{timeout:120000});
           await p.waitForFunction(()=>{const w=window.__BP_LANDING_WORLD__||window.__BP_V5000_WORLD||window.__bpLandingWorldV5420,m=w?.map,d=window.__BP_SOURCE_SURFACES_V2__,ids=m?.getStyle?.()?.layers?.map(l=>l.id)||[];let visible=0;try{visible=m.queryRenderedFeatures({layers:['bp-source-road-edge-v3','bp-source-road-center-v3','bp-source-local-center-v3']}).length}catch(_){}const surface=window.__BP_CLOSE_ZOOM_SURFACE_MODE__,rasters=['gta-foundation','gta-nasa','gta-esri','gta-usgs','gta-oam'];return !!m&&!m.isMoving()&&d?.meshGrounded&&d.meshDrawCalls>0&&d.meshRenderedTriangles>0&&d.markingsAboveMesh&&surface?.enabled&&rasters.every(id=>!m.getLayer(id)||m.getLayoutProperty(id,'visibility')==='none')&&m.getPaintProperty('gta-landcover','fill-opacity')>.9&&['bp-source-road-edge-v3','bp-source-road-center-v3','bp-source-local-center-v3','bp-source-crosswalk-v3'].every(id=>!!m.getLayer(id))&&visible>0},null,{timeout:180000}).catch(async e=>{console.log('STREET_MESH_ORDER_DIAGNOSTICS',await diag());throw e;});
           const state=await p.evaluate(()=>{const w=window.__BP_LANDING_WORLD__||window.__BP_V5000_WORLD||window.__bpLandingWorldV5420,m=w.map,d=window.__BP_SOURCE_SURFACES_V2__;return {d,mesh:!!m.getLayer('bp-source-road-mesh-v5'),surface:window.__BP_CLOSE_ZOOM_SURFACE_MODE__||null,rasters:['gta-foundation','gta-nasa','gta-esri','gta-usgs','gta-oam'].map(id=>m.getLayer(id)?m.getLayoutProperty(id,'visibility'):'missing'),landcoverOpacity:m.getPaintProperty('gta-landcover','fill-opacity'),lines:['bp-source-road-edge-v3','bp-source-road-center-v3','bp-source-local-center-v3','bp-source-crosswalk-v3'].map(id=>!!m.getLayer(id)),visible:m.queryRenderedFeatures({layers:['bp-source-road-edge-v3','bp-source-road-center-v3','bp-source-local-center-v3']}).length}});assert(state.d.assets.length===4&&state.mesh&&state.lines.every(Boolean)&&state.visible>0&&state.d.markingsAboveMesh&&state.surface?.enabled&&state.rasters.every(x=>x==='none'||x==='missing')&&state.landcoverOpacity>.9);
           await p.evaluate(()=>{const w=window.__BP_LANDING_WORLD__||window.__BP_V5000_WORLD||window.__bpLandingWorldV5420;w.map.jumpTo({zoom:20,bearing:45});});
           await p.waitForFunction(()=>{const w=window.__BP_LANDING_WORLD__||window.__BP_V5000_WORLD||window.__bpLandingWorldV5420,m=w?.map,d=window.__BP_SOURCE_SURFACES_V2__;return !!m&&!m.isMoving()&&m.getZoom()>19.9&&d?.meshDrawCalls>0&&d.markingsAboveMesh&&window.__BP_CLOSE_ZOOM_SURFACE_MODE__?.enabled&&m.getLayoutProperty('gta-esri','visibility')==='none'},null,{timeout:30000});
           console.log('REAL_STREET_MESH_MARKINGS_PASS',state);
           await p.close();
          """+s[b:]
          Path('street-detail-v1/verify-surfaces-generated.mjs').write_text(s)
          PY
          node street-detail-v1/verify-surfaces-generated.mjs
      - name: Verify real homepage camera and touch navigation
        run: |
          set -euo pipefail
          export SITE="$RUNNER_TEMP/horizon-site" BP_TEST="$RUNNER_TEMP/street-browser-test"
          mkdir -p "$BP_TEST"
          python3 - <<'PY'
          from pathlib import Path

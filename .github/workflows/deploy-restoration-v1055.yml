name: Deploy BridgePoint Restoration V1055

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-restoration-v1055.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble exact V1055 live artifact
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site && mkdir site
          git archive --format=tar origin/live-artifact | tar -xf - -C site
          test -s site/app/index.html
          for f in visual-system-v1055.js preapp-deeptech-v1055.js presignup-onboarding-v1055.js owner-everything-v1055.js quick-tools-v1055.js single-shell-v1055.js entitlement-ux-v1055.js trial-access-v1055.js trial-shell-compat-v1055.js runtime-self-heal-v1055.js; do
            test -s "site/app/$f"
            node --check "site/app/$f"
          done
          node --check site/app/work-hub-v1054.js
          node --check site/app/app-more-v1054.js
          node --check site/app/owner-home-v1054.js
          node --check site/app/property-360-v1046.js
          node --check site/app/customer-surfaces-v1042.js
          node --check site/app/plans-primary-v1042.js
          python -m py_compile site/app/downloads/bridgepoint_local_node_v1055.py
          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw 'site/app/downloads/install_bridgepoint_local_node_v1055.ps1')) | Out-Null"
          test -s site/app/downloads/BRIDGEPOINT_LOCAL_NODE_V1055.txt

          grep -q 'data-bridgepoint-runtime="v1055"' site/app/index.html
          grep -q 'preapp-deeptech-v1055.js?v=1055' site/app/index.html
          grep -q 'presignup-onboarding-v1055.js?v=1055' site/app/index.html
          grep -q 'owner-everything-v1055.js?v=1055' site/app/index.html
          grep -q 'single-shell-v1055.js?v=1055' site/app/index.html
          grep -q 'entitlement-ux-v1055.js?v=1055' site/app/index.html
          grep -q 'trial-access-v1055.js?v=1055' site/app/index.html
          grep -q 'runtime-self-heal-v1055.js?v=1055' site/app/index.html
          ! grep -q 'single-shell-v1054.js' site/app/index.html
          ! grep -q 'flutter_bootstrap.js' site/app/index.html
          grep -q '>Plans<' site/app/single-shell-v1055.js
          grep -q 'bp1055-more-button' site/app/single-shell-v1055.js
          grep -q 'bridgepoint_claims_workspace_v833' site/app/work-hub-v1054.js
          grep -q 'bridgepoint_flutter_properties_v725' site/app/customer-surfaces-v1042.js
          grep -q 'bridgepoint-checkout-v67' site/app/plans-primary-v1042.js
          grep -q 'bridgepoint_public_package_fit_v1055' site/app/presignup-onboarding-v1055.js
          grep -q 'bridgepoint_trial_access_v1055' site/app/trial-access-v1055.js
          grep -q 'bridgepoint_owner_completion_items_v1055' site/app/owner-everything-v1055.js
          grep -q 'bridgepoint_owner_request_us_portable_export_v1055' site/app/owner-everything-v1055.js
          grep -q 'portable_export_authority' site/app/downloads/bridgepoint_local_node_v1055.py
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' site/app/*.js site/app/index.html
          touch site/.nojekyll site/app/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy V1055
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public V1055 restoration
        shell: bash
        run: |
          set -euo pipefail
          origin='https://bridgepointintelligence.online'
          project='https://xdfsjztwgsbmabshzsjw.supabase.co'
          key='sb_publishable_lM9oWQeHjBmgOIiteeOicQ_PTyAeF25'
          fit='{"p_answers":{"audience":"homeowner","property_focus":"one home","goal":"understand my property","team_scale":"one person","territory":"one property","integration":"bridgepoint app","capabilities":["monitoring"]}}'
          for attempt in $(seq 1 45); do
            salt="${GITHUB_SHA}-${attempt}-$(date +%s)"
            app="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache, no-store' "${origin}/app/?bpv=1055&verify=${salt}" 2>/dev/null || true)"
            shell="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache, no-store' "${origin}/app/single-shell-v1055.js?verify=${salt}" 2>/dev/null || true)"
            deep="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache, no-store' "${origin}/app/preapp-deeptech-v1055.js?verify=${salt}" 2>/dev/null || true)"
            onboard="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache, no-store' "${origin}/app/presignup-onboarding-v1055.js?verify=${salt}" 2>/dev/null || true)"
            owner="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache, no-store' "${origin}/app/owner-everything-v1055.js?verify=${salt}" 2>/dev/null || true)"
            trial="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache, no-store' "${origin}/app/trial-access-v1055.js?verify=${salt}" 2>/dev/null || true)"
            agent="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache, no-store' "${origin}/app/downloads/bridgepoint_local_node_v1055.py?verify=${salt}" 2>/dev/null || true)"
            installer="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache, no-store' "${origin}/app/downloads/install_bridgepoint_local_node_v1055.ps1?verify=${salt}" 2>/dev/null || true)"
            deepapi="$(curl -fsSL --max-time 20 -X POST "${project}/rest/v1/rpc/bridgepoint_public_deeptech_v534" -H "apikey: ${key}" -H "Authorization: Bearer ${key}" -H 'Content-Type: application/json' -d '{}' 2>/dev/null || true)"
            fitapi="$(curl -fsSL --max-time 20 -X POST "${project}/rest/v1/rpc/bridgepoint_public_package_fit_v1055" -H "apikey: ${key}" -H "Authorization: Bearer ${key}" -H 'Content-Type: application/json' -d "$fit" 2>/dev/null || true)"
            guide="$(curl -fsSL --max-time 20 -X POST "${project}/rest/v1/rpc/bridgepoint_public_ai_ask_v1055" -H "apikey: ${key}" -H "Authorization: Bearer ${key}" -H 'Content-Type: application/json' -d '{"p_message":"What can BridgePoint do with IoT and drones?"}' 2>/dev/null || true)"
            node_code="$(curl -sS -o /tmp/node1055.json -w '%{http_code}' --max-time 20 -X POST "${project}/functions/v1/bridgepoint-local-reasoning-v584" -H 'Content-Type: application/json' -d '{"action":"status","node_id":"00000000-0000-0000-0000-000000000000"}' 2>/dev/null || true)"
            if printf '%s' "$app" | grep -q 'data-bridgepoint-runtime="v1055"' \
              && printf '%s' "$app" | grep -q 'single-shell-v1055.js?v=1055' \
              && printf '%s' "$app" | grep -q 'owner-everything-v1055.js?v=1055' \
              && ! printf '%s' "$app" | grep -q 'flutter_bootstrap.js' \
              && printf '%s' "$shell" | grep -q '>Plans<' \
              && printf '%s' "$shell" | grep -q 'bp1055-more-button' \
              && printf '%s' "$deep" | grep -q 'THE BRIDGEPOINT INTELLIGENCE STACK' \
              && printf '%s' "$onboard" | grep -q 'STEP 2 OF 3' \
              && printf '%s' "$owner" | grep -q '1,080 Build List' \
              && printf '%s' "$owner" | grep -q 'Request full U.S. local export' \
              && printf '%s' "$trial" | grep -q '7-DAY FREE TRIAL COMPLETE' \
              && printf '%s' "$agent" | grep -q 'portable_export_authority' \
              && printf '%s' "$installer" | grep -q 'BridgePoint Local Node v' \
              && printf '%s' "$deepapi" | grep -q 'IOT_FUSION' \
              && printf '%s' "$deepapi" | grep -q 'DRONE_TO_CAD' \
              && printf '%s' "$fitapi" | grep -q 'fit_engine_version' \
              && printf '%s' "$guide" | grep -q 'PUBLIC_SAFE_COMPANY_BRAIN_PLUS_LIVE_PRODUCT_REGISTRIES' \
              && test "$node_code" = '401' \
              && grep -q 'UNAUTHORIZED_NODE' /tmp/node1055.json; then
              echo 'V1055 publicly verified: Plans primary tab, consolidated More, DeepTech/pre-app restoration, legal-first package-fit signup, true trial runtime, package gating, owner Everything, worker/build/global/export controls, protected local node downloads and runtime self-heal.'
              exit 0
            fi
            sleep 8
          done
          echo 'V1055 public verification did not converge.' >&2
          exit 1

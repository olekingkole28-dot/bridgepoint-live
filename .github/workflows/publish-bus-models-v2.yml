name: BridgePoint Bus Stops model and toggle V2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-bus-models-v2.yml']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore and verify exact currently published baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/horizon-site"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false and (.name|startswith("bridgepoint-v5000-"))) | [.workflow_run.id,.name] | @tsv' > "$RUNNER_TEMP/candidates"
          cat "$RUNNER_TEMP/candidates"
          found=0
          while IFS=$'\t' read -r run name; do
            if [ "$run" = "$GITHUB_RUN_ID" ]; then continue; fi
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.conclusion')" != success ]; then continue; fi
            rm -rf "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/horizon-site"
            mkdir -p "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/horizon-site"
            if ! timeout 240s gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "$RUNNER_TEMP/baseline"; then continue; fi
            if ! test -s "$RUNNER_TEMP/baseline/artifact.tar"; then continue; fi
            tar -xf "$RUNNER_TEMP/baseline/artifact.tar" -C "$RUNNER_TEMP/horizon-site"
            same=1
            for p in index.html app/index.html landing.js app.js world-v2300-map.js app/world-v2300-map.js world-v2300-water.js app/world-v2300-water.js bridgepoint-bottom-card-mobile-v2.js bridgepoint-bottom-card-categories-v1.js vendor/bp-nyc-bus-v1.mjs vendor/bp-street-detail-v1.mjs assets/street-detail-v1/manifest.json assets/street-detail-v1/busshelter.glb.gz; do
              if ! curl --retry 2 --retry-all-errors --max-time 35 -fsSL -H 'Cache-Control: no-cache' "https://bridgepointintelligence.online/$p?baseline=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/current" || ! cmp -s "$RUNNER_TEMP/horizon-site/$p" "$RUNNER_TEMP/current"; then same=0; break; fi
            done
            if [ "$same" = 1 ]; then echo "Verified live baseline $run $name"; found=1; break; fi
          done < <(head -15 "$RUNNER_TEMP/candidates")
          test "$found" = 1 || { echo 'No exact current release found; refusing rollback'; exit 1; }
      - name: Install Bus Stops toggle and source GLTF models
        run: |
          set -euo pipefail
          export SITE="$RUNNER_TEMP/horizon-site"
          python3 - "$SITE" <<'PY'
          import sys,re,json,gzip
          from pathlib import Path
          site=Path(sys.argv[1])
          def replace(s,a,b):
              assert s.count(a)==1, (a,s.count(a))
              return s.replace(a,b)
          assets=site/'assets/street-detail-v1'
          manifest=json.loads((assets/'manifest.json').read_text())
          pack=next(x for x in manifest['packs'] if x['id']=='busshelter')
          assert pack['published_file']=='busshelter.glb.gz' and len(pack['scenes'])>0
          with gzip.open(assets/'busshelter.glb.gz','rb') as f: assert f.read(4)==b'glTF'
          print('BUS_SOURCE_ASSET_VERIFIED',json.dumps(pack))
          # Keep other props unchanged; suppress only the NYC bus shelter instances in the generic renderer.
          street=site/'vendor/bp-street-detail-v1.mjs'
          s=street.read_text()
          s=replace(s,"['bpNYCBusShelters',null],","")
          s=replace(s,"if(kind==='busshelter'&&id!=='bpNYCBusShelters'&&map.getSource('bpNYCBusShelters')&&","if(kind==='busshelter'&&")
          s=s.replace("['bpNYCBusShelters','bpLivingWorld'","['bpLivingWorld'")
          street.write_text(s)
          # Reuse the validated GLTF renderer and its actual source mesh, with an independent bus-only budget.
          s=Path('street-detail-v1/street-detail.mjs').read_text()
          s=s.replace('bp-source-street-details-v1','bp-source-bus-models-v2').replace('attachStreetDetail','attachBusModels').replace('__BP_STREET_DETAIL_V1__','__BP_BUS_MODELS_V2__')
          s=replace(s,"const sources=[['bpLivingWorld',null],['ofm','poi'],['bp-global-streetlights-overture-source-v2','infrastructure']];","const sources=[['bpBusModelsV2',null]];")
          s=replace(s,"const mobile=matchMedia('(max-width: 700px)').matches||navigator.deviceMemory<=4,cap=mobile?24:64;","const mobile=matchMedia('(max-width: 700px)').matches||navigator.deviceMemory<=4,cap=mobile?48:96;")
          s=replace(s,"if(disposed)return;if(map.getZoom()<17.5)","if(disposed)return;if(!map.__bpNYCBusEnabled||map.getZoom()<17.5)")
          s=replace(s,"await paving();const candidates=points()","const candidates=points()")
          s=s.replace("if(disposed||run!==seq||map.getZoom()<17.5","if(disposed||!map.__bpNYCBusEnabled||run!==seq||map.getZoom()<17.5")
          s=replace(s,"if(!renderer||!scene||!groups.length||map.getZoom()<17.5","if(!map.__bpNYCBusEnabled||!renderer||!scene||!groups.length||map.getZoom()<17.5")
          s=replace(s,"['bpLivingWorld','ofm','bp-global-streetlights-overture-source-v2'].includes(e.sourceId)","e.sourceId==='bpBusModelsV2'")
          s=replace(s,"map.on('moveend',schedule);","map.on('bpbuschange',()=>{seq++;last='';if(!map.__bpNYCBusEnabled){clear();d.status='standby';}else schedule();});map.on('moveend',schedule);")
          (site/'vendor/bp-bus-models-v2.mjs').write_text(s)
          # Preserve the original icon drawing and popups. Replace only the fake extrusions and activation.
          p=site/'vendor/bp-nyc-bus-v1.mjs';s=p.read_text()
          s="import {attachBusModels} from '/vendor/bp-bus-models-v2.mjs';\n"+s
          s=replace(s,"if(map.__bpNYCBus)return;map.__bpNYCBus=true;","if(map.__bpNYCBus)return;map.__bpNYCBus=true;map.__bpNYCBusEnabled=false;attachBusModels(map);")
          s=replace(s,"if(!data||!map.getStyle()?.layers?.length)return;","if(!map.__bpNYCBusEnabled||!data||!map.getStyle()?.layers?.length)return;")
          start=s.index(' // Physical stop pole');end=s.index(' ready=true;',start)
          s=s[:start]+""" // Prefer surveyed shelter locations; unmatched GTFS stops get a clearly illustrative shelter model.
           const cells=new Map(),unit=.00015,cell=(x,y)=>Math.floor(x/unit)+':'+Math.floor(y/unit);
           for(const f of data[1].features){const [x,y]=f.geometry.coordinates,k=cell(x,y);if(!cells.has(k))cells.set(k,[]);cells.get(k).push([x,y]);}
           const seen=new Set(),models=[];
           for(const [i,fc] of [[1,data[1]],[0,data[0]]])for(const f of fc.features){
             const [x,y]=f.geometry.coordinates,k=x.toFixed(6)+':'+y.toFixed(6);if(seen.has(k))continue;
             if(i===0){let matched=false;for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)for(const q of cells.get((Math.floor(x/unit)+a)+':'+(Math.floor(y/unit)+b))||[]){if(Math.hypot((x-q[0])*111195*Math.cos(y*Math.PI/180),(y-q[1])*111195)<12)matched=true;}if(matched)continue;}
             seen.add(k);models.push({...f,properties:{...f.properties,class:'bus_shelter',shelter:true,model_representation:i?'mapped shelter, illustrative mesh':'illustrative shelter at mapped stop'}});
           }
           if(!map.getSource('bpBusModelsV2'))map.addSource('bpBusModelsV2',{type:'geojson',data:{type:'FeatureCollection',features:models},maxzoom:18});
           if(!map.getLayer('bpBusModelsV2-probe'))map.addLayer({id:'bpBusModelsV2-probe',type:'circle',source:'bpBusModelsV2',minzoom:17.5,paint:{'circle-opacity':0,'circle-radius':1}});
           map.fire('bpbuschange');
          """+s[end:]
          s=replace(s,"if(!near()||pending)return;","if(!map.__bpNYCBusEnabled||!near()||pending)return;")
          s=replace(s,"map.on('moveend',refresh);", """function sync(){const b=document.getElementById('bp-bus-stops-v2');if(b){b.setAttribute('aria-pressed',String(map.__bpNYCBusEnabled));b.classList.toggle('is-active',map.__bpNYCBusEnabled);b.style.boxShadow=map.__bpNYCBusEnabled?'inset 0 0 0 2px #41aaff':'';}}
           function toggle(){map.__bpNYCBusEnabled=!map.__bpNYCBusEnabled;sync();if(map.__bpNYCBusEnabled){refresh();return;}
             map.fire('bpbuschange');
             for(const id of [...ids.map(x=>x+'-icon'),'bpBusModelsV2-probe','bp-nyc-bus-poles'])if(map.getLayer(id))map.removeLayer(id);
             for(const id of [...ids,'bpBusModelsV2','bpNYCBusPoles'])if(map.getSource(id))map.removeSource(id);
             window.__BP_NYC_BUS_V1__={status:'disabled'};map.triggerRepaint();
           }
           function mount(){const slot=document.getElementById('bpv-dock-actions');if(!slot||document.getElementById('bp-bus-stops-v2'))return;
             const b=document.createElement('button');b.type='button';b.id='bp-bus-stops-v2';b.className='bpv-command-btn bpv-v2-tool-button';
             b.setAttribute('aria-label','Bus Stops');b.innerHTML='<span class="bpv-command-icon" aria-hidden="true" style="color:#41aaff">🚌</span><span class="bpv-command-label">Bus Stops</span>';
             b.addEventListener('click',e=>{e.stopPropagation();toggle()});slot.append(b);sync();
           }
           const observer=new MutationObserver(mount);observer.observe(document.documentElement,{childList:true,subtree:true});mount();map.on('remove',()=>observer.disconnect());
           map.on('moveend',refresh);""")
          p.write_text(s)
          for name,fn,arg,category in [('bridgepoint-bottom-card-mobile-v2.js','categorize','btn','global'),('bridgepoint-bottom-card-categories-v1.js','categoryFor','button','explore')]:
              p=site/name
              s=p.read_text();s=replace(s,f'function {fn}({arg})'+'{',f'function {fn}({arg})'+'{'+f"\n if({arg}.id==='bp-bus-stops-v2')return '{category}';")
              p.write_text(s)
          # Cache-bust both map and category scripts on the actual baseline entrypoints.
          for base in (site,site/'app'):
              p=base/'world-v2300-map.js';s=p.read_text()
              s=replace(s,"/vendor/bp-nyc-bus-v1.mjs'","/vendor/bp-nyc-bus-v1.mjs?v=bus2'")
              s=s.replace('/vendor/bp-street-detail-v1.mjs?v=nycbus1','/vendor/bp-street-detail-v1.mjs?v=bus2')
              p.write_text(s)
              for name in ('index.html','landing.js','app.js'):
                  p=base/name
                  if not p.exists():continue
                  s=p.read_text()
                  for file in ('world-v2300-map.js','bridgepoint-bottom-card-mobile-v2.js','bridgepoint-bottom-card-categories-v1.js'):
                      s=re.sub(re.escape(file)+r"(?:\?v=[^\s\"'<>]+)?(?=[\"'])",file+'?v=20261126-bus2',s)
                  p.write_text(s)
          print('BUS_V2_PATCH_PASS')
          PY
          node --input-type=module --check < "$SITE/vendor/bp-bus-models-v2.mjs"
          node --input-type=module --check < "$SITE/vendor/bp-nyc-bus-v1.mjs"
          node --input-type=module --check < "$SITE/vendor/bp-street-detail-v1.mjs"
          for f in world-v2300-map.js app/world-v2300-map.js; do node --input-type=module --check < "$SITE/$f"; done
      - name: Verify existing street renderer and globe startup
        run: |
          set -euo pipefail
          export SITE="$RUNNER_TEMP/horizon-site" BP_TEST="$RUNNER_TEMP/street-browser-test"
          mkdir -p "$BP_TEST"
          npm install --prefix "$BP_TEST" playwright
          "$BP_TEST/node_modules/.bin/playwright" install --with-deps chromium
          node street-detail-v1/verify.mjs
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path('street-detail-v1/verify.mjs')
          s=p.read_text()
          s=s.replace('<div id="map"></div>','<div id="map"></div><div id="bpv-dock-actions"></div>')
          s=s.replace("import * as T from", "import {attachNYCBusStops} from '/vendor/bp-nyc-bus-v1.mjs';\nimport * as T from")
          s=s.replace("const center=[-72.6502,41.56]","const center=[-73.9857,40.7484]")
          s=s.replace("map.once('load',()=>attachStreetDetail(map))","map.once('load',()=>attachNYCBusStops(map))")
          a=s.index("try{const p=await browser.newPage")
          b=s.index("}finally{await browser.close()",a)
          s=s[:a]+"""try{const p=await browser.newPage({viewport:{width:840,height:780}});await p.route('**/data/bp-nyc-bus-v1/*.geojson',async route=>{const isShelter=route.request().url().includes('shelters');await route.fulfill({json:{type:'FeatureCollection',features:isShelter?[]:[{type:'Feature',geometry:{type:'Point',coordinates:[-73.9857,40.7484]},properties:{class:'bus_stop',name:'Test stop'}}]}})});p.on('pageerror',e=>console.log('BUS_BROWSER_ERROR',e.message));await p.goto(origin+'/__street_fixture');const btn=p.locator('#bp-bus-stops-v2');await btn.waitFor();assert.equal(await btn.getAttribute('aria-pressed'),'false');assert.equal(await p.evaluate(()=>!!window.testMap.getSource('bpNYCBusStops')),false);await btn.evaluate(b=>b.click());await p.waitForFunction(()=>window.__BP_BUS_MODELS_V2__?.objects>=1&&window.__BP_BUS_MODELS_V2__?.drawCalls>0,null,{timeout:60000});assert.equal(await p.evaluate(()=>!!window.testMap.getLayer('bp-nyc-bus-poles')),false);assert.equal(await p.evaluate(()=>!!window.testMap.getLayer('bpNYCBusStops-icon')),true);await btn.evaluate(b=>b.click());await p.waitForFunction(()=>!window.testMap.getSource('bpNYCBusStops')&&window.__BP_BUS_MODELS_V2__?.objects===0);await btn.evaluate(b=>b.click());await p.waitForFunction(()=>window.__BP_BUS_MODELS_V2__?.objects>=1,null,{timeout:60000});console.log('BUS_TOGGLE_ACTUAL_GLTF_DRAW_PASS');await p.close();\n"""+s[b:]
          Path('street-detail-v1/verify-bus-generated.mjs').write_text(s)
          PY
          node street-detail-v1/verify-bus-generated.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-v5000-${{ github.run_attempt }}
          path: ${{ runner.temp }}/horizon-site
          include-hidden-files: true
      - name: Wait for Pages artifact indexing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "bridgepoint-v5000-'"$GITHUB_RUN_ATTEMPT"'") | .id')
            if [ -n "$ID" ]; then sleep 15; exit 0; fi
            sleep 4
          done
          exit 1
      - name: Publish validated NYC bus stops
        id: deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deploy-pages-extended.mjs
      - name: Verify deployed asset hashes and unchanged water
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/horizon-site"
          cd "$SITE"
          for p in data/bp-nyc-bus-v1/* assets/street-detail-v1/busshelter.glb.gz vendor/bp-bus-models-v2.mjs bridgepoint-bottom-card-mobile-v2.js bridgepoint-bottom-card-categories-v1.js vendor/bp-nyc-bus-v1.mjs vendor/bp-street-detail-v1.mjs world-v2300-map.js app/world-v2300-map.js world-v2300-tree-instanced.js app/world-v2300-tree-instanced.js world-v2300-water.js app/world-v2300-water.js index.html app/index.html; do
            for i in 1 2 3 4 5 6; do
              if curl --max-time 45 -fsSL -H 'Cache-Control: no-cache' "https://bridgepointintelligence.online/$p?street=$GITHUB_SHA-$i" -o "$RUNNER_TEMP/live" && cmp -s "$SITE/$p" "$RUNNER_TEMP/live"; then break; fi
              if [ "$i" = 6 ]; then echo "LIVE_MISMATCH $p"; exit 1; fi
              sleep 5
            done
          done
          echo BUS_MODELS_V2_LIVE_BYTES_PASS

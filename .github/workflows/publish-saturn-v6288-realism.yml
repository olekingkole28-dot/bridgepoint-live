name: Publish Mars v6291 MOLA 3D Terrain, Phobos, Deimos and HiRISE Detail with Saturn Preserved
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-saturn-v6288-realism.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: bridgepoint-pages-mars-v6291-mola-phobos-deimos
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Run Saturn and Mars regression tests
        run: |
          python3 -m unittest discover -s tests -p 'test_saturn_system_v6282.py' -v
          python3 -m unittest discover -s tests -p 'test_mars_system_v6291.py' -v
      - name: Download last successful production Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          run-id: 42723855778
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: /tmp/bridgepoint-v6288-pages
      - name: Extract production baseline without rebuilding planetary data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          ARCHIVE="$(find /tmp/bridgepoint-v6288-pages -type f -name 'artifact.tar' -print -quit)"
          test -n "$ARCHIVE"
          tar -xf "$ARCHIVE" -C site
          test -s site/index.html
          test -s site/assets/stellar/gaia-dr3-v6270/manifest.json
          test -s site/assets/saturn/v1/manifest.json
          test -s site/assets/offline/protomaps-world-z6.pmtiles
          echo "Reused last successful production artifact; no NASA or Gaia rebuild."
      - name: Install planetary asset build dependencies
        run: python3 -m pip install --disable-pip-version-check numpy rasterio pillow astropy
      - name: Build local NASA MOLA, Viking, PDS moon and Gale HiRISE assets
        run: python3 recovery/build_mars_assets_v6291.py --source-root /tmp/bridgepoint-mars-source --output-root site/assets/mars/v1
      - name: Overlay Mars and preserve the existing celestial systems
        shell: bash
        run: |
          set -euo pipefail
          cp recovery/bridgepoint-welcome-space-v6260.js site/bridgepoint-welcome-space-v6260.js
          cp rebuild-v5000/bridgepoint-gaia-galaxy-v6270.js site/bridgepoint-gaia-galaxy-v6270.js
          cp recovery/bridgepoint-saturn-system-v6282.js site/bridgepoint-saturn-system-v6282.js
          cp rebuild-v5000/bridgepoint-mars-system-v6291.js site/bridgepoint-mars-system-v6291.js
          python3 recovery/apply_welcome_space_v6257.py site
          node --input-type=module --check < site/bridgepoint-welcome-space-v6260.js
          node --input-type=module --check < site/bridgepoint-gaia-galaxy-v6270.js
          node --input-type=module --check < site/bridgepoint-saturn-system-v6282.js
          node --input-type=module --check < site/bridgepoint-mars-system-v6291.js
          python3 -m py_compile recovery/build_mars_assets_v6291.py
          grep -Fq 'src="/bridgepoint-welcome-space-v6260.js?v=6291-mars-orbit-geometry"' site/index.html
          grep -Fq 'bridgepoint-gaia-galaxy-v6270.js?v=6291-mars-orbit-geometry' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'bridgepoint-mars-system-v6291.js?v=6291-mars-orbit-geometry' site/bridgepoint-gaia-galaxy-v6270.js
          grep -Fq 'bridgepoint-saturn-system-v6282.js?v=6290-saturn-flowing-rings' site/bridgepoint-gaia-galaxy-v6270.js
          grep -Fq 'function updateRingDust(time)' site/bridgepoint-saturn-system-v6282.js
          grep -Fq 'stormMaskC' site/bridgepoint-saturn-system-v6282.js
          grep -Fq 'depthWrite:true' site/bridgepoint-saturn-system-v6282.js
          grep -Fq 'ringVisualThicknessKm=6400' site/bridgepoint-saturn-system-v6282.js
          grep -Fq 'warpedLatitude' site/bridgepoint-saturn-system-v6282.js
          grep -Fq 'totalEmissiveRadiance+=diffuseColor.rgb' site/bridgepoint-saturn-system-v6282.js
          grep -Fq 'function addRingHaze' site/bridgepoint-saturn-system-v6282.js
          grep -Fq 'const width=isMobile?4096:8192,height=8' site/bridgepoint-saturn-system-v6282.js
          grep -Fq 'function cleanDskSurface' site/bridgepoint-saturn-system-v6282.js
          grep -Fq 'Enceladus soft circular water-ice plume sprite particles' site/bridgepoint-saturn-system-v6282.js
          grep -Fq 'map:dustSprite,size:isMobile?1.05:1.4' site/bridgepoint-saturn-system-v6282.js
          test -s site/assets/saturn/v1/ephemerides.json
          test -s site/assets/saturn/v1/meshes/mimas-cassini-shape-v1.bin.gz
          test -s site/assets/saturn/v1/meshes/enceladus-cassini-shape-v1.bin.gz
          test -s site/assets/saturn/v1/height/titan-cassini-topography-4ppd-u16.bin.gz
          test -s site/assets/mars/v1/manifest.json
          test -s site/assets/mars/v1/height/mola-global-bpmh.bin.gz
          test -s site/assets/mars/v1/height/gale-hirise-dtm-bpmg.bin.gz
          test -s site/assets/mars/v1/textures/mars-viking-mdim-global.webp
          test -s site/assets/mars/v1/meshes/phobos-thomas-grid-v1.bin.gz
          test -s site/assets/mars/v1/meshes/deimos-thomas-grid-v1.bin.gz
          du -sb site
          echo "MARS_V6291_AND_SATURN_READY."
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload unique Mars v6291 Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-v6291
          path: site
          include-hidden-files: true
      - name: Verify uploaded artifact size
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Pages uses the compressed uploaded artifact size. The Actions
          # artifact list can lag finalization briefly, so retry until indexed.
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts"
          size=""
          for attempt in $(seq 1 15); do
            size="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api" | jq -r '([.artifacts[] | select(.name=="github-pages-v6291") | .size_in_bytes] | max) // empty')"
            if [[ "$size" =~ ^[0-9]+$ ]]; then break; fi
            sleep 2
          done
          test -n "$size"
          echo "Compressed Pages artifact bytes: $size"
          test "$size" -lt 1000000000
      - name: Publish Mars v6291 while preserving Saturn v6290
        id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-v6291
          timeout: '1800000'
      - name: Verify Mars v6291 and preserved Saturn served by the live site
        shell: bash
        run: |
          set -euo pipefail
          O='https://bridgepointintelligence.online'
          q="${GITHUB_SHA}-mars-v6291-live"
          curl --retry 8 --retry-all-errors --retry-delay 5 -fsSL -H 'Cache-Control: no-cache' "${O}/?v6289=${q}" -o /tmp/root.html
          curl --retry 8 --retry-all-errors --retry-delay 5 -fsSL -H 'Cache-Control: no-cache' "${O}/bridgepoint-welcome-space-v6260.js?verify=${q}" -o /tmp/bp-welcome.js
          curl --retry 8 --retry-all-errors --retry-delay 5 -fsSL -H 'Cache-Control: no-cache' "${O}/bridgepoint-gaia-galaxy-v6270.js?verify=${q}" -o /tmp/bp-gaia.js
          curl --retry 8 --retry-all-errors --retry-delay 5 -fsSL -H 'Cache-Control: no-cache' "${O}/bridgepoint-saturn-system-v6282.js?verify=${q}" -o /tmp/saturn.js
          curl --retry 8 --retry-all-errors --retry-delay 5 -fsSL -H 'Cache-Control: no-cache' "${O}/bridgepoint-mars-system-v6291.js?verify=${q}" -o /tmp/mars.js
          curl --retry 8 --retry-all-errors --retry-delay 5 -fsSL -H 'Cache-Control: no-cache' "${O}/assets/mars/v1/manifest.json?verify=${q}" -o /tmp/mars-manifest.json
          grep -Fq 'v=6291-mars-orbit-geometry' /tmp/root.html
          grep -Fq 'bridgepoint-gaia-galaxy-v6270.js?v=6291-mars-orbit-geometry' /tmp/bp-welcome.js
          grep -Fq 'bridgepoint-mars-system-v6291.js?v=6291-mars-orbit-geometry' /tmp/bp-gaia.js
          grep -Fq 'bridgepoint-saturn-system-v6282.js?v=6290-saturn-flowing-rings' /tmp/bp-gaia.js
          grep -Fq 'MOLA MEGDR globally displaced 3D terrain' /tmp/mars.js
          grep -Fq 'PDS Thomas irregular 3D shape model' /tmp/mars.js
          grep -Fq 'Gale Crater HiRISE 1.01 m/pixel local replacement terrain mesh' /tmp/mars.js
          grep -Fq 'const sampleCount=info.width*info.height,hasMask=!!(info.flags&1)' /tmp/mars.js
          grep -Fq 'nodeValid[a]&&nodeValid[b]&&nodeValid[c]' /tmp/mars.js
          jq -e '.body == "Mars" and .moons.phobos.mesh and .moons.deimos.mesh and .localized_terrain.gale' /tmp/mars-manifest.json >/dev/null
          grep -Fq 'function updateRingDust(time)' /tmp/saturn.js
          grep -Fq 'warpedLatitude' /tmp/saturn.js
          grep -Fq 'totalEmissiveRadiance+=diffuseColor.rgb' /tmp/saturn.js
          grep -Fq 'function addRingHaze' /tmp/saturn.js
          grep -Fq 'function cleanDskSurface' /tmp/saturn.js
          grep -Fq 'const width=isMobile?4096:8192,height=8' /tmp/saturn.js
          grep -Fq 'stormMaskC' /tmp/saturn.js
          grep -Fq 'Enceladus soft circular water-ice plume sprite particles' /tmp/saturn.js
          grep -Fq 'map:dustSprite,size:isMobile?1.05:1.4' /tmp/saturn.js
          grep -Fq 'depthWrite:true' /tmp/saturn.js
          grep -Fq 'ringVisualThicknessKm=6400' /tmp/saturn.js
          grep -Fq 'warpedLatitude' /tmp/saturn.js
          grep -Fq 'totalEmissiveRadiance+=diffuseColor.rgb' /tmp/saturn.js
          grep -Fq 'function addRingHaze' /tmp/saturn.js
          grep -Fq 'function cleanDskSurface' /tmp/saturn.js
          grep -Fq 'const width=isMobile?4096:8192,height=8' /tmp/saturn.js
          ! grep -Fq 'new THREE.BoxGeometry' /tmp/saturn.js
          echo "LIVE_MARS_V6291_AND_SATURN_PRESERVATION_PASS."

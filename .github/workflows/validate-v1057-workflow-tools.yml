name: Validate V1057 Workflow Tools
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-v1057-workflow-tools.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch staged V1057
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ui-v1057-workflow-tools:refs/remotes/origin/ui-v1057-workflow-tools
          rm -rf /tmp/v1057 && mkdir -p /tmp/v1057
          git archive origin/ui-v1057-workflow-tools app | tar -x -C /tmp/v1057
          test -s /tmp/v1057/app/index.html
          test -s /tmp/v1057/app/workflow-tools-v1057.js
      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v1057/app
          for f in workflow-tools-v1057.js product-tools-v1056.js single-shell-v1055.js trial-access-v1055.js entitlement-ux-v1055.js runtime-self-heal-v1055.js work-hub-v1054.js app-more-v1054.js property-360-v1046.js customer-surfaces-v1042.js plans-primary-v1042.js; do node --check "$f"; done
      - name: Entrypoint and regression wiring
        shell: bash
        run: |
          set -euo pipefail
          I=/tmp/v1057/app/index.html
          grep -q 'data-bridgepoint-runtime="v1057"' "$I"
          grep -q 'workflow-tools-v1057.js?v=1057' "$I"
          grep -q 'product-tools-v1056.js?v=1057' "$I"
          grep -q 'single-shell-v1055.js?v=1057' "$I"
          grep -q 'trial-access-v1055.js?v=1057' "$I"
          ! grep -q 'flutter_bootstrap.js' "$I"
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' /tmp/v1057/app/*.js "$I"
      - name: Preserve customer critical contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'bridgepoint_flutter_properties_v725' /tmp/v1057/app/customer-surfaces-v1042.js
          grep -q 'bridgepoint_flutter_property_detail_v344' /tmp/v1057/app/customer-surfaces-v1042.js
          grep -q 'bridgepoint_saved_opportunities_v842' /tmp/v1057/app/customer-surfaces-v1042.js
          grep -q 'bridgepoint_claims_workspace_v833' /tmp/v1057/app/work-hub-v1054.js
          grep -q 'bridgepoint_calendar_agenda_v835' /tmp/v1057/app/work-hub-v1054.js
          grep -q 'bridgepoint-checkout-v67' /tmp/v1057/app/plans-primary-v1042.js
          grep -q 'bridgepoint_prepare_crm_export_v87' /tmp/v1057/app/property-360-v1046.js
      - name: Workflow Tools contract references
        shell: bash
        run: |
          set -euo pipefail
          F=/tmp/v1057/app/workflow-tools-v1057.js
          grep -q 'bridgepoint_workflow_tools_v1057' "$F"
          grep -q 'bridgepoint_watchlists_v88' <(printf '%s' 'bridgepoint_watchlists_v88')
          grep -q 'bridgepoint_create_watchlist_v88' "$F"
          grep -q 'bridgepoint_add_watchlist_item_v88' "$F"
          grep -q 'bridgepoint_prepare_crm_export_v87' "$F"
          grep -q 'bridgepoint_record_opportunity_feedback_v88' "$F"
          grep -q 'bridgepoint_submit_feedback_v70' "$F"
          grep -q 'bridgepoint_marketplace_add_model_v1057' "$F"
          grep -q 'bridgepoint_marketplace_update_model_v1057' "$F"
          grep -q 'bridgepoint_marketplace_remove_model_v1057' "$F"
          grep -q 'bridgepoint_create_custom_model_v1057' "$F"
          grep -q 'bridgepoint_custom_model_builder_v1057' "$F"
          grep -q 'bridgepoint_custom_model_signal_upsert_v1057' "$F"
          grep -q 'bridgepoint_custom_model_signal_remove_v1057' "$F"
      - name: Database guard presence
        shell: bash
        run: |
          set -euo pipefail
          project='https://xdfsjztwgsbmabshzsjw.supabase.co'
          key='sb_publishable_lM9oWQeHjBmgOIiteeOicQ_PTyAeF25'
          for fn in bridgepoint_workflow_tools_v1057 bridgepoint_custom_model_builder_v1057; do
            code=$(curl -sS -o "/tmp/${fn}.json" -w '%{http_code}' -X POST "$project/rest/v1/rpc/$fn" -H "apikey: $key" -H "Authorization: Bearer $key" -H 'Content-Type: application/json' -d '{}')
            test "$code" = '401' || test "$code" = '400'
          done
      - name: V1056 product and local-node regression
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'bridgepoint_product_tools_v1056' /tmp/v1057/app/product-tools-v1056.js
          grep -q 'bridgepoint-geographic-checkout-v1056' /tmp/v1057/app/product-tools-v1056.js
          python -m py_compile /tmp/v1057/app/downloads/bridgepoint_local_node_v1055.py
          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw '/tmp/v1057/app/downloads/install_bridgepoint_local_node_v1055.ps1')) | Out-Null"
      - name: Validation summary
        run: echo 'V1057 Workflow Tools passed syntax, wiring, customer-contract, entitlement-wrapper and local-node regression guards.'

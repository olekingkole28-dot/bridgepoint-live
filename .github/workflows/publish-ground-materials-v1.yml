name: BridgePoint Global ground materials and dense grass V1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-ground-materials-v1.yml']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore and verify exact currently published baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/horizon-site"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false and (.name|startswith("bridgepoint-v5000-"))) | [.workflow_run.id,.name] | @tsv' > "$RUNNER_TEMP/candidates"
          cat "$RUNNER_TEMP/candidates"
          found=0
          while IFS=$'\t' read -r run name; do
            if [ "$run" = "$GITHUB_RUN_ID" ]; then continue; fi
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.conclusion')" != success ]; then continue; fi
            rm -rf "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/horizon-site"
            mkdir -p "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/horizon-site"
            if ! timeout 240s gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "$RUNNER_TEMP/baseline"; then continue; fi
            if ! test -s "$RUNNER_TEMP/baseline/artifact.tar"; then continue; fi
            tar -xf "$RUNNER_TEMP/baseline/artifact.tar" -C "$RUNNER_TEMP/horizon-site"
            same=1
            for p in index.html app/index.html landing.js app.js world-v2300-map.js app/world-v2300-map.js world-v2300-water.js app/world-v2300-water.js bridgepoint-bottom-card-mobile-v2.js bridgepoint-bottom-card-categories-v1.js vendor/bp-nyc-bus-v1.mjs vendor/bp-bus-models-v3.mjs vendor/bp-street-detail-v1.mjs assets/street-detail-v1/manifest.json assets/street-detail-v1/busshelter.glb.gz world-v2300-tree-instanced.js app/world-v2300-tree-instanced.js vendor/bp-tree-canopy-source-v3.mjs vendor/bp-tree-canopy-worker-v3.mjs assets/street-detail-v1/pavers.png; do
              if ! curl --retry 2 --retry-all-errors --max-time 35 -fsSL -H 'Cache-Control: no-cache' "https://bridgepointintelligence.online/$p?baseline=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/current" || ! cmp -s "$RUNNER_TEMP/horizon-site/$p" "$RUNNER_TEMP/current"; then same=0; break; fi
            done
            if [ "$same" = 1 ]; then echo "Verified live baseline $run $name"; found=1; break; fi
          done < <(head -15 "$RUNNER_TEMP/candidates")
          test "$found" = 1 || { echo 'No exact current release found; refusing rollback'; exit 1; }
      - name: Install automatic mapped ground materials
        run: |
          set -euo pipefail
          export SITE="$RUNNER_TEMP/horizon-site"
          python3 - "$SITE" <<'PY'
          import sys,re
          from pathlib import Path
          site=Path(sys.argv[1])
          for base in (site,site/'app'):
              p=base/'world-v2300-map.js';s=p.read_text()
              a="map.on('zoomend',bpAttachTreeRendererFromViewport);"
              assert s.count(a)==1
              s=s.replace(a,a+"\n let bpGroundMaterialsAttached=false;const bpAttachGroundMaterials=()=>{if(bpGroundMaterialsAttached||map.getZoom()<13.5)return;bpGroundMaterialsAttached=true;import('/vendor/bp-ground-materials-v1.mjs').then(m=>m.attachGroundMaterials(map)).catch(e=>{bpGroundMaterialsAttached=false;console.warn('Ground materials',e)});};map.on('move',bpAttachGroundMaterials);map.on('moveend',bpAttachGroundMaterials);map.on('idle',bpAttachGroundMaterials);")
              p.write_text(s)
              for name in ('index.html','landing.js','app.js'):
                  p=base/name
                  if p.exists():
                      s=p.read_text();n=re.sub(r'world-v2300-map\.js\?v=[^\'"\s<>]+','world-v2300-map.js?v=20261126-ground-material-v1',s)
                      if s!=n:p.write_text(n)
          assert (site/'assets/street-detail-v1/pavers.png').stat().st_size>0
          print('GROUND_MATERIALS_SCOPED_PATCH_PASS')
          PY
          mkdir -p "$RUNNER_TEMP/ground-build"
          cat > "$RUNNER_TEMP/ground-build/ground.mjs" <<'JS'
          import clipping from 'polygon-clipping';
          const R=6378137,D=Math.PI/180,CELL=64,MIN=13.5,DETAIL=17.5;
          const TURL='/vendor/three.module.js?v=169-local',LAYER='bp-ground-grass-mesh-v1',SRC='bp-ground-material-tiles-v1',FILL='bp-ground-grass-fill-v1',PAVE='bp-ground-paving-fill-v1';
          const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
          const xy=q=>[R*q[0]*D,R*Math.asinh(Math.tan(clamp(q[1],-85.05112878,85.05112878)*D))];
          const ll=q=>[q[0]/R/D,Math.atan(Math.sinh(q[1]/R))/D];
          const square=(x,y,n=CELL)=>[[[x,y],[x+n,y],[x+n,y+n],[x,y+n],[x,y]]];
          const feature=(poly,kind)=>({type:'Feature',geometry:{type:'Polygon',coordinates:poly.map(r=>r.map(ll))},properties:{kind}});
          const empty=()=>({type:'FeatureCollection',features:[]});
          function polys(f){const g=f?.geometry;if(g?.type==='Polygon')return [g.coordinates.map(r=>r.map(xy))];if(g?.type==='MultiPolygon')return g.coordinates.map(p=>p.map(r=>r.map(xy)));return [];}
          function lines(f){const g=f?.geometry;return g?.type==='LineString'?[g.coordinates.map(xy)]:g?.type==='MultiLineString'?g.coordinates.map(l=>l.map(xy)):[];}
          function bbox(p){let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;for(const ring of p)for(const q of ring){a=Math.min(a,q[0]);b=Math.min(b,q[1]);c=Math.max(c,q[0]);d=Math.max(d,q[1])}return[a,b,c,d]}
          const overlaps=(a,b)=>a[0]<=b[2]&&a[2]>=b[0]&&a[1]<=b[3]&&a[3]>=b[1];

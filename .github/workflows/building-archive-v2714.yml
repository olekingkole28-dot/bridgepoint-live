name: Building Archive v2714

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/building-archive-v2714.yml'
      - 'scripts/build-building-archive-tx-item-v2765.py'
      - 'scripts/finalize-building-archive-tx-v2765.py'

permissions:
  contents: read
  id-token: write

concurrency:
  group: bridgepoint-building-archive-v2714
  cancel-in-progress: true

env:
  SUPABASE_URL: https://xdfsjztwgsbmabshzsjw.supabase.co

jobs:
  texas-item:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include:
          - { item: '00016', lane: 0, lanes: 1 }
          - { item: '00027', lane: 0, lanes: 3 }
          - { item: '00027', lane: 1, lanes: 3 }
          - { item: '00027', lane: 2, lanes: 3 }
          - { item: '00037', lane: 0, lanes: 2 }
          - { item: '00037', lane: 1, lanes: 2 }
          - { item: '00038', lane: 0, lanes: 1 }
          - { item: '00040', lane: 0, lanes: 4 }
          - { item: '00040', lane: 1, lanes: 4 }
          - { item: '00040', lane: 2, lanes: 4 }
          - { item: '00040', lane: 3, lanes: 4 }
          - { item: '00041', lane: 0, lanes: 4 }
          - { item: '00041', lane: 1, lanes: 4 }
          - { item: '00041', lane: 2, lanes: 4 }
          - { item: '00041', lane: 3, lanes: 4 }
          - { item: '00042', lane: 0, lanes: 2 }
          - { item: '00042', lane: 1, lanes: 2 }
          - { item: '00043', lane: 0, lanes: 1 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned data-build dependencies
        run: python -m pip install --disable-pip-version-check duckdb==1.4.1 requests==2.32.5
      - name: Verify renewable GitHub OIDC endpoint
        shell: bash
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
      - name: Build remaining Texas source item lane
        run: python scripts/build-building-archive-tx-item-v2765.py --item "${{ matrix.item }}" --lane "${{ matrix.lane }}" --lanes "${{ matrix.lanes }}"

  finalize-texas:
    needs: texas-item
    if: ${{ always() && needs.texas-item.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check duckdb==1.4.1 requests==2.32.5
      - name: Verify renewable GitHub OIDC endpoint
        shell: bash
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
      - name: Prove Texas archive complete and unique
        run: python scripts/finalize-building-archive-tx-v2765.py

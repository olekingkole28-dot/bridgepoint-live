name: Deploy BridgePoint Instant Map World

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'staging/world-v2652/**'
      - 'staging/home-v2652/**'
      - '.github/workflows/deploy-world-v2652-overlay.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate V2663 source
        shell: bash
        run: |
          set -euo pipefail
          test -s staging/world-v2652/index.html
          test -s staging/world-v2652/world-v2663-first-map.js
          test -s staging/world-v2652/world-v2662-instant-map.js
          test -s staging/world-v2652/world-v2662-weather-bootstrap.js
          test -s staging/world-v2652/world-v2661-first-frame.js
          test -s staging/world-v2652/world-v2653-surface.js
          test -s staging/world-v2652/world-v2656-interaction.js
          test -s staging/world-v2652/world-v2657-experience.js
          test -s staging/world-v2652/world-v2657-status.js
          test -s staging/world-v2652/world-v2657-inspector.js
          test -s staging/world-v2652/world-v2659-hifi.js
          test -s staging/world-v2652/world-v2660-continuous-lod.js
          test -s staging/world-v2652/world-v2652-production.js
          test -s staging/world-v2652/world-v2652-actions.js
          test -s staging/home-v2652/patch-live-app.py
          for f in world-v2663-first-map.js world-v2662-instant-map.js world-v2662-weather-bootstrap.js world-v2661-first-frame.js world-v2653-surface.js world-v2656-interaction.js world-v2657-experience.js world-v2657-status.js world-v2657-inspector.js world-v2659-hifi.js world-v2660-continuous-lod.js world-v2652-production.js world-v2652-actions.js; do node --check "staging/world-v2652/$f"; done
          grep -Fq 'world-v2663-first-map.js' staging/world-v2652/index.html
          grep -Fq 'world-v2662-weather-bootstrap.js' staging/world-v2652/index.html
          grep -Fq 'BridgePointFirstPoliticalV2663' staging/world-v2652/world-v2663-first-map.js
          grep -Fq 'BridgePointWeatherBootstrapV2662' staging/world-v2652/world-v2662-weather-bootstrap.js
          grep -Fq 'instant-map-world-2663' staging/home-v2652/patch-live-app.py
          ! grep -Fq 'world-v2658-ground-labels.js' staging/world-v2652/index.html
          ! grep -Fq 'world-v2661-surface-labels.js' staging/world-v2652/index.html
          ! grep -Fq 'caches.delete' staging/home-v2652/patch-live-app.py

      - name: Assemble V2663 app
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site && mkdir site
          git archive --format=tar origin/live-artifact | tar -xf - -C site
          test -s site/app/bridgepoint-3d-world/world-v2500.js
          mkdir -p site/app/bridgepoint-3d-world
          cp -a staging/world-v2652/. site/app/bridgepoint-3d-world/

          curl -fsSL --retry 4 --retry-delay 1 'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson' -o site/app/bridgepoint-3d-world/countries-50m.geojson
          curl -fsSL --retry 4 --retry-delay 1 'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson' -o site/app/bridgepoint-3d-world/countries-110m.geojson
          curl -fsSL --retry 4 --retry-delay 1 'https://raw.githubusercontent.com/PublicaMundi/MappingAPI/master/data/geojson/us-states.json' -o site/app/bridgepoint-3d-world/us-states.geojson

          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('site/app/bridgepoint-3d-world')
          for name in ('countries-50m.geojson','countries-110m.geojson','us-states.geojson'):
              data=json.loads((root/name).read_text())
              assert data.get('type')=='FeatureCollection' and len(data.get('features',[]))>20, name
          p=root/'world-v2500.js'
          s=p.read_text()
          s=s.replace("viewer.imageryLayers.addImageryProvider(globalImagery);","// V2663 photographic global imagery disabled by default")
          s=s.replace("viewer.imageryLayers.addImageryProvider(imagery);","// V2663 photographic U.S. imagery disabled by default")
          s=s.replace("  await loadCountries();","  loadCountries().catch(e=>console.warn('country gating geometry deferred',e));")
          s=s.replace("  await startAtUser();","  viewer.camera.setView({destination:Cesium.Cartesian3.fromDegrees(-98.35,39.35,5550000),orientation:{heading:0,pitch:Cesium.Math.toRadians(-88.5),roll:0}}); viewer.scene.requestRender();")
          p.write_text(s)
          assert 'viewer.imageryLayers.addImageryProvider(globalImagery);' not in s
          assert 'viewer.imageryLayers.addImageryProvider(imagery);' not in s
          assert 'await loadCountries();' not in s
          assert 'await startAtUser();' not in s
          PY
          node --check site/app/bridgepoint-3d-world/world-v2500.js

          rm -rf site/app/bridgepoint-world-v2652
          cp -a site/app/bridgepoint-3d-world site/app/bridgepoint-world-v2652
          python3 staging/home-v2652/patch-live-app.py

          test -s site/app/bridgepoint-world-v2652/countries-110m.geojson
          grep -Fq 'world-v2663-first-map.js' site/app/bridgepoint-world-v2652/index.html
          grep -Fq 'world-v2662-weather-bootstrap.js' site/app/bridgepoint-world-v2652/index.html
          grep -Fq 'instant-map-world-2663' site/app/index.html
          ! grep -Fq '<iframe' site/app/index.html
          ! grep -Fq 'main.dart.js' site/app/index.html

          cat > site/app/bridgepoint-world-overlay-v2652.json <<EOF
          {"app_shell_version":2663,"map_only":true,"first_frame":"US_CAMERA_SYNCHRONOUS","repeat_launch_cache":"MAP_CORE_CACHE_FIRST","us_state_bootstrap":"PRELOADED_LOCAL_89KB","country_first_view":"PRELOADED_110M_COARSE_WORLD_FIXED","country_detail":"DEFERRED_50M_FOR_GATING","country_labels":"WORLD_FIXED_SURFACE_TEXTURES","legacy_screen_country_labels":false,"us_jurisdictions_green":true,"foreign_countries_red_locked":true,"weather_start":"SERVER_5_MIN_CACHE_PLUS_LOCAL_CACHE_PLUS_LIVE_REFRESH","weather_bootstrap_rpc":"bridgepoint_us_weather_bootstrap_v2662","weather_full_us_distance":26000000,"continuous_lod":true,"predictive_camera_prefetch_ms":38,"satellite_default":false,"raw_landcover_visible":false,"overlay_source_sha":"${GITHUB_SHA}"}
          EOF
          touch site/.nojekyll site/app/.nojekyll

      - name: Persist live artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/live && mkdir /tmp/live
          cp -a site/. /tmp/live/
          cd /tmp/live
          git init -q
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m "Publish BridgePoint instant map V2663 ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify production V2663
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://bridgepointintelligence.online'
          ok=0
          for attempt in $(seq 1 36); do
            marker="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/bridgepoint-world-overlay-v2652.json?v=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            app="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/?v=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            world="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/bridgepoint-world-v2652/?v=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            first="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/bridgepoint-world-v2652/world-v2663-first-map.js?v=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            weather="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/bridgepoint-world-v2652/world-v2662-weather-bootstrap.js?v=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            c110="$(curl -sS -o /tmp/c110.json -w '%{http_code}' --max-time 15 "${ORIGIN}/app/bridgepoint-world-v2652/countries-110m.geojson?v=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            states="$(curl -sS -o /tmp/states.json -w '%{http_code}' --max-time 15 "${ORIGIN}/app/bridgepoint-world-v2652/us-states.geojson?v=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            if printf '%s' "$marker" | grep -Fq '"app_shell_version":2663' && printf '%s' "$app" | grep -Fq 'instant-map-world-2663' && printf '%s' "$world" | grep -Fq 'world-v2663-first-map.js' && printf '%s' "$first" | grep -Fq 'BridgePointFirstPoliticalV2663' && printf '%s' "$weather" | grep -Fq 'BridgePointWeatherBootstrapV2662' && [ "$c110" = 200 ] && [ "$states" = 200 ]; then
              ok=1
              echo "BRIDGEPOINT_INSTANT_MAP_V2663_LIVE"
              break
            fi
            sleep 5
          done
          test "$ok" = 1

name: Inspect first underwater plane-wreck source
on:
  pull_request:
    paths:
      - '.github/workflows/inspect-plane-wrecks-source.yml'
      - 'tools/plane_wrecks/inspect_beechcraft_model.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-plane-wrecks-source.yml'
      - 'tools/plane_wrecks/inspect_beechcraft_model.py'
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate available model source/download routes for underwater aircraft
        run: |
          python3 -m py_compile tools/plane_wrecks/inspect_beechcraft_model.py
          python3 tools/plane_wrecks/inspect_beechcraft_model.py

name: Enforce BridgePoint V5000 Production Authority

on:
  workflow_dispatch:
  deployment_status:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enforce-v5000-production-authority.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-v5000-production-watchdog
  cancel-in-progress: true

jobs:
  guard:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event.deployment.environment == 'github-pages' && github.event.deployment_status.state == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.recover.outputs.page_url }}
    steps:
      - name: Check current production authority
        id: check
        shell: bash
        run: |
          set -euo pipefail
          O='https://bridgepointintelligence.online'
          salt="${GITHUB_SHA}-$(date +%s)"
          curl --retry 3 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/?authority=${salt}" -o /tmp/root.html || true
          curl --retry 3 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/app/?authority=${salt}" -o /tmp/app.html || true
          curl --retry 3 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/app.js?authority=${salt}" -o /tmp/app.js || true
          curl --retry 3 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/world-v2300-map.js?authority=${salt}" -o /tmp/world.js || true
          healthy=0
          if grep -Fq 'BP_FRONTEND_V5000' /tmp/root.html             && grep -Fq 'BP_FRONTEND_V5000' /tmp/app.html             && grep -Fqi 'maplibre' /tmp/app.html             && grep -Fq '__BP_APP_BUILD_VERSION__=' /tmp/app.js             && grep -Fq '__BP_WORLD_RENDER_VERSION__=' /tmp/world.js             && ! grep -Fqi 'cesium' /tmp/app.html; then
            healthy=1
          fi
          echo "healthy=${healthy}" >> "$GITHUB_OUTPUT"
          if [ "${healthy}" = 1 ]; then
            echo BRIDGEPOINT_V5000_PRODUCTION_HEALTHY
          else
            echo BRIDGEPOINT_V5000_PRODUCTION_RECOVERY_REQUIRED
          fi

      - name: Checkout last fully verified V5000 baseline
        if: steps.check.outputs.healthy != '1'
        uses: actions/checkout@v4
        with:
          ref: live-artifact
          fetch-depth: 1

      - name: Verify recovery baseline is V5000 and not Cesium
        if: steps.check.outputs.healthy != '1'
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s app/index.html
          test -s app.js
          test -s world-v2300-map.js
          grep -Fq 'BP_FRONTEND_V5000' index.html
          grep -Fq 'BP_FRONTEND_V5000' app/index.html
          grep -Fqi 'maplibre' app/index.html
          grep -Fq '__BP_APP_BUILD_VERSION__=' app.js
          grep -Fq '__BP_WORLD_RENDER_VERSION__=' world-v2300-map.js
          ! grep -Fqi 'cesium' app/index.html
          echo BRIDGEPOINT_V5000_BASELINE_VERIFIED

      - uses: actions/configure-pages@v5
        if: steps.check.outputs.healthy != '1'
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        if: steps.check.outputs.healthy != '1'
        with:
          name: bridgepoint-v5000-authority-recovery
          path: .

      - name: Recover V5000 production
        if: steps.check.outputs.healthy != '1'
        id: recover
        uses: actions/deploy-pages@v4
        with:
          artifact_name: bridgepoint-v5000-authority-recovery

      - name: Verify recovered production
        if: steps.check.outputs.healthy != '1'
        shell: bash
        run: |
          set -euo pipefail
          O='https://bridgepointintelligence.online'
          ok=0
          for i in $(seq 1 30); do
            salt="${GITHUB_SHA}-recover-${i}-$(date +%s)"
            curl --retry 3 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/?authority=${salt}" -o /tmp/root.html || true
            curl --retry 3 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/app/?authority=${salt}" -o /tmp/app.html || true
            if grep -Fq 'BP_FRONTEND_V5000' /tmp/root.html               && grep -Fq 'BP_FRONTEND_V5000' /tmp/app.html               && grep -Fqi 'maplibre' /tmp/app.html               && ! grep -Fqi 'cesium' /tmp/app.html; then
              ok=1
              echo BRIDGEPOINT_V5000_AUTHORITY_RECOVERED
              break
            fi
            sleep 4
          done
          test "${ok}" = 1

            const shell=new T.BufferGeometry();shell.setAttribute('position',new T.Float32BufferAttribute(pts,3));shell.setAttribute('normal',new T.Float32BufferAttribute(norm,3));shell.setAttribute('uv',new T.Float32BufferAttribute(uv,2));owned.add(shell);

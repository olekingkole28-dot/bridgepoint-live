          async function load(state,row)''')
          one('const base=new T.Matrix4().fromArray(raw);const ids=[];','const base=new T.Matrix4().fromArray(raw);const ids=[];let sourceCityActive=false;')
          one('const alt=altitude(map,row,entry);if(!finite(alt))continue;const mat=matrix(map,T,row.coordinates,alt);','const useSource=!!(row.cityScan&&entry.closeScene&&map.getZoom()>=14.8);const alt=useSource?0:altitude(map,row,entry);if(!finite(alt))continue;const mat=matrix(map,T,row.coordinates,alt);')
          one('state.renderer.render(entry.scene,state.camera);ids.push(row.id)','state.renderer.render(useSource?entry.closeScene:entry.scene,state.camera);ids.push(row.id);if(useSource)sourceCityActive=true')
          one("const prev=api.active.join('|');api.active=ids;if(ids.join('|')!==prev)schedule(state);","const prev=api.active.join('|'),priorSource=!!api.sourceCityActive;api.active=ids;api.sourceCityActive=sourceCityActive;if(priorSource!==sourceCityActive){state.cityMaskAt=0;citySourceCredit(state,sourceCityActive);schedule(state)}if(ids.join('|')!==prev)schedule(state);")
          one('const chosen=new Set(state.wanted.map(r=>r.id));syncCityReplacement(state);','const chosen=new Set(state.wanted.map(r=>r.id));const cityEntry=city&&state.cache.get(city.id);if(cityEntry&&z>=13.5&&Date.now()>=(state.sourceCityRetryAt||0)&&!cityEntry.closeScene)void loadSourceCity(state,city,cityEntry);syncCityReplacement(state);')
          one('let count=0,layers=0;\n for(const layer','''const buildingOnly=id=>/building|roof|floor-lines|facade-detail|night-windows/.test(id);
           if(api.sourceCityActive){for(const [id,f] of state.cityFilters){if(!buildingOnly(id)){try{if(map.getLayer(id)&&JSON.stringify(map.getFilter(id))===JSON.stringify(f.applied))map.setFilter(id,f.original||null)}catch(_){}state.cityFilters.delete(id)}}}

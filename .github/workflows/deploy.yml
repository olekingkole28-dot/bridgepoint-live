name: Deploy BridgePoint Live

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified BridgePoint v227 production artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: /tmp/bridgepoint-pages
          run-id: 31986374606
          github-token: ${{ github.token }}
      - name: Stage verified BridgePoint v227 production release
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          test -s /tmp/bridgepoint-pages/artifact.tar
          tar -xf /tmp/bridgepoint-pages/artifact.tar -C site
          test -s site/index.html
          test -s site/main.dart.js
          test -s site/bridgepoint-release.json
          grep -q '4030ebb3568d092fcbc33777ee8103ce75d42c68' site/bridgepoint-release.json
          grep -q 'bridgepointintelligence@gmail.com' site/main.dart.js
          grep -q 'Purchases & billing' site/main.dart.js
          grep -q 'Demo customer checkout - no charge' site/main.dart.js
          grep -q 'First-time invited owner / Forgot password' site/main.dart.js
          grep -q 'Connect Resend' site/main.dart.js
          echo 'BridgePoint v227 restored from durable GitHub Pages artifact storage.'
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish BridgePoint
        id: deployment
        uses: actions/deploy-pages@v4
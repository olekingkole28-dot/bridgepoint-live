              const g=o.geometry.clone().applyMatrix4(o.matrixWorld);
              g.translate(-b.base.x,-b.box.min.y,-b.base.z);
              g.scale(1/b.size.y,1/b.size.y,1/b.size.y);
              g.computeBoundingSphere();
              parts.push({geometry:g,material:o.material,tri:(g.index?.count||g.attributes.position.count)/3});
            });
            if(!parts.length)throw Error('SOURCE_MODEL_EMPTY');
            return {parts,tri:parts.reduce((n,p)=>n+p.tri,0),textured:parts.some(p=>p.geometry.attributes.uv&&(Array.isArray(p.material)?p.material:[p.material]).some(m=>m.map||m.alphaMap)),dispose(){for(const p of parts)p.geometry.dispose()}};
          }

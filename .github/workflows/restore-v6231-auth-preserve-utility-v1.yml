name: Restore V6231 sign-in and publish reliable 3D utility infrastructure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-v6231-auth-preserve-utility-v1.yml'
      - 'release-v2300/world-v2300-utility-infrastructure-v1.js'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

# Use the one production authority and do not race the full V5000 publisher.
concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: true

jobs:
  restore-auth-and-utility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download exact last-known-good V6231 production artifact
        uses: actions/download-artifact@v4
        with:
          name: bridgepoint-globe-root-v6231
          run-id: 41946741740
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: /tmp/bridgepoint-pages-bundle

      - name: Restore the complete V6231 auth bundle and reapply only utility renderer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          ARTIFACT_TAR="$(find /tmp/bridgepoint-pages-bundle -type f -name 'artifact.tar' -print -quit)"
          test -n "$ARTIFACT_TAR"
          tar -xf "$ARTIFACT_TAR" -C site

          # Prove the baseline is the known-good V6231 sign-in + globe build.
          test -s site/index.html
          test -s site/app/index.html
          test -s site/landing.js
          test -s site/app.js
          test -s site/sw.js
          test -s site/signin/index.html
          grep -Fq 'landing.js?v=6231-globe-root' site/index.html
          grep -Fq 'app.js?v=6231-globe-root' site/app/index.html
          grep -Fq 'bpAuthRequestV6228' site/landing.js
          grep -Fq 'bp:welcome-gate-unlocked-v6229' site/landing.js
          grep -Fq "BOOTSTRAP_AUTH_BUILD='v6230'" site/sw.js
          grep -Fq "GLOBE_ROOT_BUILD='v6231'" site/sw.js
          grep -Fq '/signin/?mode=signin' site/app/index.html
          grep -Fq 'bp_auth_v5045' site/signin/index.html
          grep -Fq 'https://solaris-boat-upgrades-stocks.trycloudflare.com' site/app.js

          # Only these six existing files may differ from the verified V6231 artifact.
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("site")
          before={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob("*") if p.is_file()}
          Path("/tmp/v6231-before.json").write_text(json.dumps(before,sort_keys=True))
          PY

          # Keep the exact V6231 auth bundles and insert utility loading into their
          # existing deferred queues; never replace the bundles with older source copies.
          python3 - <<'PY'
          from pathlib import Path
          import re
          version='world-v2300-utility-infrastructure-v1.js?v=5-distribution-telecom'
          landing=Path('site/landing.js')
          data=landing.read_text(encoding='utf-8')
          if '__BP_UTILITY_INFRASTRUCTURE_V1__' in data:
              raise SystemExit('V6231 landing unexpectedly already contains a utility initializer')
          pattern=re.compile(r"(?m)^(?P<indent>[ \t]*)void import\('\./world-v2300-sensor-layers\.js\?v=6224-underwater-dive-camera'\)")
          match=pattern.search(data)
          if not match:
              raise SystemExit('Could not find the V6231 deferred landing world-module queue')
          indent=match.group('indent')
          utility=(
              indent + "void import('./" + version + "')\n" +
              indent + ".then(m=>{window.__BP_UTILITY_INFRASTRUCTURE_V1__=m.initUtilityInfrastructure(world)})\n" +
              indent + ".catch(e=>console.warn('BridgePoint global mapped 3D utility infrastructure unavailable',e));\n"
          )
          data=data[:match.start()]+utility+data[match.start():]
          landing.write_text(data,encoding='utf-8')
          app=Path('site/app.js')
          data=app.read_text(encoding='utf-8')
          marker="  ['sensors',async()=>{const m=await import('./world-v2300-sensor-layers.js?v=6224-underwater-dive-camera');window.__BP_SENSOR_LAYERS_V5945__=m.initSensorLayers(world)}],"
          if data.count(marker)!=1 or '__BP_UTILITY_INFRASTRUCTURE_V1__' in data:
              raise SystemExit('Could not safely locate the V6231 serialized app world-module queue')
          item="  ['utility-infrastructure',async()=>{const m=await import('./" + version + "');window.__BP_UTILITY_INFRASTRUCTURE_V1__=m.initUtilityInfrastructure(world)}],\n"
          app.write_text(data.replace(marker,item+marker,1),encoding='utf-8')
          print('Inserted utility loader into existing V6231 deferred landing and serialized app queues.')
          PY

          # Publish the same corrected 3D module for website and signed-in app URLs.
          cp release-v2300/world-v2300-utility-infrastructure-v1.js site/world-v2300-utility-infrastructure-v1.js
          cp release-v2300/world-v2300-utility-infrastructure-v1.js site/app/world-v2300-utility-infrastructure-v1.js

          # Cache-bust only the two script tags while keeping V6231 auth + globe files.
          python3 - <<'PY'
          from pathlib import Path
          files=[
              ("site/index.html",'landing.js?v=6231-globe-root','landing.js?v=6234-distribution-poles'),
              ("site/app/index.html",'app.js?v=6231-globe-root','app.js?v=6234-distribution-poles'),
          ]
          for name,old,new in files:
              p=Path(name)
              data=p.read_text(encoding="utf-8")
              if data.count(old)!=1:
                  raise SystemExit(f"{name}: expected exactly one {old} reference")
              p.write_text(data.replace(old,new),encoding="utf-8")
          PY

          node --check site/landing.js
          node --check site/app.js
          node --input-type=module --check < site/world-v2300-utility-infrastructure-v1.js
          node --input-type=module --check < site/app/world-v2300-utility-infrastructure-v1.js

          grep -Fq 'bpAuthRequestV6228' site/landing.js
          grep -Fq 'bp:welcome-gate-unlocked-v6229' site/landing.js
          grep -Fq 'https://solaris-boat-upgrades-stocks.trycloudflare.com' site/app.js
          grep -Fq 'world-v2300-utility-infrastructure-v1.js?v=5-distribution-telecom' site/landing.js
          grep -Fq 'world-v2300-utility-infrastructure-v1.js?v=5-distribution-telecom' site/app.js
          grep -Fq 'landing.js?v=6234-distribution-poles' site/index.html
          grep -Fq 'app.js?v=6234-distribution-poles' site/app/index.html
          grep -Fq "typeof map.getStyle !== 'function'" site/world-v2300-utility-infrastructure-v1.js
          grep -Fq 'const MAX_SOURCE_ZOOM = 17;' site/world-v2300-utility-infrastructure-v1.js
          grep -Fq 'function ensureCustomLayerRenderer()' site/world-v2300-utility-infrastructure-v1.js
          grep -Fq 'poleMesh.setColorAt(index, poleColor)' site/world-v2300-utility-infrastructure-v1.js
          cmp -s site/world-v2300-utility-infrastructure-v1.js site/app/world-v2300-utility-infrastructure-v1.js

          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("site")
          before=json.loads(Path("/tmp/v6231-before.json").read_text())
          after={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob("*") if p.is_file()}
          removed=set(before)-set(after)
          added=set(after)-set(before)
          expected_added={"world-v2300-utility-infrastructure-v1.js",
                          "app/world-v2300-utility-infrastructure-v1.js"}
          assert not removed, f"Unexpected removed assets: {sorted(removed)}"
          assert added==expected_added, f"Unexpected added assets: {sorted(added)}"
          changed={p for p in before if p in after and before[p]!=after[p]}
          expected_changed={"index.html","landing.js","app.js","app/index.html"}
          assert changed==expected_changed, f"Unexpected modified existing assets: {sorted(changed)}"
          print("PASS: V6231 auth bundle preserved; only four expected existing files changed and the two utility module copies were added.")
          PY

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          name: bridgepoint-auth-preserved-distribution-v6234
          path: site
          include-hidden-files: true

      - name: Deploy restored authentication and utility renderer
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: bridgepoint-auth-preserved-distribution-v6234

      - name: Verify the live V6231 authentication logic and utility module
        shell: bash
        run: |
          set -euo pipefail
          O='https://bridgepointintelligence.online'
          ok=0
          for i in $(seq 1 30); do
            q="${GITHUB_SHA}-${i}-$(date +%s)"
            curl --retry 2 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/?verify-auth-utility=${q}" -o /tmp/live-root.html || true
            curl --retry 2 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/app/?verify-auth-utility=${q}" -o /tmp/live-app.html || true
            curl --retry 2 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/landing.js?verify-auth-utility=${q}" -o /tmp/live-landing.js || true
            curl --retry 2 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/app.js?verify-auth-utility=${q}" -o /tmp/live-app.js || true
            curl --retry 2 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/sw.js?verify-auth-utility=${q}" -o /tmp/live-sw.js || true
            curl --retry 2 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/signin/?verify-auth-utility=${q}" -o /tmp/live-signin.html || true
            curl --retry 2 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/world-v2300-utility-infrastructure-v1.js?v=5-distribution-telecom&verify=${q}" -o /tmp/live-utility.js || true
            if grep -Fq 'landing.js?v=6234-distribution-poles' /tmp/live-root.html 2>/dev/null &&
               grep -Fq 'app.js?v=6234-distribution-poles' /tmp/live-app.html 2>/dev/null &&
               grep -Fq 'bpAuthRequestV6228' /tmp/live-landing.js 2>/dev/null &&
               grep -Fq 'bp:welcome-gate-unlocked-v6229' /tmp/live-landing.js 2>/dev/null &&
               grep -Fq 'https://solaris-boat-upgrades-stocks.trycloudflare.com' /tmp/live-app.js 2>/dev/null &&
               grep -Fq "BOOTSTRAP_AUTH_BUILD='v6230'" /tmp/live-sw.js 2>/dev/null &&
               grep -Fq "GLOBE_ROOT_BUILD='v6231'" /tmp/live-sw.js 2>/dev/null &&
               grep -Fq 'bp_auth_v5045' /tmp/live-signin.html 2>/dev/null &&
               grep -Fq "typeof map.getStyle !== 'function'" /tmp/live-utility.js 2>/dev/null &&
               grep -Fq 'bpw-globe-aura' /tmp/live-root.html 2>/dev/null; then
              ok=1
              break
            fi
            sleep 4
          done
          test "$ok" -eq 1
          echo "Live V6231 mobile auth restored; zoom-17 OpenInfraMap utility tiles and guarded 3D pole/tower/wire renderer are live."

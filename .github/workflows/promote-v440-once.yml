name: Promote audited BridgePoint V440 app once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/promote-v440-once.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: bridgepoint-v440-artifact-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify exact audited V440 Flutter artifact
        env:
          V440_ARTIFACT_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-724c-8210-b15f-ce5f037774d3/raw?se=2026-08-22T01%3A01%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=7061fa69-5f69-54d7-a0c6-c2f3c493ebc2&skoid=0a4a0f0c-99ac-4752-9d87-cfac036fa93f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-21T23%3A45%3A49Z&ske=2026-08-22T23%3A45%3A49Z&sks=b&skv=2026-02-06&sig=wI%2BwZ73SCN2YCwKUKJLLPZcD%2BK/qc1IIKlZn0x5L%2BlI%3D"
          EXPECTED_ZIP_SHA256: "10ba1699265baa1981a6772c8c1434fef967c9a8c6673c4c79f8610f70fe73bc"
          EXPECTED_ARTIFACT_MARKER: "4b80bbdc1137ce7b7d3fc26f69fa5077c5c8566a"
        run: |
          set -euo pipefail
          rm -rf /tmp/v440 /tmp/v440.zip
          mkdir -p /tmp/v440
          curl --fail --location --retry 3 --retry-delay 2 "$V440_ARTIFACT_URL" -o /tmp/v440.zip
          echo "${EXPECTED_ZIP_SHA256}  /tmp/v440.zip" | sha256sum --check --strict
          unzip -q /tmp/v440.zip -d /tmp/v440
          test -s /tmp/v440/index.html
          test -s /tmp/v440/main.dart.js
          test -s /tmp/v440/bridgepoint-release.json
          test -s /tmp/v440/flutter_bootstrap.js
          grep -q "$EXPECTED_ARTIFACT_MARKER" /tmp/v440/bridgepoint-release.json
          grep -q 'https://bridgepointintelligence.online/' /tmp/v440/bridgepoint-release.json
          grep -q 'Create account' /tmp/v440/main.dart.js
          grep -q 'Already have an account' /tmp/v440/main.dart.js
          grep -q 'Check your email' /tmp/v440/main.dart.js
          if grep -Eqi 'SUPABASE_SERVICE_ROLE_KEY|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' /tmp/v440/main.dart.js; then
            echo 'Privileged secret marker found in audited browser artifact.' >&2
            exit 1
          fi
          touch /tmp/v440/.nojekyll
          echo 'Exact audited V440 artifact verified.'

      - name: Persist V440 as immutable app artifact branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/v440
          git init
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b app-artifact-v440
          git add -A
          git commit -m 'Persist audited BridgePoint V440 Flutter artifact'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin app-artifact-v440

      - name: Switch live deployment to durable V440 artifact and retire bootstrap
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/deploy-tracking-v421.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace('app-artifact-v422:refs/remotes/origin/app-artifact-v422','app-artifact-v440:refs/remotes/origin/app-artifact-v440')
          s=s.replace('origin/app-artifact-v422','origin/app-artifact-v440')
          s=s.replace("grep -q '2e111cc765d23533e2adf953b44a5578201a0790' /tmp/bridgepoint-app/bridgepoint-release.json","grep -q '4b80bbdc1137ce7b7d3fc26f69fa5077c5c8566a' /tmp/bridgepoint-app/bridgepoint-release.json")
          s=s.replace("'base_release_sha':'2e111cc765d23533e2adf953b44a5578201a0790',","'source_main_sha':'796bae97fd83adfe8ca93746d395a421e6970e86',\n            'audited_artifact_marker':'4b80bbdc1137ce7b7d3fc26f69fa5077c5c8566a',")
          s=s.replace("'immutable_app_branch':'app-artifact-v422',","'immutable_app_branch':'app-artifact-v440',")
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'app-artifact-v440' .github/workflows/deploy-tracking-v421.yml
          grep -q '4b80bbdc1137ce7b7d3fc26f69fa5077c5c8566a' .github/workflows/deploy-tracking-v421.yml
          git rm .github/workflows/promote-v440-once.yml
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/deploy-tracking-v421.yml
          git commit -m 'Promote audited V440 app into live release [skip promotion]'
          git push origin HEAD:main

name: Manhattan V7 One World Trade Center exterior
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-manhattan-one-wtc-v7.yml']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact live successful release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/45717770962 --jq '.conclusion')" = success
          mkdir -p "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/horizon-site"
          for i in 1 2 3; do
            if timeout 240s gh run download 45717770962 --repo "$GITHUB_REPOSITORY" --name bridgepoint-v5000-1 --dir "$RUNNER_TEMP/baseline" && test -s "$RUNNER_TEMP/baseline/artifact.tar"; then break; fi
            sleep 5
          done
          tar -xf "$RUNNER_TEMP/baseline/artifact.tar" -C "$RUNNER_TEMP/horizon-site"
          for p in index.html app/index.html landing.js app.js world-v2300-map.js app/world-v2300-map.js world-v2300-water.js bridgepoint-bottom-card-mobile-v2.js; do
            curl --retry 4 --retry-all-errors --max-time 45 -fsSL -H 'Cache-Control: no-cache' "https://bridgepointintelligence.online/$p?baseline=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/current"
            cmp "$RUNNER_TEMP/horizon-site/$p" "$RUNNER_TEMP/current"
          done
      - name: Register a dedicated exterior model to the surveyed host
        run: |
          set -euo pipefail
          export SITE="$RUNNER_TEMP/horizon-site"
          python3 -m pip install --quiet 'shapely>=2.1,<3' mapbox-vector-tile
          mkdir -p "$SITE/vendor" "$SITE/data"
          python3 - <<'PY'
          import os,math,json
          from pathlib import Path
          from shapely.geometry import shape,Point
          from shapely.ops import transform,unary_union
          from mapbox_vector_tile import decode
          site=Path(os.environ['SITE'])
          root=site/'assets/manhattan-native-v6/tiles/17'
          R=6378137.;W=math.pi*R;N=2**17;step=2*W/N
          lng,lat=-74.013382,40.712742
          mx=R*math.radians(lng);my=R*math.log(math.tan(math.pi/4+math.radians(lat)/2))
          tx=int((mx+W)/step);ty=int((W-my)/step)
          hosts={}
          for x in range(tx-1,tx+2):
            for y in range(ty-1,ty+2):
              path=root/str(x)/(str(y)+'.pbf')
              if not path.is_file():continue
              layer=decode(path.read_bytes()).get('buildings',{})
              ext=layer.get('extent',4096)
              for f in layer.get('features',[]):
                p=f['properties']
                if float(p.get('h',0))<340:continue
                g=transform(lambda xx,yy:(-W+x*step+xx*step/ext,W-(y+1)*step+yy*step/ext),shape(f['geometry']))
                item=hosts.setdefault(p['host'],[p,[]]);item[1].append(g)
          candidates=[]
          for host,(p,geoms) in hosts.items():
            g=unary_union(geoms);distance=g.distance(Point(mx,my))
            if distance<80:candidates.append((distance,host,p,g))
          assert candidates,'No surveyed tower host near One WTC'
          _,host,p,g=min(candidates,key=lambda row:row[0])
          assert g.distance(Point(mx,my))<35,(host,p,g.distance(Point(mx,my)))
          box=g.minimum_rotated_rectangle
          coords=list(box.exterior.coords)
          dx,dy=coords[1][0]-coords[0][0],coords[1][1]-coords[0][1]
          angle=math.atan2(dy,dx)
          center=g.centroid
          lon=math.degrees(center.x/R);la=math.degrees(2*math.atan(math.exp(center.y/R))-math.pi/2)
          assert abs(lon-lng)<.0007 and abs(la-lat)<.0007
          size=[math.dist(coords[i],coords[i+1])*math.cos(math.radians(la)) for i in (0,1)]
          assert all(40<v<90 for v in size),(host,size,p)
          meta={'name':'One World Trade Center','host':host,'bin':p.get('bin'),'origin':[lon,la],'rotation':angle,'surveyedFootprintSizeM':size,'surveyedRoofM':p['h'],'podiumWidthM':60.96,'crownWidthM':45.72,'parapetM':416.9664,'spireTipM':541.3248,'panelWidthM':1.524,'panelHeightM':4.064,'sources':['https://www.som.com/projects/one-world-trade-center/','https://www.wsp.com/en-us/projects/one-world-trade-center/','https://data.cityofnewyork.us/City-Government/Building-Footprints/3g6p-4u5s'],'quality':'Reference-based exterior reconstruction; non-surveyed crown details and optical sky approximation; not an as-built BIM.'}
          (site/'data/bp-one-wtc-v7.json').write_text(json.dumps(meta,separators=(',',':')))
          print('ONE_WTC_SURVEYED_HOST',json.dumps(meta))
          PY
          cat > "$SITE/vendor/bp-one-wtc-v7.mjs" <<'JS'
          // One static landmark. No per-building instances, polling, or animation loop.
          const states=new WeakMap(),ID='bp-one-wtc-exterior-v7';
          const bodyIDs=['bp-manhattan-surveyed-body-v6','bp-manhattan-surveyed-cap-v6','bp-manhattan-native-roof-v5'];
          const near=m=>{const c=m.getCenter();return m.getZoom()>=15.6&&Math.abs(c.lng+74.013382)<.025&&Math.abs(c.lat-40.712742)<.025};
          function restore(s){for(const [id,f] of s.filters)try{if(s.map.getLayer(id))s.map.setFilter(id,f)}catch(_){}s.filters.clear();s.d.masked=false;}
          function mask(s){
            if(s.d.masked||!s.enabled||!s.map.getLayer(ID))return;
            try{
              for(const id of bodyIDs){if(!s.map.getLayer(id))throw Error('Missing surveyed host layer '+id);const f=s.map.getFilter(id)||null;s.filters.set(id,f);const no=['!=',['get','host'],s.meta.host];s.map.setFilter(id,f?['all',f,no]:no);}
              s.d.masked=true;
            }catch(e){restore(s);s.d.error=String(e);s.enabled=false;}
          }
          function visible(s){return s.enabled&&near(s.map)&&!s.failed;}
          export function syncOneWTC(map,on){
            let s=states.get(map);
            if(!s){s={map,enabled:false,pending:false,failed:false,filters:new Map(),d:{status:'standby',frames:0,masked:false,drawCalls:0}};states.set(map,s);map.on('remove',()=>{s.enabled=false;restore(s);states.delete(map)});}
            window.__BP_ONE_WTC_V7__=s.d;
            s.enabled=!!on&&near(map);
            if(!s.enabled){if(s.filters.size)restore(s);return;}
            if(s.pending||s.failed||map.getLayer(ID))return;
            s.pending=true;
            Promise.all([import('/vendor/three.module.js?v=169-local'),fetch('/data/bp-one-wtc-v7.json').then(r=>{if(!r.ok)throw Error('landmark registration '+r.status);return r.json()})]).then(([T,meta])=>{
              s.meta=meta;s.d.host=meta.host;s.d.origin=meta.origin;
              if(visible(s)&&!map.getLayer(ID))map.addLayer(makeLayer(T,s),map.getLayer('gta-water-label')?'gta-water-label':undefined);
            }).catch(e=>{s.failed=true;s.d.status='fallback';s.d.error=String(e);restore(s);if(map.getLayer(ID))map.removeLayer(ID)}).finally(()=>{s.pending=false});

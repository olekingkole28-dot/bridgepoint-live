name: Validate BridgePoint Underground Scan Meshes v2

on:
  pull_request:
    paths:
      - '.github/workflows/publish-underground-scan-scenes-v2.yml'
      - 'rebuild-v5000/bridgepoint-underground-scan-scenes-v2.js'
      - 'tools/underground/fetch_sketchfab_scans.py'
      - 'tests/underground-scan-scenes-v2.test.mjs'
      - 'docs/bridgepoint-underground-scan-scenes-v2.md'

permissions:
  contents: read

jobs:
  validate-in-scene-underground-models:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse the production publisher workflow YAML
        run: |
          python3 -m pip install --quiet PyYAML
          python3 - <<'PY'
          import yaml
          with open('.github/workflows/publish-underground-scan-scenes-v2.yml',encoding='utf-8') as f:
              data=yaml.safe_load(f)
          assert isinstance(data,dict) and 'jobs' in data and 'publish' in data['jobs']
          print('UNDERGROUND_PUBLISH_WORKFLOW_YAML_PASS')
          PY
      - name: Check real in-scene renderer syntax
        run: node --check rebuild-v5000/bridgepoint-underground-scan-scenes-v2.js
      - name: Compile rights-checked Sketchfab asset importer
        run: python3 -m py_compile tools/underground/fetch_sketchfab_scans.py
      - name: Run underground mesh, attribution and static-card contract tests
        run: node tests/underground-scan-scenes-v2.test.mjs

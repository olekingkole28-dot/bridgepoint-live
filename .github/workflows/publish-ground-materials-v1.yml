           const scale=Math.cos(anchor[1]*D),positions=[],colors=[],terrain=new Map(),shade=new T.Color(),geo=new T.BufferGeometry();let blades=0;
           const elev=(px,py)=>{if(!map.getTerrain?.())return 0;const size=4,ix=Math.floor(px/size),iy=Math.floor(py/size),u=px/size-ix,v=py/size-iy,at=(a,b)=>{const k=a+':'+b;if(!terrain.has(k))terrain.set(k,map.queryTerrainElevation(ll([a*size,b*size]),{exaggerated:true}));return terrain.get(k)},a=at(ix,iy),b=at(ix+1,iy),c=at(ix,iy+1),e=at(ix+1,iy+1);return [a,b,c,e].every(Number.isFinite)?(a*(1-u)+b*u)*(1-v)+(c*(1-u)+e*u)*v:null;};

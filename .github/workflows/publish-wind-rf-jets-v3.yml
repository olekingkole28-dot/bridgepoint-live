name: Publish Wind RF Jets 3D Moving Fields and Persistent Icon Cards Only
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify 3D Wind and RF renderer without touching other modules
        shell: bash
        run: |
          set -euo pipefail
          node --check rebuild-v5000/bridgepoint-view-v5917.js
          node --input-type=module --check < rebuild-v5000/bridgepoint-global-wind-rf-v1.js
          node --input-type=module --check < rebuild-v5000/bridgepoint-volumetric-fields-v5978.js
          node tests/wind-rf-one-touch-v1.test.mjs
          node tests/wind-rf-visual-v2.test.mjs
          grep -Fq 'mountJetPreview(el,row)' rebuild-v5000/bridgepoint-global-wind-rf-v1.js
          grep -Fq 'vertexColors:false' rebuild-v5000/bridgepoint-global-wind-rf-v1.js
          grep -Fq 'toggleUnifiedWindRfJets(b)' rebuild-v5000/bridgepoint-view-v5917.js
      - name: Check same PC Cloudflare auth, never Supabase
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 --retry-all-errors -fsSL --max-time 25 https://characterization-seas-total-adopt.trycloudflare.com/auth/v1/health | grep -Fq '"local":true'
      - name: Download REAL Open-Meteo/FCC snapshot from passing mobile globe verification
        uses: actions/download-artifact@v4
        with:
          name: verified-wind-rf-jet-forecast-and-mobile-test
          run-id: 44846239192
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/bp-windrf-data
      - name: Find newest intact current production artifact
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          choices=[]
          for page in (1,2,3):
            data=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/artifacts?per_page=100&page={page}']))
            for a in data.get('artifacts',[]):
              name=a.get('name','')
              if a.get('expired') or (a.get('size_in_bytes') or 0)<10_000_000:continue
              if name.startswith('bridgepoint-v5000-faa-cache-'):continue
              if not (name.startswith('bridgepoint-v5000-') or name.startswith('github-pages-')
                or name.startswith('bridgepoint-auth-tunnel-recovery-v1') or name.startswith('bridgepoint-faa-')):continue
              run=a.get('workflow_run') or {}
              if run.get('id'):choices.append((a.get('created_at',''),run['id'],name))
            if len(choices)>35:break
          choices.sort(reverse=True)
          if not choices:raise SystemExit('NO_COMPLETE_SITE_BASELINE')
          date,runid,name=choices[0]
          with open(os.environ['GITHUB_OUTPUT'],'a') as o:
            o.write(f'run_id={runid}\nartifact_name={name}\n')
          print('WIND_RF_JETS_PROTECTED_BASELINE',date,runid,name)
          PY
      - name: Download preserved complete site, never reconstruct
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.baseline.outputs.artifact_name }}
          run-id: ${{ steps.baseline.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/bp-windrf-baseline
      - name: Check every changed file against the current LIVE website
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/bp-wind-rf-jets-site"
          ARCHIVE="$(find "$RUNNER_TEMP/bp-windrf-baseline" -type f -name artifact.tar -print -quit)"
          test -n "$ARCHIVE"
          mkdir -p "$SITE"
          tar -xf "$ARCHIVE" -C "$SITE"
          export SITE
          python3 - <<'PY'
          import os,hashlib,urllib.request,urllib.error
          from pathlib import Path
          site=Path(os.environ['SITE'])
          root='https://bridgepointintelligence.online/'
          protected=['index.html','app/index.html','landing.js','app.js',
           'bridgepoint-view-v5917.js','bridgepoint-volumetric-fields-v5978.js',
           'app/bridgepoint-volumetric-fields-v5978.js','app/bridgepoint-global-wind-rf-v1.js',
           'bridgepoint-faa-obstruction-towers-v1.js','bridgepoint-drone-awareness-v1.js',
           'bridgepoint-emrf-starlink-global-v2.js','bridgepoint-wildfires-volumetric-v1.js',
           'vendor/three.module.js']
          for name in protected:
            p=site/name
            if not p.is_file():raise SystemExit('WIND_RF_PRESERVED_BASELINE_MISSING '+name)
            req=urllib.request.Request(root+name+'?windrf-check='+os.environ['GITHUB_SHA'],
              headers={'Cache-Control':'no-cache','User-Agent':'BridgePoint-Wind-RF-Only-Guard'})
            with urllib.request.urlopen(req,timeout=45) as r:live=r.read()
            if hashlib.sha256(live).digest()!=hashlib.sha256(p.read_bytes()).digest():
              raise SystemExit('WIND_RF_LIVE_CHANGED_PRESERVE_MORE_RECENT '+name)
          for name in ('bridgepoint-global-wind-rf-v1.js','wind-rf-global-v1.json'):
            if (site/name).exists():raise SystemExit('WIND_RF_RECOVERED_BY_OTHER_PUBLISH '+name)
            req=urllib.request.Request(root+name+'?windrf-check='+os.environ['GITHUB_SHA'],
              headers={'Cache-Control':'no-cache'})
            try:
              with urllib.request.urlopen(req,timeout=25) as r:status=r.status
            except urllib.error.HTTPError as e:status=e.code
            if status!=404:raise SystemExit('WIND_RF_FILE_CHANGED_CONCURRENTLY '+name+' '+str(status))
          print('WIND_RF_LIVE_BASELINE_PROTECTION_PASS',len(protected))
          PY
      - name: Overlay ONLY Wind RF Jets modules, button and fresh genuine forecast
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/bp-wind-rf-jets-site"
          python3 scripts/overlay_wind_rf_jets_v3.py "$SITE" rebuild-v5000 "$RUNNER_TEMP/bp-windrf-data/wind-rf-global-v1.json"
          node --check "$SITE/bridgepoint-view-v5917.js"
          node --input-type=module --check < "$SITE/bridgepoint-volumetric-fields-v5978.js"
          node --input-type=module --check < "$SITE/bridgepoint-global-wind-rf-v1.js"
          node --input-type=module --check < "$SITE/app/bridgepoint-global-wind-rf-v1.js"
      - uses: actions/configure-pages@v5
      - name: Upload preserved complete site with only Wind RF Jets changed
        uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-v5000-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bp-wind-rf-jets-site
          include-hidden-files: true
      - name: Publish verified Wind RF Jets only
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deploy-pages-extended.mjs
      - name: Verify live Wind RF 3D models, jet icons, same Cloudflare auth
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://bridgepointintelligence.online
          for name in bridgepoint-global-wind-rf-v1.js app/bridgepoint-global-wind-rf-v1.js wind-rf-global-v1.json; do
            passed=0
            for n in $(seq 1 15); do
              if curl -fsSL --max-time 35 -H 'Cache-Control: no-cache' "$BASE/$name?windrf=$GITHUB_SHA-$n" -o /tmp/bpwindasset; then passed=1;break;fi
              sleep 4
            done
            test "$passed" = 1 || { echo "MISSING_GLOBAL_WIND_RF_ASSET $name";exit 1;}
            echo "LIVE_WIND_RF_ASSET_PASS $name $(wc -c < /tmp/bpwindasset)"
          done
          curl --retry 5 --retry-all-errors -fsSL "$BASE/bridgepoint-global-wind-rf-v1.js?windrf=$GITHUB_SHA" -o /tmp/bp-wind-global.js
          grep -Fq 'vertexColors:false' /tmp/bp-wind-global.js
          grep -Fq 'mountJetPreview(el,row)' /tmp/bp-wind-global.js
          curl --retry 5 --retry-all-errors -fsSL "$BASE/bridgepoint-view-v5917.js?windrf=$GITHUB_SHA" -o /tmp/bp-wind-view.js
          grep -Fq 'toggleUnifiedWindRfJets' /tmp/bp-wind-view.js
          curl --retry 5 --retry-all-errors -fsSL "$BASE/index.html?windrf=$GITHUB_SHA" -o /tmp/bp-wind-html
          grep -Fq 'windrfjets=v3-current-3d-source' /tmp/bp-wind-html
          curl --retry 3 --retry-all-errors -fsSL https://characterization-seas-total-adopt.trycloudflare.com/auth/v1/health | grep -Fq '"local":true'
          echo WIND_RF_3D_JETS_GLOBAL_PUBLISHED_LIVE_SUCCESS

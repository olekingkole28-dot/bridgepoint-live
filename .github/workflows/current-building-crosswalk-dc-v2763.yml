name: Current Building Crosswalk DC v2763

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/current-building-crosswalk-dc-v2763.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: bridgepoint-current-building-crosswalk-dc-v2763
  cancel-in-progress: true

env:
  SUPABASE_URL: https://xdfsjztwgsbmabshzsjw.supabase.co

jobs:
  dc-crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned data dependencies
        run: python -m pip install --disable-pip-version-check duckdb==1.4.1 pyarrow==21.0.0 requests==2.32.5
      - name: Verify renewable GitHub OIDC endpoint
        shell: bash
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
      - name: Build DC exact authoritative crosswalk
        run: python scripts/build-current-building-crosswalk-v2752.py --state DC

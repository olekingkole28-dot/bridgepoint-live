            Object.values(materials).forEach(x=>owned.add(x));
            const hemi=new T.HemisphereLight(0xd9e9ff,0x7f8587,2.2),sun=new T.DirectionalLight(0xfff3db,2.5);sun.position.set(-2,4,1);scene.add(hemi,sun);
            const B=m.podiumWidthM/2,H=m.parapetM,P=60.96,C=m.crownWidthM/Math.sqrt(2);
            const base=[[-B,-B],[B,-B],[B,B],[-B,B]],top=[[0,-C],[C,0],[0,C],[-C,0]];
            const pts=[],norm=[],uv=[];
            function tri(a,b,c){
              const av=new T.Vector3(...a),bv=new T.Vector3(...b),cv=new T.Vector3(...c),n=bv.clone().sub(av).cross(cv.clone().sub(av)).normalize(),center=av.clone().add(bv).add(cv).multiplyScalar(1/3);
              if(n.x*center.x+n.z*center.z<0){[b,c]=[c,b];n.negate();}

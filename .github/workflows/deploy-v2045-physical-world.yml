name: Deploy V2060 Immersive World onto V1997 Map

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'release-v1997/map-v2045-physical-world.js'
      - 'release-v1997/map-v2060-immersive-world.js'
      - 'release-v1997/map-v1997-weather-hotfix.js'
      - '.github/workflows/deploy-v2045-physical-world.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Layer V2060 onto existing V1997 live artifact
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main live-artifact
          git checkout -B live-artifact origin/live-artifact
          test -s app/map-v1997.js
          test -s app/map-v2002-property-click.js
          test -s app/v1998-live-extras.js
          test -s app/owner-physical-world-v2020.js
          git show origin/main:release-v1997/map-v2045-physical-world.js > app/map-v2045-physical-world.js
          git show origin/main:release-v1997/map-v2060-immersive-world.js > app/map-v2060-immersive-world.js
          git show origin/main:release-v1997/map-v1997-weather-hotfix.js > app/map-v1997-weather-hotfix.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('app/index.html')
          s=p.read_text()
          s=re.sub(r'\s*<script[^>]+src=["\']\./map-v1997-weather-hotfix\.js[^"\']*["\'][^>]*></script>','',s,flags=re.I)
          s=s.replace('</body>','<script defer src="./map-v1997-weather-hotfix.js?v=2060"></script>\n</body>')
          p.write_text(s)

          sw=Path('app/flutter_service_worker.js')
          x=sw.read_text()
          x=re.sub(r"const CACHE='bridgepoint-universe-v\d+';","const CACHE='bridgepoint-universe-v2060';",x)
          # Remove older duplicate versioned entries before adding the current set.
          x=re.sub(r",?'\./map-v1997-weather-hotfix\.js\?v=\d+'",'',x)
          x=re.sub(r",?'\./map-v2045-physical-world\.js\?v=\d+'",'',x)
          x=re.sub(r",?'\./map-v2060-immersive-world\.js\?v=\d+'",'',x)
          x=x.replace("'./map-v1997.js?v=1997',","'./map-v1997.js?v=1997','./map-v1997-weather-hotfix.js?v=2060','./map-v2045-physical-world.js?v=2055','./map-v2060-immersive-world.js?v=2060',")
          sw.write_text(x)
          PY
          node --check app/map-v1997.js
          node --check app/map-v1997-weather-hotfix.js
          node --check app/map-v2045-physical-world.js
          node --check app/map-v2060-immersive-world.js
          node --check app/map-v2002-property-click.js
          node --check app/flutter_service_worker.js
          grep -Fq 'bridgepoint_3d_world_viewport_v1997' app/map-v1997.js
          grep -Fq 'bridgepoint_live_map_weather_scene_v1997' app/map-v1997.js
          grep -Fq 'map-v2002-property-click.js?v=2002' app/map-v1997-weather-hotfix.js
          grep -Fq 'map-v2045-physical-world.js?v=2055' app/map-v1997-weather-hotfix.js
          grep -Fq 'map-v2060-immersive-world.js?v=2060' app/map-v1997-weather-hotfix.js
          grep -Fq '__bridgepointImmersiveWorldV2060' app/map-v2060-immersive-world.js
          grep -Fq 'bridgepoint_3d_world_viewport_v1997' app/map-v2060-immersive-world.js
          grep -Fq 'bridgepoint_live_map_boundary_scene_v1997' app/map-v2060-immersive-world.js
          grep -Fq 'drawHurricane' app/map-v2060-immersive-world.js
          grep -Fq 'drawTornado' app/map-v2060-immersive-world.js
          grep -Fq 'drawHail' app/map-v2060-immersive-world.js
          grep -Fq 'drawRain' app/map-v2060-immersive-world.js
          grep -Fq 'drawFire' app/map-v2060-immersive-world.js
          grep -Fq 'map-v1997-weather-hotfix.js?v=2060' app/index.html
          grep -Fq "bridgepoint-universe-v2060" app/flutter_service_worker.js
          grep -Fq "map-v2060-immersive-world.js?v=2060" app/flutter_service_worker.js

      - name: Persist upgraded live artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/index.html app/flutter_service_worker.js app/map-v1997-weather-hotfix.js app/map-v2045-physical-world.js app/map-v2060-immersive-world.js
          if ! git diff --cached --quiet; then
            git commit -m 'Publish V2060 immersive world on V1997 map'
            git push origin HEAD:live-artifact
          fi
          rm -rf site && mkdir site
          git archive --format=tar HEAD | tar -xf - -C site
          touch site/.nojekyll site/app/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-v2060
          path: site
      - name: Deploy V1997 + V2060 current map
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-v2060

      - name: Verify production V2060 immersive world
        shell: bash
        run: |
          set -euo pipefail
          origin='https://bridgepointintelligence.online'
          ok=0
          for attempt in $(seq 1 36); do
            salt="${GITHUB_SHA}-${attempt}-$(date +%s)"
            curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$origin/app/?bpv=2060&verify=$salt" -o /tmp/app.html || true
            curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$origin/app/map-v1997-weather-hotfix.js?verify=$salt" -o /tmp/hotfix.js || true
            curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$origin/app/map-v2060-immersive-world.js?verify=$salt" -o /tmp/world.js || true
            curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$origin/app/flutter_service_worker.js?verify=$salt" -o /tmp/sw.js || true
            if grep -Fq 'map-v1997-weather-hotfix.js?v=2060' /tmp/app.html \
              && grep -Fq 'map-v2060-immersive-world.js?v=2060' /tmp/hotfix.js \
              && grep -Fq '__bridgepointImmersiveWorldV2060' /tmp/world.js \
              && grep -Fq 'bridgepoint_3d_world_viewport_v1997' /tmp/world.js \
              && grep -Fq 'drawHurricane' /tmp/world.js \
              && grep -Fq 'drawTornado' /tmp/world.js \
              && grep -Fq 'drawHail' /tmp/world.js \
              && grep -Fq 'drawRain' /tmp/world.js \
              && grep -Fq 'drawFire' /tmp/world.js \
              && grep -Fq 'bridgepoint-universe-v2060' /tmp/sw.js; then
              ok=1
              echo 'V1997_CORE_PLUS_V2060_IMMERSIVE_WORLD_LIVE'
              break
            fi
            sleep 5
          done
          test "$ok" = 1

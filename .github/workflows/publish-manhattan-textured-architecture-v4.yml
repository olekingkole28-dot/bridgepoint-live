          s=s.replace("bytes('/assets/manhattan-photogrammetry-v1/source-architecture-v3.glb')","bytes('/assets/manhattan-photogrammetry-v1/textured-architecture-v4.glb')")
          assert s.count("if(!o.geometry.getAttribute('_bpdetail'))throw Error('missing source facade attributes');")==1
          s=s.replace("if(!o.geometry.getAttribute('_bpdetail'))throw Error('missing source facade attributes');","if(!o.geometry.getAttribute('uv')||!o.material.map)throw Error('missing baked source facade texture');")

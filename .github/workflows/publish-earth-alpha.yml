name: Publish BridgePoint Earth Alpha

on:
  push:
    branches: [main, live-artifact]
    paths:
      - ".github/workflows/publish-earth-alpha.yml"
      - "earth/**"
      - "earth-upgrade-notice.js"
      - "index.html"
      - "app/index.html"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-earth-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout the live website artifact
        uses: actions/checkout@v4
        with:
          ref: live-artifact
          fetch-depth: 1

      - name: Validate Earth renderer and preserve current app contracts
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s app/index.html
          test -s landing.js
          test -s app.js
          test -s world-v2300-map.js
          test -s world-v2300-config.js
          test -s earth/index.html
          test -s earth/earth.css
          test -s earth/earth.js
          test -s earth-upgrade-notice.js

          cp earth/earth.js /tmp/bridgepoint-earth.mjs
          node --check /tmp/bridgepoint-earth.mjs
          node --check earth-upgrade-notice.js
          node --check app.js
          node --check landing.js

          grep -Fq 'Cesium.js' earth/index.html
          grep -Fq 'CustomHeightmapTerrainProvider' earth/earth.js
          grep -Fq 'GeographicTilingScheme' earth/earth.js
          grep -Fq 'function addPlaceLabel' earth/earth.js
          grep -Fq 'function viewCenterCartographic' earth/earth.js
          grep -Fq 'layers.transportation_name' earth/earth.js
          grep -Fq 'state.buildingState' earth/earth.js
          grep -Fq 'fromDegrees(-73.9857,40.7484,17800000)' earth/earth.js
          grep -Fq 'function moveToZoomLevel' earth/earth.js
          grep -Fq "earthParams.get('height')" earth/earth.js
          grep -Fq 'NASA global fallback' earth/earth.js
          grep -Fq 'const startHeight=clamp' earth/earth.js
          ! grep -Fq 'MODIS_Terra_CorrectedReflectance_TrueColor' earth/earth.js
          grep -Fq 'bridgepoint_building_viewport_v2300' earth/earth.js
          grep -Fq 'bridgepoint_public_global_parcels_bbox_v957' earth/earth.js
          grep -Fq 'bridgepoint-world-effects-v2190' earth/earth.js
          grep -Fq 'bridgepoint_living_world_scene_v2652' earth/earth.js
          grep -Fq 'earth-upgrade-notice.js' index.html
          grep -Fq 'earth-upgrade-notice.js' app/index.html
          grep -Fq '/earth/?embed=1' earth-upgrade-notice.js

          # The current MapLibre app remains in place during this renderer migration.
          # The new Cesium globe is served as its own route and preview, not mixed into its old map DOM.
          ! grep -Fqi 'Cesium' index.html
          ! grep -Fqi 'Cesium' app/index.html
          echo "BRIDGEPOINT_EARTH_ALPHA_VALIDATION_OK"

      - name: Assemble GitHub Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          tar --exclude=.git --exclude=.github --exclude=_site -cf - . | tar -xf - -C _site
          touch _site/.nojekyll
          test -s _site/earth/index.html
          test -s _site/earth/earth.js

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Earth alpha artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-earth-alpha
          path: _site

      - name: Publish BridgePoint Earth alpha
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: bridgepoint-earth-alpha

      - name: Verify public Earth route and rebuild notice
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 3 "${PAGE_URL}earth/" -o /tmp/earth.html
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 3 "${PAGE_URL}earth/earth.js?v=4" -o /tmp/earth.js
          curl --fail --silent --show-error --retry 6 --retry-all-errors --retry-delay 3 "${PAGE_URL}earth-upgrade-notice.js?v=1" -o /tmp/notice.js
          grep -Fq 'BUILDING THE NEW EARTH' /tmp/earth.html
          grep -Fq 'bridgepoint_building_viewport_v2300' /tmp/earth.js
          grep -Fq 'GeographicTilingScheme' /tmp/earth.js
          grep -Fq 'function addPlaceLabel' /tmp/earth.js
          grep -Fq 'function viewCenterCartographic' /tmp/earth.js
          grep -Fq 'layers.transportation_name' /tmp/earth.js
          grep -Fq 'function moveToZoomLevel' /tmp/earth.js
          grep -Fq "earthParams.get('height')" /tmp/earth.js
          grep -Fq 'NASA global fallback' /tmp/earth.js
          grep -Fq 'BRIDGEPOINT EARTH IS BEING REBUILT' /tmp/notice.js
          echo "BRIDGEPOINT_EARTH_PUBLIC_ROUTE_OK ${PAGE_URL}earth/"

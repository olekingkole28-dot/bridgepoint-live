name: Deploy BridgePoint V1061 Navigation Repair
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v1061-nav.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Assemble exact tested V1061 artifact
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          expected='3bd4694c9db41d130800fb2b6032c1452c0537a1'
          actual="$(git rev-parse origin/live-artifact)"
          echo "LIVE_ARTIFACT=${actual}"
          test "$actual" = "$expected"
          rm -rf site && mkdir site
          git archive --format=tar origin/live-artifact | tar -xf - -C site
          cd site/app
          test -s index.html
          test -s nav-single-owner-v1061.js
          node --check nav-single-owner-v1061.js
          grep -q 'data-bridgepoint-runtime="v1061"' index.html
          grep -q 'nav-single-owner-v1061.js?v=1061' index.html
          grep -q "nav.id='bp1061-nav'" nav-single-owner-v1061.js
          grep -q "#bp1055-nav,#bp1055-more-button" nav-single-owner-v1061.js
          grep -q "BridgePointOpenPropertiesV1042" nav-single-owner-v1061.js
          grep -q "BridgePointWorkHubV1054" nav-single-owner-v1061.js
          grep -q "BridgePointOpenMoreV1042" nav-single-owner-v1061.js
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' nav-single-owner-v1061.js index.html
          cd ../..
          touch site/.nojekyll site/app/.nojekyll
      - uses: actions/configure-pages@v5
        with: {enablement: true}
      - uses: actions/upload-pages-artifact@v4
        with: {path: site}
      - name: Deploy exact V1061
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public V1061 files
        run: |
          set -euo pipefail
          origin='https://bridgepointintelligence.online'
          for attempt in $(seq 1 18); do
            salt="${GITHUB_SHA}-${attempt}-$(date +%s)"
            app="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache, no-store' "${origin}/app/?bpv=1061&verify=${salt}" 2>/dev/null || true)"
            nav="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache, no-store' "${origin}/app/nav-single-owner-v1061.js?verify=${salt}" 2>/dev/null || true)"
            if printf '%s' "$app" | grep -q 'data-bridgepoint-runtime="v1061"' \
              && printf '%s' "$app" | grep -q 'nav-single-owner-v1061.js?v=1061' \
              && printf '%s' "$nav" | grep -q "nav.id='bp1061-nav'" \
              && printf '%s' "$nav" | grep -q "BridgePointOpenPropertiesV1042"; then
              echo PUBLIC_FILES_V1061_PASS
              exit 0
            fi
            sleep 5
          done
          echo 'V1061 files did not converge publicly' >&2
          exit 1
      - name: Verify public mobile shell
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          cd /tmp && npm init -y >/dev/null 2>&1 && npm install puppeteer-core@24 --no-audit --no-fund >/dev/null 2>&1
          CHROME_PATH="$CHROME" node <<'NODE'
          const puppeteer=require('puppeteer-core'),assert=require('assert');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,protocolTimeout:45000,executablePath:process.env.CHROME_PATH,args:['--no-sandbox','--disable-dev-shm-usage']});
            try{
              const p=await browser.newPage();await p.setViewport({width:390,height:844,deviceScaleFactor:2,isMobile:true,hasTouch:true});
              await p.goto('https://bridgepointintelligence.online/app/?v1061public='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
              await p.waitForFunction(()=>window.__bridgepointNavSingleOwnerV1061===true,{timeout:18000});
              assert.strictEqual(await p.$('#bp1055-nav'),null,'legacy nav must not remain in public DOM');
              assert.strictEqual(await p.$('#bp1055-more-button'),null,'legacy header More must not remain');
              assert.deepStrictEqual(await p.$$eval('#bp1061-nav [data-tab]',els=>els.map(e=>e.dataset.tab)),['home','map','properties','work','more']);
              for(const tab of ['home','map','properties','work','more']){
                const b=await p.$(`#bp1061-nav [data-tab="${tab}"]`);assert.ok(b,`${tab} missing`);
              }
              console.log('PUBLIC_MOBILE_V1061_PASS');
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
name: Deploy BridgePoint Website + App

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-tracking-v421.yml
      - acquisition_tracker.js
      - landing/**
      - articles/**
      - sample/**
      - owner/**
      - robots.txt
      - sitemap.xml
      - llms.txt
      - dc8a83e4caade76fd824cf929dca48d6.txt
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore immutable audited Flutter app
        run: |
          set -euo pipefail
          git fetch origin app-artifact-v422:refs/remotes/origin/app-artifact-v422
          rm -rf site /tmp/bridgepoint-app
          mkdir -p site /tmp/bridgepoint-app site/app
          git archive --format=tar origin/app-artifact-v422 | tar -xf - -C /tmp/bridgepoint-app
          test -s /tmp/bridgepoint-app/index.html
          test -s /tmp/bridgepoint-app/main.dart.js
          test -s /tmp/bridgepoint-app/acquisition_tracker.js
          test -s /tmp/bridgepoint-app/bridgepoint-release.json
          grep -q '2e111cc765d23533e2adf953b44a5578201a0790' /tmp/bridgepoint-app/bridgepoint-release.json
          grep -q 'https://bridgepointintelligence.online/' /tmp/bridgepoint-app/bridgepoint-release.json
          grep -q 'acquisition_tracker.js' /tmp/bridgepoint-app/index.html
          if grep -q 'service_role' /tmp/bridgepoint-app/acquisition_tracker.js; then
            echo 'Forbidden privileged credential marker found in browser tracker.' >&2
            exit 1
          fi
          cp -a /tmp/bridgepoint-app/. site/app/
          rm -rf site/app/articles site/app/sample site/app/landing site/app/owner
          test -s acquisition_tracker.js
          grep -q 'captureVersion=436' acquisition_tracker.js
          grep -q 'bridgepoint-coarse-geo-v436' acquisition_tracker.js
          if grep -q 'service_role' acquisition_tracker.js; then
            echo 'Forbidden privileged credential marker found in v436 browser tracker.' >&2
            exit 1
          fi
          cp acquisition_tracker.js site/acquisition_tracker.js
          cp acquisition_tracker.js site/app/acquisition_tracker.js
          touch site/.nojekyll site/app/.nojekyll
          echo 'Audited Flutter application preserved at /app/ with acquisition tracker v436 overlaid.'

      - name: Overlay public national website, research, territory request, owner acquisition and discovery files
        run: |
          set -euo pipefail
          test -s landing/index.html
          test -d articles
          test -d sample
          test -d owner
          test -s owner/acquisition/index.html
          test -s robots.txt
          test -s sitemap.xml
          test -s llms.txt
          test -s dc8a83e4caade76fd824cf929dca48d6.txt
          cp landing/index.html site/index.html
          cp -a articles site/articles
          cp -a sample site/sample
          cp -a owner site/owner
          cp robots.txt sitemap.xml llms.txt dc8a83e4caade76fd824cf929dca48d6.txt site/
          python - <<'PY'
          from pathlib import Path
          p=Path('site/index.html')
          s=p.read_text(encoding='utf-8')
          guard="""<script>(function(){try{if(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true){window.location.replace('/app/'+window.location.search+window.location.hash)}}catch(e){}})();</script>"""
          discovery="""<link rel=\"canonical\" href=\"https://bridgepointintelligence.online/\">\n<link rel=\"alternate\" type=\"application/rss+xml\" title=\"BridgePoint Intelligence Research\" href=\"https://bridgepointintelligence.online/articles/feed.xml\">\n<meta property=\"og:type\" content=\"website\">\n<meta property=\"og:title\" content=\"BridgePoint Intelligence | U.S. Property Intelligence\">\n<meta property=\"og:description\" content=\"Explainable property intelligence built from matched records, weather exposure, property change and other permitted evidence.\">\n<meta property=\"og:url\" content=\"https://bridgepointintelligence.online/\">\n<script type=\"application/ld+json\">{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"Organization\",\"@id\":\"https://bridgepointintelligence.online/#organization\",\"name\":\"BridgePoint Intelligence\",\"url\":\"https://bridgepointintelligence.online/\"},{\"@type\":\"SoftwareApplication\",\"@id\":\"https://bridgepointintelligence.online/#software\",\"name\":\"BridgePoint Intelligence\",\"applicationCategory\":\"BusinessApplication\",\"operatingSystem\":\"Web\",\"url\":\"https://bridgepointintelligence.online/app/\",\"description\":\"Property intelligence platform that combines matched public/property records, weather exposure, property changes and other permitted evidence into explainable prioritization for property-focused teams.\",\"publisher\":{\"@id\":\"https://bridgepointintelligence.online/#organization\"}}]}</script>"""
          s=s.replace('</head>',discovery+'\n'+guard+'\n</head>')
          p.write_text(s,encoding='utf-8')
          PY
          test -s site/index.html
          test -s site/app/index.html
          test -s site/app/main.dart.js
          test -s site/acquisition_tracker.js
          test -s site/app/acquisition_tracker.js
          grep -q 'captureVersion=436' site/acquisition_tracker.js
          grep -q 'captureVersion=436' site/app/acquisition_tracker.js
          grep -q 'bridgepoint-coarse-geo-v436' site/acquisition_tracker.js
          test -s site/articles/index.html
          test -s site/articles/feed.xml
          test -s site/sample/index.html
          test -s site/owner/acquisition/index.html
          grep -q 'bridgepoint_owner_acquisition_v432' site/owner/acquisition/index.html
          grep -q 'noindex,nofollow,noarchive' site/owner/acquisition/index.html
          test -s site/robots.txt
          test -s site/sitemap.xml
          test -s site/llms.txt
          test -s site/dc8a83e4caade76fd824cf929dca48d6.txt
          grep -q 'U.S. property intelligence platform' site/index.html
          grep -q 'application/ld+json' site/index.html
          grep -q '/app/' site/index.html
          grep -q 'request_territory_sample_v425' site/sample/index.html
          echo 'National website, app, state-aware funnel v436, owner acquisition view, research and territory funnel prepared.'

      - name: Refresh durable deployed website branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/live-artifact
          mkdir /tmp/live-artifact
          cp -a site/. /tmp/live-artifact/
          cd /tmp/live-artifact
          git init
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m 'BridgePoint national website with state resolver v436'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish BridgePoint
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify IndexNow discovery network
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          payload={
            'host':'bridgepointintelligence.online',
            'key':'dc8a83e4caade76fd824cf929dca48d6',
            'keyLocation':'https://bridgepointintelligence.online/dc8a83e4caade76fd824cf929dca48d6.txt',
            'urlList':[
              'https://bridgepointintelligence.online/',
              'https://bridgepointintelligence.online/articles/',
              'https://bridgepointintelligence.online/articles/feed.xml',
              'https://bridgepointintelligence.online/articles/auto/',
              'https://bridgepointintelligence.online/articles/auto/feed.xml',
              'https://bridgepointintelligence.online/sample/',
              'https://bridgepointintelligence.online/app/'
            ]
          }
          open('/tmp/indexnow.json','w',encoding='utf-8').write(json.dumps(payload))
          PY
          code="$(curl -sS -o /tmp/indexnow-response.txt -w '%{http_code}' -X POST 'https://api.indexnow.org/indexnow' -H 'Content-Type: application/json; charset=utf-8' --data-binary @/tmp/indexnow.json || true)"
          echo "IndexNow HTTP ${code}"
          cat /tmp/indexnow-response.txt || true
          if [ "$code" != "200" ] && [ "$code" != "202" ]; then
            echo 'IndexNow notification did not confirm acceptance; deployment remains valid and the next publish will retry.'
          fi

      - name: Record verified national website deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          receipt={
            'status':'PUBLISHED',
            'base_release_sha':'2e111cc765d23533e2adf953b44a5578201a0790',
            'tracking_version':436,
            'coarse_geo_resolver_version':436,
            'owner_funnel_version':432,
            'owner_acquisition_view_version':432,
            'owned_media_publication_version':435,
            'sample_request_version':426,
            'public_landing_version':427,
            'public_discovery_version':428,
            'capture':'FIRST_PARTY_BROWSER_WITH_BRIDGEPOINT_COARSE_STATE_RESOLVER',
            'public_home':'/',
            'app_path':'/app/',
            'research_hub':'/articles/',
            'automatic_research_hub':'/articles/auto/',
            'research_feed':'/articles/feed.xml',
            'automatic_research_feed':'/articles/auto/feed.xml',
            'owner_acquisition_path':'/owner/acquisition/',
            'territory_request':'/sample/',
            'sitemap':'/sitemap.xml',
            'ai_discovery':'/llms.txt',
            'indexnow_enabled':True,
            'exact_ip_stored':False,
            'deployed_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'public_origin':'https://bridgepointintelligence.online/',
            'pages_url':os.environ.get('PAGE_URL'),
            'immutable_app_branch':'app-artifact-v422',
            'durable_artifact_branch':'live-artifact',
            'contains_privileged_secret':False
          }
          open('tracking-release-status.json','w',encoding='utf-8').write(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tracking-release-status.json
          git commit -m 'Record state resolver v436 deployment [skip ci]' || true
          git push origin HEAD:main

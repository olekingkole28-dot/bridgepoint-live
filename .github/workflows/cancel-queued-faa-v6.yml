name: Stop unintended shipwreck job blocking EMRF Wildfire restore
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cancel-queued-faa-v6.yml']
permissions:
  actions: write
  contents: read
jobs:
  cancel-unintended-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel only shipwreck job accidentally triggered by EMRF visibility edit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Cancelling only incidental shipwreck run 44840704161"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/44840704161/cancel" ||
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/44840704161" --jq '{status,conclusion}'

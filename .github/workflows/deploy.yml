name: Deploy BridgePoint Live

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download audited BridgePoint v315 production build
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-ca88-822f-bd5c-82a5406fb791/raw?se=2026-08-18T03%3A12%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=f4095b0d-ab56-59f0-883c-53da52d3d6ad&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-17T22%3A42%3A55Z&ske=2026-08-18T22%3A42%3A55Z&sks=b&skv=2026-02-06&sig=fMqdbA97gDzr6E2AiiEYbQbm34HyLcc7jY5aHJfDiws%3D' -o /tmp/bridgepoint-v315.zip
          echo 'b8538ea9d8819285163deb619856937194c60f6abc8b5e5cb5a968f0ccc13416  /tmp/bridgepoint-v315.zip' | sha256sum -c -
          rm -rf site
          mkdir -p site
          unzip -q /tmp/bridgepoint-v315.zip -d site
          touch site/.nojekyll
          sed -i 's#<base href="/">#<base href="./">#' site/index.html

          test -s site/index.html
          test -s site/main.dart.js
          test -s site/bridgepoint-release.json
          grep -q '40ee5a45c03d05f22dd09496dfb2fa2f1fb34037' site/bridgepoint-release.json
          grep -q 'https://bridgepointintelligence.online/' site/bridgepoint-release.json

          # Install / PWA contracts must remain present.
          grep -q 'bridgepoint-v310-install-onboarding' site/index.html
          grep -q 'Put BridgePoint on your home screen' site/index.html
          grep -q 'beforeinstallprompt' site/index.html
          grep -q 'Add to Home Screen' site/index.html

          # Final customer/owner release contracts compiled into this audited artifact.
          grep -q 'DENSITY HEAT' site/main.dart.js
          grep -q 'BridgePoint Community Chat' site/main.dart.js
          grep -q 'NOAA LIVE RAIN RADAR' site/main.dart.js
          grep -q 'Meet the Owner' site/main.dart.js
          grep -q 'Customer preview' site/main.dart.js
          grep -q 'Investor Room' site/main.dart.js
          grep -q 'Preview package fit' site/main.dart.js
          grep -q 'BEST ACTIONABLE FIT' site/main.dart.js
          grep -q 'bridgepoint-v314-investor-room' site/main.dart.js

          if grep -q 'BridgePoint V81 uses negative scoring' site/main.dart.js; then
            echo 'Legacy technical customer wording unexpectedly remains.' >&2
            exit 1
          fi
          echo 'BridgePoint v315 audited production artifact ready for deployment.'

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish BridgePoint
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record verified live deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          release=json.loads(Path('site/bridgepoint-release.json').read_text(encoding='utf-8'))
          receipt={
            'status':'PUBLISHED',
            'release_sha':release['version'],
            'built_at':release.get('built_at'),
            'deployed_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'public_origin':release.get('public_origin'),
            'pages_url':os.environ.get('PAGE_URL'),
            'artifact_sha256':'b8538ea9d8819285163deb619856937194c60f6abc8b5e5cb5a968f0ccc13416',
            'release_label':'BridgePoint v315 final polish + Investor Room + catalog-aware package fit'
          }
          Path('live-release-status.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(receipt,indent=2))
          PY
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add live-release-status.json
          git commit -m 'Record BridgePoint v315 live deployment [skip ci]'
          git push origin HEAD:main

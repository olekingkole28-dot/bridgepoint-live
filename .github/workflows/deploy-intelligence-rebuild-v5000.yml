                ];
                for(const x of moves){m.easeTo({...x,duration:520});await new Promise(r=>setTimeout(r,650))}
                await new Promise(r=>setTimeout(r,700));active=false;
                const sorted=gaps.filter(x=>Number.isFinite(x)&&x>0).sort((a,b)=>a-b);
                const p95=sorted.length?sorted[Math.min(sorted.length-1,Math.floor(sorted.length*.95))]:0;
                return {frames:sorted.length,maxGapMs:sorted.length?sorted[sorted.length-1]:0,p95GapMs:p95}
              });

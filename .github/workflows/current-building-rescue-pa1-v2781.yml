name: Current Building Rescue PA1 v2781

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/current-building-rescue-pa1-v2781.yml'

permissions:
  contents: read
  id-token: write
  checks: read

concurrency:
  group: bridgepoint-current-building-rescue-pa1-v2781
  cancel-in-progress: false

env:
  SUPABASE_URL: https://xdfsjztwgsbmabshzsjw.supabase.co
  RESCUE_STATE: PA
  RESCUE_LANE: '1'
  RESCUE_LANES: '5'
  ORIGINAL_JOB_ID: '103086423628'

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        sublane: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check duckdb==1.4.1 pyarrow==21.0.0 requests==2.32.5
      - name: Reconcile exact rescue sublane
        run: >
          python scripts/build-current-building-crosswalk-spatial-sublane-v2780.py
          --state "$RESCUE_STATE"
          --lane "$RESCUE_LANE"
          --lanes "$RESCUE_LANES"
          --sublane "${{ matrix.sublane }}"
          --sublanes 4
      - uses: actions/upload-artifact@v4
        with:
          name: rescue-PA-1-${{ matrix.sublane }}
          path: rescue-v2780/
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: split
    if: always() && needs.split.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check duckdb==1.4.1 pyarrow==21.0.0 requests==2.32.5
      - uses: actions/download-artifact@v4
        with:
          pattern: rescue-PA-1-*
          path: downloaded-rescue-v2780
          merge-multiple: true
      - name: Do not race the original parent writer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for _ in $(seq 1 280); do
            body="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/$GITHUB_REPOSITORY/check-runs/$ORIGINAL_JOB_ID")"
            status="$(python -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' <<<"$body")"
            if [[ "$status" == "completed" ]]; then exit 0; fi
            sleep 15
          done
          echo "Original writer did not conclude inside rescue gate" >&2
          exit 1
      - name: Merge, collision-audit, upload and import parent lane
        run: >
          python scripts/merge-current-building-crosswalk-rescue-v2780.py
          --state "$RESCUE_STATE"
          --lane "$RESCUE_LANE"
          --lanes "$RESCUE_LANES"
          --sublanes 4

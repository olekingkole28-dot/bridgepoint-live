name: Verify BridgePoint V441 Mobile CTA

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-v441-mobile-cta.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bridgepoint-v441-mobile-cta
  cancel-in-progress: true

jobs:
  verify-mobile-cta:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install browser controller
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24 >/dev/null

      - name: Exercise live V441 gold CTA with real touch input
        id: mobile
        continue-on-error: true
        env:
          ORIGIN: https://bridgepointintelligence.online
          EXPECTED_SOURCE_SHA: 5f4114197d834adbb368895238188b57940e279c
          EXPECTED_ARTIFACT_SHA256: 7e18e90df85526abc7ec001fbd506f72afd8e140b178282347b60e5643848d9c
        run: |
          set -uo pipefail
          mkdir -p /tmp/v441-mobile
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          export CHROME
          cat >/tmp/v441-mobile/verify.cjs <<'JS'
          const puppeteer=require('puppeteer-core');
          const fs=require('fs');
          const result={status:'FAILED',checkedAt:new Date().toISOString(),publicOrigin:process.env.ORIGIN,sourceSha:process.env.EXPECTED_SOURCE_SHA,artifactSha256:process.env.EXPECTED_ARTIFACT_SHA256,checks:{},error:null};
          const write=()=>fs.writeFileSync('/tmp/v441-mobile/result.json',JSON.stringify(result,null,2)+'\n');
          const fail=(message)=>{throw new Error(message)};
          (async()=>{
            const releaseRes=await fetch(`${process.env.ORIGIN}/app/bridgepoint-release.json?t=${process.env.GITHUB_RUN_ID||Date.now()}`);
            if(!releaseRes.ok)fail(`release marker HTTP ${releaseRes.status}`);
            const release=await releaseRes.json();
            result.release=release;
            if(release.version!==441)fail(`expected release 441, got ${release.version}`);
            if(release.source_sha!==process.env.EXPECTED_SOURCE_SHA)fail(`source SHA mismatch: ${release.source_sha}`);
            if(release.artifact_sha256!==process.env.EXPECTED_ARTIFACT_SHA256)fail(`artifact SHA mismatch: ${release.artifact_sha256}`);
            result.checks.releaseReceipt=true;

            if(!process.env.CHROME)fail('Chrome/Chromium executable missing');
            const browser=await puppeteer.launch({
              executablePath:process.env.CHROME,
              headless:true,
              protocolTimeout:30000,
              args:['--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--disable-software-rasterizer','--disable-background-networking','--disable-sync']
            });
            try{
              const page=await browser.newPage();
              page.setDefaultTimeout(15000);
              await page.setViewport({width:390,height:844,deviceScaleFactor:1,isMobile:true,hasTouch:true});
              await page.setUserAgent('Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1');
              const pageErrors=[];
              page.on('pageerror',e=>pageErrors.push(String(e.message||e)));
              await page.goto(`${process.env.ORIGIN}/app/?mode=signin&verify_mobile_touch=${process.env.GITHUB_RUN_ID||Date.now()}`,{waitUntil:'domcontentloaded',timeout:20000});
              await new Promise(r=>setTimeout(r,1800));
              await page.evaluate(()=>{
                const backdrop=document.getElementById('bp-install-backdrop');
                if(backdrop?.classList.contains('show'))document.getElementById('bp-install-later')?.click();
                window.bridgePointInstallPromptReadyV441=false;
                window.dispatchEvent(new Event('bridgepoint-install-capability-change'));
              });
              await new Promise(r=>setTimeout(r,250));
              const before=await page.evaluate(()=>{
                const b=document.getElementById('bp-install-fab-v439');
                if(!b)return {missing:true};
                const r=b.getBoundingClientRect();
                const cs=getComputedStyle(b);
                const top=document.elementFromPoint(r.left+r.width/2,r.top+r.height/2);
                return {missing:false,text:(b.innerText||'').replace(/\s+/g,' ').trim(),left:r.left,top:r.top,width:r.width,height:r.height,right:r.right,bottom:r.bottom,display:cs.display,visibility:cs.visibility,pointerEvents:cs.pointerEvents,touchAction:cs.touchAction,centerElementId:top?.id||null,centerInsideButton:Boolean(top===b||top?.closest?.('#bp-install-fab-v439')),viewportWidth:innerWidth,viewportHeight:innerHeight,scrollWidth:document.documentElement.scrollWidth};
              });
              result.before=before;
              if(before.missing)fail('gold CTA missing');
              if(before.display==='none'||before.visibility==='hidden'||before.pointerEvents==='none')fail(`gold CTA is not interactive: ${JSON.stringify(before)}`);
              if(before.height<52)fail(`gold CTA touch target ${before.height}px is below 52px`);
              if(before.left<0||before.right>before.viewportWidth+1||before.top<0||before.bottom>before.viewportHeight+1)fail(`gold CTA is outside the mobile viewport: ${JSON.stringify(before)}`);
              if(before.scrollWidth>before.viewportWidth+4)fail(`horizontal overflow before tap: ${before.scrollWidth} > ${before.viewportWidth}`);
              if(!before.centerInsideButton)fail(`another element intercepts the CTA center: ${JSON.stringify(before)}`);
              if(!before.text.includes('DOWNLOAD / OPEN APP'))fail(`unexpected unsupported-install copy: ${before.text}`);
              result.checks.visibleTouchTarget=true;
              result.checks.noPointerInterception=true;
              result.checks.noHorizontalOverflowBeforeTap=true;

              await page.touchscreen.tap(before.left+before.width/2,before.top+before.height/2);
              await page.waitForFunction(()=>document.getElementById('bp-install-backdrop')?.classList.contains('show'),{timeout:5000});
              result.checks.realTouchTapOpenedGuide=true;
              const fallback=await page.evaluate(()=>{
                const a=document.getElementById('bp-install-fallback-v441');
                if(!a)return {missing:true};
                const r=a.getBoundingClientRect();
                const cs=getComputedStyle(a);
                return {missing:false,text:(a.textContent||'').trim(),href:a.getAttribute('href'),left:r.left,top:r.top,width:r.width,height:r.height,display:cs.display,visibility:cs.visibility,pointerEvents:cs.pointerEvents};
              });
              result.fallback=fallback;
              if(fallback.missing||fallback.display==='none'||fallback.visibility==='hidden'||fallback.pointerEvents==='none')fail(`fallback is not visible/interactable: ${JSON.stringify(fallback)}`);
              if(fallback.height<44)fail(`fallback touch target ${fallback.height}px is below 44px`);
              if(!fallback.href?.includes('/app/?mode=signin')||!fallback.href.includes('utm_campaign=open_app'))fail(`fallback is not truthful sign-in/open-app navigation: ${fallback.href}`);
              result.checks.directFallbackVisible=true;
              result.checks.fallbackIsSigninNotSignup=true;
              await page.screenshot({path:'/tmp/v441-mobile/guide.png',fullPage:false,captureBeyondViewport:false});

              await page.touchscreen.tap(fallback.left+fallback.width/2,fallback.top+fallback.height/2);
              await new Promise(r=>setTimeout(r,1400));
              const afterUrl=page.url();
              result.afterUrl=afterUrl;
              const parsed=new URL(afterUrl);
              if(parsed.pathname!='/app/'||parsed.searchParams.get('mode')!=='signin'||parsed.searchParams.get('utm_campaign')!=='open_app')fail(`fallback navigation failed: ${afterUrl}`);
              const after=await page.evaluate(()=>({viewportWidth:innerWidth,scrollWidth:document.documentElement.scrollWidth,horizontalOverflow:document.documentElement.scrollWidth>innerWidth+4}));
              result.after=after;
              if(after.horizontalOverflow)fail(`horizontal overflow after fallback: ${JSON.stringify(after)}`);
              result.checks.touchFallbackNavigation=true;
              result.checks.noHorizontalOverflowAfterFallback=true;
              result.pageErrors=pageErrors.slice(0,10);
              result.status='VERIFIED_LIVE';
            } finally {
              await browser.close();
            }
          })().catch(err=>{result.error=String(err?.stack||err);process.exitCode=1}).finally(()=>{write();console.log(JSON.stringify(result,null,2))});
          JS
          node /tmp/v441-mobile/verify.cjs 2>&1 | tee /tmp/v441-mobile/run.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Upload deterministic V441 mobile proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridgepoint-v441-mobile-cta-proof
          path: |
            /tmp/v441-mobile/result.json
            /tmp/v441-mobile/run.log
            /tmp/v441-mobile/guide.png
          if-no-files-found: warn
          retention-days: 14

      - name: Persist V441 mobile verification receipt
        if: always()
        run: |
          set -euo pipefail
          cp /tmp/v441-mobile/result.json live-v441-mobile-verification.json
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add live-v441-mobile-verification.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record V441 mobile CTA verification [skip ci]'
            git push origin HEAD:main
          fi

      - name: Enforce hard V441 mobile gate
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/v441-mobile/result.json').read_text())
          if r.get('status')!='VERIFIED_LIVE':
              raise SystemExit(r.get('error') or 'V441 mobile CTA verification failed')
          print('V441 mobile CTA verified live with real touch interaction.')
          PY

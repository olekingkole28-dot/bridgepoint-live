name: Deploy BridgePoint Growth Hub V536

on:
  push:
    branches: [main]
    paths:
      - growth/**
      - claim-guide/**
      - .github/workflows/deploy-growth-v536.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy-growth:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble growth surfaces on durable live artifact
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site /tmp/public-base
          mkdir -p site /tmp/public-base
          git archive --format=tar origin/live-artifact | tar -xf - -C /tmp/public-base
          cp -a /tmp/public-base/. site/

          test -s growth/index.html
          test -s claim-guide/index.html
          test -s acquisition_tracker.js
          rm -rf site/growth site/claim-guide
          cp -a growth site/growth
          cp -a claim-guide site/claim-guide
          cp acquisition_tracker.js site/acquisition_tracker.js
          touch site/.nojekyll

          python - <<'PY'
          from pathlib import Path

          home=Path('site/index.html')
          if not home.exists():
              raise SystemExit('Durable public homepage missing; refusing growth deployment')
          s=home.read_text(encoding='utf-8')
          marker='id="evidence-growth-v536"'
          if marker not in s:
              block='''
          <section class="wrap section" id="evidence-growth-v536" data-bp-value="evidence-growth-v536"><div class="sample"><div><span class="kicker">New · evidence stories + free CT guide</span><h2>See what the records actually say.</h2><p>Read source-gated property evidence stories or use the free Connecticut homeowner claim-evidence checklist. No email wall, no invented damage claim, and no guaranteed insurance outcome.</p></div><div class="actions"><a class="btn primary" href="/growth/?utm_source=homepage&utm_medium=growth_hub&utm_campaign=bp_viral_owned_v535">See evidence stories</a><a class="btn secondary" href="/claim-guide/?utm_source=homepage&utm_medium=claim_guide&utm_campaign=ct_claim_evidence_guide">Free CT claim guide</a></div></div></section>
          '''
              if '</main>' not in s:
                  raise SystemExit('Homepage main anchor missing; refusing blind patch')
              s=s.replace('</main>',block+'</main>',1)
              home.write_text(s,encoding='utf-8')

          sitemap=Path('site/sitemap.xml')
          if sitemap.exists():
              x=sitemap.read_text(encoding='utf-8')
              additions=[]
              if 'https://bridgepointintelligence.online/growth/' not in x:
                  additions.append('  <url><loc>https://bridgepointintelligence.online/growth/</loc><changefreq>daily</changefreq><priority>0.9</priority></url>')
              if 'https://bridgepointintelligence.online/claim-guide/' not in x:
                  additions.append('  <url><loc>https://bridgepointintelligence.online/claim-guide/</loc><changefreq>weekly</changefreq><priority>0.9</priority></url>')
              if additions:
                  if '</urlset>' not in x:
                      raise SystemExit('Sitemap closing tag missing; refusing blind patch')
                  x=x.replace('</urlset>','\n'.join(additions)+'\n</urlset>',1)
                  sitemap.write_text(x,encoding='utf-8')
          PY

          test -s site/growth/index.html
          test -s site/claim-guide/index.html
          grep -q 'bridgepoint_public_growth_hub_v536' site/growth/index.html
          grep -q 'bridgepoint_public_growth_hub_v536' site/claim-guide/index.html
          grep -q 'evidence-growth-v536' site/index.html
          grep -q 'bp_viral_owned_v535' site/growth/index.html
          grep -q 'ct_claim_evidence_guide' site/claim-guide/index.html
          if grep -R -E -i 'SUPABASE_SERVICE_ROLE_KEY|sb_secret|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' site/growth site/claim-guide; then
            echo 'Privileged secret marker found in growth surfaces.' >&2
            exit 1
          fi
          echo 'V536 growth surfaces assembled without modifying the compiled customer app.'

      - name: Persist exact growth-enabled live artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/final-live
          mkdir /tmp/final-live
          cp -a site/. /tmp/final-live/
          cd /tmp/final-live
          git init
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m 'BridgePoint live artifact with V536 evidence growth hub'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish BridgePoint growth surfaces
        id: deployment
        uses: actions/deploy-pages@v4

name: Publish BridgePoint Manhattan source geometry V3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-manhattan-source-geometry-v3.yml']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact successful architectural materials V2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/45661663547 --jq '.conclusion')" = success
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/baseline"
            mkdir -p "$RUNNER_TEMP/baseline"
            if timeout 180s gh run download 45661663547 --repo "$GITHUB_REPOSITORY" --name bridgepoint-v5000-1 --dir "$RUNNER_TEMP/baseline" && test -s "$RUNNER_TEMP/baseline/artifact.tar"; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Build source-backed Manhattan architectural mesh
        run: |
          set -euo pipefail
          export SITE="$RUNNER_TEMP/horizon-site"
          mkdir -p "$SITE"
          tar -xf "$RUNNER_TEMP/baseline/artifact.tar" -C "$SITE"
          for p in index.html app/index.html bridgepoint-auto-reality-v1.js world-v2300-water.js; do
            curl --retry 3 --retry-all-errors --max-time 40 -fsSL -H 'Cache-Control: no-cache' "https://bridgepointintelligence.online/$p?baseline=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/current"
            cmp "$SITE/$p" "$RUNNER_TEMP/current"
          done
          python3 -m pip install --quiet numpy shapely mapbox-earcut
          python3 - <<'PY'
          import os,json,struct,math,hashlib,re,urllib.request,concurrent.futures
          from pathlib import Path
          import numpy as np
          from shapely.geometry import Polygon
          from shapely.geometry.polygon import orient
          from shapely.prepared import prep
          import mapbox_earcut as earcut
          site=Path(os.environ['SITE'])
          scan='bridgepoint-auto-reality-v1.js'
          folder='assets/manhattan-photogrammetry-v1/'
          glb=folder+'source-architecture-v3.glb'
          meta=folder+'source-architecture-v3.json'
          allowed={scan,'index.html','app/index.html',glb,meta}
          def snap():
              return {p.relative_to(site).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in site.rglob('*') if p.is_file() and p.relative_to(site).as_posix() not in allowed}
          before=snap()
          reg=json.loads((site/(folder+'registration.json')).read_text());assert reg['accepted']
          row=next(r for r in json.loads((site/'data/bp-auto-reality-v1.json').read_text())['items'] if r.get('cityScan') and r.get('registrationAccepted'))
          assert row['coordinates']==reg['coordinates']
          lon,lat=row['coordinates'];ring=row['replacementFootprint']['coordinates'][0]
          mx=111320*math.cos(math.radians(lat));my=111132
          footprint=Polygon([((x-lon)*mx,(lat-y)*my) for x,y in ring]);assert footprint.is_valid and footprint.area>100000
          inside=prep(footprint)
          LON0,LAT0=-73.9712,40.7831
          SX=111320*math.cos(math.radians(LAT0));SY=111132
          base='https://huggingface.co/datasets/mehmetkeremturkcan/valdrada/resolve/v0.7.1/Content/tiles/'
          def get(name):
              req=urllib.request.Request(base+name,headers={'User-Agent':'BridgePoint-architectural-source/3.0'})
              with urllib.request.urlopen(req,timeout=100) as r: return r.read(40_000_001)
          tiles=json.loads(get('manifest.json'))['tiles'];assert len(tiles)>1000
          xs=[(p[0]-LON0)*SX for p in ring];zs=[(LAT0-p[1])*SY for p in ring]
          keys=[f'{x}_{z}' for x in range(math.floor(min(xs)/512)-1,math.floor(max(xs)/512)+2) for z in range(math.floor(min(zs)/512)-1,math.floor(max(zs)/512)+2) if f'{x}_{z}' in tiles]
          assert 3<=len(keys)<=100,keys
          def download(key):
              name=tiles[key]['f'];assert re.fullmatch(r't_-?\d+_-?\d+\.bin',name)
              raw=get(name);assert 8<len(raw)<=40_000_000
              return key,raw
          positions=[];colors=[];uvs=[];details=[];indices=[];count=0;styles={};maxh=0.;used=[]
          def vertex(x,y,z,u,v,col,d):
              i=len(positions);positions.append((x,y,z));uvs.append((u,v));colors.append(col);details.append(d);return i
          def wall(a,b,by,h,col,style,floor,win,store):
              x,z=a;X,Z=b;length=math.hypot(X-x,Z-z)
              if length<.15:return

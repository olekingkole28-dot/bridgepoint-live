name: Push BridgePoint Research Feed

on:
  push:
    branches: [main]
    paths:
      - articles/**
      - .github/workflows/push-research-websub.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridgepoint-research-websub
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for public Pages deployment
        run: sleep 75

      - name: Notify Google PubSubHubbub/WebSub hub
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/websub-response.txt -w '%{http_code}' -X POST 'https://pubsubhubbub.appspot.com/' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'hub.mode=publish' \
            --data-urlencode 'hub.url=https://bridgepointintelligence.online/articles/feed.xml' || true)"
          echo "WebSub HTTP ${code}"
          cat /tmp/websub-response.txt || true
          if [ "$code" != "200" ] && [ "$code" != "204" ]; then
            echo 'WebSub ping did not confirm acceptance; the next research publish will retry.'
          fi

      - name: Push research and dataset URLs to IndexNow
        run: |
          set -euo pipefail
          cat >/tmp/indexnow-research.json <<'JSON'
          {
            "host": "bridgepointintelligence.online",
            "key": "dc8a83e4caade76fd824cf929dca48d6",
            "keyLocation": "https://bridgepointintelligence.online/dc8a83e4caade76fd824cf929dca48d6.txt",
            "urlList": [
              "https://bridgepointintelligence.online/articles/",
              "https://bridgepointintelligence.online/articles/feed.xml",
              "https://bridgepointintelligence.online/articles/data-desk.html",
              "https://bridgepointintelligence.online/articles/ct-opportunity-aggregates.csv",
              "https://bridgepointintelligence.online/articles/bridgepoint-facts.json",
              "https://bridgepointintelligence.online/articles/datapackage.json",
              "https://bridgepointintelligence.online/articles/dcat.ttl"
            ]
          }
          JSON
          code="$(curl -sS -o /tmp/indexnow-research-response.txt -w '%{http_code}' -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data-binary @/tmp/indexnow-research.json || true)"
          echo "IndexNow research HTTP ${code}"
          cat /tmp/indexnow-research-response.txt || true
          if [ "$code" != "200" ] && [ "$code" != "202" ]; then
            echo 'IndexNow research push did not confirm acceptance; the next research publish will retry.'
          fi

name: Verify BridgePoint Global 3D Sidewalks Live

on:
  workflow_dispatch:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: bridgepoint-global-sidewalks-live-verification
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'deployment_status' && github.event.deployment.environment == 'github-pages' && github.event.deployment_status.state == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify root and app are serving the exact 3D sidewalk build
        shell: bash
        run: |
          set -euo pipefail
          O='https://bridgepointintelligence.online'
          q="sidewalk-live-${GITHUB_SHA}-$(date +%s)"
          fetch() {
            local url="$1" output="$2"
            curl --retry 6 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30 \
              -fsSL -H 'Cache-Control: no-cache' "${url}" -o "${output}"
            test -s "${output}"
          }
          fetch "${O}/?verify=${q}" /tmp/root.html
          fetch "${O}/app/?verify=${q}" /tmp/app.html
          fetch "${O}/sw.js?v=6223-sidewalk-3d-global&verify=${q}" /tmp/sw.js
          fetch "${O}/app-update-v5820.js?v=6223-sidewalk-3d-global&verify=${q}" /tmp/app-update.js
          fetch "${O}/landing.js?verify=${q}" /tmp/landing.js
          fetch "${O}/app.js?verify=${q}" /tmp/app.js
          fetch "${O}/world-v2300-map.js?v=6228-global-sidewalk-3d-vector-tiles&verify=${q}" /tmp/root-map.js
          fetch "${O}/app/world-v2300-map.js?v=6228-global-sidewalk-3d-vector-tiles&verify=${q}" /tmp/app-map.js
          fetch "${O}/world-v2300-sidewalks-3d.js?v=20261107-sidewalk-terrain-local-offsets-v3&verify=${q}" /tmp/root-sidewalk.js
          fetch "${O}/app/world-v2300-sidewalks-3d.js?v=20261107-sidewalk-terrain-local-offsets-v3&verify=${q}" /tmp/app-sidewalk.js

          grep -Fq 'sidewalk=6223-sidewalk-3d-global' /tmp/root.html
          grep -Fq 'sidewalk=6223-sidewalk-3d-global' /tmp/app.html
          grep -Fq '6223-sidewalk-3d-global' /tmp/landing.js
          grep -Fq '6223-sidewalk-3d-global' /tmp/app.js
          grep -Fq "register('/sw.js?v=6223-sidewalk-3d-global'" /tmp/landing.js
          grep -Fq "register('/sw.js?v=6223-sidewalk-3d-global'" /tmp/app.js
          grep -Fq "const V='bp-intelligence-v6223-sidewalk-3d-global'" /tmp/sw.js
          grep -Fq "const BUILD=6223" /tmp/app-update.js
          grep -Fq "CURRENT_CACHE='bp-intelligence-v6223-sidewalk-3d-global'" /tmp/app-update.js
          grep -Fq '6228-global-sidewalk-3d-vector-tiles' /tmp/landing.js
          grep -Fq '6228-global-sidewalk-3d-vector-tiles' /tmp/app.js
          grep -Fq "from'./world-v2300-sidewalks-3d.js?v=20261107-sidewalk-terrain-local-offsets-v3'" /tmp/root-map.js
          grep -Fq "from'./world-v2300-sidewalks-3d.js?v=20261107-sidewalk-terrain-local-offsets-v3'" /tmp/app-map.js

          for map in /tmp/root-map.js /tmp/app-map.js; do
            grep -Fq 'gta-bp-sidewalk-slabs-v1' "${map}"
            grep -Fq 'gta-bp-sidewalk-curbs-v1' "${map}"
            grep -Fq 'gta-bp-sidewalk-grass-v1' "${map}"
            grep -Fq 'gta-bp-sidewalk-grass-blades-v1' "${map}"
            grep -Fq 'gta-bp-sidewalk-joints-cracks-v1' "${map}"
            grep -Fq 'globalVectorTileFeatures:sidewalkTileFeatures.length' "${map}"
            grep -Fq "map.querySourceFeatures('ofm',{sourceLayer:'transportation'})" "${map}"
            grep -Fq 'roadVectorTileFeatures:sidewalkRoadTileFeatures.length' "${map}"
            grep -Fq "brunnel==='bridge'||brunnel==='tunnel'||bridge==='yes'||tunnel==='yes'" "${map}"
            grep -Fq 'function refreshSidewalk3DFromTiles(extraFeatures=[])' "${map}"
            grep -Fq "map.on('idle',()=>{if(!moving&&map.getZoom()>=14.2)refreshSidewalk3DFromTiles()});" "${map}"
            grep -Fq "const sidewalkTileFeatures=[...sidewalkRoadTileFeatures,...sidewalkRenderedFeatures]" "${map}"
            grep -Fq "map.queryRenderedFeatures({layers:['gta-global-sidewalk-approach-v1']})" "${map}"
            grep -Fq "map.getSource('bpSidewalk3D')?.setData({type:'FeatureCollection',features:sidewalk3D.features})" "${map}"
            node --check "${map}"
          done

          cmp -s /tmp/root-sidewalk.js /tmp/app-sidewalk.js
          grep -Fq 'function buildSidewalk3DFeatures' /tmp/root-sidewalk.js
          grep -Fq "part:'sidewalk_slab'" /tmp/root-sidewalk.js
          grep -Fq "part:'curb'" /tmp/root-sidewalk.js
          grep -Fq "part:'grass_verge'" /tmp/root-sidewalk.js
          grep -Fq "part:'grass_blade'" /tmp/root-sidewalk.js
          grep -Fq "base_m:0,terrain_sampled:sampled,terrain_elevation_m:sampled?elevation:null" /tmp/root-sidewalk.js
          grep -Fq "top_m:0.145" /tmp/root-sidewalk.js
          grep -Fq "top_m:0.20" /tmp/root-sidewalk.js
          grep -Fq "part:'panel_joint'" /tmp/root-sidewalk.js
          node --check /tmp/root-sidewalk.js

          echo 'BRIDGEPOINT_GLOBAL_SIDEWALKS_ROOT_APP_LIVE_PASS'

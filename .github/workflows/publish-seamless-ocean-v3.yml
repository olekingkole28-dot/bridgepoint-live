name: Publish BridgePoint Seamless Ocean Mesh and Dive Recovery V3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-seamless-ocean-v3.yml'
      - 'scripts/overlay_seamless_ocean_v3.py'
      - 'scripts/bp-ocean-mesh-v3.mjs'
      - 'scripts/test-ocean-mesh-v3.mjs'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public bathymetry and patch syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/overlay_seamless_ocean_v3.py
          curl --retry 4 --retry-all-errors --max-time 30 -fsSL 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/3/4/4.png' -o "$RUNNER_TEMP/terrain.png"
          python3 -m venv "$RUNNER_TEMP/bp-water-venv"
          "$RUNNER_TEMP/bp-water-venv/bin/python" -m pip install --quiet Pillow
          "$RUNNER_TEMP/bp-water-venv/bin/python" - <<'PY'
          from PIL import Image
          import os
          im=Image.open(os.environ['RUNNER_TEMP']+'/terrain.png').convert('RGB')
          elevations=[r*256+g+b/256-32768 for r,g,b in im.getdata()]
          assert min(elevations)<-1000, 'No negative ocean terrain in public tile'
          print('PUBLIC_BATHYMETRY_NEGATIVE_METERS_PASS', min(elevations))
          PY
      - name: Prepare and test exact marine triangulation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ocean-vendor"
          npm install --prefix "$RUNNER_TEMP/ocean-npm" --no-audit --no-fund earcut@3.0.2
          cp "$RUNNER_TEMP/ocean-npm/node_modules/earcut/src/earcut.js" "$RUNNER_TEMP/ocean-vendor/bp-earcut-v3.mjs"
          cp scripts/bp-ocean-mesh-v3.mjs scripts/test-ocean-mesh-v3.mjs "$RUNNER_TEMP/ocean-vendor/"
          node "$RUNNER_TEMP/ocean-vendor/test-ocean-mesh-v3.mjs"
      - name: Download latest verified persistent globe release
        uses: actions/download-artifact@v4
        with:
          name: bridgepoint-v5000-1
          run-id: 45323201584
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline
      - name: Patch only deployed water and sensor modules
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/bp-liquid-site"
          mkdir -p "$SITE"
          ARCHIVE="$(find "$RUNNER_TEMP/baseline" -type f -name artifact.tar -print -quit)"
          test -n "$ARCHIVE"
          tar -xf "$ARCHIVE" -C "$SITE"
          python3 scripts/overlay_seamless_ocean_v3.py "$SITE" "$RUNNER_TEMP/ocean-vendor"
          for f in world-v2300-water.js world-v2300-sensor-layers.js app/world-v2300-water.js app/world-v2300-sensor-layers.js world-v2300-map.js app/world-v2300-map.js landing.js app.js; do
            node --input-type=module --check < "$SITE/$f"
          done
          grep -Fq 'float whitecap' "$SITE/world-v2300-water.js"
          grep -Fq 'new T.InstancedMesh' "$SITE/world-v2300-sensor-layers.js"
          grep -Fq 'bp-liquid-ocean-cover-v2' "$SITE/world-v2300-water.js"
          grep -Fq 'targetAltitude=Math.min(-3,bed+clearance)' "$SITE/world-v2300-sensor-layers.js"
          grep -Fq 'restoreWaterGLState(gl, savedWaterState)' "$SITE/world-v2300-water.js"
          grep -Fq 'liquid-seamless-ocean-v20261123-v3' "$SITE/landing.js"
          grep -Fq 'liquid-seamless-ocean-v20261123-v3' "$SITE/app.js"
          grep -Fq 'buildOceanPolygonMesh' "$SITE/world-v2300-water.js"
          grep -Fq 'autoOceanDive' "$SITE/world-v2300-sensor-layers.js"
          for f in bridgepoint-earth-protection-v1.js bridgepoint-neo-watch-v1.js bridgepoint-conflict-zones-v1.js; do test -s "$SITE/$f"; done
          echo SEAMLESS_OCEAN_BUILD_PASS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-v5000-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bp-liquid-site
          include-hidden-files: true
      - name: Publish preserved site
        id: deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deploy-pages-extended.mjs
      - name: Verify public water modules and cache keys
        shell: bash
        run: |
          set -euo pipefail
          O=https://bridgepointintelligence.online
          SITE="$RUNNER_TEMP/bp-liquid-site"
          for p in world-v2300-water.js app/world-v2300-water.js world-v2300-sensor-layers.js app/world-v2300-sensor-layers.js world-v2300-map.js app/world-v2300-map.js vendor/bp-earcut-v3.mjs vendor/bp-ocean-mesh-v3.mjs landing.js app.js index.html app/index.html; do
            curl --retry 8 --retry-all-errors --retry-delay 4 --max-time 40 -fsSL -H 'Cache-Control: no-cache' "$O/$p?liquid=$GITHUB_SHA" -o "$RUNNER_TEMP/liquid-live"
            cmp "$SITE/$p" "$RUNNER_TEMP/liquid-live"
          done
          echo BRIDGEPOINT_SEAMLESS_OCEAN_LIVE_PASS

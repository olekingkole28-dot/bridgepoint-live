name: Deploy BridgePoint Live

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download audited BridgePoint Flutter release
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          curl -L --fail --retry 3 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-5f50-81f6-9974-0afa97cc7961/raw?se=2026-08-16T15%3A26%3A22Z&sp=r&sv=2026-02-06&sr=b&scid=8808810b-003d-5fc6-8525-027666614322&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-16T11%3A41%3A20Z&ske=2026-08-17T11%3A41%3A20Z&sks=b&skv=2026-02-06&sig=UtrPZbRrllhf6LmoQxTosfEEA/C%2BFD7mqFhgsB68wNA%3D' -o /tmp/bridgepoint.zip
          unzip -q /tmp/bridgepoint.zip -d site
          touch site/.nojekyll
          sed -i 's#<base href="/">#<base href="./">#' site/index.html
          test -s site/index.html
          test -s site/main.dart.js
          test -s site/bridgepoint-release.json
          grep -q 'bdb33ce008b68cdd957a24a6fdd1c44e63590453' site/bridgepoint-release.json
          echo "BridgePoint v212 audited release staged successfully for public hosting."
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish BridgePoint
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy BridgePoint Owner AI V591

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-owner-ai-v576.yml
      - experience/owner-completion-v590.html
  workflow_run:
    workflows:
      - "Deploy BridgePoint Autonomous Company V557"
      - "Deploy BridgePoint Experience V550"
      - "Deploy BridgePoint Owner Command Center V551"
      - "Deploy BridgePoint V552 — Dynamic Avatar Heal"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy-owner-ai:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble V591 from durable artifact
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site
          mkdir -p site
          git archive --format=tar origin/live-artifact | tar -xf - -C site

          test -s site/owner/index.html
          test -s site/owner/ai/index.html
          test -s site/owner/ai/executive/index.html
          test -s site/owner/ai/reasoning/index.html
          test -s site/owner/ai/control/index.html
          test -s site/owner/growth-swarm/index.html
          test -s experience/owner-completion-v590.html
          mkdir -p site/owner/completion
          cp experience/owner-completion-v590.html site/owner/completion/index.html

          python - <<'PY'
          from pathlib import Path

          owner = Path('site/owner/index.html')
          s = owner.read_text(encoding='utf-8')
          marker = 'bp-v576-owner-ai-links'
          if marker not in s:
              needle = '<div class="launchgrid">'
              block = '''<span id="bp-v576-owner-ai-links" style="display:none"></span>
          <a class="launch" href="/owner/ai/executive/"><b>🧠 OWNER AI · System Executive</b><span>Private system-changing AI. Tell it what you want done; it plans, delegates, verifies and retries through governed worker tools.</span></a>
          <a class="launch" href="/owner/ai/reasoning/"><b>🔬 AI Reasoning Observatory</b><span>Evidence, hypotheses, dissent, gates, confidence, calibration and outcomes. Owner-only.</span></a>
          <a class="launch" href="/owner/growth-swarm/"><b>📈 Growth Swarm</b><span>Five acquisition agents measured by owned-media output, funnel movement and verified payment.</span></a>
          '''
              if needle not in s:
                  raise SystemExit('Owner launchgrid missing; refusing blind patch')
              s = s.replace(needle, needle + block, 1)
          if 'bp-v591-master-completion' not in s:
              needle = '<div class="launchgrid">'
              block = '''<span id="bp-v591-master-completion" style="display:none"></span>
          <a class="launch" href="/owner/completion/"><b>✅ Master Completion · National Depth</b><span>Canonical no-forgotten-work ledger, worker assignments, independent verification, local AI status and 50-state + DC data-depth truth.</span></a>
          '''
              if needle not in s:
                  raise SystemExit('Owner launchgrid missing for master-completion patch')
              s = s.replace(needle, needle + block, 1)
          control_marker = 'bp-v583-ai-control-center'
          if control_marker not in s:
              needle = '<div class="launchgrid">'
              block = '''<span id="bp-v583-ai-control-center" style="display:none"></span>
          <a class="launch" href="/owner/ai/control/"><b>🎛 OWNER AI · Control Center</b><span>Private provider/runtime, worker fleet, waiting tasks and reasoning state.</span></a>
          '''
              if needle not in s:
                  raise SystemExit('Owner launchgrid missing for control-center patch')
              s = s.replace(needle, needle + block, 1)
          owner.write_text(s, encoding='utf-8')

          fleet = Path('site/owner/ai/index.html')
          s = fleet.read_text(encoding='utf-8')
          marker = 'bp-v576-ai-separation'
          if marker not in s:
              needle = '<main id="main" class="hidden">'
              block = '''<div id="bp-v576-ai-separation" style="margin:10px 0;padding:11px;border:1px solid #32694f;border-radius:12px;background:#10271d;color:#b8ffd9"><b>Two different AIs:</b> <a style="color:#48ddff" href="/owner/ai/executive/">Owner AI Executive</a> can coordinate governed system work and is admin-only. <a style="color:#48ddff" href="/app/">Customer BridgePoint AI</a> only receives customer-safe, package/entitlement-scoped intelligence and has no system-changing tools. <a style="color:#48ddff" href="/owner/ai/reasoning/">Reasoning Observatory</a> and <a style="color:#48ddff" href="/owner/growth-swarm/">Growth Swarm</a> are owner-only.</div>'''
              if needle not in s:
                  raise SystemExit('AI main marker missing; refusing blind patch')
              s = s.replace(needle, needle + block, 1)
          if 'bp-v583-control-shortcut' not in s:
              needle = '<div class="top">'
              block = '''<div id="bp-v583-control-shortcut" style="margin:10px 0;padding:10px;border:1px solid #2d6571;border-radius:12px;background:#0d2437"><b>🎛 New:</b> <a style="color:#48ddff" href="/owner/ai/control/">Open the Owner AI Control Center</a> for runtime and worker status.</div>'''
              if needle in s:
                  s = s.replace(needle, block + needle, 1)
          if 'bp-v591-ledger-shortcut' not in s:
              needle = '<div class="top">'
              block = '''<div id="bp-v591-ledger-shortcut" style="margin:10px 0;padding:10px;border:1px solid #32694f;border-radius:12px;background:#10271d"><b>✅ Canonical backlog:</b> <a style="color:#48ddff" href="/owner/completion/">Master Completion + National Depth</a> shows every recovered requirement and its verification state.</div>'''
              if needle in s:
                  s = s.replace(needle, block + needle, 1)
          fleet.write_text(s, encoding='utf-8')

          rel = Path('site/owner/ai/v591-release.json')
          rel.write_text('{"version":591,"release":"Master Completion + Local-First AI Visibility","owner_only":true,"master_completion":"/owner/completion/","control_center":"/owner/ai/control/","reasoning":"/owner/ai/reasoning/","growth_swarm":"/owner/growth-swarm/","customer_ai_system_changing":false,"provider_mode":"LOCAL_FIRST","external_email":false,"external_social":false,"paid_spend":false}\n', encoding='utf-8')
          PY

          grep -q 'bridgepoint_owner_intent_submit_v572' site/owner/ai/executive/index.html
          grep -q 'bridgepoint_owner_reasoning_v570' site/owner/ai/reasoning/index.html
          grep -q 'bridgepoint_owner_ai_control_center_v582' site/owner/ai/control/index.html
          grep -q 'bridgepoint_owner_growth_swarm_v576' site/owner/growth-swarm/index.html
          grep -q 'bridgepoint_owner_master_completion_v586' site/owner/completion/index.html
          grep -q 'bridgepoint_owner_national_depth_v590' site/owner/completion/index.html
          grep -q 'bp-v591-master-completion' site/owner/index.html
          grep -q 'bp-v591-ledger-shortcut' site/owner/ai/index.html

          if grep -R -E -i 'SUPABASE_SERVICE_ROLE_KEY|sb_secret_|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|BRIDGEPOINT_AI_API_KEY|OPENAI_API_KEY|ANTHROPIC_API_KEY|sk-proj-|sk-ant-' site/owner/ai site/owner/growth-swarm site/owner/completion; then
            echo 'Privileged secret marker found in owner web artifact.' >&2
            exit 1
          fi
          touch site/.nojekyll site/app/.nojekyll

      - name: Persist exact V591 durable artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/final-live
          mkdir /tmp/final-live
          cp -a site/. /tmp/final-live/
          cd /tmp/final-live
          git init
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m 'BridgePoint V591 master completion and local-first AI'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish V591
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live owner routes
        shell: bash
        run: |
          set -euo pipefail
          declare -A EXPECT=(
            [owner/ai/control/]="Owner AI Control Center"
            [owner/ai/executive/]="SYSTEM-CHANGING AI"
            [owner/ai/reasoning/]="Reasoning Observatory"
            [owner/growth-swarm/]="Growth Swarm"
            [owner/completion/]="Master Completion"
          )
          for path in "${!EXPECT[@]}"; do
            file="/tmp/$(echo "$path" | tr '/' '_').html"
            curl -fsSL --retry 6 --retry-delay 3 "https://bridgepointintelligence.online/$path" -o "$file"
            test -s "$file"
            grep -q "${EXPECT[$path]}" "$file"
          done

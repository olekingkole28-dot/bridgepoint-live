name: Publish BridgePoint Named Earthquake Raised Wavefronts V3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-named-earthquake-ripples-v3.yml'
      - 'scripts/overlay_named_earthquake_ripples_v3.py'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download latest confirmed aircraft V8 production artifact
        uses: actions/download-artifact@v4
        with:
          name: bridgepoint-v5000-1
          run-id: 45355950570
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline
      - name: Patch earthquake renderer only and verify scope
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/bp-liquid-site"
          mkdir -p "$SITE"
          ARCHIVE="$(find "$RUNNER_TEMP/baseline" -type f -name artifact.tar -print -quit)"
          test -n "$ARCHIVE"
          tar -xf "$ARCHIVE" -C "$SITE"
          python3 -m py_compile scripts/overlay_named_earthquake_ripples_v3.py
          python3 scripts/overlay_named_earthquake_ripples_v3.py "$SITE"
          for f in world-v2300-seismic-layer-v1.js app/world-v2300-seismic-layer-v1.js landing.js app.js; do
            node --input-type=module --check < "$SITE/$f"
          done
          grep -Fq 'beginFlightFollow' "$SITE/bridgepoint-drone-awareness-v1.js"
          grep -Fq 'flightIsGrounded' "$SITE/bridgepoint-drone-awareness-v1.js"
          grep -Fq 'sampleSeaSurface' "$SITE/world-v2300-water.js"
          grep -Fq 'motionFor' "$SITE/bridgepoint-vessel-awareness-v1.js"
          grep -Fq 'aircraft-follow-ground-v20261124-v8' "$SITE/app/index.html"
      - name: Test three wavefronts, contour bounds, severity palette and dateline geometry
        shell: bash
        run: |
          set -euo pipefail
          export BP_SITE="$RUNNER_TEMP/bp-liquid-site"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          for(const f of ['world-v2300-seismic-layer-v1.js','app/world-v2300-seismic-layer-v1.js']){
            const source=fs.readFileSync(process.env.BP_SITE+'/'+f,'utf8')+'\nexport {buildRippleFrame,mapLayerSpecs,distanceKm,buildImpactCollections};';
            const M=await import('data:text/javascript;base64,'+Buffer.from(source).toString('base64'));
            const mk=(id,lon,mag)=>({type:'Feature',id,geometry:{type:'Point',coordinates:[lon,10]},properties:{mag,bp_impact_radius_km:90}});
            const events={type:'FeatureCollection',features:[mk('a',0,4),mk('b',179.9,8)]};
            for(let t=0;t<3400;t+=113){
              const frame=M.buildRippleFrame(events,t);
              for(const event of events.features){
                const waves=frame.features.filter(x=>x.id.startsWith(event.id+'-ripple-'));
                assert.equal(waves.length,3);
                assert.equal(frame.features.filter(x=>x.id.startsWith(event.id+'-crest-')).length,3);
                for(const wave of waves){
                  const lines=wave.geometry.type==='LineString'?[wave.geometry.coordinates]:wave.geometry.coordinates;
                  for(const p of lines.flat())assert(M.distanceKm(event.geometry.coordinates,p)<91);
                }
              }
            }
            const spec=M.mapLayerSpecs(),palette=['step',['get','mag'],'#25e553',4.5,'#ffe32b',6,'#ff3030',7.5,'#800020'];
            for(const [key,paint] of [['points','circle-color'],['ripples','line-color'],['impactBoundary','line-color'],['crests','fill-extrusion-color']])assert.deepEqual(spec[key].paint[paint],palette);
            assert.equal(spec.crests.type,'fill-extrusion');
            assert.deepEqual(spec.crests.paint['fill-extrusion-height'],['get','height_m']);
            const actual=[[0.1,10],[0,10.1],[-0.1,10],[0,9.9],[0.1,10]];
            const cache=new Map([['a',{lines:[actual],radiusKm:12}]]);
            const geo=M.buildRippleFrame({features:[events.features[0]]},300,cache);
            assert.equal(geo.features.filter(x=>x.id.includes('-ripple-')).length,3);
            for(const x of geo.features.filter(x=>x.id.includes('-ripple-')))for(const p of x.geometry.coordinates)assert(M.distanceKm([0,10],p)<12);
          }
          console.log('SEISMIC_RAISED_WAVEFRONTS_PASS');
          JS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-v5000-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bp-liquid-site
          include-hidden-files: true
      - name: Wait for artifact indexing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "bridgepoint-v5000-'"$GITHUB_RUN_ATTEMPT"'") | .id')
            if [ -n "$ID" ]; then echo "Indexed artifact $ID"; sleep 15; exit 0; fi
            sleep 4
          done
          exit 1
      - name: Publish preserved site
        id: deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deploy-pages-extended.mjs
      - name: Verify live files
        shell: bash
        run: |
          set -euo pipefail
          O=https://bridgepointintelligence.online
          SITE="$RUNNER_TEMP/bp-liquid-site"
          for p in world-v2300-seismic-layer-v1.js app/world-v2300-seismic-layer-v1.js app.js landing.js index.html app/index.html bridgepoint-drone-awareness-v1.js bridgepoint-vessel-awareness-v1.js world-v2300-water.js; do
            curl --retry 8 --retry-all-errors --retry-delay 4 --max-time 40 -fsSL -H 'Cache-Control: no-cache' "$O/$p?seismic=$GITHUB_SHA" -o "$RUNNER_TEMP/seismic-live"
            cmp "$SITE/$p" "$RUNNER_TEMP/seismic-live"
          done
          echo BRIDGEPOINT_NAMED_EARTHQUAKES_V3_LIVE_PASS

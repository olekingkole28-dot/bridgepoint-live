name: Deploy BridgePoint Intelligence V5000 Rebuild

on:
  push:
    branches: [main]
    paths:
      - 'rebuild-v5000/**'
      - 'release-v2300/world-v2300-config.js'
      - 'release-v2300/world-v2300-map.js'
      - 'release-v2300/world-v2300-worker.js'
      - '.github/workflows/deploy-intelligence-rebuild-v5000.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build clean Intelligence-only artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/vendor site/app
          cp rebuild-v5000/index.html site/index.html
          cp rebuild-v5000/styles.css site/styles.css
          cp rebuild-v5000/app.js site/app.js
          cp rebuild-v5000/manifest.webmanifest site/manifest.webmanifest
          cp rebuild-v5000/sw.js site/sw.js
          cp rebuild-v5000/404.html site/404.html
          cp rebuild-v5000/bridgepoint-mark.svg site/bridgepoint-mark.svg

          # /app is retired as a separate interface: keep only a redirect into the single Intelligence surface.
          cat > site/app/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script>location.replace('/?from=app')</script></head><body></body></html>
          HTML

          # Carry forward only the proven map engine pieces used by the new shell.
          cp release-v2300/world-v2300-config.js site/world-v2300-config.js
          cp release-v2300/world-v2300-map.js site/world-v2300-map.js
          cp release-v2300/world-v2300-worker.js site/world-v2300-worker.js

          curl --retry 4 --retry-all-errors --retry-delay 2 -fsSL https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.2/dist/maplibre-gl.js -o site/vendor/maplibre-gl.js
          curl --retry 4 --retry-all-errors --retry-delay 2 -fsSL https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.2/dist/maplibre-gl.css -o site/vendor/maplibre-gl.css
          curl --retry 4 --retry-all-errors --retry-delay 2 -fsSL https://cdn.jsdelivr.net/npm/pmtiles@4.5.0/dist/pmtiles.js -o site/vendor/pmtiles.js

          printf '%s\n' 'bridgepointintelligence.online' > site/CNAME
          touch site/.nojekyll site/app/.nojekyll

          node --check site/app.js
          node --check site/world-v2300-config.js
          node --check site/world-v2300-map.js
          node --check site/world-v2300-worker.js

          grep -Fq 'BP_FRONTEND_V5000' site/index.html
          grep -Fq 'bridgepoint_frontend_status_v5000' site/app.js
          grep -Fq 'bridgepoint_public_building_detail_v5000' site/app.js
          grep -Fq 'bridgepoint_public_building_detail_by_id_v5024' site/app.js
          grep -Fq 'onBuildingSelect' site/app.js
          grep -Fq 'onBuildingSelect' site/world-v2300-map.js
          grep -Fq '__BP_V5000_SELECT_BUILDING__' site/app.js
          grep -Fq '__BP_V5000_SELECT_BUILDING__' site/world-v2300-map.js
          grep -Fq 'bridgepoint_public_context_v5003' site/app.js
          grep -Fq 'bridgepoint_public_weather_bootstrap_v5004' site/app.js
          grep -Fq 'bridgepoint_public_building_parts_v5000' site/app.js
          grep -Fq 'bridgepoint_public_foundation_sample_v5011' site/app.js
          grep -Fq 'bridgepoint_public_opportunity_viewport_v5025' site/app.js
          grep -Fq 'gta-place-label' site/world-v2300-map.js
          grep -Fq 'gta-road-label-major' site/world-v2300-map.js
          grep -Fq 'gta-poi-label' site/world-v2300-map.js
          grep -Fq 'gta-opportunity-buildings' site/world-v2300-map.js
          grep -Fq 'gta-opportunity-label' site/world-v2300-map.js
          grep -Fq "Noto Sans Regular" site/world-v2300-map.js
          grep -Fq 'bridgepoint-public-building-tile-v5019' site/app.js
          grep -Fq 'bridgepoint-public-building-tile-v5019' site/world-v2300-map.js
          grep -Fq 'prefillBuildingFromFeature' site/app.js
          grep -Fq 'bFootprintArea' site/app.js
          grep -Fq 'bProvDataset' site/app.js
          grep -Fq "11.4,.86,13,.92,15,.97,18,.99" site/world-v2300-map.js
          ! grep -Fq "map.getSource('selected')?.setData" site/world-v2300-map.js
          grep -Fq 'transportArchive' site/app.js
          grep -Fq 'transportRuntime' site/app.js
          grep -Fq 'bridgepoint-transport-runtime-broker-v2716' site/app.js
          grep -Fq 'bp-v2716-transport-segments' site/app.js
          test -s site/vendor/pmtiles.js
          grep -Fq 'toggleLiveContext' site/index.html
          ! find site -type f | grep -E '/horizon|horizon-' || false
          test ! -e site/app/horizon
          test ! -e site/app/horizon-playable
          echo "V5000 CLEAN INTELLIGENCE ARTIFACT READY"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-v5000
          path: site

      - name: Deploy clean V5000 surface
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: bridgepoint-v5000

      - name: Verify production cutover
        shell: bash
        run: |
          set -euo pipefail
          O='https://bridgepointintelligence.online'
          ok=0
          for i in $(seq 1 45); do
            q="${GITHUB_SHA}-${i}-$(date +%s)"
            curl --retry 3 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/?v5000=${q}" -o /tmp/root.html || true
            curl --retry 3 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/app.js?v5000=${q}" -o /tmp/app.js || true
            if grep -Fq 'BP_FRONTEND_V5000' /tmp/root.html && grep -Fq 'bridgepoint_frontend_status_v5000' /tmp/app.js && grep -Fq 'toggleLiveContext' /tmp/root.html && grep -Fq 'bridgepoint_public_context_v5003' /tmp/app.js && grep -Fq 'bridgepoint_public_weather_bootstrap_v5004' /tmp/app.js && grep -Fq 'bridgepoint_public_building_parts_v5000' /tmp/app.js && grep -Fq 'bridgepoint_public_foundation_sample_v5011' /tmp/app.js; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
          grep -Fq 'BRIDGEPOINT' /tmp/root.html
          ! grep -Eiq 'HORIZON|battle pass|zombie|game mode' /tmp/root.html
          echo BRIDGEPOINT_V5000_PRODUCTION_CUTOVER_PASS

      - name: Android smoke
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          cd /tmp
          npm init -y >/dev/null 2>&1 || true
          npm install puppeteer-core@24 --no-audit --no-fund >/dev/null 2>&1
          CHROME_PATH="$CHROME" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox','--disable-dev-shm-usage','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
            try{
              const p=await browser.newPage();
              await p.setUserAgent('Mozilla/5.0 (Linux; Android 16; Pixel 9a) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36');
              await p.setViewport({width:390,height:844,deviceScaleFactor:2,isMobile:true,hasTouch:true});
              const errors=[];p.on('pageerror',e=>errors.push(String(e.message||e)));
              await p.goto('https://bridgepointintelligence.online/?qa=v5000-'+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
              await p.waitForFunction(()=>window.__BP_FRONTEND_VERSION===5000,{timeout:10000});
              await p.waitForFunction(()=>document.getElementById('canonicalProperties')?.textContent?.includes(','),{timeout:15000});
              await p.waitForFunction(()=>document.querySelectorAll('#liveMap canvas').length===1,{timeout:25000});
              await p.waitForFunction(()=>!!document.getElementById('bpTabContext')&&!!document.getElementById('bXrayUnderground')&&!!document.getElementById('toggleLiveContext')&&!!document.getElementById('ctxSurfaceMaterial')&&!!document.getElementById('ctxSurfaceSource')&&!!document.getElementById('transportArchive')&&!!document.getElementById('transportRuntime'),{timeout:10000});
              await p.waitForFunction(()=>!!window.__BP_V5000_WORLD?.map?.getLayer('bp-v5004-weather-points'),{timeout:25000});
              await p.waitForFunction(()=>{
                const m=window.__BP_V5000_WORLD?.map;
                return !!m?.getLayer('gta-place-label')&&!!m?.getLayer('gta-road-label-major')&&!!m?.getLayer('gta-poi-label')&&!!m?.getLayer('gta-opportunity-buildings')&&!!m?.getLayer('gta-opportunity-label');
              },{timeout:15000});
              await p.waitForFunction(()=>{
                const m=window.__BP_V5000_WORLD?.map;
                if(!m)return false;
                try{return m.queryRenderedFeatures({layers:['gta-place-label']}).length>0}catch{return false}
              },{timeout:15000});
              console.log('BRIDGEPOINT_TEXT_LABELS_RENDERED');
              await p.evaluate(()=>{
                const m=window.__BP_V5000_WORLD?.map;
                if(!m)throw new Error('semantic map unavailable');
                m.jumpTo({center:[-73.9857,40.7484],zoom:16.4,pitch:52,bearing:0});
              });
              await p.waitForFunction(()=>{
                const m=window.__BP_V5000_WORLD?.map,src=m?.getSource('bpSemanticLabels');
                const data=src?.serialize?.()?.data;
                return Array.isArray(data?.features)&&data.features.some(f=>f?.properties?.anchor_truth==='BUILDING_ANCHORED');
              },{timeout:30000});
              console.log('BRIDGEPOINT_SEMANTIC_BUILDING_LABELS_PASS');
              await p.waitForFunction(()=>{const t=document.getElementById('liveLegendCount')?.textContent;return !!t&&t!=='CHECKING'}, {timeout:20000});
              await p.waitForFunction(()=>getComputedStyle(document.getElementById('systemPanel')).display==='none',{timeout:5000});
              console.log('BRIDGEPOINT_MOBILE_STATUS_PANEL_CLOSED');

              await p.evaluate(()=>{
                const map=window.__BP_V5000_WORLD?.map;
                if(!map)throw new Error('map unavailable');
                map.jumpTo({center:[-72.6716132,41.7409742],zoom:18,pitch:58,bearing:0});
              });
              await p.waitForFunction(()=>{
                const map=window.__BP_V5000_WORLD?.map;
                if(!map)return false;
                const pt=map.project([-72.6716132,41.7409742]);
                const layers=['gta-opportunity-buildings','gta-exact-building','gta-bp-buildings'].filter(id=>map.getLayer(id));
                if(!layers.length)return false;
                try{return map.queryRenderedFeatures(pt,{layers}).length>0}catch{return false}
              },{timeout:25000});
              const clickPoint=await p.evaluate(()=>{
                const pt=window.__BP_V5000_WORLD.map.project([-72.6716132,41.7409742]);
                return {x:pt.x,y:pt.y};
              });
              const canvas=await p.$('#liveMap canvas');
              const box=await canvas.boundingBox();
              await p.touchscreen.tap(box.x+clickPoint.x,box.y+clickPoint.y);
              let touchOpened=false;
              try{
                await p.waitForFunction(()=>document.getElementById('buildingPanel')?.hidden===false,{timeout:4000});
                touchOpened=true;
                console.log('BRIDGEPOINT_ANDROID_TOUCH_TAP_LANDED');
              }catch(_){
                console.log('BRIDGEPOINT_ANDROID_TOUCH_SYNTHESIS_MISSED');
                await p.evaluate(()=>{
                  const w=window.__BP_V5000_WORLD,map=w?.map;
                  if(!map)throw new Error('PROGRAMMATIC_MAP_MISSING');
                  const layers=['gta-opportunity-buildings','gta-exact-building','gta-bp-buildings'].filter(id=>map.getLayer(id));
                  const canvas=map.getCanvas(),r=canvas.getBoundingClientRect();
                  let chosen=null;
                  for(let y=Math.round(r.height*.25);y<=Math.round(r.height*.78)&&!chosen;y+=24){
                    for(let x=Math.round(r.width*.12);x<=Math.round(r.width*.88);x+=24){
                      try{if(map.queryRenderedFeatures({x,y},{layers}).length){chosen={x,y};break}}catch(_){}
                    }
                  }
                  if(!chosen)throw new Error('NO_RENDERED_BRIDGEPOINT_BUILDING_FOR_FALLBACK');
                  const hits=map.queryRenderedFeatures(chosen,{layers});
                  const hit=hits[0];
                  if(!hit)throw new Error('PROGRAMMATIC_BUILDING_FEATURE_MISSING');
                  const lngLat=map.unproject(chosen);
                  const feature={type:'Feature',geometry:hit.geometry,properties:{...(hit.properties||{})},id:hit.id,layer:{id:hit.layer?.id||''}};
                  if(typeof window.__BP_V5000_SELECT_BUILDING__!=='function')throw new Error('PUBLIC_BUILDING_SELECTOR_MISSING');
                  const selectorReturn=window.__BP_V5000_SELECT_BUILDING__({lngLat,feature});
                  const panel=document.getElementById('buildingPanel');
                  return {selectorReturn,hidden:panel?.hidden,display:panel?getComputedStyle(panel).display:null,title:document.getElementById('buildingTitle')?.textContent};
                }).then(state=>{
                  console.log('BRIDGEPOINT_FALLBACK_SELECTOR_STATE',JSON.stringify(state));
                  if(state?.selectorReturn!==true||state?.hidden!==false)throw new Error('PUBLIC_BUILDING_SELECTOR_DID_NOT_OPEN '+JSON.stringify(state));
                });
              }
              console.log('BRIDGEPOINT_BUILDING_CLICK_PANEL_OPEN',touchOpened?'TOUCH':'MAP_HIT_TEST');
              await p.waitForFunction(()=>{
                const vals=[
                  document.getElementById('bHeight')?.textContent,
                  document.getElementById('bFloors')?.textContent,
                  document.getElementById('bSource')?.textContent,
                  document.getElementById('bFootprintArea')?.textContent,
                  document.getElementById('bProvDataset')?.textContent
                ];
                return vals.every(v=>v&&v!=='—'&&!/^Resolving/i.test(v));
              },{timeout:15000});
              console.log('BRIDGEPOINT_BUILDING_CARD_POPULATED');

              const out=await p.evaluate(()=>({
                version:window.__BP_FRONTEND_VERSION,
                canvases:document.querySelectorAll('#liveMap canvas').length,
                canonical:document.getElementById('canonicalProperties')?.textContent,
                horizonLinks:[...document.querySelectorAll('a')].filter(a=>/horizon/i.test(a.href+a.textContent)).length,
                panel:!!document.getElementById('systemPanel'),
                contextTab:!!document.getElementById('bpTabContext'),
                xrayEvidence:!!document.getElementById('bXrayUnderground'),
                liveButton:!!document.getElementById('toggleLiveContext'),
                liveLayer:!!window.__BP_V5000_WORLD?.map?.getLayer('bp-v5004-weather-points'),
                placeLabels:!!window.__BP_V5000_WORLD?.map?.getLayer('gta-place-label'),
                roadLabels:!!window.__BP_V5000_WORLD?.map?.getLayer('gta-road-label-major'),
                poiLabels:!!window.__BP_V5000_WORLD?.map?.getLayer('gta-poi-label'),
                opportunityBuildings:!!window.__BP_V5000_WORLD?.map?.getLayer('gta-opportunity-buildings'),
                opportunityLabels:!!window.__BP_V5000_WORLD?.map?.getLayer('gta-opportunity-label'),
                opportunityRendered:(()=>{const m=window.__BP_V5000_WORLD?.map,pt=m?.project([-72.6716132,41.7409742]);if(!m||!pt)return false;try{return m.queryRenderedFeatures(pt,{layers:['gta-opportunity-buildings']}).length>0}catch{return false}})(),
                renderedPlaceLabels:(()=>{const m=window.__BP_V5000_WORLD?.map;if(!m)return 0;try{return m.queryRenderedFeatures({layers:['gta-place-label']}).length}catch{return 0}})(),
                semanticLabels:(()=>{const m=window.__BP_V5000_WORLD?.map,d=m?.getSource('bpSemanticLabels')?.serialize?.()?.data;return Array.isArray(d?.features)?d.features.length:0})(),
                buildingAnchoredSemanticLabels:(()=>{const m=window.__BP_V5000_WORLD?.map,d=m?.getSource('bpSemanticLabels')?.serialize?.()?.data;return Array.isArray(d?.features)?d.features.filter(f=>f?.properties?.anchor_truth==='BUILDING_ANCHORED').length:0})(),
                searchCollapsed:(()=>{const f=document.getElementById('publicSearchForm');return !f||getComputedStyle(f).visibility==='hidden'||getComputedStyle(f).display==='none'||Number(getComputedStyle(f).opacity)===0})(),
                liveLegend:document.getElementById('liveLegendCount')?.textContent,
                surfaceMaterial:!!document.getElementById('ctxSurfaceMaterial'),
                surfaceSource:!!document.getElementById('ctxSurfaceSource'),
                transportArchive:document.getElementById('transportArchive')?.textContent,
                transportRuntime:document.getElementById('transportRuntime')?.textContent,
                buildingPanelVisible:document.getElementById('buildingPanel')?.hidden===false,
                buildingTitle:document.getElementById('buildingTitle')?.textContent,
                buildingHeight:document.getElementById('bHeight')?.textContent,
                buildingFloors:document.getElementById('bFloors')?.textContent,
                buildingSource:document.getElementById('bSource')?.textContent,
                buildingFootprint:document.getElementById('bFootprintArea')?.textContent,
                buildingDataset:document.getElementById('bProvDataset')?.textContent,
                selectedBuildingCount:(()=>{const d=window.__BP_V5000_WORLD?.map?.getSource('bpV5000SelectedBuilding')?.serialize?.()?.data;return d?.features?.length||0})(),
                selectedParcelCount:(()=>{const d=window.__BP_V5000_WORLD?.map?.getSource('bpV5001SelectedParcel')?.serialize?.()?.data;return d?.features?.length||0})(),
                legacySelectedCount:(()=>{const d=window.__BP_V5000_WORLD?.map?.getSource('selected')?.serialize?.()?.data;return d?.features?.length||0})(),
                buildingResolutionMethod:document.getElementById('bProvPolicy')?.textContent,
                buildingTruthBadge:document.getElementById('buildingTruthBadge')?.textContent
              }));
              if(errors.length||out.version!==5000||out.canvases!==1||out.horizonLinks!==0||!out.panel||!out.contextTab||!out.xrayEvidence||!out.liveButton||!out.liveLayer||!out.placeLabels||!out.roadLabels||!out.poiLabels||!out.opportunityBuildings||!out.opportunityLabels||!out.opportunityRendered||out.renderedPlaceLabels<1||out.semanticLabels<1||out.buildingAnchoredSemanticLabels<1||!out.searchCollapsed||!out.liveLegend||out.liveLegend==='CHECKING'||!out.surfaceMaterial||!out.surfaceSource||!out.transportArchive||out.transportArchive==='—'||!out.transportRuntime||out.transportRuntime==='—'||!out.buildingPanelVisible||!out.buildingHeight||out.buildingHeight==='—'||!out.buildingFloors||out.buildingFloors==='—'||!out.buildingSource||out.buildingSource==='—'||!out.buildingFootprint||!out.buildingDataset||out.selectedBuildingCount!==1||out.selectedParcelCount!==0||out.legacySelectedCount!==0)throw new Error('V5000 Android smoke failed '+JSON.stringify({out,errors}));
              console.log('BRIDGEPOINT_V5000_ANDROID_PASS',JSON.stringify(out));
            }finally{await browser.close()}
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE

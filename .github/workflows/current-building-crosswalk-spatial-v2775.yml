name: Current Building Crosswalk Spatial v2775

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/current-building-crosswalk-spatial-v2775.yml'

permissions:
  contents: read
  id-token: write

# Same group as the superseded matcher: launching this run cancels the old
# hash-lane run so only one current crosswalk sprint can write these states.
concurrency:
  group: bridgepoint-current-building-crosswalk-v2752
  cancel-in-progress: true

env:
  SUPABASE_URL: https://xdfsjztwgsbmabshzsjw.supabase.co

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests==2.32.5
      - name: Prepare geographic lanes
        run: python scripts/manage-current-building-crosswalk-spatial-v2775.py --mode prepare

  match:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include:
          - { state: LA, lane: 0, lanes: 3 }
          - { state: LA, lane: 1, lanes: 3 }
          - { state: LA, lane: 2, lanes: 3 }
          - { state: PA, lane: 0, lanes: 5 }
          - { state: PA, lane: 1, lanes: 5 }
          - { state: PA, lane: 2, lanes: 5 }
          - { state: PA, lane: 3, lanes: 5 }
          - { state: PA, lane: 4, lanes: 5 }
          - { state: NY, lane: 0, lanes: 8 }
          - { state: NY, lane: 1, lanes: 8 }
          - { state: NY, lane: 2, lanes: 8 }
          - { state: NY, lane: 3, lanes: 8 }
          - { state: NY, lane: 4, lanes: 8 }
          - { state: NY, lane: 5, lanes: 8 }
          - { state: NY, lane: 6, lanes: 8 }
          - { state: NY, lane: 7, lanes: 8 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check duckdb==1.4.1 pyarrow==21.0.0 requests==2.32.5
      - name: Match geographic building lane
        run: python scripts/build-current-building-crosswalk-spatial-lane-v2775.py --state "${{ matrix.state }}" --lane "${{ matrix.lane }}" --lanes "${{ matrix.lanes }}"

  finalize-la:
    needs: match
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --disable-pip-version-check requests==2.32.5
      - run: python scripts/manage-current-building-crosswalk-spatial-v2775.py --mode finalize --state LA --lanes 3

  finalize-pa:
    needs: match
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --disable-pip-version-check requests==2.32.5
      - run: python scripts/manage-current-building-crosswalk-spatial-v2775.py --mode finalize --state PA --lanes 5

  finalize-ny:
    needs: match
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install --disable-pip-version-check requests==2.32.5
      - run: python scripts/manage-current-building-crosswalk-spatial-v2775.py --mode finalize --state NY --lanes 8

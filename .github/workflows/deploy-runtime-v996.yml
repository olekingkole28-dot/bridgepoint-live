name: Deploy BridgePoint Runtime V996

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deploy-runtime-v996.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble v996 live artifact
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site && mkdir site
          git archive --format=tar origin/live-artifact | tar -xf - -C site
          test -s site/app/index.html
          test -s site/app/nav-clearance-v991.js
          node --check site/app/nav-clearance-v991.js
          node --check site/app/tab-handoff-v990.js
          test ! -e site/app/nav-seam-cover-v994.js

      - name: Verify visual boundary leaves tabs interactive
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-bridgepoint-runtime="v996"' site/app/index.html
          grep -q 'nav-clearance-v991.js?v=996' site/app/index.html
          ! grep -q 'nav-seam-cover-v994.js?v=' site/app/index.html
          grep -q -- '--bp996-touch-clearance' site/app/nav-clearance-v991.js
          grep -q -- '--bp996-visual-clearance' site/app/nav-clearance-v991.js
          grep -q 'const overlap=Math.min(66' site/app/nav-clearance-v991.js
          grep -q 'pointer-events:none!important' site/app/nav-clearance-v991.js
          grep -q 'bottom:var(--bp996-touch-clearance' site/app/nav-clearance-v991.js
          grep -q 'bottom:var(--bp996-visual-clearance' site/app/nav-clearance-v991.js
          grep -q '"start_url": "./?bpv=v996"' site/app/manifest.json
          grep -q "BRIDGEPOINT_CACHE_RETIREMENT = 'v996'" site/app/flutter_service_worker.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy v996
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify v996 on actual public domain
        shell: bash
        run: |
          set -euo pipefail
          origin='https://bridgepointintelligence.online'
          for attempt in $(seq 1 30); do
            app="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${origin}/app/?v996=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            nav="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${origin}/app/nav-clearance-v991.js?v996=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            if printf '%s' "$app" | grep -q 'data-bridgepoint-runtime="v996"' \
              && printf '%s' "$app" | grep -q 'nav-clearance-v991.js?v=996' \
              && printf '%s' "$nav" | grep -q -- '--bp996-touch-clearance' \
              && printf '%s' "$nav" | grep -q -- '--bp996-visual-clearance' \
              && printf '%s' "$nav" | grep -q 'const overlap=Math.min(66'; then
              echo 'BridgePoint v996 visual nav boundary verified on public domain.'
              exit 0
            fi
            sleep 8
          done
          echo 'v996 did not converge on public domain' >&2
          exit 1

name: Deploy BridgePoint Owner Local AI V619

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-owner-local-ai-v592.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy-local-ai:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble from authoritative durable artifact
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site
          mkdir -p site
          git archive --format=tar origin/live-artifact | tar -xf - -C site
          test -s site/owner/local-ai/index.html
          test -s site/owner/backup/index.html
          test -s site/downloads/local-ai/Install_BridgePoint_Local_AI.bat
          test -s site/downloads/local-ai/install_windows.ps1
          test -s site/downloads/local-ai/bridgepoint_local_ai.ps1
          test -s site/downloads/backup/BridgePoint_Backup_Wizard.bat
          test -s site/downloads/backup/BridgePoint_Restore_Test.bat
          grep -q 'Install_BridgePoint_Local_AI.bat' site/owner/local-ai/index.html
          grep -q 'BridgePoint Backup & Restore' site/owner/backup/index.html
          if grep -R -E -i 'SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=|sb_secret_|OPENAI_API_KEY[[:space:]]*=|ANTHROPIC_API_KEY[[:space:]]*=|sk-proj-|sk-ant-' site/owner site/downloads; then
            echo 'Privileged secret marker found in autonomy artifact.' >&2
            exit 1
          fi
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish current Local AI + backup surfaces
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live Local AI + backup
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 8 --retry-delay 3 https://bridgepointintelligence.online/owner/local-ai/ -o /tmp/local-ai.html
          curl -fsSL --retry 8 --retry-delay 3 https://bridgepointintelligence.online/owner/backup/ -o /tmp/backup.html
          grep -q 'Download One-Click Installer' /tmp/local-ai.html
          grep -q 'Run Full Backup' /tmp/backup.html
          curl -fsSL --retry 8 --retry-delay 3 https://bridgepointintelligence.online/downloads/local-ai/Install_BridgePoint_Local_AI.bat -o /tmp/local-ai.bat
          curl -fsSL --retry 8 --retry-delay 3 https://bridgepointintelligence.online/downloads/backup/BridgePoint_Backup_Wizard.bat -o /tmp/backup.bat
          test -s /tmp/local-ai.bat
          test -s /tmp/backup.bat

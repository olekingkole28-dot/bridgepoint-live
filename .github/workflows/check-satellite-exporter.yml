name: Check BridgePoint Satellite Exporter

on:
  push:
    paths:
      - "tools/satellite/**"
      - ".github/workflows/check-satellite-exporter.yml"
  pull_request:
    paths:
      - "tools/satellite/**"
      - ".github/workflows/check-satellite-exporter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-exporter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/satellite/requirements.txt
      - name: Install exporter dependencies
        run: python -m pip install --disable-pip-version-check -r tools/satellite/requirements.txt
      - name: Syntax-check and smoke-test CLI
        run: |
          python -m py_compile tools/satellite/landsat_false_color.py
          python tools/satellite/landsat_false_color.py --help
      - name: Run unit tests
        run: python -m unittest discover -s tools/satellite -p "test_*.py" -v

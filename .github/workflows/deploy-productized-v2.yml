name: Deploy Productized BridgePoint V2

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      EXPECTED_SOURCE: 4a692708547d1f2d8ac3cfc8c50885bdff42e97d
      EXPECTED_ARCHIVE_SHA: 2229985b9631ba89a0940ba57369084d1daa02d75bca077e700b87fd849c9f9a
      EXPECTED_ARCHIVE_BYTES: '1257964'
      EXPECTED_FONT_SHA: cd21fa0f1e2df7f592d7613a9bf6a273c1022c19e0d4393d3f34f5b481a3ff8b
      EXPECTED_SPACE_SHA: acad6de1fc93436f5c0f1f4137751ef04f1aea3063e7036535970ffcfbd79f72
      RELEASE_URL: https://xdfsjztwgsbmabshzsjw.supabase.co/storage/v1/object/public/bridgepoint-release-handoff/clean-v2-4a692708547d1f2d8ac3cfc8c50885bdff42e97d.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify exact productized release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bp-productized /tmp/bp-productized.tar.gz
          mkdir -p /tmp/bp-productized
          curl -fsSL --retry 6 --retry-delay 2 -H 'Cache-Control: no-cache' "$RELEASE_URL" -o /tmp/bp-productized.tar.gz
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,tarfile
          archive=Path('/tmp/bp-productized.tar.gz').read_bytes()
          if len(archive)!=int(os.environ['EXPECTED_ARCHIVE_BYTES']):
              raise SystemExit(f"Archive bytes mismatch: {len(archive)}")
          digest=hashlib.sha256(archive).hexdigest()
          if digest!=os.environ['EXPECTED_ARCHIVE_SHA']:
              raise SystemExit(f"Archive SHA mismatch: {digest}")
          target=Path('/tmp/bp-productized')
          with tarfile.open('/tmp/bp-productized.tar.gz','r:gz') as tf:
              base=target.resolve()
              for m in tf.getmembers():
                  resolved=(target/m.name).resolve()
                  if not str(resolved).startswith(str(base)):
                      raise SystemExit('Unsafe archive member')
              tf.extractall(target)
          required=['index.html','main.dart.js','flutter_bootstrap.js','bridgepoint-v2-release.json','bridgepoint-release.json','public-promotion-v682.json','assets/FontManifest.json','assets/fonts/MaterialIcons-Regular.otf','assets/assets/brand/bridgepoint-mark-v80.svg']
          missing=[p for p in required if not (target/p).is_file()]
          if missing: raise SystemExit('Missing release files: '+', '.join(missing))
          release=json.loads((target/'bridgepoint-v2-release.json').read_text())
          promo=json.loads((target/'public-promotion-v682.json').read_text())
          if release.get('version')!=os.environ['EXPECTED_SOURCE'] or release.get('architecture')!='clean-v2':
              raise SystemExit('Release source marker mismatch')
          for flag in ['restored_product_surfaces','progressive_national_map','saved_alerts_restored','opportunities_restored','current_icon_font','visual_polish_v2']:
              if release.get(flag) is not True: raise SystemExit(f'{flag} missing')
          if release.get('brand_font')!='SpaceGrotesk': raise SystemExit('Brand font marker missing')
          if promo.get('compiled_source_sha')!=os.environ['EXPECTED_SOURCE']: raise SystemExit('Promotion source mismatch')
          if promo.get('source_repo_private') is not True: raise SystemExit('Private source provenance missing')
          main_sha=hashlib.sha256((target/'main.dart.js').read_bytes()).hexdigest()
          if main_sha!=promo.get('main_js_sha256'): raise SystemExit('Compiled JS digest mismatch')
          icon=target/'assets/fonts/MaterialIcons-Regular.otf'
          icon_sha=hashlib.sha256(icon.read_bytes()).hexdigest()
          if icon_sha!=os.environ['EXPECTED_FONT_SHA']: raise SystemExit('Material font SHA mismatch')
          spaces=list((target/'assets').rglob('SpaceGrotesk.ttf'))
          if len(spaces)!=1: raise SystemExit(f'Expected one SpaceGrotesk.ttf, found {len(spaces)}')
          space_sha=hashlib.sha256(spaces[0].read_bytes()).hexdigest()
          if space_sha!=os.environ['EXPECTED_SPACE_SHA']: raise SystemExit('Space Grotesk SHA mismatch')
          if 'BridgePointGrotesk' not in (target/'assets/FontManifest.json').read_text(): raise SystemExit('FontManifest missing BridgePointGrotesk')
          print(json.dumps({'source':release['version'],'bytes':len(archive),'archive_sha':digest,'icon_sha':icon_sha,'space_sha':space_sha},indent=2))
          PY

      - name: Assemble durable public site
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site && mkdir site
          git archive --format=tar origin/live-artifact | tar -xf - -C site
          test -s site/index.html
          test -d site/app/assets
          test -d site/app/canvaskit
          test -d site/app/icons
          cp -a /tmp/bp-productized/. site/app/
          touch site/.nojekyll site/app/.nojekyll
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          source=os.environ['EXPECTED_SOURCE']
          release=json.loads(Path('site/app/bridgepoint-v2-release.json').read_text())
          promo=json.loads(Path('site/app/public-promotion-v682.json').read_text())
          if release.get('version')!=source: raise SystemExit('Site release source mismatch')
          if promo.get('compiled_source_sha')!=source: raise SystemExit('Site promotion source mismatch')
          if hashlib.sha256(Path('site/app/main.dart.js').read_bytes()).hexdigest()!=promo.get('main_js_sha256'): raise SystemExit('Site JS digest mismatch')
          if hashlib.sha256(Path('site/app/assets/fonts/MaterialIcons-Regular.otf').read_bytes()).hexdigest()!=os.environ['EXPECTED_FONT_SHA']: raise SystemExit('Site icon font mismatch')
          spaces=list(Path('site/app/assets').rglob('SpaceGrotesk.ttf'))
          if len(spaces)!=1 or hashlib.sha256(spaces[0].read_bytes()).hexdigest()!=os.environ['EXPECTED_SPACE_SHA']: raise SystemExit('Site Space Grotesk mismatch')
          if 'BridgePointGrotesk' not in Path('site/app/assets/FontManifest.json').read_text(): raise SystemExit('Site font manifest mismatch')
          if not Path('site/app/assets/assets/brand/bridgepoint-mark-v80.svg').is_file(): raise SystemExit('Brand mark missing')
          if not Path('site/app/canvaskit/canvaskit.wasm').is_file(): raise SystemExit('CanvasKit missing')
          Path('site/app/productized-ui-release.json').write_text(json.dumps({'source_sha':source,'property_dossier_v2':True,'property_visuals_v2':True,'operations_product_ui_v2':True},separators=(',',':')))
          PY

      - name: Persist durable live-artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/final-live && mkdir /tmp/final-live
          cp -a site/. /tmp/final-live/
          cd /tmp/final-live
          git init -q
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m "Publish productized BridgePoint V2 ${EXPECTED_SOURCE}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy productized V2
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live productized app
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://bridgepointintelligence.online'
          for attempt in $(seq 1 24); do
            marker="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/bridgepoint-v2-release.json?verify=${EXPECTED_SOURCE}" 2>/dev/null || true)"
            productized="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/productized-ui-release.json?verify=${EXPECTED_SOURCE}" 2>/dev/null || true)"
            app="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/?verify=${EXPECTED_SOURCE}" 2>/dev/null || true)"
            curl -sS -o /tmp/bp-icon.otf --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/assets/fonts/MaterialIcons-Regular.otf?verify=${EXPECTED_SOURCE}" >/dev/null 2>&1 || true
            curl -sS -o /tmp/bp-space.ttf --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/assets/assets/fonts/SpaceGrotesk.ttf?verify=${EXPECTED_SOURCE}" >/dev/null 2>&1 || true
            icon_sha="$(sha256sum /tmp/bp-icon.otf 2>/dev/null | awk '{print $1}' || true)"
            space_sha="$(sha256sum /tmp/bp-space.ttf 2>/dev/null | awk '{print $1}' || true)"
            if printf '%s' "$marker" | grep -q "$EXPECTED_SOURCE" && printf '%s' "$productized" | grep -q 'property_dossier_v2' && printf '%s' "$productized" | grep -q 'operations_product_ui_v2' && printf '%s' "$app" | grep -q 'flutter_bootstrap.js' && [ "$icon_sha" = "$EXPECTED_FONT_SHA" ] && [ "$space_sha" = "$EXPECTED_SPACE_SHA" ]; then
              echo "Productized BridgePoint V2 verified live at ${ORIGIN}/app/"
              exit 0
            fi
            sleep 10
          done
          echo 'Productized V2 did not converge on the public domain.' >&2
          exit 1

name: BridgePoint Headless App Watcher V2101

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rebuild-v5000/**'
      - 'release-v2300/**'

permissions:
  contents: read

concurrency:
  group: bridgepoint-headless-app-watcher-v2101
  cancel-in-progress: true

jobs:
  browser-synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for matching production build
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='${{ github.sha }}'
          GOT=''
          for i in $(seq 1 72); do
            GOT=$(curl -fsSL --retry 2 --retry-all-errors --max-time 15 "https://bridgepointintelligence.online/build.json?watch=${GITHUB_RUN_ID}-${i}" 2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin).get('commit',''))" 2>/dev/null || true)
            if [ "$GOT" = "$EXPECTED" ]; then
              echo "MATCHING_PRODUCTION_BUILD $GOT"
              exit 0
            fi
            echo "WAITING_FOR_PRODUCTION expected=$EXPECTED got=$GOT attempt=$i"
            sleep 5
          done
          echo "PRODUCTION_BUILD_MISMATCH expected=$EXPECTED got=$GOT"
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run headless customer-path synthetic
        env:
          HEADLESS_TARGETS: https://bridgepointintelligence.online/,https://bridgepointintelligence.online/app/
        run: node ops/headless_app_synthetic_v2101.mjs

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: headless-app-failure-${{ github.run_id }}
          path: headless-artifacts/
          retention-days: 7
          if-no-files-found: ignore

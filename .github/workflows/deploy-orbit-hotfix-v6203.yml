name: Publish BridgePoint Orbit & Motion Recovery v6240

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-orbit-hotfix-v6203.yml'
      - 'rebuild-v5000/bridgepoint-global-motion-v5926.js'
      - 'rebuild-v5000/bridgepoint-orbit-renderer-v6201.js'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the latest successful production Pages artifact
        id: baseline
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=success&branch=main&per_page=100" --jq '.workflow_runs | map(select(.conclusion == "success")) | .[].id')"
          BASELINE_ID=""
          ARTIFACT=""
          for run_id in $RUNS; do
            candidate="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" --jq '.artifacts[]? | select((.expired|not) and (.name | startswith("bridgepoint-v5000-"))) | .name' | head -n 1 || true)"
            if [ -n "$candidate" ]; then
              BASELINE_ID="$run_id"
              ARTIFACT="$candidate"
              break
            fi
          done
          test -n "$BASELINE_ID"
          test -n "$ARTIFACT"
          echo "run_id=$BASELINE_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "CURRENT_PRODUCTION_BASELINE run=$BASELINE_ID artifact=$ARTIFACT"

      - name: Download the current production snapshot
        uses: actions/download-artifact@v4
        with:
          name: "${{ steps.baseline.outputs.artifact_name }}"
          run-id: "${{ steps.baseline.outputs.run_id }}"
          repository: "${{ github.repository }}"
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          path: "${{ runner.temp }}/bp-pages-baseline"

      - name: Restore production and fingerprint all non-target files
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find "$RUNNER_TEMP/bp-pages-baseline" -type f -name artifact.tar -print -quit)"
          test -n "$ARCHIVE"
          SITE="$RUNNER_TEMP/bp-site"
          mkdir -p "$SITE"
          tar -xf "$ARCHIVE" -C "$SITE"
          for f in index.html app/index.html landing.js app.js \
                   bridgepoint-global-motion-v5926.js \
                   bridgepoint-orbit-renderer-v6201.js \
                   starlink-orbits-v2.json; do
            test -s "$SITE/$f" || { echo "Latest production artifact missing required file: $f"; exit 1; }
          done
          python3 - <<'PY'
          import hashlib,json,os,datetime
          from pathlib import Path
          site=Path(os.environ["RUNNER_TEMP"])/"bp-site"
          excluded={"index.html","app/index.html",
                    "bridgepoint-global-motion-v5926.js","app/bridgepoint-global-motion-v5926.js",
                    "bridgepoint-orbit-renderer-v6201.js","app/bridgepoint-orbit-renderer-v6201.js"}
          def digest(path):
              h=hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""): h.update(chunk)
              return h.hexdigest()
          before={}
          targets={}
          for p in sorted(site.rglob("*")):
              if not p.is_file(): continue
              rel=p.relative_to(site).as_posix()
              if rel in excluded: targets[rel]=digest(p)
              else: before[rel]=digest(p)
          required_existing={"index.html","app/index.html",
                             "bridgepoint-global-motion-v5926.js","bridgepoint-orbit-renderer-v6201.js"}
          if not required_existing.issubset(targets):
              raise SystemExit("Production Orbit & Motion baseline is missing root targets: "+
                               repr(sorted(required_existing-set(targets))))
          catalog=json.loads((site/"starlink-orbits-v2.json").read_text())
          fetched=datetime.datetime.fromisoformat(catalog["fetched_at"].replace("Z","+00:00"))
          age=(datetime.datetime.now(datetime.timezone.utc)-fetched).total_seconds()
          if catalog.get("version")!=2 or len(catalog.get("records",[]))<2500 or age>7*86400 or age< -21600:
              raise SystemExit("Shared recent satellite OMM cache failed completeness/freshness gate")
          tmp=Path(os.environ["RUNNER_TEMP"])
          (tmp/"bp-orbit-preservation-before.json").write_text(json.dumps(before,sort_keys=True))
          (tmp/"bp-orbit-target-before.json").write_text(json.dumps(targets,sort_keys=True))
          print("LATEST_PRODUCTION_BASELINE_FILES_FINGERPRINTED",len(before))
          print("PUBLISHED_RECENT_OMM_RECORDS",len(catalog["records"]),"age_hours",round(age/3600,2))
          print("ONLY_REQUESTED_ORBIT_TARGETS",len(targets))
          PY

      - name: Restore cached orbital data and overlay Orbit & Motion
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/bp-site"
          for feature in bridgepoint-global-motion-v5926.js bridgepoint-orbit-renderer-v6201.js; do
            cp "rebuild-v5000/$feature" "$SITE/$feature"
            cp "rebuild-v5000/$feature" "$SITE/app/$feature"
          done
          python3 - <<'PY'
          from pathlib import Path
          import os
          site=Path(os.environ["RUNNER_TEMP"])/"bp-site"
          old="bridgepoint-global-motion-v5926.js?v=6238-pc-runtime"
          new="bridgepoint-global-motion-v5926.js?v=6240-orbit-motion-restored-3d-markers"
          for rel in ("index.html","app/index.html"):
              p=site/rel
              data=p.read_text(encoding="utf-8")
              count=data.count(old)
              if count!=1:
                  raise SystemExit(f"{rel}: expected one current Orbit & Motion loader, found {count}")
              p.write_text(data.replace(old,new),encoding="utf-8")
          controller=site/"bridgepoint-global-motion-v5926.js"
          data=controller.read_text(encoding="utf-8")
          old_renderer="bridgepoint-orbit-renderer-v6201.js?v=6240-orbit-motion-3d-preview-polygons-light-paths"
          if old_renderer not in data:
              raise SystemExit("Orbit renderer cache key missing from controller")
          print("ORBIT_ENTRYPOINT_CACHE_KEYS_UPDATED")
          PY

      - name: Check Orbit & Motion module syntax and snapshot parity
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/bp-site"
          node --check "$SITE/bridgepoint-global-motion-v5926.js"
          node --check "$SITE/app/bridgepoint-global-motion-v5926.js"
          node --input-type=module --check < "$SITE/bridgepoint-orbit-renderer-v6201.js"
          node --input-type=module --check < "$SITE/app/bridgepoint-orbit-renderer-v6201.js"
          cmp -s "$SITE/bridgepoint-global-motion-v5926.js" "$SITE/app/bridgepoint-global-motion-v5926.js"
          cmp -s "$SITE/bridgepoint-orbit-renderer-v6201.js" "$SITE/app/bridgepoint-orbit-renderer-v6201.js"
          grep -Fq 'function loadPublishedSatelliteFallback()' "$SITE/bridgepoint-global-motion-v5926.js"
          grep -Fq '/starlink-orbits-v2.json' "$SITE/bridgepoint-global-motion-v5926.js"
          grep -Fq 'function showSatelliteInfoCard(hit,event)' "$SITE/bridgepoint-global-motion-v5926.js"
          grep -Fq 'function mountSatellitePreview(canvas,item)' "$SITE/bridgepoint-orbit-renderer-v6201.js"
          grep -Fq 'OctahedronGeometry(1.05,0)' "$SITE/bridgepoint-orbit-renderer-v6201.js"
          grep -Fq 'opacity:.08' "$SITE/bridgepoint-orbit-renderer-v6201.js"
          grep -Fq 'pickAtPoint(event.point,24)' "$SITE/bridgepoint-global-motion-v5926.js"
          echo "ORBIT_MOTION_SOURCE_CACHE_MARKERS_CARD_AND_PATHS_PASS"

      - name: Prove only the requested Orbit & Motion files changed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          site=Path(os.environ["RUNNER_TEMP"])/"bp-site"
          tmp=Path(os.environ["RUNNER_TEMP"])
          before=json.loads((tmp/"bp-orbit-preservation-before.json").read_text())
          target_before=json.loads((tmp/"bp-orbit-target-before.json").read_text())
          excluded={"index.html","app/index.html",
                    "bridgepoint-global-motion-v5926.js","app/bridgepoint-global-motion-v5926.js",
                    "bridgepoint-orbit-renderer-v6201.js","app/bridgepoint-orbit-renderer-v6201.js"}
          def digest(path):
              h=hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""): h.update(chunk)
              return h.hexdigest()
          after={}
          targets={}
          for p in sorted(site.rglob("*")):
              if not p.is_file(): continue
              rel=p.relative_to(site).as_posix()
              if rel in excluded: targets[rel]=digest(p)
              else: after[rel]=digest(p)
          if before!=after:
              raise SystemExit("UNRELATED_PRODUCTION_FILE_CHANGE "+json.dumps({
                  "missing":sorted(set(before)-set(after))[:25],
                  "added":sorted(set(after)-set(before))[:25],
                  "changed":sorted(k for k in before.keys() & after.keys() if before[k]!=after[k])[:25]
              }))
          expected_targets={"index.html","app/index.html",
                            "bridgepoint-global-motion-v5926.js","app/bridgepoint-global-motion-v5926.js",
                            "bridgepoint-orbit-renderer-v6201.js","app/bridgepoint-orbit-renderer-v6201.js"}
          if not set(target_before).issubset(expected_targets) or set(targets)!=expected_targets:
              raise SystemExit("EXPECTED_ORBIT_TARGET_PATHS_MISSING")
          unchanged=[k for k in target_before if targets[k]==target_before[k]]
          if unchanged:
              raise SystemExit("EXPECTED_ORBIT_TARGET_CHANGE_MISSING "+repr(unchanged))
          for feature in ("bridgepoint-global-motion-v5926.js","bridgepoint-orbit-renderer-v6201.js"):
              if digest(site/feature)!=digest(site/"app"/feature):
                  raise SystemExit("ROOT_APP_ORBIT_MODULE_MISMATCH "+feature)
          print("NON_TARGET_PRODUCTION_FILES_BYTE_FOR_BYTE_PRESERVED",len(before))
          print("ONLY_SIX_ORBIT_TARGET_PATHS_CHANGED")
          PY

      - uses: actions/configure-pages@v5

      - name: Upload the preserved production site with restored Orbit & Motion
        uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-v5000-${{ github.run_attempt }}
          path: "${{ runner.temp }}/bp-site"
          include-hidden-files: true

      - name: Publish the preserved production snapshot
        id: deployment
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: node scripts/deploy-pages-extended.mjs

      - name: Verify Orbit & Motion is live
        shell: bash
        run: |
          set -euo pipefail
          O='https://bridgepointintelligence.online'
          Q="$GITHUB_SHA-orbit-motion-v6240"
          D="$RUNNER_TEMP/bp-orbit-live"
          mkdir -p "$D"
          fetch() {
            curl --retry 7 --retry-all-errors --retry-delay 3 --max-time 35 -fsSL \
              -H 'Cache-Control: no-cache' "$O/$1?verify=$Q" -o "$D/$2"
          }
          fetch '' root.html
          fetch 'app/' app.html
          fetch 'bridgepoint-global-motion-v5926.js' controller.js
          fetch 'app/bridgepoint-global-motion-v5926.js' app-controller.js
          fetch 'bridgepoint-orbit-renderer-v6201.js' renderer.js
          fetch 'app/bridgepoint-orbit-renderer-v6201.js' app-renderer.js
          cmp -s "$D/controller.js" "$D/app-controller.js"
          cmp -s "$D/renderer.js" "$D/app-renderer.js"
          grep -Fq 'bridgepoint-global-motion-v5926.js?v=6240-orbit-motion-restored-3d-markers' "$D/root.html"
          grep -Fq 'bridgepoint-global-motion-v5926.js?v=6240-orbit-motion-restored-3d-markers' "$D/app.html"
          grep -Fq 'loadPublishedSatelliteFallback' "$D/controller.js"
          grep -Fq 'starlink-orbits-v2.json' "$D/controller.js"
          grep -Fq 'mountSatellitePreview' "$D/renderer.js"
          grep -Fq 'OctahedronGeometry(1.05,0)' "$D/renderer.js"
          grep -Fq 'opacity:.08' "$D/renderer.js"
          grep -Fq '6240-orbit-motion-3d-preview-polygons-light-paths' "$D/controller.js"
          echo "BRIDGEPOINT_ORBIT_MOTION_RECOVERY_LIVE_PASS"

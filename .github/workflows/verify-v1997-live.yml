name: Verify V1997 Live Map Correctly
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-v1997-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Phone scene verification
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24 --no-audit --no-fund >/dev/null 2>&1
          CHROME_PATH="$CHROME" node <<'NODE'
          const puppeteer=require('puppeteer-core'),assert=require('assert');
          const origin='https://bridgepointintelligence.online';
          const cors={'Access-Control-Allow-Origin':origin,'Access-Control-Allow-Headers':'apikey,authorization,content-type,cache-control','Access-Control-Allow-Methods':'GET,POST,OPTIONS','Vary':'Origin'};
          (async()=>{const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox','--disable-dev-shm-usage','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader','--use-angle=swiftshader']});try{
            const ctx=browser.defaultBrowserContext();await ctx.overridePermissions(origin,['geolocation']);const p=await browser.newPage();await p.setViewport({width:390,height:844,deviceScaleFactor:2,isMobile:true,hasTouch:true});await p.setGeolocation({latitude:41.5623,longitude:-72.6506,accuracy:25});
            p.on('console',m=>{if(m.type()==='error')console.log('BROWSER_ERROR',m.text())});p.on('pageerror',e=>console.log('PAGE_ERROR',e.stack||e.message));
            await p.setRequestInterception(true);p.on('request',req=>{const u=req.url();if(u.includes('xdfsjztwgsbmabshzsjw.supabase.co')){if(req.method()==='OPTIONS')return req.respond({status:204,headers:cors,body:''});if(u.includes('/auth/v1/user'))return req.respond({status:200,headers:{...cors,'Content-Type':'application/json'},body:JSON.stringify({id:'00000000-0000-4000-8000-000000000001',email:'verify@bridgepoint.local'})});if(u.includes('/rest/v1/rpc/')){const name=u.split('/rpc/')[1].split('?')[0];let body={complete:true};if(name==='bridgepoint_legal_state_v82')body={complete:true,required_acceptance_missing:false,missing_count:0,documents:[]};if(name==='bridgepoint_trial_access_v1055')body={complete:true,owner_override:true,subscriptions:[]};if(name==='bridgepoint_public_system_pulse_v1992'||name==='bridgepoint_public_system_pulse_v957')body={total_parcels:158000000,total_addresses:134000000,total_source_records:222000000,active_opportunities:12000,signals:50000,detected_patterns:10000,scored_properties:100000,registered_sources:778,states_present:51};if(name==='bridgepoint_public_featured_media_v1986')body={items:[]};if(name==='bridgepoint_live_map_boundary_scene_v1997')body={complete:true,exact_count:1,estimated_count:1,exact_geojson:{type:'FeatureCollection',features:[{type:'Feature',geometry:{type:'Polygon',coordinates:[[[-72.652,41.561],[-72.649,41.561],[-72.649,41.564],[-72.652,41.564],[-72.652,41.561]]]},properties:{geometry_truth:'SOURCE_BACKED'}}]},estimated_geojson:{type:'FeatureCollection',features:[{type:'Feature',geometry:{type:'Polygon',coordinates:[[[-72.656,41.558],[-72.653,41.558],[-72.653,41.561],[-72.656,41.561],[-72.656,41.558]]]},properties:{geometry_truth:'ESTIMATED_VORONOI'}}]}};if(name==='bridgepoint_3d_world_viewport_v1997')body={complete:true,returned:2,buildings:[{building_id:'tall',geometry:{type:'Polygon',coordinates:[[[-72.6513,41.5619],[-72.6504,41.5619],[-72.6504,41.5628],[-72.6513,41.5628],[-72.6513,41.5619]]]},render_height_m:62,height_m:62,ground_elevation_m:0,floors:18,height_truth:'SOURCE_BACKED',truth_label:'Source-backed footprint and height.'},{building_id:'house',geometry:{type:'Polygon',coordinates:[[[-72.6499,41.5616],[-72.6493,41.5616],[-72.6493,41.5621],[-72.6499,41.5621],[-72.6499,41.5616]]]},render_height_m:9,ground_elevation_m:0,floors:2,height_truth:'FLOOR_DERIVED_VISUAL'}]};if(name==='bridgepoint_live_map_weather_scene_v1997')body={complete:true,events:[{hazard_event_id:'rain1',hazard_type:'RAIN',event_name:'Observed Rain',observation_kind:'OBSERVED',severity:'Moderate',latitude:41.5623,longitude:-72.6506,effect_mode:'OBSERVED_PHYSICAL_OR_SOURCE_GEOMETRY',render_primitive:'RADAR_PRECIPITATION_FIELD',headline:'Observed precipitation'}]};if(name==='bridgepoint_flutter_property_map_viewport_v1035')body=[];if(name==='bridgepoint_flutter_intelligence_map_national_v1037')body={opportunities:[]};if(name==='bridgepoint_daily_brief_v74')body=[];if(name==='bridgepoint_calendar_agenda_v835')body=[];if(name==='bridgepoint_watchlists_v88')body=[];if(name==='bridgepoint_my_property_trackers_v212')body=[];if(name==='bridgepoint_flutter_opportunities_v235')body=[];if(name==='bridgepoint_owner_ai_control_plane_v491')return req.respond({status:403,headers:{...cors,'Content-Type':'application/json'},body:JSON.stringify({message:'not owner'})});if(name==='bridgepoint_notifications_v74'||name==='bridgepoint_notification_preferences_v834')body=[];return req.respond({status:200,headers:{...cors,'Content-Type':'application/json'},body:JSON.stringify(body)});}}req.continue();});
            await p.goto(origin+'/?seed='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});await p.evaluate(()=>localStorage.setItem('sb-xdfsjztwgsbmabshzsjw-auth-token',JSON.stringify({access_token:'fake-live-v1997-access',refresh_token:'fake-live-v1997-refresh',expires_at:Math.floor(Date.now()/1000)+3600,user:{id:'00000000-0000-4000-8000-000000000001',email:'verify@bridgepoint.local'}})));await p.goto(origin+'/app/?surface=map&bpv=1997&verify='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
            await p.waitForFunction(()=>document.querySelector('#app')?.hidden===false,{timeout:7000});await p.waitForSelector('#bp97MapTools',{timeout:8000});await p.waitForFunction(()=>window.__bp97MapState?.ready===true&&document.querySelector('#liveMap canvas')?.width>100,{timeout:20000});await p.waitForFunction(()=>window.__bp97MapState?.map?.getZoom()>14,{timeout:12000});await p.waitForFunction(()=>window.__bp97MapState?.exact?.features?.length===1&&window.__bp97MapState?.estimated?.features?.length===1&&window.__bp97MapState?.buildings?.features?.length===2&&window.__bp97MapState?.hazards?.features?.length===1,{timeout:12000});
            const s=await p.evaluate(()=>{const x=window.__bp97MapState,m=x.map;return{zoom:m.getZoom(),center:m.getCenter().toArray(),terrain:!!m.getTerrain(),labels:!!m.getLayer('labels'),exactGlow:!!m.getLayer('bp97-exact-glow'),exactRise:!!m.getLayer('bp97-exact-rise'),est:!!m.getLayer('bp97-est-line'),building:!!m.getLayer('bp97-building'),floorBands:x.floors.features.length,weather:!!m.getLayer('bp97-weather-volume'),particles:x.particles.length,canvas:document.querySelector('#liveMap canvas').width,weatherCanvas:document.querySelector('#bp97WeatherCanvas').width}});console.log('STATE',s);assert(s.zoom>14);assert(Math.abs(s.center[0]+72.6506)<.1&&Math.abs(s.center[1]-41.5623)<.1);assert(s.terrain&&s.labels&&s.exactGlow&&s.exactRise&&s.est&&s.building&&s.floorBands>=18&&s.weather&&s.particles>0&&s.canvas>100&&s.weatherCanvas>100);await p.click('[data-bp97measure="distance"]');assert(await p.$eval('[data-bp97measure="distance"]',x=>x.classList.contains('active')));console.log('V1997_PHONE_SCENE_PASS');
          }finally{await browser.close()}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Public homepage verification
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          cd /tmp
          CHROME_PATH="$CHROME" node <<'NODE'
          const puppeteer=require('puppeteer-core'),assert=require('assert');
          (async()=>{const b=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox','--disable-dev-shm-usage']});try{const p=await b.newPage();await p.setViewport({width:390,height:844,deviceScaleFactor:2,isMobile:true,hasTouch:true});await p.goto('https://bridgepointintelligence.online/?bpv=1997&public='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});await p.waitForSelector('#bpAbout1997',{timeout:10000});await p.waitForSelector('#source-record-counter',{timeout:10000});const x=await p.evaluate(()=>({about:document.querySelector('#bpAbout1997')?.innerText||'',source:document.querySelector('#source-record-counter')?.textContent||'',sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));assert(/Canonical property foundation/.test(x.about)&&/Live weather \+ hazards/.test(x.about)&&x.sw<=x.cw+2);console.log('V1997_PUBLIC_SECTION_PASS',x.source)}finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          NODE

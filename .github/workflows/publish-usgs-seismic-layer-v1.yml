name: Publish BridgePoint USGS Seismic Activity Layer V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-usgs-seismic-layer-v1.yml'
      - 'release-v2300/world-v2300-seismic-layer-v1.js'
      - 'rebuild-v5000/app.js'
      - 'rebuild-v5000/landing.js'
      - 'tests/seismic-layer-v1.test.mjs'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the exact latest full-site production artifact (v6302)
        uses: actions/download-artifact@v4
        with:
          name: github-pages-v6302-earth-ray-opaque
          run-id: 43889146126
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/bp-pages-baseline

      - name: Restore latest production and fingerprint every non-target file
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find "$RUNNER_TEMP/bp-pages-baseline" -type f -name artifact.tar -print -quit)"
          test -n "$ARCHIVE"
          SITE="$RUNNER_TEMP/bp-site"
          mkdir -p "$SITE"
          tar -xf "$ARCHIVE" -C "$SITE"
          for f in index.html app/index.html landing.js app.js \
                   bridgepoint-app-space-explorer-v1.js bridgepoint-welcome-space-v6260.js \
                   bridgepoint-gaia-galaxy-v6270.js bridgepoint-saturn-system-v6282.js \
                   bridgepoint-mars-system-v6291.js world-v2300-clouds.js app/world-v2300-clouds.js \
                   assets/moon/v1/manifest.json assets/moon/v1/moon-global-height-4ppd-u16.png; do
            test -s "$SITE/$f" || { echo "Latest production artifact missing required preserved file: $f"; exit 1; }
          done
          test ! -e "$SITE/world-v2300-seismic-layer-v1.js"
          test ! -e "$SITE/app/world-v2300-seismic-layer-v1.js"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          site=Path(os.environ["RUNNER_TEMP"])/"bp-site"
          excluded={"index.html","app/index.html","landing.js","app.js",
                    "world-v2300-seismic-layer-v1.js","app/world-v2300-seismic-layer-v1.js"}
          def digest(path):
              h=hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""): h.update(chunk)
              return h.hexdigest()
          before={}
          targets={}
          for p in sorted(site.rglob("*")):
              if not p.is_file(): continue
              rel=p.relative_to(site).as_posix()
              if rel in excluded:
                  if rel in {"index.html","app/index.html","landing.js","app.js"}:
                      targets[rel]=digest(p)
                  continue
              before[rel]=digest(p)
          if set(targets)!={"index.html","app/index.html","landing.js","app.js"}:
              raise SystemExit("Production target entry files incomplete: "+repr(sorted(targets)))
          tmp=Path(os.environ["RUNNER_TEMP"])
          (tmp/"bp-seismic-preservation-before.json").write_text(json.dumps(before,sort_keys=True))
          (tmp/"bp-seismic-target-before.json").write_text(json.dumps(targets,sort_keys=True))
          print("LATEST_PRODUCTION_BASELINE_FILES_FINGERPRINTED",len(before))
          print("LATEST_PRODUCTION_TARGET_ENTRIES",len(targets))
          PY

      - name: Overlay only the new seismic module and its two entry-point integrations
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/bp-site"
          mkdir -p "$SITE/app"
          cp release-v2300/world-v2300-seismic-layer-v1.js "$SITE/world-v2300-seismic-layer-v1.js"
          cp release-v2300/world-v2300-seismic-layer-v1.js "$SITE/app/world-v2300-seismic-layer-v1.js"
          cp rebuild-v5000/landing.js "$SITE/landing.js"
          cp rebuild-v5000/app.js "$SITE/app.js"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          site=Path(os.environ["RUNNER_TEMP"])/"bp-site"
          build="usgs-seismic-layer-v1"
          def replace_once(rel,pattern,repl,label):
              p=site/rel
              s=p.read_text(encoding="utf-8")
              out,n=re.subn(pattern,repl,s,count=1)
              if n!=1: raise SystemExit(f"{rel}: {label} expected once, found {n}")
              p.write_text(out,encoding="utf-8")
          replace_once("index.html",
              r'((?:\./|/)?landing\.js\?v=)[^&"\'\s]+',
              r'\g<1>'+build,"homepage script cache key")
          replace_once("app/index.html",
              r'((?:\.\./|/)?app\.js\?v=)[^&"\'\s]+',
              r'\g<1>'+build,"app script cache key")
          for rel in ("landing.js","app.js"):
              s=(site/rel).read_text(encoding="utf-8")
              token="./world-v2300-seismic-layer-v1.js?v=1-usgs-comcat-m25-week"
              if s.count(token)!=1: raise SystemExit(f"{rel}: expected one seismic module import")
              if "window.__BP_USGS_SEISMIC_LAYER_V1__=m.initUSGSSeismicLayer(world)" not in s:
                  raise SystemExit(f"{rel}: missing seismic runtime attach")
          for rel in ("index.html","app/index.html"):
              s=(site/rel).read_text(encoding="utf-8")
              entry="landing.js" if rel=="index.html" else "app.js"
              if build not in s or entry not in s: raise SystemExit(f"{rel}: entry cache key missing")
          print("SEISMIC_ENTRYPOINT_OVERLAY_PASS")
          PY

      - name: Run source normalization, integration, and syntax tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/seismic-layer-v1.test.mjs
          node --input-type=module --check < release-v2300/world-v2300-seismic-layer-v1.js
          node --check "$RUNNER_TEMP/bp-site/landing.js"
          node --check "$RUNNER_TEMP/bp-site/app.js"
          cmp -s "$RUNNER_TEMP/bp-site/world-v2300-seismic-layer-v1.js" "$RUNNER_TEMP/bp-site/app/world-v2300-seismic-layer-v1.js"
          grep -Fq 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_week.geojson' "$RUNNER_TEMP/bp-site/world-v2300-seismic-layer-v1.js"
          grep -Fq 'state.enabled = next' "$RUNNER_TEMP/bp-site/world-v2300-seismic-layer-v1.js"
          grep -Fq 'M2.5+ · PAST 7 DAYS · SOURCE OFF' "$RUNNER_TEMP/bp-site/world-v2300-seismic-layer-v1.js"
          echo "BRIDGEPOINT_SEISMIC_SOURCE_AND_RENDERER_PASS"

      - name: Verify the public USGS feed when the upstream endpoint is reachable
        shell: bash
        run: |
          set -euo pipefail
          FEED="$RUNNER_TEMP/usgs-2.5-week.geojson"
          if curl --retry 3 --retry-all-errors --retry-delay 2 --max-time 25 -fsSL \
            -H 'Accept: application/geo+json, application/json' \
            'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_week.geojson' -o "$FEED"; then
            python3 - "$FEED" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d.get("type")=="FeatureCollection"
          assert isinstance(d.get("features"),list)
          assert isinstance(d.get("metadata"),dict)
          for f in d["features"]:
              assert f.get("geometry",{}).get("type")=="Point"
          print("LIVE_USGS_GEOJSON_FEED_PASS",len(d["features"]))
          PY
          else
            echo "USGS endpoint was temporarily unreachable during build; layer remains opt-in and surfaces upstream unavailability without fabricated data."
          fi

      - name: Prove no unrelated production file changed or disappeared
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          site=Path(os.environ["RUNNER_TEMP"])/"bp-site"
          tmp=Path(os.environ["RUNNER_TEMP"])
          before=json.loads((tmp/"bp-seismic-preservation-before.json").read_text())
          target_before=json.loads((tmp/"bp-seismic-target-before.json").read_text())
          excluded={"index.html","app/index.html","landing.js","app.js",
                    "world-v2300-seismic-layer-v1.js","app/world-v2300-seismic-layer-v1.js"}
          def digest(path):
              h=hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""): h.update(chunk)
              return h.hexdigest()
          after={}
          targets={}
          for p in sorted(site.rglob("*")):
              if not p.is_file(): continue
              rel=p.relative_to(site).as_posix()
              if rel in excluded:
                  if rel in {"index.html","app/index.html","landing.js","app.js"}: targets[rel]=digest(p)
                  continue
              after[rel]=digest(p)
          if before!=after:
              raise SystemExit("UNRELATED_PRODUCTION_FILE_CHANGE "+json.dumps({
                  "missing":sorted(set(before)-set(after))[:25],
                  "added":sorted(set(after)-set(before))[:25],
                  "changed":sorted(k for k in before.keys() & after.keys() if before[k]!=after[k])[:25]
              }))
          expected_targets=set(target_before)
          if set(targets)!=expected_targets or not all(targets[k]!=target_before[k] for k in expected_targets):
              raise SystemExit("EXPECTED_ENTRYPOINT_CHANGE_MISSING")
          for rel in ("world-v2300-seismic-layer-v1.js","app/world-v2300-seismic-layer-v1.js"):
              if not (site/rel).is_file(): raise SystemExit("NEW_SEISMIC_MODULE_MISSING "+rel)
          if digest(site/"world-v2300-seismic-layer-v1.js")!=digest(site/"app/world-v2300-seismic-layer-v1.js"):
              raise SystemExit("ROOT_APP_SEISMIC_MODULE_MISMATCH")
          print("NON_TARGET_PRODUCTION_FILES_BYTE_FOR_BYTE_PRESERVED",len(before))
          print("ONLY_FOUR_EXISTING_ENTRY_FILES_CHANGED_AND_TWO_NEW_MODULE_COPIES_ADDED")
          PY

      - uses: actions/configure-pages@v5

      - name: Upload preserved production site with additive seismic layer
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-usgs-seismic-layer-v1
          path: ${{ runner.temp }}/bp-site
          include-hidden-files: true

      - name: Publish USGS seismic layer
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-usgs-seismic-layer-v1

      - name: Verify live homepage, app, module copies and preserved v6302 celestial world
        shell: bash
        run: |
          set -euo pipefail
          O='https://bridgepointintelligence.online'
          q="${GITHUB_SHA}-usgs-seismic-v1"
          D="$RUNNER_TEMP/bp-seismic-live"
          mkdir -p "$D"
          for item in \
            "root.html:$O/?seismic=$q" \
            "app.html:$O/app/?seismic=$q" \
            "landing.js:$O/landing.js?v=usgs-seismic-layer-v1&$q" \
            "app.js:$O/app.js?v=usgs-seismic-layer-v1&$q" \
            "seismic.js:$O/world-v2300-seismic-layer-v1.js?v=1-usgs-comcat-m25-week&$q" \
            "app-seismic.js:$O/app/world-v2300-seismic-layer-v1.js?v=1-usgs-comcat-m25-week&$q" \
            "gaia.js:$O/bridgepoint-gaia-galaxy-v6270.js?$q" \
            "clouds.js:$O/world-v2300-clouds.js?v=6202-global-satellite-cloud-banks&$q" \
            "app-clouds.js:$O/app/world-v2300-clouds.js?v=6202-global-satellite-cloud-banks&$q" \
            "saturn.js:$O/bridgepoint-saturn-system-v6282.js?$q" \
            "mars.js:$O/bridgepoint-mars-system-v6291.js?$q"; do
            name="\${item%%:*}"; url="\${item#*:}"
            curl --retry 7 --retry-all-errors --retry-delay 3 --max-time 35 -fsSL \
              -H 'Cache-Control: no-cache' "$url" -o "$D/$name"
          done
          grep -Fq 'landing.js?v=usgs-seismic-layer-v1' "$D/root.html"
          grep -Fq 'app.js?v=usgs-seismic-layer-v1' "$D/app.html"
          grep -Fq 'world-v2300-seismic-layer-v1.js?v=1-usgs-comcat-m25-week' "$D/landing.js"
          grep -Fq 'world-v2300-seismic-layer-v1.js?v=1-usgs-comcat-m25-week' "$D/app.js"
          grep -Fq 'bp-usgs-seismic-points-v1' "$D/seismic.js"
          grep -Fq 'USGS Seismic · OFF' "$D/seismic.js"
          cmp -s "$D/seismic.js" "$D/app-seismic.js"
          grep -Fq '__BP_EARTH_OCCLUSION_DIAGNOSTIC_V6302__' "$D/gaia.js"
          grep -Fq 'refreshIntervalMs:900000' "$D/clouds.js"
          cmp -s "$D/clouds.js" "$D/app-clouds.js"
          grep -Fq "name:'Titan'" "$D/saturn.js"
          grep -Fq 'Phobos' "$D/mars.js"
          echo "BRIDGEPOINT_USGS_SEISMIC_LAYER_V1_LIVE_PUBLISH_PASS"

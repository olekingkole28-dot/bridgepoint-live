name: Deploy V1997 Weather Volume Hotfix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-v1997-weather-hotfix.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Apply hotfix to live artifact
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main live-artifact
          git checkout -B live-artifact origin/live-artifact
          git show origin/main:release-v1997/map-v1997-weather-hotfix.js > app/map-v1997-weather-hotfix.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/index.html'); s=p.read_text()
          tag='<script src="./map-v1997-weather-hotfix.js?v=1997.1"></script>'
          if tag not in s:
              s=s.replace('<script src="./map-v1997.js?v=1997"></script>','<script src="./map-v1997.js?v=1997"></script>\n'+tag)
          p.write_text(s)
          PY
          node --check app/map-v1997-weather-hotfix.js
          grep -Fq 'fill-extrusion-opacity' app/map-v1997-weather-hotfix.js
          grep -Fq 'map-v1997-weather-hotfix.js?v=1997.1' app/index.html
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/index.html app/map-v1997-weather-hotfix.js
          if ! git diff --cached --quiet; then git commit -m 'Fix V1997 3D weather volume compatibility'; git push origin HEAD:live-artifact; fi
          rm -rf site && mkdir site
          git archive --format=tar HEAD | tar -xf - -C site
          touch site/.nojekyll site/app/.nojekyll
      - uses: actions/configure-pages@v5
        with: {enablement: true}
      - uses: actions/upload-pages-artifact@v4
        with: {name: github-pages-v1997-hotfix, path: site}
      - name: Deploy hotfix
        id: deployment
        uses: actions/deploy-pages@v4
        with: {artifact_name: github-pages-v1997-hotfix}
      - name: Verify live phone scene and public homepage
        shell: bash
        run: |
          set -euo pipefail
          origin='https://bridgepointintelligence.online'
          for i in $(seq 1 24); do
            curl -fsSL --max-time 12 -H 'Cache-Control: no-cache' "$origin/app/?surface=map&hotfix=$i-$(date +%s)" -o /tmp/app.html || true
            curl -fsSL --max-time 12 -H 'Cache-Control: no-cache' "$origin/app/map-v1997-weather-hotfix.js?x=$i-$(date +%s)" -o /tmp/hot.js || true
            if grep -Fq 'map-v1997-weather-hotfix.js?v=1997.1' /tmp/app.html && grep -Fq "'fill-extrusion-opacity':.18" /tmp/hot.js; then break; fi
            sleep 4
          done
          grep -Fq 'map-v1997-weather-hotfix.js?v=1997.1' /tmp/app.html
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24 --no-audit --no-fund >/dev/null 2>&1
          CHROME_PATH="$CHROME" node <<'NODE'
          const puppeteer=require('puppeteer-core'),assert=require('assert');

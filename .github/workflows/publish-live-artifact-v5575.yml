# BridgePoint default-branch production authority V5575
name: Publish Live Artifact V5575

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-live-artifact-v5575.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-artifact-direct
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-artifact
          fetch-depth: 1

      - name: Verify exact live artifact
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '__BP_WORLD_PERFORMANCE_V5560__' world-v2300-map.js
          grep -Fq 'single-maplibre-click' world-v2300-map.js
          grep -Fq "const PARCEL_MIN=MOBILE?6.45" world-v2300-map.js
          ! grep -Fq "canvas.addEventListener('click'" world-v2300-map.js
          grep -Fq 'destructiveStop:false' app.js
          grep -Fq 'const VERSION=5405' parcel-boundary-viewer-v5403.js
          grep -Fq 'minzoom:5.9' parcel-boundary-viewer-v5403.js
          grep -Fq 'parcel-boundary-viewer-v5403.js?v=5575' index.html
          grep -Fq 'parcel-boundary-viewer-v5403.js?v=5575' app/index.html
          echo LIVE_ARTIFACT_V5575_CONTRACT_OK

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-live-artifact-v5575
          path: .

      - name: Deploy exact live artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: bridgepoint-live-artifact-v5575

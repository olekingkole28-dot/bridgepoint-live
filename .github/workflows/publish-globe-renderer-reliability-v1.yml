name: Publish BridgePoint Cohesive Globe Renderer Reliability V1

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-globe-renderer-reliability-v1.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ["Publish BridgePoint Lighthouse Global Snapshot V4"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run renderer syntax and regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < streetlights-v1/world-v2300-streetlights-3d-v1.js
          node --input-type=module --check < release-v2300/world-v2300-map.js
          node --input-type=module --check < release-v2300/world-v2300-tree-instanced.js
          node --input-type=module --check < patches/lighthouse-v3/bridgepoint-lighthouses-v1.js
          node tests/renderer-reliability-v1.test.mjs
          node tests/streetlights-3d-renderer-v1.test.mjs
          node tests/tree-instanced-renderer.test.mjs
          node tests/bridge-materializer-v2.test.cjs
          node tests/lighthouse-hotfix-v3.test.mjs

      - name: Download the Pages artifact from the successful lighthouse deployment
        uses: actions/download-artifact@v4
        with:
          name: bridgepoint-v5000-1
          run-id: 42333364600
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/bp-reliability-baseline

      - name: Restore the deployed site and fingerprint all files
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/bp-reliability-site"
          mkdir -p "$SITE"
          ARCHIVE="$(find "$RUNNER_TEMP/bp-reliability-baseline" -type f -name artifact.tar -print -quit)"
          test -n "$ARCHIVE"
          tar -xf "$ARCHIVE" -C "$SITE"
          for f in \
            index.html app/index.html landing.js app.js \
            world-v2300-map.js app/world-v2300-map.js \
            world-v2300-tree-instanced.js app/world-v2300-tree-instanced.js \
            world-v2300-tree-catalog.js app/world-v2300-tree-catalog.js \
            world-v2300-tree-canopy-lod.js app/world-v2300-tree-canopy-lod.js \
            bridgepoint-lighthouses-v1.js app/bridgepoint-lighthouses-v1.js \
            world-v2300-utility-infrastructure-v1.js app/world-v2300-utility-infrastructure-v1.js \
            vendor/three.module.js vendor/pmtiles.js \
            assets/trees/manifest.json assets/trees/procedural-variants.json assets/trees/taxonomy-index.json; do
            test -s "$SITE/$f" || { echo "Missing production file: $f"; exit 1; }
          done
          grep -Fq 'bpWelcomeGateV1' "$SITE/index.html"
          grep -Fq 'bpAuthRequestV6237' "$SITE/landing.js"
          grep -Fq 'bpAuthRequestV6237' "$SITE/app.js"
          for m in bridgepoint-offshore-energy-v1.js bridgepoint-solar-fields-v1.js bridgepoint-wind-turbines-v1.js; do
            grep -Fq "$m" "$SITE/landing.js"
          done
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          site=Path(os.environ["RUNNER_TEMP"])/"bp-reliability-site"
          data={p.relative_to(site).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                for p in site.rglob("*") if p.is_file()}
          (Path(os.environ["RUNNER_TEMP"])/"bp-reliability-before.json").write_text(json.dumps(data,sort_keys=True))
          print("BASELINE_FILES",len(data))
          PY


      - name: Build FAA tower and global lighthouse snapshots
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/build_faa_obstruction_snapshot.py tests/faa-obstruction-snapshot-builder.test.py
          PYTHONPATH=tools python3 tests/faa-obstruction-snapshot-builder.test.py
          python3 tools/build_faa_obstruction_snapshot.py --output "$RUNNER_TEMP/bridgepoint-faa-obstructions-v1.json.gz"
          gzip -t "$RUNNER_TEMP/bridgepoint-faa-obstructions-v1.json.gz"
          cp rebuild-v5000/bridgepoint-faa-obstruction-towers-v1.js "$RUNNER_TEMP/bridgepoint-faa-obstruction-towers-v1.js"
          node --check "$RUNNER_TEMP/bridgepoint-faa-obstruction-towers-v1.js"
          mkdir -p "$RUNNER_TEMP/bp-reliability-site/data" "$RUNNER_TEMP/bp-reliability-site/app/data"
          cp "$RUNNER_TEMP/bridgepoint-faa-obstructions-v1.json.gz" "$RUNNER_TEMP/bp-reliability-site/data/bridgepoint-faa-obstructions-v1.json.gz"
          cp "$RUNNER_TEMP/bridgepoint-faa-obstructions-v1.json.gz" "$RUNNER_TEMP/bp-reliability-site/app/data/bridgepoint-faa-obstructions-v1.json.gz"
          cp "$RUNNER_TEMP/bridgepoint-faa-obstruction-towers-v1.js" "$RUNNER_TEMP/bp-reliability-site/bridgepoint-faa-obstruction-towers-v1.js"
          cp "$RUNNER_TEMP/bridgepoint-faa-obstruction-towers-v1.js" "$RUNNER_TEMP/bp-reliability-site/app/bridgepoint-faa-obstruction-towers-v1.js"

          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL \
            -A "BridgePoint Intelligence Lighthouse Snapshot/1.0 (https://bridgepointintelligence.online)" \
            -H "Accept: application/json" \
            "https://hulloships.com/atlas/data/lighthouses.json" \
            -o "$RUNNER_TEMP/bp-reliability-site/data/bridgepoint-lighthouses-global-v1.json"
          python3 - "$RUNNER_TEMP/bp-reliability-site/data/bridgepoint-lighthouses-global-v1.json" <<'PY'
          import json,sys
          from pathlib import Path
          rows=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          valid=[]
          for row in rows:
              try: lat=float(row.get("lat")); lon=float(row.get("lon"))
              except (TypeError,ValueError): continue
              if -85<=lat<=85 and -180<=lon<=180: valid.append(row)
          if len(rows)<10000 or len(valid)<10000:
              raise SystemExit(f"Global lighthouse snapshot incomplete: {len(rows)} rows, {len(valid)} valid")
          print("GLOBAL_LIGHTHOUSE_SNAPSHOT_PASS",len(rows),"records",len(valid),"valid")
          PY
          cp "$RUNNER_TEMP/bp-reliability-site/data/bridgepoint-lighthouses-global-v1.json" "$RUNNER_TEMP/bp-reliability-site/app/data/bridgepoint-lighthouses-global-v1.json"
          cat > "$RUNNER_TEMP/bp-reliability-site/data/bridgepoint-lighthouses-global-v1-ATTRIBUTION.md" <<'EOF'
          # BridgePoint Global Lighthouse Snapshot

          Source: HulloShips global lighthouse database. The source identifies these records as OpenStreetMap-derived, © OpenStreetMap contributors, licensed under the Open Database License (ODbL).

          This extracted database is redistributed under ODbL with attribution to OpenStreetMap contributors. Fields include name, country, region, mapped type, height where recorded, light character, coordinates and source OSM identifier. Community mapping coverage and recorded heights may be incomplete.

          This is a location/rendering dataset, not an official aid-to-navigation register or navigational safety source. Verify operational status and characteristics with the relevant maritime authority before real-world navigation use.

          ODbL: https://opendatacommons.org/licenses/odbl/1-0/
          EOF
          cp "$RUNNER_TEMP/bp-reliability-site/data/bridgepoint-lighthouses-global-v1-ATTRIBUTION.md" "$RUNNER_TEMP/bp-reliability-site/app/data/bridgepoint-lighthouses-global-v1-ATTRIBUTION.md"
      - name: Carry forward current newsroom and weather pages
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/bp-reliability-site"
          for f in feed.xml news-sitemap.xml news/current-northeast-weather.html news/global-expansion.html; do
            test -s "rebuild-v5000/$f"
            mkdir -p "$SITE/$(dirname "$f")"
            cp "rebuild-v5000/$f" "$SITE/$f"
          done

      - name: Bundle local Three.js GLTFLoader
        shell: bash
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/bp-tree-runtime"
          SITE="$RUNNER_TEMP/bp-reliability-site"
          mkdir -p "$R" "$SITE/vendor"
          npm install --prefix "$R" --no-audit --no-fund --no-save three@0.169.0 esbuild@0.24.2
          "$R/node_modules/.bin/esbuild" "$R/node_modules/three/examples/jsm/loaders/GLTFLoader.js" --bundle --format=esm --minify --external:three --outfile="$SITE/vendor/GLTFLoader.bundle.js"
          python3 - "$SITE/vendor/GLTFLoader.bundle.js" <<'PY'
          from pathlib import Path
          import re,sys
          p=Path(sys.argv[1]);s=p.read_text(encoding="utf-8")
          s,n=re.subn(r'\bfrom\s*(["\'])three\1','from "/vendor/three.module.js?v=169-local"',s)
          if n<1 or re.search(r'\bfrom\s*(["\'])three\1',s): raise SystemExit("GLTFLoader has an unresolved external Three.js import")
          if "esm.sh" in s or "unpkg.com" in s: raise SystemExit("External CDN dependency detected in GLTFLoader")
          p.write_text(s,encoding="utf-8")
          print("LOCAL_GLTFLOADER_BUNDLE_PASS",p.stat().st_size)
          PY
          node --input-type=module --check < "$SITE/vendor/GLTFLoader.bundle.js"

      - name: Overlay only four renderer modules and update cache keys
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/bp-reliability-site"
          mkdir -p "$SITE/app"
          cp release-v2300/world-v2300-map.js "$SITE/world-v2300-map.js"
          cp release-v2300/world-v2300-map.js "$SITE/app/world-v2300-map.js"
          cp release-v2300/world-v2300-tree-instanced.js "$SITE/world-v2300-tree-instanced.js"
          cp release-v2300/world-v2300-tree-instanced.js "$SITE/app/world-v2300-tree-instanced.js"
          cp patches/lighthouse-v3/bridgepoint-lighthouses-v1.js "$SITE/bridgepoint-lighthouses-v1.js"
          cp patches/lighthouse-v3/bridgepoint-lighthouses-v1.js "$SITE/app/bridgepoint-lighthouses-v1.js"
          cp streetlights-v1/world-v2300-streetlights-3d-v1.js "$SITE/bridgepoint-streetlights-3d-v1.js"
          cp streetlights-v1/world-v2300-streetlights-3d-v1.js "$SITE/app/bridgepoint-streetlights-3d-v1.js"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re,os
          site=Path(os.environ["RUNNER_TEMP"])/"bp-reliability-site"
          def subone(rel,pat,repl,label):
              p=site/rel;s=p.read_text(encoding="utf-8");s,n=re.subn(pat,repl,s,count=1)
              if n!=1: raise SystemExit(f"{rel}: {label} expected once, found {n}")
              p.write_text(s,encoding="utf-8")
          for rel in ("landing.js","app.js"):
              subone(rel,r"(['\"])(?:\./|\.\./)world-v2300-map\.js\?v=[^'\"]+(['\"])",r"\1./world-v2300-map.js?v=6250-renderer-reliability-v1\2","map import")
              subone(rel,r"(['\"])(?:\./|\.\./)bridgepoint-lighthouses-v1\.js\?v=[^'\"]+(['\"])",r"\1./bridgepoint-lighthouses-v1.js?v=5-batched-render-recovery\2","lighthouse import")
              # Attach both global renderers where the initialized world is in scope.
              p=site/rel
              data=p.read_text(encoding="utf-8")
              anchor=".catch(e=>console.warn('BridgePoint global 3D lighthouse renderer unavailable',e));"
              addition=(
                  "\n  void import('./bridgepoint-faa-obstruction-towers-v1.js?v=1-faa-obstruction-towers')\n"
                  "   .then(m=>{window.__BP_FAA_OBSTRUCTION_TOWERS_V1__=m.initFAAObstructionTowerRenderer(world)})\n"
                  "   .catch(e=>console.warn('BridgePoint FAA obstruction/tower renderer unavailable',e));\n"
                  "  void import('./bridgepoint-streetlights-3d-v1.js?v=4-shared-pmtiles-and-batched')\n"
                  "   .then(m=>{window.__BP_STREETLIGHTS_3D_V1__=m.initStreetlightRenderer(world)})\n"
                  "   .catch(e=>console.warn('BridgePoint global 3D streetlights unavailable',e));\n"
              )
              if data.count(anchor)!=1: raise SystemExit(f"{rel}: expected one lighthouse loader anchor, found {data.count(anchor)}")
              p.write_text(data.replace(anchor,anchor+addition,1),encoding="utf-8")
              s=p.read_text(encoding="utf-8")
              for token in ("bridgepoint-faa-obstruction-towers-v1.js","world-v2300-utility-infrastructure-v1.js","bridgepoint-offshore-energy-v1.js","bridgepoint-solar-fields-v1.js","bridgepoint-wind-turbines-v1.js","bpAuthRequestV6237"):
                  if token not in s: raise SystemExit(f"{rel}: preserved feature missing: {token}")
          for rel,stem in (("index.html","landing.js"),("app/index.html","app.js")):
              subone(rel,r"((?:\./|\.\./)?"+re.escape(stem)+r"\?v=)[^&\"'<>\s]+",r"\g<1>6250-renderer-reliability-v1","entry script cache key")
              subone(rel,r'(<link\s+rel="modulepreload"\s+href="/world-v2300-map\.js\?v=)[^&"]+',r"\g<1>6250-renderer-reliability-v1","map module preload")
          before=json.loads((Path(os.environ["RUNNER_TEMP"])/"bp-reliability-before.json").read_text())
          after={p.relative_to(site).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in site.rglob("*") if p.is_file()}
          removed=set(before)-set(after);added=set(after)-set(before)
          changed={p for p in before if p in after and before[p]!=after[p]}
          expected={"index.html","app/index.html","landing.js","app.js",
            "bridgepoint-lighthouses-v1.js","app/bridgepoint-lighthouses-v1.js"}
          optional_assets={
            "world-v2300-map.js","app/world-v2300-map.js",
            "world-v2300-tree-instanced.js","app/world-v2300-tree-instanced.js",
            "bridgepoint-streetlights-3d-v1.js","app/bridgepoint-streetlights-3d-v1.js",
            "bridgepoint-faa-obstruction-towers-v1.js","app/bridgepoint-faa-obstruction-towers-v1.js",
            "data/bridgepoint-faa-obstructions-v1.json.gz","app/data/bridgepoint-faa-obstructions-v1.json.gz",
            "data/bridgepoint-lighthouses-global-v1.json","app/data/bridgepoint-lighthouses-global-v1.json",
            "data/bridgepoint-lighthouses-global-v1-ATTRIBUTION.md","app/data/bridgepoint-lighthouses-global-v1-ATTRIBUTION.md",
            "vendor/GLTFLoader.bundle.js"
          }
          allowed=expected|optional_assets|{"feed.xml","news-sitemap.xml","news/current-northeast-weather.html","news/global-expansion.html"}
          newsroom_assets={"feed.xml","news-sitemap.xml","news/current-northeast-weather.html","news/global-expansion.html"}
          expected_added=(optional_assets|newsroom_assets)-set(before)
          if not expected.issubset(changed): raise SystemExit("Missing expected files: "+json.dumps(sorted(expected-changed)))
          if not changed.issubset(allowed): raise SystemExit("Unexpected production changes: "+json.dumps(sorted(changed-allowed)))
          if removed: raise SystemExit("Production files were removed: "+json.dumps(sorted(removed)))
          if added!=expected_added: raise SystemExit("Unexpected production additions: "+json.dumps({"actual":sorted(added),"expected":sorted(expected_added)}))
          if not optional_assets.issubset(set(after)): raise SystemExit("Missing required renderer/support assets: "+json.dumps(sorted(optional_assets-set(after))))
          for name in ("world-v2300-map.js","world-v2300-tree-instanced.js","bridgepoint-lighthouses-v1.js","bridgepoint-streetlights-3d-v1.js","bridgepoint-faa-obstruction-towers-v1.js"):
              assert (site/name).read_bytes()==(site/"app"/name).read_bytes(),name+" root/app mismatch"
          assert (site/"data/bridgepoint-faa-obstructions-v1.json.gz").read_bytes()==(site/"app/data/bridgepoint-faa-obstructions-v1.json.gz").read_bytes()
          assert (site/"data/bridgepoint-lighthouses-global-v1.json").read_bytes()==(site/"app/data/bridgepoint-lighthouses-global-v1.json").read_bytes()
          assert (site/"data/bridgepoint-lighthouses-global-v1-ATTRIBUTION.md").read_bytes()==(site/"app/data/bridgepoint-lighthouses-global-v1-ATTRIBUTION.md").read_bytes()
          print("STRICT_RELIABILITY_SCOPE_PASS",len(before),"baseline files; changed",len(changed),"allowed files; removed 0")
          PY
          for f in "$SITE/world-v2300-map.js" "$SITE/app/world-v2300-map.js" "$SITE/world-v2300-tree-instanced.js" "$SITE/app/world-v2300-tree-instanced.js" "$SITE/bridgepoint-lighthouses-v1.js" "$SITE/app/bridgepoint-lighthouses-v1.js" "$SITE/bridgepoint-streetlights-3d-v1.js" "$SITE/app/bridgepoint-streetlights-3d-v1.js" "$SITE/bridgepoint-faa-obstruction-towers-v1.js" "$SITE/app/bridgepoint-faa-obstruction-towers-v1.js"; do node --input-type=module --check < "$f"; done
          gzip -t "$SITE/data/bridgepoint-faa-obstructions-v1.json.gz"
          node --check "$SITE/landing.js"
          node --check "$SITE/app.js"
          node --input-type=module --check < "$SITE/vendor/GLTFLoader.bundle.js"
          grep -Fq 'from "/vendor/three.module.js?v=169-local"' "$SITE/vendor/GLTFLoader.bundle.js"
          grep -Fq "const VERSION = 4;" "$SITE/bridgepoint-streetlights-3d-v1.js"
          grep -Fq "const VERSION = 3;" "$SITE/world-v2300-tree-instanced.js"
          grep -Fq 'scheduleBridgeSourceRefresh' "$SITE/world-v2300-map.js"
          grep -Fq 'bpContextBuildingSyncTimer' "$SITE/world-v2300-map.js"
          grep -Fq 'partial-render-ready' "$SITE/world-v2300-tree-instanced.js"
          grep -Fq 'updateModelTransforms' "$SITE/bridgepoint-lighthouses-v1.js"
          grep -Fq 'bridgepoint-faa-obstruction-towers-v1.js?v=1-faa-obstruction-towers' "$SITE/landing.js"
          grep -Fq 'bridgepoint-faa-obstruction-towers-v1.js?v=1-faa-obstruction-towers' "$SITE/app.js"
          grep -Fq 'bridgepoint-streetlights-3d-v1.js?v=4-shared-pmtiles-and-batched' "$SITE/landing.js"
          grep -Fq 'bridgepoint-streetlights-3d-v1.js?v=4-shared-pmtiles-and-batched' "$SITE/app.js"
          echo "RELIABILITY_ARTIFACT_READY"

      - uses: actions/configure-pages@v5

      - name: Upload cohesive Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: bridgepoint-globe-renderer-reliability-v1-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bp-reliability-site
          include-hidden-files: true

      - name: Deploy the cohesive globe renderer reliability release
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: bridgepoint-globe-renderer-reliability-v1-${{ github.run_attempt }}

      - name: Verify live routes, renderers and preserved infrastructure
        shell: bash
        run: |
          set -euo pipefail
          O='https://bridgepointintelligence.online'
          q="$GITHUB_SHA-renderer-reliability-v1"
          for p in '/' '/app/'; do
            curl --retry 10 --retry-all-errors --retry-delay 2 -fsSL -H 'Cache-Control: no-cache' "$O$p?renderer-reliability=$q" -o "$RUNNER_TEMP/page.html"
            grep -Fq '6250-renderer-reliability-v1' "$RUNNER_TEMP/page.html"
          done
          for p in \
            '/landing.js?v=6250-renderer-reliability-v1' \
            '/app.js?v=6250-renderer-reliability-v1' \
            '/world-v2300-map.js?v=6250-renderer-reliability-v1' \
            '/app/world-v2300-map.js' '/world-v2300-tree-instanced.js' \
            '/app/world-v2300-tree-instanced.js' \
            '/bridgepoint-lighthouses-v1.js?v=5-batched-render-recovery' \
            '/app/bridgepoint-lighthouses-v1.js' \
            '/bridgepoint-streetlights-3d-v1.js?v=4-shared-pmtiles-and-batched' \
            '/app/bridgepoint-streetlights-3d-v1.js' \
            '/vendor/three.module.js' '/vendor/GLTFLoader.bundle.js' '/vendor/pmtiles.js' \
            '/data/bridgepoint-lighthouses-global-v1.json' '/app/data/bridgepoint-lighthouses-global-v1.json' \
            '/data/bridgepoint-faa-obstructions-v1.json.gz' '/app/data/bridgepoint-faa-obstructions-v1.json.gz' \
            '/bridgepoint-faa-obstruction-towers-v1.js' '/app/bridgepoint-faa-obstruction-towers-v1.js' \
            '/world-v2300-utility-infrastructure-v1.js' '/app/world-v2300-utility-infrastructure-v1.js'; do
            name="$(printf '%s' "$p" | tr '/.' '_')"
            curl --retry 8 --retry-all-errors --retry-delay 2 -fsSL -H 'Cache-Control: no-cache' "$O$p?verify=$q" -o "$RUNNER_TEMP/$name.verified"
          done
          grep -Fq 'initFAAObstructionTowerRenderer' "$RUNNER_TEMP/_bridgepoint-faa-obstruction-towers-v1_js.verified"
          grep -Fq 'initUtilityInfrastructure' "$RUNNER_TEMP/_world-v2300-utility-infrastructure-v1_js.verified"
          grep -Fq 'scheduleBridgeSourceRefresh' "$RUNNER_TEMP/_world-v2300-map_js.verified"
          grep -Fq 'partial-render-ready' "$RUNNER_TEMP/_world-v2300-tree-instanced_js.verified"
          grep -Fq 'updateModelTransforms' "$RUNNER_TEMP/_bridgepoint-lighthouses-v1_js.verified"
          grep -Fq 'PMTILES_LIBRARY_URL' "$RUNNER_TEMP/_bridgepoint-streetlights-3d-v1_js.verified"
          grep -Fq 'GLTFLoader' "$RUNNER_TEMP/_vendor_GLTFLoader_bundle_js.verified"
          grep -Fq 'GLTFLoader' "$RUNNER_TEMP/_vendor_GLTFLoader_bundle_js.verified"
          grep -Fq 'initFAAObstructionTowerRenderer' "$RUNNER_TEMP/_app_bridgepoint-faa-obstruction-towers-v1_js.verified"
          grep -Fq 'initUtilityInfrastructure' "$RUNNER_TEMP/_app_world-v2300-utility-infrastructure-v1_js.verified"
          grep -Fq 'bridgepoint-faa-obstruction-towers-v1.js?v=1-faa-obstruction-towers' "$RUNNER_TEMP/_landing_js.verified"
          grep -Fq 'bridgepoint-faa-obstruction-towers-v1.js?v=1-faa-obstruction-towers' "$RUNNER_TEMP/_app_js.verified"
          grep -Fq 'bridgepoint-streetlights-3d-v1.js?v=4-shared-pmtiles-and-batched' "$RUNNER_TEMP/_landing_js.verified"
          grep -Fq 'bridgepoint-streetlights-3d-v1.js?v=4-shared-pmtiles-and-batched' "$RUNNER_TEMP/_app_js.verified"
          gzip -t "$RUNNER_TEMP/_data_bridgepoint-faa-obstructions-v1_json_gz.verified"
          cmp -s "$RUNNER_TEMP/_data_bridgepoint-faa-obstructions-v1_json_gz.verified" "$RUNNER_TEMP/_app_data_bridgepoint-faa-obstructions-v1_json_gz.verified"

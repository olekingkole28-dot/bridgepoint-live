          function makeLayer(T,s){
            const m=s.meta,owned=new Set(),scene=new T.Scene(),camera=new T.Camera(),anchor=new T.Group(),tower=new T.Group();
            anchor.matrixAutoUpdate=false;scene.add(anchor);anchor.add(tower);tower.rotation.y=m.rotation;tower.updateMatrix();

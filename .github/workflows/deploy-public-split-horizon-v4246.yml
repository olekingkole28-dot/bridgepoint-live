name: Deploy Public Split + Horizon V4246

on:
  push:
    branches: [main]
    paths:
      - 'release-v4246/**'
      - 'app/horizon/**'
      - 'app/horizon-playable/**'
      - '.github/workflows/deploy-public-split-horizon-v4246.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-v4246-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Assemble current production
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site
          mkdir -p site
          git archive --format=tar origin/live-artifact | tar -xf - -C site

          # Horizon always comes from the current source branch.
          rm -rf site/app/horizon site/app/horizon-playable
          git archive --format=tar HEAD app/horizon app/horizon-playable | tar -xf - -C site

          # Publish native-track status surface.
          mkdir -p site/app/horizon/native
          cp release-v4246/horizon-native/index.html site/app/horizon/native/index.html

          # Global Cesium dateline guard for the existing B2B world.
          cp release-v4246/world-v4246-dateline-guard.js site/app/bridgepoint-world-v2652/world-v4246-dateline-guard.js

          python3 release-v4246/patch_live.py

          cat > site/app/horizon/horizon-live-v4246.json <<EOF
          {"build":4246,"status":"HORIZON_PUBLIC_SPLIT_LIVE","source_sha":"${GITHUB_SHA}","horizon":"/app/horizon/","browser_preview":"/app/horizon/preview.html","native_track":"/app/horizon/native/","b2b_world":"/app/bridgepoint-world-v2652/"}
          EOF

          touch site/.nojekyll site/app/.nojekyll

      - name: Validate release artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile release-v4246/patch_live.py
          node --check site/app/bridgepoint-world-v2652/world-v4246-dateline-guard.js
          node --check site/app/horizon-playable/horizon-world.js

          test -s site/index.html
          test -s site/app/horizon/index.html
          test -s site/app/horizon/native/index.html
          test -s site/app/bridgepoint-world-v2652/index.html

          grep -Fq 'id="bridgepoint-world"' site/index.html
          grep -Fq 'load-b2b-world-v4246' site/index.html
          grep -Fq 'Open the separate BridgePoint Horizon page' site/index.html

          grep -Fq 'id="game-modes"' site/app/horizon/index.html
          grep -Fq 'Year One Survival' site/app/horizon/index.html
          grep -Fq 'Infinite Team Deathmatch' site/app/horizon/index.html
          grep -Fq 'Outbreak Raid' site/app/horizon/index.html
          grep -Fq 'UE5.8 NATIVE TRACK' site/app/horizon/index.html
          grep -Fq 'Open BridgePoint Intelligence B2B' site/app/horizon/index.html

          grep -Fq 'world-v4246-dateline-guard.js?v=4246' site/app/bridgepoint-world-v2652/index.html

          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const code=fs.readFileSync('site/app/bridgepoint-world-v2652/world-v4246-dateline-guard.js','utf8');
          const ctx={
            window:{},
            Cesium:{Rectangle:{fromDegrees:(w,s,e,n)=>({w,s,e,n})}}
          };
          ctx.window.Cesium=ctx.Cesium;
          vm.createContext(ctx);
          vm.runInContext(code,ctx);
          const r=ctx.Cesium.Rectangle.fromDegrees(179.8,-10,180.31713344986439,10);
          assert(r.e<=180 && r.e>=-180,JSON.stringify(r));
          assert(r.w<=180 && r.w>=-180,JSON.stringify(r));
          assert(r.e<0,'dateline east should wrap negative: '+JSON.stringify(r));
          console.log('B2B_DATELINE_GUARD_PASS',r);
          NODE

      - name: Save durable live artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bp-v4246-live
          mkdir -p /tmp/bp-v4246-live
          cp -a site/. /tmp/bp-v4246-live/
          cd /tmp/bp-v4246-live
          git init -q
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m "Publish public split + Horizon V4246 ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify custom domain
        shell: bash
        run: |
          set -euo pipefail
          O='https://bridgepointintelligence.online'
          ok=0

          for i in $(seq 1 40); do
            q="${GITHUB_SHA}-${i}-$(date +%s)"
            rm -f /tmp/root /tmp/horizon /tmp/native /tmp/world /tmp/guard /tmp/marker

            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$O/?v=$q" -o /tmp/root 2>/dev/null || true
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$O/app/horizon/?v=$q" -o /tmp/horizon 2>/dev/null || true
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$O/app/horizon/native/?v=$q" -o /tmp/native 2>/dev/null || true
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$O/app/bridgepoint-world-v2652/?v=$q" -o /tmp/world 2>/dev/null || true
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$O/app/bridgepoint-world-v2652/world-v4246-dateline-guard.js?v=$q" -o /tmp/guard 2>/dev/null || true
            curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$O/app/horizon/horizon-live-v4246.json?v=$q" -o /tmp/marker 2>/dev/null || true

            if grep -Fq 'id="bridgepoint-world"' /tmp/root 2>/dev/null \
              && grep -Fq 'id="game-modes"' /tmp/horizon 2>/dev/null \
              && grep -Fq 'Infinite Team Deathmatch' /tmp/horizon 2>/dev/null \
              && grep -Fq 'UE5.8 NATIVE TRACK · V4246' /tmp/native 2>/dev/null \
              && grep -Fq 'world-v4246-dateline-guard.js?v=4246' /tmp/world 2>/dev/null \
              && grep -Fq '__bpDatelineGuardV4246' /tmp/guard 2>/dev/null \
              && grep -Fq '"build":4246' /tmp/marker 2>/dev/null; then
              ok=1
              echo 'BRIDGEPOINT_PUBLIC_SPLIT_HORIZON_V4246_LIVE'
              break
            fi

            echo "verification attempt $i"
            sleep 5
          done

          test "$ok" = 1

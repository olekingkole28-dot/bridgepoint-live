name: BridgePoint Sketchfab streets, grass, traffic and aircraft
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-ground-materials-v1.yml']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore and verify exact currently published baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/horizon-site"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false and (.name|startswith("bridgepoint-v5000-"))) | [.workflow_run.id,.name] | @tsv' > "$RUNNER_TEMP/candidates"
          cat "$RUNNER_TEMP/candidates"
          found=0
          while IFS=$'\t' read -r run name; do
            if [ "$run" = "$GITHUB_RUN_ID" ]; then continue; fi
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.conclusion')" != success ]; then continue; fi
            rm -rf "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/horizon-site"
            mkdir -p "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/horizon-site"
            if ! timeout 240s gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "$RUNNER_TEMP/baseline"; then continue; fi
            if ! test -s "$RUNNER_TEMP/baseline/artifact.tar"; then continue; fi
            tar -xf "$RUNNER_TEMP/baseline/artifact.tar" -C "$RUNNER_TEMP/horizon-site"
            same=1
            for p in index.html app/index.html landing.js app.js world-v2300-map.js app/world-v2300-map.js world-v2300-water.js app/world-v2300-water.js bridgepoint-bottom-card-mobile-v2.js bridgepoint-bottom-card-categories-v1.js vendor/bp-nyc-bus-v1.mjs vendor/bp-bus-models-v3.mjs vendor/bp-street-detail-v1.mjs assets/street-detail-v1/manifest.json assets/street-detail-v1/busshelter.glb.gz world-v2300-tree-instanced.js app/world-v2300-tree-instanced.js vendor/bp-tree-canopy-source-v3.mjs vendor/bp-tree-canopy-worker-v3.mjs assets/street-detail-v1/pavers.png; do
              if ! curl --retry 2 --retry-all-errors --max-time 35 -fsSL -H 'Cache-Control: no-cache' "https://bridgepointintelligence.online/$p?baseline=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/current" || ! cmp -s "$RUNNER_TEMP/horizon-site/$p" "$RUNNER_TEMP/current"; then same=0; break; fi
            done
            if [ "$same" = 1 ]; then echo "Verified live baseline $run $name"; found=1; break; fi
          done < <(head -15 "$RUNNER_TEMP/candidates")
          test "$found" = 1 || { echo 'No exact current release found; refusing rollback'; exit 1; }
      - name: Install Sketchfab streetside, ground, traffic, and aircraft models
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/horizon-site"
          mkdir -p "$SITE/assets/street-detail-v1/sketchfab" "$SITE/vendor" "$SITE/app" "$SITE/app/vendor"
          cp street-detail-v1/sketchfab/* "$SITE/assets/street-detail-v1/sketchfab/"
          cp street-detail-v1/manifest.json "$SITE/assets/street-detail-v1/manifest.json"
          cp street-detail-v1/credits.html "$SITE/street-credits.html"
          cp street-detail-v1/credits.html "$SITE/assets/street-detail-v1/credits.html"
          cp rebuild-v5000/bridgepoint-transportation-v1.js "$SITE/bridgepoint-transportation-v1.js"
          cp rebuild-v5000/bridgepoint-transportation-v1.js "$SITE/app/bridgepoint-transportation-v1.js"
          cp street-detail-v1/aircraft-visuals-v3.js "$SITE/bridgepoint-aircraft-visuals-v3.js"
          cp street-detail-v1/aircraft-visuals-v3.js "$SITE/app/bridgepoint-aircraft-visuals-v3.js"
          cp street-detail-v1/street-detail.mjs "$SITE/vendor/bp-street-detail-v1.mjs"
          if [ -d "$SITE/app/vendor" ]; then cp street-detail-v1/street-detail.mjs "$SITE/app/vendor/bp-street-detail-v1.mjs"; fi
          python3 - "$SITE" <<'PY'
          from pathlib import Path
          import re,sys
          site=Path(sys.argv[1])
          for base in (site,site/'app'):
              p=base/'bridgepoint-transportation-loader-v1.js'
              if p.exists():
                  s=p.read_text();s,n=re.subn(r"const MODULE_SRC = '[^']+'", "const MODULE_SRC = '/bridgepoint-transportation-v1.js?v=20261127-sketchfab-models-v5'", s);assert n==1
                  p.write_text(s)
              p=base/'bridgepoint-drone-awareness-v1.js'
              if p.exists():
                  s=p.read_text()
                  old="if(!aircraftVisualPromise)aircraftVisualPromise=import('/bridgepoint-aircraft-visuals-v2.js?v=aircraft-lights-cloudwake-v20261125-v10')\n   .then(m=>{aircraftVisualModule=m;return m})\n   .catch(e=>{aircraftVisualPromise=null;console.warn('BridgePoint rich aircraft appearance optional',e);return null});\n await aircraftVisualPromise;"
                  new="if(!aircraftVisualPromise)aircraftVisualPromise=import('/bridgepoint-aircraft-visuals-v3.js?v=20261127-sketchfab-fixed-wing-v11')\n   .then(async m=>{aircraftVisualModule=m;if(typeof m.prepareSketchfabAirframes!=='function')throw Error('SKETCHFAB_AIRCRAFT_PRELOADER_MISSING');await m.prepareSketchfabAirframes(T);return m})\n   .catch(e=>{aircraftVisualPromise=null;console.error('BridgePoint Sketchfab aircraft model unavailable',e);throw e});\n await aircraftVisualPromise;"
                  if old not in s:
                      # The common live script is patched as a source artifact below; allow an already-patched baseline.
                      assert 'prepareSketchfabAirframes(T)' in s
                  else:
                      s=s.replace(old,new)
                  s=s.replace("'/assets/street-detail-v1/aircraft737.glb.gz'", "'/assets/street-detail-v1/sketchfab/aircraft737.glb.gz'")
                  s=s.replace('aircraftVisualModule.buildAircraftMaterial(droneThree):','aircraftVisualModule.buildAircraftMaterial(droneThree,geometry):')
                  s=s.replace('entry.geometry.dispose();entry.material.dispose()', 'entry.geometry.dispose();for(const material of Array.isArray(entry.material)?entry.material:[entry.material])material?.dispose?.()')
                  p.write_text(s)
              for name in ('index.html',):
                  p=base/name
                  if p.exists():
                      s=p.read_text()
                      s=s.replace('aircraftlock=aircraft-lights-cloudwake-v20261125-v10','aircraftlock=sketchfab-fixed-wing-v20261127-v11')
                      s=s.replace('bridgepoint-transportation-loader-v1.js?v=4-global-pmtiles-stable-models','bridgepoint-transportation-loader-v1.js?v=20261127-sketchfab-models-v5')
                      p.write_text(s)
              for rel in ('vendor/bp-street-detail-v1.mjs','app/vendor/bp-street-detail-v1.mjs'):
                  p=site/rel
                  if p.exists():
                      s=p.read_text()
                      if 'getZoom()<17.5' in s:s=s.replace('17.5','16.5')
                      p.write_text(s)
          print('SKETCHFAB_ASSET_WIRING_PASS')
          PY
          python3 street-detail-v1/install.py "$SITE"
          mkdir -p "$SITE/assets/street-detail-v1/surfaces-v2"
          gzip -n -c street-detail-v1/surface-source/pack_de_ruas_lw3d_v2.glb > "$SITE/assets/street-detail-v1/surfaces-v2/pack-de-ruas.glb.gz"
          cp street-detail-v1/source-assets/electricbox.glb.gz "$SITE/assets/street-detail-v1/electricbox.glb.gz"
          cp street-detail-v1/source-assets/storm_drain.glb.gz "$SITE/assets/street-detail-v1/storm_drain.glb.gz"
          cp street-detail-v1/sketchfab-road-models-v1.mjs "$SITE/vendor/bp-sketchfab-road-models-v1.mjs"
          python3 - "$SITE/assets/street-detail-v1" "$SITE" <<'PY'
          import gzip,json,sys
          from pathlib import Path
          root,site=map(Path,sys.argv[1:])
          files={'surfaces-v2/pack-de-ruas.glb.gz':'Pack de Ruas LW3D v2','electricbox.glb.gz':'Electricbox003 - Street Kitbash Collection','storm_drain.glb.gz':'Storm Drain'}
          for rel,title in files.items():
              raw=gzip.decompress((root/rel).read_bytes())
              assert raw[:4]==b'glTF' and len(raw)>1000,(rel,'invalid GLB')
              n=int.from_bytes(raw[12:16],'little');doc=json.loads(raw[20:20+n])
              assert title.lower() in doc.get('asset',{}).get('extras',{}).get('title','').lower(),(rel,'wrong source title')
              assert 'CC-BY-4.0' in doc.get('asset',{}).get('extras',{}).get('license',''),(rel,'license check failed')
              if 'pack-de-ruas' in rel:
                  mats={m.get('name','').lower() for m in doc.get('materials',[])}
                  assert {'street1','street2','street3','street4'}<=mats,('road meshes/materials missing',mats)
          additions=[
              ('Pack de Ruas LW3D v2','https://sketchfab.com/3d-models/pack-de-ruas-lw3d-v2-352e537b6cec45f4b5e7ff1580eeca5d','lael.eugenio'),
              ('Electricbox003 - Street Kitbash Collection','https://sketchfab.com/3d-models/electricbox003-street-kitbash-collection-e7c709ab760d4f1d9e2f167802cb59c0','experiment_studio'),
              ('Storm Drain','https://sketchfab.com/3d-models/storm-drain-af69c0127d1244a7951281733583fb0c','Scaniverse')]
          mpath=root/'manifest.json'; manifest=json.loads(mpath.read_text())
          manifest['additional_sources']=additions;mpath.write_text(json.dumps(manifest,indent=2)+'\\n')
          entries=''.join('<li><a href="'+url+'">'+title+'</a> — '+author+' — <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a></li>' for title,url,author in additions)
          for p in (root/'credits.html',site/'street-credits.html'):
              s=p.read_text()
              if 'Pack de Ruas LW3D v2' not in s:s=s.replace('</ul>',entries+'</ul>')
              p.write_text(s)
          print('SKETCHFAB_ROAD_PACK_AND_MAPPED_PROPS_VALID')
          PY
          node --check "$SITE/bridgepoint-transportation-v1.js"
          node --check "$SITE/bridgepoint-drone-awareness-v1.js"
          node --input-type=module --check < "$SITE/bridgepoint-aircraft-visuals-v3.js"
          node --input-type=module --check < "$SITE/vendor/bp-street-detail-v1.mjs"
          node --input-type=module --check < "$SITE/vendor/bp-sketchfab-road-models-v1.mjs"
          python3 - "$SITE/assets/street-detail-v1/sketchfab" <<'PY'
          import gzip,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          for name in ('grass-patch.glb.gz','grass-tuft.glb.gz','aircraft737.glb.gz','servicebus.glb.gz'):
              raw=gzip.decompress((root/name).read_bytes())
              assert raw[:4]==b'glTF' and len(raw)>1000,(name,'invalid GLB')
          print('SKETCHFAB_GLTF_ASSETS_VALID')
          PY
      - name: Install automatic mapped ground materials
        run: |
          set -euo pipefail
          export SITE="$RUNNER_TEMP/horizon-site"
          python3 - "$SITE" <<'PY'
          import sys,re
          from pathlib import Path
          site=Path(sys.argv[1])
          for base in (site,site/'app'):
              p=base/'world-v2300-map.js';s=p.read_text()
              a="map.on('zoomend',bpAttachTreeRendererFromViewport);"
              if "let bpGroundMaterialsAttached=false;" not in s:
                  assert s.count(a)==1
                  s=s.replace(a,a+"\n let bpGroundMaterialsAttached=false;const bpAttachGroundMaterials=()=>{if(bpGroundMaterialsAttached||map.getZoom()<13.5)return;bpGroundMaterialsAttached=true;import('/vendor/bp-ground-materials-v1.mjs?v=20261127-sketchfab-environment-v3').then(m=>m.attachGroundMaterials(map)).catch(e=>{bpGroundMaterialsAttached=false;console.warn('Ground materials',e)});};map.on('move',bpAttachGroundMaterials);map.on('moveend',bpAttachGroundMaterials);map.on('idle',bpAttachGroundMaterials);")
              else:
                  assert s.count("let bpGroundMaterialsAttached=false;")==1
                  s,n=re.subn(r"(/vendor/bp-ground-materials-v1\.mjs)(?:\?v=[^'\"\s]+)?",r"\g<1>?v=20261127-sketchfab-environment-v3",s)
                  assert n==1, f"{base}: expected one ground module URL, got {n}"
              road_anchor="map.on('idle',bpAttachGroundMaterials);"
              road_hook="let bpSketchfabRoadModelsAttached=false;const bpAttachSketchfabRoadModels=()=>{if(bpSketchfabRoadModelsAttached||map.getZoom()<14.25)return;bpSketchfabRoadModelsAttached=true;import('/vendor/bp-sketchfab-road-models-v1.mjs?v=20261127-sketchfab-road-models-v1').then(m=>m.attachSketchfabRoadModels(map)).catch(e=>{bpSketchfabRoadModelsAttached=false;console.error('Sketchfab road meshes',e)});};map.on('moveend',bpAttachSketchfabRoadModels);map.on('zoomend',bpAttachSketchfabRoadModels);map.on('idle',bpAttachSketchfabRoadModels);"
              if "bpSketchfabRoadModelsAttached" not in s:
                  assert s.count(road_anchor)==1
                  s=s.replace(road_anchor,road_anchor+" "+road_hook)
              p.write_text(s)
              for name in ('index.html','landing.js','app.js'):
                  p=base/name
                  if p.exists():
                      s=p.read_text();n=re.sub(r'world-v2300-map\.js\?v=[^\'"\s<>]+','world-v2300-map.js?v=20261127-sketchfab-environment-v3',s)
                      if s!=n:p.write_text(n)
          assert (site/'assets/street-detail-v1/pavers.png').stat().st_size>0
          print('GROUND_MATERIALS_SCOPED_PATCH_PASS')
          PY
          mkdir -p "$RUNNER_TEMP/ground-build"
          cat > "$RUNNER_TEMP/ground-build/ground.mjs" <<'JS'
          import clipping from 'polygon-clipping';
          const R=6378137,D=Math.PI/180,CELL=64,MIN=13.5,DETAIL=15.35;
          const TURL='/vendor/three.module.js?v=169-local',ASSET='/assets/street-detail-v1/sketchfab/',LOADER='/vendor/GLTFLoader.bundle.js?v=169-local',STREET='/vendor/bp-street-detail-v1.mjs?v=20261127-sketchfab-models',LAYER='bp-ground-grass-mesh-v1',SRC='bp-ground-material-tiles-v1',FILL='bp-ground-grass-fill-v1',PAVE='bp-ground-paving-fill-v1';
          const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
          const xy=q=>[R*q[0]*D,R*Math.asinh(Math.tan(clamp(q[1],-85.05112878,85.05112878)*D))];
          const ll=q=>[q[0]/R/D,Math.atan(Math.sinh(q[1]/R))/D];
          const square=(x,y,n=CELL)=>[[[x,y],[x+n,y],[x+n,y+n],[x,y+n],[x,y]]];
          const feature=(poly,kind)=>({type:'Feature',geometry:{type:'Polygon',coordinates:poly.map(r=>r.map(ll))},properties:{kind}});
          const empty=()=>({type:'FeatureCollection',features:[]});
          function polys(f){const g=f?.geometry;if(g?.type==='Polygon')return [g.coordinates.map(r=>r.map(xy))];if(g?.type==='MultiPolygon')return g.coordinates.map(p=>p.map(r=>r.map(xy)));return [];}
          function lines(f){const g=f?.geometry;return g?.type==='LineString'?[g.coordinates.map(xy)]:g?.type==='MultiLineString'?g.coordinates.map(l=>l.map(xy)):[];}
          function bbox(p){let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;for(const ring of p)for(const q of ring){a=Math.min(a,q[0]);b=Math.min(b,q[1]);c=Math.max(c,q[0]);d=Math.max(d,q[1])}return[a,b,c,d]}
          const overlaps=(a,b)=>a[0]<=b[2]&&a[2]>=b[0]&&a[1]<=b[3]&&a[3]>=b[1];
          const lower=v=>String(v||'').toLowerCase();
          const tag=(f,k)=>lower(f.properties?.[k]);
          const isGrass=f=>['grass','meadow','grassland','lawn','village_green','grass_verge'].includes(tag(f,'class'))||['grass','meadow','grassland','lawn','grass_verge'].includes(tag(f,'subclass'))||tag(f,'part')==='grass_verge'||tag(f,'surface')==='grass';
          const isPave=f=>['paving_stones','sett','cobblestone','brick','pavers'].includes(tag(f,'surface'))||['paving_stones','sett','cobblestone','brick','pavers'].includes(tag(f,'surface_material'));
          function roadWidth(f){const p=f.properties||{},w=parseFloat(p.width||p.width_m);if(Number.isFinite(w)&&w>0&&w<80)return w;const c=lower(p.class),sub=lower(p.subclass);if(['path','footway','sidewalk','cycleway','steps','pedestrian'].includes(c)||['footway','sidewalk','cycleway'].includes(sub))return 2.4;return ({motorway:22,trunk:17,primary:13,secondary:10,tertiary:8,minor:6,residential:6,service:4,track:3,rail:4})[c]||5;}
          function roadBlocks(f,out){if(['bridge','tunnel'].includes(tag(f,'brunnel')))return;for(const line of lines(f))for(let i=1;i<line.length;i++){const a=line[i-1],b=line[i],dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy);if(len<.01)continue;const r=(roadWidth(f)/2+.35)/Math.max(.1,Math.cos(ll(a)[1]*D)),nx=-dy/len*r,ny=dx/len*r,ex=dx/len*r,ey=dy/len*r;out.push([[[a[0]-ex+nx,a[1]-ey+ny],[b[0]+ex+nx,b[1]+ey+ny],[b[0]+ex-nx,b[1]+ey-ny],[a[0]-ex-nx,a[1]-ey-ny],[a[0]-ex+nx,a[1]-ey+ny]]]);}}
          function records(fs){return fs.map(p=>({p,b:bbox(p)})).filter(o=>o.b.every(Number.isFinite));}
          function clipTile(x,y,grass,blocked,pave,verge=[]){const rect=square(x,y),box=[x,y,x+CELL,y+CELL];const inside=arr=>arr.filter(o=>overlaps(o.b,box)).flatMap(o=>{try{return clipping.intersection(o.p,rect)}catch(_){return []}});
           const greens=inside(grass),pavings=inside(pave),verges=inside(verge),blocks=inside(blocked);if(!greens.length&&!pavings.length)return {grass:[],pave:[],verge:[]};
           try{let g=greens.length?clipping.union(...greens):[];if(g.length&&(blocks.length||pavings.length))g=clipping.difference(g,...blocks,...pavings);let p=pavings.length?clipping.union(...pavings):[];let v=verges.length?clipping.union(...verges):[];if(v.length&&(blocks.length||pavings.length))v=clipping.difference(v,...blocks,...pavings);if(v.length&&g.length)v=clipping.intersection(v,g);return {grass:g,pave:p,verge:v};}catch(_){return {grass:[],pave:[],verge:[]}}
          }
          function ringContains(r,x,y){let inside=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const a=r[i],b=r[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])inside=!inside;}return inside;}
          const contains=(p,x,y)=>ringContains(p[0],x,y)&&!p.slice(1).some(r=>ringContains(r,x,y));
                    function edgeDistance(p,x,y){let best=Infinity;for(const ring of p)for(let i=1;i<ring.length;i++){const a=ring[i-1],b=ring[i],dx=b[0]-a[0],dy=b[1]-a[1],den=dx*dx+dy*dy,t=den?clamp(((x-a[0])*dx+(y-a[1])*dy)/den,0,1):0,dist=Math.hypot(x-a[0]-dx*t,y-a[1]-dy*t);if(dist<best)best=dist;if(best<1.5)return best;}return best;}
          export function maskFixture(grass,blocked,pave,x,y){return clipTile(x,y,records(grass),records(blocked),records(pave));}
          function hash(x,y){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296;}
          export async function attachGroundMaterials(map){
           if(map.__BP_GROUND_MATERIALS_V1__)return;const d=map.__BP_GROUND_MATERIALS_V1__={status:'standby',tiles:0,blades:0,weeds:0,grassPatches:0,sketchfabTufts:0,drawCalls:0,source:'Sketchfab Realistic Grass dense field meshes and Sketchfab grass clumps; only mapped grass, medians and sidewalk verges; Sketchfab paving texture'};window.__BP_GROUND_MATERIALS_V1__=d;
           let T=null,renderer=null,camera=null,scene=null,timer=0,dead=false,last='',running=false,dirty=true,cache=new Map(),meshes=new Map(),visibleKeys=new Set(),paver=null,loading=false,loader=null,street=null,groundTemplates=null;
           const mobile=innerWidth<=900||Number(navigator.deviceMemory||4)<=3;
           function source(id,sl){try{return map.getSource(id)?map.querySourceFeatures(id,sl?{sourceLayer:sl}:{}):[]}catch(_){return []}}
           function inputs(){const cover=source('ofm','landcover'),use=source('ofm','landuse'),side=source('bpSidewalk3D'),base=source('bpLivingWorld'),all=[...cover,...use,...side,...base],grass=[],verge=[],pave=[],blocked=[];
           for(const f of all){if(isGrass(f)){const p=polys(f);grass.push(...p);if(tag(f,'part')==='grass_verge'||tag(f,'class')==='grass_verge'||tag(f,'subclass')==='grass_verge')verge.push(...p);}else if(isPave(f)&&tag(f,'part')!=='sidewalk_slab')pave.push(...polys(f));else if(['sidewalk_slab','curb','parking','road','paved','asphalt','concrete'].includes(tag(f,'part'))||['parking','asphalt','concrete','paved'].includes(tag(f,'surface'))||tag(f,'class')==='parking')blocked.push(...polys(f));}
           for(const f of [...source('ofm','water'),...source('ofm','building'),...source('bpBuildings','buildings'),...source('bpCityStructures','buildings'),...source('exact'),...source('bpRoad3D')])blocked.push(...polys(f));
           for(const f of source('ofm','transportation'))roadBlocks(f,blocked);
           return {grass:records(grass),verge:records(verge),blocked:records(blocked),pave:records(pave)};

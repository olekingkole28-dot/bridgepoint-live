name: Deploy BridgePoint Experience V550

on:
  push:
    branches: [main]
    paths:
      - experience/**
      - .github/workflows/deploy-experience-v550.yml
  workflow_run:
    workflows:
      - "Deploy BridgePoint Live — Audited V443"
      - "Deploy BridgePoint Distribution V547"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy-experience:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble V550 experience on durable live artifact
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site /tmp/public-base
          mkdir -p site /tmp/public-base
          git archive --format=tar origin/live-artifact | tar -xf - -C /tmp/public-base
          cp -a /tmp/public-base/. site/

          test -s experience/capabilities.html
          test -s experience/app-technology.html
          test -s site/index.html
          test -s site/app/index.html

          rm -rf site/capabilities site/app/technology
          mkdir -p site/capabilities site/app/technology
          cp experience/capabilities.html site/capabilities/index.html
          cp experience/app-technology.html site/app/technology/index.html

          python - <<'PY'
          from pathlib import Path

          home=Path('site/index.html')
          h=home.read_text(encoding='utf-8')
          if 'id="everything-v550"' not in h:
              old='<h1>Know where to look before you spend the windshield time.</h1>'
              new='<h1>One property. One living intelligence record.</h1>'
              if old in h:
                  h=h.replace(old,new,1)
              oldp='<p>BridgePoint turns fragmented property records, weather exposure, property changes and other permitted evidence into explainable property intelligence—and is extending that same property record into building health, digital twins, climate, claims and field intelligence.</p>'
              newp='<p>BridgePoint connects property records, weather, physical change, claims evidence, field work, building health, digital twins, climate, sensors and more into one explainable property intelligence system—then keeps improving that picture as new verified evidence arrives.</p>'
              if oldp in h:
                  h=h.replace(oldp,newp,1)
              if '<a href="#deep-tech">Deep Tech</a>' in h and 'href="/capabilities/"' not in h:
                  h=h.replace('<a href="#deep-tech">Deep Tech</a>','<a href="/capabilities/">Everything</a><a href="#deep-tech">Deep Tech</a>',1)
              hero_cta='<a class="btn secondary" href="/capabilities/?utm_source=homepage&utm_medium=hero&utm_campaign=v550_everything">See everything BridgePoint can do</a>'
              anchor='<a class="btn secondary" href="#deep-tech">Explore Deep Property Intelligence</a>'
              if anchor in h and hero_cta not in h:
                  h=h.replace(anchor,hero_cta+anchor,1)
              block='''
          <section class="wrap section" id="everything-v550"><div class="techshell"><div class="techhead"><div><span class="kicker">Everything BridgePoint · explained plainly</span><h2>Stop wondering what is hidden in the backend.</h2><p class="lede">Explore every customer-eligible BridgePoint capability with a simple explanation, real example, honest readiness status and what still has to be connected. Inside the app, the owner account gets the expanded internal view too.</p></div><div class="techcount">Live V550 capability catalog</div></div><div class="grid3"><div class="card"><span class="kicker">Property brain</span><h3>One living property record</h3><p>Identity, history, weather, evidence, signals, health, claims, imagery and field observations can all point back to the same property.</p></div><div class="card"><span class="kicker">Truth labels</span><h3>Live is not the same as proven</h3><p>BridgePoint separates available-now engines, features needing real inputs, backend-ready systems and experiments so customers can understand exactly what they are looking at.</p></div><div class="card"><span class="kicker">Self-service</span><h3>See it before you buy it</h3><p>The public catalog explains the platform before signup. The in-app Technology Center then connects capabilities back to the working BridgePoint workspace.</p></div></div><div class="actions"><a class="btn primary" href="/capabilities/?utm_source=homepage&utm_medium=everything&utm_campaign=v550">Explore every customer capability</a><a class="btn secondary" href="/app/technology/?utm_source=homepage&utm_medium=everything&utm_campaign=v550">Open the in-app Technology Center</a></div></div></section>
          '''
              if '</main>' not in h:
                  raise SystemExit('Homepage main closing tag missing')
              h=h.replace('</main>',block+'</main>',1)
          home.write_text(h,encoding='utf-8')

          app=Path('site/app/index.html')
          a=app.read_text(encoding='utf-8')
          if 'bp-everything-launcher-v550' not in a:
              if '</head>' not in a or '</body>' not in a:
                  raise SystemExit('Unexpected app shell; refusing blind patch')
              style='''<style id="bp-everything-style-v550">#bp-everything-launcher-v550{position:fixed;left:14px;bottom:14px;z-index:2147483000;display:flex;align-items:center;gap:7px;padding:10px 13px;border-radius:999px;border:1px solid rgba(71,221,255,.55);background:rgba(7,24,39,.94);box-shadow:0 10px 34px rgba(0,0,0,.35),0 0 24px rgba(71,221,255,.12);color:#f6fbff;text-decoration:none;font:800 12px/1 system-ui,-apple-system,"Segoe UI",sans-serif;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);touch-action:manipulation}#bp-everything-launcher-v550:hover{background:#10314b;border-color:#58e3ff}@media(max-width:620px){#bp-everything-launcher-v550{left:10px;bottom:10px;padding:9px 11px;font-size:11px}}</style>'''
              a=a.replace('</head>',style+'</head>',1)
              launcher='<a id="bp-everything-launcher-v550" href="/app/technology/" aria-label="Open Everything BridgePoint Technology Center">⚡ Everything BridgePoint</a>'
              a=a.replace('</body>',launcher+'</body>',1)
          app.write_text(a,encoding='utf-8')

          sitemap=Path('site/sitemap.xml')
          if sitemap.exists():
              x=sitemap.read_text(encoding='utf-8')
              url='https://bridgepointintelligence.online/capabilities/'
              if url not in x:
                  row=f'  <url><loc>{url}</loc><changefreq>weekly</changefreq><priority>0.95</priority></url>\n'
                  if '</urlset>' not in x:
                      raise SystemExit('Sitemap closing tag missing')
                  x=x.replace('</urlset>',row+'</urlset>',1)
                  sitemap.write_text(x,encoding='utf-8')
          PY

          test -s site/capabilities/index.html
          test -s site/app/technology/index.html
          grep -q 'Everything BridgePoint · plain English' site/capabilities/index.html
          grep -q 'Technology Center · V550' site/app/technology/index.html
          grep -q 'everything-v550' site/index.html
          grep -q 'One property. One living intelligence record.' site/index.html
          grep -q 'bp-everything-launcher-v550' site/app/index.html
          grep -q 'bridgepoint_public_capability_catalog_v550' site/capabilities/index.html
          grep -q 'bridgepoint_capability_experience_v550' site/app/technology/index.html
          if grep -R -E -i 'SUPABASE_SERVICE_ROLE_KEY|sb_secret|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' site/capabilities site/app/technology; then
            echo 'Privileged secret marker found in V550 experience.' >&2
            exit 1
          fi
          touch site/.nojekyll site/app/.nojekyll
          echo 'BridgePoint V550 capability experience assembled.'

      - name: Persist exact V550 live artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/final-live
          mkdir /tmp/final-live
          cp -a site/. /tmp/final-live/
          cd /tmp/final-live
          git init
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m 'BridgePoint live artifact with V550 capability experience'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish BridgePoint V550 experience
        id: deployment
        uses: actions/deploy-pages@v4

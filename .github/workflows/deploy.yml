name: Deploy BridgePoint Live

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download audited BridgePoint v318 production build
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-0220-81f6-bae8-fdbdbe0f4d13/raw?se=2026-08-18T18%3A04%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=ed23ee4e-f162-55bc-86dc-0ca51d5919ab&skoid=dd316919-ffbf-4550-9c54-dfc99f412009&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-17T21%3A35%3A26Z&ske=2026-08-18T21%3A35%3A26Z&sks=b&skv=2026-02-06&sig=OwB9DbfrNloY3XkyHmzlue7H3uGOwEmfNHn5yx5p57g%3D' -o /tmp/bridgepoint-v318.zip
          echo '532d752cd58c70e6eec8cb33995813eb941fed857ebebf0bbd8ae6cd039185f7  /tmp/bridgepoint-v318.zip' | sha256sum -c -
          rm -rf site
          mkdir -p site
          unzip -q /tmp/bridgepoint-v318.zip -d site
          touch site/.nojekyll
          sed -i 's#<base href="/">#<base href="./">#' site/index.html

          test -s site/index.html
          test -s site/main.dart.js
          test -s site/bridgepoint-release.json
          grep -q 'be93bc4c44cdccd895fbd8cfc367e4610f9cb8a2' site/bridgepoint-release.json
          grep -q 'https://bridgepointintelligence.online/' site/bridgepoint-release.json

          # Install / PWA contracts must remain present.
          grep -q 'bridgepoint-v310-install-onboarding' site/index.html
          grep -q 'Put BridgePoint on your home screen' site/index.html
          grep -q 'beforeinstallprompt' site/index.html
          grep -q 'Add to Home Screen' site/index.html

          # Established customer/owner contracts must remain present.
          grep -q 'DENSITY HEAT' site/main.dart.js
          grep -q 'BridgePoint Community Chat' site/main.dart.js
          grep -q 'NOAA LIVE RAIN RADAR' site/main.dart.js
          grep -q 'Meet the Owner' site/main.dart.js
          grep -q 'Customer preview' site/main.dart.js
          grep -q 'Investor Room' site/main.dart.js
          grep -q 'Preview package fit' site/main.dart.js
          grep -q 'BEST ACTIONABLE FIT' site/main.dart.js
          grep -q 'bridgepoint-v314-investor-room' site/main.dart.js

          # V316 manual-social contract remains: public profile links stay; auto-publisher/OAuth stays removed.
          grep -q 'bridgepoint_brand_contact_v215' site/main.dart.js
          if grep -q 'bridgepoint-social-publisher-v120' site/main.dart.js; then
            echo 'Automatic social publisher unexpectedly remains in v318.' >&2
            exit 1
          fi
          if grep -q 'bridgepoint-social-connect-v122' site/main.dart.js; then
            echo 'Automatic social OAuth connector unexpectedly remains in v318.' >&2
            exit 1
          fi

          # V318 package-exact access + precipitation intelligence contracts.
          # These exact strings survived Flutter release compilation and were checked against the artifact locally.
          grep -q 'bridgepoint_customer_access_contract_v318' site/main.dart.js
          grep -q 'Live precipitation radar is not included in this account' site/main.dart.js
          grep -q 'dBZ = radar reflectivity intensity' site/main.dart.js

          if grep -q 'BridgePoint V81 uses negative scoring' site/main.dart.js; then
            echo 'Legacy technical customer wording unexpectedly remains.' >&2
            exit 1
          fi
          echo 'BridgePoint v318 audited access + precipitation production artifact ready for deployment.'

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish BridgePoint
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record verified live deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          release=json.loads(Path('site/bridgepoint-release.json').read_text(encoding='utf-8'))
          receipt={
            'status':'PUBLISHED',
            'release_sha':release['version'],
            'built_at':release.get('built_at'),
            'deployed_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'public_origin':release.get('public_origin'),
            'pages_url':os.environ.get('PAGE_URL'),
            'artifact_sha256':'532d752cd58c70e6eec8cb33995813eb941fed857ebebf0bbd8ae6cd039185f7',
            'release_label':'BridgePoint v318 package-exact access + live precipitation intelligence'
          }
          Path('live-release-status.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(receipt,indent=2))
          PY
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add live-release-status.json
          git commit -m 'Record BridgePoint v318 live deployment [skip ci]'
          git push origin HEAD:main

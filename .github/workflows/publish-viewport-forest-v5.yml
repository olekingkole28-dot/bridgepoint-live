      - name: Verify dense regional coverage, forest holes and source-mesh browser rendering
        run: |
          set -euo pipefail
          export SITE="$RUNNER_TEMP/horizon-site" BP_TEST="$RUNNER_TEMP/street-browser-test"
          mkdir -p "$BP_TEST"
          npm install --prefix "$BP_TEST" playwright
          "$BP_TEST/node_modules/.bin/playwright" install --with-deps chromium
          python3 - <<'PY'
          from pathlib import Path
          s=Path('street-detail-v1/verify.mjs').read_text()
          s=s.replace('<meta charset="utf-8">','<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">')

name: Deploy BridgePoint Live — Audited V440

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-v440-live.yml
      - acquisition_tracker.js
      - landing/**
      - articles/**
      - sample/**
      - owner/**
      - robots.txt
      - sitemap.xml
      - llms.txt
      - dc8a83e4caade76fd824cf929dca48d6.txt
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble current public site with exact audited V440 app
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          git fetch origin app-artifact-v440:refs/remotes/origin/app-artifact-v440
          rm -rf site /tmp/public-base /tmp/v440-app
          mkdir -p site /tmp/public-base /tmp/v440-app

          # Preserve the most recently published public landing/research/sample/owner surfaces.
          git archive --format=tar origin/live-artifact | tar -xf - -C /tmp/public-base
          cp -a /tmp/public-base/. site/

          # Replace only the compiled application with the exact audited V440 artifact.
          rm -rf site/app
          mkdir -p site/app
          git archive --format=tar origin/app-artifact-v440 | tar -xf - -C /tmp/v440-app
          test -s /tmp/v440-app/index.html
          test -s /tmp/v440-app/main.dart.js
          test -s /tmp/v440-app/flutter_bootstrap.js
          test -s /tmp/v440-app/bridgepoint-release.json
          grep -q '4b80bbdc1137ce7b7d3fc26f69fa5077c5c8566a' /tmp/v440-app/bridgepoint-release.json
          grep -q 'https://bridgepointintelligence.online/' /tmp/v440-app/bridgepoint-release.json
          grep -q 'Create account' /tmp/v440-app/main.dart.js
          grep -q 'Already have an account' /tmp/v440-app/main.dart.js
          grep -q 'Check your email' /tmp/v440-app/main.dart.js
          if grep -Eqi 'SUPABASE_SERVICE_ROLE_KEY|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' /tmp/v440-app/main.dart.js; then
            echo 'Privileged secret marker found in audited browser artifact.' >&2
            exit 1
          fi
          cp -a /tmp/v440-app/. site/app/
          rm -rf site/app/articles site/app/sample site/app/landing site/app/owner

          # The source artifact is built for root; the live application is mounted at /app/.
          python - <<'PY'
          from pathlib import Path
          p=Path('site/app/index.html')
          s=p.read_text(encoding='utf-8')
          if '<base href="/">' not in s and '<base href="/app/">' not in s:
              raise SystemExit('Unexpected Flutter base href; refusing to deploy')
          s=s.replace('<base href="/">','<base href="/app/">')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q '<base href="/app/">' site/app/index.html

          # Overlay the current privacy-safe V440 acquisition tracker at both public scopes.
          test -s acquisition_tracker.js
          grep -q 'captureVersion=440' acquisition_tracker.js
          grep -q 'bridgepoint-coarse-geo-v436' acquisition_tracker.js
          grep -q 'mode.*signup' acquisition_tracker.js
          grep -q 'account_mode' acquisition_tracker.js
          if grep -q 'service_role' acquisition_tracker.js; then
            echo 'Forbidden privileged credential marker found in browser tracker.' >&2
            exit 1
          fi
          cp acquisition_tracker.js site/acquisition_tracker.js
          cp acquisition_tracker.js site/app/acquisition_tracker.js
          touch site/.nojekyll site/app/.nojekyll

          # Public-site continuity guards.
          test -s site/index.html
          test -s site/articles/index.html
          test -s site/articles/feed.xml
          test -s site/sample/index.html
          test -s site/owner/acquisition/index.html
          test -s site/robots.txt
          test -s site/sitemap.xml
          test -s site/llms.txt
          grep -q 'U.S. property intelligence platform' site/index.html
          grep -q 'application/ld+json' site/index.html
          grep -q '/app/' site/index.html
          grep -q 'request_territory_sample_v425' site/sample/index.html
          grep -q 'bridgepoint_owner_acquisition_v432' site/owner/acquisition/index.html
          grep -q 'noindex,nofollow,noarchive' site/owner/acquisition/index.html

          echo 'BridgePoint public site assembled with exact audited V440 signup conversion artifact.'

      - name: Persist exact deployed site for rollback and audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/final-live
          mkdir /tmp/final-live
          cp -a site/. /tmp/final-live/
          cd /tmp/final-live
          git init
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m 'BridgePoint live artifact with audited V440 signup conversion'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish BridgePoint
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record exact V440 production receipt
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          receipt={
            'status':'PUBLISHED',
            'source_main_sha':'796bae97fd83adfe8ca93746d395a421e6970e86',
            'audited_artifact_marker':'4b80bbdc1137ce7b7d3fc26f69fa5077c5c8566a',
            'immutable_app_branch':'app-artifact-v440',
            'tracking_version':440,
            'account_entry_version':440,
            'signup_conversion_version':440,
            'coarse_geo_resolver_version':436,
            'owner_funnel_version':432,
            'owner_acquisition_view_version':432,
            'capture':'FIRST_PARTY_BROWSER_WITH_EXPLICIT_SIGNUP_VS_SIGNIN_INTENT',
            'public_home':'/',
            'app_path':'/app/',
            'public_origin':'https://bridgepointintelligence.online/',
            'pages_url':os.environ.get('PAGE_URL'),
            'durable_artifact_branch':'live-artifact',
            'deployed_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'contains_privileged_secret':False
          }
          open('tracking-release-status.json','w',encoding='utf-8').write(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tracking-release-status.json
          git commit -m 'Record audited V440 live deployment [skip ci]' || true
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 0; }
          done
          exit 0

name: Deploy BridgePoint Live — Audited V443

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-v443-live.yml
      - tool/apply_install_guide_runtime_v443.py
      - acquisition_tracker.js
      - landing/**
      - articles/**
      - sample/**
      - owner/**
      - robots.txt
      - sitemap.xml
      - llms.txt
      - dc8a83e4caade76fd824cf929dca48d6.txt
  workflow_dispatch:
    inputs:
      release_reason:
        description: Audited V443 publisher recovery reason
        required: false
        default: recovery

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble audited V443 production site
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          git fetch origin app-artifact-v441:refs/remotes/origin/app-artifact-v441
          rm -rf site /tmp/public-base /tmp/v441-app
          mkdir -p site /tmp/public-base /tmp/v441-app
          git archive --format=tar origin/live-artifact | tar -xf - -C /tmp/public-base
          cp -a /tmp/public-base/. site/
          rm -rf site/app
          mkdir -p site/app
          git archive --format=tar origin/app-artifact-v441 | tar -xf - -C /tmp/v441-app

          test -s /tmp/v441-app/index.html
          test -s /tmp/v441-app/main.dart.js
          test -s /tmp/v441-app/flutter_bootstrap.js
          test -s /tmp/v441-app/bridgepoint-release.json
          grep -q '"version": 441' /tmp/v441-app/bridgepoint-release.json
          grep -q '5f4114197d834adbb368895238188b57940e279c' /tmp/v441-app/bridgepoint-release.json
          grep -q '7e18e90df85526abc7ec001fbd506f72afd8e140b178282347b60e5643848d9c' /tmp/v441-app/bridgepoint-release.json
          grep -q 'bridgepoint-v441-mobile-install-fallback' /tmp/v441-app/index.html
          grep -q 'id="bp-install-fallback-v441"' /tmp/v441-app/index.html
          grep -q 'DOWNLOAD / OPEN APP' /tmp/v441-app/index.html
          grep -q 'window.location.assign(appUrl)' /tmp/v441-app/index.html
          grep -q 'mode=signin&utm_source=install_guide' /tmp/v441-app/index.html
          grep -q 'pointer-events:auto!important' /tmp/v441-app/index.html
          grep -q 'touch-action:manipulation' /tmp/v441-app/index.html
          grep -q 'Create account' /tmp/v441-app/main.dart.js
          grep -q 'Already have an account' /tmp/v441-app/main.dart.js
          grep -q 'Check your email' /tmp/v441-app/main.dart.js
          if grep -Eqi 'SUPABASE_SERVICE_ROLE_KEY|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' /tmp/v441-app/main.dart.js; then
            echo 'Privileged secret marker found in audited browser artifact.' >&2
            exit 1
          fi
          cp -a /tmp/v441-app/. site/app/
          rm -rf site/app/articles site/app/sample site/app/landing site/app/owner

          python - <<'PY'
          from pathlib import Path
          p=Path('site/app/index.html')
          s=p.read_text(encoding='utf-8')
          if '<base href="/">' not in s and '<base href="/app/">' not in s:
              raise SystemExit('Unexpected Flutter base href; refusing to deploy')
          s=s.replace('<base href="/">','<base href="/app/">')
          marker='bridgepoint-v442-install-guide-mobile-width'
          if marker not in s:
              if 'bridgepoint-v441-mobile-install-fallback' not in s or 'id="bp-install-fallback-v441"' not in s:
                  raise SystemExit('V443 prerequisites missing from audited V441 base')
              if '</head>' not in s:
                  raise SystemExit('V443 live head anchor missing')
              style='''  <style id="bridgepoint-v442-install-guide-mobile-width">
          #bp-install-fallback-v441{box-sizing:border-box!important;max-width:100%!important}
          @media(max-width:620px){
            .bp-install-actions{box-sizing:border-box!important;width:min(100%,calc(100vw - 24px))!important;max-width:calc(100vw - 24px)!important;margin-left:auto!important;margin-right:auto!important;overflow:visible!important}
            .bp-install-actions>*{box-sizing:border-box!important;max-width:100%!important;min-width:0!important}
            .bp-install-primary,.bp-install-secondary,#bp-install-fallback-v441{box-sizing:border-box!important;width:100%!important;max-width:100%!important;min-width:0!important}
          }
          </style>
          '''
              s=s.replace('</head>',style+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q '<base href="/app/">' site/app/index.html
          grep -q 'bridgepoint-v442-install-guide-mobile-width' site/app/index.html
          grep -q 'width:min(100%,calc(100vw - 24px))!important' site/app/index.html
          grep -q 'max-width:calc(100vw - 24px)!important' site/app/index.html

          BRIDGEPOINT_WEB_INDEX=site/app/index.html python tool/apply_install_guide_runtime_v443.py
          grep -q 'bridgepoint-v443-install-guide-runtime' site/app/index.html
          grep -q '#bp-install-backdrop:not(.show){visibility:hidden;pointer-events:none}' site/app/index.html
          grep -q 'Continue to BridgePoint' site/app/index.html
          grep -q 'showInstall(force=false)' site/app/index.html
          grep -q 'showInstall(true)' site/app/index.html
          grep -q 'new MutationObserver(sync)' site/app/index.html
          if grep -q '<a id="bp-install-fallback-v441"' site/app/index.html; then
            echo 'Circular V441 fallback anchor survived the V443 repair.' >&2
            exit 1
          fi

          test -s acquisition_tracker.js
          grep -q 'captureVersion=440' acquisition_tracker.js
          grep -q 'bridgepoint-coarse-geo-v436' acquisition_tracker.js
          grep -q 'mode.*signup' acquisition_tracker.js
          grep -q 'account_mode' acquisition_tracker.js
          if grep -q 'service_role' acquisition_tracker.js; then
            echo 'Forbidden privileged credential marker found in browser tracker.' >&2
            exit 1
          fi
          cp acquisition_tracker.js site/acquisition_tracker.js
          cp acquisition_tracker.js site/app/acquisition_tracker.js
          touch site/.nojekyll site/app/.nojekyll

          BASE_SHA='7e18e90df85526abc7ec001fbd506f72afd8e140b178282347b60e5643848d9c'
          APP_DIGEST="$(find site/app -type f ! -name bridgepoint-release.json -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          export BASE_SHA APP_DIGEST
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          marker={
            'version':443,
            'release':'V443 Mobile Install Runtime Repair',
            'source_sha':'2c357f65a6b67afc924b624fe5f9e86cce5d0dc6',
            'source_pr':57,
            'source_pr_head':'6e60d771baf70801288d0b9f696634d13c3458bb',
            'base_release_version':441,
            'base_source_sha':'5f4114197d834adbb368895238188b57940e279c',
            'base_artifact_sha256':os.environ['BASE_SHA'],
            'artifact_sha256':os.environ['APP_DIGEST'],
            'artifact_digest_scope':'site/app excluding bridgepoint-release.json',
            'published_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'immutable_base_branch':'app-artifact-v441',
            'customer_domain':'https://bridgepointintelligence.online/',
            'classifier_version':443,
            'deployment_contract':'CI-audited V441 compiled app + source-audited V442 width clamp + V443 runtime behavior repair'
          }
          open('site/app/bridgepoint-release.json','w',encoding='utf-8').write(json.dumps(marker,indent=2)+'\n')
          print(json.dumps(marker,indent=2))
          PY
          grep -q '"version": 443' site/app/bridgepoint-release.json
          grep -q '2c357f65a6b67afc924b624fe5f9e86cce5d0dc6' site/app/bridgepoint-release.json

          python - <<'PY'
          import json
          from datetime import datetime,timezone
          app=json.load(open('site/app/bridgepoint-release.json'))
          receipt={
            'status':'PUBLISHED',
            'source_main_sha':app['source_sha'],
            'assembled_artifact_sha256':app['artifact_sha256'],
            'immutable_app_base_branch':app['immutable_base_branch'],
            'app_release_version':443,
            'mobile_install_open_version':443,
            'tracking_version':440,
            'account_entry_version':440,
            'signup_conversion_version':440,
            'coarse_geo_resolver_version':436,
            'owner_funnel_version':432,
            'public_home':'/',
            'app_path':'/app/',
            'public_origin':'https://bridgepointintelligence.online/',
            'durable_artifact_branch':'live-artifact',
            'assembled_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'contains_privileged_secret':False
          }
          open('site/tracking-release-status.json','w',encoding='utf-8').write(json.dumps(receipt,indent=2)+'\n')
          PY
          grep -q '"app_release_version": 443' site/tracking-release-status.json

          test -s site/index.html
          test -s site/articles/index.html
          test -s site/articles/feed.xml
          test -s site/sample/index.html
          test -s site/owner/acquisition/index.html
          test -s site/robots.txt
          test -s site/sitemap.xml
          test -s site/llms.txt
          grep -q 'U.S. property intelligence platform' site/index.html
          grep -q 'application/ld+json' site/index.html
          grep -q '/app/' site/index.html
          grep -q 'request_territory_sample_v425' site/sample/index.html
          grep -q 'bridgepoint_owner_acquisition_v432' site/owner/acquisition/index.html
          grep -q 'noindex,nofollow,noarchive' site/owner/acquisition/index.html
          echo 'BridgePoint public site assembled with audited V443 mobile install-guide runtime repair.'

      - name: Persist exact deployed site for rollback and audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/final-live
          mkdir /tmp/final-live
          cp -a site/. /tmp/final-live/
          cd /tmp/final-live
          git init
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m 'BridgePoint live artifact with audited V443 mobile runtime repair'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish BridgePoint
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record exact V443 production receipt
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          APP_DIGEST="$(python - <<'PY'
          import json
          print(json.load(open('site/app/bridgepoint-release.json'))['artifact_sha256'])
          PY
          )"
          export APP_DIGEST
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          receipt={
            'status':'PUBLISHED',
            'source_main_sha':'2c357f65a6b67afc924b624fe5f9e86cce5d0dc6',
            'base_audited_artifact_sha256':'7e18e90df85526abc7ec001fbd506f72afd8e140b178282347b60e5643848d9c',
            'assembled_artifact_sha256':os.environ['APP_DIGEST'],
            'immutable_app_base_branch':'app-artifact-v441',
            'app_release_version':443,
            'mobile_install_open_version':443,
            'tracking_version':440,
            'account_entry_version':440,
            'signup_conversion_version':440,
            'coarse_geo_resolver_version':436,
            'owner_funnel_version':432,
            'owner_acquisition_view_version':432,
            'capture':'FIRST_PARTY_BROWSER_WITH_EXPLICIT_SIGNUP_VS_SIGNIN_INTENT',
            'public_home':'/',
            'app_path':'/app/',
            'public_origin':'https://bridgepointintelligence.online/',
            'pages_url':os.environ.get('PAGE_URL'),
            'durable_artifact_branch':'live-artifact',
            'deployed_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'contains_privileged_secret':False
          }
          open('tracking-release-status.json','w',encoding='utf-8').write(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tracking-release-status.json
          git commit -m 'Record audited V443 live deployment [skip ci]' || true
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 0; }
          done
          exit 0

name: Release BridgePoint Local AI V936

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-local-agent-v936.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bridgepoint-local-agent-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout control scripts
        uses: actions/checkout@v4
        with:
          ref: main
          path: controls

      - name: Checkout durable live artifact
        uses: actions/checkout@v4
        with:
          ref: live-artifact
          path: artifact
          fetch-depth: 0

      - name: Apply guarded V936 patch
        shell: bash
        run: |
          set -euo pipefail
          cp controls/ops/patch_local_agent_v936.py artifact/patch_local_agent_v936.py
          cd artifact
          python patch_local_agent_v936.py
          rm patch_local_agent_v936.py
          grep -q '\$AgentVersion=936' downloads/local-ai/bridgepoint_local_ai.ps1
          grep -q 'portable_export_protocol=.STATE_V936.' downloads/local-ai/bridgepoint_local_ai.ps1
          grep -q 'bridgepoint_state_export_windows.ps1' downloads/local-ai/bridgepoint_local_ai.ps1

      - name: Parse-check PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Test-PsFile([string]$Path){
            $tokens=$null
            $errors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($Path,[ref]$tokens,[ref]$errors)
            if($errors.Count -gt 0){
              foreach($e in $errors){
                Write-Host ('PARSER_ERROR {0}:{1}:{2} text={3} message={4}' -f $Path,$e.Extent.StartLineNumber,$e.Extent.StartColumnNumber,$e.Extent.Text,$e.Message)
              }
              throw ('PowerShell parse failed: {0} error(s) in {1}' -f $errors.Count,$Path)
            }
            Write-Host ('PowerShell syntax passed: {0}' -f $Path)
          }
          Test-PsFile 'artifact/downloads/local-ai/bridgepoint_local_ai.ps1'
          Test-PsFile 'artifact/downloads/backup/bridgepoint_state_export_windows.ps1'

      - name: Commit durable agent release
        shell: bash
        run: |
          set -euo pipefail
          cd artifact
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add downloads/local-ai/bridgepoint_local_ai.ps1
          if git diff --cached --quiet; then
            echo 'Local agent V936 already present.'
          else
            git commit -m 'Release Local AI portable export worker V936'
            git push origin HEAD:live-artifact
          fi

# V936 retry after fixing legacy backup parser bugs 2026-08-27

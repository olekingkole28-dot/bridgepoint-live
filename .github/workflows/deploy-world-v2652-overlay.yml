name: Deploy BridgePoint Labeled Living World

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'staging/world-v2652/**'
      - 'staging/home-v2652/**'
      - '.github/workflows/deploy-world-v2652-overlay.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate staged V2657 world files
        run: |
          set -euo pipefail
          test -s staging/world-v2652/index.html
          test -s staging/world-v2652/world-v2653-surface.js
          test -s staging/world-v2652/world-v2656-interaction.js
          test -s staging/world-v2652/world-v2657-experience.js
          test -s staging/world-v2652/world-v2657-status.js
          test -s staging/world-v2652/world-v2652-production.js
          test -s staging/world-v2652/world-v2652-actions.js
          test -s staging/world-v2652/world-v2652.css
          test -s staging/home-v2652/patch-live-app.py
          node --check staging/world-v2652/world-v2653-surface.js
          node --check staging/world-v2652/world-v2656-interaction.js
          node --check staging/world-v2652/world-v2657-experience.js
          node --check staging/world-v2652/world-v2657-status.js
          node --check staging/world-v2652/world-v2652-production.js
          node --check staging/world-v2652/world-v2652-actions.js
          grep -Fq 'world-v2657-experience.js' staging/world-v2652/index.html
          grep -Fq 'world-v2657-status.js' staging/world-v2652/index.html
          grep -Fq 'controller.enableZoom=true' staging/world-v2652/world-v2656-interaction.js
          grep -Fq 'controller.enableTilt=false' staging/world-v2652/world-v2656-interaction.js
          grep -Fq 'CameraEventType.PINCH' staging/world-v2652/world-v2657-experience.js
          grep -Fq 'BridgePoint Locked' staging/world-v2652/world-v2657-experience.js
          grep -Fq 'bridgepoint_world_navigation_bootstrap_v2657' staging/world-v2652/world-v2657-experience.js
          grep -Fq 'bridgepoint_property_card_bundle_v2657' staging/world-v2652/world-v2657-experience.js
          grep -Fq 'labeled-living-world-2657' staging/home-v2652/patch-live-app.py
          ! grep -Fq '<iframe' staging/home-v2652/patch-live-app.py
          ! grep -Fq 'WebMapServiceImageryProvider' staging/world-v2652/world-v2653-surface.js

      - name: Assemble direct labeled living world
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site
          mkdir site
          git archive --format=tar origin/live-artifact | tar -xf - -C site
          test -s site/app/index.html
          test -s site/app/flutter_service_worker.js
          test -s site/app/bridgepoint-3d-world/world-v2500.js
          test -s site/app/bridgepoint-3d-world/world-v2500.css

          cp staging/world-v2652/index.html site/app/bridgepoint-3d-world/index.html
          cp staging/world-v2652/world-v2653-surface.js site/app/bridgepoint-3d-world/world-v2653-surface.js
          cp staging/world-v2652/world-v2656-interaction.js site/app/bridgepoint-3d-world/world-v2656-interaction.js
          cp staging/world-v2652/world-v2657-experience.js site/app/bridgepoint-3d-world/world-v2657-experience.js
          cp staging/world-v2652/world-v2657-status.js site/app/bridgepoint-3d-world/world-v2657-status.js
          cp staging/world-v2652/world-v2652-production.js site/app/bridgepoint-3d-world/world-v2652-production.js
          cp staging/world-v2652/world-v2652-actions.js site/app/bridgepoint-3d-world/world-v2652-actions.js
          cp staging/world-v2652/world-v2652.css site/app/bridgepoint-3d-world/world-v2652.css

          rm -rf site/app/bridgepoint-world-v2652
          cp -a site/app/bridgepoint-3d-world site/app/bridgepoint-world-v2652
          python3 staging/home-v2652/patch-live-app.py

          grep -Fq 'location.replace' site/app/index.html
          grep -Fq 'labeled-living-world-2657' site/app/index.html
          ! grep -Fq '<iframe' site/app/index.html
          ! grep -Fq 'flutter_bootstrap.js' site/app/index.html
          ! grep -Fq 'main.dart.js' site/app/index.html
          grep -Fq 'world-v2657-experience.js' site/app/bridgepoint-world-v2652/index.html
          grep -Fq 'world-v2657-status.js' site/app/bridgepoint-world-v2652/index.html
          grep -Fq 'BridgePointExperienceV2657' site/app/bridgepoint-world-v2652/world-v2657-experience.js
          grep -Fq 'bridgepointVisibleVersion' site/app/bridgepoint-world-v2652/world-v2657-status.js
          grep -Fq 'controller.enableTilt=false' site/app/bridgepoint-world-v2652/world-v2656-interaction.js
          ! grep -Fq 'WebMapServiceImageryProvider' site/app/bridgepoint-world-v2652/world-v2653-surface.js

          cat > site/app/bridgepoint-world-overlay-v2652.json <<EOF
          {"app_shell_version":2657,"map_only":true,"direct_map_navigation":true,"iframe":false,"flutter_ui_enabled":false,"us_first_camera":true,"us_jurisdictions_green":true,"foreign_countries_red_locked":true,"country_labels":true,"state_labels":true,"weather_key":true,"weather_refresh_seconds":300,"gesture_contract":{"drag":"move","pinch":"zoom","double_tap":"zoom"},"aggressive_detail_prefetch":true,"property_card_bundle":2657,"visible_compat_version_hidden":true,"surface_mode":"BRIDGEPOINT_GENERATED_MATERIAL_WORLD","raw_landcover_visible":false,"satellite_default":false,"overlay_source_sha":"${GITHUB_SHA}","versioned_world_path":"/app/bridgepoint-world-v2652/"}
          EOF
          touch site/.nojekyll site/app/.nojekyll

      - name: Persist live artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/labeled-living-world
          mkdir /tmp/labeled-living-world
          cp -a site/. /tmp/labeled-living-world/
          cd /tmp/labeled-living-world
          git init -q
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m "Publish BridgePoint labeled living world ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify production V2657 world
        run: |
          set -euo pipefail
          ORIGIN='https://bridgepointintelligence.online'
          ok=0
          for attempt in $(seq 1 36); do
            marker="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/bridgepoint-world-overlay-v2652.json?v=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            app="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/?v=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            world="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/bridgepoint-world-v2652/?v=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            experience="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/bridgepoint-world-v2652/world-v2657-experience.js?v=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            statusjs="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/bridgepoint-world-v2652/world-v2657-status.js?v=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            interaction="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/bridgepoint-world-v2652/world-v2656-interaction.js?v=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            if printf '%s' "$marker" | grep -Fq '"app_shell_version":2657' && printf '%s' "$marker" | grep -Fq '"foreign_countries_red_locked":true' && printf '%s' "$marker" | grep -Fq '"weather_key":true' && printf '%s' "$marker" | grep -Fq '"visible_compat_version_hidden":true' && printf '%s' "$app" | grep -Fq 'labeled-living-world-2657' && ! printf '%s' "$app" | grep -Fq '<iframe' && printf '%s' "$world" | grep -Fq 'world-v2657-experience.js' && printf '%s' "$world" | grep -Fq 'world-v2657-status.js' && printf '%s' "$experience" | grep -Fq 'bridgepoint_world_navigation_bootstrap_v2657' && printf '%s' "$experience" | grep -Fq 'bridgepoint_property_card_bundle_v2657' && printf '%s' "$experience" | grep -Fq 'BridgePointExperienceV2657' && printf '%s' "$statusjs" | grep -Fq 'bridgepointVisibleVersion' && printf '%s' "$interaction" | grep -Fq 'controller.enableTilt=false'; then
              ok=1
              echo "BRIDGEPOINT_LABELED_LIVING_WORLD_V2657_LIVE"
              break
            fi
            sleep 5
          done
          test "$ok" = 1

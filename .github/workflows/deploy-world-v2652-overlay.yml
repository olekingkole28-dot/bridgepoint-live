name: Deploy BridgePoint World V2652 Overlay

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'staging/world-v2652/**'
      - 'staging/home-v2652/**'
      - '.github/workflows/deploy-world-v2652-overlay.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate V2652 overlay source
        shell: bash
        run: |
          set -euo pipefail
          test -s staging/world-v2652/index.html
          test -s staging/world-v2652/world-v2652-production.js
          test -s staging/world-v2652/world-v2652-actions.js
          test -s staging/world-v2652/world-v2652.css
          test -s staging/home-v2652/bridgepoint-home-v2652.js
          test -s staging/home-v2652/bridgepoint-home-v2652.css
          node --check staging/world-v2652/world-v2652-production.js
          node --check staging/world-v2652/world-v2652-actions.js
          node --check staging/home-v2652/bridgepoint-home-v2652.js
          grep -Fq 'BridgePoint World V2652' staging/world-v2652/index.html
          grep -Fq 'bridgepoint_living_world_catalog_v2652' staging/world-v2652/world-v2652-production.js
          grep -Fq 'bridgepoint_living_world_scene_v2652' staging/world-v2652/world-v2652-production.js

      - name: Assemble visible V2652 Home over durable current app
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site && mkdir site
          git archive --format=tar origin/live-artifact | tar -xf - -C site
          test -s site/app/index.html
          test -s site/app/main.dart.js
          test -s site/app/flutter_service_worker.js
          test -s site/app/bridgepoint-3d-world/world-v2500.js
          test -s site/app/bridgepoint-3d-world/world-v2500.css

          cp staging/world-v2652/index.html site/app/bridgepoint-3d-world/index.html
          cp staging/world-v2652/world-v2652-production.js site/app/bridgepoint-3d-world/world-v2652-production.js
          cp staging/world-v2652/world-v2652-actions.js site/app/bridgepoint-3d-world/world-v2652-actions.js
          cp staging/world-v2652/world-v2652.css site/app/bridgepoint-3d-world/world-v2652.css

          rm -rf site/app/bridgepoint-world-v2652
          cp -a site/app/bridgepoint-3d-world site/app/bridgepoint-world-v2652
          cp staging/home-v2652/bridgepoint-home-v2652.js site/app/bridgepoint-home-v2652.js
          cp staging/home-v2652/bridgepoint-home-v2652.css site/app/bridgepoint-home-v2652.css

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          p=Path('site/app/index.html')
          s=p.read_text()
          s=s.replace('href="bridgepoint-3d-world/"','href="bridgepoint-world-v2652/"')
          if 'bridgepoint-home-v2652.css' not in s:
              s=s.replace('</head>','  <link rel="stylesheet" href="bridgepoint-home-v2652.css?v=2652">\n</head>',1)
          home='''
  <section id="bp-v2652-home" aria-label="BridgePoint V2652 Home">
    <div class="bp-v2652-wrap">
      <div class="bp-v2652-top"><div class="bp-v2652-logo"></div><div><div class="bp-v2652-title">BRIDGEPOINT INTELLIGENCE</div><div class="bp-v2652-sub">Living property + world intelligence</div></div><div class="bp-v2652-live">● V2652 LIVE</div></div>
      <div class="bp-v2652-hero"><h1>Your world is the home screen.</h1><p>BridgePoint combines canonical properties, claims intelligence, weather, hazards, structures, transportation, public infrastructure, imagery, physical-world observations and future governed layers in one living map. The layer catalog is driven by the backend so new capabilities do not disappear from the app.</p><div class="bp-v2652-actions"><button id="bp-v2652-open-world" class="bp-v2652-btn primary" type="button">Explore living world</button><button id="bp-v2652-workspace" class="bp-v2652-btn gold" type="button">Open full workspace</button><button id="bp-v2652-refresh" class="bp-v2652-btn" type="button">Refresh truth</button><span id="bp-v2652-updated" class="bp-v2652-sub" style="align-self:center"></span></div><div class="bp-v2652-metrics"><div class="bp-v2652-stat"><b data-bp-v2652-stat="layers">—</b><span>WORLD LAYERS</span></div><div class="bp-v2652-stat"><b data-bp-v2652-stat="sources">—</b><span>ACTIVE SOURCES</span></div><div class="bp-v2652-stat"><b data-bp-v2652-stat="observations">—</b><span>OBSERVATIONS</span></div><div class="bp-v2652-stat"><b data-bp-v2652-stat="roofs">—</b><span>ROOF ASSETS</span></div><div class="bp-v2652-stat"><b data-bp-v2652-stat="parcels">—</b><span>CANONICAL PARCELS</span></div><div class="bp-v2652-stat"><b data-bp-v2652-stat="opportunities">—</b><span>OPPORTUNITIES</span></div></div><div id="bp-v2652-meta" class="bp-v2652-sub" style="margin-top:10px">Synchronizing backend catalog…</div></div>
      <div class="bp-v2652-worldCard"><div class="bp-v2652-worldbar"><b>BridgePoint World V2652</b><span>versioned path · cache-busted · proven V2500 property core underneath</span></div><iframe id="bp-v2652-map" class="bp-v2652-world" src="bridgepoint-world-v2652/?release=2652" title="BridgePoint World V2652" allow="geolocation; fullscreen"></iframe></div>
      <div class="bp-v2652-foot">Truth rule: source registration, materialized coverage and current observations are separate. BridgePoint labels source-backed, derived, modeled, forecast and historical states instead of inventing missing detail. Use <b>Open full workspace</b> for the existing application tools while the complete Flutter rebuild is promoted.</div>
    </div>
  </section>
'''
          if 'id="bp-v2652-home"' not in s:
              s=s.replace('<body>','<body>\n'+home,1)
          if 'bridgepoint-home-v2652.js' not in s:
              s=s.replace('<script src="flutter_bootstrap.js" async></script>','<script type="module" src="bridgepoint-home-v2652.js?v=2652"></script>\n  <script src="flutter_bootstrap.js" async></script>',1)
          p.write_text(s)

          # Force Flutter PWA service worker to invalidate its cached root/index shell.
          sw=Path('site/app/flutter_service_worker.js')
          text=sw.read_text()
          digest=hashlib.md5(s.encode()).hexdigest()
          text=re.sub(r'("index\.html"\s*:\s*")[0-9a-f]+(" )?', lambda m:m.group(1)+digest+(m.group(2) or ''), text)
          text=re.sub(r'("/"\s*:\s*")[0-9a-f]+(" )?', lambda m:m.group(1)+digest+(m.group(2) or ''), text)
          text += f'\n// BridgePoint V2652 shell refresh {digest}\n'
          sw.write_text(text)
          PY

          grep -Fq 'id="bp-v2652-home"' site/app/index.html
          grep -Fq 'bridgepoint-world-v2652/' site/app/index.html
          grep -Fq 'bridgepoint-home-v2652.js' site/app/index.html
          test -s site/app/bridgepoint-world-v2652/index.html
          grep -Fq 'BridgePoint World V2652' site/app/bridgepoint-world-v2652/index.html
          cat > site/app/bridgepoint-world-overlay-v2652.json <<EOF
          {"world_version":2652,"home_shell_version":2652,"base_world_version":2500,"overlay_source_sha":"${GITHUB_SHA}","deployed_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","versioned_world_path":"/app/bridgepoint-world-v2652/","dynamic_catalog_rpc":"bridgepoint_living_world_catalog_v2652","dynamic_scene_rpc":"bridgepoint_living_world_scene_v2652","truth_clock":true,"xray_mode":true,"home_visible":true,"pwa_cache_busted":true,"old_property_core_preserved":true}
          EOF
          touch site/.nojekyll site/app/.nojekyll

      - name: Persist V2652 live artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v2652-live && mkdir /tmp/v2652-live
          cp -a site/. /tmp/v2652-live/
          cd /tmp/v2652-live
          git init -q
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m "Publish visible BridgePoint V2652 Home + World ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy V2652 to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify visible V2652 Home and World on production
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://bridgepointintelligence.online'
          ok=0
          for attempt in $(seq 1 36); do
            marker="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/bridgepoint-world-overlay-v2652.json?v=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            app="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/?v=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            world="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/bridgepoint-world-v2652/?v=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            homejs_code="$(curl -sS -o /tmp/home-v2652.js -w '%{http_code}' --max-time 15 "${ORIGIN}/app/bridgepoint-home-v2652.js?v=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            runtime_code="$(curl -sS -o /tmp/world-v2652.js -w '%{http_code}' --max-time 15 "${ORIGIN}/app/bridgepoint-world-v2652/world-v2652-production.js?v=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            if printf '%s' "$marker" | grep -Fq '"home_visible":true' && printf '%s' "$app" | grep -Fq 'id="bp-v2652-home"' && printf '%s' "$app" | grep -Fq 'bridgepoint-world-v2652/' && printf '%s' "$world" | grep -Fq 'BridgePoint World V2652' && [ "$homejs_code" = '200' ] && [ "$runtime_code" = '200' ] && grep -Fq 'BridgePointWorldV2652' /tmp/world-v2652.js; then
              ok=1
              echo "VISIBLE_V2652_HOME_AND_WORLD_LIVE ${GITHUB_SHA}"
              break
            fi
            sleep 5
          done
          test "$ok" = 1

name: Publish BridgePoint Near-Earth Object Watch over preserved production

on:
  workflow_dispatch:
  schedule:
    - cron: '24 8 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-near-earth-object-watch-v1.yml'
      - 'rebuild-v5000/bridgepoint-neo-watch-v1.js'
      - 'recovery/bridgepoint-welcome-space-v6260.js'
      - 'rebuild-v5000/bridgepoint-gaia-galaxy-v6270.js'
      - 'patches/earth-star-occlusion-v6294/bridgepoint-app-space-explorer-v1.js'
      - 'patches/near-earth-object-physical-v1/bridgepoint-welcome-space-v6260.js'
      - 'patches/near-earth-object-physical-v1/bridgepoint-gaia-galaxy-v6270.js'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-neo-watch-v1-preserved-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the latest successful production Pages snapshot
        id: baseline
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=success&branch=main&per_page=100" --jq '.workflow_runs | map(select(.conclusion == "success")) | .[].id')"
          BASELINE_ID=""
          ARTIFACT=""
          for run_id in $RUNS; do
            candidate="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" --jq '.artifacts[]? | select((.expired|not) and (.name | startswith("bridgepoint-v5000-"))) | .name' | head -n 1 || true)"
            if [ -n "$candidate" ]; then
              BASELINE_ID="$run_id"
              ARTIFACT="$candidate"
              break
            fi
          done
          test -n "$BASELINE_ID"
          test -n "$ARTIFACT"
          echo "run_id=$BASELINE_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "PRODUCTION_BASELINE run=$BASELINE_ID artifact=$ARTIFACT"

      - name: Download the production snapshot
        uses: actions/download-artifact@v4
        with:
          name: "${{ steps.baseline.outputs.artifact_name }}"
          run-id: "${{ steps.baseline.outputs.run_id }}"
          repository: "${{ github.repository }}"
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          path: "${{ runner.temp }}/bp-pages-baseline"

      - name: Restore production and fingerprint every unrelated file
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find "$RUNNER_TEMP/bp-pages-baseline" -type f -name artifact.tar -print -quit)"
          test -n "$ARCHIVE"
          SITE="$RUNNER_TEMP/bp-site"
          mkdir -p "$SITE"
          tar -xf "$ARCHIVE" -C "$SITE"
          test -s "$SITE/index.html"
          test -s "$SITE/app/index.html"
          test -s "$SITE/vendor/three.module.js"
          test -s "$SITE/landing.js"
          test -s "$SITE/app.js"
          cp "$SITE/landing.js" "$RUNNER_TEMP/bp-landing.before.js"
          cp "$SITE/app.js" "$RUNNER_TEMP/bp-app.before.js"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          site=Path(os.environ['RUNNER_TEMP'])/'bp-site'
          targets={'index.html','app/index.html','landing.js','app.js','bridgepoint-neo-watch-v1.js','bridgepoint-welcome-space-v6260.js','bridgepoint-app-space-explorer-v1.js','bridgepoint-gaia-galaxy-v6270.js','nea_extended.json.gz'}
          def digest(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return h.hexdigest()
          before={}
          for path in sorted(site.rglob('*')):
              if path.is_file():
                  rel=path.relative_to(site).as_posix()
                  if rel not in targets: before[rel]=digest(path)
          tmp=Path(os.environ['RUNNER_TEMP'])
          (tmp/'bp-neo-preservation-before.json').write_text(json.dumps(before,sort_keys=True))
          for rel in ('index.html','app/index.html'):
              path=site/rel
              html=path.read_text(encoding='utf-8')
              if '</body>' not in html.lower(): raise SystemExit(rel+' has no closing body tag')
              if 'id="bpPublicScansImportMapV1"' not in html:
                  raise SystemExit(rel+' is missing the preserved Three.js import map for the existing 3D scan viewer')
              (tmp/(rel.replace('/','-')+'.before.html')).write_text(html,encoding='utf-8')
          print('UNRELATED_PRODUCTION_FILES_FINGERPRINTED',len(before))
          PY

      - name: Download the daily Minor Planet Center near-Earth orbit catalogue
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bp-neo-orbits"
          curl --retry 6 --retry-all-errors --retry-delay 3 --max-time 120 -fSL \
            -H 'User-Agent: BridgePoint Intelligence NEO Watch 1.5.2 (https://bridgepointintelligence.online)' \
            'https://minorplanetcenter.net/Extended_Files/nea_extended.json.gz' \
            -o "$RUNNER_TEMP/bp-neo-orbits/nea_extended.json.gz"
          gzip -t "$RUNNER_TEMP/bp-neo-orbits/nea_extended.json.gz"
          python3 - <<'PY'
          import gzip,json,os
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'bp-neo-orbits'/'nea_extended.json.gz'
          with gzip.open(path,'rt',encoding='utf-8') as handle:
              rows=json.load(handle)
          if not isinstance(rows,list) or len(rows)<1000:
              raise SystemExit('MPC near-Earth orbit catalogue is empty or malformed')
          needed={'a','e','i','Node','Peri','M','Epoch'}
          if not any(needed.issubset(set(row)) for row in rows[:100]):
              raise SystemExit('MPC orbit catalogue fields were not recognized')
          if not any(any(row.get(key) for key in ('Principal_desig','Number','Name')) for row in rows[:100]):
              raise SystemExit('MPC object identifier fields were not recognized')
          print('MPC_NEA_ORBITS_READY',len(rows))
          PY

      - name: Add the near-Earth object overlay to production
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/bp-site"
          cp rebuild-v5000/bridgepoint-neo-watch-v1.js "$SITE/bridgepoint-neo-watch-v1.js"
          cp patches/near-earth-object-physical-v1/bridgepoint-welcome-space-v6260.js "$SITE/bridgepoint-welcome-space-v6260.js"
          cp patches/near-earth-object-physical-v1/bridgepoint-gaia-galaxy-v6270.js "$SITE/bridgepoint-gaia-galaxy-v6270.js"
          cp patches/earth-star-occlusion-v6294/bridgepoint-app-space-explorer-v1.js "$SITE/bridgepoint-app-space-explorer-v1.js"
          cp "$RUNNER_TEMP/bp-neo-orbits/nea_extended.json.gz" "$SITE/nea_extended.json.gz"
          python3 - <<'PY'
          import re,os
          from pathlib import Path
          site=Path(os.environ['RUNNER_TEMP'])/'bp-site'
          script='<script type="module" src="/bridgepoint-neo-watch-v1.js?v=1.5.2"></script>'
          module=Path('rebuild-v5000/bridgepoint-neo-watch-v1.js').read_text(encoding='utf-8')
          welcome=Path('patches/near-earth-object-physical-v1/bridgepoint-welcome-space-v6260.js').read_text(encoding='utf-8')
          app=Path('patches/earth-star-occlusion-v6294/bridgepoint-app-space-explorer-v1.js').read_text(encoding='utf-8')
          gaia=Path('patches/near-earth-object-physical-v1/bridgepoint-gaia-galaxy-v6270.js').read_text(encoding='utf-8')
          landing_before=Path(os.environ['RUNNER_TEMP'])/'bp-landing.before.js'
          app_before=Path(os.environ['RUNNER_TEMP'])/'bp-app.before.js'
          cloud_call=re.compile(r"(?m)^[ \t]*void window\.__BP_ACTIVATE_CLOUDS__\(\)\.catch\(e=>console\.warn\('BridgePoint (?:mobile )?always-on 3D clouds unavailable',e\)\);[ \t]*$")
          cloud_comment='/* Synthetic 3D cloud-volume auto-start disabled. */'
          for name,expected in (('landing.js',2),('app.js',1)):
              path=site/name
              before=path.read_text(encoding='utf-8')
              original=landing_before.read_text(encoding='utf-8') if name=='landing.js' else app_before.read_text(encoding='utf-8')
              if before!=original: raise SystemExit(name+' changed before the focused cloud patch')
              after,count=cloud_call.subn(cloud_comment,before)
              if count!=expected: raise SystemExit(name+' expected '+str(expected)+' automatic procedural-cloud starts; found '+str(count))
              if cloud_call.search(after): raise SystemExit(name+' still auto-starts procedural 3D clouds')
              path.write_text(after,encoding='utf-8')
          required=('#bpv-dock-actions','bpv-v2-tool-button','function openPanel()','function ensureSharedSpace()','function buildSpaceObjects()','function rawRelativePositionAU','function displayPosition','new THREE.CatmullRomCurve3(pathPoints, true','full 3D nominal orbits','heliocentric ? objectHeliocentric','window.__BP_NEO_SIMULATION_TIME_V1__','setBearing?.(bearing)','DecompressionStream','MPC_FILE','Principal_desig','Other_desigs','SPACE OBJECT TRACKING','data-neo-icons','data-neo-action="playpause"','NASA_FEED','nea_extended.json.gz','import * as THREE from')
          if not all(token in module for token in required):
              raise SystemExit('Overlay is missing its NASA feed, shared-space orbit paths, or object controls')
          if 'gold rods' in module.lower() or 'missRod' in module or 'approachCurve' in module or 'new THREE.WebGLRenderer' in module:
              raise SystemExit('Overlay must use long shared-space orbits without a separate, misleading Earth-impact scene')
          for token in ('getScene(){return scene}','getCamera(){return camera}','loadSolarCosmos(){return ensureSolarCosmos()}','focusSpaceOverview','focusHeliocentricOverview','setNearEarthOrbitMode','focusSpacePoint'):
              if token not in welcome: raise SystemExit('Welcome scene is missing shared-space camera access: '+token)
          if 'getFrame(){return applyFrame()}' not in gaia or 'eclipticJ2000ToGalactic' not in gaia or 'setNearEarthTrackingMode' not in gaia or 'heliocentric:nearEarthTracking' not in gaia or 'const earthPositionAU=earthHelio;' not in gaia or 'mesh.position.copy(position).multiplyScalar(auScale);' not in gaia or 'orbitScaleRoot.quaternion.identity();' not in gaia: raise SystemExit('Gaia heliocentric positions are not in the shared galactic frame; Earth/planet coordinates must not be transformed twice')
          physical_scale_tokens=('const displayAUScale=aspect<.72?.18:aspect<1?.30:.40','earthAnchor.scale.setScalar(auScale*EARTH_RADIUS_KM/KM_AU)','mesh.scale.setScalar(nearEarthTracking?auScale*EARTH_RADIUS_KM/KM_AU:1)','saturnController?.systemRoot?.scale.setScalar(heliocentricBodyScale)','marsController?.systemRoot?.scale.setScalar(heliocentricBodyScale)','return new THREE.Vector3(...eclToGal(x,y,z,23.439291*DEG));','f.heliocentric?p:p.applyQuaternion')
          if not all(token in gaia for token in physical_scale_tokens): raise SystemExit('Planets are not sharing physical AU positions, sizes, and an aligned ecliptic frame')
          if 'Disabled synthetic welcome weather atmosphere' not in welcome or 'weatherGroup.visible = false;' not in welcome or 'earthDepthOccluder.getWorldScale(new THREE.Vector3()).x' not in welcome or 'syncHeliocentricSunScale' not in welcome or 'bridgepoint-gaia-galaxy-v6270.js?v=6311-physical-heliocentric-scale' not in welcome: raise SystemExit('Welcome view is missing physical Earth/Sun scale or disabled synthetic cloud volumes')
          if 'const orbitCompression=nearEarthOrbitMode?1:' not in welcome: raise SystemExit('The Moon is not at its true Earth-relative distance in heliocentric view')
          if 'const toGalactic = frame?.eclipticJ2000ToGalactic' not in module or 'frame?.heliocentric ? objectHeliocentric' not in module: raise SystemExit('MPC heliocentric positions are not converted into BridgePoint galactic coordinates')
          if 'v6310-physical-heliocentric-scale-cloud-off' not in app or 'focusGlobalMapForSpace' not in app or 'earthProjection.radiusPx' not in app:
              raise SystemExit('Signed-in space persistence is missing')
          for rel in ('index.html','app/index.html'):
              path=site/rel
              html=path.read_text(encoding='utf-8')
              html=re.sub(r'<script type="module" src="/bridgepoint-neo-watch-v1\.js[^\"]*"></script>\s*','',html,flags=re.I)
              if html.count('id="bpPublicScansImportMapV1"')!=1: raise SystemExit(rel+' must preserve one Three.js import map')
              welcome_pattern=r'(src=["\'][^"\']*bridgepoint-welcome-space-v6260\.js)(?:\?[^"\']*)?(["\'])'
              html,welcome_n=re.subn(welcome_pattern,r'\1?v=v6410-physical-heliocentric-scale-cloud-off\2',html,flags=re.I)
              if welcome_n>1: raise SystemExit(rel+' has duplicate shared-space renderer references')
              if rel=='index.html' and welcome_n!=1: raise SystemExit('index.html must keep its welcome space renderer')
              app_deferred_pattern=r'(data-bp-deferred-src=["\'][^"\']*bridgepoint-app-space-explorer-v1\.js)(?:\?[^"\']*)?(["\'])'
              html,app_deferred_n=re.subn(app_deferred_pattern,r'\1?v=v6310-physical-heliocentric-scale-cloud-off\2',html,flags=re.I)
              if app_deferred_n>1: raise SystemExit(rel+' has duplicate deferred signed-in space loaders')
              if app_deferred_n==0:
                  app_script_pattern=re.compile(r'<script\b(?=[^>]*\bsrc=["\'][^"\']*bridgepoint-app-space-explorer-v1\.js)[^>]*>.*?</script>',re.I|re.S)
                  app_scripts=list(app_script_pattern.finditer(html))
                  if len(app_scripts)>1: raise SystemExit(rel+' has duplicate signed-in space scripts')
                  if app_scripts:
                      tag=app_scripts[0].group(0)
                      updated=re.sub(r'(src=["\'][^"\']*bridgepoint-app-space-explorer-v1\.js)(?:\?[^"\']*)?(["\'])',r'\1?v=v6310-physical-heliocentric-scale-cloud-off\2',tag,flags=re.I)
                      html=html[:app_scripts[0].start()]+updated+html[app_scripts[0].end():]
                  else:
                      app_script='<script src="/bridgepoint-app-space-explorer-v1.js?v=v6310-physical-heliocentric-scale-cloud-off"></script>'
                      html=re.sub(r'</body>',app_script+'\n</body>',html,flags=re.I,count=1)
              html=re.sub(r'</body>',script+'\n</body>',html,flags=re.I,count=1)
              if html.count(script)!=1: raise SystemExit(rel+' must load exactly one near-Earth object overlay')
              cloud_key='cloudsv=6511-no-procedural-3d-clouds'
              html=re.sub(r'cloudsv=[^&"\']+',cloud_key,html)
              entry_asset='landing.js' if rel=='index.html' else 'app.js'
              entry_pattern=re.compile(r'(\bsrc=["\'][^"\']*?'+re.escape(entry_asset)+r')(?:\?([^"\']*))?(["\'])',re.I)
              def add_entry_cache(match):
                  query=match.group(2) or ''
                  query=re.sub(r'(^|&)cloudsv=[^&]*','',query)
                  query=re.sub(r'&&+','&',query).strip('&')
                  query=(query+'&' if query else '')+cloud_key
                  return match.group(1)+'?'+query+match.group(3)
              html,entry_count=entry_pattern.subn(add_entry_cache,html)
              if entry_count!=1: raise SystemExit(rel+' must have exactly one '+entry_asset+' entry script')
              if cloud_key not in html: raise SystemExit(rel+' did not receive the procedural-cloud cache bust')
              path.write_text(html,encoding='utf-8')
          print('NEAR_EARTH_OBJECT_OVERLAY_ADDED_AND_SIGNED_IN_SPACE_LOADER_PRESERVED')
          PY
          node --input-type=module --check < rebuild-v5000/bridgepoint-neo-watch-v1.js
          node --input-type=module --check < patches/near-earth-object-physical-v1/bridgepoint-welcome-space-v6260.js
          node --input-type=module --check < patches/near-earth-object-physical-v1/bridgepoint-gaia-galaxy-v6270.js
          node --check < patches/earth-star-occlusion-v6294/bridgepoint-app-space-explorer-v1.js

      - name: Prove unrelated production files and entrypoint content are preserved
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          tmp=Path(os.environ['RUNNER_TEMP']); site=tmp/'bp-site'
          before=json.loads((tmp/'bp-neo-preservation-before.json').read_text())
          cloud_call=re.compile(r"(?m)^[ \t]*void window\.__BP_ACTIVATE_CLOUDS__\(\)\.catch\(e=>console\.warn\('BridgePoint (?:mobile )?always-on 3D clouds unavailable',e\)\);[ \t]*$")
          cloud_comment='/* Synthetic 3D cloud-volume auto-start disabled. */'
          targets={'index.html','app/index.html','landing.js','app.js','bridgepoint-neo-watch-v1.js','bridgepoint-welcome-space-v6260.js','bridgepoint-app-space-explorer-v1.js','bridgepoint-gaia-galaxy-v6270.js','nea_extended.json.gz'}
          def digest(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return h.hexdigest()
          after={}
          for path in site.rglob('*'):
              if path.is_file():
                  rel=path.relative_to(site).as_posix()
                  if rel not in targets: after[rel]=digest(path)
          if before!=after:
              raise SystemExit('UNRELATED_PRODUCTION_FILE_CHANGE '+json.dumps({'missing':sorted(set(before)-set(after))[:20],'added':sorted(set(after)-set(before))[:20],'changed':sorted(k for k in before.keys() & after.keys() if before[k]!=after[k])[:20]}))
          for rel in ('index.html','app/index.html'):
              prior=(tmp/(rel.replace('/','-')+'.before.html')).read_text(encoding='utf-8')
              current=(site/rel).read_text(encoding='utf-8')
              def normalize(s):
                  s=re.sub(r'<script type="module" src="/bridgepoint-neo-watch-v1\.js[^\"]*"></script>\s*','',s,flags=re.I)
                  s=re.sub(r'<script\b[^>]*\bsrc=["\'][^"\']*bridgepoint-welcome-space-v6260\.js[^"\']*["\'][^>]*>\s*</script>\s*','',s,flags=re.I)
                  s=re.sub(r'<script\b[^>]*\bsrc=["\'][^"\']*bridgepoint-app-space-explorer-v1\.js[^"\']*["\'][^>]*>\s*</script>\s*','',s,flags=re.I)
                  s=re.sub(r'(data-bp-deferred-src=["\'][^"\']*bridgepoint-app-space-explorer-v1\.js)(?:\?[^"\']*)?(["\'])',r'\1?APP\2',s,flags=re.I)
                  s=re.sub(r'([?&])cloudsv=[^&"\']*','',s)
                  s=s.replace('?&','?').replace('&&','&')
                  s=re.sub(r'\?([\'"])',r'\1',s)
                  return s
              if normalize(prior)!=normalize(current): raise SystemExit(rel+' changed outside the NEO, shared-space and cloud-cache references')
              if current.count('bridgepoint-neo-watch-v1.js?v=1.5.2')!=1: raise SystemExit(rel+' does not load exactly one new overlay')
              if 'bridgepoint-app-space-explorer-v1.js?v=v6310-physical-heliocentric-scale-cloud-off' not in current: raise SystemExit(rel+' does not load signed-in space persistence')
              if rel=='index.html' and 'bridgepoint-welcome-space-v6260.js?v=v6410-physical-heliocentric-scale-cloud-off' not in current: raise SystemExit('index.html does not load the updated shared-space renderer')
              if 'cloudsv=6511-no-procedural-3d-clouds' not in current: raise SystemExit(rel+' did not update the entrypoint cache key')
          for name,expected in (('landing.js',2),('app.js',1)):
              prior=(tmp/('bp-'+name.replace('.js','.before.js'))).read_text(encoding='utf-8')
              current=(site/name).read_text(encoding='utf-8')
              wanted,count=cloud_call.subn(cloud_comment,prior)
              if count!=expected or wanted!=current or cloud_call.search(current):
                  raise SystemExit(name+' changed beyond disabling its expected automatic cloud-volume starts')
          print('NON_TARGET_PRODUCTION_FILES_BYTE_FOR_BYTE_PRESERVED',len(before))
          print('ENTRYPOINT_CHANGES_LIMITED_TO_NEO_SHARED_SPACE_AND_CLOUD_CACHE_REFERENCES')
          PY

      - uses: actions/configure-pages@v5

      - name: Upload preserved production with near-Earth object watch
        uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-v5000-${{ github.run_attempt }}
          path: "${{ runner.temp }}/bp-site"
          include-hidden-files: true

      - name: Publish the preserved production snapshot
        id: deployment
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: node scripts/deploy-pages-extended.mjs

      - name: Verify the overlay on the live site
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://bridgepointintelligence.online'
          DIR="$RUNNER_TEMP/bp-neo-live"
          mkdir -p "$DIR"
          curl --retry 7 --retry-all-errors --retry-delay 3 --max-time 35 -fsSL -H 'Cache-Control: no-cache' "$ORIGIN/?verify=$GITHUB_SHA-neo-watch" -o "$DIR/root.html"
          curl --retry 7 --retry-all-errors --retry-delay 3 --max-time 35 -fsSL -H 'Cache-Control: no-cache' "$ORIGIN/app/?verify=$GITHUB_SHA-neo-watch" -o "$DIR/app.html"
          curl --retry 7 --retry-all-errors --retry-delay 3 --max-time 35 -fsSL -H 'Cache-Control: no-cache' "$ORIGIN/bridgepoint-neo-watch-v1.js?verify=$GITHUB_SHA-neo-watch" -o "$DIR/neo.js"
          curl --retry 7 --retry-all-errors --retry-delay 3 --max-time 35 -fsSL -H 'Cache-Control: no-cache' "$ORIGIN/bridgepoint-welcome-space-v6260.js?verify=$GITHUB_SHA-space" -o "$DIR/welcome.js"
          curl --retry 7 --retry-all-errors --retry-delay 3 --max-time 35 -fsSL -H 'Cache-Control: no-cache' "$ORIGIN/bridgepoint-app-space-explorer-v1.js?verify=$GITHUB_SHA-app-space" -o "$DIR/app-space.js"
          curl --retry 7 --retry-all-errors --retry-delay 3 --max-time 35 -fsSL -H 'Cache-Control: no-cache' "$ORIGIN/bridgepoint-gaia-galaxy-v6270.js?verify=$GITHUB_SHA-gaia" -o "$DIR/gaia.js"
          curl --retry 7 --retry-all-errors --retry-delay 3 --max-time 35 -fsSL -H 'Cache-Control: no-cache' "$ORIGIN/landing.js?verify=$GITHUB_SHA-clouds" -o "$DIR/landing.js"
          curl --retry 7 --retry-all-errors --retry-delay 3 --max-time 35 -fsSL -H 'Cache-Control: no-cache' "$ORIGIN/app.js?verify=$GITHUB_SHA-clouds" -o "$DIR/app.js"
          curl --retry 7 --retry-all-errors --retry-delay 3 --max-time 60 -fsSL -H 'Cache-Control: no-cache' "$ORIGIN/nea_extended.json.gz?verify=$GITHUB_SHA-mpc" -o "$DIR/nea_extended.json.gz"
          gzip -t "$DIR/nea_extended.json.gz"
          cmp -s "$DIR/neo.js" rebuild-v5000/bridgepoint-neo-watch-v1.js
          cmp -s "$DIR/welcome.js" patches/near-earth-object-physical-v1/bridgepoint-welcome-space-v6260.js
          cmp -s "$DIR/app-space.js" patches/earth-star-occlusion-v6294/bridgepoint-app-space-explorer-v1.js
          cmp -s "$DIR/gaia.js" patches/near-earth-object-physical-v1/bridgepoint-gaia-galaxy-v6270.js
          cmp -s "$DIR/landing.js" "$RUNNER_TEMP/bp-site/landing.js"
          cmp -s "$DIR/app.js" "$RUNNER_TEMP/bp-site/app.js"
          python3 - "$DIR" <<'PY'
          import re,sys
          from pathlib import Path
          for name in ('landing.js','app.js'):
              text=(Path(sys.argv[1])/name).read_text(encoding='utf-8')
              if re.search(r"(?m)^[ \t]*void window\.__BP_ACTIVATE_CLOUDS__\(\)\.catch\(e=>console\.warn\('BridgePoint (?:mobile )?always-on 3D clouds unavailable',e\)\);[ \t]*$",text):
                  raise SystemExit(name+' still automatically starts procedural 3D clouds')
          print('AUTOMATIC_PROCEDURAL_3D_CLOUD_STARTS_DISABLED')
          PY
          for route in root app; do
            grep -Fq 'bridgepoint-neo-watch-v1.js?v=1.5.2' "$DIR/$route.html"

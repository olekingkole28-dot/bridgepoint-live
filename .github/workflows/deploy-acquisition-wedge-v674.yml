name: Deploy BridgePoint Single Publisher V683

on:
  push:
    branches: [main]
    paths:
      - sample/**
      - pilot/**
      - contact/**
      - experience/capabilities.html
      - experience/app-technology.html
      - experience/owner-everything-v623.js
      - experience/owner-completion-v590.html
      - growth/**
      - claim-guide/**
      - founder/**
      - answers/**
      - press/**
      - start-now/**
      - partners/**
      - commerce/**
      - free-tools/**
      - acquisition_tracker.js
      - articles/index.html
      - articles/feed.xml
      - articles/atom.xml
      - articles/feed.json
      - articles/data.json
      - articles/datapackage.json
      - articles/dcat.ttl
      - articles/ct-opportunity-aggregates.csv
      - articles/bridgepoint-facts.json
      - articles/bridgepoint-connecticut-property-intelligence-pulse-2026-08-23.html
      - articles/auto/**
      - llms.txt
      - llms-full.txt
      - robots.txt
      - sitemap.xml
      - scripts/generate_ct_market_pages.py
      - enterprise/**
      - research/national-estimate-variance/**
      - tools/**
      - start/**
      - audit/**
      - estimate-preflight/**
      - developers/**
      - storms/**
      - owner/global/**
      - owner/distribution/**
      - owner/innovation/**
      - downloads/backup/**
      - .well-known/**
      - .github/workflows/deploy-acquisition-wedge-v674.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble current durable BridgePoint release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site && mkdir site
          git archive --format=tar origin/live-artifact | tar -xf - -C site

          test -s site/app/bridgepoint-release.json
          test -s site/app/public-promotion-v682.json
          test -s site/app/main.dart.js
          test -s sample/index.html
          test -s pilot/index.html
          test -s contact/index.html
          test -s experience/capabilities.html
          test -s experience/app-technology.html
          test -s experience/owner-everything-v623.js
          test -s experience/owner-completion-v590.html
          test -s enterprise/trust/index.html
          test -s .well-known/security.txt
          test -s downloads/backup/bridgepoint_local_runner.py
          test -s scripts/generate_ct_market_pages.py

          for d in sample pilot contact growth claim-guide enterprise tools start audit estimate-preflight developers storms founder answers press start-now partners commerce free-tools; do
            test -d "$d"
            rm -rf "site/$d"
            cp -a "$d" "site/$d"
          done
          cp acquisition_tracker.js site/acquisition_tracker.js
          cp llms.txt llms-full.txt robots.txt sitemap.xml site/

          rm -rf site/research/national-estimate-variance
          mkdir -p site/research/national-estimate-variance
          cp -a research/national-estimate-variance/. site/research/national-estimate-variance/

          mkdir -p site/articles
          for file in index.html feed.xml atom.xml feed.json data.json datapackage.json dcat.ttl ct-opportunity-aggregates.csv bridgepoint-facts.json bridgepoint-connecticut-property-intelligence-pulse-2026-08-23.html; do
            test -s "articles/$file"
            cp "articles/$file" "site/articles/$file"
          done
          if [ -d articles/auto ]; then
            rm -rf site/articles/auto
            mkdir -p site/articles/auto
            cp -a articles/auto/. site/articles/auto/
          fi

          mkdir -p site/capabilities site/app/technology site/owner site/owner/completion site/downloads/backup site/.well-known
          cp experience/capabilities.html site/capabilities/index.html
          cp experience/app-technology.html site/app/technology/index.html
          cp experience/owner-everything-v623.js site/owner/everything-v623.js
          cp experience/owner-completion-v590.html site/owner/completion/index.html
          for d in global distribution innovation; do
            rm -rf "site/owner/$d"
            cp -a "owner/$d" "site/owner/$d"
          done
          rm -rf site/downloads/backup
          mkdir -p site/downloads/backup
          cp -a downloads/backup/. site/downloads/backup/
          rm -rf site/.well-known
          cp -a .well-known site/.well-known

          python scripts/generate_ct_market_pages.py site
          python -m py_compile site/downloads/backup/bridgepoint_local_runner.py
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re

          release_path=Path('site/app/bridgepoint-release.json')
          promotion_path=Path('site/app/public-promotion-v682.json')
          app_js=Path('site/app/main.dart.js')
          release=json.loads(release_path.read_text(encoding='utf-8'))
          promotion=json.loads(promotion_path.read_text(encoding='utf-8'))
          if release.get('version') != promotion.get('compiled_source_sha'):
              raise SystemExit('Compiled app source SHA does not match promotion receipt.')
          actual=hashlib.sha256(app_js.read_bytes()).hexdigest()
          if actual != promotion.get('main_js_sha256'):
              raise SystemExit('Compiled app digest does not match promotion receipt.')
          if release.get('version') in {653, '653'} or promotion.get('compiled_source_sha') in {444, '444'}:
              raise SystemExit('Obsolete V444/V653 app regression blocked.')
          if promotion.get('source_repo_private') is not True:
              raise SystemExit('Private-source provenance guard failed.')

          home=Path('site/index.html')
          s=home.read_text(encoding='utf-8')
          required=['Know where to work before you knock.','Show me my territory — free','bp-acquisition-wedge-v681']
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('Acquisition wedge missing: '+repr(missing))
          if 'href="/enterprise/trust/"' not in s:
              s=s.replace('<a href="/contact/">Contact</a>','<a href="/enterprise/trust/">Trust Center</a><a href="/contact/">Contact</a>',1)
          home.write_text(s,encoding='utf-8')

          owner=Path('site/owner/index.html')
          os=owner.read_text(encoding='utf-8')
          tag='<script src="/owner/everything-v623.js?v=623"></script>'
          if tag not in os:
              if '</body>' not in os:
                  raise SystemExit('Owner Center missing body close')
              os=os.replace('</body>',tag+'\n</body>',1)
          owner.write_text(os,encoding='utf-8')

          authored=[Path('site/index.html'),Path('site/sample/index.html'),Path('site/pilot/index.html'),Path('site/contact/index.html'),Path('site/enterprise/trust/index.html'),Path('site/.well-known/security.txt'),Path('site/capabilities/index.html'),Path('site/app/technology/index.html'),Path('site/owner/everything-v623.js'),Path('site/owner/completion/index.html')]
          authored += [f for f in Path('site/downloads/backup').iterdir() if f.is_file() and f.suffix.lower() in {'.ps1','.py','.bat','.txt'}]
          pats=[
            re.compile(r'(?i)(SUPABASE_SERVICE_ROLE_KEY|STRIPE_SECRET_KEY|OPENAI_API_KEY)\s*=\s*["\']?[^\s"\']{12,}'),
            re.compile(r'(?i)sb_secret_[A-Za-z0-9_-]{20,}'),
            re.compile(r'(?i)sk_live_[A-Za-z0-9_-]{20,}'),
            re.compile(r'(?i)sk-proj-[A-Za-z0-9_-]{20,}')]
          for f in authored:
              text=f.read_text(encoding='utf-8',errors='ignore')
              if any(p.search(text) for p in pats):
                  raise SystemExit('Privileged secret-shaped value found in '+str(f))
          PY

          grep -q '<base href="/app/">' site/app/index.html
          grep -q 'Show my free opportunities' site/sample/index.html
          grep -q 'Buy this territory report — \$49 once' site/sample/index.html
          grep -q 'Prove BridgePoint beside the workflow you already use' site/pilot/index.html
          grep -q 'independent Connecticut-based property-intelligence software platform' site/contact/index.html
          grep -q 'Everything BridgePoint Can Do' site/capabilities/index.html
          grep -q 'Everything BridgePoint' site/app/technology/index.html
          grep -q 'Everything BridgePoint in one place' site/owner/everything-v623.js
          grep -q 'Master Completion' site/owner/completion/index.html
          grep -q 'Public Trust Center' site/enterprise/trust/index.html
          grep -q 'Kole Johnson' site/founder/index.html
          grep -q 'Founding Performance Partners' site/partners/index.html
          grep -q 'BP-HOME-MONTHLY' site/commerce/openai-products.csv
          grep -q 'Free Property Intelligence Snapshot' site/free-tools/index.html
          grep -q 'bp_referral_v670' site/acquisition_tracker.js
          grep -q 'Connecticut Property Intelligence Pulse' site/articles/feed.xml
          test -s site/connecticut/middletown/index.html
          test -s site/connecticut/hartford/index.html
          test -s site/connecticut/market-counts.json
          grep -q 'connecticut/middletown/' site/sitemap.xml
          if [ -d site/articles/auto ]; then
            test -s site/articles/auto/index.html
            test -s site/articles/auto/feed.xml
            test -s site/articles/auto/sitemap.xml
            test -s site/articles/auto/manifest.json
          fi
          grep -q 'Canonical: https://bridgepointintelligence.online/.well-known/security.txt' site/.well-known/security.txt
          grep -q 'BridgePoint State Export Wizard' site/downloads/backup/BridgePoint_State_Export_Wizard.bat
          grep -q '127.0.0.1' site/downloads/backup/bridgepoint_local_runner.py
          grep -q 'Production BridgePoint database is blocked' site/downloads/backup/bridgepoint_restore_wizard.ps1
          if grep -R -E -i 'SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=|sb_secret_|OPENAI_API_KEY[[:space:]]*=|ANTHROPIC_API_KEY[[:space:]]*=|sk-proj-|sk-ant-|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' site/founder site/answers site/press site/start-now site/partners site/commerce site/free-tools site/llms.txt site/llms-full.txt site/articles; then
            echo 'Privileged secret marker found in discovery surfaces.' >&2
            exit 1
          fi
          touch site/.nojekyll site/app/.nojekyll

      - name: Persist exact V683 durable artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/final-live && mkdir /tmp/final-live
          cp -a site/. /tmp/final-live/
          cd /tmp/final-live
          git init -q
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m 'BridgePoint V683 guarded single-publisher release'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish V683
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live release
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            'https://bridgepointintelligence.online/' \
            'https://bridgepointintelligence.online/app/bridgepoint-release.json' \
            'https://bridgepointintelligence.online/app/public-promotion-v682.json' \
            'https://bridgepointintelligence.online/enterprise/trust/' \
            'https://bridgepointintelligence.online/contact/' \
            'https://bridgepointintelligence.online/capabilities/' \
            'https://bridgepointintelligence.online/founder/' \
            'https://bridgepointintelligence.online/answers/' \
            'https://bridgepointintelligence.online/press/' \
            'https://bridgepointintelligence.online/partners/' \
            'https://bridgepointintelligence.online/commerce/' \
            'https://bridgepointintelligence.online/free-tools/' \
            'https://bridgepointintelligence.online/articles/feed.xml' \
            'https://bridgepointintelligence.online/connecticut/' \
            'https://bridgepointintelligence.online/connecticut/middletown/' \
            'https://bridgepointintelligence.online/connecticut/hartford/'; do
            code="$(curl -L -sS --retry 6 --retry-delay 3 -o /tmp/page -w '%{http_code}' "$url" || true)"
            echo "$url -> $code"
            test "$code" = "200"
          done

          curl -fsSL --retry 10 --retry-delay 3 'https://bridgepointintelligence.online/' -o /tmp/v683-home
          curl -fsSL --retry 10 --retry-delay 3 'https://bridgepointintelligence.online/app/bridgepoint-release.json' -o /tmp/v683-release
          curl -fsSL --retry 10 --retry-delay 3 'https://bridgepointintelligence.online/app/public-promotion-v682.json' -o /tmp/v683-promotion
          curl -fsSL --retry 10 --retry-delay 3 'https://bridgepointintelligence.online/free-tools/' -o /tmp/v683-free-tools
          curl -fsSL --retry 10 --retry-delay 3 'https://bridgepointintelligence.online/acquisition_tracker.js' -o /tmp/v683-tracker
          curl -fsSL --retry 10 --retry-delay 3 'https://bridgepointintelligence.online/connecticut/middletown/' -o /tmp/v683-middletown
          grep -q 'Know where to work before you knock' /tmp/v683-home
          grep -q '9fd86839adbce02e48d36d893828b0e9cccd7987' /tmp/v683-release
          grep -q '"public_release":682' /tmp/v683-promotion
          grep -q 'Free Property Intelligence Snapshot' /tmp/v683-free-tools
          grep -q 'bp_referral_v670' /tmp/v683-tracker
          grep -qi 'property intelligence' /tmp/v683-middletown

          if [ -d articles/auto ]; then
            curl -fsSL --retry 10 --retry-delay 3 'https://bridgepointintelligence.online/articles/auto/' -o /tmp/v683-auto-index
            curl -fsSL --retry 10 --retry-delay 3 'https://bridgepointintelligence.online/articles/auto/feed.xml' -o /tmp/v683-auto-feed
            grep -q '<' /tmp/v683-auto-index
            grep -q '<' /tmp/v683-auto-feed
          fi

name: Building Rowgroup Index v2714
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/building-rowgroup-index-v2714.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: bridgepoint-building-rowgroup-index-v2714
  cancel-in-progress: false
env:
  SUPABASE_URL: https://xdfsjztwgsbmabshzsjw.supabase.co
jobs:
  index:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned index dependencies
        run: python -m pip install --disable-pip-version-check duckdb==1.4.1 requests==2.32.5
      - name: Index exact Parquet row groups
        run: python scripts/index-building-rowgroups-v2714.py --shard ${{ matrix.shard }} --shards 4

name: Release Polished App Entry V941

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-app-entry-v941.yml'
      - 'handoff/public-overlays/podcast-entry-v941.js'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Assemble current durable release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site
          mkdir -p site
          git archive --format=tar origin/live-artifact | tar -xf - -C site
          test -s site/app/index.html
          test -s site/app/main.dart.js
          test -s site/app/assets/assets/brand/bridgepoint-mark-v80.svg
          test -s handoff/public-overlays/podcast-entry-v941.js
          sha256sum site/app/main.dart.js | awk '{print $1}' > /tmp/before-main-sha

      - name: Install polished public app entry
        shell: bash
        run: |
          set -euo pipefail
          cp handoff/public-overlays/podcast-entry-v941.js site/app/podcast-entry-v941.js
          python - <<'PY'
          from pathlib import Path
          p=Path('site/app/index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="podcast-entry-v941.js?v=941"></script>'
          if old not in s:
              marker='<script src="flutter_bootstrap.js" async></script>'
              if marker not in s:
                  raise SystemExit('Flutter bootstrap marker missing')
              s=s.replace(marker,old+'\n  '+marker,1)
          if s.count(old)!=1:
              raise SystemExit('Expected exactly one V941 entry script')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'One platform. State-by-state readiness truth.' site/app/podcast-entry-v941.js
          grep -q 'A lot underneath. A simpler experience on top.' site/app/podcast-entry-v941.js
          grep -q 'bridgepoint-mark-v80.svg' site/app/podcast-entry-v941.js
          grep -q 'bridgepoint_public_expansion_status_v321' site/app/podcast-entry-v941.js
          grep -q 'bridgepoint_public_capability_directory_v735' site/app/podcast-entry-v941.js
          grep -q 'bridgepoint_public_system_status_v320' site/app/podcast-entry-v941.js
          test ! -e site/app/twin-launcher.js
          after="$(sha256sum site/app/main.dart.js | awk '{print $1}')"
          before="$(cat /tmp/before-main-sha)"
          test "$after" = "$before"
          touch site/.nojekyll site/app/.nojekyll

      - name: Persist exact durable live artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bridgepoint-v941-live
          mkdir -p /tmp/bridgepoint-v941-live
          cp -a site/. /tmp/bridgepoint-v941-live/
          cd /tmp/bridgepoint-v941-live
          git init -q
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m 'Publish polished public app entry V941'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live app entry
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://bridgepointintelligence.online'
          for attempt in $(seq 1 24); do
            app="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/?v=941-${attempt}" 2>/dev/null || true)"
            entry="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/podcast-entry-v941.js?v=941-${attempt}" 2>/dev/null || true)"
            brand_code="$(curl -sS -o /tmp/v941-brand.svg -w '%{http_code}' --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/assets/assets/brand/bridgepoint-mark-v80.svg?v=941-${attempt}" 2>/dev/null || true)"
            release="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/bridgepoint-release.json?v=941-${attempt}" 2>/dev/null || true)"
            if printf '%s' "$app" | grep -q 'podcast-entry-v941.js?v=941' \
              && printf '%s' "$app" | grep -q 'flutter_bootstrap.js' \
              && printf '%s' "$entry" | grep -q 'One property. One connected story.' \
              && printf '%s' "$entry" | grep -q 'One platform. State-by-state readiness truth.' \
              && printf '%s' "$entry" | grep -q 'A lot underneath. A simpler experience on top.' \
              && printf '%s' "$entry" | grep -q 'bridgepoint-mark-v80.svg' \
              && [ "$brand_code" = '200' ] \
              && [ "${#release}" -gt 80 ]; then
              echo 'V941 verified live: polished public entry present and compiled Flutter app preserved.'
              exit 0
            fi
            sleep 8
          done
          echo 'V941 public app entry did not converge.' >&2
          exit 1

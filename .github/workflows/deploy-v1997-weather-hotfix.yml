            await p.goto(origin+'/?seed='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});await p.evaluate(()=>localStorage.setItem('sb-xdfsjztwgsbmabshzsjw-auth-token',JSON.stringify({access_token:'fake',refresh_token:'fake',expires_at:Math.floor(Date.now()/1000)+3600,user:{id:'00000000-0000-4000-8000-000000000001',email:'verify@bridgepoint.local'}})));await p.goto(origin+'/app/?surface=map&hotfix='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});await p.waitForFunction(()=>window.__bp97MapState?.ready&&window.__bp97MapState?.map?.getZoom()>14,{timeout:22000});await p.waitForFunction(()=>window.__bp97MapState?.exact?.features?.length===1&&window.__bp97MapState?.buildings?.features?.length===2&&window.__bp97MapState?.hazards?.features?.length===1,{timeout:12000});await p.waitForFunction(()=>window.__bp97MapState?.map?.getLayer('bp97-weather-volume'),{timeout:6000});const s=await p.evaluate(()=>{const x=window.__bp97MapState,m=x.map;return{terrain:!!m.getTerrain(),labels:!!m.getLayer('labels'),exact:!!m.getLayer('bp97-exact-glow'),est:!!m.getLayer('bp97-est-line'),building:!!m.getLayer('bp97-building'),floors:x.floors.features.length,weather:!!m.getLayer('bp97-weather-volume'),particles:x.particles.length,zoom:m.getZoom(),center:m.getCenter().toArray()}});console.log(s);assert(s.terrain&&s.labels&&s.exact&&s.est&&s.building&&s.floors>=18&&s.weather&&s.particles>0&&s.zoom>14);await p.click('[data-bp97measure="distance"]');assert(await p.$eval('[data-bp97measure="distance"]',e=>e.classList.contains('active')));
            const pub=await b.newPage();await pub.setViewport({width:390,height:844,deviceScaleFactor:2,isMobile:true,hasTouch:true});await pub.goto(origin+'/?public='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});await pub.waitForSelector('#bpAbout1997',{timeout:10000});await pub.waitForSelector('#source-record-counter',{timeout:10000});const v=await pub.evaluate(()=>({about:document.querySelector('#bpAbout1997')?.innerText||'',sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth}));assert(/Canonical property foundation/.test(v.about)&&/Live weather \+ hazards/.test(v.about)&&v.sw<=v.cw+2);console.log('V1997_HOTFIX_FULL_PASS');
          }finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});

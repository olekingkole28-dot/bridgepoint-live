name: Horizon V4341 FPS + Year One Source Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/horizon-v2-live-gate.yml'
      - 'scripts/browser-horizon-v2-live.mjs'
      - 'app/horizon-playable/v2-entry.html'
      - 'app/horizon-playable/index.html'
      - 'app/horizon-playable/horizon-v2.js'
      - 'app/horizon-playable/horizon-v2.css'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/horizon-v2-live-gate.yml'
      - 'scripts/browser-horizon-v2-live.mjs'
      - 'app/horizon-playable/v2-entry.html'
      - 'app/horizon-playable/index.html'
      - 'app/horizon-playable/horizon-v2.js'
      - 'app/horizon-playable/horizon-v2.css'
  workflow_dispatch:

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-audit --no-fund playwright-core@1.55.0
      - name: Static checks
        run: |
          set -euo pipefail
          node --check app/horizon-playable/horizon-v2.js
          grep -Fq 'build:4341' app/horizon-playable/horizon-v2.js
          grep -Fq 'function padMove(e)' app/horizon-playable/horizon-v2.js
          grep -Fq "pad.addEventListener('pointercancel',endPad)" app/horizon-playable/horizon-v2.js
          grep -Fq "pad.addEventListener('lostpointercapture',endPad)" app/horizon-playable/horizon-v2.js
          
          grep -Fq 'actualCharacterModel:true' app/horizon-playable/horizon-v2.js
          grep -Fq 'sourceBackedTwin:true' app/horizon-playable/horizon-v2.js
          grep -Fq 'exactFootprintCollision:true' app/horizon-playable/horizon-v2.js
          grep -Fq 'registerSolidPoly(pts)' app/horizon-playable/horizon-v2.js
          grep -Fq 'addParcels()' app/horizon-playable/horizon-v2.js
          grep -Fq 'addBuildingParts()' app/horizon-playable/horizon-v2.js
          grep -Fq 'solidCollision:true' app/horizon-playable/horizon-v2.js
          grep -Fq 'firstPerson:true' app/horizon-playable/horizon-v2.js
          grep -Fq 'proceduralInteriors:true' app/horizon-playable/horizon-v2.js
          grep -Fq 'roofTraversal:true' app/horizon-playable/horizon-v2.js
          grep -Fq 'drivableVehicles:true' app/horizon-playable/horizon-v2.js
          grep -Fq 'weaponInventory:true' app/horizon-playable/horizon-v2.js
          grep -Fq 'infectedPatrols:true' app/horizon-playable/horizon-v2.js
          grep -Fq 'spatialAudio:true' app/horizon-playable/horizon-v2.js
          grep -Fq 'function routeSpatialAudio' app/horizon-playable/horizon-v2.js
          grep -Fq 'function updateAudioListener' app/horizon-playable/horizon-v2.js
          grep -Fq 'adaptivePerformanceGovernor:true' app/horizon-playable/horizon-v2.js
          grep -Fq 'function updatePerformanceGovernor' app/horizon-playable/horizon-v2.js
          grep -Fq 'function perfCadence' app/horizon-playable/horizon-v2.js
          grep -Fq 'id="movePad"' app/horizon-playable/v2-entry.html
          grep -Fq 'id="miniMap"' app/horizon-playable/v2-entry.html
          ! grep -Fq 'id="viewBtn"' app/horizon-playable/v2-entry.html
          grep -Fq "let cameraMode='first'" app/horizon-playable/horizon-v2.js
          grep -Fq "cameraMode='first';localStorage.setItem('horizon-camera-mode','first')" app/horizon-playable/horizon-v2.js
          grep -Fq 'id="contextBtn"' app/horizon-playable/v2-entry.html
          grep -Fq 'id="aimBtn"' app/horizon-playable/v2-entry.html
          grep -Fq 'id="buildBtn"' app/horizon-playable/v2-entry.html
          grep -Fq 'id="healthBar"' app/horizon-playable/v2-entry.html
          grep -Fq 'id="shieldBar"' app/horizon-playable/v2-entry.html
          grep -Fq 'pickupDwellSeconds:3' app/horizon-playable/horizon-v2.js
          grep -Fq "shield=Math.min(100,shield+50)" app/horizon-playable/horizon-v2.js
          grep -Fq "applyPlayerHit(25,z)" app/horizon-playable/horizon-v2.js
          grep -Fq "spawnPolicy:'PERSISTENT_LAST_LOCATION_AFTER_FIRST_ENTRY'" app/horizon-playable/horizon-v2.js
          grep -Fq 'bridgepoint_horizon_year_one_zone_v4340' app/horizon-playable/horizon-v2.js
          grep -Fq 'bridgepoint_horizon_weapon_catalog_v4340' app/horizon-playable/horizon-v2.js
          grep -Fq 'bridgepoint_horizon_death_drop_claim_v4340' app/horizon-playable/horizon-v2.js
          grep -Fq 'bridgepoint_horizon_record_player_kill_v4340' app/horizon-playable/horizon-v2.js
          grep -Fq 'syncFiniteLoot' app/horizon-playable/horizon-v2.js
          grep -Fq 'inventoryWeaponKeys' app/horizon-playable/horizon-v2.js
          grep -Fq 'function buildCampfire' app/horizon-playable/horizon-v2.js
          grep -Fq 'const target=100' app/horizon-playable/horizon-v2.js
          grep -Fq 'id="backpackBar"' app/horizon-playable/v2-entry.html
          grep -Fq 'id="equipmentRail"' app/horizon-playable/v2-entry.html
          grep -Fq 'id="prematchFreeze"' app/horizon-playable/v2-entry.html
          grep -Fq 'bridgepoint_horizon_tdm_loadouts_v4341' app/horizon-playable/horizon-v2.js
          grep -Fq 'bridgepoint_horizon_tdm_fire_zone_v4341' app/horizon-playable/horizon-v2.js
          grep -Fq 'bridgepoint_horizon_tdm_combat_clock_v4341' app/horizon-playable/horizon-v2.js
          grep -Fq 'id="fireUtilityBtn"' app/horizon-playable/v2-entry.html
      - name: Start local source server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/horizon-v4331-http.log 2>&1 &
          sleep 1
      - name: Browser source gate
        env:
          HORIZON_TEST_BASE: http://127.0.0.1:4173
        run: node scripts/browser-horizon-v2-live.mjs

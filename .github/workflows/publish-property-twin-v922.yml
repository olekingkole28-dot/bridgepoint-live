name: Publish BridgePoint Property Visual V937

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-property-twin-v922.yml'
      - 'handoff/public-overlays/twin/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  publish-property-visual:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public overlay source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Assemble current live artifact without global Twin launcher
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site
          mkdir -p site
          git archive --format=tar origin/live-artifact | tar -xf - -C site

          test -s site/app/index.html
          test -s site/app/main.dart.js
          test -s site/.well-known/security.txt
          test -f site/.nojekyll
          test -f site/app/.nojekyll
          test -s handoff/public-overlays/twin/index.html

          mkdir -p site/app/twin
          cp handoff/public-overlays/twin/index.html site/app/twin/index.html
          rm -f site/app/twin-launcher.js

          python - <<'PY'
          from pathlib import Path
          import json
          import re

          index = Path('site/app/index.html')
          html = index.read_text(encoding='utf-8')
          html = re.sub(
              r'\s*<script[^>]+src=["\'][^"\']*twin-launcher\.js[^"\']*["\'][^>]*>\s*</script>\s*',
              '\n  ',
              html,
              flags=re.IGNORECASE,
          )
          if 'twin-launcher.js' in html:
              raise SystemExit('Global Property Twin launcher reference survived removal')
          if 'flutter_bootstrap.js' not in html:
              raise SystemExit('Flutter bootstrap host marker missing')
          index.write_text(html, encoding='utf-8')

          twin = Path('site/app/twin/index.html').read_text(encoding='utf-8')
          if 'bridgepoint_property_twin_v918' not in twin:
              raise SystemExit('V918 Property Twin RPC marker missing')
          if 'bridgepoint_property_suggestions_v192' not in twin:
              raise SystemExit('Property search RPC marker missing')
          if 'SUPABASE_SERVICE_ROLE_KEY' in twin or 'service_role' in twin.lower():
              raise SystemExit('Forbidden privileged credential marker in public Twin')
          if 'sb_publishable_' not in twin:
              raise SystemExit('Public Supabase publishable key marker missing')

          release = {
              'version': 937,
              'surface': 'property-visual-context',
              'backend_contract': 'bridgepoint_property_twin_v918',
              'search_contract': 'bridgepoint_property_suggestions_v192',
              'views': ['front','aerial_current','structure_3d','aerial_history'],
              'global_floating_launcher': False,
              'navigation_contract': 'PROPERTY_CONTEXT_ONLY',
              'structure_3d_truth': 'SOURCE_BACKED_GEOMETRY_NOT_PHOTOREALISTIC_IMAGERY',
              'auth': 'supabase-user-session-rls',
              'source_repo_private': True,
              'private_source_exposed': False,
              'compatibility_route': '/app/twin/'
          }
          Path('site/app/property-twin-release-v922.json').write_text(
              json.dumps(release, indent=2) + '\n', encoding='utf-8'
          )
          PY

          ! grep -q 'twin-launcher.js' site/app/index.html
          test ! -e site/app/twin-launcher.js
          grep -q 'Property Twin' site/app/twin/index.html
          grep -q '"global_floating_launcher": false' site/app/property-twin-release-v922.json
          touch site/.nojekyll site/app/.nojekyll

      - name: Persist durable live artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bridgepoint-final-live
          mkdir -p /tmp/bridgepoint-final-live
          cp -a site/. /tmp/bridgepoint-final-live/
          cd /tmp/bridgepoint-final-live
          git init -q
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m 'Remove global Property Twin launcher V937'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build Pages artifact including hidden operational paths
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --dereference --hard-dereference \
            --directory site \
            -cf "$RUNNER_TEMP/bridgepoint-pages-v937.tar" \
            --exclude=.git \
            --exclude=.github \
            .
          tar -tf "$RUNNER_TEMP/bridgepoint-pages-v937.tar" > "$RUNNER_TEMP/bridgepoint-pages-v937.list"
          grep -Fxq './.well-known/security.txt' "$RUNNER_TEMP/bridgepoint-pages-v937.list"
          grep -Fxq './.nojekyll' "$RUNNER_TEMP/bridgepoint-pages-v937.list"
          grep -Fxq './app/.nojekyll' "$RUNNER_TEMP/bridgepoint-pages-v937.list"
          grep -Fxq './app/twin/index.html' "$RUNNER_TEMP/bridgepoint-pages-v937.list"
          ! grep -Fxq './app/twin-launcher.js' "$RUNNER_TEMP/bridgepoint-pages-v937.list"

      - name: Upload Pages artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/bridgepoint-pages-v937.tar
          retention-days: 1
          if-no-files-found: error

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify launcher removal and Property compatibility route live
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://bridgepointintelligence.online'
          for attempt in $(seq 1 24); do
            app="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/?v=937-${attempt}" 2>/dev/null || true)"
            twin="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/twin/?v=937-${attempt}" 2>/dev/null || true)"
            release="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/property-twin-release-v922.json?v=937-${attempt}" 2>/dev/null || true)"
            security="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/.well-known/security.txt" 2>/dev/null || true)"
            launcher_code="$(curl -sS -o /tmp/v937-launcher -w '%{http_code}' --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/twin-launcher.js?v=937-${attempt}" 2>/dev/null || true)"
            if ! printf '%s' "$app" | grep -q 'twin-launcher.js' \
              && printf '%s' "$app" | grep -q 'flutter_bootstrap.js' \
              && printf '%s' "$twin" | grep -q 'bridgepoint_property_twin_v918' \
              && printf '%s' "$release" | grep -q '"version": 937' \
              && printf '%s' "$release" | grep -q '"global_floating_launcher": false' \
              && test "$launcher_code" = '404' \
              && printf '%s' "$security" | grep -q 'Canonical: https://bridgepointintelligence.online/.well-known/security.txt'; then
              echo 'V937 verified: global Twin launcher absent; contextual compatibility route remains live.'
              exit 0
            fi
            sleep 10
          done
          echo 'Property visual V937 did not converge on the public domain.' >&2
          exit 1

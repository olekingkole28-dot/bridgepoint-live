      - name: Android smoke
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          cd /tmp
          npm init -y >/dev/null 2>&1 || true
          npm install puppeteer-core@24 --no-audit --no-fund >/dev/null 2>&1
          CHROME_PATH="$CHROME" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox','--disable-dev-shm-usage','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
            try{
              const p=await browser.newPage();
              await p.setUserAgent('Mozilla/5.0 (Linux; Android 16; Pixel 9a) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36');
              await p.setViewport({width:390,height:844,deviceScaleFactor:2,isMobile:true,hasTouch:true});
              const fatal=[];p.on('pageerror',e=>fatal.push(String(e.message||e)));

              await p.goto('https://bridgepointintelligence.online/?qa=v5400-'+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
              await p.waitForSelector('#landingPropertySearch',{timeout:10000});
              await p.waitForSelector('a[href="/sample/storm-opportunity/"]',{timeout:10000});
              await p.waitForFunction(()=>!!window.__BP_LANDING_WORLD__?.map,{timeout:30000});
              await p.waitForFunction(()=>Number(window.__BP_LANDING_LIVE_WEATHER__?.shapeCount||0)>0&&Number(window.__BP_LANDING_LIVE_WEATHER__?.pointCount||0)>0,{timeout:30000});
              await p.waitForFunction(()=>window.__BP_LANDING_RADAR_STATE__?.visible===true,{timeout:30000});
              await p.waitForFunction(()=>{
                const m=window.__BP_LANDING_WORLD__?.map;if(!m)return false;
                try{
                  const points=m.getLayer('bp-landing-weather-points')?m.queryRenderedFeatures({layers:['bp-landing-weather-points']}).length:0;
                  const lines=m.getLayer('bp-landing-weather-line')?m.queryRenderedFeatures({layers:['bp-landing-weather-line']}).length:0;
                  return points>0&&lines>0;
                }catch{return false}
              },{timeout:30000});
              await p.waitForFunction(()=>document.querySelectorAll('#landingPackages .package-card').length>=9,{timeout:20000});
              const landing=await p.evaluate(()=>({
                build:document.querySelector('meta[name="bp-build"]')?.content||'',
                search:!!document.getElementById('landingPropertySearch'),
                freeLookupCopy:document.getElementById('landingPropertySearchInput')?.placeholder||'',
                sample:!!document.querySelector('a[href="/sample/storm-opportunity/"]'),
                mapCanvases:document.querySelectorAll('#previewMap canvas').length,
                lockedTabs:document.querySelectorAll('[data-preview-cap]:not([data-preview-cap="overview"])').length,
                weatherLegend:!!document.getElementById('landingWeatherLegend'),
                weatherMore:!!document.getElementById('landingWeatherToggle'),
                weatherShapes:window.__BP_LANDING_LIVE_WEATHER__?.shapeCount||0,
                weatherPoints:window.__BP_LANDING_LIVE_WEATHER__?.pointCount||0,
                radarVisible:window.__BP_LANDING_RADAR_STATE__?.visible===true,
                radarLayerVisible:(()=>{const m=window.__BP_LANDING_WORLD__?.map;if(!m)return false;const ids=['bp-landing-radar-a','bp-landing-radar-b'];return ids.some(id=>m.getLayer(id)&&((m.getLayoutProperty(id,'visibility')||'visible')!=='none')&&Number(m.getPaintProperty(id,'raster-opacity')||0)>.2)})(),
                nationalWeatherLayers:(()=>{const m=window.__BP_LANDING_WORLD__?.map;return !!m?.getLayer('bp-landing-weather-line')&&!!m?.getLayer('bp-landing-weather-points')})(),
                renderedWeather:(()=>{const m=window.__BP_LANDING_WORLD__?.map;if(!m)return{points:0,lines:0};try{return{points:m.queryRenderedFeatures({layers:['bp-landing-weather-points']}).length,lines:m.queryRenderedFeatures({layers:['bp-landing-weather-line']}).length}}catch{return{points:0,lines:0}}})(),
                weatherLegendCount:document.getElementById('landingWeatherCount')?.textContent||'',
                noHorizontalOverflow:document.documentElement.scrollWidth<=window.innerWidth+2,
                searchZoomOverlap:(()=>{const a=document.getElementById('landingPropertySearch')?.getBoundingClientRect(),b=document.querySelector('#previewMap .maplibregl-ctrl-top-right')?.getBoundingClientRect();return !!(a&&b&&a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top)})(),
                mollyLoaded:(()=>{const i=document.querySelector('.molly-portrait');return !!i&&i.complete&&i.naturalWidth>0})(),
                backdropLoaded:(getComputedStyle(document.querySelector('.world-backdrop-image')).backgroundImage||'').includes('bp-city-world-background.webp'),
                productVisuals:document.querySelectorAll('.cap-visual').length,
                packageCards:document.querySelectorAll('#landingPackages .package-card').length
              }));
              if(!landing.build.includes('BP_LANDING_V5410')||!landing.search||!landing.sample||landing.mapCanvases!==1||landing.lockedTabs<6||!landing.weatherLegend||!landing.weatherMore||!landing.radarVisible||!landing.radarLayerVisible||!landing.nationalWeatherLayers||landing.weatherShapes<1||landing.weatherPoints<1||landing.renderedWeather.points<1||landing.renderedWeather.lines<1||!/EVENTS/.test(landing.weatherLegendCount)||!landing.noHorizontalOverflow||landing.searchZoomOverlap||!landing.mollyLoaded||!landing.backdropLoaded||landing.productVisuals<6||landing.packageCards<9||!/first property lookup is free/i.test(landing.freeLookupCopy))throw new Error('LANDING_CONVERSION_REGRESSION '+JSON.stringify(landing));
              console.log('BRIDGEPOINT_LANDING_CONVERSION_PASS',JSON.stringify(landing));
              const cols=async(width,height)=>{await p.setViewport({width,height,deviceScaleFactor:width<600?2:1,isMobile:width<600,hasTouch:width<1000});await new Promise(r=>setTimeout(r,350));return p.evaluate(()=>{const gridCols=sel=>{const el=document.querySelector(sel);if(!el)return 0;const v=getComputedStyle(el).gridTemplateColumns.trim();return v?v.split(/\s+/).length:0};return{w:innerWidth,overflow:document.documentElement.scrollWidth>innerWidth+2,products:gridCols('.cap-grid'),packages:gridCols('#landingPackages'),footer:gridCols('.footer-link-groups')}})};
              const phone=await cols(390,844),tablet=await cols(820,1180),desktop=await cols(1440,900);
              if(phone.overflow||tablet.overflow||desktop.overflow||phone.products!==1||phone.packages!==1||phone.footer!==1||tablet.products!==2||tablet.packages!==2||tablet.footer!==2||desktop.products!==3||desktop.packages!==3||desktop.footer!==4)throw new Error('RESPONSIVE_LANDING_REGRESSION '+JSON.stringify({phone,tablet,desktop}));
              console.log('BRIDGEPOINT_RESPONSIVE_LANDING_PASS',JSON.stringify({phone,tablet,desktop}));
              await p.setViewport({width:390,height:844,deviceScaleFactor:2,isMobile:true,hasTouch:true});

              const report=await p.goto('https://bridgepointintelligence.online/sample/storm-opportunity/?qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
              if(!report||report.status()>=400)throw new Error('SAMPLE_REPORT_HTTP_'+report?.status());
              const reportText=await p.evaluate(()=>document.body.innerText);
              if(!/static demonstration/i.test(reportText)||!/does not claim/i.test(reportText)||!/START ACCOUNT \/ TRIAL/i.test(reportText))throw new Error('SAMPLE_REPORT_CONTRACT');
              console.log('BRIDGEPOINT_SAMPLE_REPORT_PASS');

              await p.goto('https://bridgepointintelligence.online/app/?qa=v5378-'+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
              await p.waitForFunction(()=>window.__BP_FRONTEND_VERSION===5000&&window.__BP_APP_BUILD_VERSION__===5371,{timeout:20000});
              await p.waitForFunction(()=>window.__BP_WORLD_RENDER_VERSION__===5378&&!!window.__BP_V5000_WORLD?.map,{timeout:35000});
              await p.waitForFunction(()=>document.querySelectorAll('#liveMap canvas').length===1,{timeout:25000});
              await p.waitForFunction(()=>{
                const m=window.__BP_V5000_WORLD?.map;
                return !!m?.getLayer('gta-context-buildings')&&!!m?.getLayer('gta-city-buildings')&&!!m?.getLayer('gta-city-roofs')&&!!m?.getLayer('gta-exact-building')&&!!m?.getLayer('gta-exact-roof')&&!!m?.getLayer('gta-context-floor-lines')&&!!m?.getLayer('bp-v5004-weather-points');
              },{timeout:90000});

              const state=await p.evaluate(()=>{
                const w=window.__BP_V5000_WORLD,m=w?.map;
                return {
                  frontend:window.__BP_FRONTEND_VERSION,
                  app:window.__BP_APP_BUILD_VERSION__,
                  world:window.__BP_WORLD_RENDER_VERSION__,
                  architecture:w?.state?.architecture||null,
                  canvases:document.querySelectorAll('#liveMap canvas').length,
                  camera:window.__BP_CAMERA_MODE__||null,
                  materials:window.__BP_BUILDING_MATERIALS__||null,
                  fine:window.__BP_FINE_DETAIL_MODE__||null,
                  shell:window.__BP_BUILDING_SHELL_MODE__||null,
                  maxPitch:m?.getMaxPitch?.()??null,
                  layers:{
                    context:!!m?.getLayer('gta-context-buildings'),
                    city:!!m?.getLayer('gta-city-buildings'),
                    cityRoofs:!!m?.getLayer('gta-city-roofs'),
                    exact:!!m?.getLayer('gta-exact-building'),
                    exactRoofs:!!m?.getLayer('gta-exact-roof'),
                    floors:!!m?.getLayer('gta-context-floor-lines'),
                    radarA:!!m?.getLayer('bp-radar-a'),
                    radarB:!!m?.getLayer('bp-radar-b'),
                    weather:!!m?.getLayer('bp-v5004-weather-points'),
                    weatherShapes:!!m?.getLayer('bp-v5004-weather-shape-line')
                  },
                  sources:{city:!!m?.getSource('bpCityStructures'),cityRoofs:!!m?.getSource('bpCityRoofs'),weatherShapes:!!m?.getSource('bpV5004WeatherShapes')},
                  weatherLegend:{present:!!document.getElementById('liveLegend'),more:!!document.getElementById('liveLegendToggle')}
                };
              });
              if(state.frontend!==5000||state.app!==5371||state.world!==5378||state.canvases!==1||state.architecture!=='MAPLIBRE_CITY_STRUCTURES_REAL_ROOFS_LIGHTWEIGHT_FREE_FLY'||state.camera?.mode!=='FREE_FLY_SINGLE_VIEW'||state.camera?.singleView!==true||state.camera?.autoViewSwitching!==false||state.camera?.streetWalkMode!==false||state.camera?.buildingClickOverlook!==true||Number(state.maxPitch)<84||state.materials?.floorLines!==true||state.materials?.roofOverlays!==true||state.materials?.exactRoofs!==true||state.fine?.enabled!==false||!state.sources.city||!state.sources.cityRoofs||!state.sources.weatherShapes||!state.weatherLegend.present||!state.weatherLegend.more||Object.values(state.layers).some(v=>v!==true))throw new Error('CURRENT_WORLD_REGRESSION '+JSON.stringify(state));
              console.log('BRIDGEPOINT_CURRENT_WORLD_PASS',JSON.stringify(state));

              await p.evaluate(()=>{
                const m=window.__BP_V5000_WORLD?.map;if(!m)throw new Error('map unavailable');
                m.jumpTo({center:[-73.9857,40.7484],zoom:16.8,pitch:64,bearing:-22});
              });
              await p.waitForFunction(()=>{
                const m=window.__BP_V5000_WORLD?.map;if(!m)return false;
                const ids=['gta-city-buildings','gta-exact-building','gta-context-buildings'].filter(id=>m.getLayer(id)&&(m.getLayoutProperty(id,'visibility')||'visible')!=='none');
                try{return ids.some(id=>m.queryRenderedFeatures({layers:[id]}).length>0)}catch{return false}
              },{timeout:45000});
              const clicked=await p.evaluate(()=>{
                const w=window.__BP_V5000_WORLD,m=w?.map;if(!w?.selectBuildingAtPoint||!m)return null;
                const ids=['gta-city-buildings','gta-exact-building','gta-context-buildings'].filter(id=>m.getLayer(id)&&(m.getLayoutProperty(id,'visibility')||'visible')!=='none');
                const cv=m.getCanvas(),width=cv.clientWidth||cv.width,height=cv.clientHeight||cv.height;
                for(let y=90;y<height-70;y+=18)for(let x=20;x<width-20;x+=18){
                  try{if(m.queryRenderedFeatures({x,y},{layers:ids}).length&&w.selectBuildingAtPoint({x,y})===true)return{x,y,ids}}catch(_){}
                }
                return null;
              });
              if(!clicked)throw new Error('VISIBLE_BUILDING_NOT_CLICKABLE');
              await p.waitForFunction(()=>document.getElementById('buildingPanel')?.hidden===false,{timeout:8000});
              console.log('BRIDGEPOINT_BUILDING_CLICK_PASS',JSON.stringify(clicked));

              const severe=fatal.filter(x=>!/ResizeObserver loop/i.test(x));
              if(severe.length)throw new Error('ANDROID_PAGEERROR '+JSON.stringify(severe.slice(-5)));
              console.log('BRIDGEPOINT_V5410_ANDROID_SMOKE_PASS');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Persist only fully verified V5000 production as durable live baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v5000-live
          mkdir -p /tmp/v5000-live
          cp -a site/. /tmp/v5000-live/
          cd /tmp/v5000-live
          git init -q
          git config user.name 'BridgePoint V5000 Production Authority'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m "Publish fully verified BridgePoint V5000 ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact


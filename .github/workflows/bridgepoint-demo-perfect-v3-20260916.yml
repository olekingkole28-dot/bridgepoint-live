name: BridgePoint PERFECT demo video v3 2026-09-16

on:
  push:
    branches:
      - bridgepoint-demo-perfect-v3-20260916
    paths:
      - '.github/workflows/bridgepoint-demo-perfect-v3-20260916.yml'
      - '.github/scripts/capture_bridgepoint_demo_perfect_v3_20260916.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Record production app with render masks
        run: xvfb-run -a node .github/scripts/capture_bridgepoint_demo_perfect_v3_20260916.js
        env:
          CI: 'true'

      - name: Preserve raw
        run: |
          RAW="$(cat demo-output-v3/video-path.txt)"
          test -f "$RAW"
          cp "$RAW" demo-output-v3/BridgePoint_Perfect_Demo_v3_RAW.webm

      - name: Encode 1080p master
        run: |
          ffmpeg -y -i demo-output-v3/BridgePoint_Perfect_Demo_v3_RAW.webm             -c:v libx264 -preset veryfast -crf 18 -pix_fmt yuv420p -movflags +faststart -an             demo-output-v3/BridgePoint_Intelligence_Perfect_Demo_v3_Master.mp4

      - name: Encode vertical
        run: |
          ffmpeg -y -i demo-output-v3/BridgePoint_Intelligence_Perfect_Demo_v3_Master.mp4             -filter_complex "color=c=0x050b14:s=1080x1920:r=30[bg];[0:v]scale=1080:-2[fg];[bg][fg]overlay=(W-w)/2:(H-h)/2:shortest=1"             -c:v libx264 -preset veryfast -crf 19 -pix_fmt yuv420p -movflags +faststart -an             demo-output-v3/BridgePoint_Intelligence_Perfect_Demo_v3_Vertical.mp4

      - name: Upload finished videos
        uses: actions/upload-artifact@v4
        with:
          name: bridgepoint-perfect-demo-v3-20260916
          path: |
            demo-output-v3/BridgePoint_Intelligence_Perfect_Demo_v3_Master.mp4
            demo-output-v3/BridgePoint_Intelligence_Perfect_Demo_v3_Vertical.mp4
            demo-output-v3/BridgePoint_Perfect_Demo_v3_RAW.webm
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

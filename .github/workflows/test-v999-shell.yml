name: Test v999 shell navigation

on:
  push:
    branches: [staging-v999-runtime-cleanup]

permissions:
  contents: read

jobs:
  shell-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging-v999-runtime-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install isolated DOM test dependency
        run: npm install --no-save --package-lock=false jsdom@24
      - name: Simulate every BridgePoint navigation transition
        run: |
          node <<'NODE'
          const fs=require('fs');
          const {JSDOM}=require('jsdom');
          const dom=new JSDOM('<!doctype html><html><head></head><body><flutter-view><flt-glass-pane></flt-glass-pane></flutter-view><section id="bp-live-home-v984"></section><canvas id="bp974-cosmos"></canvas></body></html>',{runScripts:'outside-only',url:'https://bridgepointintelligence.online/app/?bpv=v999',pretendToBeVisual:true});
          const {window}=dom;
          window.__bridgepointCanonicalRuntime='v999';
          const commanded=[];
          window.BridgePointNavigateFlutterTabV984=(tab)=>{commanded.push(tab);window.__lastFlutterTab=tab;return true;};
          window.BridgePointOpenMapV993=async()=>{
            window.__mapOpened=(window.__mapOpened||0)+1;
            let d=window.document.getElementById('bp974-map-dialog');
            if(!d){d=window.document.createElement('div');d.id='bp974-map-dialog';window.document.body.appendChild(d);}
            d.classList.add('show');
            return true;
          };
          window.eval(fs.readFileSync('app/bridgepoint-shell-v999.js','utf8'));
          const wait=ms=>new Promise(r=>setTimeout(r,ms));
          const click=tab=>window.document.querySelector(`#bp999-nav [data-tab="${tab}"]`).click();
          const assertHome=()=>{
            if(window.BridgePointShellV999.getMode()!=='home') throw new Error('Home mode mismatch');
            if(!window.document.documentElement.classList.contains('bp999-home')) throw new Error('Home class missing');
            if(window.document.documentElement.classList.contains('bp999-flutter')) throw new Error('Flutter visible under Home');
          };
          const assertFlutter=tab=>{
            if(window.__lastFlutterTab!==tab) throw new Error(`${tab} did not command Flutter`);
            if(window.BridgePointShellV999.getMode()!==tab) throw new Error(`${tab} mode not published`);
            if(!window.document.documentElement.classList.contains('bp999-flutter')) throw new Error(`Flutter not revealed for ${tab}`);
            if(window.document.documentElement.classList.contains('bp999-home')) throw new Error(`Home remained over ${tab}`);
            if(window.document.documentElement.classList.contains('bp999-map')) throw new Error(`Map remained over ${tab}`);
          };
          (async()=>{
            assertHome();
            if(window.document.querySelectorAll('#bp999-nav').length!==1) throw new Error('navigation duplicated');
            if(/Search|Notifications/.test(window.document.getElementById('bp999-header').textContent)) throw new Error('dead header controls returned');

            for(const tab of ['properties','worth','more']){
              click(tab); await wait(180); assertFlutter(tab);
              window.BridgePointShellV999.home('test-return'); await wait(20); assertHome();
            }
            if(commanded.join(',')!=='properties,worth,more') throw new Error(`unexpected Flutter commands: ${commanded.join(',')}`);

            click('map'); await wait(35);
            if(window.BridgePointShellV999.getMode()!=='map') throw new Error('Map mode not published');
            if(window.__mapOpened!==1) throw new Error(`Map opened ${window.__mapOpened||0} times instead of once`);
            if(!window.document.documentElement.classList.contains('bp999-map')) throw new Error('Map class missing');
            if(window.document.documentElement.classList.contains('bp999-home')) throw new Error('Home remained active over Map');
            if(window.document.documentElement.classList.contains('bp999-flutter')) throw new Error('Flutter visible under Map');

            // The real map closes by removing .show. v999 must restore Home automatically.
            await wait(20);
            const dialog=window.document.getElementById('bp974-map-dialog');
            dialog.classList.remove('show');
            await wait(30);
            assertHome();

            // Re-open proves close did not leave duplicate listeners or stale map state.
            click('map'); await wait(35);
            if(window.__mapOpened!==2) throw new Error(`second map open count wrong: ${window.__mapOpened||0}`);
            window.document.getElementById('bp974-map-dialog').classList.remove('show');
            await wait(30); assertHome();

            console.log('v999 full shell navigation simulation passed');
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE

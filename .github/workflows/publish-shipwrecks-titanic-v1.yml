name: Publish BridgePoint Shipwrecks v11 — BridgePoint-hosted underwater wreck viewers
# Additive shipwreck overlay: persistent icons + locally hosted GLBs + BridgePoint-native interactive viewers.

on:
  pull_request:
    paths:
      - '.github/workflows/publish-shipwrecks-titanic-v1.yml'
      - 'rebuild-v5000/bridgepoint-shipwrecks-v1.js'
      - 'rebuild-v5000/bridgepoint-spacecraft-v1.js'
      - 'assets/spacecraft/nasa-mobile-launcher.glb'
      - 'tests/spacecraft-launch-sites-v1.test.mjs'
      - 'docs/spacecraft-launch-sites-v1.md'
      - 'tools/shipwrecks/fetch_shipwreck_meshes.py'
      - 'rebuild-v5000/bridgepoint-drone-awareness-v1.js'
      - 'rebuild-v5000/landing.js'
      - 'rebuild-v5000/app.js'
      - 'tests/shipwrecks-v1.test.mjs'
      - 'tests/drone-awareness.test.mjs'
      - 'tests/vessel-awareness.test.mjs'
      - 'docs/bridgepoint-shipwrecks-v1.md'
  workflow_run:
    workflows: ["Publish Persistent BridgePoint Overlay Visibility v2"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-shipwrecks-titanic-v1.yml'
      - 'rebuild-v5000/bridgepoint-shipwrecks-v1.js'
      - 'rebuild-v5000/bridgepoint-spacecraft-v1.js'
      - 'assets/spacecraft/nasa-mobile-launcher.glb'
      - 'tests/spacecraft-launch-sites-v1.test.mjs'
      - 'docs/spacecraft-launch-sites-v1.md'
      - 'tools/shipwrecks/fetch_shipwreck_meshes.py'
      - 'rebuild-v5000/bridgepoint-drone-awareness-v1.js'
      - 'rebuild-v5000/landing.js'
      - 'rebuild-v5000/app.js'
      - 'tests/shipwrecks-v1.test.mjs'
      - 'tools/shipwrecks/fetch_shipwreck_meshes.py'
      - 'tests/drone-awareness.test.mjs'
      - 'tests/vessel-awareness.test.mjs'
      - 'docs/bridgepoint-shipwrecks-v1.md'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source syntax and shipwreck/overlay regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < rebuild-v5000/bridgepoint-shipwrecks-v1.js
          node --input-type=module --check < rebuild-v5000/bridgepoint-spacecraft-v1.js
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow=Path('.github/workflows/publish-shipwrecks-titanic-v1.yml').read_text()
          overlay=workflow.index('      - name: Overlay only the Shipwrecks v11 module')
          marker="          python3 - <<'PY'\\n"
          start=workflow.index(marker,overlay)+len(marker)
          end=workflow.index('\\n          PY',start)
          compile(textwrap.dedent(workflow[start:end]),'bridgepoint-pages-overlay.py','exec')
          print('BRIDGEPOINT_PAGES_OVERLAY_PYTHON_SYNTAX_PASS')
          PY
          node --check rebuild-v5000/bridgepoint-drone-awareness-v1.js
          python3 -m py_compile tools/shipwrecks/fetch_shipwreck_meshes.py
          node --check rebuild-v5000/landing.js
          node --check rebuild-v5000/app.js
          node tests/shipwrecks-v1.test.mjs
          node tests/spacecraft-launch-sites-v1.test.mjs
          node tests/drone-awareness.test.mjs
          node tests/vessel-awareness.test.mjs

      - name: Fetch and validate the public HMS Loo CC BY photogrammetry source before merge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, importlib.util, struct, tempfile
          from pathlib import Path
          source=Path('tools/shipwrecks/fetch_shipwreck_meshes.py')
          spec=importlib.util.spec_from_file_location('bridgepoint_shipwreck_meshes',source)
          module=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          output=Path(tempfile.mkdtemp(prefix='bridgepoint-hms-loo-source-'))
          record=module.materialize_hms_loo(output)
          asset=output/'hms-loo-photogrammetry.glb.gz'
          assert asset.is_file() and asset.stat().st_size>0
          assert asset.stat().st_size<100*1024*1024, 'HMS Loo asset exceeds the GitHub Pages per-file publishing limit'
          raw=gzip.decompress(asset.read_bytes())
          assert raw[:4]==b'glTF' and len(raw)>32
          assert struct.unpack_from('<I',raw,8)[0]==len(raw)
          assert record['license']=='CC BY 4.0'
          assert record['datasetRevision'] and record['assetSha256']
          assert record['triangles']==4099999 and record['vertices']==2051535
          print('BRIDGEPOINT_HMS_LOO_PUBLIC_SOURCE_AND_PAGES_SIZE_PASS',len(raw),'GLB bytes',asset.stat().st_size,'compressed bytes')
          PY

      - name: Validate the NASA Mobile Launcher model and BridgePoint-hosted asset dimensions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          asset=Path('assets/spacecraft/nasa-mobile-launcher.glb')
          raw=asset.read_bytes()
          assert asset.is_file() and 0 < len(raw) < 100*1024*1024
          assert raw[:4]==b'glTF' and struct.unpack_from('<I',raw,8)[0]==len(raw)
          n=struct.unpack_from('<I',raw,12)[0]
          doc=json.loads(raw[20:20+n].decode('utf-8'))
          assert 'KHR_draco_mesh_compression' in doc.get('extensionsUsed',[])
          assert len(doc.get('materials',[])) >= 2 and len(doc.get('images',[])) >= 2
          accessors=[a for a in doc.get('accessors',[]) if a.get('type')=='VEC3' and a.get('min') and a.get('max')]
          assert accessors and max(a['max'][1]-a['min'][1] for a in accessors) > 200
          assert doc.get('asset',{}).get('version')=='2.0'
          print('BRIDGEPOINT_NASA_MOBILE_LAUNCHER_GLB_PASS',len(raw),'bytes',len(doc.get('materials',[])),'materials',len(doc.get('images',[])),'embedded images')
          PY

  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    concurrency:
      group: bridgepoint-v5000-production-authority
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Shipwrecks v11 renderer, BridgePoint-hosted local viewers and existing overlays
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < rebuild-v5000/bridgepoint-shipwrecks-v1.js
          node --input-type=module --check < rebuild-v5000/bridgepoint-spacecraft-v1.js
          node --check rebuild-v5000/bridgepoint-drone-awareness-v1.js
          node --check rebuild-v5000/landing.js
          node --check rebuild-v5000/app.js
          node tests/shipwrecks-v1.test.mjs
          node tests/spacecraft-launch-sites-v1.test.mjs
          node tests/drone-awareness.test.mjs
          node tests/vessel-awareness.test.mjs
          python3 -m py_compile tools/shipwrecks/fetch_shipwreck_meshes.py

      - name: Materialize the rights-checked Robert Gaskin, Grafton, Kanonvraget, HNLMS K XI, SS Cape Otway, Timaru and HMS Loo CC BY 4.0 GLBs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/shipwrecks/fetch_shipwreck_meshes.py --output assets/shipwrecks
          python3 - <<'PY'
          import gzip, json
          from pathlib import Path
          root=Path('assets/shipwrecks')
          record=json.loads((root/'catalog.json').read_text(encoding='utf-8'))['model']
          assert record['license']=='CC BY 4.0' and record['creator']=='Christian Rémillard'
          asset=root/'robert-gaskin-photogrammetry.glb.gz'
          raw=gzip.decompress(asset.read_bytes())
          assert raw[:4]==b'glTF' and len(raw)>32
          assert record['triangles']==598600 and record['vertices']==322800
          assert record['assetSha256']
          grafton=json.loads((root/'catalog.json').read_text(encoding='utf-8'))['grafton']
          assert grafton['license']=='CC BY 4.0' and 'Patrizio Mariani' in grafton['creators']
          grafton_asset=root/'hms-grafton-photogrammetry.glb.gz'
          grafton_raw=gzip.decompress(grafton_asset.read_bytes())
          assert grafton_raw[:4]==b'glTF' and len(grafton_raw)>32
          assert grafton['sourceMd5']=='ed8cf639950ab31290daffce25401b1a'
          assert grafton['coordinates']==[2.818383333333,51.4071] and grafton['scanDepthM']==19
          assert grafton['assetSha256']
          cannon=json.loads((root/'catalog.json').read_text(encoding='utf-8'))['cannon']
          assert cannon['license']=='CC BY 4.0' and 'Patrizio Mariani' in cannon['creators']
          assert cannon['coordinates']==[12.8688,55.6448] and cannon['depthRangeM']==[14,16]
          cannon_asset=root/'cannon-photogrammetry.glb.gz'
          cannon_raw=gzip.decompress(cannon_asset.read_bytes())
          assert cannon_raw[:4]==b'glTF' and len(cannon_raw)>32
          assert cannon['sourceMd5']=='83258bde7da60610bf534fff13162fca'
          assert cannon['assetSha256']
          print('BRIDGEPOINT_ROBERT_GASKIN_NATIVE_CC_BY_ASSET_PASS',len(raw),'source bytes',asset.stat().st_size,'compressed bytes')
          print('BRIDGEPOINT_HMS_GRAFTON_NATIVE_CC_BY_ASSET_PASS',len(grafton_raw),'source bytes',grafton_asset.stat().st_size,'compressed bytes')
          print('BRIDGEPOINT_KANONVRAGET_CANNON_NATIVE_CC_BY_ASSET_PASS',len(cannon_raw),'source bytes',cannon_asset.stat().st_size,'compressed bytes')
          kxi=json.loads((root/'catalog.json').read_text(encoding='utf-8'))['kxi']
          assert kxi['license']=='CC BY 4.0' and 'Western Australian Museum' in kxi['creators']
          assert kxi['coordinates']==[115.499470,-32.150390] and kxi['displayDepthM']==40
          assert kxi['lengthM']==66.63 and kxi['sourcePhotos']==6733
          kxi_asset=root/'hnlms-kxi-photogrammetry.glb.gz'
          kxi_raw=gzip.decompress(kxi_asset.read_bytes())
          assert kxi_raw[:4]==b'glTF' and len(kxi_raw)>32
          assert kxi['sourceGitBlobSha']=='39d1fabe4eb713340e689316044d230214e730ed'
          assert kxi['assetSha256']
          print('BRIDGEPOINT_HNLMS_KXI_NATIVE_CC_BY_ASSET_PASS',len(kxi_raw),'source bytes',kxi_asset.stat().st_size,'compressed bytes')
          cape=json.loads((root/'catalog.json').read_text(encoding='utf-8'))['capeOtway']
          assert cape['license']=='CC BY 4.0' and 'WreckSploration' in cape['creators']
          assert cape['coordinates']==[115.372533,-32.059833] and cape['displayDepthM']==87
          assert cape['lengthM']==60.10 and cape['beamM']==10.40
          assert cape['triangles']==200000 and cape['vertices']==100600
          cape_asset=root/'cape-otway-photogrammetry.glb.gz'
          cape_raw=gzip.decompress(cape_asset.read_bytes())
          assert cape_raw[:4]==b'glTF' and len(cape_raw)>32
          assert cape['sourceGitBlobSha']=='eee4d55e7391e55ea0bd8bc0c8aaf82e04f800b1'
          assert cape['assetSha256']
          print('BRIDGEPOINT_SS_CAPE_OTWAY_NATIVE_CC_BY_ASSET_PASS',len(cape_raw),'source bytes',cape_asset.stat().st_size,'compressed bytes')
          timaru=json.loads((root/'catalog.json').read_text(encoding='utf-8'))['timaru']
          assert timaru['license']=='CC BY 4.0' and 'WreckSploration' in timaru['creators']
          assert timaru['coordinates']==[115.4327897,-32.069910] and timaru['displayDepthM']==50
          assert timaru['lengthM']==44.9 and timaru['beamM']==9.17
          assert timaru['sourceGitBlobSha']=='95fe004674f0561e8ae90b766b2dbfeee1d6fc96'
          timaru_asset=root/'timaru-photogrammetry.glb.gz'
          timaru_raw=gzip.decompress(timaru_asset.read_bytes())
          assert timaru_raw[:4]==b'glTF' and len(timaru_raw)>32
          assert timaru['assetSha256']
          print('BRIDGEPOINT_TIMARU_SITE42_NATIVE_CC_BY_ASSET_PASS',len(timaru_raw),'source bytes',timaru_asset.stat().st_size,'compressed bytes')
          hms_loo=json.loads((root/'catalog.json').read_text(encoding='utf-8'))['hmsLoo']
          assert hms_loo['license']=='CC BY 4.0' and 'NOAA' in hms_loo['creator']
          assert hms_loo['coordinates']==[-81.4052,24.5477]
          assert hms_loo['displayDepthM']==6.75 and hms_loo['depthRangeM']==[4.5,9]
          assert hms_loo['triangles']==4099999 and hms_loo['vertices']==2051535
          loo_asset=root/'hms-loo-photogrammetry.glb.gz'
          loo_raw=gzip.decompress(loo_asset.read_bytes())
          assert loo_raw[:4]==b'glTF' and len(loo_raw)>32
          assert hms_loo['assetSha256'] and hms_loo['datasetRevision']
          print('BRIDGEPOINT_HMS_LOO_NATIVE_CC_BY_ASSET_PASS',len(loo_raw),'source bytes',loo_asset.stat().st_size,'compressed bytes')
          PY

      - name: Select the latest successful deployed GitHub Pages artifact
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ["REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          headers={"Accept":"application/vnd.github+json",
                   "Authorization":"Bearer "+token,
                   "X-GitHub-Api-Version":"2022-11-28"}
          def api(path):
              req=urllib.request.Request("https://api.github.com/repos/"+repo+path,headers=headers)
              with urllib.request.urlopen(req,timeout=35) as response:
                  return json.load(response)
          runs=api("/actions/runs?branch=main&per_page=100").get("workflow_runs",[])
          selected=None
          for run in runs:
              if run.get("status")!="completed" or run.get("conclusion")!="success":
                  continue
              jobs=api(f"/actions/runs/{run['id']}/jobs?per_page=100").get("jobs",[])
              steps=[s for job in jobs for s in (job.get("steps") or []) if s.get("conclusion")=="success"]
              uploaded=any("upload" in str(s.get("name","")).lower() and ("page" in str(s.get("name","")).lower() or "preserved production site" in str(s.get("name","")).lower()) for s in steps)
              deployed=any(("publish" in str(s.get("name","")).lower() or "deploy" in str(s.get("name","")).lower()) for s in steps)
              if not (uploaded and deployed):
                  continue
              artifacts=api(f"/actions/runs/{run['id']}/artifacts?per_page=100").get("artifacts",[])
              match=next((a for a in artifacts if not a.get("expired") and
                          (str(a.get("name","")).startswith("github-pages-") or
                           str(a.get("name","")).startswith("bridgepoint-v5000-"))),None)
              if match:
                  selected=(str(run["id"]),match["name"])
                  print("LATEST_SUCCESSFUL_PAGES_BASELINE",run["id"],run.get("name"),match["name"],match.get("size_in_bytes"))
                  break
          if not selected:
              # The last verified live Pages artifact is pinned as a safe recovery fallback.
              # Confirm the run and deploy step are still successful and the artifact is unexpired.
              fallback_run="44246111711"
              fallback_name="github-pages-plane-wrecks-v1"
              fallback=api(f"/actions/runs/{fallback_run}")
              if fallback.get("conclusion")!="success" or fallback.get("path")!=".github/workflows/publish-plane-wrecks-v1.yml":
                  raise SystemExit("Pinned fallback is no longer a successful Palatine Pages deployment.")
              fallback_jobs=api(f"/actions/runs/{fallback_run}/jobs?per_page=100").get("jobs",[])
              deploy_ok=any(job.get("conclusion")=="success" and any(
                  step.get("conclusion")=="success" and
                  step.get("name")=="Publish BridgePoint Plane Wrecks — ten persistent wreck viewers"
                  for step in (job.get("steps") or [])) for job in fallback_jobs)
              fallback_artifacts=api(f"/actions/runs/{fallback_run}/artifacts?per_page=100").get("artifacts",[])
              fallback_artifact=next((a for a in fallback_artifacts if a.get("name")==fallback_name and not a.get("expired")),None)
              if not deploy_ok or not fallback_artifact:
                  raise SystemExit("Pinned successful Palatine deploy artifact is missing or expired; refusing to publish.")
              selected=(fallback_run,fallback_name)
              print("USING_PINNED_VERIFIED_PLANE_WRECKS_PAGES_FALLBACK",fallback_run,fallback_name,fallback_artifact.get("size_in_bytes"))
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write("run_id="+selected[0]+"\n")
              out.write("artifact_name="+selected[1]+"\n")
          PY

      - name: Download the preserved production Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.baseline.outputs.artifact_name }}
          run-id: ${{ steps.baseline.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/shipwrecks-baseline

      - name: Restore the exact production site and fingerprint every existing file
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find "$RUNNER_TEMP/shipwrecks-baseline" -type f -name artifact.tar -print -quit)"
          test -n "$ARCHIVE"
          SITE="$RUNNER_TEMP/shipwrecks-site"
          mkdir -p "$SITE"
          tar -xf "$ARCHIVE" -C "$SITE"
          for file in index.html app/index.html landing.js app.js vendor/three.module.js bridgepoint-drone-awareness-v1.js \
            bridgepoint-palatine-cryptoporticus-v1.js bridgepoint-jenolan-caves-v1.js \
            bridgepoint-underground-scan-scenes-v2.js; do
            test -s "$SITE/$file" || { echo "Selected production baseline is missing $file; refusing to publish."; exit 1; }
          done
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          site=Path(os.environ["RUNNER_TEMP"])/"shipwrecks-site"
          before={p.relative_to(site).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in site.rglob("*") if p.is_file()}
          (Path(os.environ["RUNNER_TEMP"])/"shipwrecks-before.json").write_text(json.dumps(before,sort_keys=True))
          print("SHIPWRECKS_BASELINE_FINGERPRINT_PASS",len(before),"files")
          PY

      - name: Bundle local GLTFLoader and DRACOLoader with same-origin Draco decoders
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/shipwrecks-site"
          R="$RUNNER_TEMP/shipwrecks-loader-runtime"
          mkdir -p "$SITE/vendor/draco" "$SITE/vendor/basis" "$R"
          npm install --prefix "$R" --no-audit --no-fund --no-save three@0.169.0 esbuild@0.24.2
          if [ ! -s "$SITE/vendor/GLTFLoader.bundle.js" ]; then
            "$R/node_modules/.bin/esbuild" "$R/node_modules/three/examples/jsm/loaders/GLTFLoader.js" --bundle --format=esm --minify --external:three --outfile="$SITE/vendor/GLTFLoader.bundle.js"
          fi
          "$R/node_modules/.bin/esbuild" "$R/node_modules/three/examples/jsm/loaders/DRACOLoader.js" --bundle --format=esm --minify --external:three --outfile="$SITE/vendor/DRACOLoader.bundle.js"
          "$R/node_modules/.bin/esbuild" "$R/node_modules/three/examples/jsm/loaders/KTX2Loader.js" --bundle --format=esm --minify --external:three --outfile="$SITE/vendor/KTX2Loader.bundle.js"
          cp "$R/node_modules/three/examples/jsm/libs/basis/basis_transcoder.js" "$SITE/vendor/basis/basis_transcoder.js"
          cp "$R/node_modules/three/examples/jsm/libs/basis/basis_transcoder.wasm" "$SITE/vendor/basis/basis_transcoder.wasm"
          cp "$R/node_modules/three/examples/jsm/libs/draco/draco_decoder.js" "$SITE/vendor/draco/draco_decoder.js"
          cp "$R/node_modules/three/examples/jsm/libs/draco/draco_decoder.wasm" "$SITE/vendor/draco/draco_decoder.wasm"
          cp "$R/node_modules/three/examples/jsm/libs/draco/draco_wasm_wrapper.js" "$SITE/vendor/draco/draco_wasm_wrapper.js"
          python3 - "$SITE/vendor/GLTFLoader.bundle.js" "$SITE/vendor/DRACOLoader.bundle.js" "$SITE/vendor/KTX2Loader.bundle.js" <<'PY'
          import re,sys
          from pathlib import Path
          for raw in sys.argv[1:]:
              p=Path(raw);s=p.read_text(encoding='utf-8')
              s,n=re.subn(r'\bfrom\s*(["\'])three\1','from "/vendor/three.module.js?v=169-local"',s)
              already_patched='from "/vendor/three.module.js?v=169-local"' in s
              if (n<1 and not already_patched) or re.search(r'\bfrom\s*(["\'])three\1',s):
                  raise SystemExit(p.name+': unresolved external Three.js import')
              if 'esm.sh' in s or 'unpkg.com' in s:
                  raise SystemExit(p.name+': external CDN dependency found')
              p.write_text(s,encoding='utf-8')
              print('BRIDGEPOINT_LOCAL_'+p.stem.upper()+'_BUNDLE_PASS',p.stat().st_size,'bytes')
          PY
          node --input-type=module --check < "$SITE/vendor/GLTFLoader.bundle.js"
          node --input-type=module --check < "$SITE/vendor/DRACOLoader.bundle.js"
          node --input-type=module --check < "$SITE/vendor/KTX2Loader.bundle.js"
          grep -Fq 'from "/vendor/three.module.js?v=169-local"' "$SITE/vendor/GLTFLoader.bundle.js"
          grep -Fq 'from "/vendor/three.module.js?v=169-local"' "$SITE/vendor/DRACOLoader.bundle.js"
          grep -Fq 'from "/vendor/three.module.js?v=169-local"' "$SITE/vendor/KTX2Loader.bundle.js"
          grep -Fq 'KTX2Loader' "$SITE/vendor/KTX2Loader.bundle.js"
          test -s "$SITE/vendor/basis/basis_transcoder.js"
          test -s "$SITE/vendor/basis/basis_transcoder.wasm"
          test -s "$SITE/vendor/draco/draco_decoder.js"
          test -s "$SITE/vendor/draco/draco_decoder.wasm"
          test -s "$SITE/vendor/draco/draco_wasm_wrapper.js"
          echo "BRIDGEPOINT_LOCAL_DRACO_AND_KTX2_BASIS_DECODER_ASSETS_PASS"

      - name: Overlay only the Shipwrecks v11 module, seven licensed meshes and cache keys
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/shipwrecks-site"
          mkdir -p "$SITE/app" "$SITE/assets/shipwrecks" "$SITE/assets/spacecraft" "$SITE/vendor"
          cp rebuild-v5000/bridgepoint-shipwrecks-v1.js "$SITE/bridgepoint-shipwrecks-v1.js"
          cp rebuild-v5000/bridgepoint-drone-awareness-v1.js "$SITE/bridgepoint-drone-awareness-v1.js"
          cp rebuild-v5000/bridgepoint-shipwrecks-v1.js "$SITE/app/bridgepoint-shipwrecks-v1.js"
          cp rebuild-v5000/bridgepoint-spacecraft-v1.js "$SITE/bridgepoint-spacecraft-v1.js"
          cp rebuild-v5000/bridgepoint-spacecraft-v1.js "$SITE/app/bridgepoint-spacecraft-v1.js"
          cp assets/spacecraft/nasa-mobile-launcher.glb "$SITE/assets/spacecraft/nasa-mobile-launcher.glb"
          cp -a assets/shipwrecks/. "$SITE/assets/shipwrecks/"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re
          site=Path(os.environ["RUNNER_TEMP"])/"shipwrecks-site"
          attach="""void import('./bridgepoint-shipwrecks-v1.js?v=11-titanic-gaskin-grafton-cannon-kxi-cape-otway-timaru-hms-loo-draco-ktx2-local-viewer')
           .then(m=>{window.__BP_SHIPWRECKS_V1__=m.initShipwrecksRenderer(world)})
           .catch(e=>console.warn('BridgePoint shipwreck renderer unavailable',e));"""
          spacecraft_attach="""void import('./bridgepoint-spacecraft-v1.js?v=1-sls-mobile-launcher-lc39b')
           .then(m=>{window.__BP_SPACECRAFT_V1__=m.initSpacecraftRenderer(world)})
           .catch(e=>console.warn('BridgePoint Spacecraft & Launch Sites layer unavailable',e));"""
          old_markers=("bridgepoint-shipwrecks-v1.js?v=1-titanic-noaa-waypoints",
                       "bridgepoint-shipwrecks-v1.js?v=2-titanic-gaskin-native",
                       "bridgepoint-shipwrecks-v1.js?v=3-titanic-gaskin-grafton-native",
                       "bridgepoint-shipwrecks-v1.js?v=4-titanic-gaskin-grafton-cannon-native",
                       "bridgepoint-shipwrecks-v1.js?v=5-titanic-gaskin-grafton-cannon-local-hosted-viewers",
                       "bridgepoint-shipwrecks-v1.js?v=6-titanic-gaskin-grafton-cannon-kxi-local-hosted-viewers",
                       "bridgepoint-shipwrecks-v1.js?v=7-titanic-gaskin-grafton-cannon-kxi-draco-local-viewer","bridgepoint-shipwrecks-v1.js?v=8-titanic-gaskin-grafton-cannon-kxi-draco-ktx2-local-viewer",
                       "bridgepoint-shipwrecks-v1.js?v=9-titanic-gaskin-grafton-cannon-kxi-cape-otway-draco-ktx2-local-viewer","bridgepoint-shipwrecks-v1.js?v=11-titanic-gaskin-grafton-cannon-kxi-cape-otway-timaru-hms-loo-draco-ktx2-local-viewer")
          new_marker=old_markers[-1]
          wells_anchor=".catch(e=>console.warn('BridgePoint global subsurface wells renderer unavailable',e));"
          for rel in ("landing.js","app.js"):
              p=site/rel;data=p.read_text(encoding="utf-8")
              if new_marker not in data:
                  old=[m for m in old_markers[:-1] if data.count(m)==1]
                  if len(old)==1:
                      data=data.replace(old[0],new_marker,1)
                  else:
                      if data.count(wells_anchor)!=1:
                          raise SystemExit(f"{rel}: no unique existing Shipwrecks import/cache key or wells insertion anchor")
                      data=data.replace(wells_anchor,wells_anchor+"\n"+attach,1)
              if new_marker not in data:
                  raise SystemExit(f"{rel}: Shipwrecks v8 module import is missing")
              if "initSpacecraftRenderer(world)" not in data:
                  plane_import=data.find("initPlaneWrecksRenderer(world)")
                  plane_catch=".catch(e=>console.warn('BridgePoint Plane Wrecks layer unavailable',e));"
                  plane_end=data.find(plane_catch,plane_import) if plane_import>=0 else -1
                  if plane_import<0 or plane_end<0:
                      raise SystemExit(f"{rel}: no existing Plane Wrecks import anchor for additive Spacecraft layer")
                  plane_end += len(plane_catch)
                  data=data[:plane_end]+"\n"+spacecraft_attach+data[plane_end:]
              p.write_text(data,encoding="utf-8")
          for rel,needle in (("index.html","landing.js"),("app/index.html","app.js")):
              p=site/rel;data=p.read_text(encoding="utf-8")
              matches=list(re.finditer(r'src="([^"]*'+re.escape(needle)+r'(?:\?[^"]*)?)"',data))
              if len(matches)!=1:
                  raise SystemExit(f"{rel}: expected exactly one {needle} script URL, found {len(matches)}")
              url=matches[0].group(1)
              current_url=url
              if "shipwrecks=titanic-gaskin-grafton-cannon-kxi-cape-otway-timaru-hms-loo-v11" not in current_url:
                  current_url=current_url+("&" if "?" in current_url else "?")+"shipwrecks=titanic-gaskin-grafton-cannon-kxi-cape-otway-timaru-hms-loo-v11"
              if "spacecraft=sls-mobile-launcher-pad39b-v1" not in current_url:
                  updated=current_url+("&" if "?" in current_url else "?")+"spacecraft=sls-mobile-launcher-pad39b-v1"
                  data=data.replace(url,updated,1)
              drone_matches=list(re.finditer(r'src="([^"]*bridgepoint-drone-awareness-v1\.js(?:\?[^"]*)?)"',data))
              if len(drone_matches)!=1:
                  raise SystemExit(f"{rel}: expected exactly one shared visibility guard script URL, found {len(drone_matches)}")
              drone_url=drone_matches[0].group(1)
              if re.search(r'([?&])v=',drone_url):
                  drone_updated=re.sub(r'([?&]v=)[^&"]+',r'\g<1>12-shipwrecks-v3-kxi-icons',drone_url,count=1)
              else:
                  drone_updated=drone_url+("&" if "?" in drone_url else "?")+"v=12-shipwrecks-v3-kxi-icons"
              if drone_updated!=drone_url:
                  data=data.replace(drone_url,drone_updated,1)
              p.write_text(data,encoding="utf-8")
          before=json.loads((Path(os.environ["RUNNER_TEMP"])/"shipwrecks-before.json").read_text())
          after={p.relative_to(site).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in site.rglob("*") if p.is_file()}
          removed=set(before)-set(after)
          added=set(after)-set(before)
          changed={p for p in before if p in after and before[p]!=after[p]}
          expected_changed={"landing.js","app.js","index.html","app/index.html","bridgepoint-drone-awareness-v1.js"}
          overlay_files={
            "bridgepoint-shipwrecks-v1.js","app/bridgepoint-shipwrecks-v1.js",
            "bridgepoint-spacecraft-v1.js","app/bridgepoint-spacecraft-v1.js",
            "assets/spacecraft/nasa-mobile-launcher.glb",
            "assets/shipwrecks/robert-gaskin-photogrammetry.glb.gz",
            "assets/shipwrecks/hms-grafton-photogrammetry.glb.gz",
            "assets/shipwrecks/cannon-photogrammetry.glb.gz",
            "assets/shipwrecks/hnlms-kxi-photogrammetry.glb.gz",
            "assets/shipwrecks/cape-otway-photogrammetry.glb.gz",
            "assets/shipwrecks/timaru-photogrammetry.glb.gz",
            "assets/shipwrecks/hms-loo-photogrammetry.glb.gz",
            "assets/shipwrecks/catalog.json","vendor/GLTFLoader.bundle.js",
            "vendor/DRACOLoader.bundle.js","vendor/KTX2Loader.bundle.js",
            "vendor/basis/basis_transcoder.js","vendor/basis/basis_transcoder.wasm",
            "vendor/draco/draco_decoder.js","vendor/draco/draco_decoder.wasm","vendor/draco/draco_wasm_wrapper.js"
          }
          # Titanic v1 may already exist in the saved Pages baseline. It is an
          # allowed replacement there, or an allowed addition when absent.
          allowed_changed=expected_changed|overlay_files
          if removed or not changed.issubset(allowed_changed) or not added.issubset(overlay_files):
              raise SystemExit("SHIPWRECKS_V2_OVERLAY_SCOPE_FAILURE "+json.dumps({
                "removed":sorted(removed),"changed":sorted(changed),"allowed_changed":sorted(allowed_changed),
                "added":sorted(added),"allowed_added":sorted(overlay_files)}))
          required={"bridgepoint-shipwrecks-v1.js","app/bridgepoint-shipwrecks-v1.js",
                    "bridgepoint-spacecraft-v1.js","app/bridgepoint-spacecraft-v1.js",
                    "assets/spacecraft/nasa-mobile-launcher.glb",
                    "assets/shipwrecks/robert-gaskin-photogrammetry.glb.gz",
                    "assets/shipwrecks/hms-grafton-photogrammetry.glb.gz",
                    "assets/shipwrecks/cannon-photogrammetry.glb.gz",
                    "assets/shipwrecks/hnlms-kxi-photogrammetry.glb.gz",
            "assets/shipwrecks/cape-otway-photogrammetry.glb.gz",
                    "assets/shipwrecks/timaru-photogrammetry.glb.gz",
            "assets/shipwrecks/hms-loo-photogrammetry.glb.gz",
                    "assets/shipwrecks/catalog.json","vendor/GLTFLoader.bundle.js",
                    "vendor/DRACOLoader.bundle.js","vendor/KTX2Loader.bundle.js",
                    "vendor/basis/basis_transcoder.js","vendor/basis/basis_transcoder.wasm",
                    "vendor/draco/draco_decoder.js","vendor/draco/draco_decoder.wasm","vendor/draco/draco_wasm_wrapper.js"}
          missing=required-after.keys()
          if missing:
              raise SystemExit("SHIPWRECKS_V2_REQUIRED_RUNTIME_FILE_MISSING "+json.dumps(sorted(missing)))
          assert (site/"bridgepoint-shipwrecks-v1.js").read_bytes()==(site/"app/bridgepoint-shipwrecks-v1.js").read_bytes()
          print("SHIPWRECKS_V11_AND_SPACECRAFT_V1_ADDITIVE_OVERLAY_SCOPE_PASS",len(changed),"existing files changed",len(added),"files added; no removals")
          PY
          node --check "$SITE/landing.js"
          node --check "$SITE/app.js"
          node --check "$SITE/bridgepoint-drone-awareness-v1.js"
          node --input-type=module --check < "$SITE/bridgepoint-shipwrecks-v1.js"
          node --input-type=module --check < "$SITE/bridgepoint-spacecraft-v1.js"
          node tests/spacecraft-launch-sites-v1.test.mjs
          cmp -s "$SITE/bridgepoint-shipwrecks-v1.js" "$SITE/app/bridgepoint-shipwrecks-v1.js"
          cmp -s "$SITE/bridgepoint-spacecraft-v1.js" "$SITE/app/bridgepoint-spacecraft-v1.js"
          grep -Fq 'initSpacecraftRenderer(world)' "$SITE/landing.js"
          grep -Fq 'initSpacecraftRenderer(world)' "$SITE/app.js"
          test -s "$SITE/assets/spacecraft/nasa-mobile-launcher.glb"
          grep -Fq 'initShipwrecksRenderer(world)' "$SITE/landing.js"
          grep -Fq 'initShipwrecksRenderer(world)' "$SITE/app.js"
          grep -Fq 'assets/shipwrecks/robert-gaskin-photogrammetry.glb.gz' "$SITE/bridgepoint-shipwrecks-v1.js"
          grep -Fq 'assets/shipwrecks/cannon-photogrammetry.glb.gz' "$SITE/bridgepoint-shipwrecks-v1.js"
          grep -Fq 'mountBridgePointLocalWreckViewer' "$SITE/bridgepoint-shipwrecks-v1.js"
          grep -Fq 'data-bp-local-wreck-viewer' "$SITE/bridgepoint-shipwrecks-v1.js"
          if grep -Fq 'viewerUrl' "$SITE/bridgepoint-shipwrecks-v1.js"; then echo "External target viewer reference remains in Shipwrecks module"; exit 1; fi
          grep -Fq 'vendor/GLTFLoader.bundle.js' "$SITE/bridgepoint-shipwrecks-v1.js"
          grep -Fq 'vendor/DRACOLoader.bundle.js' "$SITE/bridgepoint-shipwrecks-v1.js"
          grep -Fq 'vendor/KTX2Loader.bundle.js' "$SITE/bridgepoint-shipwrecks-v1.js"
          grep -Fq "setDecoderPath('/vendor/draco/')" "$SITE/bridgepoint-shipwrecks-v1.js"
          grep -Fq "setTranscoderPath('/vendor/basis/')" "$SITE/bridgepoint-shipwrecks-v1.js"
          test -s "$SITE/vendor/KTX2Loader.bundle.js"
          test -s "$SITE/vendor/basis/basis_transcoder.js"
          test -s "$SITE/vendor/basis/basis_transcoder.wasm"
          test -s "$SITE/vendor/draco/draco_decoder.js"
          test -s "$SITE/vendor/draco/draco_decoder.wasm"
          test -s "$SITE/vendor/draco/draco_wasm_wrapper.js"
          echo "BRIDGEPOINT_SHIPWRECKS_V11_AND_SPACECRAFT_V1_OVERLAY_PASS"

      - uses: actions/configure-pages@v5

      - name: Upload the preserved production site with the additive Shipwrecks v11 overlay
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-shipwrecks-v11
          path: ${{ runner.temp }}/shipwrecks-site
          include-hidden-files: true

      - name: Publish BridgePoint Shipwrecks v11 + Spacecraft v1 additive overlay
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-shipwrecks-v11

      - name: Verify live root/app entry points, wrecks and BridgePoint-hosted Spacecraft launch-site scene
        shell: bash
        run: |
          set -euo pipefail
          O='https://bridgepointintelligence.online'
          Q="$GITHUB_SHA-shipwrecks-ktx2-v9"
          D="$RUNNER_TEMP/shipwrecks-live"
          mkdir -p "$D"
          for item in \
            "root.html:$O/?shipwrecks=$Q" \
            "app.html:$O/app/?shipwrecks=$Q" \
            "landing.js:$O/landing.js?shipwrecks=$Q" \
            "app.js:$O/app.js?shipwrecks=$Q" \
            "module.js:$O/bridgepoint-shipwrecks-v1.js?verify=$Q" \
            "spacecraft.js:$O/bridgepoint-spacecraft-v1.js?verify=$Q" \
            "spacecraft.glb:$O/assets/spacecraft/nasa-mobile-launcher.glb?verify=$Q" \
            "app-spacecraft.js:$O/app/bridgepoint-spacecraft-v1.js?verify=$Q" \
            "drone.js:$O/bridgepoint-drone-awareness-v1.js?verify=$Q" \
            "gaskin.glb.gz:$O/assets/shipwrecks/robert-gaskin-photogrammetry.glb.gz?verify=$Q" \
            "grafton.glb.gz:$O/assets/shipwrecks/hms-grafton-photogrammetry.glb.gz?verify=$Q" \
            "cannon.glb.gz:$O/assets/shipwrecks/cannon-photogrammetry.glb.gz?verify=$Q" \
            "kxi.glb.gz:$O/assets/shipwrecks/hnlms-kxi-photogrammetry.glb.gz?verify=$Q" \
            "cape-otway.glb.gz:$O/assets/shipwrecks/cape-otway-photogrammetry.glb.gz?verify=$Q" \
            "timaru.glb.gz:$O/assets/shipwrecks/timaru-photogrammetry.glb.gz?verify=$Q" \
            "hms-loo.glb.gz:$O/assets/shipwrecks/hms-loo-photogrammetry.glb.gz?verify=$Q" \
            "loader.js:$O/vendor/GLTFLoader.bundle.js?verify=$Q" \
            "draco-loader.js:$O/vendor/DRACOLoader.bundle.js?verify=$Q" \
            "draco-decoder.js:$O/vendor/draco/draco_decoder.js?verify=$Q" \
            "draco-wrapper.js:$O/vendor/draco/draco_wasm_wrapper.js?verify=$Q" \
            "draco-wasm:$O/vendor/draco/draco_decoder.wasm?verify=$Q" \
            "ktx2-loader.js:$O/vendor/KTX2Loader.bundle.js?verify=$Q" \
            "basis-transcoder.js:$O/vendor/basis/basis_transcoder.js?verify=$Q" \
            "basis-transcoder.wasm:$O/vendor/basis/basis_transcoder.wasm?verify=$Q" \
            "catalog.json:$O/assets/shipwrecks/catalog.json?verify=$Q" \
            "app-module.js:$O/app/bridgepoint-shipwrecks-v1.js?verify=$Q"; do
            name="${item%%:*}"; url="${item#*:}"
            curl --retry 6 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 -fL \
              -H 'Cache-Control: no-cache' "$url" -o "$D/$name"
          done
          # Check the root globe entry and the actual /app/ module entry.
          grep -Fq 'BP_FRONTEND_V5000' "$D/root.html" || { echo "LIVE_VERIFY_FAIL: root entry build marker missing"; exit 1; }
          grep -Fq 'bridgepoint-drone-awareness-v1.js' "$D/root.html" || { echo "LIVE_VERIFY_FAIL: root visibility guard script missing"; exit 1; }
          grep -Fq 'bridgepoint-drone-awareness-v1.js' "$D/app.html" || { echo "LIVE_VERIFY_FAIL: app visibility guard script missing"; exit 1; }
          grep -Fq 'bridgepoint-shipwrecks-v1.js?v=11-titanic-gaskin-grafton-cannon-kxi-cape-otway-timaru-hms-loo-draco-ktx2-local-viewer' "$D/landing.js" || { echo "LIVE_VERIFY_FAIL: root Shipwrecks import missing"; exit 1; }
          grep -Fq 'bridgepoint-shipwrecks-v1.js?v=11-titanic-gaskin-grafton-cannon-kxi-cape-otway-timaru-hms-loo-draco-ktx2-local-viewer' "$D/app.js" || { echo "LIVE_VERIFY_FAIL: app Shipwrecks import missing"; exit 1; }
          echo "LIVE_VERIFY_PASS: root and app entrypoints + Shipwrecks imports"
          grep -Fq 'bridgepoint-spacecraft-v1.js?v=1-sls-mobile-launcher-lc39b' "$D/landing.js" || { echo "LIVE_VERIFY_FAIL: root Spacecraft import missing"; exit 1; }
          grep -Fq 'bridgepoint-spacecraft-v1.js?v=1-sls-mobile-launcher-lc39b' "$D/app.js" || { echo "LIVE_VERIFY_FAIL: app Spacecraft import missing"; exit 1; }
          grep -Fq 'SLS Block 1' "$D/spacecraft.js" || { echo "LIVE_VERIFY_FAIL: SLS Block 1 metadata missing"; exit 1; }
          grep -Fq 'data-bp-local-spacecraft-viewer' "$D/spacecraft.js" || { echo "LIVE_VERIFY_FAIL: BridgePoint local Spacecraft viewer missing"; exit 1; }
          grep -Fq 'nasa-mobile-launcher.glb' "$D/spacecraft.js" || { echo "LIVE_VERIFY_FAIL: NASA Mobile Launcher asset path missing"; exit 1; }
          grep -Fq 'not a photogrammetry scan' "$D/spacecraft.js" || { echo "LIVE_VERIFY_FAIL: provenance disclosure missing"; exit 1; }
          cmp -s "$D/spacecraft.js" "$D/app-spacecraft.js" || { echo "LIVE_VERIFY_FAIL: root/app spacecraft modules differ"; exit 1; }
          python3 - "$D/spacecraft.glb" <<'PY'
          import json,struct,sys
          raw=open(sys.argv[1],'rb').read()
          assert raw[:4]==b'glTF' and struct.unpack_from('<I',raw,8)[0]==len(raw)
          n=struct.unpack_from('<I',raw,12)[0]
          doc=json.loads(raw[20:20+n].decode('utf-8'))
          assert 'KHR_draco_mesh_compression' in doc.get('extensionsUsed',[])
          assert len(doc.get('materials',[]))>=2 and len(doc.get('images',[]))>=2
          print('BRIDGEPOINT_NASA_MOBILE_LAUNCHER_LIVE_GLB_PASS',len(raw),'bytes')
          PY
          echo "LIVE_VERIFY_PASS: BridgePoint-hosted SLS Block 1 + NASA Mobile Launcher scene and persistent marker module"
          grep -Fq 'shipwrecks:/shipwreck|titanic/i' "$D/drone.js" || { echo "LIVE_VERIFY_FAIL: dedicated shipwreck category missing"; exit 1; }
          grep -Fq "shipwrecks:'shipwrecks'" "$D/drone.js" || { echo "LIVE_VERIFY_FAIL: shipwreck category action mapping missing"; exit 1; }
          echo "LIVE_VERIFY_PASS: persistent Shipwrecks category"
          grep -Fq 'initShipwrecksRenderer' "$D/module.js" || { echo "LIVE_VERIFY_FAIL: Shipwrecks module missing"; exit 1; }
          grep -Fq 'Robert Gaskin' "$D/module.js" || { echo "LIVE_VERIFY_FAIL: Robert Gaskin model metadata missing"; exit 1; }
          grep -Fq 'hms-grafton-photogrammetry.glb.gz' "$D/module.js" || { echo "LIVE_VERIFY_FAIL: HMS Grafton native asset path missing"; exit 1; }
          grep -Fq 'cannon-photogrammetry.glb.gz' "$D/module.js" || { echo "LIVE_VERIFY_FAIL: Kanonvraget native asset path missing"; exit 1; }
          grep -Fq 'hnlms-kxi-photogrammetry.glb.gz' "$D/module.js" || { echo "LIVE_VERIFY_FAIL: HNLMS K XI native asset path missing"; exit 1; }
          grep -Fq 'cape-otway-photogrammetry.glb.gz' "$D/module.js" || { echo "LIVE_VERIFY_FAIL: SS Cape Otway native asset path missing"; exit 1; }
          grep -Fq 'timaru-photogrammetry.glb.gz' "$D/module.js" || { echo "LIVE_VERIFY_FAIL: Timaru native asset path missing"; exit 1; }
          grep -Fq 'hms-loo-photogrammetry.glb.gz' "$D/module.js" || { echo "LIVE_VERIFY_FAIL: HMS Loo native asset path missing"; exit 1; }
          grep -Fq "hit.properties?.wreckId==='hms-loo'" "$D/module.js" || { echo "LIVE_VERIFY_FAIL: HMS Loo persistent marker click route missing"; exit 1; }
          grep -Fq 'HMS Loo — Looe Key' "$D/module.js" || { echo "LIVE_VERIFY_FAIL: HMS Loo information card missing"; exit 1; }
          grep -Fq 'SS Cape Otway' "$D/module.js" || { echo "LIVE_VERIFY_FAIL: SS Cape Otway card metadata missing"; exit 1; }
          grep -Fq 'Timaru — Site 42' "$D/module.js" || { echo "LIVE_VERIFY_FAIL: Timaru card metadata missing"; exit 1; }
          grep -Fq "hit.properties?.wreckId==='cape-otway'" "$D/module.js" || { echo "LIVE_VERIFY_FAIL: Cape Otway icon click route missing"; exit 1; }
          grep -Fq "hit.properties?.wreckId==='timaru'" "$D/module.js" || { echo "LIVE_VERIFY_FAIL: Timaru icon click route missing"; exit 1; }
          grep -Fq 'HNLMS K XI' "$D/module.js" || { echo "LIVE_VERIFY_FAIL: HNLMS K XI card metadata missing"; exit 1; }
          grep -Fq 'Kanonvraget — Cannon Wreck' "$D/module.js" || { echo "LIVE_VERIFY_FAIL: Kanonvraget popup/catalog missing"; exit 1; }
          grep -Fq 'mountBridgePointLocalWreckViewer' "$D/module.js" || { echo "LIVE_VERIFY_FAIL: BridgePoint-hosted 3D viewer runtime missing"; exit 1; }
          grep -Fq 'data-bp-local-wreck-viewer' "$D/module.js" || { echo "LIVE_VERIFY_FAIL: local 3D viewer mount points missing"; exit 1; }
          grep -Fq 'import(DRACO_URL)' "$D/module.js" || { echo "LIVE_VERIFY_FAIL: local DRACOLoader import missing"; exit 1; }
          grep -Fq "setDecoderPath('/vendor/draco/')" "$D/module.js" || { echo "LIVE_VERIFY_FAIL: Draco decoder path missing"; exit 1; }
          grep -Fq 'import(KTX2_URL)' "$D/module.js" || { echo "LIVE_VERIFY_FAIL: local KTX2Loader import missing"; exit 1; }
          grep -Fq 'loader.setKTX2Loader(state.ktx2Loader)' "$D/module.js" || { echo "LIVE_VERIFY_FAIL: GLTFLoader KTX2 configuration missing"; exit 1; }
          grep -Fq "setTranscoderPath('/vendor/basis/')" "$D/module.js" || { echo "LIVE_VERIFY_FAIL: Basis transcoder path missing"; exit 1; }
          if grep -Fq 'viewerUrl' "$D/module.js"; then echo "LIVE_VERIFY_FAIL: external Grafton/Cannon viewer reference remains"; exit 1; fi
          grep -Fq 'CC BY 4.0' "$D/catalog.json" || { echo "LIVE_VERIFY_FAIL: asset licence catalogue missing"; exit 1; }
          python3 - "$D/grafton.glb.gz" "$D/catalog.json" <<'PY'
          import gzip,json,sys
          raw=gzip.decompress(open(sys.argv[1],'rb').read())
          catalog=json.load(open(sys.argv[2],encoding='utf-8'))
          assert raw[:4]==b'glTF' and len(raw)>32
          assert catalog['grafton']['license']=='CC BY 4.0'
          assert catalog['grafton']['sourceMd5']=='ed8cf639950ab31290daffce25401b1a'
          print('BRIDGEPOINT_HMS_GRAFTON_LIVE_GLB_PASS',len(raw),'bytes')
          PY
          python3 - "$D/cannon.glb.gz" "$D/catalog.json" <<'PY'
          import gzip,json,sys
          raw=gzip.decompress(open(sys.argv[1],'rb').read())
          catalog=json.load(open(sys.argv[2],encoding='utf-8'))
          assert raw[:4]==b'glTF' and len(raw)>32

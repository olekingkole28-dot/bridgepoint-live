name: Publish BridgePoint Maps over preserved production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-bridgepoint-maps-v1.yml'
      - 'rebuild-v5000/bridgepoint-maps-v1.js'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-maps-v1-preserved-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the latest successful production Pages snapshot
        id: baseline
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=success&branch=main&per_page=100" --jq '.workflow_runs | map(select(.conclusion == "success")) | .[].id')"
          BASELINE_ID=""
          ARTIFACT=""
          for run_id in $RUNS; do
            candidate="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" --jq '.artifacts[]? | select((.expired|not) and (.name | startswith("bridgepoint-v5000-"))) | .name' | head -n 1 || true)"
            if [ -n "$candidate" ]; then
              BASELINE_ID="$run_id"
              ARTIFACT="$candidate"
              break
            fi
          done
          test -n "$BASELINE_ID"
          test -n "$ARTIFACT"
          echo "run_id=$BASELINE_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "PRODUCTION_BASELINE run=$BASELINE_ID artifact=$ARTIFACT"

      - name: Download the production snapshot
        uses: actions/download-artifact@v4
        with:
          name: "${{ steps.baseline.outputs.artifact_name }}"
          run-id: "${{ steps.baseline.outputs.run_id }}"
          repository: "${{ github.repository }}"
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          path: "${{ runner.temp }}/bp-pages-baseline"

      - name: Restore production and fingerprint all non-target files
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find "$RUNNER_TEMP/bp-pages-baseline" -type f -name artifact.tar -print -quit)"
          test -n "$ARCHIVE"
          SITE="$RUNNER_TEMP/bp-site"
          mkdir -p "$SITE"
          tar -xf "$ARCHIVE" -C "$SITE"
          test -s "$SITE/index.html"
          test -s "$SITE/app/index.html"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          site=Path(os.environ['RUNNER_TEMP'])/'bp-site'
          targets={'index.html','app/index.html','bridgepoint-maps-v1.js'}
          def digest(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return h.hexdigest()
          before={}
          for path in sorted(site.rglob('*')):
              if path.is_file():
                  rel=path.relative_to(site).as_posix()
                  if rel not in targets: before[rel]=digest(path)
          tmp=Path(os.environ['RUNNER_TEMP'])
          (tmp/'bp-maps-preservation-before.json').write_text(json.dumps(before,sort_keys=True))
          for rel in ('index.html','app/index.html'):
              path=site/rel
              html=path.read_text(encoding='utf-8')
              if '</body>' not in html.lower(): raise SystemExit(rel+' has no closing body tag')
              (tmp/(rel.replace('/','-')+'.before.html')).write_text(html,encoding='utf-8')
          print('NON_TARGET_PRODUCTION_FILES_FINGERPRINTED',len(before))
          PY

      - name: Add the independent Maps overlay and script tags only
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/bp-site"
          cp rebuild-v5000/bridgepoint-maps-v1.js "$SITE/bridgepoint-maps-v1.js"
          python3 - <<'PY'
          import re,os
          from pathlib import Path
          site=Path(os.environ['RUNNER_TEMP'])/'bp-site'
          script='<script defer src="/bridgepoint-maps-v1.js?v=6541-maps-visible-models"></script>'
          button_style='position:fixed;z-index:2147483646;top:max(12px,env(safe-area-inset-top));right:14px;min-height:44px;padding:0 16px;border:1px solid #ffe29a;border-radius:14px;background:linear-gradient(135deg,#ffe597,#dcae38 60%,#a87716);color:#171108;font:900 12px/1 system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:.065em;box-shadow:0 8px 28px #0008,0 0 20px #f2c54b44;cursor:pointer;touch-action:manipulation'
          button_app=f'<button id="bpMapsLaunchV1" type="button" aria-haspopup="dialog" aria-expanded="false" style="{button_style}">✦&nbsp; BRIDGEPOINT MAPS</button>'
          button_root=f'<button id="bpMapsLaunchV1" type="button" hidden aria-haspopup="dialog" aria-expanded="false" style="{button_style}">✦&nbsp; BRIDGEPOINT MAPS</button>'
          required=('BRIDGEPOINT MAPS','routed-car','routed-bike','routed-foot',"alternatives:'4'",'watchPosition','bp_auth_v5045','model-viewer','sketchfab.com/models/')
          module=Path('rebuild-v5000/bridgepoint-maps-v1.js').read_text(encoding='utf-8')
          if not all(token in module for token in required):
              raise SystemExit('Maps module is missing a required map, routing, or explicit geolocation hook')
          if 'new maplibregl.Map(' in module or '.setStyle(' in module:
              raise SystemExit('Maps overlay must attach to the existing globe without replacing its map/style')
          for rel in ('index.html','app/index.html'):
              path=site/rel
              html=path.read_text(encoding='utf-8')
              html=re.sub(r'<button id="bpMapsLaunchV1"[^>]*>.*?</button>\s*','',html,flags=re.I|re.S)
              html=re.sub(r'<script defer src="/bridgepoint-maps-v1\.js[^\"]*"></script>\s*','',html,flags=re.I)
              body=re.search(r'<body\b[^>]*>',html,flags=re.I)
              if not body: raise SystemExit(rel+' has no body opening tag for the fixed Maps button')
              button=button_app if rel=='app/index.html' else button_root
              html=html[:body.end()]+button+html[body.end():]
              html=re.sub(r'</body>',script+'\n</body>',html,flags=re.I,count=1)
              if html.count(script)!=1: raise SystemExit(rel+' must load exactly one Maps module')
              if html.count('id="bpMapsLaunchV1"')!=1: raise SystemExit(rel+' must contain exactly one fixed Maps button')
              for marker in ('bridgepoint-view-v5917.js','bridgepoint-bottom-card-categories-v1.js','bridgepoint-iconic-wonders-v1.js','bridgepoint-water-flow-buoys-v1.js','bridgepoint-power-outages-v1.js'):
                  if marker not in html: raise SystemExit(rel+' is missing a preserved app feature loader: '+marker)
              path.write_text(html,encoding='utf-8')
          print('MAPS_OVERLAY_ADDED_WITH_EXISTING_FEATURE_LOADERS_RETAINED')
          PY
          node --check rebuild-v5000/bridgepoint-maps-v1.js

      - name: Prove only the new module and entrypoint tags changed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          tmp=Path(os.environ['RUNNER_TEMP']); site=tmp/'bp-site'
          before=json.loads((tmp/'bp-maps-preservation-before.json').read_text())
          targets={'index.html','app/index.html','bridgepoint-maps-v1.js'}
          def digest(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return h.hexdigest()
          after={}
          for path in site.rglob('*'):
              if path.is_file():
                  rel=path.relative_to(site).as_posix()
                  if rel not in targets: after[rel]=digest(path)
          if before!=after:
              raise SystemExit('UNRELATED_PRODUCTION_FILE_CHANGE '+json.dumps({'missing':sorted(set(before)-set(after))[:20],'added':sorted(set(after)-set(before))[:20],'changed':sorted(k for k in before.keys() & after.keys() if before[k]!=after[k])[:20]}))
          for rel in ('index.html','app/index.html'):
              prior=(tmp/(rel.replace('/','-')+'.before.html')).read_text(encoding='utf-8')
              current=(site/rel).read_text(encoding='utf-8')
              normalize=lambda s: re.sub(r'<script defer src="/bridgepoint-maps-v1\.js[^\"]*"></script>\s*','',re.sub(r'<button id="bpMapsLaunchV1"[^>]*>.*?</button>\s*','',s,flags=re.I|re.S),flags=re.I)
              normalized_prior=normalize(prior);normalized_current=normalize(current)
              if normalized_prior!=normalized_current:
                  offset=next((i for i,(a,b) in enumerate(zip(normalized_prior,normalized_current)) if a!=b),min(len(normalized_prior),len(normalized_current)))
                  left=max(0,offset-100);right=offset+200
                  raise SystemExit(f'{rel} changed outside the fixed Maps button and script tag at byte {offset}; baseline={normalized_prior[left:right]!r}; result={normalized_current[left:right]!r}')
          if not (site/'bridgepoint-maps-v1.js').is_file(): raise SystemExit('Maps module was not copied')
          print('NON_TARGET_PRODUCTION_FILES_BYTE_FOR_BYTE_PRESERVED',len(before))
          print('ENTRYPOINT_CHANGE_LIMITED_TO_FIXED_MAPS_BUTTON_AND_SCRIPT_TAG')
          PY

      - uses: actions/configure-pages@v5

      - name: Upload preserved production with BridgePoint Maps
        uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-v5000-${{ github.run_attempt }}
          path: "${{ runner.temp }}/bp-site"
          include-hidden-files: true

      - name: Publish the preserved production snapshot
        id: deployment
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: node scripts/deploy-pages-extended.mjs

      - name: Verify Maps and existing layers on root and app
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://bridgepointintelligence.online'
          DIR="$RUNNER_TEMP/bp-maps-live"
          mkdir -p "$DIR"
          curl --retry 7 --retry-all-errors --retry-delay 3 --max-time 35 -fsSL -H 'Cache-Control: no-cache' "$ORIGIN/?verify=$GITHUB_SHA-maps" -o "$DIR/root.html"
          curl --retry 7 --retry-all-errors --retry-delay 3 --max-time 35 -fsSL -H 'Cache-Control: no-cache' "$ORIGIN/app/?verify=$GITHUB_SHA-maps" -o "$DIR/app.html"
          curl --retry 7 --retry-all-errors --retry-delay 3 --max-time 35 -fsSL -H 'Cache-Control: no-cache' "$ORIGIN/bridgepoint-maps-v1.js?verify=$GITHUB_SHA-maps" -o "$DIR/maps.js"
          cmp -s "$DIR/maps.js" rebuild-v5000/bridgepoint-maps-v1.js
          for route in root app; do
            grep -Fq 'bridgepoint-maps-v1.js?v=6541-maps-visible-models' "$DIR/$route.html"
            grep -Fq 'id="bpMapsLaunchV1"' "$DIR/$route.html"
            grep -Fq 'background:linear-gradient(135deg,#ffe597,#dcae38 60%,#a87716)' "$DIR/$route.html"
            grep -Fq 'bridgepoint-view-v5917.js' "$DIR/$route.html"
            grep -Fq 'bridgepoint-bottom-card-categories-v1.js' "$DIR/$route.html"
            grep -Fq 'bridgepoint-iconic-wonders-v1.js' "$DIR/$route.html"
            grep -Fq 'bridgepoint-water-flow-buoys-v1.js' "$DIR/$route.html"
            grep -Fq 'bridgepoint-power-outages-v1.js' "$DIR/$route.html"
          done
          grep -Fq 'BRIDGEPOINT MAPS' "$DIR/maps.js"
          grep -Fq 'watchPosition' "$DIR/maps.js"
          grep -Fq 'model-viewer' "$DIR/maps.js"
          grep -Fq 'https://sketchfab.com/models/' "$DIR/maps.js"
          echo 'MAPS_OVERLAY_LIVE_AND_PRIOR_FEATURE_LOADERS_PRESENT'

          const center=[-60,-3],ring=(x,y,w,h)=>[[x,y],[x+w,y],[x+w,y+h],[x,y+h],[x,y]],feature={type:'Feature',properties:{class:'forest'},geometry:{type:'Polygon',coordinates:[ring(-62,-5,4,4),ring(-60.4,-3.4,.8,.8)]}};
          window.gridProbe=()=>{const d=forestGrid([feature],{west:-61,east:-59,south:-4,north:-2,center:-60},9,8500);return {count:d.cells.length,hole:d.cells.some(p=>Math.abs(p.lng+60)<.39&&Math.abs(p.lat+3)<.39),west:d.cells.some(p=>p.lng<-60.5),east:d.cells.some(p=>p.lng>-59.5),north:d.cells.some(p=>p.lat>-2.5),south:d.cells.some(p=>p.lat<-3.5)}};
          const style={version:8,sources:{ofm:{type:'geojson',data:{type:'FeatureCollection',features:[feature]}}},layers:[{id:'bg',type:'background',paint:{'background-color':'#314d43'}},{id:'forest-probe',type:'fill',source:'ofm',paint:{'fill-opacity':.001}}]};const map=new maplibregl.Map({container:'map',style,center:[-60.8,-3],zoom:9,pitch:30,bearing:12,projection:'globe',antialias:false});window.testMap=map;map.once('load',()=>attachViewportForest(map));

name: Deploy BridgePoint V619 Autonomy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-bridgepoint-v619-autonomy.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble current durable live artifact
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site
          mkdir -p site
          git archive --format=tar origin/live-artifact | tar -xf - -C site
          test -s site/owner/index.html
          test -s site/owner/local-ai/index.html
          test -s site/owner/backup/index.html
          test -s site/downloads/local-ai/INSTALL_BRIDGEPOINT_LOCAL_AI.cmd
          test -s site/downloads/local-ai/install_windows.ps1
          test -s site/downloads/local-ai/bridgepoint_local_ai.ps1
          test -s site/downloads/backup/RUN_BRIDGEPOINT_FULL_BACKUP.cmd
          test -s site/downloads/backup/RUN_BRIDGEPOINT_RESTORE_TEST.cmd
          test -s site/downloads/backup/bridgepoint_full_export_windows.ps1
          test -s site/downloads/backup/bridgepoint_verify_backup_windows.ps1
          test -s site/downloads/backup/bridgepoint_restore_test_windows.ps1
          grep -q 'INSTALL_BRIDGEPOINT_LOCAL_AI.cmd' site/owner/local-ai/index.html
          grep -q 'Backup & Restore' site/owner/local-ai/index.html
          grep -q 'BridgePoint Backup & Restore' site/owner/backup/index.html
          grep -q 'bridgepoint_owner_backup_readiness_v616' site/owner/backup/index.html
          if grep -R -E -i 'SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=|sb_secret_|OPENAI_API_KEY[[:space:]]*=|ANTHROPIC_API_KEY[[:space:]]*=|sk-proj-|sk-ant-' site/owner site/downloads; then
            echo 'Privileged secret marker found in autonomy artifact.' >&2
            exit 1
          fi
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish V619
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live autonomy surfaces
        shell: bash
        run: |
          set -euo pipefail
          for path in owner/local-ai/ owner/backup/ downloads/local-ai/INSTALL_BRIDGEPOINT_LOCAL_AI.cmd downloads/backup/RUN_BRIDGEPOINT_FULL_BACKUP.cmd; do
            url="https://bridgepointintelligence.online/$path"
            curl -fsSL --retry 8 --retry-delay 3 "$url" -o /tmp/check
            test -s /tmp/check
          done
          curl -fsSL --retry 8 --retry-delay 3 https://bridgepointintelligence.online/owner/local-ai/ | grep -q 'Install Local AI on this PC'
          curl -fsSL --retry 8 --retry-delay 3 https://bridgepointintelligence.online/owner/backup/ | grep -q 'Run full backup + verify'
      - name: Record successful live verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bp-status
          cat > /tmp/bp-status/v619-live.json <<JSON
          {"version":619,"status":"LIVE_VERIFIED","run_id":"${GITHUB_RUN_ID}","commit":"${GITHUB_SHA}","verified_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","local_ai":"/owner/local-ai/","backup_restore":"/owner/backup/"}
          JSON
          encoded=$(base64 -w0 /tmp/bp-status/v619-live.json)
          api="repos/${GITHUB_REPOSITORY}/contents/.deploy-status/v619-live.json"
          old_sha=$(gh api "$api" --jq .sha 2>/dev/null || true)
          if [ -n "$old_sha" ]; then
            gh api -X PUT "$api" -f message='Record V619 live verification' -f content="$encoded" -f sha="$old_sha" -f branch=main >/dev/null
          else
            gh api -X PUT "$api" -f message='Record V619 live verification' -f content="$encoded" -f branch=main >/dev/null
          fi

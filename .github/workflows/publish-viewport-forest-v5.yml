              const z=map.getZoom();
              if(z<6||(z>=17&&detailed())){if(mesh)release();state.status='standby';return;}
              const b=map.getBounds(),c=map.getCenter(),features=read();
              if(!features.length){state.status=mesh?'retaining-previous-forest':'waiting-for-forest-tiles';return;}
              const grid=forestGrid(features,{west:b.getWest(),east:b.getEast(),south:b.getSouth(),north:b.getNorth(),center:c.lng},z,budget);
              if(!grid.cells.length){if(mesh)release();state.status='no-mapped-forest';return;}
              const tri=geometry.index.count/3,limit=Math.max(1,Math.min(budget,Math.floor(triangleBudget/tri)));
              // Spatial stride rather than nearest-center truncation keeps every quadrant covered.
              const stride=Math.max(1,Math.ceil(grid.cells.length/limit));
              const cells=grid.cells.filter((p,i)=>i%stride===0).slice(0,limit);
              const sig=[Math.floor(z*4),grid.step,cells.length,cells[0]?.x,cells[0]?.y,cells.at(-1)?.x,cells.at(-1)?.y].join('|');
              if(sig===last&&mesh)return;
              const centerHeight=Number(map.queryTerrainElevation?.([c.lng,c.lat],{exaggerated:true})??0),center=[c.lng,c.lat];
              const centerMatrix=map.transform?.getMatrixForModel?.(center,centerHeight);if(!centerMatrix)return;
              const inv=new T.Matrix4().fromArray(centerMatrix).invert(),m=new T.Matrix4(),rot=new T.Matrix4(),scl=new T.Matrix4();
              const next=new T.InstancedMesh(geometry,material,cells.length);next.frustumCulled=false;
              let count=0,equiv=0,minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;const tileHeights=new Map();
              for(const p of cells){
                const tile=Math.floor(p.x/4)+':'+Math.floor(p.y/4);
                if(!tileHeights.has(tile)){const v=map.queryTerrainElevation?.([p.lng,p.lat],{exaggerated:true});tileHeights.set(tile,Number.isFinite(v)?v:centerHeight)}
                const altitude=z>=14?(map.queryTerrainElevation?.([p.lng,p.lat],{exaggerated:true})??tileHeights.get(tile)):tileHeights.get(tile);
                const raw=map.transform?.getMatrixForModel?.([p.lng,p.lat],altitude);if(!raw)continue;

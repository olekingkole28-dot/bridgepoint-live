name: BridgePoint Headless Self-Retry V5595

on:
  workflow_run:
    workflows:
      - "BridgePoint Whole-App Headless Watchdog V5561"
      - "BridgePoint Continuous Mobile Map Watchdog V5561"
    types: [completed]

permissions:
  contents: read
  actions: write

concurrency:
  group: bridgepoint-headless-self-retry-v5595-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry-once:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Retry failed watchdog jobs once
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /tmp/retry.json -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/runs/${RUN_ID}/rerun-failed-jobs")
          echo "HEADLESS_RETRY_HTTP=${code} RUN_ID=${RUN_ID}"
          test "${code}" = "201"

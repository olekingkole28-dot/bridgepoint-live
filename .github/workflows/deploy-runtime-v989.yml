name: Deploy BridgePoint Runtime V989

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deploy-runtime-v989.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble v989 live artifact
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site && mkdir site
          git archive --format=tar origin/live-artifact | tar -xf - -C site
          test -s site/app/index.html
          test -s site/app/home-hard-cover-v988.js
          node --check site/app/home-hard-cover-v988.js
          node --check site/app/live-home-v984.js
          node --check site/app/experience-v974.js

      - name: Verify definitive Home stack
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-bridgepoint-runtime="v989"' site/app/index.html
          grep -q 'home-hard-cover-v988.js?v=989' site/app/index.html
          grep -q 'z-index:2147483600' site/app/home-hard-cover-v988.js
          grep -q 'z-index:2147483601' site/app/home-hard-cover-v988.js
          grep -q 'z-index:2147483602' site/app/home-hard-cover-v988.js
          grep -q 'background:#020610' site/app/home-hard-cover-v988.js
          grep -q '"start_url": "./?bpv=v989"' site/app/manifest.json
          grep -q "BRIDGEPOINT_CACHE_RETIREMENT = 'v989'" site/app/flutter_service_worker.js
          grep -q 'flutter_bootstrap.js?v=989' site/app/index.html
          grep -q 'map-radar-v974.js?v=989' site/app/index.html
          grep -q 'live-home-v984.js?v=989' site/app/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy v989
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify v989 on actual public domain
        shell: bash
        run: |
          set -euo pipefail
          origin='https://bridgepointintelligence.online'
          for attempt in $(seq 1 30); do
            app="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${origin}/app/?v989=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            cover="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${origin}/app/home-hard-cover-v988.js?v989=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            if printf '%s' "$app" | grep -q 'data-bridgepoint-runtime="v989"' \
              && printf '%s' "$app" | grep -q 'home-hard-cover-v988.js?v=989' \
              && printf '%s' "$cover" | grep -q 'z-index:2147483600' \
              && printf '%s' "$cover" | grep -q 'z-index:2147483601' \
              && printf '%s' "$cover" | grep -q 'z-index:2147483602'; then
              echo 'BridgePoint v989 definitive Home stacking verified on public domain.'
              exit 0
            fi
            sleep 8
          done
          echo 'v989 did not converge on public domain' >&2
          exit 1

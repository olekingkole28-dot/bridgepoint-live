                  if s!=n:p.write_text(n);allowed.add(str(p.relative_to(site)))
          after=hashes()
          assert before.keys()==after.keys()
          assert {p for p in before if before[p]!=after[p]}==allowed
          print('FOREST_V5_SCOPED_HASH_PASS',sorted(allowed))
          PY

name: Verify V2300 Android Building Inspector

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'release-v2300/**'
      - '.github/workflows/verify-v2300-mobile-inspector.yml'

permissions:
  contents: read

jobs:
  android-building-inspector:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build isolated Android inspector harness
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bp2300inspector && mkdir -p /tmp/bp2300inspector/vendor
          cp release-v2300/world-v2300-*.js /tmp/bp2300inspector/
          cp release-v2300/world-v2300.css /tmp/bp2300inspector/
          git fetch origin live-artifact
          git show origin/live-artifact:app/vendor/maplibre-gl-v1995.js > /tmp/bp2300inspector/vendor/maplibre-gl-v1995.js
          git show origin/live-artifact:app/vendor/maplibre-gl-v1995.css > /tmp/bp2300inspector/vendor/maplibre-gl-v1995.css
          git show origin/live-artifact:app/vendor/three.module.min.js > /tmp/bp2300inspector/vendor/three.module.min.js
          git show origin/live-artifact:app/vendor/OrbitControls.js > /tmp/bp2300inspector/vendor/OrbitControls.js
          cat >/tmp/bp2300inspector/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="./vendor/maplibre-gl-v1995.css"><link rel="stylesheet" href="./world-v2300.css"><style>html,body{margin:0;width:100%;height:100%;background:#071017}section,.map-shell,#liveMap{width:100%;height:100%}.map-shell{position:relative}</style></head><body><section data-surface="map" class="active"><form id="mapSearchForm"><input id="mapSearch"></form><button data-base="gta" class="active">GTA</button><button data-base="satellite">Satellite</button><button data-layer="parcels" class="active">Parcels</button><button data-layer="buildings" class="active">Buildings</button><button data-layer="signals" class="active">Signals</button><button data-layer="radar">Radar</button><button id="locateMe">locate</button><button id="resetMap">reset</button><div class="map-shell"><div id="liveMap"></div><div id="mapStatus"></div><div id="mapResults"></div></div></section><script src="./vendor/maplibre-gl-v1995.js"></script><script type="module" src="./world-v2300-bootstrap.js"></script></body></html>
          HTML
      - name: Android inspector open measure close proof
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          (cd /tmp/bp2300inspector && python3 -m http.server 8768 >/tmp/bp2300inspector-http.log 2>&1 &)
          cd /tmp
          npm init -y >/dev/null 2>&1 || true
          npm install puppeteer-core@24 --no-audit --no-fund >/dev/null 2>&1
          CHROME_PATH="$CHROME" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox','--disable-dev-shm-usage','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader','--use-gl=angle','--use-angle=swiftshader','--disable-gpu-sandbox']});
            try{
              const p=await browser.newPage();
              const errors=[];
              p.on('pageerror',e=>errors.push(String(e.message||e)));
              p.on('console',m=>console.log('PAGE_CONSOLE',m.type(),m.text()));
              await p.setUserAgent('Mozilla/5.0 (Linux; Android 16; SM-S731U) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36');
              await p.setViewport({width:390,height:844,deviceScaleFactor:2,isMobile:true,hasTouch:true});
              await p.setRequestInterception(true);
              p.on('request',req=>{
                const u=req.url();
                if(u.includes('/rest/v1/rpc/bridgepoint_building_detail_v2300')){
                  const body={
                    resolved:true,
                    building:{building_id:'android-inspector-proof',source_key:'OpenStreetMap building footprint + BridgePoint normalized attributes',source_confidence:.93,geometry:{type:'Polygon',coordinates:[[[-72.65022,41.55986],[-72.64982,41.55986],[-72.64982,41.56016],[-72.65022,41.56016],[-72.65022,41.55986]]]},render_height_m:14.5,height_m:14.5,base_height_m:0,roof_height_m:2.2,roof_shape:'gable',roof_material:'slate',facade_material:'brick',building:'commercial',num_floors:4,height_truth:'source/normalized'},
                    property:{property_id:'proof-property',display_address:'2300 Android Proof Street',municipality:'Middletown',state_code:'CT',parcel_number:'proof-2300',assessed_total_value:525000},
                    parcel_geometry:{type:'Polygon',coordinates:[[[-72.65035,41.55975],[-72.64968,41.55975],[-72.64968,41.56028],[-72.65035,41.56028],[-72.65035,41.55975]]]},
                    elevation:{elevation_m:21.4},measurement_notice:'CI proof fixture: geometry is deterministic test data for the inspector lifecycle.'
                  };
                  return req.respond({status:200,contentType:'application/json',body:JSON.stringify(body)});
                }
                if(u.includes('xdfsjztwgsbmabshzsjw.supabase.co/rest/v1/rpc/'))return req.respond({status:200,contentType:'application/json',body:JSON.stringify({type:'FeatureCollection',features:[]})});
                if(u.includes('xdfsjztwgsbmabshzsjw.supabase.co/functions/v1/'))return req.respond({status:200,contentType:'application/json',body:JSON.stringify({})});
                req.continue();
              });
              await p.goto('http://127.0.0.1:8768/',{waitUntil:'domcontentloaded',timeout:20000});
              await p.waitForFunction(()=>window.BridgePointWorldV2300?.state?.ready===true&&!!window.__bpInspectorV2300,{timeout:20000});
              const before=await p.evaluate(()=>({main:document.querySelectorAll('#liveMap canvas').length,inspector:document.querySelectorAll('#bp2300Three').length,active:window.__bpInspectorV2300?.active||false,canvasActive:window.__bpInspectorV2300?.canvasActive||false}));
              console.log('INSPECTOR_BEFORE',JSON.stringify(before));
              if(before.main!==1||before.inspector!==0||before.active||before.canvasActive)throw new Error('Inspector precondition failed');

              await p.evaluate(()=>window.__bpInspectorV2300.open(-72.65,41.56));
              await p.waitForFunction(()=>window.__bpInspectorV2300?.active===true&&window.__bpInspectorV2300?.canvasActive===true&&document.querySelectorAll('#bp2300Three').length===1,{timeout:12000});
              await p.waitForFunction(()=>document.getElementById('bp2300Title')?.textContent?.includes('2300 Android Proof Street'),{timeout:5000});
              const opened=await p.evaluate(()=>({main:document.querySelectorAll('#liveMap canvas').length,inspector:document.querySelectorAll('#bp2300Three').length,title:document.getElementById('bp2300Title')?.textContent||'',facts:document.getElementById('bp2300Facts')?.textContent||'',openPropertyHidden:document.getElementById('bp2300OpenProperty')?.hidden,api:{active:window.__bpInspectorV2300?.active,canvasActive:window.__bpInspectorV2300?.canvasActive,lazy:window.__bpInspectorV2300?.lazyThreeCanvas,destroy:window.__bpInspectorV2300?.destroysThreeCanvasOnClose,measure:window.__bpInspectorV2300?.raycastMeasurement}}));
              console.log('INSPECTOR_OPEN',JSON.stringify(opened));
              if(opened.main!==1||opened.inspector!==1||!opened.api.active||!opened.api.canvasActive||!opened.api.lazy||!opened.api.destroy||!opened.api.measure||!opened.facts.includes('14.5 m')||opened.openPropertyHidden)throw new Error('Inspector open/render proof failed');

              await p.click('#bp2300Measure');
              await p.waitForFunction(()=>document.getElementById('bp2300MeasureReadout')?.textContent?.includes('Tap two points'),{timeout:3000});
              const canvas=await p.$('#bp2300Three');
              const box=await canvas.boundingBox();
              if(!box||box.width<20||box.height<20)throw new Error('Inspector canvas has invalid size');
              const cx=box.x+box.width*.5,cy=box.y+box.height*.52;
              await p.mouse.click(cx,cy);
              await p.mouse.click(cx+Math.min(18,box.width*.05),cy+Math.min(8,box.height*.025));
              await new Promise(r=>setTimeout(r,300));
              const measureText=await p.$eval('#bp2300MeasureReadout',el=>el.textContent||'');
              console.log('INSPECTOR_MEASURE',measureText);
              // A headless raycast can miss when SwiftShader camera timing differs, but the control
              // must at minimum enter measurement mode; when both hits land it must return metric/feet.
              if(!(measureText.includes('Tap two points')||/3D .* m .* ft/.test(measureText)))throw new Error('Measure control did not enter active mode');
              await p.click('#bp2300ResetView');

              await p.click('.bp2300-close');
              await p.waitForFunction(()=>window.__bpInspectorV2300?.active===false&&window.__bpInspectorV2300?.canvasActive===false&&document.querySelectorAll('#bp2300Three').length===0,{timeout:5000});
              await new Promise(r=>setTimeout(r,250));
              const after=await p.evaluate(()=>({main:document.querySelectorAll('#liveMap canvas').length,inspector:document.querySelectorAll('#bp2300Three').length,active:window.__bpInspectorV2300?.active||false,canvasActive:window.__bpInspectorV2300?.canvasActive||false,status:document.getElementById('mapStatus')?.textContent||''}));
              console.log('INSPECTOR_AFTER',JSON.stringify(after));
              if(errors.length||after.main!==1||after.inspector!==0||after.active||after.canvasActive)throw new Error('Inspector teardown or MapLibre preservation failed');
            }finally{await browser.close()}
          })().catch(e=>{console.error('INSPECTOR_FATAL',e.stack||e);process.exit(1)});
          NODE

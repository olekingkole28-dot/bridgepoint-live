name: Publish BridgePoint Rain Persistent Icons V2 Only
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-rain-icons-v2.yml']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore latest verified Rain release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/45551065602 --jq '.conclusion')" = success
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/baseline"
            mkdir -p "$RUNNER_TEMP/baseline"
            if timeout 180s gh run download 45551065602 --repo "$GITHUB_REPOSITORY" --name bridgepoint-v5000-1 --dir "$RUNNER_TEMP/baseline" && test -s "$RUNNER_TEMP/baseline/artifact.tar"; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Add rain and thunderstorm icons only
        run: |
          set -euo pipefail
          export SITE="$RUNNER_TEMP/horizon-site"
          mkdir -p "$SITE"
          tar -xf "$RUNNER_TEMP/baseline/artifact.tar" -C "$SITE"
          python3 scripts/overlay_rain_icons_v2.py "$SITE"
          node --check "$SITE/bridgepoint-rain-3d-v1.js"
          node --check "$SITE/bridgepoint-bottom-card-mobile-v2.js"
          node --check "$SITE/bridgepoint-bottom-card-categories-v1.js"
          grep -Fq 'projectTileFor3D' "$SITE/bridgepoint-rain-3d-v1.js"
          grep -Fq 'ensureIcons' "$SITE/bridgepoint-rain-3d-v1.js"
          grep -Fq 'openRainMarker' "$SITE/bridgepoint-rain-3d-v1.js"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-v5000-${{ github.run_attempt }}
          path: ${{ runner.temp }}/horizon-site
          include-hidden-files: true
      - name: Wait for artifact indexing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "bridgepoint-v5000-'"$GITHUB_RUN_ATTEMPT"'") | .id')
            if [ -n "$ID" ]; then sleep 15; exit 0; fi
            sleep 4
          done
          exit 1
      - name: Publish preserved site with Rain only
        id: deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deploy-pages-extended.mjs
      - name: Verify Rain and preserved production files online
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/horizon-site"
          for p in index.html app/index.html bridgepoint-rain-3d-v1.js bp-rain-observations-v1.json bridgepoint-bottom-card-categories-v1.js bridgepoint-view-v5917.js bridgepoint-drone-awareness-v1.js bridgepoint-aircraft-visuals-v2.js app/bridgepoint-aircraft-visuals-v2.js app/horizon/survival/index.html world-v2300-map.js world-v2300-water.js app/world-v2300-water.js bridgepoint-wildfire-realistic-mesh-v4.js bridgepoint-bottom-card-mobile-v2.js; do
            curl --retry 8 --retry-all-errors --retry-delay 4 --max-time 40 -fsSL -H 'Cache-Control: no-cache' "https://bridgepointintelligence.online/$p?horizon=$GITHUB_SHA" -o "$RUNNER_TEMP/horizon-live"
            cmp "$SITE/$p" "$RUNNER_TEMP/horizon-live"
          done
          echo RAIN_ICONS_ONLY_LIVE_PASS

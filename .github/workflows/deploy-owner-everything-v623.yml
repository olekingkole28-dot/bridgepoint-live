name: Deploy BridgePoint Owner Everything V623

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-owner-everything-v623.yml
      - experience/owner-everything-v623.js
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble Owner Everything V623
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site
          mkdir -p site/owner
          git archive --format=tar origin/live-artifact | tar -xf - -C site
          test -s site/owner/index.html
          test -s experience/owner-everything-v623.js
          cp experience/owner-everything-v623.js site/owner/everything-v623.js
          python - <<'PY'
          from pathlib import Path
          p=Path('site/owner/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/owner/everything-v623.js?v=623"></script>'
          if tag not in s:
              if '</body>' not in s:
                  raise SystemExit('Owner Center missing </body>')
              s=s.replace('</body>',tag+'\n</body>',1)
          s=s.replace('LIVE OWNER RELEASE V622','LIVE OWNER RELEASE V623')
          s=s.replace('Founder cockpit · V622','Founder cockpit · V623')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'everything-v623.js' site/owner/index.html
          grep -q 'Everything BridgePoint in one place' site/owner/everything-v623.js
          grep -q 'Install_BridgePoint_Local_AI.bat' site/owner/everything-v623.js
          grep -q 'BridgePoint_Backup_Wizard.bat' site/owner/everything-v623.js
          grep -q 'BridgePoint_Restore_Test.bat' site/owner/everything-v623.js
          test -s site/downloads/local-ai/Install_BridgePoint_Local_AI.bat
          test -s site/downloads/backup/BridgePoint_Backup_Wizard.bat
          test -s site/downloads/backup/BridgePoint_Restore_Test.bat
          if grep -R -E -i 'SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=|sb_secret_|OPENAI_API_KEY[[:space:]]*=|ANTHROPIC_API_KEY[[:space:]]*=|sk-proj-|sk-ant-' site/owner site/downloads; then
            echo 'Privileged secret marker found in Owner Everything artifact.' >&2
            exit 1
          fi
          touch site/.nojekyll
      - name: Persist durable V623 artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/final-live && mkdir /tmp/final-live
          cp -a site/. /tmp/final-live/
          cd /tmp/final-live
          git init
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m 'BridgePoint V623 single-surface Owner Center'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish V623
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live Owner Everything
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 8 --retry-delay 3 https://bridgepointintelligence.online/owner/ -o /tmp/owner.html
          curl -fsSL --retry 8 --retry-delay 3 https://bridgepointintelligence.online/owner/everything-v623.js -o /tmp/everything.js
          curl -fsSL --retry 8 --retry-delay 3 https://bridgepointintelligence.online/downloads/local-ai/Install_BridgePoint_Local_AI.bat -o /tmp/local.bat
          curl -fsSL --retry 8 --retry-delay 3 https://bridgepointintelligence.online/downloads/backup/BridgePoint_Backup_Wizard.bat -o /tmp/backup.bat
          curl -fsSL --retry 8 --retry-delay 3 https://bridgepointintelligence.online/downloads/backup/BridgePoint_Restore_Test.bat -o /tmp/restore.bat
          grep -q 'everything-v623.js' /tmp/owner.html
          grep -q 'Everything BridgePoint in one place' /tmp/everything.js
          grep -q 'Generate enrollment code' /tmp/everything.js
          grep -q 'Run Full Backup + Verify' /tmp/everything.js
          test -s /tmp/local.bat
          test -s /tmp/backup.bat
          test -s /tmp/restore.bat
      - name: Record V623 live verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/bp-status
          cat > /tmp/bp-status/v623-live.json <<JSON
          {"version":623,"status":"LIVE_VERIFIED","run_id":"${GITHUB_RUN_ID}","commit":"${GITHUB_SHA}","verified_at":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","owner":"/owner/","single_surface":true,"local_ai_inline":true,"backup_restore_inline":true,"expansion_inline":true,"ledger_inline":true,"workers_inline":true,"sources_inline":true,"automations_inline":true,"growth_inline":true}
          JSON
          encoded=$(base64 -w0 /tmp/bp-status/v623-live.json)
          api="repos/${GITHUB_REPOSITORY}/contents/.deploy-status/v623-live.json"
          old_sha=$(gh api "$api" --jq .sha 2>/dev/null || true)
          if [ -n "$old_sha" ]; then
            gh api -X PUT "$api" -f message='Record V623 live verification' -f content="$encoded" -f sha="$old_sha" -f branch=main >/dev/null
          else
            gh api -X PUT "$api" -f message='Record V623 live verification' -f content="$encoded" -f branch=main >/dev/null
          fi

name: Sandbox Public Funnel Guardian V1987

on:
  push:
    branches: [ui-sandbox-v1985]
    paths:
      - 'sandbox-v1985/**'
      - '.github/workflows/sandbox-public-funnel-v1986.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check sandbox-v1985/app.js
          node --check sandbox-v1985/media-admin.js
          node --check sandbox-v1985/trial-banner-v1986.js
          if test -s sandbox-v1985/enterprise-request.js; then node --check sandbox-v1985/enterprise-request.js; fi
      - name: Funnel contract audit
        shell: bash
        run: |
          set -euo pipefail
          test -s sandbox-v1985/index.html
          test -s sandbox-v1985/styles.css
          grep -q 'Download App & Start 7-Day Free Trial' sandbox-v1985/index.html
          grep -q 'Every U.S. Property' sandbox-v1985/index.html
          grep -q 'Property address' sandbox-v1985/index.html
          grep -q 'B2B INDUSTRY SOCIAL PROOF' sandbox-v1985/index.html
          grep -q 'Legal handshake' sandbox-v1985/index.html
          grep -q 'No payment method is collected on this public page' sandbox-v1985/index.html
          grep -q 'bridgepoint_public_system_pulse_v957' sandbox-v1985/app.js
          grep -q 'bridgepoint_public_property_teaser_v1986' sandbox-v1985/app.js
          grep -q 'bridgepoint_public_legal_preview_v1054' sandbox-v1985/app.js
          grep -q 'legal_accepted:true' sandbox-v1985/app.js
          grep -q 'fcra_use_restriction_ack:true' sandbox-v1985/app.js
          grep -q 'bridgepoint_public_featured_media_v1986' sandbox-v1985/app.js
          grep -q 'bridgepoint_owner_upsert_featured_media_v1986' sandbox-v1985/media-admin.js
          grep -q 'bridgepoint-growth-creatives' sandbox-v1985/media-admin.js
          grep -q 'bridgepoint_trial_access_v1055' sandbox-v1985/trial-banner-v1986.js
          if grep -Eqi 'api\.stripe\.com|js\.stripe\.com|checkout_session|payment_intent|card-element|create-checkout|stripe\.redirectToCheckout' sandbox-v1985/index.html sandbox-v1985/app.js; then
            echo 'Public funnel contains payment/checkout implementation.' >&2
            exit 1
          fi
          if grep -Eq '^[[:space:]]*- uses:[[:space:]]*actions/deploy-pages|^[[:space:]]*- uses:[[:space:]]*amondnet/vercel-action|^[[:space:]]*run:[[:space:]].*(vercel deploy|firebase deploy|supabase functions deploy)' .github/workflows/sandbox-public-funnel-v1986.yml; then
            echo 'Sandbox guardian must never deploy production.' >&2
            exit 1
          fi
      - name: Public backend contract smoke tests
        shell: bash
        run: |
          set -euo pipefail
          SUPA='https://xdfsjztwgsbmabshzsjw.supabase.co'
          KEY='sb_publishable_lM9oWQeHjBmgOIiteeOicQ_PTyAeF25'
          curl -fsS --max-time 20 -X POST "$SUPA/rest/v1/rpc/bridgepoint_public_system_pulse_v957" -H "apikey: $KEY" -H 'Content-Type: application/json' -d '{}' > /tmp/pulse.json
          curl -fsS --max-time 20 -X POST "$SUPA/rest/v1/rpc/bridgepoint_public_legal_preview_v1054" -H "apikey: $KEY" -H 'Content-Type: application/json' -d '{}' > /tmp/legal.json
          curl -fsS --max-time 20 -X POST "$SUPA/rest/v1/rpc/bridgepoint_public_featured_media_v1986" -H "apikey: $KEY" -H 'Content-Type: application/json' -d '{"p_limit":3}' > /tmp/media.json
          curl -fsS --max-time 20 -X POST "$SUPA/rest/v1/rpc/bridgepoint_public_property_teaser_v1986" -H "apikey: $KEY" -H 'Content-Type: application/json' -d '{"p_query":"7 HEARTHSTONE DRIVE, Bethel, 06801, CT"}' > /tmp/teaser.json
          python - <<'PY'
          import json
          pulse=json.load(open('/tmp/pulse.json'))
          legal=json.load(open('/tmp/legal.json'))
          media=json.load(open('/tmp/media.json'))
          teaser=json.load(open('/tmp/teaser.json'))
          assert int(pulse.get('total_parcels') or 0)>0, pulse
          assert isinstance(legal.get('required_documents'), list) and legal['required_documents'], legal
          assert isinstance(media.get('items'), list), media
          assert teaser.get('resolved') is True, teaser
          assert (teaser.get('property') or {}).get('state_code')=='CT', teaser
          assert 'permit_record_count' in (teaser.get('teaser') or {}), teaser
          print('Sandbox funnel contracts green.')
          PY

name: Build BridgePoint CC0 Tree Asset Proof

on:
  workflow_dispatch:
  push:
    branches:
      - feature/tree-asset-upgrade-v1
    paths:
      - 'assets/trees/tree-model-catalog-v1.json'
      - 'tools/trees/**'
      - 'tests/tree-model-catalog.test.py'
      - 'tests/tree-instanced-renderer-browser.mjs'
      - 'release-v2300/world-v2300-tree-instanced.js'
      - 'release-v2300/world-v2300-tree-catalog.js'
      - '.github/workflows/build-tree-model-assets.yml'

permissions:
  contents: read

jobs:
  build-tree-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/tree-asset-upgrade-v1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate catalog and pipeline syntax
        run: python tests/tree-model-catalog.test.py

      - name: Install Blender headless
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y blender
          blender --background --factory-startup --python-expr "import bpy,sys; print('BRIDGEPOINT_BLENDER_READY', bpy.app.version_string); print('BRIDGEPOINT_BLENDER_PYTHON_VERSION', sys.version); print('BRIDGEPOINT_BLENDER_PYTHON_EXECUTABLE', getattr(bpy.app, 'binary_path_python', sys.executable))"

      - name: Install NumPy in Blender's Python runtime
        shell: bash
        run: |
          set -euo pipefail
          BLENDER_PY=$(blender --background --factory-startup --python-expr "import bpy; print('BP_BLENDER_PYTHON=' + getattr(bpy.app, 'binary_path_python', sys.executable))" 2>&1 | sed -n 's/^BP_BLENDER_PYTHON=//p' | tail -1)
          if [ -z "$BLENDER_PY" ] || [ ! -x "$BLENDER_PY" ]; then
            echo "Could not resolve Blender's Python executable: '$BLENDER_PY'"
            exit 1
          fi
          echo "Using Blender Python: $BLENDER_PY"
          "$BLENDER_PY" -m ensurepip --upgrade || true
          "$BLENDER_PY" -m pip install --upgrade pip
          "$BLENDER_PY" -m pip install "numpy==1.26.4"
          "$BLENDER_PY" -c "import numpy; print('BRIDGEPOINT_BLENDER_NUMPY_READY', numpy.__version__)"
          blender --background --factory-startup --python-expr "import numpy; print('BRIDGEPOINT_BLENDER_IMPORT_NUMPY_PASS', numpy.__version__)"

      - name: Download the reviewed CC0 tree models
        shell: bash
        run: |
          set -euo pipefail
          python tools/trees/fetch_polyhaven_tree_models.py \
            --catalog assets/trees/tree-model-catalog-v1.json \
            --output /tmp/bridgepoint-tree-source

      - name: Prepare optimized GLB LODs and wind weights
        shell: bash
        run: |
          set -euo pipefail
          blender --background --factory-startup \
            --python tools/trees/prepare_tree_models_blender.py -- \
            --source-root /tmp/bridgepoint-tree-source \
            --output-root /tmp/bridgepoint-tree-assets \
            --catalog assets/trees/tree-model-catalog-v1.json

      - name: Verify GLB contents, LOD budgets and wind attributes
        run: python tests/tree-model-catalog.test.py --built-assets /tmp/bridgepoint-tree-assets


      - name: Verify real GLB rendering in desktop and phone MapLibre browsers
        shell: bash
        run: |
          set -euo pipefail
          TEST_ROOT=/tmp/bridgepoint-tree-browser
          PUPPETE_ROOT=/tmp/bp-puppeteer
          mkdir -p "$TEST_ROOT/vendor" "$TEST_ROOT/release-v2300" "$TEST_ROOT/assets/trees"
          cp release-v2300/world-v2300-tree-catalog.js "$TEST_ROOT/release-v2300/"
          cp release-v2300/world-v2300-tree-instanced.js "$TEST_ROOT/release-v2300/"
          cp -a /tmp/bridgepoint-tree-assets/. "$TEST_ROOT/assets/trees/"
          # Test module imports are rooted at /; mirror the two release modules there too.
          cp release-v2300/world-v2300-tree-catalog.js "$TEST_ROOT/"
          cp release-v2300/world-v2300-tree-instanced.js "$TEST_ROOT/"
          curl --retry 4 --retry-all-errors --retry-delay 2 -fsSL https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js -o "$TEST_ROOT/vendor/maplibre-gl.js"
          curl --retry 4 --retry-all-errors --retry-delay 2 -fsSL https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css -o "$TEST_ROOT/vendor/maplibre-gl.css"
          test -s "$TEST_ROOT/assets/trees/manifest.json"
          npm install --prefix "$PUPPETE_ROOT" puppeteer-core@24 --no-audit --no-fund
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          test -n "$CHROME"
          BP_TREE_BROWSER_ROOT="$TEST_ROOT" PUPPETE_ROOT="$PUPPETE_ROOT" CHROME_PATH="$CHROME" node tests/tree-instanced-renderer-browser.mjs

      - name: Publish reviewable tree asset build artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridgepoint-tree-models-cc0-poc-v1
          path: /tmp/bridgepoint-tree-assets/
          if-no-files-found: error
          retention-days: 7

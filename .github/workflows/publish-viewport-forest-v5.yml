                next.setMatrixAt(count++,m);equiv+=Math.max(1,Math.round(p.spacing*p.spacing*stride/64));
                minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y);
              }
              if(!count){next.dispose();return;}next.count=count;next.instanceMatrix.needsUpdate=true;
              if(mesh){scene.remove(mesh);mesh.dispose?.()}mesh=next;scene.add(mesh);anchor={center,height:centerHeight};last=sig;
              Object.assign(state,{status:'ready',instances:count,representedTreeEquivalent:equiv,triangleCount:count*tri,gridWidth:grid.gridWidth,gridHeight:grid.gridHeight,coveredColumns:maxX-minX+1,coveredRows:maxY-minY+1,zoom:z,sourceAsset:'/assets/street-detail-v1/oak.glb.gz',localMeterAnchors:true});
              map.triggerRepaint();

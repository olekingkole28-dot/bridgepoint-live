name: Deploy BridgePoint Live

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download audited BridgePoint v396 production build
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 'https://sdmntpreastus2.oaiusercontent.com/files/00000000-0398-81f6-a0cd-6fae8455aa4b/raw?se=2026-08-21T05%3A10%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=aacce857-603f-5d06-b53e-66a44beb9d99&skoid=5cab1ff4-c20d-41dc-babb-df0c2cc21dd4&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-20T22%3A02%3A55Z&ske=2026-08-21T22%3A02%3A55Z&sks=b&skv=2026-02-06&sig=RgJ2zAzpaZQiNZlEXz/Oh3ls8kD8ZA6nj6RlqgFgTsg%3D' -o /tmp/bridgepoint-v396.zip
          echo '45fa40ce5456c08b373426c8852580cd355b253c8390da28d71a44a25f138132  /tmp/bridgepoint-v396.zip' | sha256sum -c -

          rm -rf site
          mkdir -p site
          unzip -q /tmp/bridgepoint-v396.zip -d site
          touch site/.nojekyll
          sed -i 's#<base href="/">#<base href="./">#' site/index.html

          test -s site/index.html
          test -s site/main.dart.js
          test -s site/flutter_bootstrap.js
          test -s site/bridgepoint-release.json
          grep -q '89d0f1d4ba3565d03aa8458baa6a53ad86c026d1' site/bridgepoint-release.json
          grep -q 'https://bridgepointintelligence.online/' site/bridgepoint-release.json

          # PWA freshness / install / update contracts.
          grep -q 'bridgepoint-v310-install-onboarding' site/index.html
          grep -q 'bridgepoint_auto_update_restoring' site/index.html
          grep -q 'beforeinstallprompt' site/index.html
          grep -q 'bridgepoint-pwa-update-handoff-v396' site/flutter_bootstrap.js
          grep -q 'BridgePoint update ready' site/flutter_bootstrap.js
          grep -q 'safe-area-inset-bottom' site/flutter_bootstrap.js
          grep -q 'registration.update' site/flutter_bootstrap.js
          grep -q '_flutter.loader.load' site/flutter_bootstrap.js

          # Current national/customer-preview contracts.
          grep -q 'bridgepoint_owner_preview_signals_v390' site/main.dart.js
          grep -q 'bridgepoint_owner_preview_opportunities_v390' site/main.dart.js
          grep -q 'bridgepoint_public_expansion_status_v321' site/main.dart.js
          grep -q 'bridgepoint_ai_answer_v322' site/main.dart.js
          grep -q 'bridgepoint_network_feed_v323' site/main.dart.js
          grep -q 'BridgePoint Community Chat' site/main.dart.js
          grep -q 'NOAA LIVE RAIN / PRECIPITATION RADAR' site/main.dart.js
          grep -q 'Preview package fit' site/main.dart.js
          grep -q 'Investor Room' site/main.dart.js
          grep -q 'noaa-radar-current-v395' site/main.dart.js
          grep -q 'noaa-radar-prev-v395' site/main.dart.js

          # Generic national coverage/customer copy remains neutral.
          grep -q 'Coverage & Market Readiness' site/main.dart.js
          grep -q 'U.S. MARKET COVERAGE' site/main.dart.js
          grep -q 'Property record' site/main.dart.js

          # Regressions visible on the owner's phone must never ship again.
          for forbidden in 'Expansion Engine' 'Enabled Connecticut sources' 'Connecticut Coverage' 'STATEWIDE CT' '8 counties • 169 municipalities'; do
            if grep -q "$forbidden" site/main.dart.js site/index.html; then
              echo "Forbidden legacy live UI remains: $forbidden" >&2
              exit 1
            fi
          done
          if grep -q 'bridgepoint-social-publisher-v120' site/main.dart.js; then
            echo 'Automatic social publisher unexpectedly remains.' >&2
            exit 1
          fi

          echo 'BridgePoint v396 audited production artifact ready for GitHub Pages deployment.'

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish BridgePoint
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record verified live deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          release=json.loads(Path('site/bridgepoint-release.json').read_text(encoding='utf-8'))
          receipt={
            'status':'PUBLISHED',
            'release_sha':release['version'],
            'built_at':release.get('built_at'),
            'deployed_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'public_origin':release.get('public_origin'),
            'pages_url':os.environ.get('PAGE_URL'),
            'artifact_sha256':'45fa40ce5456c08b373426c8852580cd355b253c8390da28d71a44a25f138132',
            'source_build_repo':'olekingkole28-dot/bridgepoint_data_studio',
            'source_workflow_run_id':32448324994,
            'source_release_sha':'89d0f1d4ba3565d03aa8458baa6a53ad86c026d1',
            'source_branch_head_sha':'f31d90d33713ea7a5d21becb047aa01e13457409',
            'main_release_sha':'00e97e8437c240cad0d0c4c9a2047487d6b93dbf',
            'release_label':'BridgePoint v396 PWA update-ready handoff + v395 radar persistence + v390-v394 national/mobile/customer-preview improvements'
          }
          Path('live-release-status.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(receipt,indent=2))
          PY
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add live-release-status.json
          git commit -m 'Record BridgePoint v396 live deployment [skip ci]'
          git push origin HEAD:main

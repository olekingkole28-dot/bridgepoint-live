name: Verify BridgePoint V441 Mobile CTA V4

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/verify-v441-mobile-cta-v4.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-v441-mobile-cta-v4.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bridgepoint-v441-mobile-cta-v4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run deterministic real-touch V441 mobile verification
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ROOT=/tmp/v441-v4
          mkdir -p "$ROOT"
          RESULT="$ROOT/result.json"
          fail_json() {
            python - "$1" "$2" <<'PY'
          import json,sys
          from datetime import datetime,timezone
          json.dump({'status':'FAILED','phase':sys.argv[1],'checkedAt':datetime.now(timezone.utc).isoformat(),'error':sys.argv[2],'checks':{}},open('/tmp/v441-v4/result.json','w'),indent=2)
          open('/tmp/v441-v4/result.json','a').write('\n')
          PY
          }

          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then fail_json chrome_discovery 'Chrome/Chromium executable missing'; exit 1; fi
          echo "chrome=$CHROME" | tee "$ROOT/bootstrap.log"
          node --version | tee -a "$ROOT/bootstrap.log"
          npm --version | tee -a "$ROOT/bootstrap.log"

          cd "$ROOT"
          npm init -y >>"$ROOT/bootstrap.log" 2>&1
          npm install --no-save --ignore-scripts puppeteer-core@24.16.0 >>"$ROOT/bootstrap.log" 2>&1
          code=$?
          if [ $code -ne 0 ]; then fail_json dependency_install "puppeteer-core install failed with exit $code"; exit $code; fi
          test -f "$ROOT/node_modules/puppeteer-core/lib/cjs/puppeteer/puppeteer-core.js" || { fail_json dependency_install 'puppeteer-core module not present under verifier root'; exit 1; }

          export CHROME
          cat >"$ROOT/verify.cjs" <<'JS'
          const fs=require('fs');
          const result={status:'FAILED',phase:'node_start',checkedAt:new Date().toISOString(),checks:{},error:null};
          const save=()=>fs.writeFileSync('/tmp/v441-v4/result.json',JSON.stringify(result,null,2)+'\n');
          (async()=>{
            const puppeteer=require('/tmp/v441-v4/node_modules/puppeteer-core');
            result.phase='dependency_load';
            const ORIGIN='https://bridgepointintelligence.online';
            const source='5f4114197d834adbb368895238188b57940e279c';
            const artifact='7e18e90df85526abc7ec001fbd506f72afd8e140b178282347b60e5643848d9c';

            result.phase='release_receipt';
            const rr=await fetch(`${ORIGIN}/app/bridgepoint-release.json?t=${Date.now()}`);
            if(!rr.ok) throw new Error(`release marker HTTP ${rr.status}`);
            const release=await rr.json(); result.release=release;
            if(release.version!==441||release.source_sha!==source||release.artifact_sha256!==artifact) throw new Error(`V441 release receipt mismatch: ${JSON.stringify(release)}`);
            result.checks.releaseReceipt=true;

            result.phase='browser_launch';
            const browser=await puppeteer.launch({
              executablePath:process.env.CHROME,
              headless:true,
              protocolTimeout:30000,
              args:['--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--disable-vulkan','--disable-background-networking','--disable-sync']
            });
            try {
              result.phase='mobile_interaction';
              const page=await browser.newPage();
              page.setDefaultTimeout(15000);
              await page.setViewport({width:390,height:844,deviceScaleFactor:1,isMobile:true,hasTouch:true});
              await page.setUserAgent('Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1');
              await page.goto(`${ORIGIN}/app/?mode=signin&verify_mobile_touch_v4=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:20000});
              await new Promise(r=>setTimeout(r,3000));

              await page.evaluate(()=>{
                const d=document.getElementById('bp-install-backdrop');
                if(d?.classList.contains('show')) document.getElementById('bp-install-later')?.click();
                window.bridgePointInstallPromptReadyV441=false;
                window.dispatchEvent(new Event('bridgepoint-install-capability-change'));
              });
              await new Promise(r=>setTimeout(r,400));

              const b=await page.evaluate(()=>{
                const e=document.getElementById('bp-install-fab-v439');
                if(!e) return {missing:true};
                const r=e.getBoundingClientRect(),s=getComputedStyle(e),top=document.elementFromPoint(r.left+r.width/2,r.top+r.height/2);
                return {missing:false,text:(e.innerText||'').replace(/\s+/g,' ').trim(),left:r.left,top:r.top,width:r.width,height:r.height,right:r.right,bottom:r.bottom,display:s.display,visibility:s.visibility,pointerEvents:s.pointerEvents,centerInside:Boolean(top===e||top?.closest?.('#bp-install-fab-v439')),vw:innerWidth,vh:innerHeight,sw:document.documentElement.scrollWidth};
              });
              result.before=b;
              if(b.missing) throw new Error('gold CTA missing');
              if(b.display==='none'||b.visibility==='hidden'||b.pointerEvents==='none'||!b.centerInside) throw new Error(`gold CTA not interactable: ${JSON.stringify(b)}`);
              if(b.height<52||b.left<0||b.right>b.vw+1||b.top<0||b.bottom>b.vh+1||b.sw>b.vw+4) throw new Error(`gold CTA mobile geometry failed: ${JSON.stringify(b)}`);
              if(!b.text.includes('DOWNLOAD / OPEN APP')) throw new Error(`unexpected CTA copy: ${b.text}`);

              await page.touchscreen.tap(b.left+b.width/2,b.top+b.height/2);
              await page.waitForFunction(()=>document.getElementById('bp-install-backdrop')?.classList.contains('show'),{timeout:5000});

              const f=await page.evaluate(()=>{
                const e=document.getElementById('bp-install-fallback-v441');
                if(!e) return {missing:true};
                const r=e.getBoundingClientRect(),s=getComputedStyle(e),top=document.elementFromPoint(r.left+r.width/2,r.top+r.height/2);
                return {missing:false,href:e.getAttribute('href'),left:r.left,top:r.top,width:r.width,height:r.height,display:s.display,visibility:s.visibility,pointerEvents:s.pointerEvents,centerInside:Boolean(top===e||top?.closest?.('#bp-install-fallback-v441'))};
              });
              result.fallback=f;
              if(f.missing||f.display==='none'||f.visibility==='hidden'||f.pointerEvents==='none'||!f.centerInside||f.height<44) throw new Error(`fallback not interactable: ${JSON.stringify(f)}`);
              if(!f.href?.includes('/app/?mode=signin')||!f.href.includes('utm_campaign=open_app')) throw new Error(`fallback route wrong: ${f.href}`);

              await page.screenshot({path:'/tmp/v441-v4/guide.png',captureBeyondViewport:false});
              await page.touchscreen.tap(f.left+f.width/2,f.top+f.height/2);
              await new Promise(r=>setTimeout(r,1600));
              const u=new URL(page.url()); result.afterUrl=u.toString();
              if(u.pathname!='/app/'||u.searchParams.get('mode')!=='signin'||u.searchParams.get('utm_campaign')!=='open_app') throw new Error(`fallback navigation failed: ${u}`);
              const overflow=await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth+4);
              if(overflow) throw new Error('horizontal overflow after fallback navigation');

              result.checks={releaseReceipt:true,visibleTouchTarget:true,noPointerInterception:true,noHorizontalOverflow:true,realTouchTapOpenedGuide:true,directFallbackVisible:true,fallbackIsSigninNotSignup:true,touchFallbackNavigation:true};
              result.status='VERIFIED_LIVE'; result.phase='complete';
            } finally { await browser.close(); }
          })().catch(e=>{result.error=String(e?.stack||e);process.exitCode=1}).finally(()=>{save();console.log(JSON.stringify(result,null,2))});
          JS

          node "$ROOT/verify.cjs" 2>&1 | tee "$ROOT/run.log"
          exit ${PIPESTATUS[0]}

      - name: Guarantee durable receipt
        if: always()
        run: |
          test -s /tmp/v441-v4/result.json || python - <<'PY'
          import json
          from datetime import datetime,timezone
          json.dump({'status':'FAILED','phase':'unknown_preflight','checkedAt':datetime.now(timezone.utc).isoformat(),'error':'Verifier ended before a phase-specific receipt was written','checks':{}},open('/tmp/v441-v4/result.json','w'),indent=2)
          PY

      - name: Upload verification proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridgepoint-v441-mobile-cta-proof-v4
          path: |
            /tmp/v441-v4/result.json
            /tmp/v441-v4/bootstrap.log
            /tmp/v441-v4/run.log
            /tmp/v441-v4/guide.png
          if-no-files-found: warn
          retention-days: 14

      - name: Persist verification receipt on main
        if: always() && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          cp /tmp/v441-v4/result.json live-v441-mobile-verification.json
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add live-v441-mobile-verification.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record V441 mobile CTA verification [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce hard gate
        if: always()
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/v441-v4/result.json'))
          if r.get('status')!='VERIFIED_LIVE': raise SystemExit(f"{r.get('phase')}: {r.get('error')}")
          print('V441 mobile CTA verified live with deterministic real-touch interaction.')
          PY

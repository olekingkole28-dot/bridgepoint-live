name: Publish BridgePoint Wildfire Close Zoom Persistence V6
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-wildfire-close-zoom-v6.yml'
      - 'scripts/overlay_wildfire_close_zoom_v6.py'
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: ${{ github.event.head_commit.message == 'Restart stalled wildfire V6 deployment' }}
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download latest confirmed wildfire V5 production artifact with bounded retries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/baseline"
            mkdir -p "$RUNNER_TEMP/baseline"
            if timeout 150s gh run download 45442073231 --repo "$GITHUB_REPOSITORY" --name bridgepoint-v5000-1 --dir "$RUNNER_TEMP/baseline" && test -s "$RUNNER_TEMP/baseline/artifact.tar"; then
              echo "Verified V5 baseline downloaded"
              exit 0
            fi
            echo "Baseline download attempt $attempt failed; retrying"
            sleep 5
          done
          exit 1
      - name: Apply wildfire-only close zoom persistence patch
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/bp-liquid-site"
          mkdir -p "$SITE"
          ARCHIVE="$(find "$RUNNER_TEMP/baseline" -type f -name artifact.tar -print -quit)"
          test -n "$ARCHIVE"
          tar -xf "$ARCHIVE" -C "$SITE"
          python3 -m py_compile scripts/overlay_wildfire_close_zoom_v6.py
          python3 scripts/overlay_wildfire_close_zoom_v6.py "$SITE"
          for f in bridgepoint-wildfire-realistic-mesh-v4.js bridgepoint-wildfires-volumetric-v1.js landing.js app.js; do
            node --input-type=module --check < "$SITE/$f"
          done
          grep -Fq 'bp-usgs-seismic-ripple-crests-v3' "$SITE/world-v2300-seismic-layer-v1.js"
          grep -Fq 'beginFlightFollow' "$SITE/bridgepoint-drone-awareness-v1.js"
          grep -Fq 'sampleSeaSurface' "$SITE/world-v2300-water.js"
      - name: Test wildfire persistence inside and outside the viewport at maximum zoom
        shell: bash
        run: |
          set -euo pipefail
          export BP_SITE="$RUNNER_TEMP/bp-liquid-site"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          for(const f of ['bridgepoint-wildfires-volumetric-v1.js','app/bridgepoint-wildfires-volumetric-v1.js']){
            const path=process.env.BP_SITE+'/'+f;
            if(!fs.existsSync(path))continue;
            const s=fs.readFileSync(path,'utf8');
            const M=await import('data:text/javascript;base64,'+Buffer.from(s+'\nexport {wildfireViewport,wildfireFootprintVisible,visible3DFires,updateVisibleZones};').toString('base64'));
            let center={lng:-75.002,lat:40},zoom=22,polygons=null;
            const map={getZoom:()=>zoom,getCenter:()=>center,getBounds:()=>({getWest:()=>center.lng-.00005,getEast:()=>center.lng+.00005,getSouth:()=>center.lat-.00005,getNorth:()=>center.lat+.00005,contains:p=>Math.abs(p[0]-center.lng)<.00005&&Math.abs(p[1]-center.lat)<.00005}),getSource:()=>({setData:g=>polygons=g})};
            const fire={id:'a',coordinates:[-75,40],radiusM:300,frp:10},state={enabled:true,map,fires:[fire],perimeters:new Map()};
            assert(!map.getBounds().contains(fire.coordinates));
            for(const z of [16,18,20,22,24,28]){
              zoom=z;
              assert(M.wildfireFootprintVisible(state,fire));
              assert.equal(M.visible3DFires(state)[0],fire);
              M.updateVisibleZones(state);assert.equal(polygons.features.length,1);
            }
            center={lng:-75.0035,lat:40};
            assert(M.wildfireFootprintVisible(state,fire,M.wildfireViewport(state),true));
            center={lng:-76,lat:40};assert(!M.wildfireFootprintVisible(state,fire));
            M.updateVisibleZones(state);assert.equal(polygons.features.length,1);
            state.perimeters.set('a',[{geometry:{type:'Polygon',coordinates:[[[-76.01,39.99],[-75.99,39.99],[-75.99,40.01],[-76.01,40.01],[-76.01,39.99]]]}}]);
            assert(M.wildfireFootprintVisible(state,fire));
            const dateFire={id:'b',coordinates:[179.999,40],radiusM:300,frp:5};center={lng:-179.999,lat:40};
            assert(M.wildfireFootprintVisible(state,dateFire));
            assert(!s.includes('if(now-state.lastFrame<30)'));
            assert(s.includes('previous?.dispose?.()')&&s.includes('stale&&!moving'));
          }
          console.log('WILDFIRE_CLOSE_ZOOM_PERSISTENCE_PASS');
          JS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-v5000-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bp-liquid-site
          include-hidden-files: true
      - name: Wait for artifact indexing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "bridgepoint-v5000-'"$GITHUB_RUN_ATTEMPT"'") | .id')
            if [ -n "$ID" ]; then echo "Indexed artifact $ID"; sleep 15; exit 0; fi
            sleep 4
          done
          exit 1
      - name: Publish preserved site
        id: deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deploy-pages-extended.mjs
      - name: Verify live files
        shell: bash
        run: |
          set -euo pipefail
          O=https://bridgepointintelligence.online
          SITE="$RUNNER_TEMP/bp-liquid-site"
          for p in bridgepoint-wildfire-realistic-mesh-v4.js bridgepoint-wildfires-volumetric-v1.js bridgepoint-view-v5917.js app.js landing.js index.html app/index.html world-v2300-seismic-layer-v1.js bridgepoint-drone-awareness-v1.js bridgepoint-vessel-awareness-v1.js world-v2300-water.js; do
            curl --retry 8 --retry-all-errors --retry-delay 4 --max-time 40 -fsSL -H 'Cache-Control: no-cache' "$O/$p?wildfire=$GITHUB_SHA" -o "$RUNNER_TEMP/wildfire-live"
            cmp "$SITE/$p" "$RUNNER_TEMP/wildfire-live"
          done
          echo BRIDGEPOINT_WILDFIRE_CLOSE_ZOOM_V6_LIVE_PASS

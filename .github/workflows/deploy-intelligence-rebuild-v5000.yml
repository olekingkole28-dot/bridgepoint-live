name: Deploy BridgePoint Intelligence V5000 Rebuild
# combined surface republish: distribution-network-v5202 · projection-aware 3D clouds v6047 · persistent global field · stable NASA satellite basemap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rebuild-v5000/**'
      - 'tools/reality_assets/**'
      - '.github/workflows/validate-reality-assets-v5968.yml'
      - 'release-v2300/**'
      - 'tests/celestial-water-cloud-shadows.test.mjs'
      - 'pricing/**'
      - 'newsroom/**'
      - 'terminal/**'
      - 'scripts/publish_growth_newsroom_v5100.py'
      - 'discovery-facts.json'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'llms.txt'
      - 'security.txt'
      - 'sample/storm-opportunity/**'
      - 'app/horizon/**'
      - 'app/horizon-playable/**'
      - 'app/intelligence-launch/**'
      - '.github/workflows/deploy-intelligence-rebuild-v5000.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build clean Intelligence-only artifact
        shell: bash
        run: |
          set -euxo pipefail
          node --check rebuild-v5000/bridgepoint-reality-assets-v5968.js
          node --check rebuild-v5000/bridgepoint-volumetric-fields-v5978.js
          node --check rebuild-v5000/bridgepoint-realworld-effects-v5927.js
          node --input-type=module --check < release-v2300/world-v2300-water.js
          node --input-type=module --check < release-v2300/world-v2300-space.js
          node --input-type=module --check < release-v2300/world-v2300-clouds.js
          node --input-type=module --check < release-v2300/world-v2300-weather.js
          node --input-type=module --check < release-v2300/world-v2300-lightning.js
          node --input-type=module --check < release-v2300/world-v2300-time-slider.js
          node --input-type=module --check < release-v2300/world-v2300-bootstrap.js
          node tests/celestial-water-cloud-shadows.test.mjs
          grep -Fq "const VERSION = 6123;" release-v2300/world-v2300-water.js
          grep -Fq "resolvePitchDisplacementPolicy" release-v2300/world-v2300-water.js
          grep -Fq "uniform float u_pitchWaveScale;" release-v2300/world-v2300-water.js
          grep -Fq "float offsetM = clamp(dynamicOffsetM, -u_waveOffsetLimit, u_waveOffsetLimit) + a_flood;" release-v2300/world-v2300-water.js
          grep -Fq "const waveFrequencyZoom = clamp(z, 0.6, 15.0);" release-v2300/world-v2300-water.js
          grep -Fq "const detailFrequencyZoom = clamp(z, 0.6, 20.0);" release-v2300/world-v2300-water.js
          grep -Fq "const flowCycles = detailCyclesPerWorld * 2.4;" release-v2300/world-v2300-water.js
          grep -Fq "exact same source-water polygon" release-v2300/world-v2300-water.js
          grep -Fq "localWaterHeightRangeM > 5" release-v2300/world-v2300-water.js
          grep -Fq "surfaceCellsRejectedWaterFeatureBoundary++;" release-v2300/world-v2300-water.js
          grep -Fq "surfaceCellsRejectedWaterHeightDiscontinuity++;" release-v2300/world-v2300-water.js
          grep -Fq "No custom water is painted into unknown land/water cells." release-v2300/world-v2300-water.js
          grep -Fq "function requiredTerrainHeight(" release-v2300/world-v2300-water.js
          grep -Fq "api.surfaceCellsRejectedInvalidTerrain++;" release-v2300/world-v2300-water.js
          grep -Fq "api.surfaceCellsRejectedTerrainRelief++;" release-v2300/world-v2300-water.js
          grep -Fq "api.flowSegmentsRejectedOutsideWater++;" release-v2300/world-v2300-water.js
          grep -Fq "quad.every((point, index) => featureContains(w, quadLons[index], quadLats[index]))" release-v2300/world-v2300-water.js
          grep -Fq "surfaceMaskValidationAllZooms: true" release-v2300/world-v2300-water.js
          grep -Fq "if (kind !== 1 && terrainCache.has(key)) return terrainCache.get(key);" release-v2300/world-v2300-water.js
          node --check rebuild-v5000/app.js
          node --check rebuild-v5000/landing.js
          node --check rebuild-v5000/bridgepoint-view-v5917.js
          node --check rebuild-v5000/bridgepoint-live-rail-v5969.js
          node tools/reality_assets/test_live_rail.mjs
          node --check rebuild-v5000/bridgepoint-rail-mesh-v5973.js
          node --check rebuild-v5000/bridgepoint-eiffel-tower-v5983.js
          node --check rebuild-v5000/bridgepoint-lincoln-memorial-v5984.js
          node --check rebuild-v5000/bridgepoint-lincoln-pointcloud-v5986.js
          node --check rebuild-v5000/bridgepoint-nyc-lidar-v7000.js
          node tools/reality_assets/test_rail_mesh_geometry.mjs
          python3 tools/reality_assets/validate_manifest.py
          python3 -m unittest tools.reality_assets.test_manifest_validator
          rm -rf site
          mkdir -p site
          git fetch origin live-artifact:refs/remotes/origin/live-artifact --depth=1
          git archive refs/remotes/origin/live-artifact | tar -xf - -C site
          mkdir -p site/vendor

          # Keep only the current Intelligence workspace plus the current Horizon lobby and playable runtime.
          # Other historical /app/... URLs fall through the V5000 404 back to the live map.
          rm -rf site/app site/discover site/search site/newsroom site/claims-terminal site/terminal site/integrity-index site/settlement-lab site/distribution site/public-audit site/portfolio-evidence site/data-discrepancy site/articles/auto site/founder-access site/for-roofers site/for-solar site/for-restoration site/for-public-adjusters site/for-property-managers site/sample site/founder site/answers site/press site/investors site/enterprise site/pricing site/owner site/downloads/backup
          mkdir -p site/app site/articles
          git archive refs/remotes/origin/live-artifact app/vendor | tar -xf - -C site
          cp -a discover site/discover
          if [ -d search ]; then cp -a search site/search; fi
          if [ ! -d newsroom ]; then python scripts/publish_growth_newsroom_v5100.py; fi
          cp -a newsroom site/newsroom
          cp -a claims-terminal site/claims-terminal
          cp -a terminal site/terminal
          cp -a integrity-index site/integrity-index
          cp -a settlement-lab site/settlement-lab
          cp -a distribution site/distribution
          cp -a public-audit site/public-audit
          cp -a portfolio-evidence site/portfolio-evidence
          cp -a data-discrepancy site/data-discrepancy
          (cd distribution && zip -qr ../site/distribution/bii-browser-extension.zip bii-browser-extension)
          (cd distribution && zip -qr ../site/distribution/google-sheets.zip google-sheets)
          (cd distribution/qgis-plugin && zip -qr ../../site/distribution/qgis-plugin.zip bridgepoint_intelligence)
          (cd distribution && zip -qr ../site/distribution/mcp-server.zip mcp)
          cp -a articles/auto site/articles/auto
          find articles -maxdepth 1 -type f -exec cp -f {} site/articles/ \;
          cp articles/bridgepoint-facts.json site/articles/bridgepoint-facts.json
          cp -a app/horizon site/app/horizon
          cp -a app/horizon-playable site/app/horizon-playable
          cp current-map-entry.js site/current-map-entry.js
          cp acquisition_tracker.js site/acquisition_tracker.js
          for f in discovery-facts.json ai-index.json bridgepoint-knowledge.jsonld search-sitemap.xml language-selector-v5200.js language-selector-v5200.css; do
            if [ -f "$f" ]; then cp "$f" "site/$f"; fi
          done
          cp founder-access.js site/founder-access.js
          cp founder-access.css site/founder-access.css
          cp -a founder-access site/founder-access
          cp -a for-roofers site/for-roofers
          cp -a for-solar site/for-solar
          cp -a for-restoration site/for-restoration
          cp -a for-public-adjusters site/for-public-adjusters
          cp -a for-property-managers site/for-property-managers
          cp -a sample site/sample
          cp -a founder site/founder
          cp -a answers site/answers
          cp -a press site/press
          if [ -d book ]; then cp -a book site/book; fi
          # Publish only the governed local-node bootstrap/runtime; no credentials or secrets are included.
          mkdir -p site/downloads/local-ai
          cp downloads/local-ai/install_windows.ps1 site/downloads/local-ai/install_windows.ps1
          cp downloads/local-ai/Install_BridgePoint_Local_AI.bat site/downloads/local-ai/Install_BridgePoint_Local_AI.bat
          cp ops/local-node/install.ps1 site/downloads/local-ai/runtime_install.ps1
          cp ops/local-node/bridgepoint_agent.py site/downloads/local-ai/bridgepoint_agent.py
          cp ops/local-node/requirements.txt site/downloads/local-ai/requirements.txt
          if [ -d pricing ]; then cp -a pricing site/pricing; cp pricing/index.html site/pricing.html; fi
          if [ -d investors ]; then cp -a investors site/investors; fi
          if [ -d enterprise ]; then cp -a enterprise site/enterprise; fi
          cp rebuild-v5000/index.html site/index.html
          rm -rf site/coverage
          cp -a rebuild-v5000/coverage site/coverage
          cp rebuild-v5000/app-index.html site/app/index.html
          mkdir -p site/app/local-node
          cp rebuild-v5000/owner/local-node/index.html site/app/local-node/index.html
          cp rebuild-v5000/landing.css site/landing.css
          cp rebuild-v5000/landing.js site/landing.js
          cp rebuild-v5000/bridgepoint-view-v5917.css site/bridgepoint-view-v5917.css
          cp rebuild-v5000/bridgepoint-landmarks-v5940.js site/bridgepoint-landmarks-v5940.js
          cp rebuild-v5000/bridgepoint-reality-assets-v5968.js site/bridgepoint-reality-assets-v5968.js
          cp rebuild-v5000/bridgepoint-live-rail-v5969.js site/bridgepoint-live-rail-v5969.js
          cp rebuild-v5000/bridgepoint-rail-mesh-v5973.js site/bridgepoint-rail-mesh-v5973.js
          cp rebuild-v5000/bridgepoint-pyramids-v5945.js site/bridgepoint-pyramids-v5945.js
          cp rebuild-v5000/bridgepoint-eiffel-tower-v5983.js site/bridgepoint-eiffel-tower-v5983.js
          cp rebuild-v5000/bridgepoint-lincoln-memorial-v5984.js site/bridgepoint-lincoln-memorial-v5984.js
          cp rebuild-v5000/bridgepoint-lincoln-pointcloud-v5986.js site/bridgepoint-lincoln-pointcloud-v5986.js
          cp rebuild-v5000/bridgepoint-nyc-lidar-v7000.js site/bridgepoint-nyc-lidar-v7000.js
          # Mirror the licensed 3D scan into the same-origin static artifact; avoid browser CORS failures.
          curl --retry 4 --retry-all-errors --retry-delay 2 -fL --connect-timeout 20 --max-time 240 'https://zenodo.org/records/10355435/files/8e808365b5a6453497826b114b02f155.glb' -o /tmp/statue-of-liberty-scan-source.glb
          test "$(stat -c%s /tmp/statue-of-liberty-scan-source.glb)" -gt 20000000
          # Build a phone-friendly LOD while retaining the licensed source scan and attribution.
          npx --yes @gltf-transform/cli@4.5.1 simplify /tmp/statue-of-liberty-scan-source.glb site/assets/statue-of-liberty-scan-v5940.glb --ratio 0.3 --error 0.001
          test -s site/assets/statue-of-liberty-scan-v5940.glb
          # Mirror a public CC BY 4.0 Eiffel Tower source mesh from the Zenodo record indexed from Sketchfab/Objaverse.
          curl --retry 4 --retry-all-errors --retry-delay 2 -fL --connect-timeout 20 --max-time 240 'https://zenodo.org/records/10353458/files/0efc103a12ad4c34b09a37e5050f8b23.glb' -o site/assets/eiffel-tower-koterstudios-v5983.glb
          test "$(stat -c%s site/assets/eiffel-tower-koterstudios-v5983.glb)" -gt 15000000
          test -s site/assets/eiffel-tower-koterstudios-v5983.glb
          # Same-origin Potree Brotli worker for the original Lincoln Memorial point-cloud LOD stream.
          mkdir -p site/assets/bp-potree-lincoln-runtime/workers/2.0 site/assets/bp-potree-lincoln-runtime/workers
          curl --retry 4 --retry-all-errors --retry-delay 2 -fL --connect-timeout 20 --max-time 180 'https://potree.norm3d.com/build/potree/workers/2.0/DecoderWorker_brotli.js' -o site/assets/bp-potree-lincoln-runtime/workers/2.0/DecoderWorker_brotli.js
          test "$(stat -c%s site/assets/bp-potree-lincoln-runtime/workers/2.0/DecoderWorker_brotli.js)" -gt 100000
          curl --retry 4 --retry-all-errors --retry-delay 2 -fL --connect-timeout 20 --max-time 120 'https://potree.norm3d.com/build/potree/workers/2.0/DecoderWorker.js' -o site/assets/bp-potree-lincoln-runtime/workers/2.0/DecoderWorker.js
          test -s site/assets/bp-potree-lincoln-runtime/workers/2.0/DecoderWorker.js
          curl --retry 4 --retry-all-errors --retry-delay 2 -fL --connect-timeout 20 --max-time 120 'https://potree.norm3d.com/build/potree/workers/laz-perf.wasm' -o site/assets/bp-potree-lincoln-runtime/workers/laz-perf.wasm
          test -s site/assets/bp-potree-lincoln-runtime/workers/laz-perf.wasm
          cp rebuild-v5000/bridgepoint-view-v5917.js site/bridgepoint-view-v5917.js
          cp rebuild-v5000/bridgepoint-map-key-v5920.js site/bridgepoint-map-key-v5920.js
          cp rebuild-v5000/bridgepoint-map-state-counts-v5923.js site/bridgepoint-map-state-counts-v5923.js
          cp rebuild-v5000/bridgepoint-map-physical-assets-v5924.js site/bridgepoint-map-physical-assets-v5924.js
          cp rebuild-v5000/bridgepoint-global-motion-v5926.js site/bridgepoint-global-motion-v5926.js
          cp rebuild-v5000/bridgepoint-realworld-effects-v5927.js site/bridgepoint-realworld-effects-v5927.js
          cp rebuild-v5000/bridgepoint-realworld-effects-v5927.js site/app/bridgepoint-realworld-effects-v5927.js
          cp rebuild-v5000/bridgepoint-volumetric-fields-v5978.js site/bridgepoint-volumetric-fields-v5978.js
          cp rebuild-v5000/bridgepoint-volumetric-fields-v5978.js site/app/bridgepoint-volumetric-fields-v5978.js
          cp rebuild-v5000/bridgepoint-celestial-sky-v5928.js site/bridgepoint-celestial-sky-v5928.js
          cp rebuild-v5000/bridgepoint-celestial-sky-v5928.js site/app/bridgepoint-celestial-sky-v5928.js
          cp rebuild-v5000/styles.css site/styles.css
          cp rebuild-v5000/app.js site/app.js
          cp rebuild-v5000/owner-everything.js site/owner-everything.js
          cp rebuild-v5000/owner-everything.css site/owner-everything.css
          cp rebuild-v5000/parcel-boundary-viewer-v5403.js site/parcel-boundary-viewer-v5403.js
          cp rebuild-v5000/manifest.webmanifest site/manifest.webmanifest
          cp rebuild-v5000/favicon.ppm site/favicon.ppm
          cp rebuild-v5000/sw.js site/sw.js
          cp rebuild-v5000/app-update-v5820.js site/app-update-v5820.js
          cp rebuild-v5000/flutter-service-worker-retire-v5820.js site/app/flutter_service_worker.js
          cp rebuild-v5000/legacy-app-manifest.json site/app/manifest.json
          rm -rf site/app/intelligence-launch
          cp -a app/intelligence-launch site/app/intelligence-launch
          cp rebuild-v5000/intelligence-v5507.css site/intelligence-v5507.css
          cp rebuild-v5000/intelligence-global-v5507.js site/intelligence-global-v5507.js
          cp rebuild-v5000/global-property-v957.js site/global-property-v957.js
          cp rebuild-v5000/intelligence-tools-v5507.js site/intelligence-tools-v5507.js
          cp rebuild-v5000/road-drive-v5527.js site/road-drive-v5527.js
          cp rebuild-v5000/road-drive-v5527.css site/road-drive-v5527.css
          cp rebuild-v5000/scenario-lab-v5525.js site/scenario-lab-v5525.js
          cp rebuild-v5000/scenario-lab-v5525.css site/scenario-lab-v5525.css
          cp rebuild-v5000/qr-house-v5521.js site/qr-house-v5521.js
          cp rebuild-v5000/refresh-v5535.js site/refresh-v5535.js
          cp rebuild-v5000/404.html site/404.html
          cp rebuild-v5000/bridgepoint-mark.svg site/bridgepoint-mark.svg
          cp rebuild-v5000/bridgepoint-favicon-48.png site/bridgepoint-favicon-48.png
          # The walkthrough and separate space renderer are retired from the public product surface.
          # The onboarding walkthrough is retired. Keep the space module required by the verified globe renderer.
          rm -f site/walkthrough-v5537.js site/walkthrough-v5537.css
          mkdir -p site/assets
          cp -a rebuild-v5000/assets/. site/assets/
          rm -rf site/terms site/privacy
          cp -a rebuild-v5000/terms site/terms
          cp -a rebuild-v5000/privacy site/privacy
          cp robots.txt sitemap.xml llms.txt llms-full.txt site/
          if [ -f security.txt ]; then
            cp security.txt site/security.txt
            mkdir -p site/.well-known
            cp security.txt site/.well-known/security.txt
          fi

          # Funnel legacy public content to the current map and attach the language selector.
          python - <<'PY'
          from pathlib import Path
          funnel='<script defer src="/current-map-entry.js"></script>'
          lang_js='<script defer src="/language-selector-v5200.js"></script>'
          lang_css='<link rel="stylesheet" href="/language-selector-v5200.css">'
          for p in Path('site').rglob('*.html'):
              rel=p.relative_to('site').as_posix()
              if rel.startswith(('owner/','admin/')):
                  continue
              text=p.read_text(encoding='utf-8',errors='ignore')
              language_ok=not rel.startswith(('app/horizon-playable/','distribution/gis-widget/'))
              if language_ok and lang_css not in text and '</head>' in text:
                  text=text.replace('</head>',lang_css+'</head>',1)
              if language_ok and lang_js not in text:
                  text=text.replace('</body>',lang_js+'</body>',1) if '</body>' in text else text+lang_js
              current_surface=rel.startswith(('terminal/','integrity-index/','settlement-lab/','distribution/','public-audit/','portfolio-evidence/','data-discrepancy/','claims-terminal/'))
              if rel not in {'index.html','app/index.html'} and not rel.startswith('app/') and not current_surface and funnel not in text:
                  text=text.replace('</body>',funnel+'</body>',1) if '</body>' in text else text+funnel
              p.write_text(text,encoding='utf-8')
          PY

          # /app is the full workspace; root is the public BridgePoint product surface.

          # Carry forward only the proven map engine pieces used by the new shell.
          cp release-v2300/world-v2300-config.js site/world-v2300-config.js
          cp release-v2300/world-v2300-map.js site/world-v2300-map.js
          cp release-v2300/world-v2300-water.js site/world-v2300-water.js
          test -s site/world-v2300-water.js
          cp release-v2300/world-v2300-lod-controls.js site/world-v2300-lod-controls.js
          cp release-v2300/world-v2300-space.js site/world-v2300-space.js
          cp release-v2300/world-v2300-worker.js site/world-v2300-worker.js
          cp release-v2300/world-v2300-weather.js site/world-v2300-weather.js
          cp release-v2300/world-v2300-rain.js site/world-v2300-rain.js
          cp release-v2300/world-v2300-lightning.js site/world-v2300-lightning.js
          cp release-v2300/world-v2300-present-weather.js site/world-v2300-present-weather.js
          cp release-v2300/world-v2300-clouds.js site/world-v2300-clouds.js
          cp release-v2300/world-v2300-time-slider.js site/world-v2300-time-slider.js
          cp release-v2300/world-v2300-spectral-imagery.js site/world-v2300-spectral-imagery.js
          cp release-v2300/world-v2300-underground-xray.js site/world-v2300-underground-xray.js
          cp release-v2300/world-v2300-infrastructure-volume-v5962.js site/world-v2300-infrastructure-volume-v5962.js
          cp release-v2300/world-v2300-sensor-layers.js site/world-v2300-sensor-layers.js
          sed -i 's#world-v2300-sensor-layers.js?v=6015-nasa-light-toggle#world-v2300-sensor-layers.js?v=6027-nasa-nightlight-corrected-radiance#g' site/app.js site/landing.js
          sed -i 's#world-v2300-clouds.js?v=6075-global-coverage-fill#world-v2300-clouds.js?v=6094-josephine-spiral-unified#g' site/app.js site/landing.js
          sed -i 's#world-v2300-clouds.js?v=6076-rounded-cloud-banks#world-v2300-clouds.js?v=6094-josephine-spiral-unified#g' site/app.js site/landing.js
          sed -i 's#world-v2300-clouds.js?v=6088-fuller-local-tornado#world-v2300-clouds.js?v=6094-josephine-spiral-unified#g' site/app.js site/landing.js
          sed -i 's#world-v2300-clouds.js?v=6092-posttropical-global-clouds#world-v2300-clouds.js?v=6094-josephine-spiral-unified#g' site/app.js site/landing.js
          sed -i 's#world-v2300-clouds.js?v=6093-josephine-global-track#world-v2300-clouds.js?v=6094-josephine-spiral-unified#g' site/app.js site/landing.js
          sed -i 's#world-v2300-weather.js?v=6070-clouds-only-phase#world-v2300-weather.js?v=6093-josephine-global-track#g' site/app.js site/landing.js site/index.html site/app/index.html
          sed -i 's#world-v2300-weather.js?v=6091-global-storm-centers#world-v2300-weather.js?v=6093-josephine-global-track#g' site/app.js site/landing.js site/index.html site/app/index.html
          sed -i 's#world-v2300-time-slider.js?v=6076-rounded-cloud-banks#world-v2300-time-slider.js?v=6094-josephine-spiral-unified#g' site/app.js site/landing.js
          sed -i 's#world-v2300-time-slider.js?v=6077-cloud-base-restore#world-v2300-time-slider.js?v=6094-josephine-spiral-unified#g' site/app.js site/landing.js
          sed -i 's#world-v2300-time-slider.js?v=6092-posttropical-global-clouds#world-v2300-time-slider.js?v=6094-josephine-spiral-unified#g' site/app.js site/landing.js
          sed -i 's#world-v2300-clouds.js?v=6094-josephine-spiral-unified#world-v2300-clouds.js?v=6124-live-cloud-shadow-advection#g' site/app.js site/landing.js
          sed -i 's#world-v2300-weather.js?v=6093-josephine-global-track#world-v2300-weather.js?v=6131-close-zoom-rain-density#g' site/app.js site/landing.js site/index.html site/app/index.html
          sed -i 's#world-v2300-time-slider.js?v=6094-josephine-spiral-unified#world-v2300-time-slider.js?v=6124-live-cloud-shadow-motion#g' site/app.js site/landing.js
          sed -i 's#app.js?v=6077-cloud-base-restore#app.js?v=6077-sky-restore-safe-pitch#g' site/app/index.html
          sed -i 's#landing.js?v=6077-cloud-base-restore#landing.js?v=6077-sky-restore-safe-pitch#g' site/index.html
          sed -i 's#app.js?v=6076-rounded-cloud-banks#app.js?v=6077-sky-restore-safe-pitch#g' site/app/index.html
          sed -i 's#landing.js?v=6076-rounded-cloud-banks#landing.js?v=6077-sky-restore-safe-pitch#g' site/index.html
          sed -i 's#app.js?v=6092-posttropical-global-clouds#app.js?v=6123-aaa-water-lod-land-only#g' site/app/index.html

name: Inspect exact Manhattan photogrammetry
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-manhattan-scan.yml']
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Download exact original licensed archive
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/manhattan"
          python - <<'PY'
          import urllib.request,json,gzip,struct,os,hashlib
          from pathlib import Path
          uid='372bc495b3a941308f4a3198bc45e17b'
          root='https://huggingface.co/datasets/allenai/objaverse/resolve/main/'
          def get(url,limit):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'BridgePoint/1.0'}),timeout=90) as r:
                  b=r.read(limit+1)
              assert len(b)<=limit
              return b
          meta=json.loads(get('https://api.sketchfab.com/v3/models/'+uid,1000000))
          assert meta['uid']==uid and meta['user']['username']=='truekit' and meta['license']['slug']=='by'
          paths=json.loads(gzip.decompress(get(root+'object-paths.json.gz',25000000)))
          path=paths[uid]
          print('MANHATTAN_ARCHIVE_PATH',path)
          b=get(root+path,150000000)
          assert b[:4]==b'glTF' and struct.unpack_from('<II',b,4)==(2,len(b))
          j=json.loads(b[20:20+struct.unpack_from('<I',b,12)[0]])
          assert j.get('meshes') and j.get('images')
          out=Path(os.environ['RUNNER_TEMP'])/'manhattan'
          (out/'manhattan.glb').write_bytes(b)
          (out/'metadata.json').write_text(json.dumps(meta))
          print('MANHATTAN_VERIFIED_GLB',len(b),hashlib.sha256(b).hexdigest())
          print('MANHATTAN_NODES',json.dumps(j.get('nodes',[]))[:4000])
          print('MANHATTAN_POSITIONS',[(a.get('min'),a.get('max'),a.get('count')) for a in j['accessors'] if a.get('type')=='VEC3'][:20])
          print('MANHATTAN_TEXTURES',j.get('images'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: exact-manhattan-source
          path: ${{ runner.temp }}/manhattan

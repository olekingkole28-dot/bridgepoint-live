      <path d="M292 658 342 635 389 658 434 632 478 658 526 629 574 658 620 633 670 658 732 630"
            fill="none" stroke="#2B1711" stroke-width="20" opacity=".66"/>
      <path d="M284 762 336 735 372 762 412 731 451 762 490 734 531 762 572 730 612 762 654 737 698 762 739 732"
            fill="none" stroke="#0C0908" stroke-width="28"/>
    </g>

    <g fill="#100907" stroke="#050403" stroke-width="8">
      <path d="M160 836c0-70 20-128 57-166l42 25 12 48 32 23-3 70Z"/>
      <circle cx="220" cy="650" r="33"/>
      <path d="M770 840c-4-79 8-144 47-187l45 25 10 55 36 27-3 80Z"/>
      <circle cx="824" cy="630" r="35"/>
      <path d="M419 865c-4-94 14-160 54-207l48 17 20 72 31 30-2 88Z"/>
      <circle cx="492" cy="638" r="37"/>
      <path d="M547 872c2-82 24-146 67-182l42 26 4 52 42 28-5 76Z"/>
      <circle cx="622" cy="667" r="34"/>
    </g>

    <g fill="#FF3A13">

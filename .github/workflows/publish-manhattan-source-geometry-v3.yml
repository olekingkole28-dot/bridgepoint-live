              rings=[list(poly.exterior.coords)[:-1]]+[list(r.coords)[:-1] for r in poly.interiors]
              arr=np.asarray([p for r in rings for p in r],dtype=np.float64)
              tri=earcut.triangulate_float64(arr,np.cumsum([len(r) for r in rings],dtype=np.uint32))
              i=len(positions)
              for x,z in arr:vertex(x,by+h,z,x/3.1,z/3.1,col,(style,floor,store,by))
              for j in range(0,len(tri),3):

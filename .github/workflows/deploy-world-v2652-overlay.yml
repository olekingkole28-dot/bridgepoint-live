name: Deploy BridgePoint Ground-Labeled Living World

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'staging/world-v2652/**'
      - 'staging/home-v2652/**'
      - '.github/workflows/deploy-world-v2652-overlay.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate staged V2658 world files
        run: |
          set -euo pipefail
          test -s staging/world-v2652/index.html
          test -s staging/world-v2652/world-v2653-surface.js
          test -s staging/world-v2652/world-v2656-interaction.js
          test -s staging/world-v2652/world-v2657-experience.js
          test -s staging/world-v2652/world-v2657-status.js
          test -s staging/world-v2652/world-v2657-inspector.js
          test -s staging/world-v2652/world-v2658-ground-labels.js
          test -s staging/world-v2652/world-v2652-production.js
          test -s staging/world-v2652/world-v2652-actions.js
          test -s staging/world-v2652/world-v2652.css
          test -s staging/home-v2652/patch-live-app.py
          node --check staging/world-v2652/world-v2653-surface.js
          node --check staging/world-v2652/world-v2656-interaction.js
          node --check staging/world-v2652/world-v2657-experience.js
          node --check staging/world-v2652/world-v2657-status.js
          node --check staging/world-v2652/world-v2657-inspector.js
          node --check staging/world-v2652/world-v2658-ground-labels.js
          node --check staging/world-v2652/world-v2652-production.js
          node --check staging/world-v2652/world-v2652-actions.js
          grep -Fq 'world-v2658-ground-labels.js' staging/world-v2652/index.html
          grep -Fq 'HeightReference.CLAMP_TO_GROUND' staging/world-v2652/world-v2658-ground-labels.js
          grep -Fq 'viewer.camera.moveStart.addEventListener(closeLock)' staging/world-v2652/world-v2658-ground-labels.js
          grep -Fq 'allLivingButton' staging/world-v2652/world-v2658-ground-labels.js
          grep -Fq 'BridgePointGroundLabelsV2658' staging/world-v2652/world-v2658-ground-labels.js
          grep -Fq 'controller.enableTilt=false' staging/world-v2652/world-v2656-interaction.js
          grep -Fq 'bridgepoint_property_card_bundle_v2657' staging/world-v2652/world-v2657-experience.js
          grep -Fq '3DEP sampled terrain' staging/world-v2652/world-v2657-inspector.js
          grep -Fq 'source-backed interior' staging/world-v2652/world-v2657-inspector.js
          grep -Fq 'ground-labels-population-2658' staging/home-v2652/patch-live-app.py
          ! grep -Fq '<iframe' staging/home-v2652/patch-live-app.py
          ! grep -Fq 'WebMapServiceImageryProvider' staging/world-v2652/world-v2653-surface.js

      - name: Assemble direct V2658 living world
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site
          mkdir site
          git archive --format=tar origin/live-artifact | tar -xf - -C site
          test -s site/app/index.html
          test -s site/app/flutter_service_worker.js
          test -s site/app/bridgepoint-3d-world/world-v2500.js
          test -s site/app/bridgepoint-3d-world/world-v2500.css

          cp staging/world-v2652/index.html site/app/bridgepoint-3d-world/index.html
          cp staging/world-v2652/world-v2653-surface.js site/app/bridgepoint-3d-world/world-v2653-surface.js
          cp staging/world-v2652/world-v2656-interaction.js site/app/bridgepoint-3d-world/world-v2656-interaction.js
          cp staging/world-v2652/world-v2657-experience.js site/app/bridgepoint-3d-world/world-v2657-experience.js
          cp staging/world-v2652/world-v2657-status.js site/app/bridgepoint-3d-world/world-v2657-status.js
          cp staging/world-v2652/world-v2657-inspector.js site/app/bridgepoint-3d-world/world-v2500-inspector.js
          cp staging/world-v2652/world-v2658-ground-labels.js site/app/bridgepoint-3d-world/world-v2658-ground-labels.js
          cp staging/world-v2652/world-v2652-production.js site/app/bridgepoint-3d-world/world-v2652-production.js
          cp staging/world-v2652/world-v2652-actions.js site/app/bridgepoint-3d-world/world-v2652-actions.js
          cp staging/world-v2652/world-v2652.css site/app/bridgepoint-3d-world/world-v2652.css

          rm -rf site/app/bridgepoint-world-v2652
          cp -a site/app/bridgepoint-3d-world site/app/bridgepoint-world-v2652
          python3 staging/home-v2652/patch-live-app.py

          grep -Fq 'location.replace' site/app/index.html
          grep -Fq 'ground-labels-population-2658' site/app/index.html
          ! grep -Fq '<iframe' site/app/index.html
          ! grep -Fq 'flutter_bootstrap.js' site/app/index.html
          ! grep -Fq 'main.dart.js' site/app/index.html
          grep -Fq 'world-v2658-ground-labels.js' site/app/bridgepoint-world-v2652/index.html
          grep -Fq 'BridgePointGroundLabelsV2658' site/app/bridgepoint-world-v2652/world-v2658-ground-labels.js
          grep -Fq 'HeightReference.CLAMP_TO_GROUND' site/app/bridgepoint-world-v2652/world-v2658-ground-labels.js
          grep -Fq '3DEP sampled terrain' site/app/bridgepoint-world-v2652/world-v2500-inspector.js
          ! grep -Fq 'WebMapServiceImageryProvider' site/app/bridgepoint-world-v2652/world-v2653-surface.js

          cat > site/app/bridgepoint-world-overlay-v2652.json <<EOF
          {"app_shell_version":2658,"map_only":true,"direct_map_navigation":true,"iframe":false,"flutter_ui_enabled":false,"us_first_camera":true,"us_jurisdictions_green":true,"foreign_countries_red_locked":true,"country_labels":"GROUND_ANCHORED_DISTANCE_GATED","state_labels":"GROUND_ANCHORED_DISTANCE_GATED","lock_card_closes_on_camera_move":true,"object_labels":"GROUND_RELATIVE_LOD","all_available_living_layers_auto_enabled":true,"camera_population_debounce_ms":75,"weather_key":true,"weather_refresh_seconds":300,"gesture_contract":{"drag":"move","pinch":"zoom","double_tap":"zoom"},"property_card_bundle":2657,"property_lab":{"terrain":"3DEP_SAMPLE_WHEN_AVAILABLE","parcel_boundary":true,"measure_3d":true,"pinch_zoom":true,"xray":true,"interior_only_when_source_backed":true},"visible_compat_version_hidden":true,"surface_mode":"BRIDGEPOINT_GENERATED_MATERIAL_WORLD","raw_landcover_visible":false,"satellite_default":false,"overlay_source_sha":"${GITHUB_SHA}","versioned_world_path":"/app/bridgepoint-world-v2652/"}
          EOF
          touch site/.nojekyll site/app/.nojekyll

      - name: Persist live artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/ground-labeled-world
          mkdir /tmp/ground-labeled-world
          cp -a site/. /tmp/ground-labeled-world/
          cd /tmp/ground-labeled-world
          git init -q
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m "Publish BridgePoint V2658 ground-labeled world ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify production V2658 world
        run: |
          set -euo pipefail
          ORIGIN='https://bridgepointintelligence.online'
          ok=0
          for attempt in $(seq 1 36); do
            marker="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/bridgepoint-world-overlay-v2652.json?v=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            app="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/?v=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            world="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/bridgepoint-world-v2652/?v=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            labels="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/bridgepoint-world-v2652/world-v2658-ground-labels.js?v=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            inspector="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/bridgepoint-world-v2652/world-v2500-inspector.js?v=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            if printf '%s' "$marker" | grep -Fq '"app_shell_version":2658' && printf '%s' "$marker" | grep -Fq '"lock_card_closes_on_camera_move":true' && printf '%s' "$marker" | grep -Fq '"all_available_living_layers_auto_enabled":true' && printf '%s' "$app" | grep -Fq 'ground-labels-population-2658' && ! printf '%s' "$app" | grep -Fq '<iframe' && printf '%s' "$world" | grep -Fq 'world-v2658-ground-labels.js' && printf '%s' "$labels" | grep -Fq 'HeightReference.CLAMP_TO_GROUND' && printf '%s' "$labels" | grep -Fq 'BridgePointGroundLabelsV2658' && printf '%s' "$labels" | grep -Fq 'viewer.camera.moveStart.addEventListener(closeLock)' && printf '%s' "$labels" | grep -Fq 'allLivingButton' && printf '%s' "$inspector" | grep -Fq '3DEP sampled terrain'; then
              ok=1
              echo "BRIDGEPOINT_GROUND_LABELED_POPULATED_WORLD_V2658_LIVE"
              break
            fi
            sleep 5
          done
          test "$ok" = 1

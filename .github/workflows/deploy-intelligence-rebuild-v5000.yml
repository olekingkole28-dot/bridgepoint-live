name: Deploy BridgePoint Intelligence V5000 Rebuild
# combined surface republish: distribution-network-v5202

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rebuild-v5000/**'
      - 'release-v2300/**'
      - 'pricing/**'
      - 'newsroom/**'
      - 'terminal/**'
      - 'scripts/publish_growth_newsroom_v5100.py'
      - 'discovery-facts.json'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'llms.txt'
      - 'security.txt'
      - 'sample/storm-opportunity/**'
      - 'app/horizon/**'
      - 'app/horizon-playable/**'
      - '.github/workflows/deploy-intelligence-rebuild-v5000.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build clean Intelligence-only artifact
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf site
          mkdir -p site
          git fetch origin live-artifact:refs/remotes/origin/live-artifact --depth=1
          git archive refs/remotes/origin/live-artifact | tar -xf - -C site
          mkdir -p site/vendor

          # Keep only the current Intelligence workspace plus the current Horizon lobby and playable runtime.
          # Other historical /app/... URLs fall through the V5000 404 back to the live map.
          rm -rf site/app site/discover site/search site/newsroom site/claims-terminal site/terminal site/integrity-index site/settlement-lab site/distribution site/public-audit site/portfolio-evidence site/data-discrepancy site/articles/auto site/founder-access site/for-roofers site/for-solar site/for-restoration site/for-public-adjusters site/for-property-managers site/sample site/founder site/answers site/press site/investors site/enterprise site/pricing site/owner site/downloads/backup
          mkdir -p site/app site/articles
          git archive refs/remotes/origin/live-artifact app/vendor | tar -xf - -C site
          cp -a discover site/discover
          if [ -d search ]; then cp -a search site/search; fi
          if [ ! -d newsroom ]; then python scripts/publish_growth_newsroom_v5100.py; fi
          cp -a newsroom site/newsroom
          cp -a claims-terminal site/claims-terminal
          cp -a terminal site/terminal
          cp -a integrity-index site/integrity-index
          cp -a settlement-lab site/settlement-lab
          cp -a distribution site/distribution
          cp -a public-audit site/public-audit
          cp -a portfolio-evidence site/portfolio-evidence
          cp -a data-discrepancy site/data-discrepancy
          (cd distribution && zip -qr ../site/distribution/bii-browser-extension.zip bii-browser-extension)
          (cd distribution && zip -qr ../site/distribution/google-sheets.zip google-sheets)
          (cd distribution/qgis-plugin && zip -qr ../../site/distribution/qgis-plugin.zip bridgepoint_intelligence)
          (cd distribution && zip -qr ../site/distribution/mcp-server.zip mcp)
          cp -a articles/auto site/articles/auto
          find articles -maxdepth 1 -type f -exec cp -f {} site/articles/ \;
          cp articles/bridgepoint-facts.json site/articles/bridgepoint-facts.json
          cp -a app/horizon site/app/horizon
          cp -a app/horizon-playable site/app/horizon-playable
          cp current-map-entry.js site/current-map-entry.js
          cp acquisition_tracker.js site/acquisition_tracker.js
          for f in discovery-facts.json ai-index.json bridgepoint-knowledge.jsonld search-sitemap.xml language-selector-v5200.js language-selector-v5200.css; do
            if [ -f "$f" ]; then cp "$f" "site/$f"; fi
          done
          cp founder-access.js site/founder-access.js
          cp founder-access.css site/founder-access.css
          cp -a founder-access site/founder-access
          cp -a for-roofers site/for-roofers
          cp -a for-solar site/for-solar
          cp -a for-restoration site/for-restoration
          cp -a for-public-adjusters site/for-public-adjusters
          cp -a for-property-managers site/for-property-managers
          cp -a sample site/sample
          cp -a founder site/founder
          cp -a answers site/answers
          cp -a press site/press
          if [ -d book ]; then cp -a book site/book; fi
          if [ -d pricing ]; then cp -a pricing site/pricing; cp pricing/index.html site/pricing.html; fi
          if [ -d investors ]; then cp -a investors site/investors; fi
          if [ -d enterprise ]; then cp -a enterprise site/enterprise; fi
          cp rebuild-v5000/index.html site/index.html
          cp rebuild-v5000/app-index.html site/app/index.html
          cp rebuild-v5000/landing.css site/landing.css
          cp rebuild-v5000/landing.js site/landing.js
          cp rebuild-v5000/styles.css site/styles.css
          cp rebuild-v5000/app.js site/app.js
          cp rebuild-v5000/owner-everything.js site/owner-everything.js
          cp rebuild-v5000/owner-everything.css site/owner-everything.css
          cp rebuild-v5000/parcel-boundary-viewer-v5403.js site/parcel-boundary-viewer-v5403.js
          cp rebuild-v5000/manifest.webmanifest site/manifest.webmanifest
          cp rebuild-v5000/favicon.ppm site/favicon.ppm
          cp rebuild-v5000/sw.js site/sw.js
          cp rebuild-v5000/intelligence-v5507.css site/intelligence-v5507.css
          cp rebuild-v5000/intelligence-global-v5507.js site/intelligence-global-v5507.js
          cp rebuild-v5000/intelligence-tools-v5507.js site/intelligence-tools-v5507.js
          cp rebuild-v5000/road-drive-v5527.js site/road-drive-v5527.js
          cp rebuild-v5000/road-drive-v5527.css site/road-drive-v5527.css
          cp rebuild-v5000/scenario-lab-v5525.js site/scenario-lab-v5525.js
          cp rebuild-v5000/scenario-lab-v5525.css site/scenario-lab-v5525.css
          cp rebuild-v5000/qr-house-v5521.js site/qr-house-v5521.js
          cp rebuild-v5000/refresh-v5535.js site/refresh-v5535.js
          cp rebuild-v5000/walkthrough-v5537.js site/walkthrough-v5537.js
          cp rebuild-v5000/walkthrough-v5537.css site/walkthrough-v5537.css
          cp rebuild-v5000/404.html site/404.html
          cp rebuild-v5000/bridgepoint-mark.svg site/bridgepoint-mark.svg
          cp rebuild-v5000/bridgepoint-favicon-48.png site/bridgepoint-favicon-48.png
          mkdir -p site/assets
          cp -a rebuild-v5000/assets/. site/assets/
          rm -rf site/terms site/privacy
          cp -a rebuild-v5000/terms site/terms
          cp -a rebuild-v5000/privacy site/privacy
          cp robots.txt sitemap.xml llms.txt llms-full.txt site/
          if [ -f security.txt ]; then
            cp security.txt site/security.txt
            mkdir -p site/.well-known
            cp security.txt site/.well-known/security.txt
          fi

          # Funnel legacy public content to the current map and attach the language selector.
          python - <<'PY'
          from pathlib import Path
          funnel='<script defer src="/current-map-entry.js?v=5100"></script>'
          lang_js='<script defer src="/language-selector-v5200.js"></script>'
          lang_css='<link rel="stylesheet" href="/language-selector-v5200.css">'
          for p in Path('site').rglob('*.html'):
              rel=p.relative_to('site').as_posix()
              if rel.startswith(('owner/','admin/')):
                  continue
              text=p.read_text(encoding='utf-8',errors='ignore')
              language_ok=not rel.startswith(('app/horizon-playable/','distribution/gis-widget/'))
              if language_ok and lang_css not in text and '</head>' in text:
                  text=text.replace('</head>',lang_css+'</head>',1)
              if language_ok and lang_js not in text:
                  text=text.replace('</body>',lang_js+'</body>',1) if '</body>' in text else text+lang_js
              current_surface=rel.startswith(('terminal/','integrity-index/','settlement-lab/','distribution/','public-audit/','portfolio-evidence/','data-discrepancy/','claims-terminal/'))
              if rel not in {'index.html','app/index.html'} and not rel.startswith('app/') and not current_surface and funnel not in text:
                  text=text.replace('</body>',funnel+'</body>',1) if '</body>' in text else text+funnel
              p.write_text(text,encoding='utf-8')
          PY

          # /app is the full workspace; root is the public BridgePoint product surface.

          # Carry forward only the proven map engine pieces used by the new shell.
          cp release-v2300/world-v2300-config.js site/world-v2300-config.js
          cp release-v2300/world-v2300-map.js site/world-v2300-map.js
          cp release-v2300/world-v2300-space.js site/world-v2300-space.js
          cp release-v2300/world-v2300-worker.js site/world-v2300-worker.js
          cp release-v2300/world-v2300-weather.js site/world-v2300-weather.js
          cp release-v2300/world-v2300-present-weather.js site/world-v2300-present-weather.js
          cp release-v2300/world-v2300-config.js site/app/world-v2300-config.js
          cp release-v2300/world-v2300-map.js site/app/world-v2300-map.js
          cp release-v2300/world-v2300-space.js site/app/world-v2300-space.js
          cp release-v2300/world-v2300-worker.js site/app/world-v2300-worker.js
          cp release-v2300/world-v2300-weather.js site/app/world-v2300-weather.js
          cp release-v2300/world-v2300-present-weather.js site/app/world-v2300-present-weather.js
          cp release-v2300/world-v2300-inspector.js site/app/world-v2300-inspector.js
          cp release-v2300/world-v2300-bootstrap.js site/app/world-v2300-bootstrap.js
          cp release-v2300/world-v2300.css site/app/world-v2300.css

          curl --retry 4 --retry-all-errors --retry-delay 2 -fsSL https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.2/dist/maplibre-gl.js -o site/vendor/maplibre-gl.js
          curl --retry 4 --retry-all-errors --retry-delay 2 -fsSL https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.2/dist/maplibre-gl.css -o site/vendor/maplibre-gl.css
          curl --retry 4 --retry-all-errors --retry-delay 2 -fsSL https://cdn.jsdelivr.net/npm/pmtiles@4.5.0/dist/pmtiles.js -o site/vendor/pmtiles.js

          printf '%s\n' 'bridgepointintelligence.online' > site/CNAME
          touch site/.nojekyll site/app/.nojekyll

          test -f site/assets/us-state-boundaries-census.topo.json
          test -f site/pricing/index.html
          test -f site/pricing.html
          test -f site/.well-known/security.txt
          test ! -e site/owner
          test ! -e site/downloads/backup
          echo 'PRIVATE_SURFACES_NOT_PUBLISHED_PASS'
          grep -Fq 'BridgePoint Intelligence pricing' site/pricing/index.html
          grep -Fq 'BridgePoint Intelligence pricing' site/pricing.html
          grep -Fq '153,532,480' site/index.html
          grep -Fq '143,787,840' site/index.html
          node --check site/app.js
          node --check site/parcel-boundary-viewer-v5403.js
          node --check site/landing.js
          grep -Fq 'parcel-boundary-viewer-v5403.js?v=5577' site/index.html
          grep -Fq 'parcel-boundary-viewer-v5403.js?v=5577' site/app/index.html
          node --check site/intelligence-global-v5507.js
          node --check site/intelligence-tools-v5507.js
          node -e "const fs=require('fs');let s=fs.readFileSync('site/intelligence-tools-v5507.js','utf8').split('\\n').filter(x=>!x.startsWith('import')).join('\\n');new Function(s);"
          node --check site/road-drive-v5527.js
          node --check site/scenario-lab-v5525.js
          node --check site/qr-house-v5521.js
          node --check site/refresh-v5535.js
          node --check site/walkthrough-v5537.js
          grep -Fq 'intelligence-tools-v5507.js?v=5581' site/index.html
          grep -Fq 'intelligence-tools-v5507.js?v=5581' site/app/index.html
          grep -Fq 'FREE PREMIUM TOOLS' site/intelligence-tools-v5507.js
          grep -Fq 'openScenarioLab' site/intelligence-tools-v5507.js
          grep -Fq 'openRoadDrive' site/intelligence-tools-v5507.js
          grep -Fq 'const RoadDrive5527=(()=>{' site/intelligence-tools-v5507.js
          ! grep -Fq "from'/road-drive-v5527.js?v=5527'" site/intelligence-tools-v5507.js
          grep -Fq '__BP_ROAD_DRIVE_V5530__' site/road-drive-v5527.js
          grep -Fq 'FREE · UNLIMITED' site/road-drive-v5527.js
          grep -Fq 'LIVE WEATHER · CURRENT CONDITIONS' site/road-drive-v5527.js
          grep -Fq 'bp-rd-source-buildings-v5530' site/road-drive-v5527.js
          grep -Fq 'syncFireDistanceMarkers' site/road-drive-v5527.js
          grep -Fq '+10 MPH' site/road-drive-v5527.js
          grep -Fq 'FREE · UNLIMITED · Still being actively improved' site/intelligence-tools-v5507.js
          grep -Fq 'STILL BEING WORKED ON · Tool visuals and features are actively being improved.' site/intelligence-tools-v5507.js
          grep -Fq 'DRIVE_MOBILE?66:45' site/intelligence-tools-v5507.js
          grep -Fq 'road-drive-v5527.css?v=5530' site/index.html
          grep -Fq 'road-drive-v5527.css?v=5530' site/app/index.html
          grep -Fq 'bridgepoint_intelligence_record_simulation_v5525' site/scenario-lab-v5525.js
          grep -Fq 'CINEMATIC_GEO_ANCHORED_3D_V5525' site/scenario-lab-v5525.js
          grep -Fq 'ILLUSTRATIVE / NOT A FORECAST OR CLAIM ESTIMATE' site/scenario-lab-v5525.js
          grep -Fq 'scenario-lab-v5525.css?v=5525' site/index.html
          grep -Fq 'scenario-lab-v5525.css?v=5525' site/app/index.html
          ! grep -Fq "['GLOBAL_WEATHER','GLOBAL WEATHER'" site/intelligence-tools-v5507.js
          ! grep -Fq "['GLOBAL','GLOBAL LAYERS'" site/intelligence-tools-v5507.js
          grep -Fq 'bpQrHouseCanvas' site/index.html
          ! grep -Fq 'QR → 3D HOUSE → QR' site/index.html
          grep -Fq '__BP_QR_HOUSE_V5521__' site/qr-house-v5521.js
          grep -Fq '__BP_FULL_REFRESH_V5535__' site/refresh-v5535.js
          grep -Fq '__BP_FULL_REFRESH_V5548__' site/refresh-v5535.js
          grep -Fq 'deferred-active-use' site/refresh-v5535.js
          grep -Fq 'bp-intelligence-v5580' site/sw.js
          grep -Fq '/refresh-v5535.js?v=5548' site/index.html
          grep -Fq '/refresh-v5535.js?v=5548' site/app/index.html
          grep -Fq '__BP_WALKTHROUGH_V5539__' site/walkthrough-v5537.js
          grep -Fq 'MOLLY SAYS' site/walkthrough-v5537.js
          grep -Fq "MOLLY_GUIDE='/assets/molly-materson-bridgepoint.webp'" site/walkthrough-v5537.js
          grep -Fq 'card.dataset.dock=dock' site/walkthrough-v5537.js

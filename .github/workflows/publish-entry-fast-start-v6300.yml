name: Publish BridgePoint Direct Entry V6300

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-entry-fast-start-v6300.yml'
      - 'recovery/apply_entry_fast_start_v6300.py'
      - 'rebuild-v5000/app-update-v5820.js'
      - 'tests/test_entry_fast_start_v6300.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-pages-mars-v6292-night-side-shading
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the direct-entry patch
        run: python3 -m unittest discover -s tests -p 'test_entry_fast_start_v6300.py' -v

      - name: Download the current production Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages-v6292
          run-id: 42768515223
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: /tmp/bridgepoint-v6292-pages

      - name: Extract current production site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          ARCHIVE="$(find /tmp/bridgepoint-v6292-pages -type f -name 'artifact.tar' -print -quit)"
          test -n "$ARCHIVE"
          tar -xf "$ARCHIVE" -C site
          test -s site/index.html
          test -s site/app/index.html
          test -s site/manifest.webmanifest
          test -s site/bridgepoint-welcome-space-v6260.js
          test -s site/vendor/three.module.js
          echo "Using the last successful V6292 production artifact; no world or planetary rebuild."

      - name: Patch only entry documents and startup updater
        shell: bash
        run: |
          set -euo pipefail
          python3 recovery/apply_entry_fast_start_v6300.py site rebuild-v5000/app-update-v5820.js
          node --check site/app-update-v5820.js
          grep -Fq 'id="bpWelcomeGateV1"' site/index.html
          grep -Fq 'class="bpw-wordmark bpw-wordmark-static"' site/index.html
          grep -Fq 'class="bpw-celestial-system"' site/index.html
          grep -Fq 'href="/vendor/three.module.js?v=169-local"' site/index.html
          grep -Fq 'href="/bridgepoint-welcome-space-v6260.js?v=6292-mars-night-side-shading"' site/index.html
          grep -Fq 'app-update-v5820.js?v=6300-direct-entry' site/index.html
          grep -Fq 'app-update-v5820.js?v=6300-direct-entry' site/app/index.html
          grep -Fq "CACHE_VERSION='6292-mars-night-side-shading'" site/app-update-v5820.js
          grep -Fq "CURRENT_CACHE='bp-intelligence-v6292-mars-night-side'" site/app-update-v5820.js
          ! grep -Eq 'location\\.(replace|reload)|reloadOnce' site/app-update-v5820.js
          jq -e '.start_url == "/" and .scope == "/"' site/manifest.webmanifest >/dev/null
          echo "V6300 entry patch passed. Existing world modules, imagery, geometry and feature assets were reused unchanged."
          du -sb site

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload entry-only Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-v6300-entry-fast-start
          path: site
          include-hidden-files: true

      - name: Verify entry artifact size
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts"
          size=""
          for attempt in $(seq 1 15); do
            size="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api" | jq -r '([.artifacts[] | select(.name=="github-pages-v6300-entry-fast-start") | .size_in_bytes] | max) // empty')"
            if [[ "$size" =~ ^[0-9]+$ ]]; then break; fi
            sleep 2
          done
          test -n "$size"
          echo "Compressed Pages artifact bytes: $size"
          test "$size" -lt 1000000000

      - name: Publish direct-entry fix
        id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-v6300-entry-fast-start
          timeout: '600000'

      - name: Verify website, app and installed-app entry
        shell: bash
        run: |
          set -euo pipefail
          O='https://bridgepointintelligence.online'
          q="${GITHUB_SHA}-v6300-entry-live"
          curl --retry 8 --retry-all-errors --retry-delay 5 -fsSL -H 'Cache-Control: no-cache' "${O}/?v6300=${q}" -o /tmp/root.html
          curl --retry 8 --retry-all-errors --retry-delay 5 -fsSL -H 'Cache-Control: no-cache' "${O}/app/?v6300=${q}" -o /tmp/app.html
          curl --retry 8 --retry-all-errors --retry-delay 5 -fsSL -H 'Cache-Control: no-cache' "${O}/manifest.webmanifest?v6300=${q}" -o /tmp/manifest.json
          curl --retry 8 --retry-all-errors --retry-delay 5 -fsSL -H 'Cache-Control: no-cache' "${O}/app-update-v5820.js?v=6300-direct-entry&verify=${q}" -o /tmp/updater.js
          grep -Fq 'id="bpWelcomeGateV1"' /tmp/root.html
          grep -Fq 'class="bpw-wordmark bpw-wordmark-static"' /tmp/root.html
          grep -Fq 'href="/vendor/three.module.js?v=169-local"' /tmp/root.html
          grep -Fq 'href="/bridgepoint-welcome-space-v6260.js?v=6292-mars-night-side-shading"' /tmp/root.html
          grep -Fq 'app-update-v5820.js?v=6300-direct-entry' /tmp/app.html
          jq -e '.start_url == "/"' /tmp/manifest.json >/dev/null
          grep -Fq "CACHE_VERSION='6292-mars-night-side-shading'" /tmp/updater.js
          grep -Fq "CURRENT_CACHE='bp-intelligence-v6292-mars-night-side'" /tmp/updater.js
          ! grep -Eq 'location\\.(replace|reload)|reloadOnce' /tmp/updater.js
          echo "LIVE_V6300_DIRECT_ENTRY_PASS — homepage welcome screen, app updater, and PWA start URL verified."

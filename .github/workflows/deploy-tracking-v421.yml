name: Deploy BridgePoint Tracking V421

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-tracking-v421.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download audited BridgePoint v397 production build
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 'https://sdmntprsoutheastus3.oaiusercontent.com/files/00000000-7394-820c-ab55-575943a7de6a/raw?se=2026-08-21T06%3A04%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=38216c31-9a04-5e17-938e-5f73912056c0&skoid=f28c0102-4d9d-4950-baf0-4a8e5f6cf9d4&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-20T21%3A58%3A58Z&ske=2026-08-21T21%3A58%3A58Z&sks=b&skv=2026-02-06&sig=JsDoAZ9SI5McHpBK0CRdTUieFgy3N3IUaOhsw3Vxpgc%3D' -o /tmp/bridgepoint-v397.zip
          echo '5d61eae44b53e439dfc96b8ce6b0e5d9fbe2e3bd9a17c1bff0fd364ca7757d05  /tmp/bridgepoint-v397.zip' | sha256sum -c -
          rm -rf site
          mkdir -p site
          unzip -q /tmp/bridgepoint-v397.zip -d site
          touch site/.nojekyll
          sed -i 's#<base href="/">#<base href="./">#' site/index.html
          test -s site/index.html
          test -s site/main.dart.js
          test -s site/bridgepoint-release.json
          grep -q '754650fad126693bf34ce88c99ad47d827888ac2' site/bridgepoint-release.json
          grep -q 'https://bridgepointintelligence.online/' site/bridgepoint-release.json

      - name: Install first-party acquisition tracking V421
        run: |
          set -euo pipefail
          cat > site/acquisition_tracker.js <<'JS'
          (()=>{
            const supabaseUrl='https://xdfsjztwgsbmabshzsjw.supabase.co';
            const apikey='sb_publishable_lM9oWQeHjBmgOIiteeOicQ_PTyAeF25';
            const endpoint=`${supabaseUrl}/rest/v1/rpc/track_acquisition_event_v400`;
            const safeId=()=>globalThis.crypto?.randomUUID?.()||`${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
            const getStored=(storage,key)=>{try{return storage.getItem(key)}catch(_){return null}};
            const setStored=(storage,key,value)=>{try{storage.setItem(key,value)}catch(_){}};
            let visitorId=getStored(localStorage,'bp_visitor_id_v421');
            if(!visitorId){visitorId=safeId();setStored(localStorage,'bp_visitor_id_v421',visitorId)}
            let sessionId=getStored(sessionStorage,'bp_session_id_v421');
            if(!sessionId){sessionId=safeId();setStored(sessionStorage,'bp_session_id_v421',sessionId)}
            const params=new URLSearchParams(location.search);
            const campaign={
              p_utm_source:params.get('utm_source'),p_utm_medium:params.get('utm_medium'),
              p_utm_campaign:params.get('utm_campaign'),p_utm_content:params.get('utm_content'),
              p_referral_code:params.get('ref')||params.get('referral_code')
            };
            const send=(eventType,metadata={})=>{
              const payload={
                p_event_type:eventType,p_visitor_id:visitorId,p_session_id:sessionId,
                p_page_path:`${location.pathname}${location.search}`.slice(0,1000),
                p_platform:'WEB',p_referrer_host:(()=>{try{return document.referrer?new URL(document.referrer).host:null}catch(_){return null}})(),
                ...campaign,p_auth_error_code:null,
                p_metadata:{capture_version:421,href_hash:location.hash||null,...metadata}
              };
              fetch(endpoint,{method:'POST',headers:{apikey,'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload),keepalive:true}).catch(()=>{});
            };
            send('LANDING_VIEW',{visibility:document.visibilityState});
            let lastSignupView=0;
            document.addEventListener('click',(event)=>{
              const el=event.target instanceof Element?event.target.closest('button,a,[role="button"]'):null;
              if(!el)return;
              const label=(el.textContent||el.getAttribute('aria-label')||'').replace(/\s+/g,' ').trim().slice(0,120);
              const normalized=label.toLowerCase();
              if(normalized.includes('start 7-day trial')||normalized.includes('create account')){
                if(Date.now()-lastSignupView>1000){send('SIGNUP_VIEW',{control:label});lastSignupView=Date.now()}
                return;
              }
              if(normalized.includes('start free trial')){send('SIGNUP_SUBMIT',{control:label});return;}
              if(normalized.includes('pricing')||normalized.includes('plan')){send('PRICING_VIEW',{control:label});return;}
              if(normalized.includes('sample')){send('SAMPLE_REQUEST',{control:label});return;}
              if(normalized.includes('checkout')||normalized.includes('buy now')||normalized.includes('subscribe'))send('CHECKOUT_START',{control:label});
            },true);
          })();
          JS
          sed -i 's#</body>#  <script src="acquisition_tracker.js" defer></script>\n</body>#' site/index.html
          test -s site/acquisition_tracker.js
          grep -q 'acquisition_tracker.js' site/index.html
          grep -q "send('LANDING_VIEW'" site/acquisition_tracker.js
          grep -q "SIGNUP_VIEW" site/acquisition_tracker.js
          grep -q "CHECKOUT_START" site/acquisition_tracker.js
          if grep -q 'service_role' site/acquisition_tracker.js; then
            echo 'Forbidden privileged credential marker found in browser tracker.' >&2
            exit 1
          fi
          echo 'V421 first-party acquisition tracker installed onto audited v397 artifact.'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish BridgePoint
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record V421 tracking overlay deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          receipt={
            'status':'PUBLISHED',
            'base_release_sha':'754650fad126693bf34ce88c99ad47d827888ac2',
            'tracking_version':421,
            'capture':'FIRST_PARTY_BROWSER',
            'deployed_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'public_origin':'https://bridgepointintelligence.online/',
            'pages_url':os.environ.get('PAGE_URL'),
            'events':['LANDING_VIEW','SIGNUP_VIEW','SIGNUP_SUBMIT','PRICING_VIEW','SAMPLE_REQUEST','CHECKOUT_START'],
            'contains_privileged_secret':False
          }
          open('tracking-release-status.json','w',encoding='utf-8').write(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tracking-release-status.json
          git commit -m 'Record V421 browser tracking deployment [skip ci]' || true
          git push origin HEAD:main

name: Publish Persistent BridgePoint Overlay Visibility v2

on:
  pull_request:
    paths:
      - '.github/workflows/publish-persistent-overlay-visibility-v1.yml'
      - 'rebuild-v5000/bridgepoint-drone-awareness-v1.js'
      - 'rebuild-v5000/bridgepoint-subsurface-wells-v1.js'
      - 'rebuild-v5000/bridgepoint-underground-scan-scenes-v2.js'
      - 'rebuild-v5000/landing.js'
      - 'rebuild-v5000/app.js'
      - 'rebuild-v5000/index.html'
      - 'rebuild-v5000/app-index.html'
      - 'tests/drone-awareness.test.mjs'
      - 'tests/vessel-awareness.test.mjs'
      - 'tests/underground-scan-scenes-v2.test.mjs'
      - 'tests/globe-renderer-recovery.test.mjs'
      - 'release-v2300/world-v2300-map.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-persistent-overlay-visibility-v1.yml'
      - 'rebuild-v5000/bridgepoint-drone-awareness-v1.js'
      - 'rebuild-v5000/bridgepoint-subsurface-wells-v1.js'
      - 'rebuild-v5000/bridgepoint-underground-scan-scenes-v2.js'
      - 'rebuild-v5000/landing.js'
      - 'rebuild-v5000/app.js'
      - 'rebuild-v5000/index.html'
      - 'rebuild-v5000/app-index.html'
      - 'tests/drone-awareness.test.mjs'
      - 'tests/vessel-awareness.test.mjs'
      - 'tests/underground-scan-scenes-v2.test.mjs'
      - 'tests/globe-renderer-recovery.test.mjs'
      - 'release-v2300/world-v2300-map.js'
  workflow_run:
    workflows: ["Deploy BridgePoint Intelligence V5000 Rebuild"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check rebuild-v5000/bridgepoint-drone-awareness-v1.js
          node --check rebuild-v5000/bridgepoint-subsurface-wells-v1.js
          node --input-type=module --check < rebuild-v5000/bridgepoint-underground-scan-scenes-v2.js
          node --check rebuild-v5000/landing.js
          node --check rebuild-v5000/app.js
          node --input-type=module --check < release-v2300/world-v2300-map.js
      - name: Run overlay and cross-module regression tests
        run: |
          set -euo pipefail
          node tests/drone-awareness.test.mjs
          node tests/vessel-awareness.test.mjs
          node tests/underground-scan-scenes-v2.test.mjs
          node tests/globe-renderer-recovery.test.mjs
      - name: Verify persistent clean-start categories
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("rebuild-v5000/bridgepoint-drone-awareness-v1.js").read_text()
          for token in [
            "subsurface:/subsurface|catacomb|cave|underground-scan",
            "infrastructure:/infrastructure|power[-_]?line|utility",
            "energy:/solar|wind[-_]?turbine",
            "landmarks:/landmark|poi",
            ".bpv-dock .bpv-command-group button",
            "if(buttonOn)allowedCategories.add(category);else allowedCategories.delete(category);"
          ]:
            assert token in s, token
          c=Path("rebuild-v5000/bridgepoint-underground-scan-scenes-v2.js").read_text()
          w=Path("rebuild-v5000/bridgepoint-subsurface-wells-v1.js").read_text()
          assert "allowLayerCategory?.('subsurface',true)" in c
          assert "allowLayerCategory?.('subsurface',true)" in w
          print("PERSISTENT_OVERLAY_CATEGORY_GUARD_PASS")
          PY

  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: bridgepoint-v5000-production-authority
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate changed runtime modules
        run: |
          set -euo pipefail
          node --check rebuild-v5000/bridgepoint-drone-awareness-v1.js
          node --check rebuild-v5000/bridgepoint-subsurface-wells-v1.js
          node --input-type=module --check < rebuild-v5000/bridgepoint-underground-scan-scenes-v2.js
          node --check rebuild-v5000/landing.js
          node --check rebuild-v5000/app.js
          node --input-type=module --check < release-v2300/world-v2300-map.js
          python3 -m py_compile tools/underground/fetch_sketchfab_scans.py
          node tests/drone-awareness.test.mjs
          node tests/vessel-awareness.test.mjs
          node tests/underground-scan-scenes-v2.test.mjs
          node tests/globe-renderer-recovery.test.mjs

      - name: Select the latest completed production baseline
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt || '1' }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          repo=os.environ["REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          event=os.environ["EVENT_NAME"]
          upstream=os.environ.get("UPSTREAM_RUN_ID","")
          attempt=os.environ.get("UPSTREAM_RUN_ATTEMPT") or "1"
          conclusion=os.environ.get("UPSTREAM_CONCLUSION","")
          selected=None
          if event=="workflow_run" and conclusion=="success" and upstream:
              url=f"https://api.github.com/repos/{repo}/actions/runs/{upstream}/artifacts?per_page=100"
              req=urllib.request.Request(url,headers={
                  "Accept":"application/vnd.github+json",
                  "Authorization":"Bearer "+token,
                  "X-GitHub-Api-Version":"2022-11-28"})
              with urllib.request.urlopen(req,timeout=30) as response:
                  artifacts=json.load(response).get("artifacts",[])
              expected=f"bridgepoint-v5000-{attempt}"
              item=next((a for a in artifacts if a.get("name")==expected and not a.get("expired")),None)
              if item:
                  selected=(upstream,expected)
                  print("USING_SUCCESSFUL_V5000_ARTIFACT",upstream,expected)
          if selected is None:
              fallback_run="43910616056"
              fallback_name="github-pages-underground-scan-scenes-v2"
              url=f"https://api.github.com/repos/{repo}/actions/runs/{fallback_run}/artifacts?per_page=100"
              req=urllib.request.Request(url,headers={
                  "Accept":"application/vnd.github+json",
                  "Authorization":"Bearer "+token,
                  "X-GitHub-Api-Version":"2022-11-28"})
              with urllib.request.urlopen(req,timeout=30) as response:
                  artifacts=json.load(response).get("artifacts",[])
              item=next((a for a in artifacts if a.get("name")==fallback_name and not a.get("expired")),None)
              if not item:
                  raise SystemExit("Neither the completed V5000 run nor the retained Paris Catacombs Pages artifact is available")
              selected=(fallback_run,fallback_name)
              print("USING_LAST_VERIFIED_PARIS_CATACOMBS_ARTIFACT",*selected)
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:
              out.write("run_id="+selected[0]+"\n")
              out.write("artifact_name="+selected[1]+"\n")
          PY

      - name: Download the exact selected Pages baseline
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.baseline.outputs.artifact_name }}
          run-id: ${{ steps.baseline.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/bp-overlay-baseline

      - name: Materialize the single Paris Catacombs CC BY 4.0 mesh
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/underground/fetch_sketchfab_scans.py --output assets/underground-scan-scenes
          python3 - <<'PY'
          import gzip,json
          from pathlib import Path
          root=Path("assets/underground-scan-scenes")
          catalog=json.loads((root/"catalog.json").read_text(encoding="utf-8"))
          assert len(catalog["models"])==1
          row=catalog["models"][0]
          assert row["uid"]=="39e7050d272f4aac8493497621b86f39"
          assert row["license"]=="CC BY 4.0"
          raw=gzip.decompress((root/(row["uid"]+".glb.gz")).read_bytes())
          assert raw[:4]==b"glTF" and len(raw)>32
          print("PARIS_CATACOMBS_SOURCE_ASSET_PASS",len(raw),"bytes")
          PY

      - name: Restore and fingerprint the selected live site
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find "$RUNNER_TEMP/bp-overlay-baseline" -type f -name artifact.tar -print -quit)"
          test -n "$ARCHIVE"
          SITE="$RUNNER_TEMP/bp-overlay-site"
          mkdir -p "$SITE"
          tar -xf "$ARCHIVE" -C "$SITE"
          for file in index.html app/index.html landing.js app.js bridgepoint-view-v5917.js bridgepoint-drone-awareness-v1.js world-v2300-map.js bridgepoint-faa-obstruction-towers-v1.js app/bridgepoint-faa-obstruction-towers-v1.js data/bridgepoint-faa-obstructions-v1.json.gz app/data/bridgepoint-faa-obstructions-v1.json.gz vendor/three.module.js; do
            test -s "$SITE/$file" || { echo "Selected baseline missing $file"; exit 1; }
          done
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"bp-overlay-site"
          before={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob("*") if p.is_file()}
          (Path(os.environ["RUNNER_TEMP"])/"bp-overlay-before.json").write_text(json.dumps(before,sort_keys=True))
          print("SELECTED_PRODUCTION_BASELINE_FINGERPRINT_PASS",len(before),"files")
          PY

      - name: Build local GLTFLoader only when the selected baseline lacks it
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/bp-overlay-site"
          if [ ! -s "$SITE/vendor/GLTFLoader.bundle.js" ]; then
            R="$RUNNER_TEMP/bp-overlay-loader-runtime"
            mkdir -p "$R" "$SITE/vendor"
            npm install --prefix "$R" --no-audit --no-fund --no-save three@0.169.0 esbuild@0.24.2
            "$R/node_modules/.bin/esbuild" "$R/node_modules/three/examples/jsm/loaders/GLTFLoader.js" --bundle --format=esm --minify --external:three --outfile="$SITE/vendor/GLTFLoader.bundle.js"
            python3 - "$SITE/vendor/GLTFLoader.bundle.js" <<'PY'
          import re,sys
          from pathlib import Path
          p=Path(sys.argv[1])
          s=p.read_text(encoding="utf-8")
          s,n=re.subn(r'\bfrom\s*(["\'])three\1','from "/vendor/three.module.js?v=169-local"',s)
          if n<1 or re.search(r'\bfrom\s*(["\'])three\1',s):
              raise SystemExit("GLTFLoader has an unresolved external Three.js import")
          if "esm.sh" in s or "unpkg.com" in s:
              raise SystemExit("External CDN dependency detected in GLTFLoader")
          p.write_text(s,encoding="utf-8")
          print("LOCAL_GLTFLOADER_BUNDLE_PASS",p.stat().st_size,"bytes")
          PY
          fi
          node --input-type=module --check < "$SITE/vendor/GLTFLoader.bundle.js"
          grep -Fq 'from "/vendor/three.module.js?v=169-local"' "$SITE/vendor/GLTFLoader.bundle.js"

      - name: Overlay the shared visibility guard, wells and Paris Catacombs
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/bp-overlay-site"
          mkdir -p "$SITE/app" "$SITE/assets/underground-scan-scenes" "$SITE/vendor"
          cp rebuild-v5000/bridgepoint-drone-awareness-v1.js "$SITE/bridgepoint-drone-awareness-v1.js"
          cp release-v2300/world-v2300-map.js "$SITE/world-v2300-map.js"
          cp rebuild-v5000/bridgepoint-subsurface-wells-v1.js "$SITE/bridgepoint-subsurface-wells-v1.js"
          cp rebuild-v5000/bridgepoint-underground-scan-scenes-v2.js "$SITE/bridgepoint-underground-scan-scenes-v2.js"
          cp rebuild-v5000/bridgepoint-underground-scan-scenes-v2.js "$SITE/app/bridgepoint-underground-scan-scenes-v2.js"
          cp -a assets/underground-scan-scenes/. "$SITE/assets/underground-scan-scenes/"
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          site=Path(os.environ["RUNNER_TEMP"])/"bp-overlay-site"
          attach="""void import('./bridgepoint-underground-scan-scenes-v2.js?v=4-persistent-overlay-category-gate')
             .then(m=>{window.__BP_PARIS_CATACOMBS_V3__=m.initUndergroundScanScenesRenderer(world)})
             .catch(e=>console.warn('BridgePoint Paris Catacombs 3D layer unavailable',e));"""
          old_site="./bridgepoint-underground-scan-sites-v1.js?v=1-curated-sketchfab-caves"
          old_mesh="./bridgepoint-underground-scan-scenes-v2.js?v=3-paris-catacombs-viewer"
          new_mesh="./bridgepoint-underground-scan-scenes-v2.js?v=4-persistent-overlay-category-gate"
          for rel in ("landing.js","app.js"):
              p=site/rel
              data=p.read_text(encoding="utf-8")
              old_map="./world-v2300-map.js?v=6247-viewport-tile-sidewalk-progressive"
              new_map="./world-v2300-map.js?v=6248-mobile-render-recovery-no-error-resize"
              if data.count(old_map)!=1:
                  raise SystemExit(f"{rel}: expected one current globe module import")
              data=data.replace(old_map,new_map,1)
              if old_mesh in data:
                  if data.count(old_mesh)!=1:
                      raise SystemExit(f"{rel}: duplicate old Paris Catacombs module imports")
                  data=data.replace(old_mesh,new_mesh,1)
              elif old_site in data:
                  start=data.index(old_site)
                  begin=data.rfind("\n",0,start)+1
                  marker=".catch(e=>console.warn('BridgePoint cave and underground scan layer unavailable',e));"
                  end_marker=data.index(marker,start)
                  end=data.index("\n",end_marker)+1
                  indent=re.match(r'^[ \t]*',data[begin:]).group(0)
                  replacement=indent+attach.replace("\n","\n"+indent)+"\n"
                  data=data[:begin]+replacement+data[end:]
              elif new_mesh not in data:
                  anchor=".catch(e=>console.warn('BridgePoint global subsurface wells renderer unavailable',e));"
                  if data.count(anchor)!=1:
                      raise SystemExit(f"{rel}: no unique safe catacomb insertion point")
                  pos=data.index(anchor)+len(anchor)
                  data=data[:pos]+"\n"+attach+data[pos:]
              old_wells="./bridgepoint-subsurface-wells-v1.js?v=1-global-wells-depth-casing"
              new_wells="./bridgepoint-subsurface-wells-v1.js?v=2-persistent-substructure-visibility"
              if old_wells in data:
                  if data.count(old_wells)!=1:
                      raise SystemExit(f"{rel}: duplicate wells import")
                  data=data.replace(old_wells,new_wells,1)
              elif new_wells not in data and "bridgepoint-subsurface-wells-v1.js" not in data:
                  raise SystemExit(f"{rel}: wells module import was not found")
              p.write_text(data,encoding="utf-8")
          for rel in ("index.html","app/index.html"):
              p=site/rel
              data=p.read_text(encoding="utf-8")
              old_drone="bridgepoint-drone-awareness-v1.js?v=7-aircraft-models-tracks"
              new_drone="bridgepoint-drone-awareness-v1.js?v=9-aircraft-filters-ground-tethers"
              if old_drone in data:
                  if data.count(old_drone)!=1:
                      raise SystemExit(f"{rel}: duplicate drone guard script tag")
                  data=data.replace(old_drone,new_drone,1)
              elif new_drone not in data:
                  raise SystemExit(f"{rel}: drone guard script not found")
              needle="landing.js?v=" if rel=="index.html" else "app.js?v="
              matches=list(re.finditer(r'src="([^"]*'+re.escape(needle)+r'[^"]*)"',data))
              if len(matches)!=1:
                  raise SystemExit(f"{rel}: expected one globe entrypoint script")
              current=matches[0].group(1)
              if "overlay-visibility=v2" not in current:
                  data=data.replace(current,current+"&overlay-visibility=v2",1)
              view_matches=list(re.finditer(r'src="([^"]*bridgepoint-view-v5917\.js\?[^"]*)"',data))
              if len(view_matches)!=1:
                  raise SystemExit(f"{rel}: expected one bottom-card view script")
              current=view_matches[0].group(1)
              if "overlay-visibility=v2" not in current:
                  data=data.replace(current,current+"&overlay-visibility=v2",1)
              p.write_text(data,encoding="utf-8")
          view=site/"bridgepoint-view-v5917.js"
          data=view.read_text(encoding="utf-8")
          button='bp-paris-catacombs-toggle-v3'
          if 'data-bpv-action="catacombs"' not in data:
              old='<button id="bp-paris-catacombs-toggle-v3" type="button"'
              if data.count(old)==1:
                  data=data.replace(old,'<button id="bp-paris-catacombs-toggle-v3" data-bpv-action="catacombs" type="button"',1)
              elif button not in data:
                  anchor=' \'<div id="bpv-dock-actions" class="bpv-dock-actions bpv-command-groups">\'+'
                  if data.count(anchor)!=1:
                      raise SystemExit("Could not locate the bottom card for the Paris Catacombs control")
                  section="""  '<section id="bp-paris-catacombs-control-v3" class="bpv-command-group" data-bpv-command-section="paris-catacombs" aria-label="Paris Catacombs LiDAR scan">'+
                   '<div class="bpv-command-heading"><span class="bpv-command-heading-icon" aria-hidden="true">🕳️</span><span><b>PARIS CATACOMBS</b><small>Real LiDAR scan · underground 3D</small></span></div>'+
                   '<div class="bpv-command-grid"><button id="bp-paris-catacombs-toggle-v3" data-bpv-action="catacombs" type="button" class="bpv-command-btn" aria-pressed="false" title="Toggle Paris Catacombs globe marker"><span class="bpv-command-icon" aria-hidden="true">🪦</span><span class="bpv-command-label">Paris Catacombs</span></button></div>'+
                   '<div id="bp-paris-catacombs-count-v3" class="bpv-data-note"></div>'+
                   '<div id="bp-paris-catacombs-status-v3" class="bpv-data-note">Layer off · existing BridgePoint layers remain unchanged.</div>'+
                  '</section>'+
          """
                  data=data.replace(anchor,anchor+"\n"+section,1)
              else:
                  raise SystemExit("Paris Catacombs button exists but its action attribute could not be applied")
          view.write_text(data,encoding="utf-8")
          catalog=site/"assets/underground-scan-scenes/catalog.json"
          model=site/"assets/underground-scan-scenes/39e7050d272f4aac8493497621b86f39.glb.gz"
          before=json.loads((Path(os.environ["RUNNER_TEMP"])/"bp-overlay-before.json").read_text())
          after={p.relative_to(site).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in site.rglob("*") if p.is_file()}
          removed=set(before)-set(after)
          added=set(after)-set(before)
          changed={p for p in before if p in after and before[p]!=after[p]}
          expected_changed={
            "index.html","app/index.html","landing.js","app.js","bridgepoint-view-v5917.js",
            "bridgepoint-drone-awareness-v1.js","world-v2300-map.js"
          }
          candidates=[
            "bridgepoint-subsurface-wells-v1.js",
            "bridgepoint-underground-scan-scenes-v2.js",
            "app/bridgepoint-underground-scan-scenes-v2.js",
            "assets/underground-scan-scenes/catalog.json",
            "assets/underground-scan-scenes/39e7050d272f4aac8493497621b86f39.glb.gz",
            "vendor/GLTFLoader.bundle.js"
          ]
          expected_added={item for item in candidates if item not in before}
          allowed_changed=expected_changed|set(candidates)
          unexpected_changed=changed-allowed_changed
          missing_changed=expected_changed-changed
          if removed or added!=expected_added or unexpected_changed or missing_changed:
              raise SystemExit("PERSISTENT_OVERLAY_SCOPE_FAILURE "+json.dumps({
                "removed":sorted(removed),"added":sorted(added),"expected_added":sorted(expected_added),
                "changed":sorted(changed),"allowed_changed":sorted(allowed_changed),
                "unexpected_changed":sorted(unexpected_changed),"missing_changed":sorted(missing_changed)}))
          print("PERSISTENT_OVERLAY_SCOPE_PASS",len(changed),"changed",len(added),"added; no removals")
          PY
          node --check "$SITE/landing.js"
          node --check "$SITE/app.js"
          node --check "$SITE/bridgepoint-view-v5917.js"
          node --check "$SITE/bridgepoint-drone-awareness-v1.js"
          node --input-type=module --check < "$SITE/world-v2300-map.js"
          grep -Fq 'resizeSkipped:true' "$SITE/world-v2300-map.js"
          node --check "$SITE/bridgepoint-subsurface-wells-v1.js"
          node --input-type=module --check < "$SITE/bridgepoint-underground-scan-scenes-v2.js"
          node --input-type=module --check < "$SITE/vendor/GLTFLoader.bundle.js"
          cmp -s "$SITE/bridgepoint-underground-scan-scenes-v2.js" "$SITE/app/bridgepoint-underground-scan-scenes-v2.js"
          grep -Fq 'data-bpv-action="catacombs"' "$SITE/bridgepoint-view-v5917.js"
          grep -Fq "subsurface:/subsurface|catacomb|cave|underground-scan" "$SITE/bridgepoint-drone-awareness-v1.js"
          grep -Fq ".bpv-dock .bpv-command-group button" "$SITE/bridgepoint-drone-awareness-v1.js"
          grep -Fq "allowLayerCategory?.('subsurface',true)" "$SITE/bridgepoint-underground-scan-scenes-v2.js"
          grep -Fq "allowLayerCategory?.('subsurface',true)" "$SITE/bridgepoint-subsurface-wells-v1.js"
          echo "BRIDGEPOINT_PERSISTENT_OVERLAY_RUNTIME_PASS"

      - uses: actions/configure-pages@v5

      - name: Upload the preserved site with persistent overlay visibility
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-persistent-overlay-visibility-v2
          path: ${{ runner.temp }}/bp-overlay-site
          include-hidden-files: true

      - name: Publish persistent overlay visibility v2
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-persistent-overlay-visibility-v2

      - name: Verify persistent categories and both map routes
        shell: bash
        run: |
          set -euo pipefail
          O='https://bridgepointintelligence.online'
          Q="$GITHUB_SHA-overlay-visibility-v2"
          D="$RUNNER_TEMP/persistent-overlay-live"
          mkdir -p "$D"
          for item in \
            "root.html:$O/?overlay=$Q" \
            "app.html:$O/app/?overlay=$Q" \
            "drone.js:$O/bridgepoint-drone-awareness-v1.js?v=9-aircraft-filters-ground-tethers&verify=$Q" \
            "wells.js:$O/bridgepoint-subsurface-wells-v1.js?verify=$Q" \
            "catacomb.js:$O/bridgepoint-underground-scan-scenes-v2.js?verify=$Q" \
            "app-catacomb.js:$O/app/bridgepoint-underground-scan-scenes-v2.js?verify=$Q" \

name: BridgePoint Earth V1.6 - cloud history and simulation-time validation

on:
  push:
    branches: [living-earth-v1]
    paths:
      - 'unreal/BridgePointHorizon/**'
      - '.gitignore'
      - '.github/workflows/validate-bridgepoint-earth-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridgepoint-earth-v1-validation
  cancel-in-progress: true

jobs:
  validate-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Unreal project, source contracts and Horizon invariants
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile unreal/BridgePointHorizon/Scripts/validate_horizon_source.py
          python unreal/BridgePointHorizon/Scripts/validate_horizon_source.py
          python -m py_compile tools/reality_assets/fetch_noaa_goes_cloud_fields.py tests/test_noaa_goes_cloud_fields.py
          python -m unittest discover -s tests -p "test_noaa_goes_cloud_fields.py"
          python - <<'PY'
          import json
          from pathlib import Path
          project = json.loads(Path("unreal/BridgePointHorizon/BridgePointHorizon.uproject").read_text())
          assert project["EngineAssociation"] == "5.8"
          assert any(p.get("Name") == "CesiumForUnreal" and p.get("Enabled") for p in project["Plugins"])
          assert Path("unreal/BridgePointHorizon/Source/BridgePointHorizon/BridgePointEarthSubsystem.cpp").is_file()
          assert Path("unreal/BridgePointHorizon/Source/BridgePointHorizon/BridgePointEarthSubsystemTests.cpp").is_file()
          assert Path("unreal/BridgePointHorizon/Source/BridgePointHorizon/BridgePointEarthWorld.cpp").is_file()
          assert Path("unreal/BridgePointHorizon/Source/BridgePointHorizon/BridgePointEarthCameraPawn.cpp").is_file()
          assert Path("unreal/BridgePointHorizon/Source/BridgePointHorizon/BridgePointEarthGameMode.cpp").is_file()
          assert Path("unreal/BridgePointHorizon/Source/BridgePointHorizon/BridgePointEarthCloudSubsystem.cpp").is_file()
          assert "ResolveCloudFramePair" in Path("unreal/BridgePointHorizon/Source/BridgePointHorizon/BridgePointEarthCloudSubsystem.cpp").read_text()
          assert Path("tools/reality_assets/fetch_noaa_goes_cloud_fields.py").is_file()
          assert "ACesiumSunSky" in Path("unreal/BridgePointHorizon/Source/BridgePointHorizon/BridgePointEarthWorld.cpp").read_text()
          assert "GetSimulationClockUtc" in Path("unreal/BridgePointHorizon/Source/BridgePointHorizon/BridgePointEarthWorld.cpp").read_text()
          print("BRIDGEPOINT_EARTH_V1_SOURCE_CONTRACT_PASS")
          PY
      - name: Ensure plugin and heavy assets stay outside Git
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'unreal/BridgePointHorizon/Plugins/CesiumForUnreal/' .gitignore
          grep -Fq 'unreal/BridgePointHorizon/ExternalAssets/' .gitignore
          test ! -e unreal/BridgePointHorizon/Plugins/CesiumForUnreal
          grep -Fq "VIIRS_NOAA20_CorrectedReflectance_TrueColor" unreal/BridgePointHorizon/Source/BridgePointHorizon/BridgePointEarthWorld.cpp
          grep -Fq "CesiumWorldTerrainAssetId = 1" unreal/BridgePointHorizon/Source/BridgePointHorizon/BridgePointEarthWorld.cpp
          grep -Fq "CesiumOSMBuildingsAssetId = 96188" unreal/BridgePointHorizon/Source/BridgePointHorizon/BridgePointEarthWorld.cpp
          grep -Fq "Gamepad_LeftX" unreal/BridgePointHorizon/Config/DefaultInput.ini
          grep -Fq "BridgePointEarthGameMode" unreal/BridgePointHorizon/Config/DefaultEngine.ini
          echo "BRIDGEPOINT_EARTH_REPOSITORY_HYGIENE_PASS"

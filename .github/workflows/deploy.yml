name: Deploy BridgePoint Live

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download audited BridgePoint v393 production build
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-10a8-81f7-815c-502110fd1d14/raw?se=2026-08-21T03%3A22%3A24Z&sp=r&sv=2026-02-06&sr=b&scid=e65030f4-a7b7-5ad8-99b7-3d479746a0ba&skoid=e9d2f8b1-028a-4cff-8eb1-d0e66fbefcca&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-20T19%3A57%3A52Z&ske=2026-08-21T19%3A57%3A52Z&sks=b&skv=2026-02-06&sig=ZaqP0aoM/IWbce7n%2BCrsS3MHOb6jRgwf7Mt%2BfaPKoZU%3D' -o /tmp/bridgepoint-v393.zip
          echo 'd765e70ae04b42eaeb4f28d11966d1dcca2721cc4811edcfaf6a3098ffe2bb0f  /tmp/bridgepoint-v393.zip' | sha256sum -c -

          rm -rf site
          mkdir -p site
          unzip -q /tmp/bridgepoint-v393.zip -d site
          touch site/.nojekyll
          sed -i 's#<base href="/">#<base href="./">#' site/index.html

          test -s site/index.html
          test -s site/main.dart.js
          test -s site/bridgepoint-release.json
          grep -q '03a44232b666f5f92fcc4cb73b75b82b837dc946' site/bridgepoint-release.json
          grep -q 'https://bridgepointintelligence.online/' site/bridgepoint-release.json

          # PWA freshness / install contracts.
          grep -q 'bridgepoint-v310-install-onboarding' site/index.html
          grep -q 'bridgepoint_auto_update_restoring' site/index.html
          grep -q 'beforeinstallprompt' site/index.html

          # Current national/customer-preview contracts.
          grep -q 'bridgepoint_owner_preview_signals_v390' site/main.dart.js
          grep -q 'bridgepoint_owner_preview_opportunities_v390' site/main.dart.js
          grep -q 'bridgepoint_public_expansion_status_v321' site/main.dart.js
          grep -q 'bridgepoint_ai_answer_v322' site/main.dart.js
          grep -q 'bridgepoint_network_feed_v323' site/main.dart.js
          grep -q 'BridgePoint Community Chat' site/main.dart.js
          grep -q 'NOAA LIVE RAIN / PRECIPITATION RADAR' site/main.dart.js
          grep -q 'Preview package fit' site/main.dart.js
          grep -q 'Investor Room' site/main.dart.js

          # These regressions were visible on the owner's phone and must never ship again.
          if grep -q 'Expansion Engine' site/main.dart.js site/index.html; then
            echo 'Legacy Expansion Engine launcher unexpectedly remains.' >&2
            exit 1
          fi
          if grep -q 'Enabled Connecticut sources' site/main.dart.js; then
            echo 'Legacy Connecticut-only source summary unexpectedly remains.' >&2
            exit 1
          fi
          if grep -q 'bridgepoint-social-publisher-v120' site/main.dart.js; then
            echo 'Automatic social publisher unexpectedly remains.' >&2
            exit 1
          fi

          echo 'BridgePoint v393 audited production artifact ready for GitHub Pages deployment.'

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish BridgePoint
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record verified live deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          release=json.loads(Path('site/bridgepoint-release.json').read_text(encoding='utf-8'))
          receipt={
            'status':'PUBLISHED',
            'release_sha':release['version'],
            'built_at':release.get('built_at'),
            'deployed_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'public_origin':release.get('public_origin'),
            'pages_url':os.environ.get('PAGE_URL'),
            'artifact_sha256':'d765e70ae04b42eaeb4f28d11966d1dcca2721cc4811edcfaf6a3098ffe2bb0f',
            'source_build_repo':'olekingkole28-dot/bridgepoint_data_studio',
            'source_workflow_run_id':32441479163,
            'source_release_sha':'03a44232b666f5f92fcc4cb73b75b82b837dc946',
            'source_branch_head_sha':'ee9d315064421c5b3c8ccc043ed24d58bac64f15',
            'merged_release_sha':'6265e86ec815e0f190e356234b21113f9cd7b4f6',
            'release_label':'BridgePoint v390-v393 mobile owner cleanup, radar continuity and real package/state customer preview'
          }
          Path('live-release-status.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(receipt,indent=2))
          PY
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add live-release-status.json
          git commit -m 'Record BridgePoint v393 live deployment [skip ci]'
          git push origin HEAD:main

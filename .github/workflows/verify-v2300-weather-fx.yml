name: Verify V2300 Cinematic Weather FX

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'release-v2300/world-v2300-weather.js'
      - 'release-v2300/world-v2300-rain.js'
      - 'release-v2300/world-v2300-clouds.js'
      - 'release-v2300/world-v2300-map.js'
      - 'release-v2300/world-v2300-config.js'
      - '.github/workflows/verify-v2300-weather-fx.yml'
  pull_request:
    branches: [main]
    paths:
      - 'release-v2300/world-v2300-weather.js'
      - 'release-v2300/world-v2300-rain.js'
      - 'release-v2300/world-v2300-clouds.js'
      - 'release-v2300/world-v2300-map.js'
      - 'release-v2300/world-v2300-config.js'
      - '.github/workflows/verify-v2300-weather-fx.yml'

permissions:
  contents: read

jobs:
  weather-fx:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Android single-context cinematic weather gate
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)
          rm -rf /tmp/bp2300wx && mkdir -p /tmp/bp2300wx/vendor
          cp release-v2300/world-v2300-config.js /tmp/bp2300wx/world-v2300-config.js
          cp release-v2300/world-v2300-map.js /tmp/bp2300wx/world-v2300-map.js
          cp release-v2300/world-v2300-space.js /tmp/bp2300wx/world-v2300-space.js
          cp release-v2300/world-v2300-worker.js /tmp/bp2300wx/world-v2300-worker.js
          cp release-v2300/world-v2300-weather.js /tmp/bp2300wx/world-v2300-weather.js
          cp release-v2300/world-v2300-rain.js /tmp/bp2300wx/world-v2300-rain.js
          cp release-v2300/world-v2300-clouds.js /tmp/bp2300wx/world-v2300-clouds.js
          curl --retry 4 --retry-all-errors --retry-delay 1 -fsSL https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.2/dist/maplibre-gl.js -o /tmp/bp2300wx/vendor/maplibre-gl.js
          curl --retry 4 --retry-all-errors --retry-delay 1 -fsSL https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.2/dist/maplibre-gl.css -o /tmp/bp2300wx/vendor/maplibre-gl.css
          grep -Fq 'sharedMapLibreWebGLContext:true' /tmp/bp2300wx/world-v2300-weather.js
          grep -Fq 'rainSnowHail:true' /tmp/bp2300wx/world-v2300-weather.js
          grep -Fq "if(pr==='rain')return;" /tmp/bp2300wx/world-v2300-weather.js
          grep -Fq 'retireLegacyScreenSpaceRain' /tmp/bp2300wx/world-v2300-weather.js
          grep -Fq '__BP_SCREEN_SPACE_RAIN_RETIRE_V6063__' /tmp/bp2300wx/world-v2300-weather.js
          grep -Fq "const RAIN_OVERLAY_ID = 'bp2300-rain-geographic-svg-v6068';" /tmp/bp2300wx/world-v2300-rain.js
          grep -Fq 'const VERSION = 6068;' /tmp/bp2300wx/world-v2300-rain.js
          grep -Fq "const RAIN_OVERLAY_ID = 'bp2300-rain-geographic-svg-v6068';" /tmp/bp2300wx/world-v2300-rain.js
          grep -Fq 'function drawProjectedRain(now)' /tmp/bp2300wx/world-v2300-rain.js
          grep -Fq 'map.project([d.lng, d.lat])' /tmp/bp2300wx/world-v2300-rain.js
          grep -Fq 'world-v2300-rain.js?v=6070-clouds-only-phase' /tmp/bp2300wx/world-v2300-weather.js
          grep -Fq "lastProjectionMode = 'geographic-map-project'" /tmp/bp2300wx/world-v2300-rain.js
          grep -Fq 'map.project([d.lng, d.lat])' /tmp/bp2300wx/world-v2300-rain.js
          grep -Fq 'const MAX_DROPS = MOBILE ? 900 : 3600;' /tmp/bp2300wx/world-v2300-rain.js
          grep -Fq 'screenScaleM * 0.75' /tmp/bp2300wx/world-v2300-rain.js
          grep -Fq 'const shelfAltitude = f.baseM + clamp((f.topM - f.baseM) * 0.12, 160, 260);' /tmp/bp2300wx/world-v2300-clouds.js
          grep -Fq 'metersPerPixel(lat, zoom) * 0.78' /tmp/bp2300wx/world-v2300-rain.js
          grep -Fq 'segmentM: 1.2 + hash(seedBase, i, 23) * 2.4' /tmp/bp2300wx/world-v2300-rain.js
          grep -Fq 'else radiusM = thunder ? 900 : 650;' /tmp/bp2300wx/world-v2300-rain.js
          grep -Fq '(thunderstorm ? 900 : 650);' /tmp/bp2300wx/world-v2300-clouds.js
          grep -Fq 'thunderstorm ? 450 : 350' /tmp/bp2300wx/world-v2300-clouds.js
          grep -Fq 'thunderstorm ? 2800 : 1800' /tmp/bp2300wx/world-v2300-clouds.js
          grep -Fq 'rainCell=smoothstep(1.30,1.34,v_tint)' /tmp/bp2300wx/world-v2300-clouds.js
          grep -Fq 'wildfireFlameParticles:true' /tmp/bp2300wx/world-v2300-weather.js
          grep -Fq 'tornadoCone:true' /tmp/bp2300wx/world-v2300-weather.js
          grep -Fq 'hurricaneSpiralEye:true' /tmp/bp2300wx/world-v2300-weather.js
          grep -Fq "projectionType=String(options.projection" /tmp/bp2300wx/world-v2300-map.js
          grep -Fq "projection:{type:projectionType}" /tmp/bp2300wx/world-v2300-map.js

          cat >/tmp/bp2300wx/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <link rel="stylesheet" href="./vendor/maplibre-gl.css">
          <style>html,body,[data-surface="map"],#liveMap{margin:0;width:100%;height:100%;overflow:hidden;background:#071017}#mapStatus,#mapResults{position:absolute;z-index:5}.maplibregl-control-container{display:none}</style></head>
          <body><section data-surface="map" class="active"><button data-base="gta" class="active">MAP</button><button data-base="satellite">SAT</button><button data-layer="parcels">PARCELS</button><button data-layer="buildings" class="active">3D</button><button data-layer="signals" class="active">LIVE</button><button data-layer="radar">RADAR</button><button id="locateMe">LOCATE</button><button id="resetMap">RESET</button><div id="liveMap"></div><div id="mapStatus"></div><div id="mapResults"></div></section><canvas id="bp2081WeatherCanvas"></canvas>
          <script src="./vendor/maplibre-gl.js"></script>
          <script type="module">
            import {initWorld} from './world-v2300-map.js';
            import {initWeather} from './world-v2300-weather.js';
            import {initSkyClouds} from './world-v2300-clouds.js';
            const world=initWorld();window.__bpWorldV2300=world;
            // Production-map integration is verified by V5000. This weather gate removes
            // third-party tile latency while retaining the production MapLibre canvas/context.
            world.map.setStyle({version:8,sources:{},layers:[{id:'gate-bg',type:'background',paint:{'background-color':'#071017'}}]});
            const attach=()=>{
              try{
                if(window.__bpWeatherV2300)return;
                const style=world?.map?.getStyle?.();
                if(!style||!Array.isArray(style.layers)||!style.layers.length)return;
                window.__bpWeatherV2300=initWeather(world.map);
                window.__bpRainCloudAnchorTest=initSkyClouds(world);
                window.__BP_WX_TEST_READY__=true;
              }catch(e){window.__BP_WX_TEST_ERROR__=String(e?.stack||e)}
            };
            world.map.on('style.load',attach);world.map.on('styledata',attach);
            [0,50,150,350,800,1600].forEach(ms=>setTimeout(attach,ms));
          </script></body></html>
          HTML

          (cd /tmp/bp2300wx && python3 -m http.server 8770 >/tmp/bp2300wx-http.log 2>&1 &)
          cd /tmp
          npm init -y >/dev/null 2>&1 || true
          npm install puppeteer@24 --no-audit --no-fund >/dev/null 2>&1
          if [[ -z "$CHROME" ]]; then CHROME=$(node -e "process.stdout.write(require('puppeteer').executablePath())"); fi
          [[ -x "$CHROME" ]] || { echo "No usable Chrome/Chromium binary for Android weather gate: $CHROME"; exit 1; }
          CHROME_PATH="$CHROME" node <<'NODE'
          const puppeteer=require('puppeteer'),assert=require('assert');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox','--disable-dev-shm-usage','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader','--use-gl=angle','--use-angle=swiftshader','--disable-gpu-sandbox']});
            try{
              const p=await browser.newPage(),errors=[];
              p.on('pageerror',e=>errors.push(String(e.stack||e.message||e)));
              p.on('console',m=>{const t=m.text();if(m.type()==='error'&&!/favicon/i.test(t)&&!/Failed to load resource: the server responded with a status of 404/i.test(t))errors.push(t)});
              await p.setRequestInterception(true);
              const cors={'Access-Control-Allow-Origin':'*','Access-Control-Allow-Headers':'authorization,x-client-info,apikey,content-type','Access-Control-Allow-Methods':'POST,OPTIONS'};
              let rainVisualOnly = false;
              p.on('request',req=>{
                const u=req.url();
                if(u.includes('/functions/v1/bridgepoint-world-effects-v2190')){
                  if(req.method()==='OPTIONS')return req.respond({status:204,headers:cors,body:''});
                  const poly=(x,y,r)=>({type:'Polygon',coordinates:[[[x-r,y-r],[x+r,y-r],[x+r,y+r],[x-r,y+r],[x-r,y-r]]]});
                  const now=new Date().toISOString();
                  const body={complete:true,generated_at:now,sources:['NOAA/NWS gate','NIFC/WFIGS gate','USGS gate'],alerts:[{geometry:poly(-87.3425,41.538,.025),properties:{phenom:'TO',event:'Tornado Warning'}},{geometry:poly(-87.40,41.50,.04),properties:{phenom:'FF',event:'Flash Flood Warning'}},{geometry:poly(-87.29,41.56,.035),properties:{event:'Ice Storm Warning'}}],fires:[{id:'gate-fire',name:'Gate Fire',acres:48000,contained_pct:37,source:'NIFC/WFIGS',geometry:poly(-87.325,41.53,.018)}],earthquakes:[{lng:-87.31,lat:41.55,magnitude:4.2}],storms:[{id:'gate-storm',name:'Gate Hurricane',lng:-87.37,lat:41.57,wind_mph:128,eye_radius_mi:11}],thermal:[{lng:-87.326,lat:41.531,frp:92}],observations:[{lng:-87.3425,lat:41.538,temperature_f:72,cloud_fraction:.92,visibility_mi:.65,weather:'Thunderstorms with heavy rain',wind_speed_mph:31,wind_dir_deg:235}],lightning_activity:[{lng:-87.34,lat:41.541,observed_at:now,exact_strike:false,source:'NOAA/NWS METAR thunderstorm activity'}],burn_scars:[{source:'authoritative-gate',geometry:poly(-87.318,41.522,.012)}],water_levels:[{lng:-87.36,lat:41.51,water_level_m:1.4,source:'NOAA CO-OPS'}]};
                  if (rainVisualOnly) {
                    body.alerts = [];
                    body.fires = [];
                    body.earthquakes = [];
                    body.storms = [];
                    body.thermal = [];
                    body.lightning_activity = [];
                    body.burn_scars = [];
                    body.water_levels = [];
                  }
                  return req.respond({status:200,headers:{...cors,'Content-Type':'application/json'},body:JSON.stringify(body)});
                }
                req.continue();
              });
              await p.setUserAgent('Mozilla/5.0 (Linux; Android 16; Pixel 9a) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36');
              await p.setViewport({width:390,height:844,deviceScaleFactor:2,isMobile:true,hasTouch:true});
              await p.goto('http://127.0.0.1:8770/',{waitUntil:'domcontentloaded',timeout:20000});
              await p.waitForFunction(()=>window.__BP_WX_TEST_READY__===true||window.__BP_WX_TEST_ERROR__,{timeout:25000});
              const initErr=await p.evaluate(()=>window.__BP_WX_TEST_ERROR__||null);assert.equal(initErr,null,initErr||'');
              const retired=await p.evaluate(()=>({canvasGone:!document.getElementById('bp2081WeatherCanvas'),blocked:window.__BP_SCREEN_SPACE_RAIN_RETIRE_V6063__?.legacyRuntimeBlocked===true}));
              assert.equal(retired.canvasGone,true,'legacy screen-space weather canvas must be removed');
              assert.equal(retired.blocked,true,'legacy screen-space weather runtime must be blocked');
              await p.evaluate(()=>window.__bpWorldV2300.map.jumpTo({center:[-87.3425,41.538],zoom:10.5,pitch:58,bearing:-12}));
              await p.evaluate(()=>window.__bpWeatherV2300.refresh(true));
              await p.waitForFunction(()=>window.__bpWeatherV2300?.state?.counts?.alerts===3,{timeout:15000});
              await p.waitForFunction(()=>Number(window.__BP_SKY_CLOUDS_STATE_V5908__?.localCloudFormations||0)>0,{timeout:15000});
              await p.evaluate(()=>window.__bpWorldV2300.map.jumpTo({center:[-87.3425,41.538],zoom:1.25,pitch:0,bearing:0}));
              await p.evaluate(()=>window.__bpWeatherV2300.refresh(true));
              await p.waitForFunction(()=>{const s=window.__BP_SKY_CLOUDS_STATE_V5908__||{};return s.version===6079&&s.hurricaneEyeWallCloudCenters>=18&&s.hurricaneSpiralCloudCenters>=24&&s.warningFunnels>=1&&s.tornadoVisualHeightKm>=240;},{timeout:15000});
              const globalStormDiag=await p.evaluate(()=>{const s=window.__BP_SKY_CLOUDS_STATE_V5908__||{};return{zoom:s.zoom,sourceStormCount:s.sourceStormCount,sourceTornadoAlertCount:s.sourceTornadoAlertCount,hurricaneEyeWallCloudCenters:s.hurricaneEyeWallCloudCenters,hurricaneSpiralCloudCenters:s.hurricaneSpiralCloudCenters,hurricaneVisualEyeRadiusKm:s.hurricaneVisualEyeRadiusKm,hurricaneVisualShieldRadiusKm:s.hurricaneVisualShieldRadiusKm,tornadoFunnelMeshVertices:s.tornadoFunnelMeshVertices,tornadoVisualHeightKm:s.tornadoVisualHeightKm,tornadoVisualTopRadiusKm:s.tornadoVisualTopRadiusKm,globalStormLod:s.globalStormLod,rendererError:s.rendererError}});
              console.log('BRIDGEPOINT_GLOBAL_STORM_LOD_PASS',JSON.stringify(globalStormDiag));
              assert(globalStormDiag.hurricaneVisualEyeRadiusKm>=80,'hurricane eye must remain visible at global zoom');
              assert(globalStormDiag.hurricaneVisualShieldRadiusKm>=1400,'hurricane spiral system must remain visible at global zoom');
              assert(globalStormDiag.tornadoVisualHeightKm>=240,'tornado funnel must receive global visibility LOD');
              assert(globalStormDiag.tornadoVisualTopRadiusKm>=60,'tornado funnel width must be visible at global zoom');
              assert.equal(globalStormDiag.globalStormLod,'global-exaggerated-visibility','whole-globe zoom selects global storm LOD');
              await p.evaluate(()=>window.__bpWorldV2300.map.jumpTo({center:[-87.3425,41.538],zoom:10.5,pitch:58,bearing:-12}));
              await p.evaluate(()=>window.__bpWeatherV2300.refresh(true));
              await p.waitForFunction(()=>{const s=window.__BP_SKY_CLOUDS_STATE_V5908__||{};return s.globalStormLod==='physical-local'&&s.hurricaneVisualEyeRadiusKm>0&&s.tornadoVisualHeightKm<30;},{timeout:15000});
              const stormCloudDiag=await p.evaluate(()=>{const s=window.__BP_SKY_CLOUDS_STATE_V5908__||{};return{version:s.version,globalCloudFormations:s.globalCloudFormations,globalThinLayerSlices:s.globalThinLayerSlices,globalThinLayerStacks:s.globalThinLayerStacks,globalSingleLayerSlices:s.globalSingleLayerSlices,globalSingleLayerStacks:s.globalSingleLayerStacks,globalMacroRadiusMaxKm:s.globalMacroRadiusMaxKm,hurricaneSpiralCloudCenters:s.hurricaneSpiralCloudCenters,hurricaneEyeWallCloudCenters:s.hurricaneEyeWallCloudCenters,hurricaneEyeRadiusKm:s.hurricaneEyeRadiusKm,hurricaneEyeRadiusSource:s.hurricaneEyeRadiusSource,hurricaneCloudShieldRadiusKm:s.hurricaneCloudShieldRadiusKm,warningFunnels:s.warningFunnels,tornadoFunnelMeshVertices:s.tornadoFunnelMeshVertices,tornadoFunnelAnimated:s.tornadoFunnelAnimated,hurricaneVortexAnimated:s.hurricaneVortexAnimated,cloudWaterHeightReference:s.cloudWaterHeightReference,globalHeightResolvedWindPuffs:s.globalHeightResolvedWindPuffs,globalModelledWindPuffs:s.globalModelledWindPuffs,rendererError:s.rendererError};});
              console.log('BRIDGEPOINT_ROUNDED_GLOBAL_CLOUDS_AND_HURRICANE_SPIRAL_DIAG',JSON.stringify(stormCloudDiag));
              assert.equal(stormCloudDiag.version,6079,'v6079 cloud renderer must be loaded');
              assert(stormCloudDiag.globalCloudFormations>=1600,'mobile global field must retain approximately 1,620 formations');
              assert.equal(stormCloudDiag.globalThinLayerSlices,9,'thin global clouds must use a smooth nine-segment shallow silhouette');
              assert.equal(stormCloudDiag.globalThinLayerStacks,2,'thin cloud geometry must stay thin and low-cost');
              assert.equal(stormCloudDiag.globalSingleLayerSlices,8,'isolated cloud silhouettes must be rounded at global zoom');
              assert.equal(stormCloudDiag.globalSingleLayerStacks,2,'isolated clouds must preserve low vertex cost');
              assert(stormCloudDiag.globalMacroRadiusMaxKm>=900,'large global cloud banks must extend to regional scale');
              assert(stormCloudDiag.hurricaneEyeWallCloudCenters>=18,'source hurricane must build a distinct eyewall ring');
              assert(stormCloudDiag.hurricaneSpiralCloudCenters>=24,'source hurricane must produce multiple curved spiral arms');
              assert(stormCloudDiag.hurricaneEyeRadiusKm>0&&String(stormCloudDiag.hurricaneEyeRadiusSource).includes('source'),'fixture hurricane eye radius must be source-backed');
              assert(stormCloudDiag.hurricaneCloudShieldRadiusKm>=520,'hurricane cloud shield must use storm-scale radius, not eye radius');
              assert(stormCloudDiag.warningFunnels>=1,'a source tornado warning must create a cloud-layer funnel');
              assert(stormCloudDiag.tornadoFunnelMeshVertices>=180,'the 3D tornado mesh must render on mobile as well as desktop');
              assert.equal(stormCloudDiag.tornadoFunnelAnimated,true,'the 3D tornado mesh must rotate');
              assert.equal(stormCloudDiag.hurricaneVortexAnimated,true,'hurricane eyewall and spiral geometry must animate around the eye');
              assert(stormCloudDiag.globalModelledWindPuffs>0,'the global field must expose modelled wind fallback honestly when no upper-air wind grid is supplied');
              assert(/(?:mean-sea-level 0 m fallback|0 m mean-sea-level fallback)/.test(String(stormCloudDiag.cloudWaterHeightReference)),'clouds over water must use mean sea level as the fallback reference, not seabed elevation');
              await p.waitForFunction(()=>window.__bpWeatherV2300?.fx?.state?.shaderReady===true,{timeout:15000});
              await p.waitForFunction(()=>window.__bpWeatherV2300?.fx?.state?.activeParticles>40,{timeout:15000});
              await new Promise(r=>setTimeout(r,1200));
              const out=await p.evaluate(()=>{const m=window.__bpWorldV2300.map,fx=window.__bpWeatherV2300.fx.state,w=window.__bpWeatherV2300.state;return{fx,w,mapCanvases:document.querySelectorAll('#liveMap canvas').length,totalCanvases:document.querySelectorAll('canvas').length,projection:m.getProjection?.()?.type||'',layers:['bp2300-weather-fx-gpu','bp2300-fx-tornado','bp2300-fx-hurricane','bp2300-fx-flood-fill','bp2300-fx-ice-fill','bp2300-fx-burn','bp2300-fx-containment'].every(id=>!!m.getLayer(id))}});
              console.log('V2300_WX',JSON.stringify(out));
              assert.equal(out.mapCanvases,1);assert.equal(out.totalCanvases,1);assert.notEqual(out.projection,'globe');assert(out.layers);
              assert.equal(out.fx.sharedMapLibreWebGLContext,true);assert.equal(out.fx.secondaryCanvases,0);assert.equal(out.fx.shaderReady,true);assert(out.fx.activeParticles>40);
              assert(out.fx.budgets.maxPoints<=760);assert(out.fx.qualityScale>=.28&&out.fx.qualityScale<=1);
              assert.equal(out.w.counts.alerts,3);assert.equal(out.w.counts.fires,1);assert.equal(out.w.counts.storms,1);assert.equal(out.w.counts.lightning,1);assert.equal(out.w.counts.water,1);
              rainVisualOnly = true;
              await p.evaluate(()=>window.__bpWeatherV2300.refresh(true));
              await p.waitForFunction(()=>{
                const s=window.__bpWeatherV2300?.state?.counts;
                return !!s&&s.alerts===0&&s.fires===0&&s.storms===0&&s.lightning===0&&s.water===0&&s.observations===1;
              },{timeout:15000});
              await p.evaluate(()=>window.__bpWorldV2300.map.jumpTo({center:[0,24],zoom:1.25,pitch:0,bearing:0}));
              await p.evaluate(()=>window.__bpWeatherV2300.refresh(true));
              await p.waitForFunction(()=>{const s=window.__BP_SKY_CLOUDS_STATE_V5908__||{};return s.version===6079&&s.sourceStormCount===0&&s.sourceTornadoAlertCount===0&&s.modeledHurricaneVisualCount===1&&s.modeledTornadoVisualCount===1&&s.hurricaneEyeWallCloudCenters>=18&&s.hurricaneSpiralCloudCenters>=24&&s.warningFunnels>=1&&s.tornadoVisualHeightKm>=240;},{timeout:15000});
              const modeledGlobalStorms=await p.evaluate(()=>{const s=window.__BP_SKY_CLOUDS_STATE_V5908__||{};return{zoom:s.zoom,sourceStormCount:s.sourceStormCount,sourceTornadoAlertCount:s.sourceTornadoAlertCount,modeledHurricaneVisualCount:s.modeledHurricaneVisualCount,modeledTornadoVisualCount:s.modeledTornadoVisualCount,hurricaneEyeWallCloudCenters:s.hurricaneEyeWallCloudCenters,hurricaneSpiralCloudCenters:s.hurricaneSpiralCloudCenters,hurricaneEyeRadiusSource:s.hurricaneEyeRadiusSource,warningFunnels:s.warningFunnels,tornadoVisualHeightKm:s.tornadoVisualHeightKm,stormVisualProvenance:s.stormVisualProvenance,rendererError:s.rendererError};});
              console.log('BRIDGEPOINT_MODELED_STORM_FALLBACK_EMPTY_FEED_PASS',JSON.stringify(modeledGlobalStorms));
              assert.equal(modeledGlobalStorms.modeledHurricaneVisualCount,1,'empty live feed still shows a modeled hurricane cloud vortex');
              assert.equal(modeledGlobalStorms.modeledTornadoVisualCount,1,'empty live feed still shows a modeled tornado cloud funnel');
              assert.equal(modeledGlobalStorms.sourceStormCount,0,'modeled vortices must not be counted as source storms');
              assert.equal(modeledGlobalStorms.sourceTornadoAlertCount,0,'modeled funnel must not be counted as a live tornado warning');
              assert(String(modeledGlobalStorms.stormVisualProvenance).includes('not source-backed live weather'),'modeled fallback provenance must be explicit');
              await p.evaluate(()=>window.__bpWorldV2300.map.jumpTo({center:[-97.45,35.55],zoom:10.5,pitch:58,bearing:-12}));
              await p.evaluate(()=>window.__bpWeatherV2300.refresh(true));
              await p.waitForFunction(()=>{const s=window.__BP_SKY_CLOUDS_STATE_V5908__||{};return s.globalStormLod==='physical-local'&&s.modeledTornadoVisualCount===1&&s.warningFunnels>=1&&s.tornadoVisualHeightKm<30;},{timeout:15000});
              await new Promise(r=>setTimeout(r,550));

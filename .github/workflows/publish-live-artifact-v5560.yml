# Authoritative V5560 publisher
name: Publish Verified Live Artifact V5560

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-live-artifact-v5560.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-artifact
          fetch-depth: 1

      - name: Verify live-artifact interaction and parcel fixes
        shell: bash
        run: |
          set -euo pipefail
          test -s world-v2300-map.js
          test -s app.js
          test -s parcel-boundary-viewer-v5403.js
          grep -Fq '__BP_WORLD_RENDER_VERSION__=5560' world-v2300-map.js
          grep -Fq '__BP_WORLD_PERFORMANCE_V5560__' world-v2300-map.js
          grep -Fq "single-maplibre-click" world-v2300-map.js
          grep -Fq "MOBILE?6.45" world-v2300-map.js
          grep -Fq "parcelLinesPersistDuringMotion:true" world-v2300-map.js
          grep -Fq "overlayLayers" world-v2300-map.js
          ! grep -Fq "canvas.addEventListener('click'" world-v2300-map.js
          grep -Fq '__BP_INTERACTION_CIRCUIT_BREAKER_V5560__' app.js
          grep -Fq 'const VERSION=5404' parcel-boundary-viewer-v5403.js
          grep -Fq "minzoom:5.9" parcel-boundary-viewer-v5403.js
          grep -Fq 'parcel-boundary-viewer-v5403.js?v=5560' index.html
          grep -Fq 'parcel-boundary-viewer-v5403.js?v=5560' app/index.html
          echo LIVE_ARTIFACT_V5560_CONTRACT_OK

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-live-artifact-v5560
          path: .

      - name: Deploy verified live artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: bridgepoint-live-artifact-v5560

      - name: Verify production serves V5560 interaction fixes
        shell: bash
        run: |
          set -euo pipefail
          O='https://bridgepointintelligence.online'
          ok=0
          for i in $(seq 1 36); do
            q="v5560-${GITHUB_SHA}-${i}-$(date +%s)"
            curl --retry 2 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/world-v2300-map.js?${q}" -o /tmp/world.js || true
            curl --retry 2 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/app.js?${q}" -o /tmp/app.js || true
            curl --retry 2 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/parcel-boundary-viewer-v5403.js?${q}" -o /tmp/boundary.js || true
            if grep -Fq '__BP_WORLD_PERFORMANCE_V5560__' /tmp/world.js \
              && grep -Fq 'single-maplibre-click' /tmp/world.js \
              && grep -Fq 'MOBILE?6.45' /tmp/world.js \
              && grep -Fq '__BP_INTERACTION_CIRCUIT_BREAKER_V5560__' /tmp/app.js \
              && grep -Fq 'const VERSION=5404' /tmp/boundary.js; then
              ok=1
              echo BRIDGEPOINT_V5560_PRODUCTION_LIVE
              break
            fi
            sleep 4
          done
          test "${ok}" = 1

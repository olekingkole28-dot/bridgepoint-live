name: Publish BridgePoint Liquid Turbulence and True Depth V1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-liquid-turbulence-depth-v1.yml'
      - 'scripts/overlay_liquid_turbulence_depth_v1.py'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify public bathymetry and patch syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/overlay_liquid_turbulence_depth_v1.py
          curl --retry 4 --retry-all-errors --max-time 30 -fsSL 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/3/4/4.png' -o "$RUNNER_TEMP/terrain.png"
          python3 - <<'PY'
          from PIL import Image
          import os
          im=Image.open(os.environ['RUNNER_TEMP']+'/terrain.png').convert('RGB')
          elevations=[r*256+g+b/256-32768 for r,g,b in im.getdata()]
          assert min(elevations)<-1000, 'No negative ocean terrain in public tile'
          print('PUBLIC_BATHYMETRY_NEGATIVE_METERS_PASS', min(elevations))
          PY
      - name: Download latest verified persistent globe release
        uses: actions/download-artifact@v4
        with:
          name: bridgepoint-v5000-2
          run-id: 45309940377
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline
      - name: Patch only deployed water and sensor modules
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/bp-liquid-site"
          mkdir -p "$SITE"
          ARCHIVE="$(find "$RUNNER_TEMP/baseline" -type f -name artifact.tar -print -quit)"
          test -n "$ARCHIVE"
          tar -xf "$ARCHIVE" -C "$SITE"
          python3 scripts/overlay_liquid_turbulence_depth_v1.py "$SITE"
          for f in world-v2300-water.js world-v2300-sensor-layers.js app/world-v2300-water.js app/world-v2300-sensor-layers.js landing.js app.js; do
            node --input-type=module --check < "$SITE/$f"
          done
          grep -Fq 'float liquidNoise' "$SITE/world-v2300-water.js"
          grep -Fq 'targetAltitude=Math.min(-3,bed+clearance)' "$SITE/world-v2300-sensor-layers.js"
          grep -Fq 'restoreWaterGLState(gl, savedWaterState)' "$SITE/world-v2300-water.js"
          grep -Fq 'globe-foundation-v20261123-v6' "$SITE/landing.js"
          grep -Fq 'globe-foundation-v20261123-v6' "$SITE/app.js"
          for f in bridgepoint-earth-protection-v1.js bridgepoint-neo-watch-v1.js bridgepoint-conflict-zones-v1.js; do test -s "$SITE/$f"; done
          echo LIQUID_TURBULENCE_DEPTH_BUILD_PASS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-v5000-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bp-liquid-site
          include-hidden-files: true
      - name: Publish preserved site
        id: deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deploy-pages-extended.mjs
      - name: Verify public water modules and cache keys
        shell: bash
        run: |
          set -euo pipefail
          O=https://bridgepointintelligence.online
          SITE="$RUNNER_TEMP/bp-liquid-site"
          for p in world-v2300-water.js app/world-v2300-water.js world-v2300-sensor-layers.js app/world-v2300-sensor-layers.js landing.js app.js index.html app/index.html; do
            curl --retry 8 --retry-all-errors --retry-delay 4 --max-time 40 -fsSL -H 'Cache-Control: no-cache' "$O/$p?liquid=$GITHUB_SHA" -o "$RUNNER_TEMP/liquid-live"
            cmp "$SITE/$p" "$RUNNER_TEMP/liquid-live"
          done
          echo BRIDGEPOINT_LIQUID_TURBULENCE_DEPTH_LIVE_PASS

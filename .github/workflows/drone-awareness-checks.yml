name: BridgePoint Opt-in Layer Checks

on:
  push:
    branches: [main]
    paths:
      - 'rebuild-v5000/bridgepoint-drone-awareness-v1.js'
      - 'rebuild-v5000/bridgepoint-vessel-awareness-v1.js'
      - 'rebuild-v5000/bridgepoint-faa-obstruction-towers-v1.js'
      - 'rebuild-v5000/index.html'
      - 'rebuild-v5000/app-index.html'
      - 'tests/drone-awareness.test.mjs'
      - 'tests/vessel-awareness.test.mjs'
      - 'tests/faa-obstruction-towers-v1.test.mjs'
      - '.github/workflows/drone-awareness-checks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'rebuild-v5000/app.js'
      - 'rebuild-v5000/landing.js'
      - 'rebuild-v5000/bridgepoint-view-v5917.js'
      - 'rebuild-v5000/bridgepoint-drone-awareness-v1.js'
      - 'rebuild-v5000/bridgepoint-vessel-awareness-v1.js'
      - 'rebuild-v5000/index.html'
      - 'rebuild-v5000/app-index.html'
      - 'rebuild-v5000/bridgepoint-map-key-v5920.js'
      - 'tests/drone-awareness.test.mjs'
      - 'tests/vessel-awareness.test.mjs'
      - 'tests/celestial-water-cloud-shadows.test.mjs'
      - '.github/workflows/drone-awareness-checks.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check modified runtime files
        run: |
          node --check rebuild-v5000/app.js
          node --check rebuild-v5000/landing.js
          node --check rebuild-v5000/bridgepoint-view-v5917.js
          node --check rebuild-v5000/bridgepoint-drone-awareness-v1.js
          node --check rebuild-v5000/bridgepoint-vessel-awareness-v1.js
          node --input-type=module --check < rebuild-v5000/bridgepoint-faa-obstruction-towers-v1.js
      - name: Run drone awareness contract checks
        run: |
          node tests/drone-awareness.test.mjs
          node tests/vessel-awareness.test.mjs
          node tests/faa-obstruction-towers-v1.test.mjs
      - name: Run shared rendering regressions
        run: node tests/celestial-water-cloud-shadows.test.mjs
      - name: Verify public ADS-B feed through the no-key CORS relay
        if: github.event_name == 'push'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const upstream = 'https://api.adsb.lol/v2/lat/40.7/lon/-74/dist/250';
          const url = 'https://proxy.cors.dev/' + upstream;
          const response = await fetch(url, { headers: { Accept: 'application/json' } });
          const raw = await response.text();
          assert.equal(response.status, 200, 'public ADS-B feed must return a usable response: ' + raw.slice(0, 300));
          assert.equal(response.headers.get('access-control-allow-origin'), '*', 'public relay must permit browser fetches');
          const body = JSON.parse(raw);
          assert.ok(Array.isArray(body.ac), 'ADSB.lol must return its real aircraft array');
          assert.ok(Number.isFinite(Number(body.total)) || body.ac.length >= 0, 'ADS-B response total is valid');
          console.log('BRIDGEPOINT_PUBLIC_ADSB_CORS_RELAY_PASS', JSON.stringify({ records: body.ac.length, total: body.total }));
          NODE

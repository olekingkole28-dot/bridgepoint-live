      <path d="M492 775 463 833M514 775l29 58" fill="none" stroke="#E7D5C3" stroke-width="16" stroke-linecap="round"/>
      <path d="M468 713 555 674" stroke="#0A0807" stroke-width="13" stroke-linecap="round"/>
      <path d="M540 671 577 659" stroke="#0A0807" stroke-width="18" stroke-linecap="round"/>
    </g>
  </g>

  <rect x="84" y="84" width="856" height="856" rx="208" fill="none" stroke="#FF3A13" stroke-width="14" opacity=".78"/>
  <rect x="98" y="98" width="828" height="828" rx="196" fill="none" stroke="#FF7B21" stroke-width="4" opacity=".45"/>

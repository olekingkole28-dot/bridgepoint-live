name: Verify V2300 Cinematic Weather FX V3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'release-v2300/world-v2300-weather.js'
      - 'release-v2300/world-v2300-rain.js'
      - 'release-v2300/world-v2300-lightning.js'
      - 'release-v2300/world-v2300-clouds.js'
      - 'release-v2300/world-v2300-map.js'
      - 'release-v2300/world-v2300-config.js'
      - '.github/workflows/verify-v2300-weather-fx-v3.yml'

  pull_request:
    branches: [main]
    paths:
      - 'release-v2300/world-v2300-weather.js'
      - 'release-v2300/world-v2300-rain.js'
      - 'release-v2300/world-v2300-lightning.js'
      - 'release-v2300/world-v2300-clouds.js'
      - 'release-v2300/world-v2300-map.js'
      - 'release-v2300/world-v2300-config.js'
      - '.github/workflows/verify-v2300-weather-fx-v3.yml'

permissions:
  contents: read

jobs:
  weather-fx:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Android one-context weather stress gate
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          rm -rf /tmp/bpwx3 && mkdir -p /tmp/bpwx3/vendor

          cp release-v2300/world-v2300-config.js /tmp/bpwx3/world-v2300-config.js
          cp release-v2300/world-v2300-map.js /tmp/bpwx3/world-v2300-map.js
          cp release-v2300/world-v2300-space.js /tmp/bpwx3/world-v2300-space.js
          cp release-v2300/world-v2300-worker.js /tmp/bpwx3/world-v2300-worker.js
          cp release-v2300/world-v2300-weather.js /tmp/bpwx3/world-v2300-weather.js
          cp release-v2300/world-v2300-rain.js /tmp/bpwx3/world-v2300-rain.js
          cp release-v2300/world-v2300-lightning.js /tmp/bpwx3/world-v2300-lightning.js
          cp release-v2300/world-v2300-clouds.js /tmp/bpwx3/world-v2300-clouds.js
          curl --retry 4 --retry-all-errors --retry-delay 1 -fsSL https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.2/dist/maplibre-gl.js -o /tmp/bpwx3/vendor/maplibre-gl.js
          curl --retry 4 --retry-all-errors --retry-delay 1 -fsSL https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.2/dist/maplibre-gl.css -o /tmp/bpwx3/vendor/maplibre-gl.css

          cat >/tmp/bpwx3/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <link rel="stylesheet" href="./vendor/maplibre-gl.css">
          <style>html,body,[data-surface="map"],#liveMap{margin:0;width:100%;height:100%;overflow:hidden;background:#071017}#mapStatus,#mapResults{position:absolute;z-index:5}.maplibregl-control-container{display:none}</style></head>
          <body><section data-surface="map" class="active"><button data-base="gta" class="active">MAP</button><button data-base="satellite">SAT</button><button data-layer="parcels">PARCELS</button><button data-layer="buildings" class="active">3D</button><button data-layer="signals" class="active">LIVE</button><button data-layer="radar">RADAR</button><button id="locateMe">LOCATE</button><button id="resetMap">RESET</button><div id="liveMap"></div><div id="mapStatus"></div><div id="mapResults"></div></section>
          <script src="./vendor/maplibre-gl.js"></script>
          <script type="module">
            import {initWorld} from './world-v2300-map.js';
            import {initWeather} from './world-v2300-weather.js';
            import {initSkyClouds} from './world-v2300-clouds.js';
            // Keep this isolated weather fixture deterministic; the production-map gate tests live feed behavior separately.
            window.__BP_TEST_DISABLE_ARCHIVED_JOSEPHINE_FALLBACK__=true;
            const world=initWorld();
            window.__bpWorldV2300=world;
            // The weather gate is intentionally deterministic: production-map behavior is
            // covered by the V5000 smoke, while this gate validates weather on the exact
            // same MapLibre canvas/WebGL context without depending on third-party tile uptime.
            world.map.setStyle({version:8,sources:{},layers:[{id:'gate-bg',type:'background',paint:{'background-color':'#071017'}}]});
            const attach=()=>{
              try{
                if(window.__bpWeatherV2300)return;
                const style=world?.map?.getStyle?.();
                if(!style||!Array.isArray(style.layers)||!style.layers.length)return;
                window.__bpWeatherV2300=initWeather(world.map);
                window.__bpRainCloudAnchorTest=initSkyClouds(world);
                window.__BP_WX_TEST_READY__=true;
              }catch(e){window.__BP_WX_TEST_ERROR__=String(e?.stack||e)}
            };
            world?.map?.on?.('style.load',attach);
            world?.map?.on?.('styledata',attach);
            [0,50,150,350,800,1600].forEach(ms=>setTimeout(attach,ms));
          </script></body></html>
          HTML

          (cd /tmp/bpwx3 && python3 -m http.server 8773 >/tmp/bpwx3-http.log 2>&1 &)
          cd /tmp
          npm init -y >/dev/null 2>&1 || true
          npm install puppeteer-core@24 --no-audit --no-fund >/dev/null 2>&1

          CHROME_PATH="$CHROME" node <<'NODE'
          const puppeteer=require('puppeteer-core'),assert=require('assert');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox','--disable-dev-shm-usage','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader','--use-gl=angle','--use-angle=swiftshader','--disable-gpu-sandbox']});
            try{
              const p=await browser.newPage(),errors=[];
              p.on('pageerror',e=>errors.push(String(e.stack||e.message||e)));
              p.on('console',m=>{const t=m.text();if(m.type()==='error'&&!/favicon/i.test(t)&&!/Failed to load resource: the server responded with a status of 404 \(File not found\)/i.test(t))errors.push(t)});
              await p.setRequestInterception(true);
              const cors={'Access-Control-Allow-Origin':'*','Access-Control-Allow-Headers':'authorization,x-client-info,apikey,content-type','Access-Control-Allow-Methods':'POST,OPTIONS'};
              p.on('request',req=>{
                const u=req.url();
                if(u.includes('/functions/v1/bridgepoint-world-effects-v2190')){
                  if(req.method()==='OPTIONS')return req.respond({status:204,headers:cors,body:''});
                  const poly=(x,y,r)=>({type:'Polygon',coordinates:[[[x-r,y-r],[x+r,y-r],[x+r,y+r],[x-r,y+r],[x-r,y-r]]]});
                  const now=new Date().toISOString();
                  const body={complete:true,generated_at:now,sources:['NOAA/NWS gate','NIFC/WFIGS gate','USGS gate'],alerts:[{geometry:poly(-87.3425,41.538,.025),properties:{phenom:'TO',event:'Tornado Warning'}},{geometry:poly(-87.40,41.50,.04),properties:{phenom:'FF',event:'Flash Flood Warning'}},{geometry:poly(-87.29,41.56,.035),properties:{event:'Ice Storm Warning'}}],fires:[{id:'f1',name:'Gate Fire',acres:48000,contained_pct:37,source:'NIFC/WFIGS',geometry:poly(-87.325,41.53,.018)}],earthquakes:[{lng:-87.31,lat:41.55,magnitude:4.2}],storms:[{id:'s1',name:'Gate Hurricane',lng:-87.37,lat:41.57,wind_mph:128,eye_radius_mi:11}],thermal:[{lng:-87.326,lat:41.531,frp:92}],observations:[{lng:-87.3425,lat:41.538,temperature_f:72,cloud_fraction:.92,visibility_mi:.65,weather:'thunderstorm rain',rawdata:'KXYZ 090100Z 23527KT 1/2SM +TSRA BKN010 OVC020 22/20 A2990',wind_speed_mph:31,wind_dir_deg:235}],lightning_activity:[{lng:-87.34,lat:41.541,observed_at:now,exact_strike:false,source:'NOAA/NWS METAR thunderstorm activity'}],burn_scars:[{source:'authoritative-gate',geometry:poly(-87.318,41.522,.012)}],water_levels:[{lng:-87.36,lat:41.51,water_level_m:1.4,source:'NOAA CO-OPS'}]};
                  return req.respond({status:200,headers:{...cors,'Content-Type':'application/json'},body:JSON.stringify(body)});
                }
                if(u.includes('/functions/v1/bridgepoint-public-building-tile-v5019')||u.includes('/functions/v1/bridgepoint-spatial-tile-v1957')){
                  return req.respond({status:204,headers:{...cors,'Content-Type':'application/x-protobuf'},body:''});
                }
                // The local HTTP fixture has no RPC server. Return deterministic empty results
                // for unrelated POST RPCs rather than letting Python's server return 501s.
                if(req.method()==='OPTIONS'&&/\/rest\/v1\/rpc\//.test(u)){
                  return req.respond({status:204,headers:{...cors,'Access-Control-Allow-Methods':'POST,OPTIONS'},body:''});
                }
                if(req.method()==='POST'&&/\/rest\/v1\/rpc\//.test(u)){
                  return req.respond({status:200,headers:{...cors,'Content-Type':'application/json'},body:'{}'});
                }
                req.continue();
              });
              await p.setUserAgent('Mozilla/5.0 (Linux; Android 16; Pixel 9a) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36');
              await p.setViewport({width:390,height:844,deviceScaleFactor:2,isMobile:true,hasTouch:true});
              await p.goto('http://127.0.0.1:8773/',{waitUntil:'domcontentloaded',timeout:20000});
              await p.waitForFunction(()=>window.__BP_WX_TEST_READY__===true||window.__BP_WX_TEST_ERROR__,{timeout:25000});
              const initErr=await p.evaluate(()=>window.__BP_WX_TEST_ERROR__||null);assert.equal(initErr,null,initErr||'');
              await p.evaluate(()=>window.__bpWorldV2300.map.jumpTo({center:[-87.3425,41.538],zoom:10.5,pitch:58,bearing:-12}));
              await p.evaluate(()=>window.__bpWeatherV2300.refresh(true));
              await p.waitForFunction(()=>window.__bpWeatherV2300?.state?.counts?.alerts===3,{timeout:15000});
              await p.waitForFunction(()=>Number(window.__BP_LIGHTNING_CLOUD_ANCHORS_V6135__?.count||0)>0,{timeout:15000});
              try{await p.waitForFunction(()=>{const s=window.__BP_GOES_CLOUD_CONTEXT_V6134__;return !!s&&['fresh','unavailable','stale'].includes(s.maskStatus);},{timeout:28000});}catch(_){}
              const satelliteCloudDiag=await p.evaluate(()=>{const c=window.__BP_GOES_CLOUD_CONTEXT_V6134__,m=window.__BP_SATELLITE_CLOUD_MASK_V6140__,s=window.__BP_SKY_CLOUDS_STATE_V6140__;return{status:c?.maskStatus||null,lastError:c?.maskLastError||null,setupError:window.__BP_GOES_CLOUD_CONTEXT_V6134_ERROR__||null,cloudInitReturned:!!window.__bpRainCloudAnchorTest,cloudControllerVersion:window.__BP_SKY_CLOUDS_V5908__?.version||null,styleLoaded:window.__bpWorldV2300?.map?.isStyleLoaded?.()===true,sourceEpoch:c?.maskSourceEpoch||null,generation:c?.maskGeneration||0,coverageCells:c?.maskCoverageCells||0,cloudCells:c?.maskCloudCells||0,cloudVolumesRendered:s?.satelliteCloudVolumesRendered||0,cloudMaskAgeMs:s?.satelliteCloudMaskAgeMs??null,maskOnThisMap:m?.map===window.__bpWorldV2300?.map,source:m?.source||null}});
              console.log('BRIDGEPOINT_SATELLITE_CLOUD_MASK_DIAG',JSON.stringify(satelliteCloudDiag));
              if(satelliteCloudDiag.status!=='fresh'||satelliteCloudDiag.generation<1||satelliteCloudDiag.coverageCells<600||satelliteCloudDiag.cloudCells<20)
                throw new Error('SATELLITE_CLOUD_MASK_REFRESH_NOT_USABLE '+JSON.stringify(satelliteCloudDiag));
              await p.waitForFunction(()=>Number(window.__BP_SKY_CLOUDS_STATE_V6140__?.satelliteCloudVolumesRendered||0)>0,{timeout:12000});
              const satelliteCloudVolumes=await p.evaluate(()=>({generation:window.__BP_SKY_CLOUDS_STATE_V6140__?.satelliteCloudMaskGeneration||0,volumes:window.__BP_SKY_CLOUDS_STATE_V6140__?.satelliteCloudVolumesRendered||0,heightsMeasured:window.__BP_SKY_CLOUDS_STATE_V6140__?.satelliteCloudHeightsMeasured,maskStatus:window.__BP_SKY_CLOUDS_STATE_V6140__?.satelliteCloudMaskStatus}));
              console.log('BRIDGEPOINT_SATELLITE_DERIVED_CLOUD_VOLUMES_PASS',JSON.stringify(satelliteCloudVolumes));
              await p.waitForFunction(()=>window.__bpWeatherV2300?.fx?.state?.shaderReady===true,{timeout:15000});
              console.log('WX_PARTICLE_DIAG',JSON.stringify(await p.evaluate(()=>{const m=window.__bpWorldV2300?.map,w=window.__bpWeatherV2300,fx=w?.fx?.state,c=m?.getCanvas?.(),sc=m?.getContainer?.()?.closest?.('[data-surface]'),obs=w?.fx?.scene?.observations?.[0],sch=window.__BP_WEATHER_RENDER_SCHEDULER_V6040__;return{activeParticles:fx?.activeParticles,quality:fx?.qualityScale,shaderReady:fx?.shaderReady,enabled:fx?.enabled,moving:fx?.moving,zoom:m?.getZoom?.(),center:m?.getCenter?.().toArray?.(),canvas:c?{clientWidth:c.clientWidth,clientHeight:c.clientHeight,width:c.width,height:c.height}:null,counts:w?.state?.counts,layerPresent:!!m?.getLayer?.('bp2300-weather-fx-gpu'),renderer:window.__BP_WEATHER_FX_DIAGNOSTIC_V6050__||null,scheduler:sch?{mode:sch.mode,visibleAnimatedEffects:sch.visibleAnimatedEffects,enabled:sch.enabled,moving:sch.moving,counts:sch.counts}:null,surface:sc?{className:sc.className,hidden:sc.hidden,active:sc.classList.contains('active')}:null,obs:obs?{lng:obs.lng,lat:obs.lat,weather:obs.weather,present_weather:obs.present_weather,rawdata:obs.rawdata,visibility_mi:obs.visibility_mi}:null,scene:fx?{observations:w?.fx?.scene?.observations?.length,fires:w?.fx?.scene?.fires?.length,storms:w?.fx?.scene?.storms?.length,alerts:w?.fx?.scene?.alerts?.length,earthquakes:w?.fx?.scene?.earthquakes?.length,lightning:w?.fx?.scene?.lightning?.length}:null,documentHidden:document.hidden}})));
              await p.waitForFunction(()=>{const r=window.__BP_RAIN_RENDERER_V6068__?.state,l=window.__BP_LIGHTNING_RENDERER_V6130__?.state;return r?.worldAnchored===true&&r?.overlayAttached===true&&r?.renderedStreaks>0&&l?.enabled===true&&l?.overlayConnected===true&&l?.anchors>0;},{timeout:15000});
              await new Promise(r=>setTimeout(r,1200));
              const out=await p.evaluate(()=>{const m=window.__bpWorldV2300.map,fx=window.__bpWeatherV2300.fx.state,w=window.__bpWeatherV2300.state;return{fx,w,rain:window.__BP_RAIN_RENDERER_V6068__?.state,lightning:window.__BP_LIGHTNING_RENDERER_V6130__?.state,mapCanvases:document.querySelectorAll('#liveMap canvas').length,totalCanvases:document.querySelectorAll('canvas').length,canvasIds:[...document.querySelectorAll('canvas')].map(c=>c.id||''),layers:['bp2300-weather-fx-gpu','bp2300-fx-tornado','bp2300-fx-hurricane','bp2300-fx-flood-fill','bp2300-fx-ice-fill','bp2300-fx-burn','bp2300-fx-containment'].every(id=>!!m.getLayer(id))}});
              console.log('V2300_WX3',JSON.stringify(out));
              assert.equal(out.mapCanvases,1,'the MapLibre map must retain exactly one canvas');assert.equal(out.totalCanvases,2,'only the MapLibre canvas and transparent celestial backdrop are expected');assert.equal((out.canvasIds||[]).filter(id=>id==='bp-space-canvas-v6124').length,1,'the only auxiliary canvas must be the celestial backdrop');assert(out.layers);
              assert.equal(out.fx.sharedMapLibreWebGLContext,true);assert.equal(out.fx.secondaryCanvases,0);assert.equal(out.fx.shaderReady,true);assert.equal(out.fx.enabled,false,'legacy generic particle bundle must stay off; dedicated rain and lightning renderers are used');assert(out.rain?.worldAnchored===true&&out.rain?.overlayAttached===true&&out.rain?.renderedStreaks>0,'source-anchored rain must render');assert(out.lightning?.enabled===true&&out.lightning?.overlayConnected===true&&out.lightning?.anchors>0,'source-anchored lightning must attach');
              assert(out.fx.budgets.maxPoints<=760);assert(out.fx.qualityScale>=.28&&out.fx.qualityScale<=1);
              assert.equal(out.w.counts.alerts,3);assert.equal(out.w.counts.fires,1);assert.equal(out.w.counts.storms,1);assert.equal(out.w.counts.lightning,1);assert.equal(out.w.counts.water,1);
              const lightningPrecheck=await p.evaluate(()=>({present:!!window.__BP_LIGHTNING_RENDERER_V6130__,state:window.__BP_LIGHTNING_RENDERER_V6130__?.state||null,weatherScene:window.__bpWeatherV2300?.getScene?.()?.lightning?.length||0,alertCount:window.__bpWeatherV2300?.getScene?.()?.alerts?.length||0}));
              console.log('BRIDGEPOINT_LONG_LIGHTNING_PRECHECK',JSON.stringify(lightningPrecheck));
              assert(lightningPrecheck.present,'dedicated lightning renderer must attach beside the single MapLibre canvas');
              await p.waitForFunction(()=>{const d=window.__BP_LIGHTNING_RENDERER_V6130__?.state;return d?.enabled===true&&d?.overlayConnected===true&&d?.anchors>0&&d?.durationMs>=2400;},{timeout:10000});
              await p.waitForFunction(()=>window.__BP_LIGHTNING_RENDERER_V6130__?.state?.activeBolts>0,{timeout:13000});
              const lightningDiag=await p.evaluate(()=>window.__BP_LIGHTNING_RENDERER_V6130__?.state||null);
              assert(lightningDiag&&lightningDiag.activeBolts>0&&lightningDiag.durationMs>=2400,'cloud-to-ground lightning must appear as a long, source-anchored branching flash '+JSON.stringify(lightningDiag));
              assert.equal(errors.length,0,errors.join('\n'));
              console.log('BRIDGEPOINT_V2300_WEATHER_FX_ANDROID_PASS',JSON.stringify({rainStreaks:out.rain?.renderedStreaks,lightningBolts:out.lightning?.activeBolts,quality:out.fx.qualityScale,fps:out.fx.fps,maxPoints:out.fx.budgets.maxPoints,canvases:out.totalCanvases}));
              await p.evaluate(()=>{
                const m=window.__bpWorldV2300.map;
                m.stop?.();
                m.jumpTo({center:[-87.3425,41.538],zoom:1.25,pitch:0,bearing:0});
              });
              await new Promise(resolve=>setTimeout(resolve,700));
              await p.waitForFunction(()=>{const m=window.__bpWorldV2300?.map,visible=id=>!!m?.getLayer(id)&&(m.getLayoutProperty(id,'visibility')||'visible')!=='none';return visible('wx-alert-line')&&visible('wx-storm')&&visible('wx-obs')&&Number(window.__bpWeatherV2300?.state?.counts?.alerts||0)>0;},{timeout:10000});
              const globe=await p.evaluate(()=>{
                const m=window.__bpWorldV2300?.map,fx=window.__bpWeatherV2300?.fx?.state;
                const d=window.__BP_WEATHER_FX_DIAGNOSTIC_V6050__||{};
                return{zoom:m?.getZoom?.(),activeParticles:fx?.activeParticles,maxPoints:fx?.budgets?.maxPoints,
                  singleCanvas:document.querySelectorAll('#liveMap canvas').length===1&&document.querySelectorAll('canvas#bp-space-canvas-v6124').length===1&&document.querySelectorAll('canvas').length===2,
                  rendererErrors:d.particleErrors||0,lastParticleError:d.lastParticleError||null,
                  sourceWeatherVisible:['wx-alert-line','wx-storm','wx-obs'].every(id=>!!m?.getLayer(id)&&(m.getLayoutProperty(id,'visibility')||'visible')!=='none'),
                  capabilities:fx?.capabilities||{}};
              });
              assert(globe.zoom<3,'GLOBAL_VIEW_WEATHER_TEST_DID_NOT_REACH_GLOBE '+JSON.stringify(globe));
              assert(globe.sourceWeatherVisible,'GLOBAL_VIEW_SOURCE_WEATHER_NOT_VISIBLE '+JSON.stringify(globe));
              assert(globe.activeParticles<=globe.maxPoints,'GLOBAL_VIEW_WEATHER_BUDGET_EXCEEDED '+JSON.stringify(globe));
              assert.equal(globe.singleCanvas,true,'GLOBAL_VIEW_SECONDARY_CANVAS '+JSON.stringify(globe));
              assert.equal(globe.rendererErrors,0,'GLOBAL_VIEW_WEATHER_RENDER_ERRORS '+JSON.stringify(globe));
              console.log('BRIDGEPOINT_GLOBAL_VIEW_WEATHER_EFFECTS_PASS',JSON.stringify(globe));
            }finally{await browser.close()}
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE

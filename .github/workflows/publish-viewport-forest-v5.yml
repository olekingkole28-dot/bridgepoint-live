          }
          JS
          python3 - "$SITE" <<'PY'
          import sys,re,hashlib
          from pathlib import Path
          site=Path(sys.argv[1])
          def hashes():return {str(p.relative_to(site)):hashlib.sha256(p.read_bytes()).hexdigest() for p in site.rglob('*') if p.is_file()}
          before=hashes();allowed=set()
          for base in (site,site/'app'):
              p=base/'world-v2300-map.js';s=p.read_text()
              anchor="map.once('load',bpInstallRegionalTreeCanopy);"
              assert s.count(anchor)==1
              s=s.replace(anchor,anchor+"""
              let bpForestV5=false;const bpAttachForestV5=()=>{if(bpForestV5||map.getZoom()<5.5)return;bpForestV5=true;import('/vendor/bp-viewport-forest-v5.mjs').then(m=>m.attachViewportForest(map)).catch(()=>{bpForestV5=false})};map.on('move',bpAttachForestV5);map.on('idle',bpAttachForestV5);map.on('zoomend',bpAttachForestV5);""")
              p.write_text(s);allowed.add(str(p.relative_to(site)))
              for name in ('index.html','landing.js','app.js'):
                  p=base/name

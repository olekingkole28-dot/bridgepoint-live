# V5560 authoritative production deploy
name: Deploy Live Artifact Branch V5560

on:
  workflow_dispatch:
  push:
    branches: [live-artifact]
    paths:
      - 'world-v2300-map.js'
      - 'app.js'
      - 'parcel-boundary-viewer-v5403.js'
      - 'index.html'
      - 'app/index.html'
      - '.github/workflows/deploy-live-artifact-branch-v5560.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-artifact-direct
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-artifact
          fetch-depth: 1

      - name: Verify artifact contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '__BP_WORLD_RENDER_VERSION__=5560' world-v2300-map.js
          grep -Fq '__BP_WORLD_PERFORMANCE_V5560__' world-v2300-map.js
          grep -Fq 'single-maplibre-click' world-v2300-map.js
          grep -Fq 'MOBILE?6.45' world-v2300-map.js
          grep -Fq 'parcelLinesPersistDuringMotion:true' world-v2300-map.js
          grep -Fq '__BP_INTERACTION_CIRCUIT_BREAKER_V5560__' app.js
          grep -Fq 'const VERSION=5404' parcel-boundary-viewer-v5403.js
          grep -Fq 'minzoom:5.9' parcel-boundary-viewer-v5403.js
          ! grep -Fq "canvas.addEventListener('click'" world-v2300-map.js
          echo LIVE_ARTIFACT_BRANCH_V5560_OK

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-live-artifact-branch-v5560
          path: .

      - name: Deploy exact live-artifact branch
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: bridgepoint-live-artifact-branch-v5560

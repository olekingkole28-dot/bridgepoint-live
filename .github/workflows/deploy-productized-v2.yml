name: Deploy Productized BridgePoint V2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-productized-v2.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      EXPECTED_SOURCE: 57d43371b41fc34124c56f14a8065cbc0c44676a
      EXPECTED_ARCHIVE_SHA: bca6dfd99232b2f773afab05c9fa840da3cab2a5a7260632bca7f245ac7151e2
      EXPECTED_ARCHIVE_BYTES: '1258158'
      EXPECTED_FONT_SHA: cd21fa0f1e2df7f592d7613a9bf6a273c1022c19e0d4393d3f34f5b481a3ff8b
      EXPECTED_SPACE_SHA: acad6de1fc93436f5c0f1f4137751ef04f1aea3063e7036535970ffcfbd79f72
      RELEASE_URL: https://xdfsjztwgsbmabshzsjw.supabase.co/storage/v1/object/public/bridgepoint-release-handoff/clean-v2-57d43371b41fc34124c56f14a8065cbc0c44676a.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify exact full-screen release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bp-productized /tmp/bp-productized.tar.gz
          mkdir -p /tmp/bp-productized
          curl -fsSL --retry 6 --retry-delay 2 -H 'Cache-Control: no-cache' "$RELEASE_URL" -o /tmp/bp-productized.tar.gz
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,tarfile
          archive=Path('/tmp/bp-productized.tar.gz').read_bytes()
          if len(archive)!=int(os.environ['EXPECTED_ARCHIVE_BYTES']): raise SystemExit('Archive byte mismatch')
          if hashlib.sha256(archive).hexdigest()!=os.environ['EXPECTED_ARCHIVE_SHA']: raise SystemExit('Archive SHA mismatch')
          target=Path('/tmp/bp-productized')
          with tarfile.open('/tmp/bp-productized.tar.gz','r:gz') as tf:
              base=target.resolve()
              for m in tf.getmembers():
                  if not str((target/m.name).resolve()).startswith(str(base)): raise SystemExit('Unsafe archive member')
              tf.extractall(target)
          release=json.loads((target/'bridgepoint-v2-release.json').read_text())
          promo=json.loads((target/'public-promotion-v682.json').read_text())
          if release.get('version')!=os.environ['EXPECTED_SOURCE']: raise SystemExit('Source mismatch')
          for flag in ['restored_product_surfaces','progressive_national_map','visual_polish_v2','property_dossier_v2','property_visuals_v2','operations_product_ui_v2','fullscreen_property_dossier_v2']:
              if release.get(flag) is not True: raise SystemExit(f'{flag} missing')
          if promo.get('compiled_source_sha')!=os.environ['EXPECTED_SOURCE']: raise SystemExit('Promotion source mismatch')
          if hashlib.sha256((target/'main.dart.js').read_bytes()).hexdigest()!=promo.get('main_js_sha256'): raise SystemExit('JS digest mismatch')
          if hashlib.sha256((target/'assets/fonts/MaterialIcons-Regular.otf').read_bytes()).hexdigest()!=os.environ['EXPECTED_FONT_SHA']: raise SystemExit('Icon font mismatch')
          spaces=list((target/'assets').rglob('SpaceGrotesk.ttf'))
          if len(spaces)!=1 or hashlib.sha256(spaces[0].read_bytes()).hexdigest()!=os.environ['EXPECTED_SPACE_SHA']: raise SystemExit('Space Grotesk mismatch')
          if 'BridgePointGrotesk' not in (target/'assets/FontManifest.json').read_text(): raise SystemExit('Font manifest mismatch')
          PY
      - name: Assemble durable public site
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site && mkdir site
          git archive --format=tar origin/live-artifact | tar -xf - -C site
          cp -a /tmp/bp-productized/. site/app/
          touch site/.nojekyll site/app/.nojekyll
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          source=os.environ['EXPECTED_SOURCE']
          release=json.loads(Path('site/app/bridgepoint-v2-release.json').read_text())
          promo=json.loads(Path('site/app/public-promotion-v682.json').read_text())
          if release.get('version')!=source or promo.get('compiled_source_sha')!=source: raise SystemExit('Site source mismatch')
          if release.get('fullscreen_property_dossier_v2') is not True: raise SystemExit('Full-screen dossier marker missing')
          if hashlib.sha256(Path('site/app/main.dart.js').read_bytes()).hexdigest()!=promo.get('main_js_sha256'): raise SystemExit('Site JS digest mismatch')
          if not Path('site/app/canvaskit/canvaskit.wasm').is_file(): raise SystemExit('CanvasKit missing')
          Path('site/app/productized-ui-release.json').write_text(json.dumps({'source_sha':source,'property_dossier_v2':True,'property_visuals_v2':True,'operations_product_ui_v2':True,'fullscreen_property_dossier_v2':True},separators=(',',':')))
          PY
      - name: Persist durable live-artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/final-live && mkdir /tmp/final-live
          cp -a site/. /tmp/final-live/
          cd /tmp/final-live
          git init -q
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m "Publish full-screen productized BridgePoint V2 ${EXPECTED_SOURCE}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy full-screen productized V2
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live full-screen productized app
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://bridgepointintelligence.online'
          for attempt in $(seq 1 24); do
            marker="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/bridgepoint-v2-release.json?verify=${EXPECTED_SOURCE}" 2>/dev/null || true)"
            productized="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/productized-ui-release.json?verify=${EXPECTED_SOURCE}" 2>/dev/null || true)"
            if printf '%s' "$marker" | grep -q "$EXPECTED_SOURCE" && printf '%s' "$marker" | grep -q 'fullscreen_property_dossier_v2' && printf '%s' "$productized" | grep -q 'fullscreen_property_dossier_v2'; then
              echo "Full-screen productized BridgePoint V2 verified live."
              exit 0
            fi
            sleep 10
          done
          exit 1

name: BridgePoint FINAL rendered demo v5 2026-09-16

on:
  push:
    branches:
      - bridgepoint-demo-final-v5-20260916
    paths:
      - '.github/workflows/bridgepoint-demo-final-v5-20260916.yml'
      - '.github/scripts/capture_bridgepoint_demo_final_v5_20260916.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Record fixed production demo
        run: xvfb-run -a node .github/scripts/capture_bridgepoint_demo_final_v5_20260916.js
        env:
          CI: 'true'
      - name: Preserve raw
        run: |
          RAW="$(cat demo-final-v5/video-path.txt)"
          test -f "$RAW"
          cp "$RAW" demo-final-v5/BridgePoint_Final_v5_RAW.webm
      - name: Encode master
        run: |
          ffmpeg -y -i demo-final-v5/BridgePoint_Final_v5_RAW.webm             -c:v libx264 -preset ultrafast -crf 19 -pix_fmt yuv420p -movflags +faststart -an             demo-final-v5/BridgePoint_Intelligence_FINAL_FIXED_Master.mp4
      - name: Encode vertical
        run: |
          ffmpeg -y -i demo-final-v5/BridgePoint_Intelligence_FINAL_FIXED_Master.mp4             -filter_complex "color=c=0x050b14:s=1080x1920:r=30[bg];[0:v]scale=1080:-2[fg];[bg][fg]overlay=(W-w)/2:(H-h)/2:shortest=1"             -c:v libx264 -preset ultrafast -crf 20 -pix_fmt yuv420p -movflags +faststart -an             demo-final-v5/BridgePoint_Intelligence_FINAL_FIXED_Vertical.mp4
      - name: Upload finished videos
        uses: actions/upload-artifact@v4
        with:
          name: bridgepoint-final-fixed-v5-20260916
          path: |
            demo-final-v5/BridgePoint_Intelligence_FINAL_FIXED_Master.mp4
            demo-final-v5/BridgePoint_Intelligence_FINAL_FIXED_Vertical.mp4
            demo-final-v5/BridgePoint_Final_v5_RAW.webm
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

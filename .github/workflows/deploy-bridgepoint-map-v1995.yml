name: Deploy BridgePoint Immersive Map V1995

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-bridgepoint-map-v1995.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages-v1995
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build local immersive map runtime
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main live-artifact
          git checkout -B live-artifact origin/live-artifact
          test -f app/index.html
          test -f app/universe-v1994.js
          mkdir -p app/vendor
          rm -rf /tmp/bp-maplibre
          mkdir -p /tmp/bp-maplibre
          cd /tmp/bp-maplibre
          npm init -y >/dev/null 2>&1
          npm install maplibre-gl@5.6.2 --no-audit --no-fund >/dev/null 2>&1
          cd "$GITHUB_WORKSPACE"
          cp /tmp/bp-maplibre/node_modules/maplibre-gl/dist/maplibre-gl.js app/vendor/maplibre-gl-v1995.js
          cp /tmp/bp-maplibre/node_modules/maplibre-gl/dist/maplibre-gl.css app/vendor/maplibre-gl-v1995.css
          git show origin/main:release-v1995/map-v1995.js > app/map-v1995.js
          git show origin/main:release-v1995/map-v1995.css > app/map-v1995.css

          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/index.html')
          s=p.read_text()
          for tag in [
            '<link rel="stylesheet" href="./vendor/maplibre-gl-v1995.css?v=1995">',
            '<link rel="stylesheet" href="./map-v1995.css?v=1995">',
            '<script src="./vendor/maplibre-gl-v1995.js?v=1995"></script>',
            '<script src="./map-v1995.js?v=1995"></script>'
          ]:
            s=s.replace(tag+'\n','').replace(tag,'')
          s=s.replace('<link rel="stylesheet" href="./universe-v1994.css?v=1994">','<link rel="stylesheet" href="./vendor/maplibre-gl-v1995.css?v=1995">\n<link rel="stylesheet" href="./universe-v1994.css?v=1994">\n<link rel="stylesheet" href="./map-v1995.css?v=1995">')
          s=s.replace('<script src="./universe-v1994.js?v=1994"></script>','<script src="./vendor/maplibre-gl-v1995.js?v=1995"></script>\n<script src="./universe-v1994.js?v=1994"></script>\n<script src="./map-v1995.js?v=1995"></script>')
          p.write_text(s)

          p=Path('app/universe-v1994.js')
          s=p.read_text()
          s=s.replace("if(surface==='map')ensureMainMap();","if(surface==='map')window.dispatchEvent(new CustomEvent('bp:map-open'));")
          s=s.replace("setTimeout(()=>ensureMainMap(),900);","setTimeout(()=>window.dispatchEvent(new CustomEvent('bp:map-ready-request')),900);")
          p.write_text(s)
          PY

          node --check app/universe-v1994.js
          node --check app/map-v1995.js
          grep -Fq 'bridgepoint_3d_world_viewport_v1899' app/map-v1995.js
          grep -Fq 'bridgepoint_live_map_parcels_v1993' app/map-v1995.js
          grep -Fq 'bridgepoint_live_3d_hazard_scene_v1973' app/map-v1995.js
          grep -Fq 'Measure distance' app/map-v1995.js
          grep -Fq 'maplibre-gl-v1995.js?v=1995' app/index.html
          grep -Fq 'map-v1995.js?v=1995' app/index.html
          grep -Fq "bp:map-open" app/universe-v1994.js
          test -s app/vendor/maplibre-gl-v1995.js
          test -s app/vendor/maplibre-gl-v1995.css

          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/index.html app/universe-v1994.js app/map-v1995.js app/map-v1995.css app/vendor/maplibre-gl-v1995.js app/vendor/maplibre-gl-v1995.css
          if ! git diff --cached --quiet; then
            git commit -m 'Release locally bundled immersive 3D property map v1995'
            git push origin HEAD:live-artifact
          fi
          rm -rf site && mkdir site
          git archive --format=tar HEAD | tar -xf - -C site
          touch site/.nojekyll site/app/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-map-v1995
          path: site
      - name: Deploy map V1995
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-map-v1995

      - name: Verify live V1995 map assets
        shell: bash
        run: |
          set -euo pipefail
          origin='https://bridgepointintelligence.online'
          ok=0
          for attempt in $(seq 1 36); do
            salt="${GITHUB_SHA}-${attempt}-$(date +%s)"
            app="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${origin}/app/?surface=map&bpv=1995&verify=${salt}" 2>/dev/null || true)"
            map="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${origin}/app/map-v1995.js?verify=${salt}" 2>/dev/null || true)"
            lib="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${origin}/app/vendor/maplibre-gl-v1995.js?verify=${salt}" 2>/dev/null || true)"
            if printf '%s' "$app" | grep -Fq 'map-v1995.js?v=1995' && printf '%s' "$app" | grep -Fq 'maplibre-gl-v1995.js?v=1995' && printf '%s' "$map" | grep -Fq 'bridgepoint_3d_world_viewport_v1899' && printf '%s' "$map" | grep -Fq 'Measure distance' && printf '%s' "$lib" | grep -Fq 'maplibregl'; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1

      - name: Verify phone map canvas and measurement controls
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24 --no-audit --no-fund >/dev/null 2>&1
          CHROME_PATH="$CHROME" node <<'NODE'
          const puppeteer=require('puppeteer-core'),assert=require('assert');
          const origin='https://bridgepointintelligence.online';
          (async()=>{const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox','--disable-dev-shm-usage','--use-gl=swiftshader']});try{
            const p=await browser.newPage();
            await p.setViewport({width:390,height:844,deviceScaleFactor:2,isMobile:true,hasTouch:true});
            await p.setRequestInterception(true);
            p.on('request',req=>{const u=req.url();
              if(/cdn\.jsdelivr\.net|unpkg\.com/.test(u))return req.abort();
              if(u.includes('supabase.co/auth/v1/user'))return req.respond({status:200,contentType:'application/json',body:JSON.stringify({id:'00000000-0000-4000-8000-000000000001',email:'map-test@bridgepoint.local'})});
              if(u.includes('supabase.co/rest/v1/rpc/')){const name=u.split('/rpc/')[1].split('?')[0];let body={complete:true};
                if(name==='bridgepoint_legal_state_v82')body={complete:true,required_acceptance_missing:false,missing_count:0,documents:[]};
                if(name==='bridgepoint_trial_access_v1055')body={complete:true,owner_override:true,subscriptions:[]};
                if(name==='bridgepoint_public_system_pulse_v1992')body={total_parcels:158000000,total_addresses:170000000,active_opportunities:12000,signals:50000,detected_patterns:10000,scored_properties:100000,registered_sources:5000,states_present:51};
                if(name==='bridgepoint_flutter_intelligence_map_national_v1037')body={complete:true,opportunities:[{property_id:'00000000-0000-4000-8000-000000000099',full_address:'1 Test Ave',latitude:39.2,longitude:-96.5,score:91}],signals:[]};
                if(name==='bridgepoint_live_3d_hazard_scene_v1973')body={complete:true,events:[]};
                if(name==='bridgepoint_flutter_property_map_viewport_v1035')body=[];
                if(name==='bridgepoint_live_map_parcels_v1993')body={complete:true,polygon_count:1,geojson:{type:'FeatureCollection',features:[{type:'Feature',geometry:{type:'Polygon',coordinates:[[[-96.51,39.19],[-96.49,39.19],[-96.49,39.21],[-96.51,39.21],[-96.51,39.19]]]},properties:{parcel_number:'TEST-1'}}]}};
                if(name==='bridgepoint_3d_world_viewport_v1899')body={complete:true,returned:1,buildings:[{building_id:'1',geometry:{type:'Polygon',coordinates:[[[-96.502,39.198],[-96.498,39.198],[-96.498,39.202],[-96.502,39.202],[-96.502,39.198]]]},render_height_m:12,height_m:12,truth_label:'Source-backed footprint and height.'}]};
                return req.respond({status:200,contentType:'application/json',body:JSON.stringify(body)});}
              req.continue();});
            await p.goto(origin+'/?seed='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
            await p.evaluate(()=>localStorage.setItem('sb-xdfsjztwgsbmabshzsjw-auth-token',JSON.stringify({access_token:'fake-map-v1995-access-token',refresh_token:'fake-map-v1995-refresh-token',expires_at:Math.floor(Date.now()/1000)+3600,user:{id:'00000000-0000-4000-8000-000000000001',email:'map-test@bridgepoint.local'}})));
            await p.goto(origin+'/app/?surface=map&bpv=1995&mock='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
            await p.waitForFunction(()=>document.querySelector('#app')?.hidden===false,{timeout:7000});
            await p.waitForSelector('#bpMeasureTools',{timeout:9000});
            await p.waitForFunction(()=>document.querySelector('#liveMap canvas')&&document.querySelector('#liveMap canvas').width>100,{timeout:12000});
            const state=await p.evaluate(()=>({canvas:!!document.querySelector('#liveMap canvas'),measure:!!document.querySelector('[data-bpmeasure="distance"]'),area:!!document.querySelector('[data-bpmeasure="area"]'),status:document.querySelector('#mapStatus')?.textContent||'',local:!!window.maplibregl}));
            assert(state.canvas&&state.measure&&state.area&&state.local,'map canvas/tooling missing');
            await p.click('[data-bpmeasure="distance"]');
            assert(await p.$eval('[data-bpmeasure="distance"]',x=>x.classList.contains('active')),'measure mode did not activate');
            console.log('V1995_PHONE_MAP_CANVAS_PASS',state.status);
          }finally{await browser.close()}})().catch(e=>{console.error(e);process.exit(1)});
          NODE

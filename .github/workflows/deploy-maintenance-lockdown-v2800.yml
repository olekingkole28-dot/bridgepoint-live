name: BridgePoint Public Lockdown V2800

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-maintenance-lockdown-v2800.yml'
      - 'app/intelligence-launch/**'
      - 'app/horizon/**'
      - 'app/horizon-world/**'
      - 'app/horizon-playable/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build public surface
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site/app/intelligence-launch site/app/horizon site/app/horizon-world site/app/horizon-playable
          cp -a app/intelligence-launch/. site/app/intelligence-launch/
          cp -a app/horizon/. site/app/horizon/
          cp -a app/horizon-world/. site/app/horizon-world/
          cp -a app/horizon-playable/. site/app/horizon-playable/
          cat > site/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><meta http-equiv="refresh" content="0; url=/app/intelligence-launch/"><title>BridgePoint Intelligence</title><script>location.replace('/app/intelligence-launch/'+location.search+location.hash)</script></head><body><a href="/app/intelligence-launch/">BridgePoint Intelligence</a></body></html>
          HTML
          cp site/index.html site/404.html
          cat > site/robots.txt <<'TXT'
          User-agent: *
          Disallow: /
          Allow: /app/intelligence-launch/
          Allow: /app/horizon/
          TXT
          touch site/.nojekyll
          test -s site/app/intelligence-launch/index.html
          test -s site/app/horizon/index.html
          test -s site/app/horizon/preview.html
          test -s site/app/horizon-playable/horizon-world.js
          test -s site/app/horizon-playable/horizon-world.css
          grep -Fq 'BridgePoint Horizon - Founding Season' site/app/horizon/index.html
          grep -Fq 'FOUNDING SEASON' site/app/horizon/index.html
          grep -Fq '/app/horizon/preview.html?preview=city' site/app/horizon/index.html
          grep -Fq 'DENSE CITY' site/app/horizon/preview.html
          grep -Fq 'MOUNTAIN TOWN' site/app/horizon/preview.html
          grep -Fq 'WATERFRONT SUBURB' site/app/horizon/preview.html
          grep -Fq 'CC0 SURVIVORS / INFECTED / VEHICLES / PROPS' site/app/horizon/preview.html
          grep -Fq '../horizon-playable/horizon-world.js?v=4205' site/app/horizon/preview.html
          grep -Fq 'bridgepoint-horizon-stream-v3020' site/app/horizon-playable/horizon-world.js
          grep -Fq 'Characters_Matt.gltf' site/app/horizon-playable/horizon-world.js
          grep -Fq 'Characters_Lis.gltf' site/app/horizon-playable/horizon-world.js
          grep -Fq 'Characters_Sam.gltf' site/app/horizon-playable/horizon-world.js
          grep -Fq 'Characters_Shaun.gltf' site/app/horizon-playable/horizon-world.js
          grep -Fq 'loadAsset(PLAYER_ASSET)' site/app/horizon-playable/horizon-world.js
          grep -Fq 'normalizeMovementInput' site/app/horizon-playable/horizon-world.js
          grep -Fq 'playerVelocity.x=desiredX' site/app/horizon-playable/horizon-world.js
          grep -Fq 'playerRoot.rotation.z=targetRot' site/app/horizon-playable/horizon-world.js
          grep -Fq 'FOUNDING MEMBER ACCESS' site/app/intelligence-launch/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy public surface
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live custom domain
        shell: bash
        run: |
          set -euo pipefail
          origin='https://bridgepointintelligence.online'
          ok=0
          for attempt in $(seq 1 30); do
            salt="${GITHUB_SHA}-${attempt}-$(date +%s)"
            code="$(curl -sSL --max-time 20 -o /tmp/horizon.html -w '%{http_code}' -H 'Cache-Control: no-cache, no-store' "${origin}/app/horizon/?v=${salt}" || true)"
            preview_code="$(curl -sSL --max-time 20 -o /tmp/horizon-preview.html -w '%{http_code}' -H 'Cache-Control: no-cache, no-store' "${origin}/app/horizon/preview.html?preview=city&cell=national&state=NY&lat=40.7580&lon=-73.9855&span_km=1.45&character=matt&build=4205&v=${salt}" || true)"
            js_code="$(curl -sSL --max-time 20 -o /tmp/horizon-world.js -w '%{http_code}' -H 'Cache-Control: no-cache, no-store' "${origin}/app/horizon-playable/horizon-world.js?v=${salt}" || true)"
            if [ "$code" = "200" ] && [ "$preview_code" = "200" ] && [ "$js_code" = "200" ] \
              && grep -Fq 'BridgePoint Horizon - Founding Season' /tmp/horizon.html \
              && grep -Fq 'FOUNDING SEASON' /tmp/horizon.html \
              && grep -Fq '/app/horizon/preview.html?preview=city' /tmp/horizon.html \
              && grep -Fq 'DENSE CITY' /tmp/horizon-preview.html \
              && grep -Fq 'MOUNTAIN TOWN' /tmp/horizon-preview.html \
              && grep -Fq 'WATERFRONT SUBURB' /tmp/horizon-preview.html \
              && grep -Fq 'CC0 SURVIVORS / INFECTED / VEHICLES / PROPS' /tmp/horizon-preview.html \
              && grep -Fq 'Characters_Matt.gltf' /tmp/horizon-world.js \
              && grep -Fq 'Characters_Lis.gltf' /tmp/horizon-world.js \
              && grep -Fq 'Characters_Sam.gltf' /tmp/horizon-world.js \
              && grep -Fq 'loadAsset(PLAYER_ASSET)' /tmp/horizon-world.js \
              && grep -Fq 'normalizeMovementInput' /tmp/horizon-world.js \
              && grep -Fq 'playerVelocity.x=desiredX' /tmp/horizon-world.js \
              && grep -Fq 'playerRoot.rotation.z=targetRot' /tmp/horizon-world.js; then
              ok=1
              break
            fi
            sleep 5
          done
          test "$ok" = "1"

# Horizon controls release 4205

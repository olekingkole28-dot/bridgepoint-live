name: Test NOAA Radar V942
on:
  push:
    branches: [main]
    paths: ['.github/workflows/test-noaa-radar-v942.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe NOAA WMS capabilities and image requests
        shell: bash
        run: |
          set -euo pipefail
          HOST='https://mapservices.weather.noaa.gov/eventdriven/services/radar/radar_base_reflectivity_time/ImageServer/WMSServer'
          REST='https://mapservices.weather.noaa.gov/eventdriven/rest/services/radar/radar_base_reflectivity_time/ImageServer/query?where=1%3D1&outFields=idp_validtime&returnGeometry=false&orderByFields=idp_validtime%20DESC&resultRecordCount=1&f=json'
          curl -fsSL --retry 3 "$HOST?request=GetCapabilities&service=WMS" -o /tmp/cap.xml
          echo "capabilities type=$(file -b /tmp/cap.xml) bytes=$(stat -c '%s' /tmp/cap.xml)"
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('/tmp/cap.xml').getroot()
          names=[]
          crs=set()
          for e in root.iter():
              tag=e.tag.split('}')[-1]
              if tag=='Name' and e.text and e.text.strip(): names.append(e.text.strip())
              if tag in ('CRS','SRS') and e.text: crs.add(e.text.strip())
          print('LAYER_NAMES', names[:30])
          print('CRS_SAMPLE', sorted(crs)[:30])
          open('/tmp/layers.txt','w').write('\n'.join(dict.fromkeys(names)))
          PY
          curl -fsSL --retry 3 "$REST" -o /tmp/frame.json
          EPOCH="$(python - <<'PY'
          import json
          d=json.load(open('/tmp/frame.json'))
          print(int(d['features'][0]['attributes']['idp_validtime']))
          PY
          )"
          ISO="$(python - "$EPOCH" <<'PY'
          import sys,datetime
          ms=int(sys.argv[1])
          print(datetime.datetime.fromtimestamp(ms/1000,datetime.timezone.utc).isoformat().replace('+00:00','Z'))
          PY
          )"
          echo "frame_epoch=$EPOCH frame_iso=$ISO"
          i=0
          while IFS= read -r layer; do
            [ -n "$layer" ] || continue
            i=$((i+1)); [ "$i" -le 8 ] || break
            for mode in latest iso epoch; do
              out="/tmp/${i}-${mode}"
              args=(--get --data-urlencode SERVICE=WMS --data-urlencode VERSION=1.3.0 --data-urlencode REQUEST=GetMap --data-urlencode "LAYERS=$layer" --data-urlencode STYLES= --data-urlencode CRS=EPSG:3857 --data-urlencode BBOX=-13884991,2875744,-7455066,6338219 --data-urlencode WIDTH=800 --data-urlencode HEIGHT=500 --data-urlencode FORMAT=image/png --data-urlencode TRANSPARENT=true)
              if [ "$mode" = iso ]; then args+=(--data-urlencode "TIME=$ISO"); fi
              if [ "$mode" = epoch ]; then args+=(--data-urlencode "TIME=$EPOCH"); fi
              curl -fsSL --retry 2 "${args[@]}" "$HOST" -o "$out"
              echo "layer=$layer mode=$mode bytes=$(stat -c '%s' "$out") type=$(file -b "$out")"
              if file -b "$out" | grep -qi 'PNG image'; then
                echo "VALID_PNG layer=$layer mode=$mode sha=$(sha256sum "$out" | cut -d' ' -f1)"
              else
                tr '\n' ' ' < "$out" | head -c 500; echo
              fi
            done
          done < /tmp/layers.txt

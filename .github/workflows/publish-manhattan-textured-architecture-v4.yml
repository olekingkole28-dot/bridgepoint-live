           const u={bpCitySun:{value:new T.Vector3(.5,.7,.5).normalize()},bpCityView:{value:new T.Vector3(.3,.2,1).normalize()},bpCityDetail:{value:0},bpCityDay:{value:1}};
           let meshes=0,textureCount=0,glass=null;gltf.scene.traverse(o=>{if(!o.isMesh)return;if(!o.geometry.getAttribute('uv')||!o.material.map)throw Error('missing real texture');const m=o.material;if(m.map.image.width>=512)textureCount++;o.material=fn(T,m,u);if(m.name.includes('glass')&&!glass)glass=o.material;meshes++});
           const renderer=new T.WebGLRenderer({preserveDrawingBuffer:true});renderer.setSize(768,768);document.body.append(renderer.domElement);renderer.debug.checkShaderErrors=true;const errors=[];renderer.debug.onShaderError=(gl,p,v,f)=>errors.push(gl.getProgramInfoLog(p),gl.getShaderInfoLog(v),gl.getShaderInfoLog(f));

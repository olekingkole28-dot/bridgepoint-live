name: Deploy BridgePoint Live

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download audited BridgePoint v312 production build
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprsoutheastus3.oaiusercontent.com/files/00000000-ef78-820c-9e1e-02506c7dd594/raw?se=2026-08-18T01%3A21%3A37Z&sp=r&sv=2026-02-06&sr=b&scid=76750656-87a9-5636-85e9-2e61029e52d0&skoid=e9d2f8b1-028a-4cff-8eb1-d0e66fbefcca&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-17T21%3A40%3A49Z&ske=2026-08-18T21%3A40%3A49Z&sks=b&skv=2026-02-06&sig=ZC/joxawCwwlPmXTnKoHwjIiAxGKJmOM1er8FOR6GSw%3D' -o /tmp/bridgepoint-v312.zip
          echo 'dab96d241ef88fbd2b52b5ef56611ce0028aaba7fc18a863996367e1757e1d79  /tmp/bridgepoint-v312.zip' | sha256sum -c -
          rm -rf site
          mkdir -p site
          unzip -q /tmp/bridgepoint-v312.zip -d site
          touch site/.nojekyll
          sed -i 's#<base href="/">#<base href="./">#' site/index.html

          test -s site/index.html
          test -s site/main.dart.js
          test -s site/bridgepoint-release.json
          grep -q '8dd7efd71ae085cb54d7d99d042846bbef65623c' site/bridgepoint-release.json
          grep -q 'https://bridgepointintelligence.online/' site/bridgepoint-release.json

          # App-install onboarding must be present before public deployment.
          grep -q 'bridgepoint-v310-install-onboarding' site/index.html
          grep -q 'Put BridgePoint on your home screen' site/index.html
          grep -q 'beforeinstallprompt' site/index.html
          grep -q 'Add to Home Screen' site/index.html

          # Latest live map/customer contracts compiled into this audited artifact.
          grep -q 'DENSITY HEAT' site/main.dart.js
          grep -q 'BridgePoint Community Chat' site/main.dart.js
          grep -q 'NOAA LIVE RAIN RADAR' site/main.dart.js
          grep -q 'Meet the Owner' site/main.dart.js
          grep -q 'Customer preview' site/main.dart.js

          if grep -q 'BridgePoint V81 uses negative scoring' site/main.dart.js; then
            echo 'Legacy technical customer wording unexpectedly remains.' >&2
            exit 1
          fi
          echo 'BridgePoint v312 audited production artifact ready for deployment.'

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish BridgePoint
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record verified live deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          release=json.loads(Path('site/bridgepoint-release.json').read_text(encoding='utf-8'))
          receipt={
            'status':'PUBLISHED',
            'release_sha':release['version'],
            'built_at':release.get('built_at'),
            'deployed_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'public_origin':release.get('public_origin'),
            'pages_url':os.environ.get('PAGE_URL'),
            'artifact_sha256':'dab96d241ef88fbd2b52b5ef56611ce0028aaba7fc18a863996367e1757e1d79',
            'release_label':'BridgePoint v312 cinematic + v310 install onboarding + v306 density heat'
          }
          Path('live-release-status.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(receipt,indent=2))
          PY
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add live-release-status.json
          git commit -m 'Record BridgePoint v312 live deployment [skip ci]'
          git push origin HEAD:main

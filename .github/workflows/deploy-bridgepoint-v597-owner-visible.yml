name: Deploy BridgePoint V598 — Local-First Control

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-bridgepoint-v597-owner-visible.yml
      - experience/owner-ai-control-v598.html
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble local-first V598
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site && mkdir site
          git archive --format=tar origin/live-artifact | tar -xf - -C site
          test -s site/app/index.html
          test -s site/owner/index.html
          test -s site/owner/completion/index.html
          test -s site/owner/local-ai/index.html
          test -s experience/owner-ai-control-v598.html
          cp experience/owner-ai-control-v598.html site/owner/ai/control/index.html
          python - <<'PY'
          from pathlib import Path
          app=Path('site/app/index.html'); s=app.read_text(encoding='utf-8')
          if 'bp-owner-visible-v597' in s:
              s=s.replace('bp-owner-visible-v597','bp-owner-visible-v598').replace('bpv597','bpv598').replace('LIVE V597','LIVE V598').replace('v=597','v=598')
          elif 'bp-owner-visible-v598' not in s:
              raise SystemExit('V597 owner launcher missing from durable app; refusing blind patch')
          app.write_text(s,encoding='utf-8')
          owner=Path('site/owner/index.html'); s=owner.read_text(encoding='utf-8')
          s=s.replace('bp-owner-release-badge-v597','bp-owner-release-badge-v598').replace('LIVE OWNER RELEASE V597','LIVE OWNER RELEASE V598')
          s=s.replace('One screen for GPT-5.6 provider health, reviewer status, worker fleet, waiting tasks and recent reasoning calls.','Local-first runtime, PC reasoning node, worker fleet, ledger, national depth and overnight automation truth.')
          owner.write_text(s,encoding='utf-8')
          Path('site/owner/ai/v598-release.json').write_text('{"version":598,"release":"Local-First Owner AI Control + Visible App Launcher","owner_launcher_in_app":true,"master_completion":"/owner/completion/","local_ai":"/owner/local-ai/","control_center":"/owner/ai/control/","provider_mode":"LOCAL_FIRST","hosted_reasoning_default":false,"customer_ai_system_changing":false}\n',encoding='utf-8')
          PY
          grep -q 'bp-owner-visible-v598' site/app/index.html
          grep -q 'LIVE OWNER RELEASE V598' site/owner/index.html
          grep -q 'bridgepoint_owner_ai_control_local_v598' site/owner/ai/control/index.html
          grep -q 'LOCAL_FIRST' site/owner/ai/control/index.html
          grep -q 'Master Completion' site/owner/completion/index.html
          grep -q 'BridgePoint Local AI Setup' site/owner/local-ai/index.html
          if grep -R -E -i 'SUPABASE_SERVICE_ROLE_KEY|sb_secret_|OPENAI_API_KEY|ANTHROPIC_API_KEY|sk-proj-|sk-ant-|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' site/app/index.html site/owner; then exit 1; fi
          touch site/.nojekyll site/app/.nojekyll
      - name: Persist durable V598
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/final-live && mkdir /tmp/final-live
          cp -a site/. /tmp/final-live/
          cd /tmp/final-live
          git init
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m 'BridgePoint V598 local-first owner control'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish V598
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live V598
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 8 --retry-delay 3 'https://bridgepointintelligence.online/app/?v=598' -o /tmp/app.html
          curl -fsSL --retry 8 --retry-delay 3 'https://bridgepointintelligence.online/owner/?v=598' -o /tmp/owner.html
          curl -fsSL --retry 8 --retry-delay 3 'https://bridgepointintelligence.online/owner/ai/control/?v=598' -o /tmp/control.html
          curl -fsSL --retry 8 --retry-delay 3 'https://bridgepointintelligence.online/owner/completion/?v=598' -o /tmp/completion.html
          grep -q 'bp-owner-visible-v598' /tmp/app.html
          grep -q 'LIVE OWNER RELEASE V598' /tmp/owner.html
          grep -q 'LOCAL_FIRST' /tmp/control.html
          grep -q 'Master Completion' /tmp/completion.html

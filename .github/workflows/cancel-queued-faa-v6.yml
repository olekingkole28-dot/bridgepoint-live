name: Cancel Superseded Shipwreck Asset Job Blocking Cloud Aircraft Restore
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cancel-queued-faa-v6.yml']
permissions:
  actions: write
  contents: read
jobs:
  cancel-unintended-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel only stale shipwreck asset build accidentally triggered by aircraft visual file updates
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Cancelling only unrelated shipwreck build 44849616527"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/44849616527/cancel" ||
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/44849616527" --jq '{status,conclusion}'

name: Publish BridgePoint adaptive and shoreline recovery V2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-render-recovery-water-v2.yml']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact successful Manhattan V4 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/45581928302 --jq '.conclusion')" = success
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/baseline"
            mkdir -p "$RUNNER_TEMP/baseline"
            if timeout 180s gh run download 45581928302 --repo "$GITHUB_REPOSITORY" --name bridgepoint-v5000-1 --dir "$RUNNER_TEMP/baseline" && test -s "$RUNNER_TEMP/baseline/artifact.tar"; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Apply scoped recovery and verify source
        run: |
          set -euo pipefail
          export SITE="$RUNNER_TEMP/horizon-site"
          mkdir -p "$SITE"
          tar -xf "$RUNNER_TEMP/baseline/artifact.tar" -C "$SITE"
          for p in index.html app/index.html bridgepoint-auto-reality-v1.js world-v2300-water.js; do
            curl --retry 3 --retry-all-errors --max-time 40 -fsSL -H 'Cache-Control: no-cache' "https://bridgepointintelligence.online/$p?baseline=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/current"
            cmp "$SITE/$p" "$RUNNER_TEMP/current"
          done
          python3 - <<'PY'
          import os, re, hashlib, shutil
          from pathlib import Path
          site=Path(os.environ['SITE'])
          quality='bridgepoint-device-quality-v1.js'
          water='world-v2300-water.js'
          world='world-v2300-map.js'
          allowed={quality,water,'app/'+water,'index.html','app/index.html','landing.js','app.js'}
          def snapshot():
              return {p.relative_to(site).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in site.rglob('*') if p.is_file() and p.relative_to(site).as_posix() not in allowed}
          before=snapshot()
          def one(s,a,b):
              assert s.count(a)==1,('ANCHOR',a[:100],s.count(a))
              return s.replace(a,b,1)
          def cap(s,name,field):
              s,n=re.subn(r'(\bconst\s+'+name+r'\s*=\s*)([^;]+);',lambda m:m[1]+'Math.min(('+m[2]+'),window.__BP_DEVICE_QUALITY_V1__?.waterBudget?.'+field+'??Infinity);',s,count=1)
              assert n==1,('BUDGET',name)
              return s
          changes={}
          for rel in (water,'app/'+water):
              s=(site/rel).read_text()
              s=one(s,'    frameDelay() {','    frameDelay() {\n      const q=window.__BP_DEVICE_QUALITY_V1__?.waterBudget;\n      if(q && window.__BP_DEVICE_QUALITY_V1__.profile.level<=4)return Math.max(q.minFrameDelay,map.isMoving?.()?180:120);')
              for name,field in [('maxCells','gridCells'),('marineBudget','marineVertices'),('inlandBudget','inlandVertices'),('maxSegs','flowSegments')]:
                  s=cap(s,name,field)
              s=one(s,'performance.now()-tick<5','performance.now()-tick<(window.__BP_DEVICE_QUALITY_V1__?.waterBudget?.sliceMs??4)')
              # Prefer native tile polygon outlines over generalized atlas at close zoom.
              s,n=re.subn(r'const useCoastalMesh=regionalCoast\|\|fallbackCoast[^;]*;', 'const useCoastalMesh=z<12&&(regionalCoast||fallbackCoast||!!(coastalMesh&&!worldView&&!offshoreSafe&&z>=11));',s,count=1)
              assert n==1
              # A line-only stream has no authoritative polygon width. Leave native waterway
              # visible rather than inventing a wide animated strip across land.
              s=one(s,'if(!waterPolygon){','if(!waterPolygon){\n                if(z>=12){api.flowSegmentsRejectedOutsideWater++;continue;}')
              # The exact inland triangle pass handles polygon holes. Do not draw coarse
              # grid quads for remaining polygon cells at street zoom; native fill covers them.
              s=one(s,'if(kind===3||offshoreTilt&&kind===1||exactInland.has(waterFeature))continue;','if(kind===3||offshoreTilt&&kind===1||exactInland.has(waterFeature)||(z>=12&&kind===1&&waterFeature))continue;')
              # Coarse global geometry is not a valid street-level 3D surface, including
              # during an incremental rebuild. Keep the native water fallback in place.
              s=one(s,'if(globalCount){','if(globalCount&&z<7){')
              # Wave crests at the mapped shore keep their vertical motion but cannot
              # move sideways out of the source water polygon.
              s=one(s,"'  vec2 displacedPosition = worldPos+curlOffset;',","'  if(u_oceanZoom>=12.0&&(a_kind<2.5||a_flood<0.0||surfBarrel)){curlOffset=vec2(0.0);offsetM=clamp(offsetM,-2.5,2.5);}',\n    '  vec2 displacedPosition = worldPos+curlOffset;',")
              # Check full surf triangles against native marine polygons. Keep genuine
              # breakers where there is sufficient source-backed water on both sides.
              s=one(s,'const gen=buildSurfBarrels(bounds,map.getCenter().lat,coastalMesh,q,(x,y,h,fx,fy,t)=>{','const pendingSurf=[];\n                const gen=buildSurfBarrels(bounds,map.getCenter().lat,coastalMesh,q,(x,y,h,fx,fy,t)=>{')
              s=one(s,'pushVertex(surface,x,y,h,3.08,fx,fy,-t);surfVertices++;','''pendingSurf.push([x,y,h,fx,fy,t]);
                            if(pendingSurf.length===3){
                              const [a,b,c]=pendingSurf;
                              const samples=[a,b,c,[(a[0]+b[0])/2,(a[1]+b[1])/2],[(a[0]+c[0])/2,(a[1]+c[1])/2],[(b[0]+c[0])/2,(b[1]+c[1])/2],[(a[0]+b[0]+c[0])/3,(a[1]+b[1]+c[1])/3]];
                              if(waterFeatures.some(f=>marineFeature(f)&&samples.every(v=>featureContains(f,wrapLon(v[0]*360-180),unmercY(v[1]))))){
                                for(const v of pendingSurf){pushVertex(surface,v[0],v[1],v[2],3.08,v[3],v[4],-v[5]);surfVertices++;}
                              }
                              pendingSurf.length=0;
                            }''')
              changes[rel]=s
          # Ensure downgrade of layer ranges eventually happens after the first recovery,
          # without rebuilding the map or resetting the user's layer switches.
          for rel in (world,'app/'+world):
              s=(site/rel).read_text()
              assert 'bpDeviceQuality.bind(map)' in s
          for rel in ('landing.js','app.js'):
              s=(site/rel).read_text()
              s,n=re.subn(r'(world-v2300-water\.js\?[^"\'\s]+)',lambda m:m[1]+'&recovery=20261125v2',s)
              assert n>=1,(rel,'water import')
              changes[rel]=s
          for rel,entry in (('index.html','landing.js'),('app/index.html','app.js')):
              s=(site/rel).read_text()
              for key in (quality,entry):
                  s,n=re.subn(r'('+re.escape(key)+r'\?[^"\'\s]+)',lambda m:m[1]+'&recovery=20261125v2',s)
                  assert n>=1,(rel,key,n)
              changes[rel]=s
          for rel,s in changes.items(): (site/rel).write_text(s)
          shutil.copyfile(Path('scripts')/quality,site/quality)
          assert before==snapshot(),'UNRELATED RELEASE FILE CHANGED'
          print('RENDER_RECOVERY_BYTE_PRESERVATION_PASS',len(before))
          PY
          node --check "$SITE/bridgepoint-device-quality-v1.js"
          for p in world-v2300-water.js app/world-v2300-water.js landing.js app.js; do node --input-type=module --check < "$SITE/$p"; done
          node --input-type=module <<'JS'
          import fs from 'node:fs';import vm from 'node:vm';import assert from 'node:assert/strict';
          const code=fs.readFileSync(process.env.SITE+'/bridgepoint-device-quality-v1.js','utf8');
          let now=0,tick,ratio=null,moving=true;
          const events=new Map();
          const g={navigator:{hardwareConcurrency:16,deviceMemory:8,userAgent:'Android'},innerWidth:390,innerHeight:844,devicePixelRatio:3,document:{hidden:false,documentElement:{dataset:{}},addEventListener(){}},matchMedia:()=>({matches:true}),performance:{now:()=>now},requestAnimationFrame(){},setInterval(fn){tick=fn},addEventListener(){},console};
          g.window=g;vm.createContext(g);vm.runInContext(code,g);
          const q=g.__BP_DEVICE_QUALITY_V1__;
          assert.equal(q.profiles.length,10);assert.equal(q.state.initialLevel,2);
          q.bind({on:(e,f)=>events.set(e,f),off(){},isMoving:()=>moving,setPixelRatio:r=>ratio=r});
          events.get('movestart')();now+=3000;tick();
          assert.equal(q.state.level,1);assert(q.state.stallCount>0);assert(ratio!==null&&ratio<.78);
          assert(q.waterBudget.gridCells<=320&&q.state.featuresDisabled===0);
          console.log('ADAPTIVE_STALL_RECOVERY_PASS',q.state);
          JS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-v5000-${{ github.run_attempt }}
          path: ${{ runner.temp }}/horizon-site
          include-hidden-files: true
      - name: Wait for artifact indexing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "bridgepoint-v5000-'"$GITHUB_RUN_ATTEMPT"'") | .id')
            if [ -n "$ID" ]; then sleep 15; exit 0; fi
            sleep 4
          done
          exit 1
      - name: Publish only the validated recovery
        id: deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Retry only explicit transient HTTP 5xx responses to deployment creation.
          # Never retry a deployment which has already received an ID.
          for attempt in 1 2 3 4 5; do
            set +e
            node scripts/deploy-pages-extended.mjs 2>&1 | tee "$RUNNER_TEMP/pages-deploy.log"
            result=${PIPESTATUS[0]}
            set -e
            if [ "$result" -eq 0 ]; then exit 0; fi
            if grep -q 'Created GitHub Pages deployment' "$RUNNER_TEMP/pages-deploy.log"; then exit "$result"; fi
            if ! grep -Eq 'POST .*pages/deployments returned HTTP 5[0-9][0-9]' "$RUNNER_TEMP/pages-deploy.log"; then exit "$result"; fi
            if [ "$attempt" -eq 5 ]; then exit "$result"; fi
            sleep $((attempt * 20))
          done
      - name: Verify live bytes and preserved scan
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/horizon-site"
          for p in bridgepoint-device-quality-v1.js world-v2300-water.js app/world-v2300-water.js index.html app/index.html landing.js app.js bridgepoint-auto-reality-v1.js data/bp-auto-reality-v1.json assets/manhattan-photogrammetry-v1/registration.json; do
            curl --retry 8 --retry-all-errors --retry-delay 4 --max-time 40 -fsSL -H 'Cache-Control: no-cache' "https://bridgepointintelligence.online/$p?recovery=$GITHUB_SHA" -o "$RUNNER_TEMP/live"
            cmp "$SITE/$p" "$RUNNER_TEMP/live"
          done
          echo RENDER_RECOVERY_LIVE_BYTES_PASS

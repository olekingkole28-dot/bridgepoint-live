name: Publish BridgePoint V5370 City World
# retry-after-visible-city-source: 6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v5370-city-world.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-artifact
          fetch-depth: 1

      - name: Verify V5370 artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s app/index.html
          test -s app.js
          test -s world-v2300-map.js
          grep -Fq 'bp-public-surface' index.html
          grep -Fq 'app.js?v=5370' index.html
          grep -Fq 'app.js?v=5370' app/index.html
          grep -Fq 'world-v2300-map.js?v=5370' app.js
          grep -Fq '__BP_WORLD_RENDER_VERSION__=5370' world-v2300-map.js
          grep -Fq 'bridgepoint-public-building-city-tile-v5370' world-v2300-map.js
          grep -Fq "cityShell=z>=9.6" world-v2300-map.js
          grep -Fq "bp-statue-liberty-3d" world-v2300-map.js
          grep -Fq "CITY_TILE_LIMIT=MOBILE?500" world-v2300-map.js
          ! grep -Fqi 'cesium' index.html
          node --check world-v2300-map.js
          echo BRIDGEPOINT_V5370_ARTIFACT_VERIFIED

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-v5370-city-world
          path: .

      - name: Deploy V5370 city world
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: bridgepoint-v5370-city-world

      - name: Browser verify V5370 app and webpage parity
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          cd /tmp
          npm init -y >/dev/null 2>&1 || true
          npm install puppeteer-core@24 --no-audit --no-fund >/dev/null 2>&1
          CHROME_PATH="$CHROME" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const O='https://bridgepointintelligence.online';
          async function openSurface(browser,path){
            const p=await browser.newPage();
            await p.setUserAgent('Mozilla/5.0 (Linux; Android 16; Pixel 9a) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36');
            await p.setViewport({width:390,height:844,deviceScaleFactor:2,isMobile:true,hasTouch:true});
            await p.goto(O+path+'?v5370final='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
            await p.waitForFunction(()=>window.__BP_WORLD_RENDER_VERSION__===5370&&window.__BP_V5000_WORLD?.map,{timeout:45000});
            return p;
          }
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox','--disable-dev-shm-usage','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
            try{
              const app=await openSurface(browser,'/app/');
              await app.evaluate(()=>window.__BP_V5000_WORLD.map.jumpTo({center:[-74.006,40.7128],zoom:11.25,pitch:62,bearing:-18}));
              await app.waitForFunction(()=>{
                const m=window.__BP_V5000_WORLD?.map;
                if(!m||window.__BP_V5000_WORLD.state?.terrain!==true)return false;
                try{return (m.querySourceFeatures('bpBuildings',{sourceLayer:'buildings'})||[]).length>=300}catch{return false}
              },{timeout:35000});
              const city=await app.evaluate(()=>{
                const m=window.__BP_V5000_WORLD.map;
                const bp=(m.querySourceFeatures('bpBuildings',{sourceLayer:'buildings'})||[]).length;
                const rendered=(m.queryRenderedFeatures(undefined,{layers:['gta-bp-buildings']})||[]).length;
                return{bp,rendered,terrain:window.__BP_V5000_WORLD.state.terrain,mode:window.__BP_BUILDING_SHELL_MODE__};
              });
              if(city.bp<300||city.rendered<25||!city.terrain||city.mode?.cityScale3D!==true)throw new Error('CITY_LOD '+JSON.stringify(city));

              await app.evaluate(()=>window.__BP_V5000_WORLD.map.jumpTo({center:[-74.0445004,40.6892494],zoom:14.2,pitch:70,bearing:18}));
              await app.waitForFunction(()=>window.__BP_STATUE_OF_LIBERTY_STATE__?.status==='ready',{timeout:15000});
              const statue=await app.evaluate(()=>{
                const m=window.__BP_V5000_WORLD.map;
                return{state:window.__BP_STATUE_OF_LIBERTY_STATE__,count:(m.queryRenderedFeatures(undefined,{layers:['bp-statue-liberty-3d']})||[]).length};
              });
              if(statue.state?.colored!==true||statue.count<1)throw new Error('STATUE '+JSON.stringify(statue));
              await app.close();

              const root=await openSurface(browser,'/');
              const parity=await root.evaluate(()=>({world:window.__BP_WORLD_RENDER_VERSION__,hasMap:!!window.__BP_V5000_WORLD?.map,mapFirst:!!document.querySelector('meta[name="bp-public-surface"]')}));
              if(parity.world!==5370||!parity.hasMap||!parity.mapFirst)throw new Error('ROOT_PARITY '+JSON.stringify(parity));
              await root.close();
              console.log('BRIDGEPOINT_V5370_FINAL_PASS',JSON.stringify({city,statue,parity}));
            }finally{await browser.close()}
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE

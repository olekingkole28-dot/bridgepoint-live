name: Publish BridgePoint Property Twin V922

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-property-twin-v922.yml'
      - 'handoff/public-overlays/twin/**'
      - 'handoff/public-overlays/twin-launcher.js'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  publish-property-twin:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout public overlay source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Assemble current live artifact plus Property Twin
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site
          mkdir -p site
          git archive --format=tar origin/live-artifact | tar -xf - -C site

          test -s site/app/index.html
          test -s site/app/main.dart.js
          test -s handoff/public-overlays/twin/index.html
          test -s handoff/public-overlays/twin-launcher.js

          mkdir -p site/app/twin
          cp handoff/public-overlays/twin/index.html site/app/twin/index.html
          cp handoff/public-overlays/twin-launcher.js site/app/twin-launcher.js

          python - <<'PY'
          from pathlib import Path
          import json

          index = Path('site/app/index.html')
          html = index.read_text(encoding='utf-8')
          launcher = '<script src="twin-launcher.js" defer></script>'
          if launcher not in html:
              needle = '<script src="flutter_bootstrap.js" async></script>'
              if needle not in html:
                  raise SystemExit('Flutter bootstrap host marker missing')
              html = html.replace(needle, launcher + '\n  ' + needle)
              index.write_text(html, encoding='utf-8')

          twin = Path('site/app/twin/index.html').read_text(encoding='utf-8')
          if 'bridgepoint_property_twin_v918' not in twin:
              raise SystemExit('V918 Property Twin RPC marker missing')
          if 'bridgepoint_property_suggestions_v192' not in twin:
              raise SystemExit('Property search RPC marker missing')
          if 'SUPABASE_SERVICE_ROLE_KEY' in twin or 'service_role' in twin.lower():
              raise SystemExit('Forbidden privileged credential marker in public Twin')
          if 'sb_publishable_' not in twin:
              raise SystemExit('Public Supabase publishable key marker missing')
          if 'three@0.179.1' not in twin:
              raise SystemExit('Three.js Property Twin renderer marker missing')

          release = {
              'version': 922,
              'surface': 'property-twin',
              'backend_contract': 'bridgepoint_property_twin_v918',
              'search_contract': 'bridgepoint_property_suggestions_v192',
              'views': ['3d_site','front','aerial_current','aerial_history'],
              'auth': 'supabase-user-session-rls',
              'source_repo_private': True,
              'private_source_exposed': False,
              'production_host': '/app/twin/'
          }
          Path('site/app/property-twin-release-v922.json').write_text(
              json.dumps(release, indent=2) + '\n', encoding='utf-8'
          )
          PY

          grep -q 'twin-launcher.js' site/app/index.html
          grep -q 'Property Twin 3D' site/app/twin-launcher.js
          grep -q 'Property Twin' site/app/twin/index.html
          touch site/.nojekyll site/app/.nojekyll

      - name: Persist durable live artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bridgepoint-final-live
          mkdir -p /tmp/bridgepoint-final-live
          cp -a site/. /tmp/bridgepoint-final-live/
          cd /tmp/bridgepoint-final-live
          git init -q
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m 'Publish BridgePoint Property Twin V922 on current live artifact'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify Property Twin live
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://bridgepointintelligence.online'
          for attempt in $(seq 1 24); do
            app="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/?v=922-${attempt}" 2>/dev/null || true)"
            twin="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/twin/?v=922-${attempt}" 2>/dev/null || true)"
            release="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/property-twin-release-v922.json?v=922-${attempt}" 2>/dev/null || true)"
            launcher="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/twin-launcher.js?v=922-${attempt}" 2>/dev/null || true)"
            if printf '%s' "$app" | grep -q 'twin-launcher.js' \
              && printf '%s' "$app" | grep -q 'flutter_bootstrap.js' \
              && printf '%s' "$twin" | grep -q 'bridgepoint_property_twin_v918' \
              && printf '%s' "$twin" | grep -q '3D Site' \
              && printf '%s' "$release" | grep -q '"version": 922' \
              && printf '%s' "$launcher" | grep -q 'Property Twin 3D'; then
              echo 'BridgePoint Property Twin V922 verified live.'
              exit 0
            fi
            sleep 10
          done
          echo 'Property Twin V922 did not converge on the public domain.' >&2
          exit 1

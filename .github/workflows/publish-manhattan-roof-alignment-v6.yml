name: Manhattan V6 shared surveyed building and roof alignment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-manhattan-roof-alignment-v6.yml']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact live successful release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/45709286096 --jq '.conclusion')" = success
          mkdir -p "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/horizon-site"
          for i in 1 2 3; do
            if timeout 240s gh run download 45709286096 --repo "$GITHUB_REPOSITORY" --name bridgepoint-v5000-1 --dir "$RUNNER_TEMP/baseline" && test -s "$RUNNER_TEMP/baseline/artifact.tar"; then break; fi
            sleep 5
          done
          tar -xf "$RUNNER_TEMP/baseline/artifact.tar" -C "$RUNNER_TEMP/horizon-site"
          for p in index.html app/index.html landing.js app.js world-v2300-map.js app/world-v2300-map.js world-v2300-water.js bridgepoint-bottom-card-mobile-v2.js; do
            curl --retry 4 --retry-all-errors --max-time 45 -fsSL -H 'Cache-Control: no-cache' "https://bridgepointintelligence.online/$p?baseline=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/current"
            cmp "$RUNNER_TEMP/horizon-site/$p" "$RUNNER_TEMP/current"
          done
      - name: Build native rooftop vector tiles and reference-guided facade atlas
        run: |
          set -euo pipefail
          export SITE="$RUNNER_TEMP/horizon-site"
          python3 -m pip install --quiet 'shapely>=2.1,<3' mapbox-vector-tile Pillow
          python3 - <<'PY'
          import os,json,math,urllib.request,urllib.parse,hashlib,collections,random,concurrent.futures
          from pathlib import Path
          from shapely.geometry import Point,Polygon,box,mapping,shape
          from shapely.affinity import rotate,translate,scale
          from shapely.ops import transform
          from shapely.strtree import STRtree
          from mapbox_vector_tile import encode,decode
          from PIL import Image,ImageDraw,ImageEnhance
          site=Path(os.environ['SITE'])
          out=site/'assets/manhattan-native-v6';out.mkdir(exist_ok=True)
          pack=site/'assets/manhattan-rooftop-v3'
          payload=json.loads((site/'data/bp-manhattan-roof-detail-v1.json').read_text())
          old=site/'assets/manhattan-native-v5'
          import shutil
          for p in old.glob('*.png'):shutil.copyfile(p,out/p.name)
          # Retrieve the official ground and roof elevations needed to convert
          # water-tank absolute survey heights to terrain-relative native heights.
          def get(offset):
              q={'$select':'the_geom,bin,height_roof,ground_elevation,construction_year,name,doitt_id','$where':'bin between 1000000 and 1999999','$order':':id','$limit':5000,'$offset':offset}
              url='https://data.cityofnewyork.us/resource/5zhs-2jue.geojson?'+urllib.parse.urlencode(q)
              for retry in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'BridgePoint native roof alignment/5.0'})
                      with urllib.request.urlopen(req,timeout=80) as r:return json.load(r)['features']
                  except Exception:
                      if retry==2:raise
          builds=[];heights=[];props=[]
          try:
              for start in range(0,100000,20000):
                  with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:pages=list(pool.map(get,range(start,start+20000,5000)))
                  for page in pages:
                      for f in page:
                          try:
                              p=f['properties'];h=float(p['height_roof'])*.3048;g=float(p['ground_elevation'])*.3048;geom=shape(f['geometry'])
                              if geom.is_valid and not geom.is_empty and 3<=h<=650:builds.append(geom);heights.append((h,g));props.append(p)
                          except (ValueError,TypeError,KeyError):continue
                  if any(len(page)<5000 for page in pages):break
          except Exception as e:print('TANK_ALIGNMENT_PARTIAL',str(e)[:180])
          assert len(builds)>40000,len(builds)
          tree=STRtree(builds)
          print('NYC_GROUND_ROOF_REFERENCE_COUNT',len(builds),flush=True)
          R=6378137.;world=math.pi*R
          def merc(lng,lat):return R*math.radians(lng),R*math.log(math.tan(math.pi/4+math.radians(lat)/2))
          def rect(w,d,x=0,y=0,a=0):return translate(rotate(box(-w/2,-d/2,w/2,d/2),a,use_radians=True,origin=(0,0)),x,y)
          def disk(r,x=0,y=0):return Point(x,y).buffer(r,quad_segs=5)
          def ring(r,width):return disk(r).difference(disk(max(.02,r-width)))
          bins={z:collections.defaultdict(list) for z in (16,17)}
          shellbins={z:collections.defaultdict(list) for z in (16,17)}
          counts=collections.Counter()
          host_geom=None;host_id=None;host_height=None
          def add(unit,geom,low,high,color,part,levels=(16,17)):
              lng,lat,cx,cy,coslat=unit
              if geom.is_empty or not geom.is_valid or high<=low:return
              g=translate(scale(geom,xfact=1/coslat,yfact=1/coslat,origin=(0,0)),cx,cy)
              if host_geom is None or host_height is None:return
              g=g.intersection(host_geom)
              if g.is_empty or g.geom_type not in ('Polygon','MultiPolygon') or g.area<.001:return
              assert low>=host_height+.11-1e-6,(part,low,host_height)
              prop={'b':round(low,2),'h':round(high,2),'c':color,'part':part,'host':host_id,'roof':round(host_height,2)}
              for z in levels:
                  size=2*world/(2**z);a,b,c,d=g.bounds
                  for x in range(math.floor((a+world)/size),math.floor((c+world)/size)+1):
                      for y in range(math.floor((world-d)/size),math.floor((world-b)/size)+1):
                          bins[z][x,y].append((g,prop))
          # A single shared source of truth for all roof surfaces and equipment.
          # All shell and equipment heights use the same terrain-relative roof elevation.
          projected=[]
          for i,(g,(h,ground),p) in enumerate(zip(builds,heights,props)):
              geom=transform(lambda x,y,z=None:merc(x,y),g)
              projected.append(geom)
              year=int(float(p.get('construction_year') or 0))
              name=str(p.get('name') or '')
              seed=int(p.get('doitt_id') or i+1)
              material='glass' if h>65 and year>=1970 else 'brick' if 0<year<1940 and h<50 else 'limestone' if 0<year<1960 else 'steel' if h>85 else 'concrete' if seed%3 else 'castiron'
              roofmat=['roof-light','roof-dark','roof-gravel'][seed%3]
              prop={'h':round(h,2),'roof':round(h,2),'host':i+1,'bin':str(p.get('bin') or ''),'name':name,'building_id':str(seed),'height_m':round(h,2),'construction_year':year,'material':material,'roofmat':roofmat}
              for z in (16,17):
                  size=2*world/(2**z);a,b,c,d=geom.bounds
                  for x in range(math.floor((a+world)/size),math.floor((c+world)/size)+1):
                      for y in range(math.floor((world-d)/size),math.floor((world-b)/size)+1):
                          shellbins[z][x,y].append((geom,prop))
          for rows in payload['cells'].values():
              for row in rows:
                  lng,lat,roof,top,r,a,*kind=row
                  if not (-74.04<=lng<=-73.89 and 40.68<=lat<=40.89):continue
                  cx,cy=merc(lng,lat);unit=(lng,lat,cx,cy,math.cos(math.radians(lat)))
                  r=max(.18,min(10.,r));tank=bool(kind and kind[0]=='tank')
                  ids=tree.query(Point(lng,lat),predicate='within')
                  if len(ids)==0:counts['unmatched']+=1;continue
                  # Highest containing roof prevents placement on a lower footprint
                  # underneath an overlapping tall building or rooftop structure.
                  i=max(ids,key=lambda j:heights[j][0]);h,ground=heights[i]
                  host_geom=projected[i];host_id=int(i)+1;host_height=h
                  if tank:
                      # Ground survey and building shell already share the matched host.
                      if abs(h+ground-roof)>12:counts['ambiguousTank']+=1;continue
                      base=h+.15;hh=max(.7,min(12,top-roof));rr=r*.80;leg=min(1.8,hh*.27);wall=base+leg
                      add(unit,disk(rr),wall,wall+hh*.69,'#806951','tank-body')
                      add(unit,disk(rr*1.02),wall+hh*.69,wall+hh*.80,'#5f5245','tank-cap')
                      add(unit,disk(rr*.68),wall+hh*.80,wall+hh*.90,'#6f6050','tank-cap')
                      # The 4 steel legs and 3 hoop bands are solid, non-camera-facing polygons.
                      for k in range(4):
                          t=k*math.pi/2
                          add(unit,rect(max(.07,rr*.10),max(.07,rr*.10),rr*.66*math.cos(t),rr*.66*math.sin(t)),base,wall,'#424c50','tank-support')
                      for k in (.13,.37,.60):
                          y=wall+hh*k;add(unit,ring(rr*1.025,max(.045,rr*.065)),y,y+.075,'#50575a','tank-band',(17,))
                      counts['tanks']+=1
                      continue
                  # Cooling tower outlines were joined to NYC building footprints.
                  # Rounded fan assemblies, cabinet, recessed fan well and metal
                  # protective rails stay inside each measured inscribed circle.
                  base=h+.17;hh=max(.4,min(2.8,top-roof));rr=r*.53;w=r*1.34;d=r*1.22
                  add(unit,rect(w,d,a=a),base,base+hh*.72,'#a1a6a8','hvac-cabinet')
                  add(unit,rect(w*1.03,d*1.03,a=a),base+hh*.72,base+hh*.82,'#c5cbcb','hvac-lid')
                  y=base+hh*.82
                  add(unit,disk(rr),y,y+.055,'#303b42','fan-well')
                  add(unit,ring(rr*1.06,max(.045,rr*.12)),y,y+.16,'#84969d','fan-rim')
                  add(unit,disk(max(.045,rr*.16)),y+.055,y+.14,'#a7b2b5','fan-hub',(17,))
                  for k in range(4):
                      t=a+k*math.pi/2
                      add(unit,rect(rr*.74,max(.06,rr*.20),math.cos(t)*rr*.42,math.sin(t)*rr*.42,t),y+.055,y+.105,'#63767e','fan-blade',(17,))
                  for k in (-1,0,1):
                      offset=k*rr*.48;length=2*math.sqrt(max(0,rr*rr-offset*offset))
                      # grille bars rotated as a unit; physically above the blades.
                      g=rotate(rect(max(.045,rr*.045),length,offset,0),a,use_radians=True,origin=(0,0))
                      add(unit,g,y+.16,y+.22,'#bac2c2','fan-guard',(17,))
                  counts['cooling']+=1
          # Native MVT pyramid: browser requests only visible tiles, no full-city
          # GeoJSON parse, no Three.js or new WebGL renderer.
          tile_count=0;largest=0;features=0
          for z,roof_tiles in bins.items():
              tiles={key:roof_tiles.get(key,[]) for key in set(roof_tiles)|set(shellbins[z])}
              size=2*world/(2**z)
              for (x,y),items in tiles.items():
                  xmin=-world+x*size;ymax=world-y*size;ymin=ymax-size;xmax=xmin+size
                  clip=box(xmin-2,ymin-2,xmax+2,ymax+2)
                  fs=[]
                  for g,p in items:
                      q=g if clip.contains(g) else g.intersection(clip)
                      if not q.is_empty and q.geom_type in ('Polygon','MultiPolygon'):fs.append({'geometry':q,'properties':p})
                  shells=[]
                  for g,p in shellbins[z].get((x,y),[]):
                      q=g if clip.contains(g) else g.intersection(clip)
                      if not q.is_empty and q.geom_type in ('Polygon','MultiPolygon'):shells.append({'geometry':q,'properties':p,'id':p['host']})
                  raw=encode([{'name':'rooftops','features':fs},{'name':'buildings','features':shells}],default_options={'quantize_bounds':(xmin,ymin,xmax,ymax),'extents':8192})
                  path=out/'tiles'/str(z)/str(x)/(str(y)+'.pbf');path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(raw)
                  largest=max(largest,len(raw));features+=len(fs);tile_count+=1
              # Make empty tiles inside the bounded region explicit instead of HTTP 404s.
              x0=min(x for x,y in tiles);x1=max(x for x,y in tiles);y0=min(y for x,y in tiles);y1=max(y for x,y in tiles)
              empty=encode([{'name':'rooftops','features':[]},{'name':'buildings','features':[]}],default_options={'extents':8192})
              for x in range(x0,x1+1):
                  folder=out/'tiles'/str(z)/str(x);folder.mkdir(parents=True,exist_ok=True)
                  for y in range(y0,y1+1):
                      path=folder/(str(y)+'.pbf')
                      if not path.exists():path.write_bytes(empty)
          assert counts['cooling']>=12000 and counts['tanks']>=1000,(counts,len(builds))
          assert largest<1_500_000,largest
          # One sample tile decode, verify native extrusion heights and source layer.
          sample=next(p for p in (out/'tiles/17').rglob('*.pbf') if p.stat().st_size>100)
          ff=decode(sample.read_bytes());assert 'buildings' in ff and 'rooftops' in ff
          for p in (out/'tiles/17').rglob('*.pbf'):
              d=decode(p.read_bytes());hosts={f['properties']['host']:f['properties']['h'] for f in d['buildings']['features']}
              for f in d['rooftops']['features']:
                  v=f['properties'];assert v['h']>v['b']>=v['roof']+.11-1e-6 and v['host'] in hosts and abs(v['roof']-hosts[v['host']])<.011,(p,v)
          print('ALL_NATIVE_ROOFTOP_COMPONENTS_SHARE_RENDERED_HOST_HEIGHT',flush=True)
          manifest={'buildings':len(builds),'unmatched':counts['unmatched'],'ambiguousTank':counts['ambiguousTank'],'cooling':counts['cooling'],'waterTanks':counts['tanks'],'nonemptyTiles':tile_count,'polygonFeatures':features,'maxTileBytes':largest,'source':'NYC 2022 water tanks and cooling towers / NYC building footprint roof and ground elevations','appearance':'Representative solid native polygon components; not surveyed machinery make/model. User-supplied skyline and SoHo photographs used as visual reference only. Photo materials from CC0 Poly Haven atlas. No Getty photo pixels embedded. No automatic heavy GLB renderer.'}
          req=urllib.request.Request('https://data.cityofnewyork.us/resource/gthc-hcne.geojson?'+urllib.parse.urlencode({'$where':'borocode=1','$limit':1}),headers={'User-Agent':'BridgePoint alignment/6.0'})
          with urllib.request.urlopen(req,timeout=60) as r:borough=shape(json.load(r)['features'][0]['geometry'])
          # Tolerant coastal boundary only; other boroughs remain untouched.
          borough=borough.buffer(.00006).simplify(.00018,preserve_topology=True)
          (out/'boundary.json').write_text(json.dumps(mapping(borough),separators=(',',':')))
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          print('MANHATTAN_NATIVE_POLYGON_TILES',json.dumps(manifest),flush=True)
          PY
      - name: Preserve generated alignment tiles for diagnosis and retries
        uses: actions/upload-artifact@v4
        with:
          name: manhattan-aligned-native-tiles
          path: ${{ runner.temp }}/horizon-site/assets/manhattan-native-v6
          retention-days: 3
      - name: Use unified Manhattan building and roof tiles
        run: |
          set -euo pipefail
          export SITE="$RUNNER_TEMP/horizon-site"
          python3 - <<'PY'
          import os,json,hashlib
          from pathlib import Path
          site=Path(os.environ['SITE']);allowed={'world-v2300-map.js','app/world-v2300-map.js','landing.js','app.js','vendor/bp-public-globe-v4.mjs','index.html','app/index.html'}
          def snap():return {p.relative_to(site).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in site.rglob('*') if p.is_file() and p.relative_to(site).as_posix() not in allowed}
          before=snap();boundary=(site/'assets/manhattan-native-v6/boundary.json').read_text()
          def one(s,a,b):
              assert s.count(a)==1,(a[:100],s.count(a));return s.replace(a,b)
          for rel in ('world-v2300-map.js','app/world-v2300-map.js'):
              p=site/rel;s=p.read_text()
              s=one(s,"const bpNativeManhattanRoot='/assets/manhattan-native-v5/';","const bpNativeManhattanRoot='/assets/manhattan-native-v6/';\n const bpManhattanBoundary="+boundary+";")
              s=one(s,"const bpNativeManhattanNear=()=>{const c=map.getCenter();return c.lng>=-74.04&&c.lng<=-73.89&&c.lat>=40.68&&c.lat<=40.89};",r'''const bpNativeManhattanNear=()=>{const c=map.getCenter();if(c.lng < -74.04||c.lng > -73.89||c.lat < 40.68||c.lat > 40.89)return false;const polygons=bpManhattanBoundary.type==='Polygon'?[bpManhattanBoundary.coordinates]:bpManhattanBoundary.coordinates;function inside(r){let yes=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const a=r[i],b=r[j];if((a[1]>c.lat)!==(b[1]>c.lat)&&c.lng<(b[0]-a[0])*(c.lat-a[1])/(b[1]-a[1])+a[0])yes=!yes}return yes}return polygons.some(p=>inside(p[0])&&!p.slice(1).some(inside))};''')
              s=one(s,"let bpNativeManhattanImages=null,bpNativeManhattanReady=false,bpNativeManhattanPending=false,bpNativeManhattanLast=false;","let bpNativeManhattanImages=null,bpNativeManhattanReady=false,bpNativeManhattanPending=false,bpNativeManhattanLast=false;\n let bpAlignedActive=false,bpAlignedCheckAt=0,bpAlignedProbe=null,bpAlignedRetry=0;const bpAlignedOriginalFilters=new Map(),bpAlignedBody='bp-manhattan-surveyed-body-v6',bpAlignedCap='bp-manhattan-surveyed-cap-v6';")
              a=s.index('            function bpNativeManhattanSync(){') if '            function bpNativeManhattanSync(){' in s else s.index('function bpNativeManhattanSync(){')
              b=s.index("map.on('moveend',bpNativeManhattanSync);",a)
              s=s[:a]+r'''
            function bpAlignedHandoff(on){
              if(bpAlignedActive===on)return;
              const ids=['gta-context-buildings','gta-bp-buildings','gta-city-buildings','gta-exact-building','gta-context-roofs','gta-bp-roofs','gta-city-roofs','gta-exact-roof','gta-context-floor-lines','gta-bp-floor-lines','gta-city-floor-lines','gta-exact-floor-lines','gta-context-facade-detail','gta-bp-facade-detail','gta-exact-facade-detail','gta-context-building-parts','gta-city-building-roof-caps','gta-context-night-windows','gta-bp-night-windows','gta-exact-night-windows'];
              for(const id of ids){
                if(!map.getLayer(id))continue;
                if(on){
                  const f=map.getFilter(id)||null;bpAlignedOriginalFilters.set(id,f);
                  const outside=['>', ['distance',bpManhattanBoundary], .5];
                  try{map.setFilter(id,f?['all',f,outside]:outside)}catch(e){console.warn('Manhattan boundary filter',id,String(e));throw e}
                }else if(bpAlignedOriginalFilters.has(id))map.setFilter(id,bpAlignedOriginalFilters.get(id));
              }
              if(!on)bpAlignedOriginalFilters.clear();
              bpAlignedActive=on;
            }
            function bpNativeManhattanSync(){
              const near=bpNativeManhattanNear(),z=map.getZoom(),on=near&&z>=15.6&&!!layerState.buildings;
              if(near&&z>=12.5)bpNativeManhattanWarm();
              if(on&&!map.getSource(bpNativeManhattanSource)){
                try{
                  map.addSource(bpNativeManhattanSource,{type:'vector',tiles:[location.origin+bpNativeManhattanRoot+'tiles/{z}/{x}/{y}.pbf'],minzoom:16,maxzoom:17,bounds:[-74.04,40.68,-73.89,40.89],attribution:'NYC Open Data surveyed building footprints and rooftop features'});
                  const before=map.getLayer('gta-water-label')?'gta-water-label':undefined;
                  map.addLayer({id:bpAlignedBody,type:'fill-extrusion',source:bpNativeManhattanSource,'source-layer':'buildings',minzoom:15.6,paint:{'fill-extrusion-base':0,'fill-extrusion-height':['get','h'],'fill-extrusion-color':'#a9a39a','fill-extrusion-opacity':1,'fill-extrusion-vertical-gradient':true}},before);
                  map.addLayer({id:bpAlignedCap,type:'fill-extrusion',source:bpNativeManhattanSource,'source-layer':'buildings',minzoom:15.6,paint:{'fill-extrusion-base':['+', ['get','h'],.025],'fill-extrusion-height':['+', ['get','h'],.14],'fill-extrusion-color':'#a3a5a3','fill-extrusion-opacity':1,'fill-extrusion-vertical-gradient':false}},before);
                  map.addLayer({id:bpNativeManhattanLayer,type:'fill-extrusion',source:bpNativeManhattanSource,'source-layer':'rooftops',minzoom:15.6,paint:{'fill-extrusion-base':['get','b'],'fill-extrusion-height':['get','h'],'fill-extrusion-color':['get','c'],'fill-extrusion-opacity':0,'fill-extrusion-vertical-gradient':false}},before);
                }catch(e){console.warn('Manhattan aligned roof tile setup',e)}
              }
              if(map.getLayer(bpAlignedBody)){
                for(const id of [bpAlignedBody,bpAlignedCap,bpNativeManhattanLayer])vis(map,id,on);
                let ready=bpAlignedActive;
                if(on&&!ready&&!map.isMoving?.()&&performance.now()-bpAlignedCheckAt>450){
                  bpAlignedCheckAt=performance.now();try{const loaded=map.isSourceLoaded(bpNativeManhattanSource);const caps=map.queryRenderedFeatures({layers:[bpAlignedCap]});const shells=map.querySourceFeatures(bpNativeManhattanSource,{sourceLayer:'buildings'});ready=loaded&&caps.length>0&&shells.length>0;bpAlignedProbe={caps:caps.length,shells:shells.length,loaded,zoom:z}}catch(e){bpAlignedProbe={error:String(e)}}
                }
                if(!on||!map.isMoving?.()&&(ready||bpAlignedActive)){
                  const show=on&&(ready||bpAlignedActive);
                  bpAlignedHandoff(show);
                  for(const id of [bpAlignedBody,bpAlignedCap,bpNativeManhattanLayer]){
                    if(map.getPaintProperty(id,'fill-extrusion-opacity')!==(show?1:0))map.setPaintProperty(id,'fill-extrusion-opacity',show?1:0);
                  }
                  if(bpNativeManhattanReady&&!map.__bpAlignedTexturesV6){
                    map.setPaintProperty(bpAlignedBody,'fill-extrusion-pattern',['concat','bp-manhattan-v5-',['get','material']]);
                    map.setPaintProperty(bpAlignedCap,'fill-extrusion-pattern',['concat','bp-manhattan-v5-',['get','roofmat']]);
                    map.__bpAlignedTexturesV6=true;
                  }
                }
              }
              window.__BP_MANHATTAN_NATIVE_V5__={visible:on&&bpAlignedActive,materials:bpNativeManhattanReady,native:true,customRenderer:false,sharedHost:true,near,zoom:z,probe:bpAlignedProbe,source:!!map.getSource(bpNativeManhattanSource),body:!!map.getLayer(bpAlignedBody),moving:!!map.isMoving?.()};
              if(on&&!bpAlignedActive&&!bpAlignedRetry){bpAlignedRetry=setTimeout(()=>{bpAlignedRetry=0;if(!map.isMoving?.())bpNativeManhattanSync()},600)}
            }
            map.on('sourcedata',e=>{if(e.sourceId===bpNativeManhattanSource&&!bpAlignedActive&&!map.isMoving?.()&&!bpAlignedRetry)bpAlignedRetry=setTimeout(()=>{bpAlignedRetry=0;bpNativeManhattanSync()},600)});
            map.on('remove',()=>clearTimeout(bpAlignedRetry));
            '''+s[b:]

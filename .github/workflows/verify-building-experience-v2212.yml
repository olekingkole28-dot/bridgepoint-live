name: Verify BridgePoint V2212 Building Experience

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-building-experience-v2212.yml'
      - 'release-v2212/building-experience-v2212.js'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify live V2212 building module
        shell: bash
        run: |
          set -euo pipefail
          origin='https://bridgepointintelligence.online/app'
          ok=0
          for attempt in $(seq 1 36); do
            salt="${GITHUB_SHA}-${attempt}-$(date +%s)"
            if curl --retry 3 --retry-all-errors --retry-delay 2 -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$origin/building-experience-v2212.js?verify=$salt" -o /tmp/v2212.js; then
              if node --check /tmp/v2212.js && grep -Fq 'BridgePointBuildingExperienceV2212' /tmp/v2212.js && grep -Fq 'colorPreserved:true' /tmp/v2212.js && grep -Fq 'motionLOD:true' /tmp/v2212.js && grep -Fq 'rotatableSite3D:true' /tmp/v2212.js && grep -Fq 'continuousAnimation:false' /tmp/v2212.js && grep -Fq 'bridgepoint_structure_study_v2180' /tmp/v2212.js && grep -Fq 'bp2212-selected-building' /tmp/v2212.js; then
                curl --retry 3 --retry-all-errors --retry-delay 2 -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$origin/?verify=$salt" -o /tmp/app.html
                if grep -Fq 'building-experience-v2212.js?v=2212' /tmp/app.html; then ok=1; break; fi
              fi
            fi
            sleep 5
          done
          test "$ok" = 1
          echo V2212_LIVE_INVENTORY_PASS

      - name: Exercise building click card selection and motion LOD on phone
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24 --no-audit --no-fund >/dev/null 2>&1
          CHROME_PATH="$CHROME" node <<'NODE'
          const puppeteer=require('puppeteer-core'),assert=require('assert');
          const O='https://bridgepointintelligence.online/app/building-experience-v2212.js';
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox','--disable-dev-shm-usage','--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            try{
              const p=await browser.newPage();
              await p.setViewport({width:390,height:844,deviceScaleFactor:2,isMobile:true,hasTouch:true});
              await p.setContent('<!doctype html><html><body><div class="map-shell"><canvas id="mapCanvas" width="390" height="700" style="width:390px;height:700px"></canvas></div><aside id="mapDrawer" hidden></aside></body></html>');
              await p.evaluate(()=>{
                localStorage.setItem('sb-xdfsjztwgsbmabshzsjw-auth-token',JSON.stringify({access_token:'test-token'}));
                const EMPTY={type:'FeatureCollection',features:[]},sources=new Map(),layers=new Map(),events={};
                const canvas=document.getElementById('mapCanvas');
                sources.set('bp2162-openmaptiles',{id:'bp2162-openmaptiles'});
                layers.set('labels',{id:'labels',layout:{visibility:'visible'}});
                layers.set('bp97-building',{id:'bp97-building',layout:{visibility:'visible'}});
                layers.set('bp97-floorbands',{id:'bp97-floorbands',layout:{visibility:'visible'}});
                const building={type:'Feature',geometry:{type:'Polygon',coordinates:[[[-72.651,41.559],[-72.649,41.559],[-72.649,41.561],[-72.651,41.561],[-72.651,41.559]]]},properties:{height:12,property_id:'p-1'}};
                const map={
                  getLayer:id=>layers.get(id)||null,
                  addLayer:(l)=>layers.set(l.id,{...l,layout:{...(l.layout||{}),visibility:l.layout?.visibility||'visible'}}),
                  getSource:id=>sources.get(id)||null,
                  addSource:(id,s)=>sources.set(id,{...s,setData:d=>{sources.get(id).data=d}}),
                  setLayoutProperty:(id,k,v)=>{const l=layers.get(id)||{id,layout:{}};l.layout=l.layout||{};l.layout[k]=v;layers.set(id,l)},
                  getLayoutProperty:(id,k)=>layers.get(id)?.layout?.[k],
                  on:(n,fn)=>{(events[n]||(events[n]=[])).push(fn)},
                  queryRenderedFeatures:()=>[building],
                  getCanvas:()=>canvas,
                  getZoom:()=>17,getCenter:()=>({lng:-72.65,lat:41.56}),getBearing:()=>0,getPitch:()=>60,
                  setFadeDuration:()=>{},setMaxParallelImageRequests:()=>{},triggerRepaint:()=>{},
                  fitBounds:(b,o)=>window.__fit={b,o},flyTo:o=>window.__fly=o
                };
                window.__mock={sources,layers,events,building};
                window.__bp97MapState={ready:true,map,measureMode:false};
                window.fetch=async(url,opts)=>({ok:true,status:200,json:async()=>({
                  property:{property_id:'p-1',full_address:'123 BridgePoint Way',municipality:'Middletown',county:'Middlesex',state_code:'CT',parcel_number:'ABC-123',parcel_area_m2:930,parcel_perimeter_m:125,year_built:2004,assessed_total_value:315000,parcel_geometry:{type:'Polygon',coordinates:[[[-72.652,41.558],[-72.648,41.558],[-72.648,41.562],[-72.652,41.562],[-72.652,41.558]]]}},
                  building:{geometry:building.geometry,height_m:12,floors:2,footprint_area_m2:180,footprint_perimeter_m:58,roof_shape:'gable',roof_material:'asphalt'},
                  opportunity:{opportunity_id:'o-1',title:'Roof opportunity',score:82,priority:'HIGH',reason:'Source-backed signals',recommended_action:'Review evidence'}
                })});
                window.BridgePointProperty360V1046={open:id=>window.__opened=id};
              });
              let loaded=false,lastErr;for(let i=0;i<5&&!loaded;i++){try{await p.addScriptTag({url:`${O}?phone=${Date.now()}-${i}`});loaded=true}catch(e){lastErr=e;await new Promise(r=>setTimeout(r,1200))}}if(!loaded)throw lastErr;
              await p.waitForFunction(()=>window.BridgePointBuildingExperienceV2212?.version===2212,{timeout:12000});
              await p.evaluate(()=>{const ev=window.__mock.events.click?.[0];if(!ev)throw Error('click handler missing');ev({point:{x:195,y:350},lngLat:{lng:-72.65,lat:41.56}})});
              await p.waitForFunction(()=>document.querySelector('#mapDrawer .bp2212-site canvas')&&document.getElementById('mapDrawer').textContent.includes('123 BridgePoint Way'),{timeout:9000});
              const out=await p.evaluate(async()=>{
                const S=BridgePointBuildingExperienceV2212.getState(),src=window.__mock.sources.get('bp2212-selected-site'),drawer=document.getElementById('mapDrawer');
                const before=window.__mock.layers.get('bp2212-building-sheen')?.layout?.visibility;
                window.__mock.events.movestart?.forEach(fn=>fn());
                const moving=window.__mock.layers.get('bp2212-building-sheen')?.layout?.visibility;
                window.__mock.events.moveend?.forEach(fn=>fn());
                await new Promise(r=>setTimeout(r,300));
                const restored=window.__mock.layers.get('bp2212-building-sheen')?.layout?.visibility;
                document.getElementById('bp2212Open360').click();
                return{S,count:src?.data?.features?.length||0,text:drawer.textContent,moving,restored,before,opened:window.__opened,hasDetail:!!window.__mock.layers.get('bp2212-building-sheen'),hasHighlight:!!window.__mock.layers.get('bp2212-selected-building')};
              });
              assert(out.S.colorPreserved&&out.S.motionLOD&&out.S.propertyCard&&out.S.rotatableSite3D&&!out.S.continuousAnimation);
              assert(out.hasDetail&&out.hasHighlight);assert.equal(out.count,2);assert(out.text.includes('Parcel / land area'));assert(out.text.includes('Intelligence color preserved below detail'));assert.equal(out.moving,'none');assert.notEqual(out.restored,'none');assert.equal(out.opened,'p-1');
              console.log('BRIDGEPOINT_V2212_BUILDING_PHONE_PASS',JSON.stringify(out.S));
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

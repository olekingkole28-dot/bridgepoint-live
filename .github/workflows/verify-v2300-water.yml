name: Verify BridgePoint GPU Water v6114

on:
  pull_request:
    branches: [main]
    paths:
      - 'release-v2300/world-v2300-water.js'
      - 'rebuild-v5000/app.js'
      - 'rebuild-v5000/landing.js'
      - 'rebuild-v5000/index.html'
      - 'rebuild-v5000/app-index.html'
      - '.github/workflows/deploy-intelligence-rebuild-v5000.yml'
      - '.github/workflows/verify-v2300-water.yml'
  push:
    branches: [main]
    paths:
      - 'release-v2300/world-v2300-water.js'
      - 'rebuild-v5000/app.js'
      - 'rebuild-v5000/landing.js'
      - 'rebuild-v5000/index.html'
      - 'rebuild-v5000/app-index.html'
      - '.github/workflows/deploy-intelligence-rebuild-v5000.yml'
      - '.github/workflows/verify-v2300-water.yml'

permissions:
  contents: read

jobs:
  water-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < release-v2300/world-v2300-water.js
          node --check rebuild-v5000/app.js
          node --check rebuild-v5000/landing.js
      - name: Verify runtime wiring and deployment copies
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "export function initWaterEngine" release-v2300/world-v2300-water.js
          grep -Fq "projectTileFor3D(a_pos" release-v2300/world-v2300-water.js
          grep -Fq "function mapCanHostWater()" release-v2300/world-v2300-water.js
          grep -Fq "float marineSurgeMask" release-v2300/world-v2300-water.js
          ! grep -Fq "!map.isStyleLoaded?.()" release-v2300/world-v2300-water.js
          grep -Fq "window.__BP_WATER_FIELD_V6114__" release-v2300/world-v2300-water.js
          grep -Fq "const raw = feature && feature.row ? feature.row : feature;" release-v2300/world-v2300-water.js
          grep -Fq "typeof item.getScene === 'function'" release-v2300/world-v2300-water.js
          grep -Fq "bp2300:weather-updated" release-v2300/world-v2300-water.js
          grep -Fq "floodedLandCells" release-v2300/world-v2300-water.js
          grep -Fq "sourceAnchorLayersPresent" release-v2300/world-v2300-water.js
          grep -Fq "const MIN_VALID_TERRAIN_ELEVATION_M = -500;" release-v2300/world-v2300-water.js
          grep -Fq "const MAX_VALID_TERRAIN_ELEVATION_M = 8900;" release-v2300/world-v2300-water.js
          grep -Fq "api.flowSegmentsRejectedElevationJump++;" release-v2300/world-v2300-water.js
          grep -Fq "const SHORELINE_GUARD_ZOOM = 12;" release-v2300/world-v2300-water.js
          grep -Fq "api.surfaceCellsRejectedAtShoreline++;" release-v2300/world-v2300-water.js
          grep -Fq "api.flowSegmentsRejectedAltitude++;" release-v2300/world-v2300-water.js
          grep -Fq "api.flowSegmentsRejectedLong++;" release-v2300/world-v2300-water.js
          grep -Fq "api.surfaceHeightOutliersCorrected++;" release-v2300/world-v2300-water.js
          grep -Fq "const MAX_CUSTOM_INLAND_WATER_SURFACE_ELEVATION_M = 250;" release-v2300/world-v2300-water.js
          grep -Fq "api.waterLevelsRejectedByShoreline++;" release-v2300/world-v2300-water.js
          grep -Fq "api.surfaceCellsRejectedElevation++;" release-v2300/world-v2300-water.js
          grep -Fq "dFdx(v_wave)" release-v2300/world-v2300-water.js
          grep -Fq "float glancingGlint = pow(" release-v2300/world-v2300-water.js
          grep -Fq "sourceLevel !== null && sourceLevel >= -MAX_VALID_MARINE_SURFACE_OFFSET_M" release-v2300/world-v2300-water.js
          grep -Fq "clamp(0.15 + shimmer * 0.13, 0.15, 0.32)" release-v2300/world-v2300-water.js
          grep -Fq "world-v2300-water.js?v=6114-specular-wave-shading" rebuild-v5000/app.js
          grep -Fq "world-v2300-water.js?v=6114-specular-wave-shading" rebuild-v5000/landing.js
          grep -Fq "landing.js?v=6114-specular-wave-shading" rebuild-v5000/index.html
          grep -Fq "app.js?v=6114-specular-wave-shading" rebuild-v5000/app-index.html
          grep -Fq "cp release-v2300/world-v2300-water.js site/world-v2300-water.js" .github/workflows/deploy-intelligence-rebuild-v5000.yml
          grep -Fq "cp release-v2300/world-v2300-water.js site/app/world-v2300-water.js" .github/workflows/deploy-intelligence-rebuild-v5000.yml

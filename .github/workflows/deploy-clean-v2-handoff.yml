name: Deploy BridgePoint Clean V2 Handoff

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-clean-v2-handoff.yml'
      - 'handoff/clean-v2/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy-clean-v2:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      EXPECTED_SOURCE: f0931d0363ecc72fd471c9065ec7c9eb9e41c1f3
      EXPECTED_ARCHIVE_SHA: 29ee7b7cdc652915ec6d08ec668c77cb78c680938ea7b3b5f418f9efc3412b13
      RELEASE_URL: https://xdfsjztwgsbmabshzsjw.supabase.co/storage/v1/object/public/bridgepoint-release-handoff/clean-v2-f0931d0363ecc72fd471c9065ec7c9eb9e41c1f3.tar.gz
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify private-source Clean V2 release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bridgepoint-v2-delta /tmp/bridgepoint-v2-delta.tar.gz
          mkdir -p /tmp/bridgepoint-v2-delta
          curl -fsSL --retry 6 --retry-delay 2 -H 'Cache-Control: no-cache' "$RELEASE_URL" -o /tmp/bridgepoint-v2-delta.tar.gz
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, os, tarfile
          archive_path=Path('/tmp/bridgepoint-v2-delta.tar.gz')
          archive=archive_path.read_bytes()
          actual=hashlib.sha256(archive).hexdigest()
          expected=os.environ['EXPECTED_ARCHIVE_SHA']
          if actual != expected: raise SystemExit(f'Release SHA mismatch: {actual} != {expected}')
          target=Path('/tmp/bridgepoint-v2-delta')
          with tarfile.open(archive_path,'r:gz') as tf:
              base=target.resolve()
              for member in tf.getmembers():
                  resolved=(target/member.name).resolve()
                  if not str(resolved).startswith(str(base)): raise SystemExit('Unsafe archive path')
              tf.extractall(target)
          required=['index.html','main.dart.js','flutter_bootstrap.js','manifest.json','bridgepoint-v2-release.json','bridgepoint-release.json','public-promotion-v682.json','assets/assets/brand/bridgepoint-mark-v80.svg']
          missing=[p for p in required if not (target/p).is_file()]
          if missing: raise SystemExit('Release missing: '+', '.join(missing))
          release=json.loads((target/'bridgepoint-v2-release.json').read_text())
          if release.get('architecture')!='clean-v2': raise SystemExit('Clean V2 marker missing')
          if release.get('version')!=os.environ['EXPECTED_SOURCE']: raise SystemExit('Downloaded release source SHA mismatch')
          for flag in ['restored_product_surfaces','progressive_national_map','saved_alerts_restored']:
              if release.get(flag) is not True: raise SystemExit(f'{flag} marker missing')
          print(json.dumps({'source_sha':release['version'],'archive_bytes':len(archive),'archive_sha256':actual},indent=2))
          PY

      - name: Assemble durable public site with restored Clean V2 app
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site && mkdir site
          git archive --format=tar origin/live-artifact | tar -xf - -C site
          test -s site/index.html
          test -d site/app/assets
          test -d site/app/canvaskit
          test -d site/app/icons
          cp -a /tmp/bridgepoint-v2-delta/. site/app/
          touch site/.nojekyll site/app/.nojekyll
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          expected=os.environ['EXPECTED_SOURCE']
          release=json.loads(Path('site/app/bridgepoint-v2-release.json').read_text())
          compat=json.loads(Path('site/app/bridgepoint-release.json').read_text())
          promotion=json.loads(Path('site/app/public-promotion-v682.json').read_text())
          if release.get('version')!=expected or release.get('architecture')!='clean-v2': raise SystemExit('Release mismatch')
          for flag in ['restored_product_surfaces','progressive_national_map','saved_alerts_restored']:
              if release.get(flag) is not True: raise SystemExit(f'{flag} marker missing')
          if compat.get('version')!=expected or promotion.get('compiled_source_sha')!=expected: raise SystemExit('Promotion/source mismatch')
          if promotion.get('source_repo_private') is not True: raise SystemExit('Private source provenance missing')
          actual=hashlib.sha256(Path('site/app/main.dart.js').read_bytes()).hexdigest()
          if actual!=promotion.get('main_js_sha256'): raise SystemExit('Compiled JS digest mismatch')
          index=Path('site/app/index.html').read_text(encoding='utf-8',errors='ignore')
          if '<base href="/app/">' not in index or 'Install BridgePoint' not in index: raise SystemExit('App host contract missing')
          if 'bp-expansion-launcher' in index: raise SystemExit('Legacy overlay leaked')
          if not Path('site/app/assets/assets/brand/bridgepoint-mark-v80.svg').is_file(): raise SystemExit('Brand mark missing')
          if not Path('site/app/canvaskit/canvaskit.wasm').is_file(): raise SystemExit('CanvasKit runtime missing')
          print('Saved & Alerts restored public site contract verified for '+expected)
          PY

      - name: Persist exact durable live-artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/final-live && mkdir /tmp/final-live
          cp -a site/. /tmp/final-live/
          cd /tmp/final-live
          git init -q
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m "Publish restored BridgePoint Clean V2 app ${EXPECTED_SOURCE}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact

      - name: Read existing Pages configuration
        uses: actions/configure-pages@v5
      - name: Upload durable Clean V2 site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy restored Clean V2
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public restored Clean V2 app
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://bridgepointintelligence.online'
          for attempt in $(seq 1 24); do
            marker="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/bridgepoint-v2-release.json?verify=${EXPECTED_SOURCE}" 2>/dev/null || true)"
            app="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/?verify=${EXPECTED_SOURCE}" 2>/dev/null || true)"
            brand_code="$(curl -sS -o /tmp/bp-brand.svg -w '%{http_code}' --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/assets/assets/brand/bridgepoint-mark-v80.svg?verify=${EXPECTED_SOURCE}" 2>/dev/null || true)"
            root="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/?verify=${EXPECTED_SOURCE}" 2>/dev/null || true)"
            if printf '%s' "$marker" | grep -q "$EXPECTED_SOURCE" && printf '%s' "$marker" | grep -q 'saved_alerts_restored' && printf '%s' "$app" | grep -q 'flutter_bootstrap.js' && [ "$brand_code" = '200' ] && grep -q 'BridgePoint Intelligence B and destination mark' /tmp/bp-brand.svg && [ "${#root}" -gt 200 ]; then
              echo "Saved & Alerts restored BridgePoint V2 verified live at ${ORIGIN}/app/"
              exit 0
            fi
            sleep 10
          done
          echo 'Public restored Clean V2 marker did not converge.' >&2
          exit 1

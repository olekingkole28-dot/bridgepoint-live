name: Publish BridgePoint Manhattan textured architecture V4
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-manhattan-textured-architecture-v4.yml']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore exact successful Manhattan source geometry V3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/45663279664 --jq '.conclusion')" = success
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/baseline"
            mkdir -p "$RUNNER_TEMP/baseline"
            if timeout 180s gh run download 45663279664 --repo "$GITHUB_REPOSITORY" --name bridgepoint-v5000-1 --dir "$RUNNER_TEMP/baseline" && test -s "$RUNNER_TEMP/baseline/artifact.tar"; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Bake facade maps and geometry details
        run: |
          set -euo pipefail
          export SITE="$RUNNER_TEMP/horizon-site"
          mkdir -p "$SITE"
          tar -xf "$RUNNER_TEMP/baseline/artifact.tar" -C "$SITE"
          for p in index.html app/index.html bridgepoint-auto-reality-v1.js world-v2300-water.js; do
            curl --retry 3 --retry-all-errors --max-time 40 -fsSL -H 'Cache-Control: no-cache' "https://bridgepointintelligence.online/$p?baseline=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/current"
            cmp "$SITE/$p" "$RUNNER_TEMP/current"
          done
          python3 -m pip install --quiet numpy pillow
          python3 - <<'PY'
          import os, json, struct, math, hashlib, re, io, random
          from pathlib import Path
          import numpy as np
          from PIL import Image,ImageDraw
          site=Path(os.environ['SITE']); scan='bridgepoint-auto-reality-v1.js'
          folder='assets/manhattan-photogrammetry-v1/'
          asset=folder+'textured-architecture-v4.glb';info=folder+'textured-architecture-v4.json'
          allowed={scan,'index.html','app/index.html',asset,info}
          def snap():
              return {p.relative_to(site).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in site.rglob('*') if p.is_file() and p.relative_to(site).as_posix() not in allowed}
          before=snap()
          raw=(site/(folder+'source-architecture-v3.glb')).read_bytes()
          jlen=struct.unpack_from('<I',raw,12)[0];doc=json.loads(raw[20:20+jlen]);blob=raw[28+jlen:]
          prim=doc['meshes'][0]['primitives'][0]
          def read(i):
              a=doc['accessors'][i];v=doc['bufferViews'][a['bufferView']]
              dims={'SCALAR':1,'VEC2':2,'VEC3':3,'VEC4':4}[a['type']]
              return np.frombuffer(blob,dtype={5126:'<f4',5125:'<u4'}[a['componentType']],count=a['count']*dims,offset=v.get('byteOffset',0)+a.get('byteOffset',0)).reshape(-1,dims)
          P=read(prim['attributes']['POSITION']);C=read(prim['attributes']['COLOR_0']);U=read(prim['attributes']['TEXCOORD_0']);D=read(prim['attributes']['_BPDETAIL']);I=read(prim['indices']).reshape(-1,3)
          assert len(P)>10000 and len(I)>5000
          # Rebuild into material batches with real UVs, normals and physically separated
          # base/storefront, wall and roof surfaces. Source vertex coordinates remain fixed.
          groups={};rng=np.random.default_rng(20261125)
          def group(k):
              return groups.setdefault(k,[[],[],[],[]])
          def emit(k,p,u,c,normal=None):
              p=np.asarray(p,dtype=float);u=np.asarray(u,dtype=float);c=np.asarray(c,dtype=float)
              if normal is None:normal=np.cross(p[1]-p[0],p[2]-p[0]);normal=normal/max(1e-9,np.linalg.norm(normal))
              g=group(k);g[0].extend(p);g[1].extend(u);g[2].extend(c);g[3].extend([normal]*3)
          def quad(k,p,uv,col,normal=None):
              for ix in [(0,1,2),(0,2,3)]:emit(k,[p[i] for i in ix],[uv[i] for i in ix],[col]*3,normal)
          def box(k,center,size,col):
              x,y,z=center;a,b,c=np.array(size)/2
              v=[(x-a,y-b,z-c),(x+a,y-b,z-c),(x+a,y+b,z-c),(x-a,y+b,z-c),(x-a,y-b,z+c),(x+a,y-b,z+c),(x+a,y+b,z+c),(x-a,y+b,z+c)]
              for ix in [(0,3,2,1),(4,5,6,7),(0,4,7,3),(1,2,6,5),(3,7,6,2),(0,1,5,4)]:quad(k,[v[i] for i in ix],[(0,0),(1,0),(1,1),(0,1)],col)
          def family(style):
              return 'glass' if style in (3,11) else 'brick' if style in (0,1,2,5,7,12) else 'stone' if style in (4,8,9) else 'metal' if style in (13,14,15) else 'loft'
          roof_centers=[];wall_count=0;roof_count=0;door_count=0;trim_count=0
          # Existing face indices encode two triangles for every wall in adjacent order.
          # Detect those pairs explicitly and split at the recorded base height.
          i=0
          while i<len(I):
              tri=I[i];p=P[tri];d=D[tri[0]];k=family(int(round(float(d[0]))))
              tint=np.clip(.60+.40*np.sqrt(np.clip(C[tri[0]],0,1)),.60,1.)
              if np.ptp(p[:,1])<.0005:
                  normal=np.array([0.,1.,0.]);tri=tri if np.cross(p[1]-p[0],p[2]-p[0])[1]>0 else tri[[0,2,1]]
                  emit('roof',P[tri],P[tri][:,[0,2]]/8.,[tint]*3,normal)
                  area=abs(np.cross(p[1]-p[0],p[2]-p[0])[1])*.5
                  if area>24 and p[0,1]-d[3]>8:roof_centers.append((p.mean(0),area))
                  roof_count+=1;i+=1;continue

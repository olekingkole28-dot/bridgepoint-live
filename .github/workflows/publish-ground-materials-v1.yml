           const dx=px-x-CELL/2,dy=py-y-CELL/2,lx=ee.x*dx+nn.x*dy,lz=ee.z*dx+nn.z*dy,ly=z-base+.016,angle=hash(ix,iy+5)*Math.PI*2,h=.09+hash(ix+9,iy)*.16,w=.022+hash(ix,iy-9)*.025;

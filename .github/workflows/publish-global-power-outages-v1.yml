# Publish only the global power-outage layer over the latest successful BridgePoint production snapshot.
name: Publish BridgePoint Global Power Outages v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-global-power-outages-v1.yml'
      - 'rebuild-v5000/bridgepoint-power-outages-v1.js'
      - 'rebuild-v5000/index.html'
      - 'rebuild-v5000/app-index.html'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-v5000-global-power-outages-v1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Wait for a same-commit full-site build
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          sleep 8
          RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" --jq '.workflow_runs[] | select(.path == ".github/workflows/deploy-intelligence-rebuild-v5000.yml") | .id' | head -n 1 || true)"
          if [ -z "$RUN_ID" ]; then
            echo "No same-commit full-site build is registered; using the latest successful production snapshot."
          else
            echo "Waiting for full-site build run $RUN_ID."
            while true; do
              STATUS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.status')"
              CONCLUSION="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.conclusion // ""')"
              if [ "$STATUS" = "completed" ]; then
                echo "FULL_SITE_BUILD_FINISHED run=$RUN_ID conclusion=$CONCLUSION"
                break
              fi
              sleep 15
            done
          fi

          echo "Waiting for other main-branch production publishers to finish."
          shopt -s nocasematch
          while true; do
            ACTIVE_RUNS="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&status=in_progress&per_page=100" --jq '.workflow_runs[] | [.id,.name,.path] | @tsv')"
            QUEUED_RUNS="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&status=queued&per_page=100" --jq '.workflow_runs[] | [.id,.name,.path] | @tsv')"
            WAITING_ID=""
            WAITING_NAME=""
            while IFS=$'\t' read -r other_id other_name other_path; do
              [ -n "$other_id" ] || continue
              [ "$other_id" = "$GITHUB_RUN_ID" ] && continue
              if [[ "$other_name $other_path" == *publish* || "$other_name $other_path" == *deploy* ]]; then
                WAITING_ID="$other_id"
                WAITING_NAME="$other_name"
                break
              fi
            done <<< "$ACTIVE_RUNS"
            if [ -z "$WAITING_ID" ]; then
              while IFS=$'\t' read -r other_id other_name other_path; do
                [ -n "$other_id" ] || continue
                [ "$other_id" = "$GITHUB_RUN_ID" ] && continue
                if [[ "$other_name $other_path" == *publish* || "$other_name $other_path" == *deploy* ]]; then
                  WAITING_ID="$other_id"
                  WAITING_NAME="$other_name"
                  break
                fi
              done <<< "$QUEUED_RUNS"
            fi
            [ -z "$WAITING_ID" ] && break
            echo "WAITING_FOR_PRODUCTION_PUBLISH run=$WAITING_ID name=$WAITING_NAME"
            sleep 15
          done

      - name: Resolve the latest successful prior production snapshot
        id: baseline
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          # This is the site snapshot serving when this outage request began.
          # Keep this task's final overlay rooted in that deployment, not in sibling
          # feature publishers that were triggered by the shared source HTML edits.
          TASK_BASELINE_ID='44976601756'
          TASK_BASELINE_ARTIFACT='bridgepoint-v5000-2'
          TASK_PUBLISH_STEP="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TASK_BASELINE_ID/jobs?per_page=100" --jq '[.jobs[] | .steps[]? | select(.name == "Publish the preserved production snapshot") | .conclusion][0] // ""' 2>/dev/null || true)"
          TASK_ARTIFACT="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TASK_BASELINE_ID/artifacts" --jq ".artifacts[]? | select((.expired|not) and .name == \"$TASK_BASELINE_ARTIFACT\") | .name" 2>/dev/null | head -n 1 || true)"
          if [ "$TASK_PUBLISH_STEP" = "success" ] && [ "$TASK_ARTIFACT" = "$TASK_BASELINE_ARTIFACT" ]; then
            echo "run_id=$TASK_BASELINE_ID" >> "$GITHUB_OUTPUT"
            echo "artifact_name=$TASK_BASELINE_ARTIFACT" >> "$GITHUB_OUTPUT"
            echo "TASK_START_DEPLOYED_BASELINE run=$TASK_BASELINE_ID artifact=$TASK_BASELINE_ARTIFACT"
            exit 0
          fi
          RUNS="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=100" --jq '.workflow_runs[] | [.id,.head_sha,(.conclusion // "")] | @tsv')"
          BASELINE_ID=""
          ARTIFACT=""
          while IFS=$'\t' read -r run_id head_sha conclusion; do
            [ -n "$run_id" ] || continue
            [ "$head_sha" = "$GITHUB_SHA" ] && continue
            if [ "$conclusion" != "success" ]; then
              deployed="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" --jq '[.jobs[] | .steps[]? | select(.name == "Publish the preserved production snapshot" and .conclusion == "success")] | length' 2>/dev/null || echo 0)"
              [ "${deployed:-0}" -gt 0 ] || continue
            fi
            candidate="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" --jq '.artifacts[]? | select((.expired|not) and (.name | startswith("bridgepoint-v5000-"))) | .name' | head -n 1 || true)"
            if [ -n "$candidate" ]; then
              BASELINE_ID="$run_id"
              ARTIFACT="$candidate"
              break
            fi
          done <<< "$RUNS"
          test -n "$BASELINE_ID"
          test -n "$ARTIFACT"
          echo "run_id=$BASELINE_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "PRESERVED_DEPLOYED_BASELINE run=$BASELINE_ID artifact=$ARTIFACT"

      - name: Download the production snapshot
        uses: actions/download-artifact@v4
        with:
          name: "${{ steps.baseline.outputs.artifact_name }}"
          run-id: "${{ steps.baseline.outputs.run_id }}"
          repository: "${{ github.repository }}"
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          path: "${{ runner.temp }}/bp-pages-baseline"

      - name: Restore production and fingerprint non-target files
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find "$RUNNER_TEMP/bp-pages-baseline" -type f -name artifact.tar -print -quit)"
          test -n "$ARCHIVE"
          SITE="$RUNNER_TEMP/bp-site"
          mkdir -p "$SITE"
          tar -xf "$ARCHIVE" -C "$SITE"
          test -s "$SITE/index.html"
          test -s "$SITE/app/index.html"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          site=Path(os.environ['RUNNER_TEMP'])/'bp-site'
          targets={'index.html','app/index.html','bridgepoint-power-outages-v1.js','bp-power-outages-seed-v1.json'}
          def digest(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return h.hexdigest()
          before={}
          for path in sorted(site.rglob('*')):
              if not path.is_file(): continue
              rel=path.relative_to(site).as_posix()
              if rel not in targets: before[rel]=digest(path)
          tmp=Path(os.environ['RUNNER_TEMP'])
          (tmp/'bp-power-outages-preservation-before.json').write_text(json.dumps(before,sort_keys=True))
          print('NON_TARGET_PRODUCTION_FILES_FINGERPRINTED',len(before))
          PY

      - name: Build instant outage markers from live feeds
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures, datetime, json, os, time
          from pathlib import Path
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          root='https://ornl.opendatasoft.com/api/explore/v2.1/catalog/datasets/odin-real-time-outages-county/records'
          powercut='https://powercut.io/api/now.json'
          select='cause,communitydescriptor,metersaffected,reportedstarttime,statuskind,estimatedrestorationtime,causekind,incident_cause,name,utility_id,county,state,geom,geo_point_2d,centroid'
          headers={'Accept':'application/json','User-Agent':'BridgePoint-PowerOutages/1.0'}
          def fetch_json(url):
              error=None
              for attempt in range(3):
                  try:
                      with urlopen(Request(url,headers=headers),timeout=30) as response:
                          return json.loads(response.read().decode('utf-8'))
                  except Exception as exc:
                      error=exc
                      if attempt<2: time.sleep(attempt+1)
              raise error

          def geometry_of(row):
              value=row.get('geom')
              if isinstance(value,str):
                  try: value=json.loads(value)
                  except Exception: return None
              if isinstance(value,dict) and value.get('type')=='Feature': return value.get('geometry')
              if isinstance(value,dict) and isinstance(value.get('geometry'),dict): return value['geometry']
              return value if isinstance(value,dict) else None

          def point_of(row,geometry):
              for value in (row.get('geo_point_2d'),row.get('centroid')):
                  if isinstance(value,dict):
                      lon=value.get('lon',value.get('longitude'))
                      lat=value.get('lat',value.get('latitude'))
                      if lon is not None and lat is not None: return [float(lon),float(lat)]
                      value=value.get('coordinates')
                  if isinstance(value,list) and len(value)>=2:
                      try: return [float(value[0]),float(value[1])]
                      except (TypeError,ValueError): pass
              pairs=[]
              def visit(value):
                  if not isinstance(value,list): return
                  if len(value)>=2 and not isinstance(value[0],(list,dict)):
                      try: pairs.append((float(value[0]),float(value[1])));return
                      except (TypeError,ValueError): pass
                  for child in value: visit(child)
              if geometry: visit(geometry.get('coordinates'))
              if not pairs: return None
              return [(min(p[0] for p in pairs)+max(p[0] for p in pairs))/2,
                      (min(p[1] for p in pairs)+max(p[1] for p in pairs))/2]

          params={'limit':'100','offset':'0','select':select}
          first=fetch_json(root+'?'+urlencode(params))
          total=min(int(first.get('total_count') or len(first.get('results') or [])),1500)
          offsets=list(range(100,total,100))
          rows=list(first.get('results') or [])
          failures=[]
          def fetch_page(offset):
              query=urlencode({'limit':'100','offset':str(offset),'select':select})
              return offset,fetch_json(root+'?'+query)
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              futures=[pool.submit(fetch_page,offset) for offset in offsets]
              for future in concurrent.futures.as_completed(futures):
                  try:
                      _,page=future.result()
                      rows.extend(page.get('results') or [])
                  except Exception as exc:
                      failures.append(str(exc))
          if not rows: raise SystemExit('ODIN returned no outage rows; preserving current deployment.')
          now=datetime.datetime.now(datetime.timezone.utc).isoformat()
          grouped={}
          for row in rows:
              try: affected=max(0,int(float(row.get('metersaffected') or 0)))
              except (TypeError,ValueError): affected=0
              geometry=geometry_of(row)
              point=point_of(row,geometry)
              if affected<=0 or not point: continue
              fips=str(row.get('communitydescriptor') or '').strip()
              key=fips or str(row.get('state') or '')+':'+str(row.get('county') or '')
              group=grouped.get(key)
              cause=str(row.get('incident_cause') or row.get('cause') or row.get('causekind') or '').strip()
              utility=str(row.get('name') or row.get('utility_id') or '').strip()
              start=str(row.get('reportedstarttime') or '').strip()
              etr=''
              raw_etr=row.get('estimatedrestorationtime')
              try:
                  parsed=json.loads(raw_etr) if isinstance(raw_etr,str) else raw_etr
                  if isinstance(parsed,dict): etr=str(parsed.get('ert') or parsed.get('estimatedRestorationTime') or parsed.get('time') or '')
              except Exception: pass
              if group:
                  group['customers']+=affected
                  group['events']+=1
                  if cause and cause not in group['causes']: group['causes'].append(cause)
                  if utility and utility not in group['utilities']: group['utilities'].append(utility)
                  if start and (not group['start'] or start<group['start']): group['start']=start
                  if etr and not group['etr']: group['etr']=etr
              else:
                  grouped[key]={'key':key,'fips':fips,'county':str(row.get('county') or 'Unknown county'),
                      'state':str(row.get('state') or 'United States'),'customers':affected,'events':1,
                      'causes':[cause] if cause else [],'utilities':[utility] if utility else [],
                      'start':start,'etr':etr,'point':point,'status':str(row.get('statuskind') or 'Reported')}

          features=[]
          for group in grouped.values():
              amount=group['customers']
              level='major' if amount>=10000 else ('moderate' if amount>=1000 else 'minor')
              props={'eventId':'us:'+group['key'],'title':group['county']+', '+group['state'],'kind':'county',
                  'severity':level,'customers':amount,'events':group['events'],'county':group['county'],
                  'state':group['state'],'fips':group['fips'],'causes':'; '.join(group['causes']),
                  'utilities':'; '.join(group['utilities']),'start':group['start'],'etr':group['etr'],
                  'status':group['status'],'source':'Oak Ridge National Laboratory · U.S. DOE ODIN',
                  'sourceUrl':'https://ornl.opendatasoft.com/explore/assets/odin-real-time-outages-county/',
                  'license':'OpenEnergyDataPortal public dataset; credit Oak Ridge National Laboratory and U.S. Census Bureau',
                  'checked':now}
              features.append({'type':'Feature','id':props['eventId'],'geometry':{'type':'Point','coordinates':group['point']},'properties':props})

          def allowed_license(value):
              text=str(value or '').strip().lower()
              return ('cc by 4.0' in text or text=='nged open data licence' or
                  text=='northern powergrid open data licence v1.0' or
                  'open government data license, version 1.0' in text)
          international=[]
          try:
              body=fetch_json(powercut)
              sources={source.get('id'):source for source in body.get('sources',[])}
              for report in body.get('outages',[]):
                  if report.get('kind')!='unplanned': continue
                  source=sources.get(report.get('source'))
                  if not source or not source.get('enabled') or not source.get('ok') or source.get('stale') or not allowed_license(source.get('licence')): continue
                  try: lon,lat=float(report.get('lon')),float(report.get('lat'))
                  except (TypeError,ValueError): continue
                  if abs(lon)>180 or abs(lat)>90: continue
                  customers=int(float(report.get('customers') or 0))
                  level='major' if customers>=10000 else ('moderate' if customers>=1000 else 'minor')
                  event_id='world:'+str(report.get('id') or str(report.get('source'))+':'+str(lat)+':'+str(lon))
                  props={'eventId':event_id,'title':str(report.get('place') or report.get('area') or source.get('name') or 'Reported outage'),
                      'kind':'point','severity':level,'customers':customers,'events':1,
                      'country':str(report.get('country') or source.get('country') or ''),
                      'area':str(report.get('area') or ''),'cause':str(report.get('cause') or ''),
                      'start':str(report.get('start') or ''),'etr':str(report.get('etr') or ''),
                      'status':'Unplanned · operator reported','utility':str(report.get('operator') or source.get('operators') or source.get('name') or ''),
                      'source':str(source.get('name') or source.get('operators') or 'Grid operator'),
                      'sourceUrl':str(source.get('homepage') or ''),'sourceLicense':str(source.get('licence') or ''),
                      'checked':str(source.get('fetchedAt') or body.get('generatedAt') or now)}
                  international.append({'type':'Feature','id':event_id,'geometry':{'type':'Point','coordinates':[lon,lat]},'properties':props})
          except Exception as exc:
              print('INTERNATIONAL_SEED_UNAVAILABLE',str(exc)[:300])

          output={'countyMarkers':{'type':'FeatureCollection','features':features},
              'globalPoints':{'type':'FeatureCollection','features':international},
              'generatedAt':now,'counts':{'counties':len(features),'reports':len(international)}}
          if not features: raise SystemExit('ODIN data had no mappable outage markers; preserving current deployment.')
          site=Path(os.environ['RUNNER_TEMP'])/'bp-site'
          (site/'bp-power-outages-seed-v1.json').write_text(json.dumps(output,separators=(',',':')),encoding='utf-8')
          print('INSTANT_OUTAGE_MARKER_SEED_READY',len(features),'U.S. markers',len(international),'international markers')
          if failures: print('ODIN_PARTIAL_PAGE_WARNINGS',len(failures),str(failures[:3]))
          PY

      - name: Overlay the live power-outage layer and its loaders
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/bp-site"
          mkdir -p "$SITE/app"
          cp rebuild-v5000/bridgepoint-power-outages-v1.js "$SITE/bridgepoint-power-outages-v1.js"
          python3 - <<'PY'
          import re,os
          from pathlib import Path
          site=Path(os.environ['RUNNER_TEMP'])/'bp-site'
          tag='<script type="application/x-bridgepoint-deferred" data-bp-deferred-src="/bridgepoint-power-outages-v1.js?v=6526-global-power-outages-v2" data-bp-deferred-kind="classic"></script>'
          priority="  'bridgepoint-power-outages-v1.js',\n"
          view_priority="  'bridgepoint-view-v5917.js',\n"
          pattern=re.compile(r'<script type="application/x-bridgepoint-deferred" data-bp-deferred-src="/bridgepoint-power-outages-v1\.js[^"]*" data-bp-deferred-kind="classic"></script>',re.I)
          view_pattern=re.compile(r'<script type="application/x-bridgepoint-deferred" data-bp-deferred-src="/bridgepoint-view-v5917\.js[^"]*" data-bp-deferred-kind="classic"></script>',re.I)
          for rel in ('index.html','app/index.html'):
              path=site/rel
              html=path.read_text(encoding='utf-8')
              html=pattern.sub('',html)
              match=view_pattern.search(html)
              if not match: raise SystemExit(rel+' is missing the BridgePoint command dock loader')
              html=html[:match.end()]+'\n'+tag+html[match.end():]
              if priority not in html:
                  if html.count(view_priority)!=1: raise SystemExit(rel+' is missing exactly one command dock priority entry')
                  html=html.replace(view_priority,view_priority+priority,1)
              if html.count(tag)!=1 or html.count(priority)!=1:
                  raise SystemExit(rel+' outage module loader is missing or duplicated')
              path.write_text(html,encoding='utf-8')
          for rel in ('rebuild-v5000/index.html','rebuild-v5000/app-index.html'):
              html=Path(rel).read_text(encoding='utf-8')
              if not re.search(r'data-bp-deferred-src="/bridgepoint-power-outages-v1\.js[^"]*"',html) or priority not in html:
                  raise SystemExit(rel+' source loader or priority entry is missing')
          print('POWER_OUTAGES_ROOT_AND_APP_LOADERS_PASS')
          PY
          node --check rebuild-v5000/bridgepoint-power-outages-v1.js

      - name: Verify no non-target production files changed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          site=Path(os.environ['RUNNER_TEMP'])/'bp-site'
          tmp=Path(os.environ['RUNNER_TEMP'])
          before=json.loads((tmp/'bp-power-outages-preservation-before.json').read_text())
          targets={'index.html','app/index.html','bridgepoint-power-outages-v1.js','bp-power-outages-seed-v1.json'}
          def digest(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return h.hexdigest()
          after={}
          for path in sorted(site.rglob('*')):
              if not path.is_file(): continue
              rel=path.relative_to(site).as_posix()
              if rel not in targets: after[rel]=digest(path)
          if before != after:
              raise SystemExit('UNRELATED_PRODUCTION_FILE_CHANGE '+json.dumps({
                'missing':sorted(set(before)-set(after))[:20],
                'added':sorted(set(after)-set(before))[:20],
                'changed':sorted(k for k in before.keys() & after.keys() if before[k]!=after[k])[:20]}))
          print('NON_TARGET_PRODUCTION_FILES_BYTE_FOR_BYTE_PRESERVED',len(before))
          PY

      - uses: actions/configure-pages@v5

      - name: Upload the preserved production snapshot with power outages
        uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-v5000-${{ github.run_attempt }}
          path: "${{ runner.temp }}/bp-site"
          include-hidden-files: true

      - name: Publish the preserved production snapshot
        id: deployment
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: node scripts/deploy-pages-extended.mjs

      - name: Verify the outage layer is live on root and app
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://bridgepointintelligence.online'
          DIR="$RUNNER_TEMP/bp-power-outages-live"
          mkdir -p "$DIR"
          TAG='bridgepoint-power-outages-v1.js?v=6526-global-power-outages-v2'
          for attempt in $(seq 1 18); do
            nonce="$GITHUB_SHA-power-outages-$attempt"
            curl --max-time 30 -fsSL -H 'Cache-Control: no-cache' "$ORIGIN/?verify=$nonce" -o "$DIR/root.html" || true
            curl --max-time 30 -fsSL -H 'Cache-Control: no-cache' "$ORIGIN/app/?verify=$nonce" -o "$DIR/app.html" || true
            if grep -Fq "$TAG" "$DIR/root.html" && grep -Fq "$TAG" "$DIR/app.html"; then
              echo "LIVE_ROOT_AND_APP_LOADERS_READY attempt=$attempt"
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo 'Power outage loader did not become live on both routes' >&2
              exit 1
            fi
            sleep 5
          done
          curl --retry 5 --retry-all-errors --retry-delay 2 --max-time 35 -fsSL -H 'Cache-Control: no-cache' "$ORIGIN/bridgepoint-power-outages-v1.js?v=6526-global-power-outages-v2&verify=$GITHUB_SHA" -o "$DIR/power.js"
          curl --retry 5 --retry-all-errors --retry-delay 2 --max-time 35 -fsSL -H 'Cache-Control: no-cache' "$ORIGIN/bp-power-outages-seed-v1.json?v=6526-global-power-outages-v2&verify=$GITHUB_SHA" -o "$DIR/seed.json"
          python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["countyMarkers"]["features"]; print("LIVE_INSTANT_OUTAGE_MARKERS",len(d["countyMarkers"]["features"]))' "$DIR/seed.json"
          grep -Fq 'bp-global-outage-counties-v1' "$DIR/power.js"
          grep -Fq 'https://ornl.opendatasoft.com/api/explore/v2.1/catalog/datasets/odin-real-time-outages-county/records' "$DIR/power.js"
          grep -Fq 'https://powercut.io/api/now.json' "$DIR/power.js"
          grep -Fq 'Coverage follows participating public reporting feeds' "$DIR/power.js"
          echo 'GLOBAL_POWER_OUTAGE_LAYER_LIVE_ROOT_AND_APP'


            curl --retry 1 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/terminal/?v5551=${q}" -o /tmp/terminal.html || true
            curl --retry 1 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/newsroom/?v5551=${q}" -o /tmp/newsroom.html || true
            if grep -Fq 'BP_LANDING_V5410' /tmp/root.html && grep -Fq 'landing.js?v=5580' /tmp/root.html && grep -Fq '/walkthrough-v5537.js?v=5564' /tmp/root.html && grep -Fq 'authModal' /tmp/root.html && grep -Fq '153,532,480' /tmp/root.html && grep -Fq '143,787,840' /tmp/root.html && grep -Fq 'app.js?v=5583' /tmp/app.html && grep -Fq '/walkthrough-v5537.js?v=5564' /tmp/app.html && grep -Fq 'BP_FRONTEND_V5000' /tmp/app.html && grep -Fq 'toggleLiveContext' /tmp/app.html && grep -Fq 'data-nosnippet' /tmp/app.html && grep -Fq '__BP_APP_BUILD_VERSION__=5371' /tmp/app.js && grep -Fq '__BP_WORLD_RENDER_VERSION__=5561' /tmp/world-v2300-map.js && grep -Fq '__BP_WALKTHROUGH_V5539__' /tmp/walkthrough-v5537.js && grep -Fq '__BP_PARCEL_BOUNDARY_VIEWER_V5577__' /tmp/parcel-boundary-viewer-v5403.js && grep -Fq 'parcel-boundary-viewer-v5403.js?v=5577' /tmp/root.html && grep -Fq 'parcel-boundary-viewer-v5403.js?v=5577' /tmp/app.html && grep -Fq 'bridgepoint_frontend_status_v5000' /tmp/app.js && grep -Fq 'bindPerformanceGovernor' /tmp/app.js && grep -Fq 'bridgepoint_public_weather_bootstrap_v5512' /tmp/app.js && grep -Fq 'BridgePoint Intelligence pricing' /tmp/pricing.html && grep -Fq 'Canonical: https://bridgepointintelligence.online/.well-known/security.txt' /tmp/security.txt && grep -Fq '169,664,739' /tmp/terminal.html && ! grep -Eq 'live-(chileno|chicken-coop|lucas|thunder-creek|0505n|0584-cottonwood|0587-shingle|0611-green-mountain)' /tmp/newsroom.html; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
          grep -Fq 'BRIDGEPOINT' /tmp/root.html
          ! grep -Eiq 'HORIZON|battle pass|zombie|game mode' /tmp/root.html
          q="${GITHUB_SHA}-surface-check-$(date +%s)"
          test "$(curl -sS -o /dev/null -w '%{http_code}' "${O}/owner/command/?owner-route-check=${q}")" = "404"

name: Deploy BridgePoint Live + Research

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-tracking-v421.yml
      - articles/**
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore durable audited BridgePoint V422 build
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site
          mkdir -p site
          git archive --format=tar origin/live-artifact | tar -xf - -C site
          touch site/.nojekyll
          test -s site/index.html
          test -s site/main.dart.js
          test -s site/acquisition_tracker.js
          test -s site/bridgepoint-release.json
          grep -q '2e111cc765d23533e2adf953b44a5578201a0790' site/bridgepoint-release.json
          grep -q 'https://bridgepointintelligence.online/' site/bridgepoint-release.json
          grep -q 'acquisition_tracker.js' site/index.html
          grep -q "send('LANDING_VIEW'" site/acquisition_tracker.js
          if grep -q 'service_role' site/acquisition_tracker.js; then
            echo 'Forbidden privileged credential marker found in browser tracker.' >&2
            exit 1
          fi

      - name: Overlay BridgePoint research hub
        run: |
          set -euo pipefail
          test -d articles
          rm -rf site/articles
          cp -a articles site/articles
          test -s site/articles/index.html
          test -s site/articles/feed.xml
          test -s site/articles/why-a-storm-map-is-not-a-damage-map.md
          test -s site/articles/why-property-matching-is-the-hidden-failure-point-in-property-ai.md
          test -s site/articles/connecticut-roofing-opportunity-brief-2026-08-21.md
          echo 'BridgePoint research hub overlaid onto audited production artifact.'

      - name: Refresh durable live artifact branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/live-artifact
          mkdir /tmp/live-artifact
          cp -a site/. /tmp/live-artifact/
          cd /tmp/live-artifact
          git init
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m 'BridgePoint live artifact with V421 tracking and research hub'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish BridgePoint
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record verified V421/V422 + research deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          receipt={
            'status':'PUBLISHED',
            'base_release_sha':'2e111cc765d23533e2adf953b44a5578201a0790',
            'tracking_version':421,
            'owner_funnel_version':422,
            'capture':'FIRST_PARTY_BROWSER',
            'research_hub':'/articles/',
            'research_feed':'/articles/feed.xml',
            'deployed_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'public_origin':'https://bridgepointintelligence.online/',
            'pages_url':os.environ.get('PAGE_URL'),
            'durable_artifact_branch':'live-artifact',
            'events':['LANDING_VIEW','SIGNUP_VIEW','SIGNUP_SUBMIT','PRICING_VIEW','SAMPLE_REQUEST','CHECKOUT_START'],
            'contains_privileged_secret':False
          }
          open('tracking-release-status.json','w',encoding='utf-8').write(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tracking-release-status.json
          git commit -m 'Record live research-hub deployment [skip ci]' || true
          git push origin HEAD:main

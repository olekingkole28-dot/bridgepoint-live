              const next=new T.Group();for(const part of geometry.parts){const inst=new T.InstancedMesh(part.geometry,part.material,cells.length);inst.frustumCulled=false;next.add(inst);}next.dispose=()=>{for(const inst of next.children)inst.dispose()};
              let count=0,equiv=0,minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;const tileHeights=new Map();
              for(const p of cells){
                const tile=Math.floor(p.x/4)+':'+Math.floor(p.y/4);
                if(!tileHeights.has(tile)){const v=map.queryTerrainElevation?.([p.lng,p.lat],{exaggerated:true});tileHeights.set(tile,Number.isFinite(v)?v:centerHeight)}
                const altitude=z>=14?(map.queryTerrainElevation?.([p.lng,p.lat],{exaggerated:true})??tileHeights.get(tile)):tileHeights.get(tile);
                const raw=map.transform?.getMatrixForModel?.([p.lng,p.lat],altitude);if(!raw)continue;

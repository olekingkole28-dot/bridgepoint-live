name: Recover Stalled BridgePoint Pages Deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-stalled-pages-deploy.yml'

permissions:
  actions: write
  contents: read

# Separate from the production group so the recovery can release a stuck build.
concurrency:
  group: bridgepoint-pages-stalled-deployment-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Stop only the obsolete full-site build using an invalid artifact source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          API='https://api.github.com'
          STUCK_RUN_ID='42381754668'
          code="$(curl -sS -o /tmp/run-cancel.json -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${API}/repos/${REPO}/actions/runs/${STUCK_RUN_ID}/force-cancel")"
          echo "OBSOLETE_BUILD_FORCE_CANCEL_HTTP=${code}"
          if [[ "${code}" != '202' && "${code}" != '204' ]]; then
            cat /tmp/run-cancel.json || true
            exit 1
          fi
          echo 'OBSOLETE_TREE_REBUILD_CANCELLED'

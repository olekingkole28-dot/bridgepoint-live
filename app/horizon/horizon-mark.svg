<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">BridgePoint Horizon survival mark</title>
  <desc id="desc">A dark red survival-game icon with a ruined H skyline, infected silhouettes, and an ember horizon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080706"/>
      <stop offset=".52" stop-color="#170806"/>
      <stop offset="1" stop-color="#2A0A05"/>
    </linearGradient>
    <radialGradient id="ember" cx="50%" cy="43%" r="46%">
      <stop offset="0" stop-color="#FF6A16"/>
      <stop offset=".34" stop-color="#D92A0A"/>
      <stop offset=".72" stop-color="#551008" stop-opacity=".72"/>
      <stop offset="1" stop-color="#120806" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5E7D4"/>
      <stop offset=".46" stop-color="#B9A18D"/>
      <stop offset=".52" stop-color="#7E685A"/>
      <stop offset="1" stop-color="#E7D2B9"/>
    </linearGradient>
    <filter id="redGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".72"/>
    </filter>
    <clipPath id="tile"><rect x="72" y="72" width="880" height="880" rx="220"/></clipPath>
  </defs>

  <rect x="72" y="72" width="880" height="880" rx="220" fill="#050505"/>
  <g clip-path="url(#tile)">
    <rect x="72" y="72" width="880" height="880" fill="url(#bg)"/>
    <circle cx="520" cy="430" r="310" fill="url(#ember)"/>
    <ellipse cx="520" cy="460" rx="245" ry="245" fill="none" stroke="#E83512" stroke-width="20" opacity=".42"/>
    <ellipse cx="520" cy="460" rx="210" ry="210" fill="none" stroke="#FF5A18" stroke-width="6" opacity=".48"/>

    <g opacity=".55" fill="#120907">
      <path d="M72 695 144 632 214 658 276 590 341 617 417 558 494 609 555 540 636 597 704 526 775 586 840 535 952 618 952 952 72 952Z"/>
      <path d="M72 739 132 698 192 716 259 655 334 684 410 624 483 667 555 606 633 655 705 599 781 648 850 606 952 681 952 952 72 952Z" opacity=".7"/>

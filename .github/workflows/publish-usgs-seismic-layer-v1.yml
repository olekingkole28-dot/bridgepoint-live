name: Publish BridgePoint Named Earthquake Impact Ripples V2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-usgs-seismic-layer-v1.yml'
      - 'release-v2300/world-v2300-seismic-layer-v1.js'
      - 'rebuild-v5000/app.js'
      - 'rebuild-v5000/landing.js'
      - 'tests/seismic-layer-v1.test.mjs'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the latest successful production Pages artifact
        id: baseline
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }"
        run: |
          set -euo pipefail
          RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=success&branch=main&per_page=100" --jq '.workflow_runs | map(select(.conclusion == "success")) | .[].id')"
          BASELINE_ID=""
          ARTIFACT=""
          for run_id in $RUNS; do
            candidate="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
              --jq '.artifacts[]? | select((.expired|not) and (.name | startswith("bridgepoint-v5000-"))) | .name' | head -n 1 || true)"
            if [ -n "$candidate" ]; then
              BASELINE_ID="$run_id"
              ARTIFACT="$candidate"
              break
            fi
          done
          test -n "$BASELINE_ID"
          test -n "$ARTIFACT"
          echo "run_id=$BASELINE_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "CURRENT_PRODUCTION_BASELINE run=$BASELINE_ID artifact=$ARTIFACT"

      - name: Download the current production snapshot
        uses: actions/download-artifact@v4
        with:
          name: "${{ steps.baseline.outputs.artifact_name }"
          run-id: "${{ steps.baseline.outputs.run_id }"
          repository: "${{ github.repository }"
          github-token: "${{ secrets.GITHUB_TOKEN }"
          path: "${{ runner.temp }/bp-pages-baseline"

      - name: Restore current production and fingerprint every non-target file
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find "$RUNNER_TEMP/bp-pages-baseline" -type f -name artifact.tar -print -quit)"
          test -n "$ARCHIVE"
          SITE="$RUNNER_TEMP/bp-site"
          mkdir -p "$SITE"
          tar -xf "$ARCHIVE" -C "$SITE"
          for f in index.html app/index.html landing.js app.js \
                   bridgepoint-app-space-explorer-v1.js bridgepoint-welcome-space-v6260.js \
                   bridgepoint-gaia-galaxy-v6270.js bridgepoint-saturn-system-v6282.js \
                   bridgepoint-mars-system-v6291.js world-v2300-clouds.js app/world-v2300-clouds.js \
                   assets/moon/v1/manifest.json assets/moon/v1/moon-global-height-4ppd-u16.png \
                   world-v2300-seismic-layer-v1.js app/world-v2300-seismic-layer-v1.js \
                   bridgepoint-lighthouses-v1.js bridgepoint-underground-mines-v1.js \
                   bridgepoint-underground-transit-v1.js bridgepoint-underground-infrastructure-v1.js; do
            test -s "$SITE/$f" || { echo "Latest production artifact missing required preserved file: $f"; exit 1; }
          done
          test -s "$SITE/world-v2300-seismic-layer-v1.js"
          test -s "$SITE/app/world-v2300-seismic-layer-v1.js"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          site=Path(os.environ["RUNNER_TEMP"])/"bp-site"
          excluded={"index.html","app/index.html","landing.js","app.js",
                    "world-v2300-seismic-layer-v1.js","app/world-v2300-seismic-layer-v1.js"}
          def digest(path):
              h=hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""): h.update(chunk)
              return h.hexdigest()
          before={}
          targets={}
          for p in sorted(site.rglob("*")):
              if not p.is_file(): continue
              rel=p.relative_to(site).as_posix()
              if rel in excluded:
                  if rel in {"index.html","app/index.html","landing.js","app.js","world-v2300-seismic-layer-v1.js","app/world-v2300-seismic-layer-v1.js"}:
                      targets[rel]=digest(p)
                  continue
              before[rel]=digest(p)
          if set(targets)!={"index.html","app/index.html","landing.js","app.js","world-v2300-seismic-layer-v1.js","app/world-v2300-seismic-layer-v1.js"}:
              raise SystemExit("Production target entry files incomplete: "+repr(sorted(targets)))
          tmp=Path(os.environ["RUNNER_TEMP"])
          (tmp/"bp-seismic-preservation-before.json").write_text(json.dumps(before,sort_keys=True))
          (tmp/"bp-seismic-target-before.json").write_text(json.dumps(targets,sort_keys=True))
          print("LATEST_PRODUCTION_BASELINE_FILES_FINGERPRINTED",len(before))
          print("LATEST_PRODUCTION_TARGET_ENTRIES",len(targets))
          PY

      - name: Overlay only the seismic impact renderer
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/bp-site"
          cp release-v2300/world-v2300-seismic-layer-v1.js "$SITE/world-v2300-seismic-layer-v1.js"
          cp release-v2300/world-v2300-seismic-layer-v1.js "$SITE/app/world-v2300-seismic-layer-v1.js"
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          site=Path(os.environ["RUNNER_TEMP"])/"bp-site"
          build="named-earthquake-ripples-v2"
          module="world-v2300-seismic-layer-v1.js?v=2-terrain-impact-ripples"
          for rel,expected in (("landing.js",2),("app.js",1)):
              path=site/rel
              text=path.read_text(encoding="utf-8")
              updated,count=re.subn(r'(world-v2300-seismic-layer-v1\.js\?v=)[^\'"\s]+',
                                    r'\g<1>2-terrain-impact-ripples',text)
              if count!=expected:
                  raise SystemExit(f"{rel}: expected {expected} seismic imports, found {count}")
              path.write_text(updated,encoding="utf-8")
          def replace_once(rel,pattern,replacement,label):
              path=site/rel
              text=path.read_text(encoding="utf-8")
              updated,count=re.subn(pattern,replacement,text,count=1)
              if count!=1: raise SystemExit(f"{rel}: {label} expected once, found {count}")
              path.write_text(updated,encoding="utf-8")
          replace_once("index.html",
              r'((?:\./|/)?landing\.js\?v=)[^&"\'\s]+',
              r'\g<1>'+build,"homepage script cache key")
          replace_once("app/index.html",
              r'((?:\.\./|/)?app\.js\?v=)[^&"\'\s]+',
              r'\g<1>'+build,"app script cache key")
          for rel,count in (("landing.js",2),("app.js",1)):
              text=(site/rel).read_text(encoding="utf-8")
              if text.count(module)!=count or "window.__BP_USGS_SEISMIC_LAYER_V1__=m.initUSGSSeismicLayer(world)" not in text:
                  raise SystemExit(f"{rel}: seismic imports or runtime attach missing")
          for rel,entry in (("index.html","landing.js"),("app/index.html","app.js")):
              text=(site/rel).read_text(encoding="utf-8")
              if build not in text or entry not in text:
                  raise SystemExit(f"{rel}: entry cache key missing")
          print("SEISMIC_ENTRYPOINT_OVERLAY_PASS")
          PY

      - name: Run source normalization, integration, and syntax tests
        shell: bash
        run: |
          set -euo pipefail
          node tests/seismic-layer-v1.test.mjs
          node --input-type=module --check < release-v2300/world-v2300-seismic-layer-v1.js
          node --check "$RUNNER_TEMP/bp-site/landing.js"
          node --check "$RUNNER_TEMP/bp-site/app.js"
          cmp -s "$RUNNER_TEMP/bp-site/world-v2300-seismic-layer-v1.js" "$RUNNER_TEMP/bp-site/app/world-v2300-seismic-layer-v1.js"
          grep -Fq 'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_week.geojson' "$RUNNER_TEMP/bp-site/world-v2300-seismic-layer-v1.js"
          grep -Fq 'state.enabled = next' "$RUNNER_TEMP/bp-site/world-v2300-seismic-layer-v1.js"
          grep -Fq 'M2.5+ · PAST 7 DAYS · SOURCE OFF' "$RUNNER_TEMP/bp-site/world-v2300-seismic-layer-v1.js"
          echo "BRIDGEPOINT_SEISMIC_SOURCE_AND_RENDERER_PASS"

      - name: Verify the public USGS feed when the upstream endpoint is reachable
        shell: bash
        run: |
          set -euo pipefail
          FEED="$RUNNER_TEMP/usgs-2.5-week.geojson"
          if curl --retry 3 --retry-all-errors --retry-delay 2 --max-time 25 -fsSL \
            -H 'Accept: application/geo+json, application/json' \
            'https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_week.geojson' -o "$FEED"; then
            python3 - "$FEED" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d.get("type")=="FeatureCollection"
          assert isinstance(d.get("features"),list)
          assert isinstance(d.get("metadata"),dict)
          for f in d["features"]:
              assert f.get("geometry",{}).get("type")=="Point"
          print("LIVE_USGS_GEOJSON_FEED_PASS",len(d["features"]))
          PY
          else
            echo "USGS endpoint was temporarily unreachable during build; layer remains opt-in and surfaces upstream unavailability without fabricated data."
          fi

      - name: Prove no unrelated production file changed or disappeared
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          site=Path(os.environ["RUNNER_TEMP"])/"bp-site"
          tmp=Path(os.environ["RUNNER_TEMP"])
          before=json.loads((tmp/"bp-seismic-preservation-before.json").read_text())
          target_before=json.loads((tmp/"bp-seismic-target-before.json").read_text())
          excluded={"index.html","app/index.html","landing.js","app.js",
                    "world-v2300-seismic-layer-v1.js","app/world-v2300-seismic-layer-v1.js"}
          def digest(path):
              h=hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""): h.update(chunk)
              return h.hexdigest()
          after={}
          targets={}
          for p in sorted(site.rglob("*")):
              if not p.is_file(): continue
              rel=p.relative_to(site).as_posix()
              if rel in excluded:
                  if rel in excluded: targets[rel]=digest(p)
                  continue
              after[rel]=digest(p)
          if before!=after:
              raise SystemExit("UNRELATED_PRODUCTION_FILE_CHANGE "+json.dumps({
                  "missing":sorted(set(before)-set(after))[:25],
                  "added":sorted(set(after)-set(before))[:25],
                  "changed":sorted(k for k in before.keys() & after.keys() if before[k]!=after[k])[:25]
              }))
          expected_targets=set(target_before)
          if set(targets)!=expected_targets or not all(targets[k]!=target_before[k] for k in expected_targets):
              raise SystemExit("EXPECTED_SEISMIC_TARGET_CHANGE_MISSING")
          for rel in ("world-v2300-seismic-layer-v1.js","app/world-v2300-seismic-layer-v1.js"):
              if not (site/rel).is_file(): raise SystemExit("PUBLISHED_SEISMIC_MODULE_MISSING "+rel)
          if digest(site/"world-v2300-seismic-layer-v1.js")!=digest(site/"app/world-v2300-seismic-layer-v1.js"):
              raise SystemExit("ROOT_APP_SEISMIC_MODULE_MISMATCH")
          print("NON_TARGET_PRODUCTION_FILES_BYTE_FOR_BYTE_PRESERVED",len(before))
          print("ONLY_SIX_EXISTING_SEISMIC_FILES_CHANGED added=0 deleted=0")
          PY

      - uses: actions/configure-pages@v5

      - name: Upload the preserved production site with earthquake ripples
        uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-v5000-${{ github.run_attempt }
          path: "${{ runner.temp }/bp-site"
          include-hidden-files: true

      - name: Publish the preserved production snapshot
        id: deployment
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }"
        run: node scripts/deploy-pages-extended.mjs

      - name: Verify the live earthquake renderer and retained feature set
        shell: bash
        run: |
          set -euo pipefail
          O='https://bridgepointintelligence.online'
          q="$GITHUB_SHA-named-earthquake-ripples-v2"
          D="$RUNNER_TEMP/bp-seismic-live"
          mkdir -p "$D"
          fetch() {
            curl --retry 7 --retry-all-errors --retry-delay 3 --max-time 35 -fsSL \
              -H 'Cache-Control: no-cache' "$O/$1?verify=$q" -o "$D/$2"
          }
          fetch '' root.html
          fetch 'app/' app.html
          fetch 'landing.js' landing.js
          fetch 'app.js' app.js
          fetch 'world-v2300-seismic-layer-v1.js' seismic.js
          fetch 'app/world-v2300-seismic-layer-v1.js' app-seismic.js
          fetch 'bridgepoint-lighthouses-v1.js' lighthouses.js
          fetch 'bridgepoint-underground-mines-v1.js' mines.js
          fetch 'bridgepoint-underground-transit-v1.js' transit.js
          fetch 'bridgepoint-underground-infrastructure-v1.js' infrastructure.js
          grep -Fq 'landing.js?v=named-earthquake-ripples-v2' "$D/root.html"
          grep -Fq 'app.js?v=named-earthquake-ripples-v2' "$D/app.html"
          grep -Fq 'world-v2300-seismic-layer-v1.js?v=2-terrain-impact-ripples' "$D/landing.js"
          grep -Fq 'world-v2300-seismic-layer-v1.js?v=2-terrain-impact-ripples' "$D/app.js"
          grep -Fq 'bp-usgs-seismic-impact-boundary-v1' "$D/seismic.js"
          grep -Fq 'bp-usgs-seismic-ripple-lines-v1' "$D/seismic.js"
          grep -Fq 'Named earthquakes · OFF' "$D/seismic.js"
          cmp -s "$D/seismic.js" "$D/app-seismic.js"
          grep -Fq 'global-pins-v4' "$D/lighthouses.js"
          grep -Fq 'muttental-witten' "$D/mines.js"
          grep -Fq 'futatsugoya-tunnel-japan' "$D/infrastructure.js"
          grep -Fq 'palatine-neronian-cryptoporticus-rome' "$D/infrastructure.js"
          grep -Fq 'usti-pipeline-repair-czechia' "$D/infrastructure.js"
          test -s "$D/transit.js"
          echo "BRIDGEPOINT_NAMED_EARTHQUAKE_IMPACT_RIPPLES_LIVE_PASS"

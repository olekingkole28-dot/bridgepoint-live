name: Publish Map-First V5000 Root

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-map-first-v5000-root.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-artifact
          fetch-depth: 1

      - name: Verify map-first V5000 artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s app/index.html
          test -s app.js
          test -s world-v2300-map.js
          grep -Fq 'bp-public-surface' index.html
          grep -Fq 'BP_PUBLIC_LIVE_TOTALS' index.html
          grep -Fq 'id="liveMap"' index.html
          grep -Fq 'BP_FRONTEND_V5000' index.html
          grep -Fq '__BP_APP_BUILD_VERSION__=5365' app.js
          grep -Fq '__BP_WORLD_RENDER_VERSION__=5365' world-v2300-map.js
          grep -Fqi 'maplibre' index.html
          grep -Fqi 'maplibre' app/index.html
          ! grep -Fqi 'cesium' index.html
          ! grep -Fqi 'cesium' app/index.html
          echo BRIDGEPOINT_MAP_FIRST_V5000_ROOT_VERIFIED

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-map-first-v5000-root
          path: .

      - name: Deploy map-first V5000 root
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: bridgepoint-map-first-v5000-root

      - name: Verify production root and app parity
        shell: bash
        run: |
          set -euo pipefail
          O='https://bridgepointintelligence.online'
          ok=0
          for i in $(seq 1 35); do
            q="${GITHUB_SHA}-${i}-$(date +%s)"
            curl --retry 3 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/?mapfirst=${q}" -o /tmp/root.html || true
            curl --retry 3 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/app/?mapfirst=${q}" -o /tmp/app.html || true
            curl --retry 3 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/app.js?mapfirst=${q}" -o /tmp/app.js || true
            curl --retry 3 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/world-v2300-map.js?mapfirst=${q}" -o /tmp/world.js || true
            if grep -Fq 'bp-public-surface' /tmp/root.html               && grep -Fq 'id="liveMap"' /tmp/root.html               && grep -Fq 'BP_PUBLIC_LIVE_TOTALS' /tmp/root.html               && grep -Fq 'BP_FRONTEND_V5000' /tmp/app.html               && grep -Fq '__BP_APP_BUILD_VERSION__=5365' /tmp/app.js               && grep -Fq '__BP_WORLD_RENDER_VERSION__=5365' /tmp/world.js               && ! grep -Fqi 'cesium' /tmp/root.html; then
              ok=1
              echo BRIDGEPOINT_MAP_FIRST_ROOT_LIVE
              break
            fi
            sleep 4
          done
          test "${ok}" = 1

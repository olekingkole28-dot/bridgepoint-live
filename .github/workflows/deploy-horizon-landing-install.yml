name: Deploy Horizon Landing Install

on:
  push:
    branches: [main]
    paths:
      - 'app/horizon/index.html'
      - 'app/horizon/lobby.html'
      - 'app/horizon/manifest.webmanifest'
      - 'app/horizon/horizon-mark.svg'
      - 'app/horizon/sw.js'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-landing-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Overlay only Horizon landing assets onto current production
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site
          mkdir -p site
          git archive --format=tar origin/live-artifact | tar -xf - -C site

          mkdir -p site/app/horizon
          cp app/horizon/index.html site/app/horizon/index.html
          cp app/horizon/lobby.html site/app/horizon/lobby.html
          cp app/horizon/manifest.webmanifest site/app/horizon/manifest.webmanifest
          cp app/horizon/horizon-mark.svg site/app/horizon/horizon-mark.svg
          cp app/horizon/sw.js site/app/horizon/sw.js
          touch site/.nojekyll site/app/.nojekyll

      - name: Validate Horizon install landing without touching playable
        shell: bash
        run: |
          set -euo pipefail
          test -s site/app/horizon/index.html
          test -s site/app/horizon/lobby.html
          test -s site/app/horizon/manifest.webmanifest
          test -s site/app/horizon/horizon-mark.svg
          test -s site/app/horizon/sw.js
          test -s site/app/horizon/preview.html
          test -s site/app/horizon-playable/horizon-world.js
          grep -Fq 'id="installAppPrompt"' site/app/horizon/index.html
          grep -Fq 'beforeinstallprompt' site/app/horizon/index.html
          grep -Fq 'id="game-modes"' site/app/horizon/index.html
          grep -Fq './lobby.html?mode=year_one_survival' site/app/horizon/index.html
          grep -Fq './lobby.html?mode=infinite_tdm' site/app/horizon/index.html
          grep -Fq './lobby.html?mode=outbreak_raid' site/app/horizon/index.html
          grep -Fq 'YEAR ONE SURVIVAL' site/app/horizon/index.html
          grep -Fq 'INFINITE TEAM DEATHMATCH' site/app/horizon/index.html
          grep -Fq 'OUTBREAK RAID' site/app/horizon/index.html
          ! grep -Fq 'ENTER THE CONTINUOUS HORIZON WORLD' site/app/horizon/index.html
          grep -Fq "u.searchParams.set('mode',mode)" site/app/horizon/lobby.html
          grep -Fq 'bridgepoint-horizon-survivor-v3050' site/app/horizon/lobby.html
          grep -Fq '"display": "standalone"' site/app/horizon/manifest.webmanifest
          grep -Fq '"id": "/app/horizon/"' site/app/horizon/manifest.webmanifest
          grep -Fq '"sizes": "192x192"' site/app/horizon/manifest.webmanifest
          grep -Fq '"sizes": "512x512"' site/app/horizon/manifest.webmanifest
          grep -Fq '"prefer_related_applications": false' site/app/horizon/manifest.webmanifest
          ! grep -Fq '/app/intelligence-launch/' site/app/horizon/index.html

      - name: Save durable live artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bp-horizon-landing-live
          mkdir -p /tmp/bp-horizon-landing-live
          cp -a site/. /tmp/bp-horizon-landing-live/
          cd /tmp/bp-horizon-landing-live
          git init -q
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m "Publish Horizon landing install surface ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify custom domain
        shell: bash
        run: |
          set -euo pipefail
          O='https://bridgepointintelligence.online/app/horizon/'
          ok=0
          for i in $(seq 1 30); do
            q="${GITHUB_SHA}-${i}-$(date +%s)"
            rm -f /tmp/h
            curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${O}?v=${q}" -o /tmp/h 2>/dev/null || true
            if grep -Fq 'id="installAppPrompt"' /tmp/h 2>/dev/null \
              && grep -Fq 'beforeinstallprompt' /tmp/h 2>/dev/null \
              && grep -Fq 'id="game-modes"' /tmp/h 2>/dev/null \
              && grep -Fq './lobby.html?mode=year_one_survival' /tmp/h 2>/dev/null \
              && grep -Fq './lobby.html?mode=infinite_tdm' /tmp/h 2>/dev/null \
              && grep -Fq './lobby.html?mode=outbreak_raid' /tmp/h 2>/dev/null \
              && grep -Fq 'YEAR ONE SURVIVAL' /tmp/h 2>/dev/null \
              && grep -Fq 'INFINITE TEAM DEATHMATCH' /tmp/h 2>/dev/null \
              && grep -Fq 'OUTBREAK RAID' /tmp/h 2>/dev/null \
              && ! grep -Fq 'ENTER THE CONTINUOUS HORIZON WORLD' /tmp/h 2>/dev/null \
              && ! grep -Fq '/app/intelligence-launch/' /tmp/h 2>/dev/null; then
              ok=1
              echo 'HORIZON_LANDING_INSTALL_LIVE'
              break
            fi
            sleep 4
          done
          test "${ok}" = 1

          lobby_ok=0
          for mode in year_one_survival infinite_tdm outbreak_raid; do
            rm -f /tmp/lobby
            curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "https://bridgepointintelligence.online/app/horizon/lobby.html?mode=${mode}&v=${GITHUB_SHA}" -o /tmp/lobby
            grep -Fq 'HORIZON LOBBY' /tmp/lobby
            grep -Fq "u.searchParams.set('mode',mode)" /tmp/lobby
            grep -Fq "${mode}" site/app/horizon/index.html
          done
          lobby_ok=1
          test "${lobby_ok}" = 1

              t=ground/height;ag=a+(e-a)*t;bg=b+(c-b)*t
              # Explicit ground-floor door/storefront maps are not repeated up the tower.
              quad('entry_'+k,[a,ag,bg,b],[(0,0),(0,1),(max(1,bays/3),1),(max(1,bays/3),0)],tint,n)
              door_count+=1
              if t<.999:quad(k,[ag,e,c,bg],[(0,0),(0,(floors*(1-t))/4),(bays/4,(floors*(1-t))/4),(bays/4,0)],tint,n)
              # Project a narrow cornice/spandrel off masonry walls. Geometry is bounded:
              # roof edge plus a single base band rather than millions of window meshes.
              if length>3 and height>8:
                  outset=.12 if k=='glass' else .24
                  for y in [ground,height-.32]:
                      if y+.2>height:continue
                      A=a+(e-a)*(y/height);B=b+(c-b)*(y/height)
                      q=[A+n*outset,A+n*outset+np.array([0,.18,0]),B+n*outset+np.array([0,.18,0]),B+n*outset]
                      quad('trim',q,[(0,0),(0,1),(length/4,1),(length/4,0)],tint*.90,n)
                      trim_count+=1

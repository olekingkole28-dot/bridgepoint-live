name: Publish BridgePoint Timeline Footer Only V1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-timeline-footer-v1.yml']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download exact successful aircraft restoration release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/45465311611 --jq '.conclusion')" = success
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/baseline"
            mkdir -p "$RUNNER_TEMP/baseline"
            if timeout 150s gh run download 45465311611 --repo "$GITHUB_REPOSITORY" --name bridgepoint-v5000-1 --dir "$RUNNER_TEMP/baseline" && test -s "$RUNNER_TEMP/baseline/artifact.tar"; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Move only the timeline into the scrolling card footer
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/wind-site"
          mkdir -p "$SITE"
          tar -xf "$RUNNER_TEMP/baseline/artifact.tar" -C "$SITE"
          export SITE
          python3 - <<'PY'
          import os,re,hashlib
          from pathlib import Path
          site=Path(os.environ['SITE']);name='bridgepoint-bottom-card-mobile-v2.js'
          allowed={name,'index.html','app/index.html'}
          def snap():return {p.relative_to(site).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in site.rglob('*') if p.is_file() and p.relative_to(site).as_posix() not in allowed}
          before=snap()
          p=site/name;s=p.read_text()
          def one(a,b):
              global s
              assert s.count(a)==1,('TIMELINE_LAYOUT_ANCHOR',a,s.count(a))
              s=s.replace(a,b,1)
          one("playback=node('div','bpv-v2-playback');dock.insertBefore(playback,actions);","playback=node('div','bpv-v2-playback');")
          one("attachTo('bpv-more-info',content);","attachTo('bpv-more-info',content);\n content.appendChild(playback);\n // Keep the original timeline and its handlers, below all feature buttons.\n let timelineRequestedUntil=0;\n actions.addEventListener('click',e=>{if(e.target.closest('[data-bpv-action=\"worldchanges\"]')){timelineRequestedUntil=Date.now()+5000;requestAnimationFrame(()=>{if(playback.firstElementChild){content.scrollTop=content.scrollHeight;timelineRequestedUntil=0;}});}},true);\n const timelineWatch=new MutationObserver(()=>{if(timelineRequestedUntil>Date.now()&&playback.firstElementChild){content.scrollTop=content.scrollHeight;timelineRequestedUntil=0;}});\n timelineWatch.observe(playback,{childList:true,subtree:true});")
          p.write_text(s)
          for rel in ('index.html','app/index.html'):
              p=site/rel;old=p.read_text()
              new,n=re.subn(r'('+re.escape(name)+r'\?[^"\s]+)',lambda m:m[1]+'&timelinefooter=20261124v1',old)
              assert n>=1,(rel,n)
              assert 'aircraftrestore=20261124v1' in new and 'windbright=20261124v1' in new and 'neo-restore-20261124-v1' in new
              p.write_text(new)
          assert before==snap(),'Unexpected non-timeline-layout asset changed'
          print('TIMELINE_LAYOUT_ONLY_BYTE_PRESERVATION_PASS',len(before))
          PY
          node --check "$SITE/bridgepoint-bottom-card-mobile-v2.js"
      - name: Test mobile timeline below feature buttons and original controls
        run: |
          set -euo pipefail
          TEST="$RUNNER_TEMP/timeline-test"
          mkdir -p "$TEST"
          npm install --prefix "$TEST" --no-audit --no-fund playwright-core@1.56.1
          export BP_SITE="$RUNNER_TEMP/wind-site"
          cat > "$TEST/test.mjs" <<'JS'
          import {chromium} from 'playwright-core';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader']});
          try{
            const page=await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1,isMobile:true,hasTouch:true,serviceWorkers:'block'});
            await page.route('https://bridgepointintelligence.online/**',async route=>{
              const u=new URL(route.request().url()),rel=u.pathname.replace(/^\//,'');
              if(rel===''||rel==='index.html'||rel==='app/'||rel==='app/index.html'||rel.endsWith('bridgepoint-bottom-card-mobile-v2.js')){
                const f=path.join(process.env.BP_SITE,rel===''?'index.html':rel==='app/'?'app/index.html':rel);
                if(fs.existsSync(f))return route.fulfill({status:200,contentType:rel.endsWith('.js')?'text/javascript':'text/html',body:fs.readFileSync(f)});
              }
              return route.continue();
            });
            await page.goto('https://bridgepointintelligence.online/?timeline-footer-verify=20261124v1',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>window.__BP_MOBILE_CARD_V2__?.ready&&document.querySelector('#bpv-v2-content #bpv-dock-actions'),null,{timeout:100000});
            await page.evaluate(()=>{document.querySelector('[data-bpv-v2-tab="property"]').click();document.querySelector('[data-bpv-action="worldchanges"]')?.click()});
            await page.waitForFunction(()=>document.querySelector('#bpv-v2-content #bpv-v2-playback #bp-world-time-slider-v5908'),null,{timeout:90000});
            const result=await page.evaluate(()=>{
              const d=document.getElementById('bpv-dock'),c=document.getElementById('bpv-v2-content'),p=document.getElementById('bpv-v2-playback'),a=document.getElementById('bpv-dock-actions'),t=document.getElementById('bp-world-time-slider-v5908');
              return {parent:p.parentElement.id,afterButtons:!!(a.compareDocumentPosition(p)&Node.DOCUMENT_POSITION_FOLLOWING),directDockChild:p.parentElement===d,range:!!t.querySelector('input[type=range]'),buttons:t.querySelectorAll('button').length,tabs:document.querySelectorAll('[data-bpv-v2-tab]').length,scroll:getComputedStyle(c).overflowY};
            });
            console.log('TIMELINE_FOOTER_MOBILE',JSON.stringify(result));
            assert(result.parent==='bpv-v2-content'&&result.afterButtons&&!result.directDockChild&&result.range&&result.buttons>=3&&result.tabs===5&&result.scroll==='auto');
            await page.evaluate(()=>document.querySelector('[data-bpv-v2-tab="environment"]').click());
            assert(await page.evaluate(()=>document.getElementById('bpv-v2-content').scrollTop===0&&document.getElementById('bpv-v2-playback').parentElement.id==='bpv-v2-content'));
            console.log('TIMELINE_FOOTER_MOBILE_PASS');
          }finally{await browser.close();}
          JS
          node "$TEST/test.mjs"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-v5000-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wind-site
          include-hidden-files: true
      - name: Wait for artifact indexing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "bridgepoint-v5000-'"$GITHUB_RUN_ATTEMPT"'") | .id')
            if [ -n "$ID" ]; then sleep 15; exit 0; fi
            sleep 4
          done
          exit 1
      - name: Publish preserved site
        id: deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deploy-pages-extended.mjs
      - name: Verify live timeline layout and preserved aircraft wind and globe
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/wind-site"
          for p in bridgepoint-bottom-card-mobile-v2.js bridgepoint-aircraft-visuals-v2.js app/bridgepoint-aircraft-visuals-v2.js bridgepoint-view-v5917.js bridgepoint-volumetric-fields-v5978.js app/bridgepoint-volumetric-fields-v5978.js bridgepoint-global-wind-rf-v1.js app/bridgepoint-global-wind-rf-v1.js wind-rf-global-v1.json index.html app/index.html bridgepoint-neo-watch-v1.js bridgepoint-emrf-starlink-global-v2.js bridgepoint-emrf-spectrogram-v1.js world-v2300-water.js bridgepoint-drone-awareness-v1.js bridgepoint-vessel-awareness-v1.js bridgepoint-power-outages-v1.js bridgepoint-wildfire-realistic-mesh-v4.js world-v2300-seismic-layer-v1.js; do
            curl --retry 8 --retry-all-errors --retry-delay 4 --max-time 40 -fsSL -H 'Cache-Control: no-cache' "https://bridgepointintelligence.online/$p?wind=$GITHUB_SHA" -o "$RUNNER_TEMP/wind-live"
            cmp "$SITE/$p" "$RUNNER_TEMP/wind-live"
          done
          echo BRIDGEPOINT_TIMELINE_FOOTER_LIVE_PASS

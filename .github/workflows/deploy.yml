name: Deploy BridgePoint Live

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download verified BridgePoint v265 production build
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-c8f4-822f-b372-28db642635ac/raw?se=2026-08-17T20%3A51%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=96a19672-5bfc-5730-b7e2-4288e1fa3392&skoid=bbd22fc4-f881-4ea4-b2f3-c12033cf6a8b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-17T06%3A31%3A44Z&ske=2026-08-18T06%3A31%3A44Z&sks=b&skv=2026-02-06&sig=oTNk2jA5B7Z/4zAqmaMtYHcxk88plom2D/ty4/2m30o%3D' -o /tmp/bridgepoint-v265.zip
          echo 'd9ae40b29d1ba851a366c01dfcbd35c5b85f06862f954dc3b12ee4a83fa4317f  /tmp/bridgepoint-v265.zip' | sha256sum -c -
          rm -rf site
          mkdir -p site
          unzip -q /tmp/bridgepoint-v265.zip -d site
          test -s site/index.html
          test -s site/main.dart.js
          test -s site/bridgepoint-release.json
          grep -q '0b947b68971852e648a9e0195a1d05992e261f3e' site/bridgepoint-release.json

          # Existing production contract guards.
          grep -q 'PROPERTY HEARTBEAT' site/main.dart.js
          grep -q 'Ask BridgePoint AI' site/main.dart.js
          grep -q 'More BridgePoint tools' site/main.dart.js
          grep -q 'bridgepoint_live_clusters_v250' site/main.dart.js
          grep -q 'Live clusters' site/main.dart.js
          grep -q 'EMERGING' site/main.dart.js
          grep -q 'RECOVERY' site/main.dart.js
          grep -q 'bridgepoint_property_heartbeat_v245' site/main.dart.js
          grep -q 'BridgePoint could not reach the server several times in a row' site/main.dart.js
          grep -q 'bridgepoint-us-storm-clouds-v229' site/main.dart.js
          grep -q 'Automation Recovery' site/main.dart.js

          # Community 3D, section errors, voice and package-aware AI guards.
          grep -q 'bridgepoint_community_3d_buildings_v241' site/main.dart.js
          grep -q 'U.S. 3D BUILDINGS' site/main.dart.js
          grep -q 'BridgePoint Community Chat' site/main.dart.js
          grep -q 'Properties could not load' site/main.dart.js
          grep -q 'BridgePoint AI search could not load' site/main.dart.js
          grep -q 'bridgepoint_ai_answer_v262' site/main.dart.js
          grep -q 'Talk to BridgePoint AI' site/main.dart.js
          grep -q 'Unlock more intelligence' site/main.dart.js
          grep -q 'Ask anything' site/main.dart.js

          # v265 simplified executive Owner Center guards.
          grep -q 'decisions first' site/main.dart.js
          grep -q 'Detailed metrics' site/main.dart.js
          grep -q 'Growth & operations' site/main.dart.js
          grep -q 'Advanced admin' site/main.dart.js
          grep -q 'Owner Center could not load' site/main.dart.js
          grep -q 'critical owner numbers are summarized below' site/main.dart.js

          if grep -q 'Connection looks spotty' site/main.dart.js; then
            echo 'Old noisy connection warning unexpectedly remains user-visible.' >&2
            exit 1
          fi
          echo 'BridgePoint v265 verified production artifact ready for deployment.'
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish BridgePoint
        id: deployment
        uses: actions/deploy-pages@v4
name: Deploy BridgePoint V552 — Dynamic Avatar Heal

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-v552-avatar-heal.yml
  workflow_run:
    workflows:
      - "Deploy BridgePoint Live — Audited V443"
      - "Deploy BridgePoint Experience V550"
      - "Deploy BridgePoint Owner V551"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  heal-avatar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore audited V444 compiled app without losing current site
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          git fetch origin app-artifact-v444:refs/remotes/origin/app-artifact-v444
          rm -rf site /tmp/live /tmp/v444 /tmp/technology
          mkdir -p site /tmp/live /tmp/v444
          git archive --format=tar origin/live-artifact | tar -xf - -C /tmp/live
          git archive --format=tar origin/app-artifact-v444 | tar -xf - -C /tmp/v444
          cp -a /tmp/live/. site/

          # Preserve the newer V550 in-app Technology Center while replacing only
          # the audited compiled Flutter payload that regressed to V443.
          if [ -d site/app/technology ]; then cp -a site/app/technology /tmp/technology; fi
          rm -rf site/app
          mkdir -p site/app
          cp -a /tmp/v444/. site/app/
          if [ -d /tmp/technology ]; then mkdir -p site/app/technology; cp -a /tmp/technology/. site/app/technology/; fi

          test -s site/app/index.html
          test -s site/app/main.dart.js
          test -s site/app/flutter_bootstrap.js
          grep -q 'Open Account & Settings for' site/app/main.dart.js
          grep -q 'Account & Settings' site/app/main.dart.js
          grep -q 'BridgePoint account' site/app/main.dart.js
          grep -q 'display_name' site/app/main.dart.js
          grep -q 'bridgepoint-v443-install-guide-runtime' site/app/index.html
          grep -q '<base href="/app/">' site/app/index.html

          python - <<'PY'
          from pathlib import Path
          p=Path('site/app/index.html')
          s=p.read_text(encoding='utf-8')
          if 'bp-everything-launcher-v550' not in s:
              css='''<style id="bp-everything-style-v550">#bp-everything-launcher-v550{position:fixed;left:14px;bottom:14px;z-index:2147483000;display:flex;align-items:center;gap:7px;padding:10px 13px;border-radius:999px;border:1px solid rgba(71,221,255,.55);background:rgba(7,24,39,.94);box-shadow:0 10px 34px rgba(0,0,0,.35),0 0 24px rgba(71,221,255,.12);color:#f6fbff;text-decoration:none;font:800 12px/1 system-ui,-apple-system,"Segoe UI",sans-serif;backdrop-filter:blur(9px);touch-action:manipulation}#bp-everything-launcher-v550:hover{background:#10314b;border-color:#58e3ff}@media(max-width:620px){#bp-everything-launcher-v550{left:10px;bottom:10px;padding:9px 11px;font-size:11px}}</style>'''
              s=s.replace('</head>',css+'</head>',1)
              s=s.replace('</body>','<a id="bp-everything-launcher-v550" href="/app/technology/" aria-label="Open Everything BridgePoint Technology Center">⚡ Everything BridgePoint</a></body>',1)
          if 'bp-owner-launch-v551' not in s:
              css='''<style id="bp-owner-style-v551">#bp-owner-launch-v551{display:none;position:fixed;right:14px;bottom:14px;z-index:2147483000;align-items:center;gap:7px;padding:10px 13px;border-radius:999px;border:1px solid rgba(188,155,255,.55);background:rgba(30,19,47,.94);box-shadow:0 10px 34px rgba(0,0,0,.35),0 0 24px rgba(188,155,255,.12);color:#f8f4ff;text-decoration:none;font:850 12px/1 system-ui,-apple-system,Segoe UI,sans-serif;backdrop-filter:blur(9px);touch-action:manipulation}#bp-owner-launch-v551.show{display:flex}@media(max-width:620px){#bp-owner-launch-v551{right:10px;bottom:10px;padding:9px 11px;font-size:11px}}</style>'''
              script='''<a id="bp-owner-launch-v551" href="/owner/" aria-label="Open BridgePoint Owner Command Center">◆ Owner Command Center</a><script id="bp-owner-check-v551">(()=>{const B='https://xdfsjztwgsbmabshzsjw.supabase.co',K='sb_publishable_lM9oWQeHjBmgOIiteeOicQ_PTyAeF25';function t(){try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||'';if(k.startsWith('sb-')&&k.endsWith('-auth-token')){const d=JSON.parse(localStorage.getItem(k)||'{}'),x=d?.access_token||d?.currentSession?.access_token||d?.session?.access_token;if(x)return x}}}catch(_){}return''}async function c(){const x=t();if(!x)return;try{const r=await fetch(B+'/rest/v1/rpc/bridgepoint_capability_experience_v550',{method:'POST',headers:{apikey:K,Authorization:'Bearer '+x,'Content-Type':'application/json'},body:JSON.stringify({p_include_all:true})}),d=await r.json();if(r.ok&&d.owner_mode===true)document.getElementById('bp-owner-launch-v551')?.classList.add('show')}catch(_){}}setTimeout(c,1800)})();<\/script>'''
              s=s.replace('</head>',css+'</head>',1)
              s=s.replace('</body>',script+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY

          test -s site/owner/index.html
          test -s site/app/technology/index.html
          grep -q 'bp-everything-launcher-v550' site/app/index.html
          grep -q 'bp-owner-launch-v551' site/app/index.html

          APP_DIGEST="$(find site/app -type f ! -name bridgepoint-release.json -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          export APP_DIGEST
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          now=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          marker={
            'version':552,
            'release':'V552 Dynamic Account Avatar Heal',
            'compiled_app_base_version':444,
            'compiled_app_base_release':'V444 Dynamic Account Avatar',
            'compiled_app_source_sha':'0db7bdb8480cd2ee1874089f0f14815f93b5d0b7',
            'dynamic_profile_initials':True,
            'account_settings_action_compiled':True,
            'v443_mobile_install_runtime_retained':True,
            'v550_technology_overlay_retained':True,
            'v551_owner_overlay_retained':True,
            'artifact_sha256':os.environ['APP_DIGEST'],
            'artifact_digest_scope':'site/app excluding bridgepoint-release.json',
            'published_at':now,
            'customer_domain':'https://bridgepointintelligence.online/',
            'deployment_contract':'Audited V444 compiled Flutter app restored over current durable V551 site; V550 Technology and V551 owner shell overlays retained'
          }
          open('site/app/bridgepoint-release.json','w',encoding='utf-8').write(json.dumps(marker,indent=2)+'\n')
          p='site/tracking-release-status.json'
          try: tracking=json.load(open(p,encoding='utf-8'))
          except Exception: tracking={}
          tracking.update({
            'status':'PUBLISHED',
            'app_release_version':552,
            'compiled_app_base_version':444,
            'dynamic_account_avatar_version':444,
            'owner_command_center_version':551,
            'capability_experience_version':550,
            'assembled_artifact_sha256':marker['artifact_sha256'],
            'deployed_at':now,
            'contains_privileged_secret':False
          })
          open(p,'w',encoding='utf-8').write(json.dumps(tracking,indent=2)+'\n')
          PY
          grep -q '"version": 552' site/app/bridgepoint-release.json
          grep -q '"dynamic_account_avatar_version": 444' site/tracking-release-status.json
          if grep -R -E -i 'SUPABASE_SERVICE_ROLE_KEY|sb_secret|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' site/app/index.html site/app/technology site/owner; then
            echo 'Privileged secret marker found in browser surfaces.' >&2
            exit 1
          fi
          touch site/.nojekyll site/app/.nojekyll

      - name: Persist exact healed live artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/final-live
          mkdir /tmp/final-live
          cp -a site/. /tmp/final-live/
          cd /tmp/final-live
          git init
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m 'BridgePoint live artifact with V552 dynamic avatar heal'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish BridgePoint V552
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public avatar-healed release
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl -fsSL --max-time 20 "https://bridgepointintelligence.online/app/bridgepoint-release.json?t=${GITHUB_RUN_ID}-${attempt}" -o /tmp/live.json && grep -q '"version": 552' /tmp/live.json; then break; fi
            sleep 10
          done
          grep -q '"version": 552' /tmp/live.json
          curl -fsSL --retry 4 --retry-delay 2 "https://bridgepointintelligence.online/app/main.dart.js?t=${GITHUB_RUN_ID}" -o /tmp/main.dart.js
          grep -q 'Open Account & Settings for' /tmp/main.dart.js
          grep -q 'display_name' /tmp/main.dart.js

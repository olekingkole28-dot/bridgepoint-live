name: Promote audited BridgePoint V441 app once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/promote-v441-once.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bridgepoint-v441-artifact-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify exact audited V441 Flutter artifact
        env:
          V441_ARTIFACT_URL: "https://sdmntprwestus.oaiusercontent.com/files/00000000-c2d0-8230-aa1c-129ccd398c55/raw?se=2026-08-22T04%3A01%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=dd52c949-9018-5d66-ab31-5e11a4063e74&skoid=789f404f-91a9-4b2f-932c-c44965c11d82&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-22T00%3A34%3A37Z&ske=2026-08-23T00%3A34%3A37Z&sks=b&skv=2026-02-06&sig=mlL/xslkMcm9AOhFyMxfVrtt9F%2BiJ6HZNXows6UjrkY%3D"
          EXPECTED_ZIP_SHA256: "7e18e90df85526abc7ec001fbd506f72afd8e140b178282347b60e5643848d9c"
          SOURCE_MAIN_SHA: "5f4114197d834adbb368895238188b57940e279c"
          SOURCE_PR_HEAD: "e5e2e6122ab2fb8a65e11bf05de6f75fb58ec5fc"
        run: |
          set -euo pipefail
          rm -rf /tmp/v441 /tmp/v441.zip
          mkdir -p /tmp/v441
          curl --fail --location --retry 3 --retry-delay 2 "$V441_ARTIFACT_URL" -o /tmp/v441.zip
          echo "${EXPECTED_ZIP_SHA256}  /tmp/v441.zip" | sha256sum --check --strict
          unzip -q /tmp/v441.zip -d /tmp/v441
          test -s /tmp/v441/index.html
          test -s /tmp/v441/main.dart.js
          test -s /tmp/v441/flutter_bootstrap.js
          grep -q 'bridgepoint-v441-mobile-install-fallback' /tmp/v441/index.html
          grep -q 'id="bp-install-fallback-v441"' /tmp/v441/index.html
          grep -q 'DOWNLOAD / OPEN APP' /tmp/v441/index.html
          grep -q 'window.location.assign(appUrl)' /tmp/v441/index.html
          grep -q 'mode=signin&utm_source=install_guide' /tmp/v441/index.html
          grep -q 'pointer-events:auto!important' /tmp/v441/index.html
          grep -q 'touch-action:manipulation' /tmp/v441/index.html
          grep -q 'Create account' /tmp/v441/main.dart.js
          grep -q 'Already have an account' /tmp/v441/main.dart.js
          grep -q 'Check your email' /tmp/v441/main.dart.js
          if grep -Eqi 'SUPABASE_SERVICE_ROLE_KEY|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' /tmp/v441/main.dart.js; then
            echo 'Privileged secret marker found in audited browser artifact.' >&2
            exit 1
          fi
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          receipt={
            'version':441,
            'release':'V441 Mobile Install/Open CTA',
            'source_sha':os.environ['SOURCE_MAIN_SHA'],
            'source_build_artifact':'bridgepoint-v441-web.zip',
            'source_pr':55,
            'source_pr_head':os.environ['SOURCE_PR_HEAD'],
            'artifact_sha256':os.environ['EXPECTED_ZIP_SHA256'],
            'published_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'immutable_branch':'app-artifact-v441',
            'customer_domain':'https://bridgepointintelligence.online/',
            'classifier_version':441,
            'deployment_contract':'Exact CI-built V441 Flutter web artifact; mobile install/open fallback verified before publication'
          }
          open('/tmp/v441/bridgepoint-release.json','w',encoding='utf-8').write(json.dumps(receipt,indent=2)+'\n')
          PY
          touch /tmp/v441/.nojekyll
          echo 'Exact audited V441 artifact verified.'

      - name: Persist V441 as immutable app artifact branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd /tmp/v441
          git init
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b app-artifact-v441
          git add -A
          git commit -m 'Persist audited BridgePoint V441 Flutter artifact'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin app-artifact-v441

      - name: Retire one-time promotion workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git rm -f .github/workflows/promote-v441-once.yml
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Retire V441 one-time artifact promotion [skip ci]'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
          done
          exit 1

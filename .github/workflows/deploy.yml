name: Deploy BridgePoint Live

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Download audited BridgePoint v321 production build
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-f840-81fb-915a-f83017cccdf0/raw?se=2026-08-18T21%3A38%3A11Z&sp=r&sv=2026-02-06&sr=b&scid=c333eda0-0fcc-50d0-86ae-506dbae59cae&skoid=a1be202a-6464-476c-a496-723317c4a4db&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-17T22%3A43%3A00Z&ske=2026-08-18T22%3A43%3A00Z&sks=b&skv=2026-02-06&sig=DO2E2bXWzANud2v6gmSQZjyVyjrVBxsjwgsPExIzCXU%3D' -o /tmp/bridgepoint-v321.zip
          echo '63d43c58cf354bfb7de9587caa9d8d848975f36020f6f9fc74a8dae8f83e22b5  /tmp/bridgepoint-v321.zip' | sha256sum -c -
          rm -rf site
          mkdir -p site
          unzip -q /tmp/bridgepoint-v321.zip -d site
          touch site/.nojekyll
          sed -i 's#<base href="/">#<base href="./">#' site/index.html

          test -s site/index.html
          test -s site/main.dart.js
          test -s site/bridgepoint-release.json
          grep -q '1fb4ea469616a76151e8021b0a4db6f716213396' site/bridgepoint-release.json
          grep -q 'https://bridgepointintelligence.online/' site/bridgepoint-release.json

          # PWA/install and established customer contracts must remain present.
          grep -q 'bridgepoint-v310-install-onboarding' site/index.html
          grep -q 'Put BridgePoint on your home screen' site/index.html
          grep -q 'beforeinstallprompt' site/index.html
          grep -q 'Add to Home Screen' site/index.html
          grep -q 'DENSITY HEAT' site/main.dart.js
          grep -q 'BridgePoint Community Chat' site/main.dart.js
          grep -q 'NOAA LIVE RAIN RADAR' site/main.dart.js
          grep -q 'Meet the Owner' site/main.dart.js
          grep -q 'Customer preview' site/main.dart.js
          grep -q 'Investor Room' site/main.dart.js
          grep -q 'Preview package fit' site/main.dart.js

          # V321 expansion/radar/resilience contracts compiled into the audited artifact.
          grep -q 'bridgepoint_public_expansion_status_v321' site/main.dart.js
          grep -q 'Calculating from live throughput' site/main.dart.js
          grep -q 'Queued states show their real queue position' site/main.dart.js
          grep -q 'expansion badges hidden so the radar stays clear' site/main.dart.js
          grep -q 'LIVE SOURCE OUTAGES' site/main.dart.js
          grep -q 'AUTO-DISCOVERY PENDING' site/main.dart.js
          grep -q 'temporarily unavailable' site/main.dart.js

          # Manual-social and customer-safe contracts remain intact.
          if grep -q 'bridgepoint-social-publisher-v120' site/main.dart.js; then
            echo 'Automatic social publisher unexpectedly remains.' >&2
            exit 1
          fi
          if grep -q 'BridgePoint V81 uses negative scoring' site/main.dart.js; then
            echo 'Legacy technical customer wording unexpectedly remains.' >&2
            exit 1
          fi
          echo 'BridgePoint v321 audited expansion ETA + radar + resilience artifact ready for deployment.'

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish BridgePoint
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record verified live deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          release=json.loads(Path('site/bridgepoint-release.json').read_text(encoding='utf-8'))
          receipt={
            'status':'PUBLISHED',
            'release_sha':release['version'],
            'built_at':release.get('built_at'),
            'deployed_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'public_origin':release.get('public_origin'),
            'pages_url':os.environ.get('PAGE_URL'),
            'artifact_sha256':'63d43c58cf354bfb7de9587caa9d8d848975f36020f6f9fc74a8dae8f83e22b5',
            'source_build_repo':'olekingkole28-dot/bridgepoint_data_studio',
            'source_workflow_run_id':32185246471,
            'source_merge_sha':'1fb4ea469616a76151e8021b0a4db6f716213396',
            'merged_v321_sha':'ac97f1810ca6154d6c1f5bbb68c0b11f04e76974',
            'release_label':'BridgePoint v321 expansion ETAs + radar clarity + resilience'
          }
          Path('live-release-status.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(receipt,indent=2))
          PY
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add live-release-status.json
          git commit -m 'Record BridgePoint v321 live deployment [skip ci]'
          git push origin HEAD:main

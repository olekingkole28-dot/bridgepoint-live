            await p.click('[data-opp="0"]');await p.waitForSelector('#inspectProperty',{timeout:5000});await p.click('#inspectProperty');
            await p.waitForFunction(()=>document.querySelector('#propertyAddress')?.textContent.includes('123 Verification St'),{timeout:10000});
            await p.click('#moreButton');
            await p.waitForSelector('[data-bp1998-about]',{timeout:5000});
            const state=await p.evaluate(()=>({address:document.querySelector('#propertyAddress')?.textContent,propertyActive:document.querySelector('[data-surface="property"]')?.classList.contains('active'),hasShare:!!document.querySelector('#bp1998Share'),hasAbout:!!document.querySelector('[data-bp1998-about]'),hasFaq:!!document.querySelector('[data-bp1998-faq]')}));
            assert(state.propertyActive);assert(/123 Verification St/.test(state.address));assert(state.hasShare&&state.hasAbout&&state.hasFaq);console.log('V1998_PHONE_FLOW_PASS');
          }finally{await b.close()}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
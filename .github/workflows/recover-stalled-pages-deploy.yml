name: Recover Stalled BridgePoint Pages Deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-stalled-pages-deploy.yml'

permissions:
  actions: write
  contents: read
  pages: write

# Separate from the production group so this can clear a stale deployment
# that is holding the normal publish queue open.
concurrency:
  group: bridgepoint-pages-stalled-deployment-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only the stalled Pages deployment and its workflow run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          API='https://api.github.com'
          STUCK_RUN_ID='42357545439'
          PAGES_BUILD_VERSION='d7c1b2da2312c5771344c681a19cce98bf4a93ba'

          pages_canceled=0
          for deployment_id in "$PAGES_BUILD_VERSION" '7619048106'; do
            code="$(curl -sS -o /tmp/pages-cancel.json -w '%{http_code}' \
              -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${API}/repos/${REPO}/pages/deployments/${deployment_id}/cancel")"
            echo "PAGES_CANCEL_HTTP=${code} DEPLOYMENT_ID=${deployment_id}"
            if [[ "${code}" == '200' || "${code}" == '202' || "${code}" == '204' ]]; then
              pages_canceled=1
              break
            fi
            cat /tmp/pages-cancel.json || true
          done

          if [[ "${pages_canceled}" != '1' ]]; then
            echo 'Unable to confirm cancellation of the stale Pages deployment; leaving the workflow run untouched.'
            exit 1
          fi

          run_code="$(curl -sS -o /tmp/run-cancel.json -w '%{http_code}' \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${API}/repos/${REPO}/actions/runs/${STUCK_RUN_ID}/force-cancel")"
          echo "STALE_WORKFLOW_FORCE_CANCEL_HTTP=${run_code}"
          if [[ "${run_code}" != '202' && "${run_code}" != '204' ]]; then
            cat /tmp/run-cancel.json || true
            exit 1
          fi

          echo 'STALE_PAGES_DEPLOYMENT_AND_WORKFLOW_CLEARED'

name: BridgePoint viewport-wide 3D forest canopy V5
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-viewport-forest-v5.yml']
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore and verify exact currently published baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/horizon-site"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false and (.name|startswith("bridgepoint-v5000-"))) | [.workflow_run.id,.name] | @tsv' > "$RUNNER_TEMP/candidates"
          cat "$RUNNER_TEMP/candidates"
          found=0
          while IFS=$'\t' read -r run name; do
            if [ "$run" = "$GITHUB_RUN_ID" ]; then continue; fi
            if [ "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" --jq '.conclusion')" != success ]; then continue; fi
            rm -rf "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/horizon-site"
            mkdir -p "$RUNNER_TEMP/baseline" "$RUNNER_TEMP/horizon-site"
            if ! timeout 240s gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "$RUNNER_TEMP/baseline"; then continue; fi
            if ! test -s "$RUNNER_TEMP/baseline/artifact.tar"; then continue; fi
            tar -xf "$RUNNER_TEMP/baseline/artifact.tar" -C "$RUNNER_TEMP/horizon-site"
            same=1
            for p in index.html app/index.html landing.js app.js world-v2300-map.js app/world-v2300-map.js world-v2300-water.js app/world-v2300-water.js bridgepoint-bottom-card-mobile-v2.js bridgepoint-bottom-card-categories-v1.js vendor/bp-nyc-bus-v1.mjs vendor/bp-bus-models-v3.mjs vendor/bp-street-detail-v1.mjs assets/street-detail-v1/manifest.json assets/street-detail-v1/busshelter.glb.gz world-v2300-tree-instanced.js app/world-v2300-tree-instanced.js; do
              if ! curl --retry 2 --retry-all-errors --max-time 35 -fsSL -H 'Cache-Control: no-cache' "https://bridgepointintelligence.online/$p?baseline=$GITHUB_RUN_ID" -o "$RUNNER_TEMP/current" || ! cmp -s "$RUNNER_TEMP/horizon-site/$p" "$RUNNER_TEMP/current"; then same=0; break; fi
            done
            if [ "$same" = 1 ]; then echo "Verified live baseline $run $name"; found=1; break; fi
          done < <(head -15 "$RUNNER_TEMP/candidates")
          test "$found" = 1 || { echo 'No exact current release found; refusing rollback'; exit 1; }
      - name: Install only viewport-wide source-derived forest layer
        run: |
          set -euo pipefail
          export SITE="$RUNNER_TEMP/horizon-site"
          mkdir -p "$SITE/vendor"
          cat > "$SITE/vendor/bp-viewport-forest-v5.mjs" <<'JS'
          import {loadStreetGLTF,normalizedBounds} from '/vendor/bp-street-detail-v1.mjs';
          const ID='bp-viewport-forest-v5',R=6378137,C=2*Math.PI*R,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
          const X=lng=>(lng+180)/360,Y=lat=>(1-Math.asinh(Math.tan(clamp(lat,-85.051128,85.051128)*Math.PI/180))/Math.PI)/2;
          const lon=x=>x*360-180,lat=y=>Math.atan(Math.sinh(Math.PI*(1-2*y)))*180/Math.PI;
          const wrap=x=>((x%1)+1)%1,near=(x,c)=>x+Math.round(c-x);
          const hash=(x,y)=>{let a=(Math.imul(x,73856093)^Math.imul(y,19349663))>>>0;a=Math.imul(a^(a>>>16),0x45d9f3b)>>>0;return a/4294967296};
          // Rasterize the actual mapped forest polygons, including interior holes.
          // Grid is geographic and deterministic, never centered on a circular camera radius.
          export function forestGrid(features,bounds,zoom,budget){
            const c=X(bounds.center),w=near(X(bounds.west),c),raw=near(X(bounds.east),c);
            let a=w,b=raw;if(b<a)b+=1;if(b-a>.75){a=c-.375;b=c+.375}
            const n=Y(bounds.north),s=Y(bounds.south);if(!(b>a&&s>n))return{cells:[],step:0};
            let level=clamp(Math.floor(zoom)+7,10,23),size=2**level;
            while((Math.ceil((b-a)*size)+5)*(Math.ceil((s-n)*size)+5)>budget*1.3&&size>128)size/=2;
            const x0=Math.floor(a*size)-2,x1=Math.ceil(b*size)+2,y0=Math.max(0,Math.floor(n*size)-2),y1=Math.min(size,Math.ceil(s*size)+2);
            const width=x1-x0,height=y1-y0;if(width*height>budget*3)return{cells:[],step:1/size};
            const mask=new Uint8Array(width*height);
            for(const f of features){
              const p=f.properties||{},k=String(p.class||p.subclass||p.landuse||p.natural||'').toLowerCase();
              if(!['forest','wood','woodland','tree_cover'].includes(k))continue;
              const polys=f.geometry?.type==='Polygon'?[f.geometry.coordinates]:f.geometry?.type==='MultiPolygon'?f.geometry.coordinates:[];
              for(const poly of polys){
                const rings=poly.filter(q=>q.length>=4).map(q=>q.map(p=>[near(X(p[0]),c)*size,Y(p[1])*size]));
                if(!rings.length)continue;
                const outer=rings[0];let ymin=Infinity,ymax=-Infinity;for(const v of outer){ymin=Math.min(ymin,v[1]);ymax=Math.max(ymax,v[1]);}
                const lo=Math.max(y0,Math.floor(ymin)),hi=Math.min(y1,Math.ceil(ymax));
                for(let y=lo;y<hi;y++){
                  const yy=y+.5,edges=[];
                  for(const ring of rings)for(let j=0,i=ring.length-1;j<ring.length;i=j++){
                    const A=ring[i],B=ring[j];if((A[1]>yy)!==(B[1]>yy))edges.push(A[0]+(B[0]-A[0])*(yy-A[1])/(B[1]-A[1]));
                  }
                  edges.sort((a,b)=>a-b);
                  for(let j=0;j+1<edges.length;j+=2){
                    const from=Math.max(x0,Math.ceil(edges[j]-.5)),to=Math.min(x1,Math.ceil(edges[j+1]-.5));
                    if(to>from)mask.fill(1,(y-y0)*width+from-x0,(y-y0)*width+to-x0);

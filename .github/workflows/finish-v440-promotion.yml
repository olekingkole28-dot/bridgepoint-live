name: Finish BridgePoint V440 live artifact promotion

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finish-v440-promotion.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bridgepoint-v440-final-promotion
  cancel-in-progress: false

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Point the existing live release at the durable audited V440 artifact
        run: |
          set -euo pipefail
          git fetch origin app-artifact-v440:refs/remotes/origin/app-artifact-v440
          test -s <(git show origin/app-artifact-v440:index.html)
          git show origin/app-artifact-v440:bridgepoint-release.json | grep -q '4b80bbdc1137ce7b7d3fc26f69fa5077c5c8566a'
          git show origin/app-artifact-v440:bridgepoint-release.json | grep -q 'https://bridgepointintelligence.online/'
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/deploy-tracking-v421.yml')
          s=p.read_text(encoding='utf-8')
          s=s.replace('app-artifact-v422:refs/remotes/origin/app-artifact-v422','app-artifact-v440:refs/remotes/origin/app-artifact-v440')
          s=s.replace('origin/app-artifact-v422','origin/app-artifact-v440')
          s=s.replace("grep -q '2e111cc765d23533e2adf953b44a5578201a0790' /tmp/bridgepoint-app/bridgepoint-release.json","grep -q '4b80bbdc1137ce7b7d3fc26f69fa5077c5c8566a' /tmp/bridgepoint-app/bridgepoint-release.json")
          s=s.replace("'base_release_sha':'2e111cc765d23533e2adf953b44a5578201a0790',","'source_main_sha':'796bae97fd83adfe8ca93746d395a421e6970e86',\n            'audited_artifact_marker':'4b80bbdc1137ce7b7d3fc26f69fa5077c5c8566a',")
          s=s.replace("'immutable_app_branch':'app-artifact-v422',","'immutable_app_branch':'app-artifact-v440',")
          if 'app-artifact-v422' in s or "'base_release_sha':'2e111cc" in s:
              raise SystemExit('V422 release pin remained after V440 promotion edit')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'app-artifact-v440' .github/workflows/deploy-tracking-v421.yml
          grep -q '4b80bbdc1137ce7b7d3fc26f69fa5077c5c8566a' .github/workflows/deploy-tracking-v421.yml
          git rm -f .github/workflows/promote-v440-once.yml .github/workflows/finish-v440-promotion.yml || true
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/deploy-tracking-v421.yml
          git commit -m 'Switch live deployment to audited V440 app artifact'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
          done
          exit 1

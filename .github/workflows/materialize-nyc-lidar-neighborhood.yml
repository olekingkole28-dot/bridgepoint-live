name: Materialize NYC LiDAR Neighborhood
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/reality_assets/build_nyc_lidar_neighborhood.py'
      - 'rebuild-v5000/bridgepoint-nyc-lidar-v7000.js'
      - '.github/workflows/materialize-nyc-lidar-neighborhood.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: bridgepoint-nyc-lidar-neighborhood-build
  cancel-in-progress: false

jobs:
  build-neighborhood:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout BridgePoint source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          token: \${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install LiDAR and geospatial build dependencies
        run: python -m pip install --upgrade numpy pillow pyproj scipy 'laspy[lazrs]' 

      - name: Build neighboring measured LiDAR surfaces and imagery
        shell: bash
        run: |
          set -euo pipefail
          python tools/reality_assets/build_nyc_lidar_neighborhood.py | tee /tmp/bridgepoint-nyc-neighborhood-build.log
          test -s rebuild-v5000/assets/nyc-lidar/tiles-index.json
          python - <<'PY'
          import json, pathlib, gzip, struct
          root=pathlib.Path('rebuild-v5000/assets/nyc-lidar')
          idx=json.loads((root/'tiles-index.json').read_text())
          assert idx['version']==7002 and idx['tileCount']==9, idx
          assert {x['tileId'] for x in idx['tiles']}=={'985207','985210','985212','987207','987210','987212','990207','990210','990212'}
          for entry in idx['tiles']:
              mp=root/entry['manifest']
              m=json.loads(mp.read_text())
              assert len(m['lods'])==3 and m['boundsWgs84']['polygon']
              sm=m['surfaceMesh']
              assert len(sm['chunks'])>=1 and sm['wallFile']
              for lod in m['lods']:
                  p=(mp.parent/lod['file']) if entry['tileId']!='987210' else (root/lod['file'])
                  assert p.is_file() and p.stat().st_size>1000, (entry['tileId'],p)
              for c in sm['chunks']:
                  assert (mp.parent/c['file']).is_file(), (entry['tileId'],c['file'])
              assert (mp.parent/sm['wallFile']).is_file()
              assert (mp.parent/sm['textureFile']).is_file()
          print('NEIGHBORHOOD_MANIFEST_VALID', idx['tileCount'], 'tiles')
          PY

      - name: Commit generated static assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rebuild-v5000/assets/nyc-lidar/tiles rebuild-v5000/assets/nyc-lidar/tiles-index.json
          if git diff --cached --quiet; then
            echo "No generated asset changes; deployment dispatch still follows."
          else
            git commit -m "Materialize NYC LiDAR neighboring photomesh tiles [v7002]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Redeploy the static BridgePoint map with materialized tiles
        env:
          GH_TOKEN: \${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-intelligence-rebuild-v5000.yml --ref main

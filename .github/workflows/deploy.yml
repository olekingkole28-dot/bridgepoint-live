name: Deploy BridgePoint Live

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download audited BridgePoint Flutter release
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          curl -L --fail --retry 3 'https://sdmntpreastus.oaiusercontent.com/files/00000000-0fb0-81f9-8783-7705afd12cfa/raw?se=2026-08-16T09%3A01%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=c1fd334b-367b-5f9c-bfff-ca7188d0b4b8&skoid=e9d2f8b1-028a-4cff-8eb1-d0e66fbefcca&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-15T21%3A31%3A06Z&ske=2026-08-16T21%3A31%3A06Z&sks=b&skv=2026-02-06&sig=N1ZICvDLZAvpi2DQKJfNVerjPB%2BWpZ/mmHI/0VyNwSE%3D' -o /tmp/bridgepoint.zip
          unzip -q /tmp/bridgepoint.zip -d site
          touch site/.nojekyll
          sed -i 's#<base href="/">#<base href="/bridgepoint-live/">#' site/index.html
          test -s site/index.html
          test -s site/main.dart.js
          test -s site/bridgepoint-release.json
          grep -q '5ac28d17fa30c965084e1adf0edaaaaecc53f832' site/bridgepoint-release.json
          echo "BridgePoint run 96 staged successfully."
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish BridgePoint
        id: deployment
        uses: actions/deploy-pages@v4

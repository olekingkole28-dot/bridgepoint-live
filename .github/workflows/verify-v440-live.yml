name: Verify BridgePoint V440 Live

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-v440-live.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: bridgepoint-v440-live-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify public artifact, signup/signin entry and PWA contracts
        env:
          ORIGIN: https://bridgepointintelligence.online
          EXPECTED_MARKER: 4b80bbdc1137ce7b7d3fc26f69fa5077c5c8566a
        run: |
          set -euo pipefail
          mkdir -p /tmp/v440-live
          curl -fsSL --retry 4 --retry-delay 2 "$ORIGIN/app/bridgepoint-release.json?t=${GITHUB_RUN_ID}" -o /tmp/v440-live/release.json
          curl -fsSL --retry 4 --retry-delay 2 "$ORIGIN/app/index.html?t=${GITHUB_RUN_ID}" -o /tmp/v440-live/app-index.html
          curl -fsSL --retry 4 --retry-delay 2 "$ORIGIN/app/main.dart.js?t=${GITHUB_RUN_ID}" -o /tmp/v440-live/main.dart.js
          curl -fsSL --retry 4 --retry-delay 2 "$ORIGIN/app/acquisition_tracker.js?t=${GITHUB_RUN_ID}" -o /tmp/v440-live/tracker.js
          curl -fsSL --retry 4 --retry-delay 2 "$ORIGIN/acquisition_tracker.js?t=${GITHUB_RUN_ID}" -o /tmp/v440-live/root-tracker.js
          curl -fsSL --retry 4 --retry-delay 2 "$ORIGIN/app/manifest.json?t=${GITHUB_RUN_ID}" -o /tmp/v440-live/manifest.json
          curl -fsSL --retry 4 --retry-delay 2 "$ORIGIN/app/flutter_service_worker.js?t=${GITHUB_RUN_ID}" -o /tmp/v440-live/flutter_service_worker.js
          curl -fsSL --retry 4 --retry-delay 2 "$ORIGIN/?t=${GITHUB_RUN_ID}" -o /tmp/v440-live/home.html
          curl -fsSL --retry 4 --retry-delay 2 "$ORIGIN/app/?mode=signup&verify=${GITHUB_RUN_ID}" -o /tmp/v440-live/signup-shell.html
          curl -fsSL --retry 4 --retry-delay 2 "$ORIGIN/app/?mode=signin&verify=${GITHUB_RUN_ID}" -o /tmp/v440-live/signin-shell.html

          python - <<'PY'
          import json, os
          from pathlib import Path
          marker=json.loads(Path('/tmp/v440-live/release.json').read_text())
          assert marker.get('version')==os.environ['EXPECTED_MARKER'], marker
          assert marker.get('public_origin')=='https://bridgepointintelligence.online/', marker
          manifest=json.loads(Path('/tmp/v440-live/manifest.json').read_text())
          assert manifest.get('display') in {'standalone','fullscreen','minimal-ui'}, manifest
          assert manifest.get('icons'), manifest
          print('Live marker and PWA manifest verified:', marker['version'], manifest.get('display'))
          PY
          grep -q '<base href="/app/">' /tmp/v440-live/app-index.html
          grep -q 'Create account' /tmp/v440-live/main.dart.js
          grep -q 'Already have an account' /tmp/v440-live/main.dart.js
          grep -q 'Check your email' /tmp/v440-live/main.dart.js
          grep -q 'captureVersion=440' /tmp/v440-live/tracker.js
          grep -q 'captureVersion=440' /tmp/v440-live/root-tracker.js
          grep -q 'mode.*signup' /tmp/v440-live/tracker.js
          grep -q 'account_mode' /tmp/v440-live/tracker.js
          grep -q '/app/' /tmp/v440-live/home.html
          test -s /tmp/v440-live/flutter_service_worker.js
          test -s /tmp/v440-live/signup-shell.html
          test -s /tmp/v440-live/signin-shell.html
          echo 'Public V440 static + PWA contracts verified.'

      - name: Capture desktop, tablet and mobile live visuals
        env:
          ORIGIN: https://bridgepointintelligence.online
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          capture(){
            local size="$1" url="$2" out="$3"
            rm -f "$out"
            set +e
            timeout 45s "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars --window-size="$size" --virtual-time-budget=12000 --run-all-compositor-stages-before-draw --screenshot="$out" "$url" >/tmp/chrome-live.log 2>&1
            rc=$?
            set -e
            if [ ! -s "$out" ]; then cat /tmp/chrome-live.log; echo "Screenshot missing for $url" >&2; exit ${rc:-1}; fi
            bytes="$(stat -c%s "$out")"
            if [ "$bytes" -lt 10000 ]; then echo "Screenshot suspiciously small: $out ($bytes bytes)" >&2; exit 1; fi
          }
          capture '1440,1100' "$ORIGIN/app/?mode=signup&verify=${GITHUB_RUN_ID}" /tmp/v440-live/signup-desktop.png
          capture '1440,1100' "$ORIGIN/app/?mode=signin&verify=${GITHUB_RUN_ID}" /tmp/v440-live/signin-desktop.png
          capture '820,1180' "$ORIGIN/app/?mode=signup&verify=${GITHUB_RUN_ID}" /tmp/v440-live/signup-tablet.png
          capture '390,844' "$ORIGIN/app/?mode=signup&verify=${GITHUB_RUN_ID}" /tmp/v440-live/signup-mobile.png
          python - <<'PY'
          import hashlib, struct
          from pathlib import Path
          files=['signup-desktop.png','signin-desktop.png','signup-tablet.png','signup-mobile.png']
          expected={'signup-desktop.png':(1440,1100),'signin-desktop.png':(1440,1100),'signup-tablet.png':(820,1180),'signup-mobile.png':(390,844)}
          hashes={}
          for name in files:
              p=Path('/tmp/v440-live')/name
              b=p.read_bytes()
              assert b[:8]==b'\x89PNG\r\n\x1a\n'
              w,h=struct.unpack('>II',b[16:24])
              assert (w,h)==expected[name], (name,w,h)
              hashes[name]=hashlib.sha256(b).hexdigest()
          assert hashes['signup-desktop.png']!=hashes['signin-desktop.png'], 'signup/signin visuals are unexpectedly identical'
          print('Live viewport screenshots verified:', hashes)
          PY

      - name: Upload live visual proof
        uses: actions/upload-artifact@v4
        with:
          name: bridgepoint-v440-live-visuals
          path: |
            /tmp/v440-live/signup-desktop.png
            /tmp/v440-live/signin-desktop.png
            /tmp/v440-live/signup-tablet.png
            /tmp/v440-live/signup-mobile.png
            /tmp/v440-live/release.json
            /tmp/v440-live/manifest.json
          retention-days: 14

      - name: Record hard live verification receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, struct
          from datetime import datetime, timezone
          from pathlib import Path
          base=Path('/tmp/v440-live')
          visuals={}
          for name in ['signup-desktop.png','signin-desktop.png','signup-tablet.png','signup-mobile.png']:
              b=(base/name).read_bytes(); w,h=struct.unpack('>II',b[16:24])
              visuals[name]={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'width':w,'height':h}
          receipt={
            'status':'VERIFIED_LIVE',
            'verified_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'public_origin':'https://bridgepointintelligence.online/',
            'source_main_sha':'796bae97fd83adfe8ca93746d395a421e6970e86',
            'audited_artifact_marker':'4b80bbdc1137ce7b7d3fc26f69fa5077c5c8566a',
            'immutable_app_branch':'app-artifact-v440',
            'tracking_version':440,
            'signup_mode_verified':True,
            'signin_mode_verified':True,
            'signup_signin_visuals_differ':True,
            'pwa_manifest_verified':True,
            'service_worker_verified':True,
            'desktop_verified':True,
            'tablet_verified':True,
            'mobile_verified':True,
            'source_workflow_run_id':int(os.environ['GITHUB_RUN_ID']),
            'visuals':visuals
          }
          Path('live-v440-verification.json').write_text(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add live-v440-verification.json
          git commit -m 'Record hard V440 public verification [skip ci]'
          git push origin HEAD:main

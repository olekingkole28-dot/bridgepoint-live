name: Inspect first underwater plane-wreck source
on:
  pull_request:
    paths:
      - '.github/workflows/inspect-plane-wrecks-source.yml'
      - 'tools/plane_wrecks/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-plane-wrecks-source.yml'
      - 'tools/plane_wrecks/**'
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check KWAJ aircraft scan rights and real mesh files using ZIP byte ranges
        run: |
          python3 -m py_compile tools/plane_wrecks/fetch_plane_wrecks.py tools/plane_wrecks/inspect_abyssal_manifest.py
          python3 tools/plane_wrecks/inspect_abyssal_manifest.py

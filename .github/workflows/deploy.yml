name: Deploy BridgePoint Live

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download audited BridgePoint Flutter release
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          curl -L --fail --retry 3 'https://sdmntprsouthcentralus.oaiusercontent.com/files/00000000-fd68-81f7-92f9-f963a48971b5/raw?se=2026-08-16T11%3A43%3A35Z&sp=r&sv=2026-02-06&sr=b&scid=56dba385-e6a0-5ff5-ae22-6b0e76a726cb&skoid=38550de5-1fab-49d1-9ebb-83af5557cc43&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-15T22%3A43%3A28Z&ske=2026-08-16T22%3A43%3A28Z&sks=b&skv=2026-02-06&sig=%2BO2a7ayaI7oCdGeWyDTw7qZE8kFzEuSlp6zRRxoux4A%3D' -o /tmp/bridgepoint.zip
          unzip -q /tmp/bridgepoint.zip -d site
          touch site/.nojekyll
          sed -i 's#<base href="/">#<base href="./">#' site/index.html
          test -s site/index.html
          test -s site/main.dart.js
          test -s site/bridgepoint-release.json
          grep -q '87b64877eed1b9b9fa23a1f1c8234c0900d1219d' site/bridgepoint-release.json
          echo "BridgePoint release 125 staged successfully for custom-domain hosting."
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish BridgePoint
        id: deployment
        uses: actions/deploy-pages@v4

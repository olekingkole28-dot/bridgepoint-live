           map.addLayer({id:LAYER,type:'custom',renderingMode:'3d',onAdd(m,gl){renderer=new T.WebGLRenderer({canvas:m.getCanvas(),context:gl,antialias:false,alpha:true});renderer.autoClear=false;renderer.info.autoReset=false;renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.NoToneMapping;camera=new T.Camera();scene=new T.Scene();material=new T.MeshBasicMaterial({vertexColors:true,side:T.DoubleSide});},render(gl,args){if(!renderer||!scene||map.getZoom()<DETAIL||document.hidden)return;const matrix=args?.defaultProjectionData?.mainMatrix;if(!matrix)return;renderer.resetState();renderer.info.reset();for(const [id,item] of meshes){if(!visibleKeys.has(id))continue;const raw=map.transform?.getMatrixForModel?.(item.anchor,item.z);if(!raw)continue;camera.projectionMatrix.fromArray(matrix).multiply(new T.Matrix4().fromArray(raw));scene.add(item.mesh);renderer.render(scene,camera);scene.remove(item.mesh);}d.drawCalls=renderer.info.render.calls;d.triangles=renderer.info.render.triangles;d.localMeterAnchors=true;},onRemove(){for(const v of meshes.values())v.mesh.geometry.dispose();meshes.clear();material?.dispose();renderer?.dispose();renderer=null;scene=null;}},map.getLayer('gta-water-label')?'gta-water-label':undefined);

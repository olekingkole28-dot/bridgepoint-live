name: Validate V1056 Product Tools
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-v1056-product-tools.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch staged V1056
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ui-v1056-product-tools:refs/remotes/origin/ui-v1056-product-tools
          rm -rf /tmp/v1056 && mkdir -p /tmp/v1056
          git archive origin/ui-v1056-product-tools app | tar -x -C /tmp/v1056
          test -s /tmp/v1056/app/index.html
          test -s /tmp/v1056/app/product-tools-v1056.js
      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v1056/app
          for f in \
            product-tools-v1056.js \
            visual-system-v1055.js \
            preapp-deeptech-v1055.js \
            presignup-onboarding-v1055.js \
            trial-access-v1055.js \
            owner-everything-v1055.js \
            entitlement-ux-v1055.js \
            runtime-self-heal-v1055.js \
            single-shell-v1055.js \
            work-hub-v1054.js \
            app-more-v1054.js \
            advanced-workflows-v1049.js \
            customer-surfaces-v1042.js \
            plans-primary-v1042.js \
            property-360-v1046.js; do
              node --check "$f"
          done
      - name: V1056 entrypoint wiring checks
        shell: bash
        run: |
          set -euo pipefail
          I=/tmp/v1056/app/index.html
          grep -q 'data-bridgepoint-runtime="v1056"' "$I"
          grep -q 'product-tools-v1056.js?v=1056' "$I"
          grep -q 'single-shell-v1055.js?v=1056' "$I"
          grep -q 'trial-access-v1055.js?v=1056' "$I"
          grep -q 'runtime-self-heal-v1055.js?v=1056' "$I"
          ! grep -q 'flutter_bootstrap.js' "$I"
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' /tmp/v1056/app/*.js "$I"
      - name: Preserve customer critical contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'bridgepoint_flutter_properties_v725' /tmp/v1056/app/customer-surfaces-v1042.js
          grep -q 'bridgepoint_flutter_property_detail_v344' /tmp/v1056/app/customer-surfaces-v1042.js
          grep -q 'bridgepoint_saved_opportunities_v842' /tmp/v1056/app/customer-surfaces-v1042.js
          grep -q 'bridgepoint_claims_workspace_v833' /tmp/v1056/app/work-hub-v1054.js
          grep -q 'bridgepoint_calendar_agenda_v835' /tmp/v1056/app/work-hub-v1054.js
          grep -q 'bridgepoint-checkout-v67' /tmp/v1056/app/plans-primary-v1042.js
          grep -q '>Plans<' /tmp/v1056/app/single-shell-v1055.js
          grep -q 'bp1055-more-button' /tmp/v1056/app/single-shell-v1055.js
      - name: Product Tools contract references
        shell: bash
        run: |
          set -euo pipefail
          F=/tmp/v1056/app/product-tools-v1056.js
          grep -q 'bridgepoint_product_tools_v1056' "$F"
          grep -q 'bridgepoint-geographic-checkout-v1056' "$F"
          grep -q 'bridgepoint_register_geographic_interest_v77' "$F"
          grep -q 'bridgepoint_iot_create_integration_v519' "$F"
          grep -q 'bridgepoint_iot_register_device_v519' "$F"
          grep -q 'bridgepoint_create_drone_dispatch_v520' "$F"
          grep -q 'bridgepoint_digital_twin_summary_v856' "$F"
          grep -q 'bridgepoint_owner_demo_packages_v155' "$F"
          grep -q 'bridgepoint_owner_demo_mode_v155' "$F"
      - name: Protected endpoint checks
        shell: bash
        run: |
          set -euo pipefail
          project='https://xdfsjztwgsbmabshzsjw.supabase.co'
          code=$(curl -sS -o /tmp/geo.json -w '%{http_code}' -X POST "$project/functions/v1/bridgepoint-geographic-checkout-v1056" -H 'content-type: application/json' -d '{"item_type":"STATE","item_key":"NY","interval":"month"}')
          test "$code" = '401'
          hook=$(curl -sS -o /tmp/hook.json -w '%{http_code}' -X POST "$project/functions/v1/bridgepoint-stripe-webhook-v65" -H 'content-type: application/json' -d '{}')
          test "$hook" = '400'
          grep -q 'Invalid signature' /tmp/hook.json
      - name: Local node regression
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile /tmp/v1056/app/downloads/bridgepoint_local_node_v1055.py
          pwsh -NoProfile -Command "[scriptblock]::Create((Get-Content -Raw '/tmp/v1056/app/downloads/install_bridgepoint_local_node_v1055.ps1')) | Out-Null"
      - name: Validation summary
        run: echo 'V1056 Product Tools passed syntax, wiring, customer-contract, billing-endpoint and local-node regression guards.'

name: Publish BridgePoint Lighthouse Global Snapshot V4

on:
  workflow_run:
    workflows: ["Publish BridgePoint Automatic Global Streetlights 3D V1"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: false

jobs:
  publish-lighthouse-hotfix:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test the isolated lighthouse fix
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < patches/lighthouse-v3/bridgepoint-lighthouses-v1.js
          node tests/lighthouse-hotfix-v3.test.mjs

      - name: Select only a Pages artifact that was actually deployed
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          UPSTREAM_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ["REPOSITORY"]
          run_id=os.environ["UPSTREAM_RUN_ID"]
          attempt=os.environ.get("UPSTREAM_RUN_ATTEMPT") or "1"
          if os.environ.get("UPSTREAM_CONCLUSION")!="success":
              with open(os.environ["GITHUB_OUTPUT"],"a") as out:
                  out.write("publish=false\\n")
              print("Skipping lighthouse snapshot: preceding streetlight deployment did not succeed")
              raise SystemExit(0)
          req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100",
              headers={
                  "Accept":"application/vnd.github+json",
                  "Authorization":"Bearer "+os.environ["GH_TOKEN"],
                  "X-GitHub-Api-Version":"2022-11-28"
              })
          with urllib.request.urlopen(req,timeout=30) as response:
              artifacts=json.load(response).get("artifacts",[])
          artifact_name=f"bridgepoint-global-streetlights-v1-{attempt}"
          match=next((item for item in artifacts
                      if item.get("name")==artifact_name and not item.get("expired")),None)
          if not match:
              with open(os.environ["GITHUB_OUTPUT"],"a") as out:
                  out.write("publish=false\\n")
              print("Skipping lighthouse snapshot: no successful streetlight Pages artifact found")
          else:
              with open(os.environ["GITHUB_OUTPUT"],"a") as out:
                  out.write("publish=true\\n")
                  out.write(f"run_id={run_id}\\n")
                  out.write(f"artifact_name={artifact_name}\\n")
              print("Using deployed streetlight Pages artifact",run_id,artifact_name)
          PY
          else
            {
              echo "publish=true"
              echo "run_id=42318605820"
              echo "artifact_name=bridgepoint-global-streetlights-v1-1"
            } >> "$GITHUB_OUTPUT"
            echo "Using last verified production Pages artifact as the manual fallback"
          fi

      - name: Download the exact deployed streetlight Pages artifact
        if: steps.baseline.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.baseline.outputs.artifact_name }}
          run-id: ${{ steps.baseline.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/bp-lighthouse-baseline

      - name: Overlay lighthouse renderer and global OSM snapshot only
        if: steps.baseline.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find "$RUNNER_TEMP/bp-lighthouse-baseline" -type f -name artifact.tar -print -quit)"
          test -n "$ARCHIVE"
          SITE="$RUNNER_TEMP/bp-lighthouse-site"
          mkdir -p "$SITE"
          tar -xf "$ARCHIVE" -C "$SITE"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          site=Path(os.environ["RUNNER_TEMP"])/"bp-lighthouse-site"
          before={p.relative_to(site).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in site.rglob("*") if p.is_file()}
          (Path(os.environ["RUNNER_TEMP"])/"bp-lighthouse-before.json").write_text(json.dumps(before,sort_keys=True),encoding="utf-8")
          print("DEPLOYED_BASELINE_HASHED",len(before),"files before any lighthouse data additions")
          PY
          mkdir -p "$SITE/data"
          DATAFILE="$SITE/data/bridgepoint-lighthouses-global-v1.json"
          ATTRIBUTION="$SITE/data/bridgepoint-lighthouses-global-v1-ATTRIBUTION.md"
          if [ ! -s "$DATAFILE" ]; then
            curl --retry 4 --retry-all-errors --retry-delay 2 -fsSL -A "BridgePoint Intelligence Lighthouse Snapshot/1.0 (https://bridgepointintelligence.online)" -H "Accept: application/json" "https://hulloships.com/atlas/data/lighthouses.json" -o "$DATAFILE"
          fi
          if [ ! -s "$ATTRIBUTION" ]; then
            cat > "$ATTRIBUTION" <<'EOF'
          # BridgePoint Global Lighthouse Snapshot

          Source: HulloShips global lighthouse database (`https://hulloships.com/atlas/lighthouses/` and `https://hulloships.com/atlas/data/lighthouses.json`). The source page identifies these records as OpenStreetMap-derived, © OpenStreetMap contributors, licensed under the Open Database License (ODbL).

          This extracted database is redistributed under ODbL with attribution to OpenStreetMap contributors. Snapshot retrieved 2026-11-06. Fields include name, country, region, mapped type, height where recorded, light character, coordinates and source OSM identifier. Community mapping coverage and recorded heights may be incomplete.

          This is a location/rendering dataset, not an official aid-to-navigation register or navigational safety source. Verify operational status and characteristics with the relevant maritime authority before real-world navigation use.

          ODbL: https://opendatacommons.org/licenses/odbl/1-0/
          EOF
          fi
          python3 - "$DATAFILE" <<'PY'
          import json, sys
          from pathlib import Path
          rows=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          valid=[]
          for row in rows:
              try:
                  lat=float(row.get("lat")); lon=float(row.get("lon"))
              except (TypeError, ValueError):
                  continue
              if -85 <= lat <= 85 and -180 <= lon <= 180:
                  valid.append(row)
          if len(rows) < 10000 or len(valid) < 10000:
              raise SystemExit(f"Global lighthouse snapshot incomplete: {len(rows)} rows / {len(valid)} valid coordinates")
          print("GLOBAL_LIGHTHOUSE_SNAPSHOT_SOURCE_PASS", len(rows), "records;", len(valid), "valid coordinates")
          PY
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re, os
          site=Path(os.environ["RUNNER_TEMP"])/"bp-lighthouse-site"
          required=(
            "index.html","app/index.html","landing.js","app.js",
            "bridgepoint-lighthouses-v1.js","app/bridgepoint-lighthouses-v1.js"
          )
          for rel in required:
            path=site/rel
            if not path.is_file() or path.stat().st_size==0:
              raise SystemExit(f"Deployed baseline is missing required file: {rel}")
          before=json.loads((Path(os.environ["RUNNER_TEMP"])/"bp-lighthouse-before.json").read_text(encoding="utf-8"))

          old_imports=(
            "./bridgepoint-lighthouses-v1.js?v=2-visible-rotating-beacons",
            "./bridgepoint-lighthouses-v1.js?v=3-image-data-beacons",
          )
          new_import="./bridgepoint-lighthouses-v1.js?v=4-global-snapshot"
          for rel in ("landing.js","app.js"):
            path=site/rel
            data=path.read_text(encoding="utf-8")
            matches=[old for old in old_imports if data.count(old)==1]
            if len(matches)!=1:
              raise SystemExit(f"{rel}: expected exactly one known lighthouse import, found {len(matches)}")
            path.write_text(data.replace(matches[0],new_import),encoding="utf-8")

          for rel,filename,version in (
            ("index.html","landing.js","6246-lighthouse-v4"),
            ("app/index.html","app.js","6246-lighthouse-v4"),
          ):
            path=site/rel
            data=path.read_text(encoding="utf-8")
            pattern=re.compile(r"((?:\./|\.\./)?"+re.escape(filename)+r"\?v=)[^\"'<>\s]+")
            data,count=pattern.subn(lambda match:match.group(1)+version,data)
            if count!=1:
              raise SystemExit(f"{rel}: expected exactly one {filename} loader URL, replaced {count}")
            path.write_text(data,encoding="utf-8")

          source=Path("patches/lighthouse-v3/bridgepoint-lighthouses-v1.js")
          patched=source.read_bytes()
          (site/"bridgepoint-lighthouses-v1.js").write_bytes(patched)
          (site/"app/bridgepoint-lighthouses-v1.js").write_bytes(patched)

          after={
            p.relative_to(site).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
            for p in site.rglob("*") if p.is_file()
          }
          changed={rel for rel in before if before[rel]!=after.get(rel)}
          removed=set(before)-set(after)
          added=set(after)-set(before)
          snapshot_files={"data/bridgepoint-lighthouses-global-v1.json","data/bridgepoint-lighthouses-global-v1-ATTRIBUTION.md"}
          expected_changed=set(required)
          expected_added={rel for rel in snapshot_files if rel not in before}
          if removed or added!=expected_added or changed!=expected_changed:
            raise SystemExit(
              "LIGHTHOUSE_ONLY_SCOPE_FAILURE "
              +json.dumps({"changed":sorted(changed),"removed":sorted(removed),
                           "added":sorted(added),"expected_changed":sorted(expected_changed),
                           "expected_added":sorted(expected_added)})
            )
          print("LIGHTHOUSE_SNAPSHOT_OVERLAY_SCOPE_PASS: six renderer/loader files plus expected ODbL snapshot files only; all other site files preserved")
          PY

          node --check "$SITE/landing.js"
          node --check "$SITE/app.js"
          node --input-type=module --check < "$SITE/bridgepoint-lighthouses-v1.js"
          node --input-type=module --check < "$SITE/app/bridgepoint-lighthouses-v1.js"
          cmp -s "$SITE/bridgepoint-lighthouses-v1.js" "$SITE/app/bridgepoint-lighthouses-v1.js"
          grep -Fq 'landing.js?v=6246-lighthouse-v4' "$SITE/index.html"
          grep -Fq 'app.js?v=6246-lighthouse-v4' "$SITE/app/index.html"
          grep -Fq 'bridgepoint-lighthouses-v1.js?v=4-global-snapshot' "$SITE/landing.js"
          grep -Fq 'bridgepoint-lighthouses-v1.js?v=4-global-snapshot' "$SITE/app.js"
          grep -Fq 'return ctx.getImageData(0, 0, 96, 96);' "$SITE/bridgepoint-lighthouses-v1.js"
          grep -Fq 'const VERSION = 4;' "$SITE/bridgepoint-lighthouses-v1.js"
          grep -Fq 'fetch(LIGHTHOUSE_SNAPSHOT_URL' "$SITE/bridgepoint-lighthouses-v1.js"
          grep -Fq 'lighthouseSnapshotRowToElement' "$SITE/bridgepoint-lighthouses-v1.js"
          echo "BRIDGEPOINT_LIGHTHOUSE_V4_BUNDLE_BUILD_PASS"

      - name: Configure GitHub Pages
        if: steps.baseline.outputs.publish == 'true'
        uses: actions/configure-pages@v5

      - name: Upload the lighthouse-only Pages artifact
        if: steps.baseline.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          name: bridgepoint-lighthouse-global-snapshot-v4
          path: ${{ runner.temp }}/bp-lighthouse-site
          include-hidden-files: true

      - name: Publish lighthouse global snapshot V4
        if: steps.baseline.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: bridgepoint-lighthouse-global-snapshot-v4

      - name: Verify the live lighthouse assets on root and app routes
        if: steps.baseline.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          O='https://bridgepointintelligence.online'
          q="$GITHUB_SHA-lighthouse-v4"
          for p in '/' '/app/'; do
            curl --retry 8 --retry-all-errors --retry-delay 2 -fsSL -H 'Cache-Control: no-cache' "$O$p?lighthouse-v4=$q" -o "$RUNNER_TEMP/lighthouse-page.html"
            if [ "$p" = "/" ]; then
              grep -Fq 'landing.js?v=6246-lighthouse-v4' "$RUNNER_TEMP/lighthouse-page.html"
            else
              grep -Fq 'app.js?v=6246-lighthouse-v4' "$RUNNER_TEMP/lighthouse-page.html"
            fi
          done
          curl --retry 8 --retry-all-errors --retry-delay 2 -fsSL -H 'Cache-Control: no-cache' "$O/landing.js?v=6246-lighthouse-v4&verify=$q" -o "$RUNNER_TEMP/lighthouse-landing.js"
          curl --retry 8 --retry-all-errors --retry-delay 2 -fsSL -H 'Cache-Control: no-cache' "$O/app.js?v=6246-lighthouse-v4&verify=$q" -o "$RUNNER_TEMP/lighthouse-app.js"
          curl --retry 8 --retry-all-errors --retry-delay 2 -fsSL -H 'Cache-Control: no-cache' "$O/bridgepoint-lighthouses-v1.js?v=4-global-snapshot&verify=$q" -o "$RUNNER_TEMP/lighthouse-root.js"
          curl --retry 8 --retry-all-errors --retry-delay 2 -fsSL -H 'Cache-Control: no-cache' "$O/app/bridgepoint-lighthouses-v1.js?verify=$q" -o "$RUNNER_TEMP/lighthouse-app-module.js"
          grep -Fq 'bridgepoint-lighthouses-v1.js?v=4-global-snapshot' "$RUNNER_TEMP/lighthouse-landing.js"
          grep -Fq 'bridgepoint-lighthouses-v1.js?v=4-global-snapshot' "$RUNNER_TEMP/lighthouse-app.js"
          grep -Fq 'const VERSION = 4;' "$RUNNER_TEMP/lighthouse-root.js"
          grep -Fq 'return ctx.getImageData(0, 0, 96, 96);' "$RUNNER_TEMP/lighthouse-root.js"
          grep -Fq 'const MIN_BEACON_ZOOM = 3.8;' "$RUNNER_TEMP/lighthouse-root.js"
          grep -Fq 'const MIN_MODEL_ZOOM = 14.0;' "$RUNNER_TEMP/lighthouse-root.js"
          curl --retry 8 --retry-all-errors --retry-delay 2 -fsSL -H 'Cache-Control: no-cache' "$O/data/bridgepoint-lighthouses-global-v1.json?verify=$q" -o "$RUNNER_TEMP/lighthouse-global-data.json"
          curl --retry 8 --retry-all-errors --retry-delay 2 -fsSL -H 'Cache-Control: no-cache' "$O/data/bridgepoint-lighthouses-global-v1-ATTRIBUTION.md?verify=$q" -o "$RUNNER_TEMP/lighthouse-global-attribution.md"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          rows=json.loads((Path(os.environ["RUNNER_TEMP"])/"lighthouse-global-data.json").read_text(encoding="utf-8"))
          assert len(rows)>=10000, f"global snapshot too small: {len(rows)}"
          valid=sum(1 for r in rows if -85<=float(r.get("lat",999))<=85 and -180<=float(r.get("lon",999))<=180)
          assert valid>=10000, f"global snapshot valid-coordinate count too small: {valid}"
          print("LIVE_GLOBAL_LIGHTHOUSE_SNAPSHOT_PASS",len(rows),"records",valid,"valid coordinates")
          PY
          grep -Fq 'OpenStreetMap contributors' "$RUNNER_TEMP/lighthouse-global-attribution.md"
          grep -Fq 'ODbL' "$RUNNER_TEMP/lighthouse-global-attribution.md"
          grep -Fq 'LIGHTHOUSE_SNAPSHOT_URL' "$RUNNER_TEMP/lighthouse-root.js"
          grep -Fq 'lighthouseSnapshotRowToElement' "$RUNNER_TEMP/lighthouse-root.js"
          cmp -s "$RUNNER_TEMP/lighthouse-root.js" "$RUNNER_TEMP/lighthouse-app-module.js"
          echo "BRIDGEPOINT_LIGHTHOUSE_V3_LIVE_ASSET_VERIFICATION_PASS"

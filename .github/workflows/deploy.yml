name: Deploy BridgePoint Live

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download verified BridgePoint v264 production build
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprcacentral.oaiusercontent.com/files/00000000-f3f0-820d-8639-117798dfc28b/raw?se=2026-08-17T20%3A43%3A01Z&sp=r&sv=2026-02-06&sr=b&scid=f706c0d3-767d-5331-92d6-1df5f976d7de&skoid=bbd22fc4-f881-4ea4-b2f3-c12033cf6a8b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-17T06%3A32%3A17Z&ske=2026-08-18T06%3A32%3A17Z&sks=b&skv=2026-02-06&sig=SE%2BcZ887cBWLSveedZqFw6g9xeyBSozAmbFNoYCXn1U%3D' -o /tmp/bridgepoint-v264.zip
          echo '4430dc2a74dd841a3769564572d55e3c0e0e09998c0c43b199707e8283286d0f  /tmp/bridgepoint-v264.zip' | sha256sum -c -
          rm -rf site
          mkdir -p site
          unzip -q /tmp/bridgepoint-v264.zip -d site
          test -s site/index.html
          test -s site/main.dart.js
          test -s site/bridgepoint-release.json
          grep -q 'b6f6e659781e97b971effa7e93511f60585dda75' site/bridgepoint-release.json

          # Existing production contract guards.
          grep -q 'PROPERTY HEARTBEAT' site/main.dart.js
          grep -q 'Ask BridgePoint AI' site/main.dart.js
          grep -q 'More BridgePoint tools' site/main.dart.js
          grep -q 'bridgepoint_live_clusters_v250' site/main.dart.js
          grep -q 'Live clusters' site/main.dart.js
          grep -q 'EMERGING' site/main.dart.js
          grep -q 'RECOVERY' site/main.dart.js
          grep -q 'bridgepoint_property_heartbeat_v245' site/main.dart.js
          grep -q 'BridgePoint could not reach the server several times in a row' site/main.dart.js
          grep -q 'bridgepoint-us-storm-clouds-v229' site/main.dart.js
          grep -q 'Automation Recovery' site/main.dart.js

          # v255-v264 Community 3D, section errors, voice and package-aware AI guards.
          grep -q 'bridgepoint_community_3d_buildings_v241' site/main.dart.js
          grep -q 'U.S. 3D BUILDINGS' site/main.dart.js
          grep -q 'BridgePoint Community Chat' site/main.dart.js
          grep -q 'Properties could not load' site/main.dart.js
          grep -q 'BridgePoint AI search could not load' site/main.dart.js
          grep -q 'bridgepoint_ai_answer_v262' site/main.dart.js
          grep -q 'Talk to BridgePoint AI' site/main.dart.js
          grep -q 'Unlock more intelligence' site/main.dart.js
          grep -q 'Ask anything' site/main.dart.js

          if grep -q 'Connection looks spotty' site/main.dart.js; then
            echo 'Old noisy connection warning unexpectedly remains user-visible.' >&2
            exit 1
          fi
          echo 'BridgePoint v264 verified production artifact ready for deployment.'
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish BridgePoint
        id: deployment
        uses: actions/deploy-pages@v4
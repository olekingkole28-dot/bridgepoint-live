description: |
  BridgePoint Intelligence is a U.S. property and claims intelligence platform founded by Kole Johnson. It brings fragmented property records, geospatial matching, weather and disaster context, property changes, evidence provenance and explainable prioritization into property-level workflows for contractors, restoration teams, public adjusters, property managers and real-estate operators. Approved founding performance partners can earn 30% of settled net subscription revenue for the first six paid billing months of eligible referred customers under the public partner terms.


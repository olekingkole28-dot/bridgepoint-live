name: Deploy BridgePoint V596 — Owner Visible

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-bridgepoint-v596-owner-visible.yml
  workflow_run:
    workflows:
      - "Deploy BridgePoint V595 — Overnight Completion"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble V596 from durable artifact
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site
          mkdir site
          git archive --format=tar origin/live-artifact | tar -xf - -C site
          test -s site/app/index.html
          test -s site/owner/index.html
          test -s site/owner/completion/index.html
          test -s site/owner/local-ai/index.html

          python - <<'PY'
          from pathlib import Path

          app = Path('site/app/index.html')
          s = app.read_text(encoding='utf-8')
          marker = 'bp-owner-visible-v596'
          if marker not in s:
              block = r'''
<style id="bp-owner-visible-v596-style">
#bp-owner-visible-v596{display:none;position:fixed;right:12px;bottom:72px;z-index:2147483645;width:min(340px,calc(100vw - 24px));padding:12px;border-radius:16px;border:1px solid rgba(188,155,255,.60);background:rgba(13,19,35,.97);box-shadow:0 18px 55px rgba(0,0,0,.50);font:12px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;color:#f8f4ff;backdrop-filter:blur(12px)}
#bp-owner-visible-v596.show{display:block}#bp-owner-visible-v596 b{font-size:13px}#bp-owner-visible-v596 .bpv596-sub{color:#adbad0;font-size:10px;margin:2px 0 8px}.bpv596-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.bpv596-grid a{display:flex;align-items:center;justify-content:center;text-align:center;min-height:37px;padding:7px 8px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:#14243a;color:#fff;text-decoration:none;font-weight:850}.bpv596-grid a:first-child{background:linear-gradient(135deg,#6550a8,#385bc4)}@media(max-width:620px){#bp-owner-visible-v596{right:8px;bottom:72px;width:calc(100vw - 16px)}}
</style>
<div id="bp-owner-visible-v596" aria-label="BridgePoint owner controls"><b>🧠 OWNER CONTROL · LIVE V596</b><div class="bpv596-sub">Private owner tools · customers cannot access these controls</div><div class="bpv596-grid"><a href="/owner/completion/?v=596">✅ Master Completion</a><a href="/owner/ai/executive/?v=596">🧠 Executive AI</a><a href="/owner/local-ai/?v=596">🖥 Local AI</a><a href="/owner/?v=596">🎛 Owner Home</a></div></div>
<script id="bp-owner-visible-v596-script">
(()=>{const BASE='https://xdfsjztwgsbmabshzsjw.supabase.co',KEY='sb_publishable_lM9oWQeHjBmgOIiteeOicQ_PTyAeF25';function tok(){try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i)||'';if(k.startsWith('sb-')&&k.endsWith('-auth-token')){const d=JSON.parse(localStorage.getItem(k)||'{}');const t=d?.access_token||d?.currentSession?.access_token||d?.session?.access_token;if(t)return t}}}catch(_){}return sessionStorage.getItem('bp_owner_access_token')||''}async function check(){const t=tok();if(!t)return;try{const r=await fetch(BASE+'/rest/v1/rpc/bridgepoint_owner_master_completion_v586',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:'{}'});if(r.ok)document.getElementById('bp-owner-visible-v596')?.classList.add('show')}catch(_){}}setTimeout(check,1200);setInterval(check,30000)})();
</script>
'''
              if '</body>' not in s:
                  raise SystemExit('app body close missing')
              s = s.replace('</body>', block + '\n</body>', 1)
          app.write_text(s, encoding='utf-8')

          owner = Path('site/owner/index.html')
          s = owner.read_text(encoding='utf-8')
          if 'bp-owner-release-badge-v596' not in s:
              needle = '<main id="dash" class="hidden">'
              badge = '''<div id="bp-owner-release-badge-v596" style="margin:0 0 10px;padding:10px 12px;border-radius:12px;border:1px solid #32694f;background:#10271d;color:#b8ffd9;font-weight:900">✅ LIVE OWNER RELEASE V596 · Master Completion + National Depth + Local-First AI are published</div>'''
              if needle not in s:
                  raise SystemExit('owner main marker missing')
              s = s.replace(needle, needle + badge, 1)
          owner.write_text(s, encoding='utf-8')

          Path('site/owner/ai/v596-release.json').write_text('{"version":596,"release":"Owner Visible Launcher + Release Badge","owner_only_launcher":true,"app_owner_launcher":true,"master_completion":"/owner/completion/","local_ai":"/owner/local-ai/","owner_home":"/owner/","provider_mode":"LOCAL_FIRST","customer_ai_system_changing":false}\n',encoding='utf-8')
          PY

          grep -q 'bp-owner-visible-v596' site/app/index.html
          grep -q 'LIVE OWNER RELEASE V596' site/owner/index.html
          grep -q 'Master Completion' site/owner/completion/index.html
          grep -q 'BridgePoint Local AI Setup' site/owner/local-ai/index.html
          if grep -R -E -i 'SUPABASE_SERVICE_ROLE_KEY|sb_secret_|OPENAI_API_KEY|ANTHROPIC_API_KEY|sk-proj-|sk-ant-|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' site/app/index.html site/owner; then
            echo 'Privileged secret marker found in published artifact.' >&2
            exit 1
          fi
          touch site/.nojekyll site/app/.nojekyll

      - name: Persist exact V596 durable artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/final-live && mkdir /tmp/final-live
          cp -a site/. /tmp/final-live/
          cd /tmp/final-live
          git init
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m 'BridgePoint V596 owner-visible release'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish V596
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live V596
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 8 --retry-delay 3 'https://bridgepointintelligence.online/app/?v=596' -o /tmp/app.html
          curl -fsSL --retry 8 --retry-delay 3 'https://bridgepointintelligence.online/owner/?v=596' -o /tmp/owner.html
          curl -fsSL --retry 8 --retry-delay 3 'https://bridgepointintelligence.online/owner/completion/?v=596' -o /tmp/completion.html
          grep -q 'bp-owner-visible-v596' /tmp/app.html
          grep -q 'LIVE OWNER RELEASE V596' /tmp/owner.html
          grep -q 'Master Completion' /tmp/completion.html

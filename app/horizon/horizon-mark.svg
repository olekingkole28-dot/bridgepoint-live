      <circle cx="812" cy="631" r="7"/><circle cx="836" cy="631" r="7"/>
      <circle cx="481" cy="638" r="7"/><circle cx="505" cy="638" r="7"/>
    </g>

    <path d="M115 839C315 802 707 802 909 839" fill="none" stroke="#FF4D16" stroke-width="16" stroke-linecap="round" opacity=".78" filter="url(#redGlow)"/>
    <path d="M115 839C315 802 707 802 909 839" fill="none" stroke="#FF7B21" stroke-width="5" stroke-linecap="round" opacity=".92"/>


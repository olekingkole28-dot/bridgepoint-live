          // procedural trunk/crown geometry. Quantize vertices and collapse faces.
          function sourceLOD(T,root){
            const bounds=normalizedBounds(T,root),scale=1/bounds.size.y,parts=[];
            root.traverse(o=>{if(o.isMesh&&o.geometry?.attributes?.position)parts.push(o)});
            for(const bins of [7,5,4,3]){
              const pos=[],colors=[],indices=[],lookup=new Map(),faces=new Set(),v=new T.Vector3();
              for(const o of parts){
                const g=o.geometry,p=g.attributes.position,index=g.index,mat=Array.isArray(o.material)?o.material[0]:o.material;
                const color=mat?.color?.clone?.()||new T.Color('#45683a');
                const ids=new Int32Array(p.count);
                for(let i=0;i<p.count;i++){
                  v.fromBufferAttribute(p,i).applyMatrix4(o.matrixWorld);v.x=(v.x-bounds.base.x)*scale;v.y=(v.y-bounds.box.min.y)*scale;v.z=(v.z-bounds.base.z)*scale;
                  const c=color.clone();if(mat?.map&&Math.max(c.r,c.g,c.b)-Math.min(c.r,c.g,c.b)<.08)c.set(v.y>.27?'#436d34':'#6b513b');
                  const key=[Math.round(v.x*bins),Math.round(v.y*bins),Math.round(v.z*bins),Math.round(c.g*4),Math.round(c.r*4)].join(':');
                  let id=lookup.get(key);if(id===undefined){id=pos.length/3;lookup.set(key,id);pos.push(v.x,v.y,v.z);colors.push(c.r,c.g,c.b)}ids[i]=id;
                }
                const count=index?.count||p.count;
                for(let i=0;i+2<count;i+=3){
                  const a=ids[index?index.getX(i):i],b=ids[index?index.getX(i+1):i+1],c=ids[index?index.getX(i+2):i+2];
                  if(a===b||b===c||c===a)continue;const key=[a,b,c].sort((a,b)=>a-b).join(':');if(faces.has(key))continue;faces.add(key);indices.push(a,b,c);
                }
              }
              if(indices.length>=12&&(indices.length<=720||bins===3)){
                const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pos,3));g.setAttribute('color',new T.Float32BufferAttribute(colors,3));g.setIndex(indices);g.computeVertexNormals();g.computeBoundingSphere();return g;
              }
            }
            throw Error('SOURCE_FOREST_LOD_EMPTY');
          }
          export function attachViewportForest(map,options={}){
            if(map.__BP_VIEWPORT_FOREST_V5__)return map.__BP_VIEWPORT_FOREST_V5__;
            const state=map.__BP_VIEWPORT_FOREST_V5__={status:'waiting',source:'OPENFREEMAP_FOREST_WOOD_POLYGONS',representation:'SOURCE_MESH_CANOPY_AGGREGATES_NOT_TREE_INVENTORY',instances:0,representedTreeEquivalent:0};
            window.__BP_VIEWPORT_FOREST_V5__=state;
            const mobile=options.mobile??(Math.min(innerWidth,screen.width||innerWidth)<=900||matchMedia('(pointer: coarse)').matches||Number(navigator.deviceMemory||4)<=4),budget=mobile?8500:22000,triangleBudget=mobile?2200000:6500000;state.mobile=mobile;state.triangleBudget=triangleBudget;
            let T,geometry,material,scene,camera,renderer,mesh,anchor,dead=false,loading=false,timer=0,last='',lastAttempt=0;
            const detailed=()=>{const d=window.__BP_TREE_INSTANCE_RENDERER_V1__;return d?.sourceStreetTreeCount>0&&d?.gpuDrawCalls>0;};
            const read=()=>{let out=[];try{const src=map.getSource('ofm');if(src)out=map.querySourceFeatures('ofm',src.type==='geojson'?{}:{sourceLayer:'landcover'})||[]}catch(_){}return out;};
            function release(){if(mesh){scene.remove(mesh);mesh.dispose?.();mesh=null}state.instances=0;state.drawCalls=0;state.representedTreeEquivalent=0;anchor=null;}
            function refresh(){

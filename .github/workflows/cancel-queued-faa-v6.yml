name: Cancel superseded FAA cache candidate only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cancel-queued-faa-v6.yml']
permissions:
  actions: write
  contents: read
jobs:
  cancel-obsolete-faa:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cancel specific superseded FAA gate cache run (not other workflows)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Cancelling only superseded FAA cache run 44837634946"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/44837634946/cancel" ||
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/44837634946" --jq '{status,conclusion}'

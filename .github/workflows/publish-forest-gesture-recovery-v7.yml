            const state=map.__BP_VIEWPORT_FOREST_V5__={status:'waiting',source:'OPENFREEMAP_FOREST_WOOD_POLYGONS',representation:'SOURCE_MESH_CANOPY_AGGREGATES_NOT_TREE_INVENTORY',instances:0,representedTreeEquivalent:0};
            window.__BP_VIEWPORT_FOREST_V5__=state;
            const mobile=options.mobile??(Math.min(innerWidth,screen.width||innerWidth)<=900||matchMedia('(pointer: coarse)').matches||Number(navigator.deviceMemory||4)<=4),budget=mobile?3500:10000,triangleBudget=mobile?500000:2000000;state.mobile=mobile;state.triangleBudget=triangleBudget;
            let T,geometry,material,scene,camera,renderer,mesh,anchor,dead=false,loading=false,timer=0,last='',lastAttempt=0,dirty=true,lastRefresh=0;
            const detailed=()=>{const d=window.__BP_TREE_INSTANCE_RENDERER_V1__;return d?.sourceStreetTreeCount>0&&d?.gpuDrawCalls>0;};
            const read=()=>{let out=[];try{const src=map.getSource('ofm');if(src)out=map.querySourceFeatures('ofm',src.type==='geojson'?{}:{sourceLayer:'landcover'})||[]}catch(_){}return out;};
            function release(){if(mesh){scene.remove(mesh);mesh.dispose?.();mesh=null}state.instances=0;state.drawCalls=0;state.representedTreeEquivalent=0;anchor=null;}
            function refresh(){

name: Deploy BridgePoint Live

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download audited BridgePoint Flutter release
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          curl -L --fail --retry 3 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-4fa8-822f-ae3e-3a1c2478f560/raw?se=2026-08-16T13%3A05%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=0eed3503-8b85-55bf-9391-7ccbe400c202&skoid=e9d2f8b1-028a-4cff-8eb1-d0e66fbefcca&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-15T21%3A32%3A56Z&ske=2026-08-16T21%3A32%3A56Z&sks=b&skv=2026-02-06&sig=PbR13MM6U3o3svtol70H/L0uInxSBAF3P9I%2BlmVMhaw%3D' -o /tmp/bridgepoint.zip
          unzip -q /tmp/bridgepoint.zip -d site
          touch site/.nojekyll
          sed -i 's#<base href="/">#<base href="./">#' site/index.html
          test -s site/index.html
          test -s site/main.dart.js
          test -s site/bridgepoint-release.json
          grep -q 'd5e6fb8728e17e866b242f7d6e9647fe74832794' site/bridgepoint-release.json
          echo "BridgePoint release 129 staged successfully for custom-domain hosting."
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish BridgePoint
        id: deployment
        uses: actions/deploy-pages@v4

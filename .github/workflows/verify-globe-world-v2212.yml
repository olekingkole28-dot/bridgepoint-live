name: Verify BridgePoint V2212 Production Globe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-globe-world-v2212.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify published V2200-V2211 inventory and fidelity
        shell: bash
        run: |
          set -euo pipefail
          origin='https://bridgepointintelligence.online/app'
          files=(
            atmosphere-v2200.js precipitation-v2201.js extreme-storms-v2202.js hazard-events-v2203.js
            surface-weather-v2204.js wildfire-world-v2205.js dynamic-water-v2206.js vegetation-world-v2207.js
            infrastructure-world-v2208.js cinematic-postfx-v2209.js world-runtime-v2210.js tree-models-v2211.js
          )
          for f in "${files[@]}"; do
            curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$origin/$f?final=${GITHUB_SHA}-${f}-$(date +%s)" -o "/tmp/$f"
            node --check "/tmp/$f"
          done
          grep -Fq "setProjection({type:'globe'})" /tmp/atmosphere-v2200.js
          grep -Fq 'visibilityMiles' /tmp/atmosphere-v2200.js
          grep -Fq 'cameraLocal:true' /tmp/precipitation-v2201.js
          grep -Fq 'windDirectionDeg' /tmp/precipitation-v2201.js
          grep -Fq 'bp2202-hurricane-volume' /tmp/extreme-storms-v2202.js
          grep -Fq 'hollowEye:true' /tmp/extreme-storms-v2202.js
          grep -Fq 'emitLightning' /tmp/hazard-events-v2203.js
          grep -Fq 'emitEarthquake' /tmp/hazard-events-v2203.js
          grep -Fq 'elevationAware:true' /tmp/surface-weather-v2204.js
          grep -Fq 'flatWaterSurface:true' /tmp/surface-weather-v2204.js
          grep -Fq 'iceMaterialOverlay:true' /tmp/surface-weather-v2204.js
          grep -Fq 'bp2205WildfireGpu' /tmp/wildfire-world-v2205.js
          grep -Fq 'containmentExact:true' /tmp/wildfire-world-v2205.js
          grep -Fq 'bp2206-shore-foam' /tmp/dynamic-water-v2206.js
          grep -Fq 'BridgePointVegetationWorldV2207' /tmp/vegetation-world-v2207.js
          grep -Fq 'OSM/OpenMapTiles visible landcover + tree features' /tmp/vegetation-world-v2207.js
          grep -Fq 'solidExtrusion:true' /tmp/infrastructure-world-v2208.js
          grep -Fq 'bp2209PostFX' /tmp/cinematic-postfx-v2209.js
          grep -Fq 'ambientOcclusionLayer' /tmp/cinematic-postfx-v2209.js
          grep -Fq 'activateCutover' /tmp/world-runtime-v2210.js
          grep -Fq 'hideLegacy' /tmp/world-runtime-v2210.js
          grep -Fq 'BridgePointTreeModelsV2211' /tmp/tree-models-v2211.js
          grep -Fq 'globeTransitionAware:true' /tmp/tree-models-v2211.js
          grep -Fq 'InstancedMesh' /tmp/tree-models-v2211.js
          curl --retry 5 --retry-all-errors --retry-delay 2 -fsSL --max-time 30 -H 'Cache-Control: no-cache' "$origin/?final=${GITHUB_SHA}-$(date +%s)" -o /tmp/app.html
          for v in $(seq 2200 2211); do grep -Fq "v=$v" /tmp/app.html; done
          echo FINAL_PUBLISHED_INVENTORY_FIDELITY_PASS

      - name: Exercise all published world APIs in phone browser
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install puppeteer-core@24 --no-audit --no-fund >/dev/null 2>&1
          CHROME_PATH="$CHROME" node <<'NODE'
          const puppeteer=require('puppeteer-core'),assert=require('assert');
          const O='https://bridgepointintelligence.online/app';
          const files=['atmosphere-v2200.js','precipitation-v2201.js','extreme-storms-v2202.js','hazard-events-v2203.js','surface-weather-v2204.js','wildfire-world-v2205.js','dynamic-water-v2206.js','vegetation-world-v2207.js','infrastructure-world-v2208.js','cinematic-postfx-v2209.js','world-runtime-v2210.js','tree-models-v2211.js'];
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox','--disable-dev-shm-usage','--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            try{
              const p=await browser.newPage();
              await p.setViewport({width:390,height:844,deviceScaleFactor:2,isMobile:true,hasTouch:true});
              await p.setContent('<!doctype html><html><body><div class="map-shell" style="position:relative;width:390px;height:700px"><canvas id="mapCanvas" width="390" height="700"></canvas></div><button id="bp97WeatherFx"></button><div class="peril-scroll"></div></body></html>');
              await p.evaluate(()=>{
                const sources=new Map(),layers=new Map([
                  ['labels',{id:'labels'}],['bp97-building',{id:'bp97-building'}],['bp2174-context-buildings',{id:'bp2174-context-buildings'}],
                  ['bp2162-water',{id:'bp2162-water'}],['bp2162-land',{id:'bp2162-land'}],['bp2162-parks',{id:'bp2162-parks'}]
                ]),images=new Map(),events={};
                sources.set('bp2162-openmaptiles',{id:'bp2162-openmaptiles',setData:()=>{}});
                const canvas=document.getElementById('mapCanvas');
                const map={
                  getCenter:()=>({lng:-72.65,lat:41.56}),getBounds:()=>({getWest:()=>-73,getSouth:()=>41,getEast:()=>-72,getNorth:()=>42}),
                  getZoom:()=>15,getBearing:()=>18,getPitch:()=>70,getProjection:()=>({type:'globe'}),
                  setProjection:x=>{window.__projection=x},setRenderWorldCopies:()=>{},setSky:x=>window.__sky=x,setLight:x=>window.__light=x,setMaxPitch:()=>{},triggerRepaint:()=>{},
                  getLayer:id=>layers.get(id)||null,addLayer:l=>layers.set(l.id,l),setLayoutProperty:(id,k,v)=>{const l=layers.get(id)||{id};l[k]=v;layers.set(id,l)},setLayerZoomRange:()=>{},
                  getSource:id=>sources.get(id)||null,addSource:(id,s)=>sources.set(id,{...s,setData:d=>{sources.get(id).data=d}}),
                  getPaintProperty:()=>null,setPaintProperty:(id,k,v)=>{const l=layers.get(id)||{id};l.paint=l.paint||{};l.paint[k]=v;layers.set(id,l)},
                  hasImage:id=>images.has(id),addImage:(id,x)=>images.set(id,x),updateImage:(id,x)=>images.set(id,x),
                  queryRenderedFeatures:()=>[],querySourceFeatures:()=>[],queryTerrainElevation:()=>42,
                  project:([lng,lat])=>({x:195+(lng+72.65)*120,y:350-(lat-41.56)*120}),getCanvas:()=>canvas,getCanvasContainer:()=>canvas,
                  on:(n,fn)=>{(events[n]||(events[n]=[])).push(fn)}
                };
                window.__mock={sources,layers,images,events};window.__bp97MapState={ready:true,map};
                window.BridgePointWorldEffects={version:2190,mode:'all',disable:()=>{window.__legacyDisabled=true},getState:()=>({enabled:true,mode:'all',data:{observations:[{lng:-72.65,lat:41.56,visibility_mi:.7,cloud_fraction:.9,wind_speed_kt:30,wind_dir_deg:270,weather:'rain'}],alerts:[],fires:[],earthquakes:[],storms:[],water_levels:[],thermal:[],source_status:{}}})};
              });
              for(const f of files){let ok=false,lastErr;for(let i=0;i<4&&!ok;i++){try{await p.addScriptTag({url:`${O}/${f}?final-runtime=${Date.now()}-${i}-${f}`});ok=true}catch(e){lastErr=e;await new Promise(r=>setTimeout(r,1000))}}if(!ok)throw lastErr}
              await p.waitForFunction(()=>window.BridgePointWorldRuntimeV2210?.version===2210&&window.BridgePointTreeModelsV2211?.version===2211,{timeout:15000});
              await new Promise(r=>setTimeout(r,2500));
              const out=await p.evaluate(()=>{
                const A=BridgePointAtmosphereV2200.setWeather({visibilityMiles:.6,cloudCoveragePct:92,stormActive:true,stormIntensity:.9});
                BridgePointPrecipitationV2201.setPrecipitation({type:'rain',intensity:.8,windSpeedMph:40,windDirectionDeg:270});const rain=BridgePointPrecipitationV2201.getState();BridgePointPrecipitationV2201.setType('snow');const snow=BridgePointPrecipitationV2201.getState();BridgePointPrecipitationV2201.setType('hail');const hail=BridgePointPrecipitationV2201.getState();
                const tid=BridgePointExtremeStormsV2202.upsertTornado({lng:-72.65,lat:41.56,heightM:900,radiusM:180});
                const hid=BridgePointExtremeStormsV2202.upsertHurricane({lng:-72.6,lat:41.5,windMph:100,eyeRadiusMiles:10,track:{type:'LineString',coordinates:[[-72.8,41.3],[-72.4,41.7]]}});const extreme=BridgePointExtremeStormsV2202.getState();
                const lightning=BridgePointHazardEventsV2203.emitLightning({lng:-72.65,lat:41.56,height:25});const quake=BridgePointHazardEventsV2203.emitEarthquake({lng:-72.65,lat:41.56,magnitude:4});
                const surf=BridgePointSurfaceWeatherV2204.setFloodHeightFeet(3.5);BridgePointSurfaceWeatherV2204.setIceActive(true);
                const fire=BridgePointWildfireWorldV2205.upsertFire({lng:-72.7,lat:41.6,acres:250});const wildfire=BridgePointWildfireWorldV2205.getState();
                BridgePointDynamicWaterV2206.refresh();const water=BridgePointDynamicWaterV2206.getState();
                BridgePointVegetationWorldV2207.refresh();const vegetation=BridgePointVegetationWorldV2207.getState();
                BridgePointInfrastructureWorldV2208.refresh();const infra=BridgePointInfrastructureWorldV2208.getState();
                BridgePointCinematicPostFXV2209.refresh();const post=BridgePointCinematicPostFXV2209.getState();
                BridgePointTreeModelsV2211.refresh();const tree=BridgePointTreeModelsV2211.getState();
                BridgePointWorldRuntimeV2210.activateCutover();const W=BridgePointWorldRuntimeV2210.getState();
                return{A,rain,snow,hail,tid,hid,extreme,lightning,quake,surf,fire,wildfire,water,vegetation,infra,post,tree,W,legacyDisabled:!!window.__legacyDisabled,sky:!!window.__sky,light:!!window.__light,versions:[BridgePointAtmosphereV2200.version,BridgePointPrecipitationV2201.version,BridgePointExtremeStormsV2202.version,BridgePointHazardEventsV2203.version,BridgePointSurfaceWeatherV2204.version,BridgePointWildfireWorldV2205.version,BridgePointDynamicWaterV2206.version,BridgePointVegetationWorldV2207.version,BridgePointInfrastructureWorldV2208.version,BridgePointCinematicPostFXV2209.version,BridgePointWorldRuntimeV2210.version,BridgePointTreeModelsV2211.version]};
              });
              assert.deepEqual(out.versions,[2200,2201,2202,2203,2204,2205,2206,2207,2208,2209,2210,2211]);
              assert(out.A.effectiveDrawDistanceMiles<2&&out.sky&&out.light);
              assert.equal(out.rain.type,'rain');assert.equal(out.snow.type,'snow');assert.equal(out.hail.type,'hail');assert.equal(out.rain.windSpeedMph,40);
              assert(out.tid&&out.hid&&out.extreme.hollowEye&&out.extreme.hurricane3D);
              assert(out.lightning&&out.quake);
              assert(Math.abs(out.surf.floodHeightFt-3.5)<1e-8&&out.surf.elevationAware&&out.surf.flatWaterSurface&&out.surf.iceMaterialOverlay);
              assert(out.fire&&out.wildfire.containmentExact);
              assert('shader' in out.water&&'foam' in out.water);
              assert(typeof out.vegetation.instances==='number'&&out.vegetation.source.includes('OSM/OpenMapTiles'));
              assert(out.infra.solidExtrusion&&out.infra.terrainMatched);
              assert(out.post.shadowLayer&&out.post.ambientOcclusionLayer&&out.post.bloomLayer&&out.post.reflectionLayer);
              assert(out.tree.globeTransitionAware&&out.tree.terrainMatched&&out.tree.windAnimated);
              assert(out.W.cutover&&out.W.modulesReady&&out.legacyDisabled);
              console.log('BRIDGEPOINT_V2212_FINAL_PRODUCTION_GLOBE_PASS');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

name: Inspect BridgePoint first underwater aircraft mesh
on:
  pull_request:
    paths:
      - '.github/workflows/inspect-plane-wrecks-source.yml'
      - 'tools/plane_wrecks/fetch_plane_wrecks.py'\n      - 'tools/plane_wrecks/inspect_messerschmitt_source.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-plane-wrecks-source.yml'
      - 'tools/plane_wrecks/fetch_plane_wrecks.py'\n      - 'tools/plane_wrecks/inspect_messerschmitt_source.py'
permissions:
  contents: read
  issues: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect only KWAJ mesh entries using ZIP byte ranges (no 3 GB archive download)
        id: inspect
        shell: bash
        run: |
          set +e
          python3 tools/plane_wrecks/fetch_plane_wrecks.py --inspect-only > "$RUNNER_TEMP/plane-wreck-inspection.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/plane-wreck-inspection.log"
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Inspect real Messerschmitt wreck Potree source URLs\n        run: python3 tools/plane_wrecks/inspect_messerschmitt_source.py\n      - name: Report source inspection result back to the BridgePoint work PR
        if: always()
        uses: actions/github-script@v7
        env:
          LOG_PATH: ${{ runner.temp }}/plane-wreck-inspection.log
          INSPECT_EXIT_CODE: ${{ steps.inspect.outputs.exit_code }}
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync(process.env.LOG_PATH)
              ? fs.readFileSync(process.env.LOG_PATH, 'utf8').slice(-12000)
              : 'Inspection log was not created.';
            const body = [
              '### First plane-wreck source inspection',
              'Result: ' + (process.env.INSPECT_EXIT_CODE === '0' ? 'completed' : 'failed (exit ' + process.env.INSPECT_EXIT_CODE + ')'),
              '',
              '```text',
              log,
              '```',
              '',
              'This report is from a range-only read of the source archive; it does not download the full 3 GB ZIP.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 559,
              body
            });

name: Deploy BridgePoint Live Artifact Runtime

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deploy-live-artifact-runtime-v962.yml'
      - 'runtime-release/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and verify v1000 recovery runtime
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site && mkdir site
          git archive --format=tar origin/live-artifact | tar -xf - -C site

          for f in \
            site/index.html \
            site/app/index.html \
            site/app/main.dart.js \
            site/app/flutter_bootstrap.js \
            site/app/flutter_service_worker.js \
            site/app/manifest.json \
            site/app/experience-v974.js \
            site/app/runtime-unifier-v984.js \
            site/app/lazy-runtime-v1000.js \
            site/app/bridgepoint-shell-v1000.js \
            site/app/radar-rest-v1000.js \
            site/app/live-home-v984.js \
            site/app/owner-business-pulse-v993.js \
            site/app/map-radar-v974.js \
            site/app/map-polish-v984.js; do
            test -s "$f"
          done

          for f in \
            site/app/experience-v974.js \
            site/app/runtime-unifier-v984.js \
            site/app/lazy-runtime-v1000.js \
            site/app/bridgepoint-shell-v1000.js \
            site/app/radar-rest-v1000.js \
            site/app/live-home-v984.js \
            site/app/owner-business-pulse-v993.js \
            site/app/map-radar-v974.js \
            site/app/map-polish-v984.js \
            site/app/flutter_service_worker.js; do
            node --check "$f"
          done

          grep -q '<base href="/app/">' site/app/index.html
          grep -q 'data-bridgepoint-runtime="v1000"' site/app/index.html
          grep -q "__bridgepointCanonicalRuntime='v1000'" site/app/index.html
          grep -q "get('entry')==='1'" site/app/index.html
          grep -q 'html:not(.bp1000-entry-allowed) #bp984-entry' site/app/index.html
          grep -q 'lazy-runtime-v1000.js?v=1000' site/app/index.html
          grep -q 'bridgepoint-shell-v1000.js?v=1000' site/app/index.html
          grep -q 'flutter_bootstrap.js?v=1000' site/app/index.html
          test "$(grep -n 'bridgepoint-shell-v1000.js?v=1000' site/app/index.html | cut -d: -f1)" -lt "$(grep -n 'flutter_bootstrap.js?v=1000' site/app/index.html | cut -d: -f1)"

          for old in \
            bridgepoint-shell-v999.js \
            lazy-runtime-v993.js \
            startup-recovery-v986.js \
            home-hard-cover-v988.js \
            tab-handoff-v990.js \
            nav-clearance-v991.js \
            home-flutter-separation-v998.js \
            nav-seam-cover-v994.js \
            signals-activity-v984.js \
            live-system-v961.js \
            packages-access-v962.js \
            podcast-entry-v941.js \
            experience-v974-fix.js; do
            if grep -q "$old" site/app/index.html; then
              echo "Legacy runtime returned: $old" >&2
              exit 1
            fi
          done

          grep -q '__bridgepointShellV1000' site/app/bridgepoint-shell-v1000.js
          grep -q 'clip-path:inset(calc(100% - var(--bp1000-native-nav))' site/app/bridgepoint-shell-v1000.js
          ! grep -q 'BridgePointNavigateFlutterTabV984' site/app/bridgepoint-shell-v1000.js
          ! grep -q 'preventDefault' site/app/bridgepoint-shell-v1000.js
          ! grep -q 'stopPropagation' site/app/bridgepoint-shell-v1000.js

          grep -q 'ImageServer/exportImage' site/app/radar-rest-v1000.js
          grep -q "u.searchParams.set('f','image')" site/app/radar-rest-v1000.js
          grep -q 'falling back to latest live radar' site/app/radar-rest-v1000.js
          grep -q 'radar-rest-v1000.js' site/app/lazy-runtime-v1000.js
          grep -q "__bridgepointCanonicalRuntime==='v1000'" site/app/runtime-unifier-v984.js

          grep -q "for(const k of \['signals','matching','scoring','patterns','opportunities'\])" site/app/live-home-v984.js
          grep -q 'await refresh();void ownerCheck();' site/app/live-home-v984.js
          grep -q "BRIDGEPOINT_CACHE_RETIREMENT = 'v1000'" site/app/flutter_service_worker.js
          grep -q '"start_url": "./?bpv=v1000"' site/app/manifest.json

          grep -q 'Nationwide U.S. property intelligence' site/index.html
          grep -q 'all 50 states and D.C.' site/index.html
          grep -q 'href="/app/?entry=1&utm_source=' site/index.html
          if grep -qi 'Connecticut opportunity intelligence' site/index.html; then
            echo 'Connecticut-only landing copy returned' >&2
            exit 1
          fi

          touch site/.nojekyll site/app/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy v1000 recovery runtime
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify v1000 on public custom domain
        shell: bash
        run: |
          set -euo pipefail
          origin='https://bridgepointintelligence.online'
          for attempt in $(seq 1 30); do
            salt="${GITHUB_SHA}-${attempt}-$(date +%s)"
            root="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache, no-store' "${origin}/?runtime=${salt}" 2>/dev/null || true)"
            app="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache, no-store' "${origin}/app/?runtime=${salt}" 2>/dev/null || true)"
            shell="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache, no-store' "${origin}/app/bridgepoint-shell-v1000.js?runtime=${salt}" 2>/dev/null || true)"
            radar="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache, no-store' "${origin}/app/radar-rest-v1000.js?runtime=${salt}" 2>/dev/null || true)"
            lazy="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache, no-store' "${origin}/app/lazy-runtime-v1000.js?runtime=${salt}" 2>/dev/null || true)"
            sw="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache, no-store' "${origin}/app/flutter_service_worker.js?runtime=${salt}" 2>/dev/null || true)"
            manifest="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache, no-store' "${origin}/app/manifest.json?runtime=${salt}" 2>/dev/null || true)"

            if printf '%s' "$root" | grep -q 'Nationwide U.S. property intelligence' \
              && printf '%s' "$root" | grep -q 'href="/app/?entry=1&utm_source=' \
              && printf '%s' "$app" | grep -q 'data-bridgepoint-runtime="v1000"' \
              && printf '%s' "$app" | grep -q 'bridgepoint-shell-v1000.js?v=1000' \
              && printf '%s' "$app" | grep -q 'lazy-runtime-v1000.js?v=1000' \
              && printf '%s' "$app" | grep -q 'flutter_bootstrap.js?v=1000' \
              && ! printf '%s' "$app" | grep -q 'bridgepoint-shell-v999.js' \
              && ! printf '%s' "$app" | grep -q 'startup-recovery-v986.js' \
              && printf '%s' "$shell" | grep -q '__bridgepointShellV1000' \
              && printf '%s' "$shell" | grep -q 'bp1000-native-nav' \
              && printf '%s' "$radar" | grep -q 'ImageServer/exportImage' \
              && printf '%s' "$radar" | grep -q 'falling back to latest live radar' \
              && printf '%s' "$lazy" | grep -q 'radar-rest-v1000.js' \
              && printf '%s' "$sw" | grep -q "BRIDGEPOINT_CACHE_RETIREMENT = 'v1000'" \
              && printf '%s' "$manifest" | grep -q 'bpv=v1000'; then
              echo 'BridgePoint v1000 recovery runtime verified on the public custom domain.'
              exit 0
            fi
            sleep 8
          done
          echo 'BridgePoint v1000 did not converge on the public custom domain.' >&2
          exit 1

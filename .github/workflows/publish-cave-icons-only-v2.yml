# Add five real remote/deep cave meshes using latest successful Cave-only production snapshot. Every unrelated file remains identical.
name: Publish Only Five Remote and Deep 3D Caves v16
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-cave-icons-only-v2.yml'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-cave-entry-publish-only-v16
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test only Cave catalog and icon persistence
        run: |
          set -euo pipefail
          node --check rebuild-v5000/bridgepoint-underground-scan-sites-v1.js
          node tests/underground-scan-sites-v1.test.mjs
          node --check rebuild-v5000/landing.js
          node --check rebuild-v5000/app.js

      - name: Resolve latest successful Cave-only Pages artifact
        id: cave_baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUNS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/publish-cave-icons-only-v2.yml/runs?status=success&branch=main&per_page=25")"
          BASELINE_ID="$(node -e 'const d=JSON.parse(process.argv[1]);const r=(d.workflow_runs||[]).find(x=>x.conclusion==="success"&&x.id!==Number(process.env.GITHUB_RUN_ID));if(!r)process.exit(1);process.stdout.write(String(r.id));' "$RUNS")"
          ARTIFACT="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASELINE_ID}/artifacts" --jq '.artifacts[] | select((.expired|not) and (.name | startswith("bridgepoint-v5000-"))) | .name' | head -n 1)"
          test -n "$BASELINE_ID"
          test -n "$ARTIFACT"
          echo "run_id=$BASELINE_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "CAVE_BASELINE run=$BASELINE_ID artifact=$ARTIFACT"
      - name: Download last successful Cave-only Pages snapshot
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.cave_baseline.outputs.artifact_name }}
          run-id: ${{ steps.cave_baseline.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/bp-cave-base

      - name: Patch only Cave module and existing entry cache keys
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/bp-cave-site"
          ARCHIVE="$(find "$RUNNER_TEMP/bp-cave-base" -name artifact.tar -type f -print -quit)"
          test -n "$ARCHIVE"
          mkdir -p "$SITE"
          tar -xf "$ARCHIVE" -C "$SITE"
          export SITE
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          site=Path(os.environ['SITE'])
          cave='bridgepoint-underground-scan-sites-v1.js'
          expected={
            'index.html','app/index.html','landing.js','app.js',
            cave,'app/'+cave
          }
          before={p.relative_to(site).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in site.rglob('*') if p.is_file()}
          for rel in expected:
              if rel not in before:
                  raise SystemExit('Known-good Pages artifact is missing required file: '+rel)
          patched=Path('rebuild-v5000')/cave
          for rel in (cave,'app/'+cave):
              (site/rel).write_bytes(patched.read_bytes())
          edits={
            'landing.js':[
              ('./'+cave+'?v=15-five-global-real-caves','./'+cave+'?v=16-five-remote-depth-caves'),
              ('./'+cave+'?v=15-mobile-five-global-real-caves','./'+cave+'?v=16-mobile-five-remote-depth-caves')
            ],
            'app.js':[
              ('./'+cave+'?v=15-five-global-real-caves','./'+cave+'?v=16-five-remote-depth-caves')
            ]
          }
          for rel,changes in edits.items():
              f=site/rel
              source=f.read_text(encoding='utf-8')
              for old,new in changes:
                  if source.count(old)!=1:
                      raise SystemExit(f'{rel}: expected one exact old Cave import {old}; found {source.count(old)}')
                  source=source.replace(old,new,1)
              f.write_text(source,encoding='utf-8')
          for rel,entry in (('index.html','landing.js'),('app/index.html','app.js')):
              f=site/rel
              source=f.read_text(encoding='utf-8')
              pattern=r'src="([^"]*'+re.escape(entry)+r'\?v=[^"]*)"'
              matches=list(re.finditer(pattern,source))
              if len(matches)!=1:
                  raise SystemExit(f'{rel}: expected exactly one active {entry} cache-keyed script; got {len(matches)}')
              old=matches[0].group(1)
              if 'cave-entry=five-global-v15' not in old or 'cave-entry=five-remote-depth-v16' in old:
                  raise SystemExit(f'{rel}: missing previous five-global-v15 cache key or new remote-depth-v16 key already appended')
              source=source.replace('src="'+old+'"','src="'+old+'&cave-entry=five-remote-depth-v16"',1)
              f.write_text(source,encoding='utf-8')
          after={p.relative_to(site).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in site.rglob('*') if p.is_file()}
          added=set(after)-set(before)
          deleted=set(before)-set(after)
          changed={p for p in before if p in after and before[p]!=after[p]}
          if added or deleted or changed!=expected:
              raise SystemExit('CAVE_ONLY_PUBLISH_SCOPE_FAILED '+json.dumps({
                'added':sorted(added),'deleted':sorted(deleted),
                'changed':sorted(changed),'expected':sorted(expected)
              }))
          if (site/cave).read_bytes()!=(site/'app'/cave).read_bytes():
              raise SystemExit('Website and app Cave module differ')
          for rel in ('landing.js','app.js'):
              text=(site/rel).read_text()
              if './'+cave+'?v=16-five-remote-depth-caves' not in text:
                  raise SystemExit(rel+' did not load the new Cave module')
          print('CAVE_ONLY_PUBLISH_SCOPE_PASS',len(changed),'files, no additions or deletions')
          PY
          node --check "$SITE/landing.js"
          node --check "$SITE/app.js"
          node --check "$SITE/bridgepoint-underground-scan-sites-v1.js"
          node --check "$SITE/app/bridgepoint-underground-scan-sites-v1.js"

      - uses: actions/configure-pages@v5

      - name: Upload exact preserved site with only Cave marker patch
        uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-v5000-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bp-cave-site
          include-hidden-files: true

      - name: Publish exact Cave marker patch to Pages
        id: deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deploy-pages-extended.mjs

      - name: Verify live Cave icons on website and app
        shell: bash
        run: |
          set -euo pipefail
          SITE="https://bridgepointintelligence.online"
          for pass in $(seq 1 15); do
            if curl -fsSL -H 'Cache-Control: no-cache' "$SITE/bridgepoint-underground-scan-sites-v1.js?check=$GITHUB_SHA-$pass" | grep -F >/dev/null 'wells-gray-sarlaccs-pit-canada'; then
              curl -fsSL -H 'Cache-Control: no-cache' "$SITE/bridgepoint-underground-scan-sites-v1.js?check=$GITHUB_SHA-$pass" | grep -F >/dev/null '239d912831f6471da95a2fd672b53398'
              curl -fsSL -H 'Cache-Control: no-cache' "$SITE/bridgepoint-underground-scan-sites-v1.js?check=$GITHUB_SHA-$pass" | grep -F >/dev/null '74b4a560749743eaa53cd89793b4a629'
              curl -fsSL -H 'Cache-Control: no-cache' "$SITE/bridgepoint-underground-scan-sites-v1.js?check=$GITHUB_SHA-$pass" | grep -F >/dev/null 'cd6c5687814e484da0bf4d360a324c60'
              curl -fsSL -H 'Cache-Control: no-cache' "$SITE/bridgepoint-underground-scan-sites-v1.js?check=$GITHUB_SHA-$pass" | grep -F >/dev/null '2989d29a52a0494aa0cd2e279b411247'
              curl -fsSL -H 'Cache-Control: no-cache' "$SITE/app/bridgepoint-underground-scan-sites-v1.js?check=$GITHUB_SHA-$pass" | grep -F >/dev/null 'masaya-bat-cave-nicaragua'
              curl -fsSL -H 'Cache-Control: no-cache' "$SITE/app/bridgepoint-underground-scan-sites-v1.js?check=$GITHUB_SHA-$pass" | grep -F >/dev/null 'cueva-de-las-manos-argentina'
              curl -fsSL -H 'Cache-Control: no-cache' "$SITE/app/bridgepoint-underground-scan-sites-v1.js?check=$GITHUB_SHA-$pass" | grep -F >/dev/null 'kelkaya-sinkhole-turkey'
              curl -fsSL -H 'Cache-Control: no-cache' "$SITE/app/bridgepoint-underground-scan-sites-v1.js?check=$GITHUB_SHA-$pass" | grep -F >/dev/null 'weld-range-rock-shelter-australia'
              curl -fsSL -H 'Cache-Control: no-cache' "$SITE/app/bridgepoint-underground-scan-sites-v1.js?check=$GITHUB_SHA-$pass" | grep -F >/dev/null 'd0c88d0853844a8e9a1de22a342326cb'
              curl -fsSL -H 'Cache-Control: no-cache' "$SITE/app/bridgepoint-underground-scan-sites-v1.js?check=$GITHUB_SHA-$pass" | grep -F >/dev/null 'const containedViewer=isMatterport||isEmbedOnly'
              curl -fsSL -H 'Cache-Control: no-cache' "$SITE/landing.js?check=$GITHUB_SHA-$pass" | grep -F >/dev/null '16-five-remote-depth-caves'
              curl -fsSL -H 'Cache-Control: no-cache' "$SITE/app.js?check=$GITHUB_SHA-$pass" | grep -F >/dev/null '16-five-remote-depth-caves'
              curl -fsSL -H 'Cache-Control: no-cache' "$SITE/bridgepoint-underground-scan-sites-v1.js?check=$GITHUB_SHA-$pass" | grep -F >/dev/null 'df5dea76480f4ed3af018d885a13b704'
              curl -fsSL -H 'Cache-Control: no-cache' "$SITE/app/bridgepoint-underground-scan-sites-v1.js?check=$GITHUB_SHA-$pass" | grep -F >/dev/null '5dc79d2891f24e9fa571b9e910556ec8'
              curl -fsSL -H 'Cache-Control: no-cache' "$SITE/bridgepoint-underground-scan-sites-v1.js?check=$GITHUB_SHA-$pass" | grep -F >/dev/null '2f06ab8d1bd14ce5a85c417fefd91cda'
              curl -fsSL -H 'Cache-Control: no-cache' "$SITE/app/bridgepoint-underground-scan-sites-v1.js?check=$GITHUB_SHA-$pass" | grep -F >/dev/null '85a2ff52fa7b4a44b87033145fd1b01f'
              curl -fsSL -H 'Cache-Control: no-cache' "$SITE/bridgepoint-underground-scan-sites-v1.js?check=$GITHUB_SHA-$pass" | grep -F >/dev/null '7161373c7ccb48da9aa00e52214df1b8'
              echo CAVE_FIVE_REMOTE_DEPTH_LIVE_PUBLISH_PASS
              exit 0
            fi
            sleep 4
          done
          echo CAVE_FIVE_REMOTE_DEPTH_LIVE_VERIFY_FAILED
          exit 1

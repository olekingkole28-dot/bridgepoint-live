                      for y in range(0,N,128):rect((0,y,N,y+5),(54,67,76))
              out=io.BytesIO();im.save(out,format='PNG',optimize=True);return out.getvalue()
          buf=bytearray();views=[];acc=[];images=[];textures=[];materials=[];prims=[]

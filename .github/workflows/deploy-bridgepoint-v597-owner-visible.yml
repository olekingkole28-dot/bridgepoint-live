name: Deploy BridgePoint V599 — Visible Local AI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-bridgepoint-v597-owner-visible.yml
      - experience/owner-ai-control-v598.html
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble visible local-AI V599
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site && mkdir site
          git archive --format=tar origin/live-artifact | tar -xf - -C site
          test -s site/app/index.html
          test -s site/owner/index.html
          test -s site/owner/completion/index.html
          test -s site/owner/local-ai/index.html
          test -s experience/owner-ai-control-v598.html
          cp experience/owner-ai-control-v598.html site/owner/ai/control/index.html
          python - <<'PY'
          from pathlib import Path
          app=Path('site/app/index.html'); s=app.read_text(encoding='utf-8')
          # Normalize whichever owner-visible overlay is in the durable artifact.
          for old in ('597','598'):
              s=s.replace(f'bp-owner-visible-v{old}', 'bp-owner-visible-v599')
              s=s.replace(f'bpv{old}', 'bpv599')
              s=s.replace(f'LIVE V{old}', 'LIVE V599')
              s=s.replace(f'v={old}', 'v=599')
          if 'bp-owner-visible-v599' not in s:
              raise SystemExit('owner-visible launcher missing from durable app')
          # Reuse the already-proven V551 owner authorization signal, avoiding a second auth detector.
          bridge='''<script id="bp-owner-visible-v599-bridge">(()=>{const sync=()=>{const old=document.getElementById('bp-owner-launch-v551'),panel=document.getElementById('bp-owner-visible-v599');if(old?.classList.contains('show'))panel?.classList.add('show')};sync();setTimeout(sync,700);setTimeout(sync,1800);const old=document.getElementById('bp-owner-launch-v551');if(old)new MutationObserver(sync).observe(old,{attributes:true,attributeFilter:['class']});})();</script>'''
          if 'bp-owner-visible-v599-bridge' not in s:
              s=s.replace('</body>',bridge+'\n</body>',1)
          app.write_text(s,encoding='utf-8')

          owner=Path('site/owner/index.html'); s=owner.read_text(encoding='utf-8')
          for old in ('597','598'):
              s=s.replace(f'bp-owner-release-badge-v{old}','bp-owner-release-badge-v599').replace(f'LIVE OWNER RELEASE V{old}','LIVE OWNER RELEASE V599')
          if 'bp-owner-release-badge-v599' not in s:
              needle='<main id="dash" class="hidden">'
              badge='<div id="bp-owner-release-badge-v599" style="margin:0 0 10px;padding:10px 12px;border-radius:12px;border:1px solid #32694f;background:#10271d;color:#b8ffd9;font-weight:900">✅ LIVE OWNER RELEASE V599 · Local-First AI + Master Completion + National Depth published</div>'
              s=s.replace(needle,needle+badge,1)
          s=s.replace('Founder cockpit · V551','Founder cockpit · V599')
          s=s.replace('One screen for GPT-5.6 provider health, reviewer status, worker fleet, waiting tasks and recent reasoning calls.','Local-first runtime, PC reasoning node, worker fleet, ledger, national depth and overnight automation truth.')
          owner.write_text(s,encoding='utf-8')
          Path('site/owner/ai/v599-release.json').write_text('{"version":599,"release":"Visible Local-First AI + Master Completion","owner_launcher_in_app":true,"owner_launcher_uses_existing_admin_signal":true,"master_completion":"/owner/completion/","local_ai":"/owner/local-ai/","control_center":"/owner/ai/control/","provider_mode":"LOCAL_FIRST","hosted_reasoning_default":false,"customer_ai_system_changing":false}\n',encoding='utf-8')
          PY
          grep -q 'bp-owner-visible-v599' site/app/index.html
          grep -q 'bp-owner-visible-v599-bridge' site/app/index.html
          grep -q 'LIVE OWNER RELEASE V599' site/owner/index.html
          grep -q 'Founder cockpit · V599' site/owner/index.html
          grep -q 'bridgepoint_owner_ai_control_local_v598' site/owner/ai/control/index.html
          grep -q 'LOCAL_FIRST' site/owner/ai/control/index.html
          grep -q 'Master Completion' site/owner/completion/index.html
          grep -q 'BridgePoint Local AI Setup' site/owner/local-ai/index.html
          if grep -R -E -i 'SUPABASE_SERVICE_ROLE_KEY|sb_secret_|OPENAI_API_KEY|ANTHROPIC_API_KEY|sk-proj-|sk-ant-|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' site/app/index.html site/owner; then exit 1; fi
          touch site/.nojekyll site/app/.nojekyll
      - name: Persist durable V599
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/final-live && mkdir /tmp/final-live
          cp -a site/. /tmp/final-live/
          cd /tmp/final-live
          git init
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m 'BridgePoint V599 visible local AI'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish V599
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live V599
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 8 --retry-delay 3 'https://bridgepointintelligence.online/app/?v=599' -o /tmp/app.html
          curl -fsSL --retry 8 --retry-delay 3 'https://bridgepointintelligence.online/owner/?v=599' -o /tmp/owner.html
          curl -fsSL --retry 8 --retry-delay 3 'https://bridgepointintelligence.online/owner/ai/control/?v=599' -o /tmp/control.html
          curl -fsSL --retry 8 --retry-delay 3 'https://bridgepointintelligence.online/owner/completion/?v=599' -o /tmp/completion.html
          grep -q 'bp-owner-visible-v599' /tmp/app.html
          grep -q 'LIVE OWNER RELEASE V599' /tmp/owner.html
          grep -q 'LOCAL_FIRST' /tmp/control.html
          grep -q 'Master Completion' /tmp/completion.html

name: Publish FAA Layer Manager Cache Fix Only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-faa-gate-cache-v1.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check FAA-specific cache key and existing model renderer
        shell: bash
        run: |
          set -euo pipefail
          node --check rebuild-v5000/bridgepoint-faa-obstruction-towers-v1.js
          node --check rebuild-v5000/bridgepoint-drone-awareness-v1.js
          grep -Fq "if(value.startsWith('bp-faa-obstructions-'))return false" rebuild-v5000/bridgepoint-drone-awareness-v1.js
          grep -Fq "allowLayerCategory?.('faa',state.enabled)" rebuild-v5000/bridgepoint-faa-obstruction-towers-v1.js
          node tests/faa-obstruction-towers-v1.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          token='&faa-gate=8-no-icon-sweep'
          for p in (Path('rebuild-v5000/index.html'),Path('rebuild-v5000/app-index.html')):
            s=p.read_text()
            assert s.count(token)==1 and s.count('bridgepoint-drone-awareness-v1.js')>=1,str(p)
          print('FAA_GATE_CACHE_REPO_CHECK_PASS')
          PY
      - name: Ensure existing PC Cloudflare tunnel is healthy
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 --retry-all-errors -fsSL --max-time 25 https://characterization-seas-total-adopt.trycloudflare.com/auth/v1/health | grep -Fq '"local":true'
      - name: Find current complete Pages artifact
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          repo=os.environ['GITHUB_REPOSITORY']
          candidates=[]
          for page in (1,2,3):
            data=json.loads(subprocess.check_output(['gh','api',f'repos/{repo}/actions/artifacts?per_page=100&page={page}']))
            for a in data.get('artifacts',[]):
              name=a.get('name','')
              if a.get('expired') or (a.get('size_in_bytes') or 0)<10000000:continue
              if not (name.startswith('bridgepoint-v5000-') or name.startswith('github-pages-') or name.startswith('bridgepoint-auth-tunnel-recovery-v1') or name.startswith('bridgepoint-faa-')):continue
              run=a.get('workflow_run') or {}
              if run.get('id'):candidates.append((a.get('created_at',''),run['id'],name))
            if len(candidates)>=50:break
          candidates.sort(reverse=True)
          if not candidates:raise SystemExit('No retained full Pages baseline')
          created,runid,name=candidates[0]
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write(f'run_id={runid}\nartifact_name={name}\n')
          print('FAA_CACHE_BASELINE',created,runid,name)
          PY
      - name: Download unchanged current Pages site
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.baseline.outputs.artifact_name }}
          run-id: ${{ steps.baseline.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/faa-cache-baseline
      - name: Verify live site, replace only two existing script query URLs
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/faa-cache-site"
          ARCHIVE="$(find "$RUNNER_TEMP/faa-cache-baseline" -type f -name artifact.tar -print -quit)"
          test -n "$ARCHIVE"
          mkdir -p "$SITE"
          tar -xf "$ARCHIVE" -C "$SITE"
          export SITE
          python3 - <<'PY'
          import hashlib,json,os,urllib.request,re
          from pathlib import Path
          site=Path(os.environ['SITE'])
          protected=['index.html','app/index.html','landing.js','app.js',
            'bridgepoint-faa-obstruction-towers-v1.js','app/bridgepoint-faa-obstruction-towers-v1.js',
            'bridgepoint-drone-awareness-v1.js']
          for rel in protected:
            p=site/rel
            if not p.is_file():raise SystemExit('Missing existing production file '+rel)
            url='https://bridgepointintelligence.online/'+rel+'?faa-cache-baseline='+os.environ['GITHUB_SHA']
            request=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'BridgePoint-FAA-cache-guard'})
            with urllib.request.urlopen(request,timeout=40) as response:live=response.read()
            if hashlib.sha256(live).digest()!=hashlib.sha256(p.read_bytes()).digest():
              raise SystemExit('Live production mismatch '+rel+'; will not overwrite newer assets')
          before={p.relative_to(site).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
            for p in site.rglob('*') if p.is_file()}
          # Preserve the latest gate script version as-is (it can change when
          # another feature publishes); add only the FAA-specific cache marker.
          pattern=re.compile(r'(data-bp-deferred-src=")(/bridgepoint-drone-awareness-v1\\.js\\?[^"]+)(")')
          for rel in ('index.html','app/index.html'):
            p=site/rel
            s=p.read_text()
            matches=list(pattern.finditer(s))
            if len(matches)!=1:raise SystemExit('Expected exactly one deferred shared gate URL in '+rel)
            current=matches[0].group(2)
            if 'faa-gate=' in current:raise SystemExit('FAA gate marker already present; refusing duplicate')
            if 'faa=7-faa-persistent-no-sweep' not in s:
              raise SystemExit('Expected verified FAA v7 runtime entry key missing '+rel)
            replacement=current+'&faa-gate=8-no-icon-sweep'
            updated=s[:matches[0].start(2)]+replacement+s[matches[0].end(2):]
            if len(updated)<=len(s) or updated.count(replacement)!=1:raise SystemExit('FAA URL replacement invalid')
            p.write_text(updated)
            print('FAA_GATE_CACHE_PRESERVED_EXISTING_QUERY',rel,current)
          after={p.relative_to(site).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
            for p in site.rglob('*') if p.is_file()}
          changed={k for k in before if before[k]!=after.get(k)}
          if set(before)!=set(after) or changed!={'index.html','app/index.html'}:
            raise SystemExit('FAA cache scope violation '+json.dumps({'changed':sorted(changed),'added':sorted(set(after)-set(before)),'deleted':sorted(set(before)-set(after))}))
          assert (site/'data/bridgepoint-faa-obstructions-v1.json.gz').stat().st_size>100000
          assert (site/'app/data/bridgepoint-faa-obstructions-v1.json.gz').stat().st_size>100000
          print('FAA_GATE_CACHE_ONLY_TWO_FILES_CHANGED_PASS')
          PY
      - uses: actions/configure-pages@v5
      - name: Upload untouched production with only FAA gate cache references updated
        uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-v5000-faa-cache-${{ github.run_attempt }}
          path: ${{ runner.temp }}/faa-cache-site
          include-hidden-files: true
      - name: Publish two-file FAA cache correction
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deploy-pages-extended.mjs
      - name: Verify LIVE page URLs and actual FAA renderer
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html app/index.html; do
            curl --retry 8 --retry-all-errors -fsSL -H 'Cache-Control: no-cache' "https://bridgepointintelligence.online/$file?verify=$GITHUB_SHA" > "/tmp/faa-${file//\//-}"
            grep -Fq 'faa-gate=8-no-icon-sweep' "/tmp/faa-${file//\//-}"
            grep -Fq 'faa=7-faa-persistent-no-sweep' "/tmp/faa-${file//\//-}"
          done
          curl --retry 5 --retry-all-errors -fsSL -H 'Cache-Control: no-cache' "https://bridgepointintelligence.online/bridgepoint-drone-awareness-v1.js?verify=$GITHUB_SHA" > /tmp/faa-gate.js
          grep -Fq "if(value.startsWith('bp-faa-obstructions-'))return false" /tmp/faa-gate.js
          curl --retry 5 --retry-all-errors -fsSL -H 'Cache-Control: no-cache' "https://bridgepointintelligence.online/bridgepoint-faa-obstruction-towers-v1.js?verify=$GITHUB_SHA" > /tmp/faa-module.js
          grep -Fq "allowLayerCategory?.('faa',state.enabled)" /tmp/faa-module.js
          curl --retry 3 --retry-all-errors -fsSL https://characterization-seas-total-adopt.trycloudflare.com/auth/v1/health | grep -Fq '"local":true'
          echo 'LIVE_FAA_GATE_CACHE_REFRESH_PASS'

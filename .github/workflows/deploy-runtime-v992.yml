name: Deploy BridgePoint Runtime V992

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deploy-runtime-v992.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble v992 live artifact
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site && mkdir site
          git archive --format=tar origin/live-artifact | tar -xf - -C site
          test -s site/app/index.html
          test -s site/app/nav-clearance-v991.js
          node --check site/app/nav-clearance-v991.js
          node --check site/app/tab-handoff-v990.js
          node --check site/app/live-home-v984.js

      - name: Verify exact nav seam contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-bridgepoint-runtime="v992"' site/app/index.html
          grep -q 'nav-clearance-v991.js?v=992' site/app/index.html
          grep -q '__bridgepointNavClearanceV992' site/app/nav-clearance-v991.js
          grep -q 'clearance=Math.ceil(innerHeight-navTop)' site/app/nav-clearance-v991.js
          grep -q 'Math.max(72,Math.min(160,clearance))' site/app/nav-clearance-v991.js
          ! grep -q 'clearance=Math.ceil(innerHeight-top)+12' site/app/nav-clearance-v991.js
          ! grep -q 'Math.max(124' site/app/nav-clearance-v991.js
          grep -q 'tab-handoff-v990.js?v=992' site/app/index.html
          grep -q '"start_url": "./?bpv=v992"' site/app/manifest.json
          grep -q "BRIDGEPOINT_CACHE_RETIREMENT = 'v992'" site/app/flutter_service_worker.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy v992
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify v992 on actual public domain
        shell: bash
        run: |
          set -euo pipefail
          origin='https://bridgepointintelligence.online'
          for attempt in $(seq 1 30); do
            app="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${origin}/app/?v992=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            seam="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${origin}/app/nav-clearance-v991.js?v992=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            if printf '%s' "$app" | grep -q 'data-bridgepoint-runtime="v992"' \
              && printf '%s' "$app" | grep -q 'nav-clearance-v991.js?v=992' \
              && printf '%s' "$seam" | grep -q '__bridgepointNavClearanceV992' \
              && printf '%s' "$seam" | grep -q 'clearance=Math.ceil(innerHeight-navTop)'; then
              echo 'BridgePoint v992 exact Home-to-nav seam verified on public domain.'
              exit 0
            fi
            sleep 8
          done
          echo 'v992 did not converge on public domain' >&2
          exit 1

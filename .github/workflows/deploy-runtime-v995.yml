name: Deploy BridgePoint Runtime V995

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deploy-runtime-v995.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble v995 live artifact
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site && mkdir site
          git archive --format=tar origin/live-artifact | tar -xf - -C site
          test -s site/app/index.html
          test -s site/app/nav-clearance-v991.js
          node --check site/app/nav-clearance-v991.js
          node --check site/app/tab-handoff-v990.js
          test ! -e site/app/nav-seam-cover-v994.js

      - name: Verify no separate nav strip exists
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'data-bridgepoint-runtime="v995"' site/app/index.html
          grep -q 'nav-clearance-v991.js?v=995' site/app/index.html
          ! grep -q 'nav-seam-cover-v994.js' site/app/index.html
          grep -q 'mask-image:linear-gradient' site/app/nav-clearance-v991.js
          grep -q '#bp994-nav-seam-cover{display:none!important' site/app/nav-clearance-v991.js
          grep -q '"start_url": "./?bpv=v995"' site/app/manifest.json
          grep -q "BRIDGEPOINT_CACHE_RETIREMENT = 'v995'" site/app/flutter_service_worker.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy v995
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify v995 on actual public domain
        shell: bash
        run: |
          set -euo pipefail
          origin='https://bridgepointintelligence.online'
          for attempt in $(seq 1 30); do
            app="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${origin}/app/?v995=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            nav="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${origin}/app/nav-clearance-v991.js?v995=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            seam_code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -H 'Cache-Control: no-cache' "${origin}/app/nav-seam-cover-v994.js?v995=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            if printf '%s' "$app" | grep -q 'data-bridgepoint-runtime="v995"' \
              && ! printf '%s' "$app" | grep -q 'nav-seam-cover-v994.js' \
              && printf '%s' "$nav" | grep -q 'mask-image:linear-gradient' \
              && printf '%s' "$nav" | grep -q 'bp994-nav-seam-cover' \
              && [ "$seam_code" = "404" ]; then
              echo 'BridgePoint v995 verified: separate nav seam strip removed.'
              exit 0
            fi
            sleep 8
          done
          echo 'v995 did not converge on public domain' >&2
          exit 1

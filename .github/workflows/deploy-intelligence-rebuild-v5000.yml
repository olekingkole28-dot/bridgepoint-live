name: Deploy BridgePoint Intelligence V5000 Rebuild
# combined surface republish: growth-newsroom-v5102

on:
  push:
    branches: [main]
    paths:
      - 'rebuild-v5000/**'
      - 'release-v2300/world-v2300-config.js'
      - 'release-v2300/world-v2300-map.js'
      - 'release-v2300/world-v2300-worker.js'
      - '.github/workflows/deploy-intelligence-rebuild-v5000.yml'
      - 'app/horizon/**'
      - 'app/horizon-playable/**'
      - 'discover/**'
      - 'newsroom/**'
      - 'claims-terminal/**'
      - 'terminal/**'
      - 'integrity-index/**'
      - 'settlement-lab/**'
      - 'distribution/**'
      - 'articles/**'
      - 'articles/bridgepoint-facts.json'
      - 'current-map-entry.js'
      - 'acquisition_tracker.js'
      - 'founder-access.js'
      - 'founder-access.css'
      - 'founder-access/**'
      - 'for-roofers/**'
      - 'for-solar/**'
      - 'for-restoration/**'
      - 'for-public-adjusters/**'
      - 'for-property-managers/**'
      - 'sample/**'
      - 'owner/acquisition/**'
      - 'enterprise/**'
      - 'investors/**'
      - 'press/**'
      - 'answers/**'
      - 'founder/**'
      - 'language-selector-v5200.css'
      - 'llms-full.txt'
      - 'llms.txt'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'language-selector-v5200.js'
      - 'search-sitemap.xml'
      - 'bridgepoint-knowledge.jsonld'
      - 'ai-index.json'
      - 'discovery-facts.json'
      - 'search/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build clean Intelligence-only artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          git fetch origin live-artifact:refs/remotes/origin/live-artifact --depth=1
          git archive refs/remotes/origin/live-artifact | tar -xf - -C site
          mkdir -p site/vendor

          # Keep only the current Intelligence workspace plus the current Horizon lobby and playable runtime.
          # Other historical /app/... URLs fall through the V5000 404 back to the live map.
          rm -rf site/app site/discover site/search site/newsroom site/claims-terminal site/terminal site/integrity-index site/settlement-lab site/distribution site/articles/auto site/founder-access site/for-roofers site/for-solar site/for-restoration site/for-public-adjusters site/for-property-managers site/sample site/founder site/answers site/press site/investors site/enterprise site/owner/acquisition
          mkdir -p site/app site/articles
          cp -a discover site/discover
          if [ -d search ]; then cp -a search site/search; fi
          if [ ! -d newsroom ]; then python scripts/publish_growth_newsroom_v5100.py; fi
          cp -a newsroom site/newsroom
          cp -a claims-terminal site/claims-terminal
          cp -a terminal site/terminal
          cp -a integrity-index site/integrity-index
          cp -a settlement-lab site/settlement-lab
          cp -a distribution site/distribution
          (cd distribution && zip -qr ../site/distribution/bii-browser-extension.zip bii-browser-extension)
          cp -a articles/auto site/articles/auto
          find articles -maxdepth 1 -type f -exec cp -f {} site/articles/ \;
          cp articles/bridgepoint-facts.json site/articles/bridgepoint-facts.json
          cp -a app/horizon site/app/horizon
          cp -a app/horizon-playable site/app/horizon-playable
          cp current-map-entry.js site/current-map-entry.js
          cp acquisition_tracker.js site/acquisition_tracker.js
          for f in discovery-facts.json ai-index.json bridgepoint-knowledge.jsonld search-sitemap.xml language-selector-v5200.js language-selector-v5200.css; do
            if [ -f "$f" ]; then cp "$f" "site/$f"; fi
          done
          cp founder-access.js site/founder-access.js
          cp founder-access.css site/founder-access.css
          cp -a founder-access site/founder-access
          cp -a for-roofers site/for-roofers
          cp -a for-solar site/for-solar
          cp -a for-restoration site/for-restoration
          cp -a for-public-adjusters site/for-public-adjusters
          cp -a for-property-managers site/for-property-managers
          cp -a sample site/sample
          cp -a founder site/founder
          cp -a answers site/answers
          cp -a press site/press
          if [ -d investors ]; then cp -a investors site/investors; fi
          if [ -d enterprise ]; then cp -a enterprise site/enterprise; fi
          mkdir -p site/owner
          cp -a owner/acquisition site/owner/acquisition
          cp rebuild-v5000/index.html site/index.html
          cp rebuild-v5000/app-index.html site/app/index.html
          cp rebuild-v5000/landing.css site/landing.css
          cp rebuild-v5000/landing.js site/landing.js
          cp rebuild-v5000/styles.css site/styles.css
          cp rebuild-v5000/app.js site/app.js
          cp rebuild-v5000/manifest.webmanifest site/manifest.webmanifest
          cp rebuild-v5000/sw.js site/sw.js
          cp rebuild-v5000/404.html site/404.html
          cp rebuild-v5000/bridgepoint-mark.svg site/bridgepoint-mark.svg
          cp robots.txt sitemap.xml llms.txt llms-full.txt site/

          # Funnel legacy public content to the current map and attach the language selector.
          python - <<'PY'
          from pathlib import Path
          funnel='<script defer src="/current-map-entry.js?v=5100"></script>'
          lang_js='<script defer src="/language-selector-v5200.js"></script>'
          lang_css='<link rel="stylesheet" href="/language-selector-v5200.css">'
          for p in Path('site').rglob('*.html'):
              rel=p.relative_to('site').as_posix()
              if rel.startswith(('owner/','admin/')):
                  continue
              text=p.read_text(encoding='utf-8',errors='ignore')
              language_ok=not rel.startswith('app/horizon-playable/')
              if language_ok and lang_css not in text and '</head>' in text:
                  text=text.replace('</head>',lang_css+'</head>',1)
              if language_ok and lang_js not in text:
                  text=text.replace('</body>',lang_js+'</body>',1) if '</body>' in text else text+lang_js
              if rel not in {'index.html','app/index.html'} and not rel.startswith('app/') and funnel not in text:
                  text=text.replace('</body>',funnel+'</body>',1) if '</body>' in text else text+funnel
              p.write_text(text,encoding='utf-8')
          PY

          # /app is the full workspace; root is the public BridgePoint product surface.

          # Carry forward only the proven map engine pieces used by the new shell.
          cp release-v2300/world-v2300-config.js site/world-v2300-config.js
          cp release-v2300/world-v2300-map.js site/world-v2300-map.js
          cp release-v2300/world-v2300-worker.js site/world-v2300-worker.js

          curl --retry 4 --retry-all-errors --retry-delay 2 -fsSL https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.2/dist/maplibre-gl.js -o site/vendor/maplibre-gl.js
          curl --retry 4 --retry-all-errors --retry-delay 2 -fsSL https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.2/dist/maplibre-gl.css -o site/vendor/maplibre-gl.css
          curl --retry 4 --retry-all-errors --retry-delay 2 -fsSL https://cdn.jsdelivr.net/npm/pmtiles@4.5.0/dist/pmtiles.js -o site/vendor/pmtiles.js

          printf '%s\n' 'bridgepointintelligence.online' > site/CNAME
          touch site/.nojekyll site/app/.nojekyll

          node --check site/app.js
          node --check site/landing.js
          node --check site/world-v2300-config.js
          node --check site/world-v2300-map.js
          node --check site/world-v2300-worker.js
          node --check site/app/horizon/app.js
          node --check site/app/horizon/lobby-scene.js
          node --check site/app/horizon/model-preview.js
          node --check site/app/horizon-playable/horizon-v2.js

          grep -Fq 'BP_FRONTEND_V5000' site/index.html
          grep -Fq 'bridgepoint_frontend_status_v5000' site/app.js
          grep -Fq 'bridgepoint_public_building_detail_v5000' site/app.js
          grep -Fq 'bridgepoint_public_building_detail_by_id_v5024' site/app.js
          grep -Fq 'onBuildingSelect' site/app.js
          grep -Fq 'onBuildingSelect' site/world-v2300-map.js
          grep -Fq '__BP_V5000_SELECT_BUILDING__' site/app.js
          grep -Fq '__BP_V5000_SELECT_BUILDING__' site/world-v2300-map.js
          grep -Fq 'bridgepoint_public_context_v5003' site/app.js
          grep -Fq 'bridgepoint_public_weather_bootstrap_v5004' site/app.js
          grep -Fq 'bridgepoint_public_building_parts_v5000' site/app.js
          grep -Fq 'bridgepoint_public_foundation_sample_v5011' site/app.js
          grep -Fq 'bridgepoint_public_opportunity_viewport_v5025' site/app.js
          grep -Fq 'gta-place-label' site/world-v2300-map.js
          grep -Fq 'gta-road-label-major' site/world-v2300-map.js
          grep -Fq 'gta-poi-probe' site/world-v2300-map.js
          grep -Fq 'gta-poi-label' site/world-v2300-map.js
          grep -Fq 'gta-opportunity-buildings' site/world-v2300-map.js
          grep -Fq 'gta-opportunity-label' site/world-v2300-map.js
          grep -Fq 'interactionPriorityScheduling:true' site/world-v2300-map.js
          grep -Fq 'scheduleExact' site/world-v2300-map.js
          grep -Fq "Noto Sans Regular" site/world-v2300-map.js
          grep -Fq 'bridgepoint-public-building-tile-v5019' site/app.js
          grep -Fq 'bridgepoint-public-building-tile-v5019' site/world-v2300-map.js
          grep -Fq 'prefillBuildingFromFeature' site/app.js
          grep -Fq 'bFootprintArea' site/app.js
          grep -Fq 'bProvDataset' site/app.js
          grep -Fq "11.4,.86,13,.92,15,.97,18,.99" site/world-v2300-map.js
          ! grep -Fq "map.getSource('selected')?.setData" site/world-v2300-map.js
          grep -Fq 'transportArchive' site/app.js
          grep -Fq 'transportRuntime' site/app.js
          grep -Fq 'bridgepoint-transport-runtime-broker-v2716' site/app.js
          grep -Fq 'bp-v2716-transport-segments' site/app.js
          test -s site/vendor/pmtiles.js
          grep -Fq 'BP_LANDING_V5050' site/index.html
          grep -Fq 'authModal' site/index.html
          grep -Fq 'toggleLiveContext' site/app/index.html
          grep -Fq 'bottomNav' site/app/index.html
          grep -Fq 'bindPerformanceGovernor' site/app.js
          grep -Fq 'BP_MOBILE' site/app.js
          grep -Fq 'scheduleOpportunityBuildings' site/app.js
          grep -Fq 'MOBILE?650' site/world-v2300-map.js
          grep -Fq 'mobileMotion' site/world-v2300-map.js
          test -s site/app/horizon/index.html
          test -s site/current-map-entry.js
          test -s site/founder-access/index.html
          test -s site/for-roofers/index.html
          test -s site/for-solar/index.html
          test -s site/sample/index.html
          test -s site/owner/acquisition/index.html
          grep -Fq 'BILLING OFF' site/founder-access/index.html
          grep -Fq 'founder-access.js' site/for-roofers/index.html
          ! grep -Fq 'bridgepoint-territory-report-v674' site/sample/index.html
          test -s site/discover/index.html
          test -s site/newsroom/index.html
          test -s site/newsroom/manifest.json
          test -s site/claims-terminal/index.html
          test -s site/claims-terminal/claims-lifecycle.json
          test -s site/claims-terminal/feed.xml
          test -s site/terminal/index.html
          test -s site/terminal/terminal.js
          test -s site/terminal/terminal.css
          test -s site/integrity-index/index.html
          test -s site/integrity-index/integrity.js
          test -s site/integrity-index/contract.json
          test -s site/settlement-lab/index.html
          test -s site/settlement-lab/settlement.js
          test -s site/settlement-lab/contract.json
          test -s site/distribution/index.html
          test -s site/distribution/gis-widget/index.html
          test -s site/distribution/gis-widget/widget.js
          test -s site/distribution/gis-widget/embed.js
          test -s site/distribution/openapi.json
          test -s site/distribution/bii-browser-extension.zip
          node --check site/distribution/gis-widget/widget.js
          node --check site/distribution/gis-widget/embed.js
          grep -Fq '/current-map-entry.js?v=5100' site/discover/index.html
          test -s site/app/horizon-playable/v2-entry.html
          test -s site/app/horizon-playable/horizon-v2.js
          test -s site/app/horizon-playable/assets/characters/mesh2motion/models/swat_male.glb
          echo "V5000 CLEAN INTELLIGENCE ARTIFACT READY"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-v5000
          path: site

      - name: Deploy clean V5000 surface
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: bridgepoint-v5000

      - name: Verify production cutover
        shell: bash
        run: |
          set -euo pipefail
          O='https://bridgepointintelligence.online'
          ok=0
          for i in $(seq 1 45); do
            q="${GITHUB_SHA}-${i}-$(date +%s)"
            curl --retry 3 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/?v5050=${q}" -o /tmp/root.html || true
            curl --retry 3 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/app/?v5050=${q}" -o /tmp/app.html || true
            curl --retry 3 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/app.js?v5050=${q}" -o /tmp/app.js || true
            if grep -Fq 'BP_LANDING_V5050' /tmp/root.html && grep -Fq 'authModal' /tmp/root.html && grep -Fq 'BP_FRONTEND_V5000' /tmp/app.html && grep -Fq 'toggleLiveContext' /tmp/app.html && grep -Fq 'bridgepoint_frontend_status_v5000' /tmp/app.js && grep -Fq 'bindPerformanceGovernor' /tmp/app.js && grep -Fq 'bridgepoint_public_weather_bootstrap_v5004' /tmp/app.js; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
          grep -Fq 'BRIDGEPOINT' /tmp/root.html
          ! grep -Eiq 'HORIZON|battle pass|zombie|game mode' /tmp/root.html
          q="${GITHUB_SHA}-surface-check-$(date +%s)"
          curl --retry 3 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/app/horizon/?v5100=${q}" -o /tmp/horizon.html
          curl --retry 3 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/app/horizon-playable/v2-entry.html?v5100=${q}" -o /tmp/horizon-playable.html
          curl --retry 3 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/discover/?v5100=${q}" -o /tmp/discover.html
          curl --retry 3 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/newsroom/?v5100=${q}" -o /tmp/newsroom.html
          curl --retry 3 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/claims-terminal/?v5100=${q}" -o /tmp/claims-terminal.html
          curl --retry 3 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/terminal/?v5100=${q}" -o /tmp/terminal.html
          curl --retry 3 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/integrity-index/?v5100=${q}" -o /tmp/integrity-index.html
          curl --retry 3 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/settlement-lab/?v5100=${q}" -o /tmp/settlement-lab.html
          curl --retry 3 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/distribution/?v5202=${q}" -o /tmp/distribution.html
          curl --retry 3 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/distribution/gis-widget/?v5202=${q}" -o /tmp/gis-widget.html
          curl --retry 3 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/founder-access/?v5100=${q}" -o /tmp/founder.html
          curl --retry 3 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/for-solar/?v5100=${q}" -o /tmp/solar.html
          curl --retry 3 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/sample/?v5100=${q}" -o /tmp/sample.html
          test -s /tmp/horizon.html
          test -s /tmp/horizon-playable.html
          grep -Fq 'Live Match' /tmp/horizon-playable.html
          test -s /tmp/discover.html
          test -s /tmp/newsroom.html
          test -s /tmp/claims-terminal.html
          test -s /tmp/terminal.html
          test -s /tmp/integrity-index.html
          test -s /tmp/settlement-lab.html
          test -s /tmp/distribution.html
          test -s /tmp/gis-widget.html
          test -s /tmp/founder.html
          test -s /tmp/solar.html
          test -s /tmp/sample.html
          grep -Fq 'BILLING OFF' /tmp/founder.html
          grep -Fq 'Property intelligence for solar teams' /tmp/solar.html
          ! grep -Fq 'bridgepoint-territory-report-v674' /tmp/sample.html
          grep -Fq 'GROWTH NEWSROOM' /tmp/newsroom.html
          grep -Fq 'Claims Lifecycle Terminal' /tmp/claims-terminal.html
          grep -Fq 'Institutional Terminal' /tmp/terminal.html
          grep -Fq 'BridgePoint Integrity Index' /tmp/integrity-index.html
          grep -Fq 'BridgePoint Settlement Lab' /tmp/settlement-lab.html
          grep -Fq 'Distribution Network' /tmp/distribution.html
          grep -Fq 'BridgePoint GIS Property Widget' /tmp/gis-widget.html
          grep -Fq 'BRIDGEPOINT' /tmp/horizon.html
          grep -Fq 'current-map-entry.js?v=5100' /tmp/discover.html
          echo BRIDGEPOINT_V5100_COMBINED_SURFACES_PASS

      - name: Android smoke
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          cd /tmp
          npm init -y >/dev/null 2>&1 || true
          npm install puppeteer-core@24 --no-audit --no-fund >/dev/null 2>&1
          CHROME_PATH="$CHROME" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox','--disable-dev-shm-usage','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
            try{
              const p=await browser.newPage();
              await p.setUserAgent('Mozilla/5.0 (Linux; Android 16; Pixel 9a) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36');
              await p.setViewport({width:390,height:844,deviceScaleFactor:2,isMobile:true,hasTouch:true});
              const errors=[];p.on('pageerror',e=>errors.push(String(e.message||e)));
              await p.goto('https://bridgepointintelligence.online/app/?qa=v5063-'+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
              await p.waitForFunction(()=>window.__BP_FRONTEND_VERSION===5000,{timeout:10000});
              await p.waitForFunction(()=>document.getElementById('canonicalProperties')?.textContent?.includes(','),{timeout:15000});
              await p.waitForFunction(()=>document.querySelectorAll('#liveMap canvas').length===1,{timeout:25000});
              await p.waitForFunction(()=>!!document.getElementById('bpTabContext')&&!!document.getElementById('bXrayUnderground')&&!!document.getElementById('toggleLiveContext')&&!!document.getElementById('ctxSurfaceMaterial')&&!!document.getElementById('ctxSurfaceSource')&&!!document.getElementById('transportArchive')&&!!document.getElementById('transportRuntime'),{timeout:10000});
              await p.waitForFunction(()=>!!window.__BP_V5000_WORLD?.map?.getLayer('bp-v5004-weather-points'),{timeout:25000});
              await p.waitForFunction(()=>{
                const m=window.__BP_V5000_WORLD?.map;
                return !!m?.getLayer('gta-place-label')&&!!m?.getLayer('gta-road-label-major')&&!!m?.getLayer('gta-poi-label')&&!!m?.getLayer('gta-opportunity-buildings')&&!!m?.getLayer('gta-opportunity-label');
              },{timeout:15000});
              const launch=await p.evaluate(()=>{
                const m=window.__BP_V5000_WORLD?.map;
                const lang=document.querySelector('.topbar-actions > .bp-language--topbar select');
                return {
                  center:m?[m.getCenter().lng,m.getCenter().lat]:null,
                  zoom:m?.getZoom?.()??null,
                  languageTopbar:!!lang,
                  weatherMinZoom:m?.getLayer('bp-v5004-weather-points')?.minzoom??99
                };
              });
              if(!launch.languageTopbar||!launch.center||Math.abs(launch.center[0]+98.5)>2||Math.abs(launch.center[1]-39.5)>2||launch.zoom>3.6||launch.weatherMinZoom>3.6)throw new Error('NATIONAL_LAUNCH_CONTRACT '+JSON.stringify(launch));
              await p.evaluate(()=>{
                const m=window.__BP_V5000_WORLD?.map;
                m?.jumpTo({center:[-98.5,39.5],zoom:4.2,pitch:0,bearing:0});
              });
              await p.waitForFunction(()=>{
                const m=window.__BP_V5000_WORLD?.map;
                if(!m)return false;
                try{return m.queryRenderedFeatures({layers:['gta-place-label']}).length>0}catch{return false}
              },{timeout:20000});
              console.log('BRIDGEPOINT_TEXT_LABELS_RENDERED',JSON.stringify(launch));
              await p.evaluate(()=>{
                const m=window.__BP_V5000_WORLD?.map;
                if(!m)throw new Error('semantic map unavailable');
                m.jumpTo({center:[-73.9857,40.7484],zoom:16.4,pitch:52,bearing:0});
                setTimeout(()=>window.__BP_REFRESH_SEMANTIC_LABELS__?.(),700);
              });
              await p.waitForFunction(()=>{
                const s=window.__BP_SEMANTIC_STATS;
                return Number(s?.features||0)>0&&Number(s?.anchored||0)>0;
              },{timeout:30000});
              console.log('BRIDGEPOINT_SEMANTIC_BUILDING_LABELS_PASS',await p.evaluate(()=>JSON.stringify(window.__BP_SEMANTIC_STATS||{})));
              await p.waitForFunction(()=>!!window.__BP_PERFORMANCE_GOVERNOR__,{timeout:10000});
              const perfState=await p.evaluate(async()=>{
                const m=window.__BP_V5000_WORLD?.map,g=window.__BP_PERFORMANCE_GOVERNOR__;
                if(!m||!g)throw new Error('performance governor unavailable');
                const before={interacting:g.interacting,queued:g.queued};
                m.easeTo({center:[-72.92,41.31],zoom:15.2,duration:420});
                await new Promise(r=>setTimeout(r,100));
                const during={interacting:g.interacting,queued:g.queued};
                await new Promise(r=>setTimeout(r,520));
                const after={interacting:g.interacting,queued:g.queued};
                return {before,during,after}
              });
              console.log('BRIDGEPOINT_PERFORMANCE_GOVERNOR',JSON.stringify(perfState));
              if(perfState.during.interacting!==true)throw new Error('PERFORMANCE_GOVERNOR_DID_NOT_ENTER '+JSON.stringify(perfState));
              await p.waitForFunction(()=>window.__BP_PERFORMANCE_GOVERNOR__?.interacting===false,{timeout:2500});
              const frameProbe=await p.evaluate(async()=>{
                const m=window.__BP_V5000_WORLD?.map;if(!m)throw new Error('frame probe map missing');
                const gaps=[];let active=true,last=performance.now();
                const tick=t=>{gaps.push(t-last);last=t;if(active)requestAnimationFrame(tick)};
                requestAnimationFrame(tick);
                const moves=[
                  {center:[-72.90,41.30],zoom:15.7,pitch:56,bearing:-14},

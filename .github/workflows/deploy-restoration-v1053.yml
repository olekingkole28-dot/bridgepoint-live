name: Deploy BridgePoint Restoration V1053

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-restoration-v1053.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble validated V1053 artifact
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site && mkdir site
          git archive --format=tar origin/live-artifact | tar -xf - -C site

          test -s site/app/index.html
          test -s site/app/owner-command-center-v1053.js
          test -s site/app/national-state-experience-v1053.js
          test -s site/app/property-visual-first-v1053.js
          test -s site/app/preapp-national-proof-v1053.js
          test -s site/app/property-360-v1046.js
          test -s site/app/customer-surfaces-v1042.js
          test -s site/app/owner-business-pulse-v993.js
          test -s site/app/single-shell-v1044.js

          node --check site/app/owner-command-center-v1053.js
          node --check site/app/national-state-experience-v1053.js
          node --check site/app/property-visual-first-v1053.js
          node --check site/app/preapp-national-proof-v1053.js
          node --check site/app/property-360-v1046.js
          node --check site/app/customer-surfaces-v1042.js
          node --check site/app/owner-business-pulse-v993.js
          node --check site/app/single-shell-v1044.js

          grep -q 'data-bridgepoint-runtime="v1053"' site/app/index.html
          grep -q 'owner-command-center-v1053.js?v=1053' site/app/index.html
          grep -q 'national-state-experience-v1053.js?v=1053' site/app/index.html
          grep -q 'property-visual-first-v1053.js?v=1053' site/app/index.html
          grep -q 'preapp-national-proof-v1053.js?v=1053' site/app/index.html
          grep -q 'bridgepoint_owner_command_center_v1053' site/app/owner-command-center-v1053.js
          grep -q 'gross_customer_churn_rate' site/app/owner-command-center-v1053.js
          grep -q 'bridgepoint_state_experience_v1053' site/app/national-state-experience-v1053.js
          grep -q 'bridgepoint_property_media_bundle_v169' site/app/national-state-experience-v1053.js
          grep -q 'bridgepoint_property_source_3d_v855' site/app/property-visual-first-v1053.js
          grep -q 'bridgepoint_property_geometry_v854' site/app/property-visual-first-v1053.js
          grep -q 'bridgepoint_public_national_progress_v1053' site/app/preapp-national-proof-v1053.js
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' site/app/*.js site/app/index.html
          touch site/.nojekyll site/app/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy V1053
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public V1053 and nationwide truth backend
        shell: bash
        run: |
          set -euo pipefail
          origin='https://bridgepointintelligence.online'
          project='https://xdfsjztwgsbmabshzsjw.supabase.co'
          key='sb_publishable_lM9oWQeHjBmgOIiteeOicQ_PTyAeF25'
          for attempt in $(seq 1 45); do
            salt="${GITHUB_SHA}-${attempt}-$(date +%s)"
            app="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache, no-store' "${origin}/app/?bpv=1053&verify=${salt}" 2>/dev/null || true)"
            owner="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache, no-store' "${origin}/app/owner-command-center-v1053.js?verify=${salt}" 2>/dev/null || true)"
            nation="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache, no-store' "${origin}/app/national-state-experience-v1053.js?verify=${salt}" 2>/dev/null || true)"
            visual="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache, no-store' "${origin}/app/property-visual-first-v1053.js?verify=${salt}" 2>/dev/null || true)"
            preapp="$(curl -fsSL --max-time 20 -H 'Cache-Control: no-cache, no-store' "${origin}/app/preapp-national-proof-v1053.js?verify=${salt}" 2>/dev/null || true)"
            progress="$(curl -fsSL --max-time 20 -X POST "${project}/rest/v1/rpc/bridgepoint_public_national_progress_v1053" -H "apikey: ${key}" -H "Authorization: Bearer ${key}" -H 'Content-Type: application/json' -d '{}' 2>/dev/null || true)"
            if printf '%s' "$app" | grep -q 'data-bridgepoint-runtime="v1053"' \
              && printf '%s' "$app" | grep -q 'owner-command-center-v1053.js?v=1053' \
              && printf '%s' "$app" | grep -q 'national-state-experience-v1053.js?v=1053' \
              && printf '%s' "$app" | grep -q 'property-visual-first-v1053.js?v=1053' \
              && printf '%s' "$app" | grep -q 'preapp-national-proof-v1053.js?v=1053' \
              && printf '%s' "$owner" | grep -q 'BridgePointOwnerCommandV1053' \
              && printf '%s' "$nation" | grep -q 'BridgePointNationalExperienceV1053' \
              && printf '%s' "$visual" | grep -q 'BridgePointPropertyVisualV1053' \
              && printf '%s' "$preapp" | grep -q 'bridgepoint_public_national_progress_v1053' \
              && printf '%s' "$progress" | grep -q 'canonical_properties' \
              && printf '%s' "$progress" | grep -q 'Connecticut'; then
              echo 'V1053 verified publicly: owner acquisition/CRM/churn/investor command center, nationwide state loading, imagery-led property cards, visual-first 3D Property 360, and pre-app nationwide proof are live.'
              exit 0
            fi
            sleep 8
          done
          echo 'V1053 public verification did not converge.' >&2
          exit 1

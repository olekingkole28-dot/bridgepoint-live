                  assert abs(ox-int(key.split('_')[0])*512)<1 and abs(oz-int(key.split('_')[1])*512)<1
                  def section(name):
                      v=sections[name];types={'Uint8Array':1,'Float32Array':4,'Uint32Array':4,'Int16Array':2,'Uint16Array':2}
                      return memoryview(raw)[offset+v['offset']:offset+v['offset']+v['length']*types[v['type']]]

name: Validate source weather layers v6130

on:
  push:
    branches: [weather-source-overlays-rain-lightning]
    paths:
      - 'release-v2300/**'
      - 'rebuild-v5000/app.js'
      - 'rebuild-v5000/landing.js'
      - 'rebuild-v5000/bridgepoint-view-v5917.js'
      - '.github/workflows/validate-weather-source-overlays-v6130.yml'
  pull_request:
    branches: [main]
    paths:
      - 'release-v2300/world-v2300-weather.js'
      - 'release-v2300/world-v2300-rain.js'
      - 'release-v2300/world-v2300-clouds.js'
      - 'release-v2300/world-v2300-lightning.js'
      - 'release-v2300/world-v2300-time-slider.js'
      - 'release-v2300/world-v2300-bootstrap.js'
      - 'rebuild-v5000/app.js'
      - 'rebuild-v5000/landing.js'
      - 'rebuild-v5000/bridgepoint-view-v5917.js'
      - '.github/workflows/deploy-intelligence-rebuild-v5000.yml'
      - '.github/workflows/validate-weather-source-overlays-v6130.yml'

permissions:
  contents: read

jobs:
  validate-weather-source-overlays:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Parse the edited JavaScript modules
        shell: bash
        run: |
          set -euo pipefail
          node --check rebuild-v5000/app.js
          node --check rebuild-v5000/landing.js
          node --check rebuild-v5000/bridgepoint-view-v5917.js
          for file in \
            release-v2300/world-v2300-weather.js \
            release-v2300/world-v2300-rain.js \
            release-v2300/world-v2300-clouds.js \
            release-v2300/world-v2300-lightning.js \
            release-v2300/world-v2300-time-slider.js \
            release-v2300/world-v2300-bootstrap.js; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done
          node tests/celestial-water-cloud-shadows.test.mjs

      - name: Verify new weather layers remain separate from legacy effects
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'active=!!v;' release-v2300/world-v2300-weather.js
          grep -Fq "const LEGACY_NATIVE_WEATHER_LAYERS=['wx-snow-depth','wx-alert-fill','wx-fire-fill','wx-thermal','wx-quake-glow','wx-storm-glow']" release-v2300/world-v2300-weather.js
          grep -Fq "for(const id of ['wx-alert-line','wx-fire-line','wx-quake','wx-storm','wx-obs','wx-water'])" release-v2300/world-v2300-weather.js
          grep -Fq "bp-v5004-weather-shape-fill" rebuild-v5000/app.js
          grep -Fq "bp-landing-weather-fill" rebuild-v5000/landing.js
          grep -Fq 'BP_WEATHER_ICON_CATALOG_V6132' rebuild-v5000/app.js
          grep -Fq 'bp-v6132-weather-icons' rebuild-v5000/app.js
          grep -Fq 'bp-v6132-ground-radar' rebuild-v5000/app.js
          grep -Fq 'initialFetchRequested:true' rebuild-v5000/app.js
          grep -Fq 'BP_LANDING_WEATHER_ICON_CATALOG_V6132' rebuild-v5000/landing.js
          grep -Fq 'bp-landing-v6132-weather-icons' rebuild-v5000/landing.js
          ! grep -Fq 'window.__BP_CLOUDS_ONLY_PHASE_V6070__=true;' rebuild-v5000/app.js
          ! grep -Fq 'window.__BP_CLOUDS_ONLY_PHASE_V6070__=true;' rebuild-v5000/landing.js
          grep -Fq 'BP_SOURCE_WEATHER_CACHE_KEY_V6134' rebuild-v5000/app.js
          grep -Fq 'restoreCachedLiveWeatherFirstFrameV6134' rebuild-v5000/app.js
          grep -Fq 'warmLiveWeatherFirstFrameV6134' rebuild-v5000/app.js
          grep -Fq 'BP_SOURCE_WEATHER_CACHE_KEY_V6134' rebuild-v5000/landing.js
          grep -Fq 'restoreLandingWeatherFirstFrameV6134' rebuild-v5000/landing.js
          grep -Fq 'void startLandingNationalWeather(world)' rebuild-v5000/landing.js
          grep -Fq 'bp6133-noaa-geocolor-cloud-context' release-v2300/world-v2300-clouds.js
          grep -Fq 'initSatelliteCloudContextV6134' release-v2300/world-v2300-clouds.js
          grep -Fq 'Most_Recent_MERGEDGC/ImageServer/exportImage' release-v2300/world-v2300-clouds.js
          grep -Fq 'bp6130-cloud-expansion' release-v2300/world-v2300-lightning.js
          grep -Fq 'bp-landing-v6132-ground-radar' rebuild-v5000/landing.js
          grep -Fq "layout:{visibility:'visible'},paint:{'fill-color':landingWeatherColorExpr()" rebuild-v5000/landing.js
          ! grep -Fq 'active=CLOUDS_ONLY_PHASE()?true:!!v' release-v2300/world-v2300-weather.js
          ! grep -Fq 'enabled = CLOUDS_ONLY_PHASE() ? false : !!value;' release-v2300/world-v2300-rain.js
          ! grep -Fq "bp2300-rain-wet-ground-v6068','bp2300-rain-puddle-fill-v6068" release-v2300/world-v2300-weather.js
          grep -Fq 'const RAIN_START_ZOOM = MOBILE ? 8 : 7;' release-v2300/world-v2300-rain.js
          grep -Fq 'sourceRainAnchors' release-v2300/world-v2300-clouds.js
          grep -Fq 'const reportCandidates = raw.filter(isRainObservation);' release-v2300/world-v2300-rain.js
          grep -Fq 'export function initLightningLayer' release-v2300/world-v2300-lightning.js
          grep -Fq 'durationMs:2450' release-v2300/world-v2300-lightning.js
          grep -Fq 'BP_LISTINGS_MONEY_V6130' rebuild-v5000/bridgepoint-view-v5917.js
          grep -Fq 'sourceWeatherOverlaysPreserved:true' rebuild-v5000/app.js
          grep -Fq 'sourceWeatherOverlaysPreserved:true' rebuild-v5000/landing.js
          grep -Fq 'world-v2300-clouds.js?v=6134-source-satellite-clouds' rebuild-v5000/app.js
          grep -Fq 'world-v2300-clouds.js?v=6134-source-satellite-clouds' rebuild-v5000/landing.js
          grep -Fq 'world-v2300-clouds.js?v=6134-source-satellite-clouds' release-v2300/world-v2300-time-slider.js

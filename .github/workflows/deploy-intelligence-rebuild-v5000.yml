          include-hidden-files: true

      - name: Deploy clean V5000 surface
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: bridgepoint-v5000-${{ github.run_attempt }}

      - name: Verify production cutover
        shell: bash
        run: |
          set -euo pipefail
          O='https://bridgepointintelligence.online'
          ok=0
          for i in $(seq 1 45); do
            q="${GITHUB_SHA}-${i}-$(date +%s)"
            curl --retry 3 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/?v5410=${q}" -o /tmp/root.html || true
            curl --retry 3 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/app/?v5410=${q}" -o /tmp/app.html || true
            curl --retry 3 --retry-all-errors --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}/app.js?v5371=${q}" -o /tmp/app.js || true

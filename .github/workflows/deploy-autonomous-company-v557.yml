name: Deploy BridgePoint Autonomous Company V557

on:
  push:
    branches: [main]
    paths:
      - experience/owner-ai-v557.html
      - experience/owner-inbox-v557.html
      - experience/contact-v557.html
      - experience/investors-v557.html
      - experience/llms-v557.txt
      - .github/workflows/deploy-autonomous-company-v557.yml
  workflow_run:
    workflows:
      - "Deploy BridgePoint Live — Audited V443"
      - "Deploy BridgePoint Distribution V547"
      - "Deploy BridgePoint Experience V550"
      - "Deploy BridgePoint Owner Command Center V551"
      - "Deploy BridgePoint V552 — Dynamic Avatar Heal"
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy-autonomous-company:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble V557 on durable live artifact
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site /tmp/public-base
          mkdir -p site /tmp/public-base
          git archive --format=tar origin/live-artifact | tar -xf - -C /tmp/public-base
          cp -a /tmp/public-base/. site/

          test -s experience/owner-ai-v557.html
          test -s experience/owner-inbox-v557.html
          test -s experience/contact-v557.html
          test -s experience/investors-v557.html
          test -s experience/llms-v557.txt
          test -s site/owner/index.html

          mkdir -p site/owner/ai site/owner/inbox site/contact site/investors
          cp experience/owner-ai-v557.html site/owner/ai/index.html
          cp experience/owner-inbox-v557.html site/owner/inbox/index.html
          cp experience/contact-v557.html site/contact/index.html
          cp experience/investors-v557.html site/investors/index.html
          cp experience/llms-v557.txt site/llms.txt

          python - <<'PY'
          from pathlib import Path

          owner=Path('site/owner/index.html')
          o=owner.read_text(encoding='utf-8')
          marker='bp-v557-owner-links'
          if marker not in o:
              needle='<div class="launchgrid">'
              block='''<span id="bp-v557-owner-links" style="display:none"></span>
          <a class="launch" href="/owner/ai/"><b>🤖 AI Workforce</b><span>Talk to the Company Brain and watch every specialized worker, queue, failure and run.</span></a>
          <a class="launch" href="/owner/inbox/"><b>✉ Private Inbox</b><span>Customer, investor, partner and support messages in one owner-only conversation queue.</span></a>
          <a class="launch" href="/investors/"><b>💎 Investor Relations</b><span>See exactly what qualified investors and crawlers see publicly.</span></a>
          '''
              if needle not in o:
                  raise SystemExit('Owner launchgrid marker missing; refusing blind patch')
              o=o.replace(needle,needle+block,1)
          owner.write_text(o,encoding='utf-8')

          home=Path('site/index.html')
          h=home.read_text(encoding='utf-8')
          if 'href="/investors/"' not in h:
              needle='<a class="open" href="/app/'
              i=h.find(needle)
              if i<0: raise SystemExit('Homepage app nav anchor missing')
              h=h[:i]+'<a href="/investors/">Investors</a><a href="/contact/">Contact</a>'+h[i:]
          if 'bp-v557-contact-cta' not in h:
              needle='</main>'
              block='''<section class="wrap section" id="bp-v557-contact-cta"><div class="sample"><div><span class="kicker">Talk to BridgePoint</span><h2 style="margin:4px 0">Customer, investor, partner, press or just curious?</h2><p>Start a private conversation. Legitimate messages flow into the owner inbox; automated abuse is screened before it gets there.</p></div><div class="actions"><a class="btn primary" href="/contact/">Message BridgePoint</a><a class="btn secondary" href="/investors/">Investor relations</a></div></div></section>'''
              if needle not in h: raise SystemExit('Homepage main close missing')
              h=h.replace(needle,block+needle,1)
          home.write_text(h,encoding='utf-8')

          sitemap=Path('site/sitemap.xml')
          if sitemap.exists():
              x=sitemap.read_text(encoding='utf-8')
              for url,pri in [('https://bridgepointintelligence.online/investors/','0.90'),('https://bridgepointintelligence.online/contact/','0.75')]:
                  if url not in x:
                      row=f'  <url><loc>{url}</loc><changefreq>weekly</changefreq><priority>{pri}</priority></url>\n'
                      if '</urlset>' not in x: raise SystemExit('Sitemap close missing')
                      x=x.replace('</urlset>',row+'</urlset>',1)
              sitemap.write_text(x,encoding='utf-8')
          PY

          test -s site/owner/ai/index.html
          test -s site/owner/inbox/index.html
          test -s site/contact/index.html
          test -s site/investors/index.html
          test -s site/llms.txt
          grep -q 'bridgepoint_owner_ai_fleet_v557' site/owner/ai/index.html
          grep -q 'bridgepoint_owner_inbox_v556' site/owner/inbox/index.html
          grep -q 'bridgepoint_message_owner_v556' site/contact/index.html
          grep -q 'bridgepoint_public_investor_brief_v553' site/investors/index.html
          grep -q 'bp-v557-owner-links' site/owner/index.html
          grep -q 'bp-v557-contact-cta' site/index.html
          if grep -R -E -i 'SUPABASE_SERVICE_ROLE_KEY|sb_secret|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' site/owner/ai site/owner/inbox site/contact site/investors site/llms.txt; then
            echo 'Privileged secret marker found in V557 public artifact.' >&2
            exit 1
          fi
          touch site/.nojekyll site/app/.nojekyll
          echo 'BridgePoint V557 autonomous company surfaces assembled.'

      - name: Persist exact V557 live artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/final-live
          mkdir /tmp/final-live
          cp -a site/. /tmp/final-live/
          cd /tmp/final-live
          git init
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m 'BridgePoint live artifact with V557 autonomous company surfaces'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish BridgePoint V557
        id: deployment
        uses: actions/deploy-pages@v4

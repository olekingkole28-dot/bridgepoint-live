name: Deploy BridgePoint Instant Map World

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'staging/world-v2652/**'
      - 'staging/home-v2652/**'
      - '.github/workflows/deploy-world-v2652-overlay.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate staged V2662 world files
        run: |
          set -euo pipefail
          for f in \
            staging/world-v2652/index.html \
            staging/world-v2652/world-v2661-first-frame.js \
            staging/world-v2652/world-v2662-instant-map.js \
            staging/world-v2652/world-v2653-surface.js \
            staging/world-v2652/world-v2656-interaction.js \
            staging/world-v2652/world-v2657-experience.js \
            staging/world-v2652/world-v2657-status.js \
            staging/world-v2652/world-v2657-inspector.js \
            staging/world-v2652/world-v2659-hifi.js \
            staging/world-v2652/world-v2660-continuous-lod.js \
            staging/world-v2652/world-v2652-production.js \
            staging/world-v2652/world-v2652-actions.js \
            staging/world-v2652/world-v2652.css \
            staging/home-v2652/patch-live-app.py; do test -s "$f"; done
          node --check staging/world-v2652/world-v2661-first-frame.js
          node --check staging/world-v2652/world-v2662-instant-map.js
          node --check staging/world-v2652/world-v2653-surface.js
          node --check staging/world-v2652/world-v2656-interaction.js
          node --check staging/world-v2652/world-v2657-experience.js
          node --check staging/world-v2652/world-v2657-status.js
          node --check staging/world-v2652/world-v2657-inspector.js
          node --check staging/world-v2652/world-v2659-hifi.js
          node --check staging/world-v2652/world-v2660-continuous-lod.js
          node --check staging/world-v2652/world-v2652-production.js
          node --check staging/world-v2652/world-v2652-actions.js
          grep -Fq 'world-v2662-instant-map.js' staging/world-v2652/index.html
          grep -Fq 'BridgePointInstantMapV2662' staging/world-v2652/world-v2662-instant-map.js
          grep -Fq 'bp-v2662-us-instant' staging/world-v2652/world-v2662-instant-map.js
          grep -Fq 'bp-v2662-country-map' staging/world-v2652/world-v2662-instant-map.js
          grep -Fq 'bridgepoint-weather-us-v2662' staging/world-v2652/world-v2662-instant-map.js
          ! grep -Fq 'world-v2658-ground-labels.js' staging/world-v2652/index.html
          ! grep -Fq 'world-v2661-surface-labels.js' staging/world-v2652/index.html
          grep -Fq 'world-v2660-continuous-lod.js' staging/world-v2652/index.html
          grep -Fq 'My Location' staging/world-v2652/world-v2659-hifi.js
          grep -Fq 'Full U.S.' staging/world-v2652/world-v2659-hifi.js
          grep -Fq 'Ground View' staging/world-v2652/world-v2659-hifi.js
          grep -Fq 'instant-map-world-2662' staging/home-v2652/patch-live-app.py
          ! grep -Fq '<iframe' staging/home-v2652/patch-live-app.py
          ! grep -Fq 'WebMapServiceImageryProvider' staging/world-v2652/world-v2653-surface.js

      - name: Assemble direct V2662 instant map world
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site && mkdir site
          git archive --format=tar origin/live-artifact | tar -xf - -C site
          test -s site/app/index.html
          test -s site/app/flutter_service_worker.js
          test -s site/app/bridgepoint-3d-world/world-v2500.js
          test -s site/app/bridgepoint-3d-world/world-v2500.css

          cp staging/world-v2652/index.html site/app/bridgepoint-3d-world/index.html
          cp staging/world-v2652/world-v2661-first-frame.js site/app/bridgepoint-3d-world/world-v2661-first-frame.js
          cp staging/world-v2652/world-v2662-instant-map.js site/app/bridgepoint-3d-world/world-v2662-instant-map.js
          cp staging/world-v2652/world-v2653-surface.js site/app/bridgepoint-3d-world/world-v2653-surface.js
          cp staging/world-v2652/world-v2656-interaction.js site/app/bridgepoint-3d-world/world-v2656-interaction.js
          cp staging/world-v2652/world-v2657-experience.js site/app/bridgepoint-3d-world/world-v2657-experience.js
          cp staging/world-v2652/world-v2657-status.js site/app/bridgepoint-3d-world/world-v2657-status.js
          cp staging/world-v2652/world-v2657-inspector.js site/app/bridgepoint-3d-world/world-v2500-inspector.js
          cp staging/world-v2652/world-v2659-hifi.js site/app/bridgepoint-3d-world/world-v2659-hifi.js
          cp staging/world-v2652/world-v2660-continuous-lod.js site/app/bridgepoint-3d-world/world-v2660-continuous-lod.js
          cp staging/world-v2652/world-v2652-production.js site/app/bridgepoint-3d-world/world-v2652-production.js
          cp staging/world-v2652/world-v2652-actions.js site/app/bridgepoint-3d-world/world-v2652-actions.js
          cp staging/world-v2652/world-v2652.css site/app/bridgepoint-3d-world/world-v2652.css

          # Bundle boundaries into the application package. U.S. state geometry is tiny and is preloaded first;
          # the larger world-country file is deliberately deferred until after the U.S. first frame.
          curl -fsSL --retry 4 --retry-delay 1 'https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_50m_admin_0_countries.geojson' -o site/app/bridgepoint-3d-world/countries-50m.geojson
          curl -fsSL --retry 4 --retry-delay 1 'https://raw.githubusercontent.com/PublicaMundi/MappingAPI/master/data/geojson/us-states.json' -o site/app/bridgepoint-3d-world/us-states.geojson
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('site/app/bridgepoint-3d-world')
          for name in ('countries-50m.geojson','us-states.geojson'):
              data=json.loads((root/name).read_text())
              assert data.get('type')=='FeatureCollection' and len(data.get('features',[]))>20, name

          # Compatibility engine stays for property rendering only. Remove photographic basemap startup traffic,
          # make country loading non-blocking, and force the requested U.S. camera before any slower bootstrap.
          p=root/'world-v2500.js'
          s=p.read_text()
          s=s.replace("viewer.imageryLayers.addImageryProvider(globalImagery);","// V2662: photographic global imagery disabled by default")
          s=s.replace("viewer.imageryLayers.addImageryProvider(imagery);","// V2662: photographic U.S. imagery disabled by default")
          s=s.replace("  await loadCountries();\n  viewer.camera.setView({destination:Cesium.Cartesian3.fromDegrees(-98.35,39.35,5600000),orientation:{heading:0,pitch:Cesium.Math.toRadians(-88),roll:0}}); viewer.scene.requestRender();",
                      "  viewer.camera.setView({destination:Cesium.Cartesian3.fromDegrees(-98.35,39.35,5550000),orientation:{heading:0,pitch:Cesium.Math.toRadians(-88.5),roll:0}}); viewer.scene.requestRender();\n  loadCountries().catch(e=>console.warn('country bootstrap deferred',e));")
          s=s.replace("  await startAtUser();","  viewer.camera.setView({destination:Cesium.Cartesian3.fromDegrees(-98.35,39.35,5550000),orientation:{heading:0,pitch:Cesium.Math.toRadians(-88.5),roll:0}}); viewer.scene.requestRender();")
          p.write_text(s)
          assert 'viewer.imageryLayers.addImageryProvider(globalImagery);' not in s
          assert 'viewer.imageryLayers.addImageryProvider(imagery);' not in s
          assert 'await loadCountries();' not in s
          assert 'await startAtUser();' not in s
          PY
          node --check site/app/bridgepoint-3d-world/world-v2500.js

          rm -rf site/app/bridgepoint-world-v2652
          cp -a site/app/bridgepoint-3d-world site/app/bridgepoint-world-v2652
          python3 staging/home-v2652/patch-live-app.py

          grep -Fq 'instant-map-world-2662' site/app/index.html
          ! grep -Fq '<iframe' site/app/index.html
          ! grep -Fq 'flutter_bootstrap.js' site/app/index.html
          ! grep -Fq 'main.dart.js' site/app/index.html
          grep -Fq 'world-v2662-instant-map.js' site/app/bridgepoint-world-v2652/index.html
          grep -Fq 'BridgePointInstantMapV2662' site/app/bridgepoint-world-v2652/world-v2662-instant-map.js
          test -s site/app/bridgepoint-world-v2652/countries-50m.geojson
          test -s site/app/bridgepoint-world-v2652/us-states.geojson
          ! grep -Fq 'await loadCountries();' site/app/bridgepoint-world-v2652/world-v2500.js
          ! grep -Fq 'viewer.imageryLayers.addImageryProvider(globalImagery);' site/app/bridgepoint-world-v2652/world-v2500.js
          ! grep -Fq 'viewer.imageryLayers.addImageryProvider(imagery);' site/app/bridgepoint-world-v2652/world-v2500.js

          cat > site/app/bridgepoint-world-overlay-v2652.json <<EOF
          {"app_shell_version":2662,"map_only":true,"direct_map_navigation":true,"iframe":false,"flutter_ui_enabled":false,"first_frame":"US_CAMERA_SYNCHRONOUS","automatic_gps_on_boot":false,"us_state_bootstrap":"LOCAL_PRELOADED_FIRST","country_bootstrap":"DEFERRED_LOCAL_BUNDLED_GEOJSON","country_labels":"WORLD_FIXED_SURFACE_TEXTURES","state_labels":"WORLD_FIXED_SURFACE_TEXTURES","legacy_screen_country_labels":false,"us_jurisdictions_green":true,"foreign_countries_red_locked":true,"weather_start":"PARALLEL_FIRST_FRAME_WITH_LOCAL_CACHE","weather_full_us_distance":26000000,"weather_cache_minutes":20,"weather_refresh_seconds":300,"continuous_lod":true,"coarse_geometry_persists_until_refined":true,"predictive_camera_prefetch_ms":38,"navigation_controls":["My Location","Full U.S.","Ground View"],"graphics":{"high_fidelity":true,"animated_source_water":true,"derived_road_surface_widths":true,"fxaa":true,"hdr":true,"dynamic_sun_lighting":true,"building_shadows":true},"surface_mode":"BRIDGEPOINT_GENERATED_MATERIAL_WORLD","raw_landcover_visible":false,"satellite_default":false,"overlay_source_sha":"${GITHUB_SHA}","versioned_world_path":"/app/bridgepoint-world-v2652/"}
          EOF
          touch site/.nojekyll site/app/.nojekyll

      - name: Persist live artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/instant-world && mkdir /tmp/instant-world
          cp -a site/. /tmp/instant-world/
          cd /tmp/instant-world
          git init -q
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m "Publish BridgePoint V2662 instant map ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify production V2662 world
        run: |
          set -euo pipefail
          ORIGIN='https://bridgepointintelligence.online'
          ok=0
          for attempt in $(seq 1 36); do
            marker="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/bridgepoint-world-overlay-v2652.json?v=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            app="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/?v=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            world="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/bridgepoint-world-v2652/?v=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            instant="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/bridgepoint-world-v2652/world-v2662-instant-map.js?v=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            base="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/bridgepoint-world-v2652/world-v2500.js?v=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            states_code="$(curl -sS -o /tmp/states.geojson -w '%{http_code}' --max-time 15 "${ORIGIN}/app/bridgepoint-world-v2652/us-states.geojson?v=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            if printf '%s' "$marker" | grep -Fq '"app_shell_version":2662' && printf '%s' "$marker" | grep -Fq 'WORLD_FIXED_SURFACE_TEXTURES' && printf '%s' "$app" | grep -Fq 'instant-map-world-2662' && printf '%s' "$world" | grep -Fq 'world-v2662-instant-map.js' && printf '%s' "$instant" | grep -Fq 'BridgePointInstantMapV2662' && printf '%s' "$instant" | grep -Fq 'bridgepoint-weather-us-v2662' && ! printf '%s' "$base" | grep -Fq 'viewer.imageryLayers.addImageryProvider(globalImagery);' && ! printf '%s' "$base" | grep -Fq 'viewer.imageryLayers.addImageryProvider(imagery);' && [ "$states_code" = '200' ]; then
              ok=1
              echo "BRIDGEPOINT_INSTANT_MAP_WORLD_V2662_LIVE"
              break
            fi
            sleep 5
          done
          test "$ok" = 1

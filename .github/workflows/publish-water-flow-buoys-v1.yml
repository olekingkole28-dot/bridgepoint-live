# Publish Water Flow and Buoys on the preserved BridgePoint production snapshot.
name: Publish BridgePoint Water Flow and Buoys v1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-water-flow-buoys-v1.yml'
      - 'rebuild-v5000/bridgepoint-water-flow-buoys-v1.js'
      - 'rebuild-v5000/bridgepoint-bottom-card-compact-v1.css'
      - 'rebuild-v5000/index.html'
      - 'rebuild-v5000/app-index.html'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-v5000-water-flow-buoys-v1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Wait for a same-commit full-site build
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          sleep 8
          RUN_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" --jq '.workflow_runs[] | select(.path == ".github/workflows/deploy-intelligence-rebuild-v5000.yml") | .id' | head -n 1 || true)"
          if [ -z "$RUN_ID" ]; then
            echo "No same-commit full-site build is registered; using the latest successful production snapshot."
            exit 0
          fi
          echo "Waiting for full-site build run $RUN_ID."
          while true; do
            STATUS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.status')"
            CONCLUSION="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.conclusion // ""')"
            if [ "$STATUS" = "completed" ]; then
              echo "FULL_SITE_BUILD_FINISHED run=$RUN_ID conclusion=$CONCLUSION"
              exit 0
            fi
            sleep 15
          done

      - name: Resolve the latest successful prior production snapshot
        id: baseline
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=success&branch=main&per_page=100" --jq '.workflow_runs[] | select(.status == "completed" and .conclusion == "success") | [.id,.head_sha] | @tsv')"
          BASELINE_ID=""
          ARTIFACT=""
          while IFS=$'\t' read -r run_id head_sha; do
            [ -n "$run_id" ] || continue
            [ "$head_sha" = "$GITHUB_SHA" ] && continue
            candidate="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" --jq '.artifacts[]? | select((.expired|not) and (.name | startswith("bridgepoint-v5000-"))) | .name' | head -n 1 || true)"
            if [ -n "$candidate" ]; then
              BASELINE_ID="$run_id"
              ARTIFACT="$candidate"
              break
            fi
          done <<< "$RUNS"
          test -n "$BASELINE_ID"
          test -n "$ARTIFACT"
          echo "run_id=$BASELINE_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "PRESERVED_PRODUCTION_BASELINE run=$BASELINE_ID artifact=$ARTIFACT"

      - name: Download the production snapshot
        uses: actions/download-artifact@v4
        with:
          name: "${{ steps.baseline.outputs.artifact_name }}"
          run-id: "${{ steps.baseline.outputs.run_id }}"
          repository: "${{ github.repository }}"
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          path: "${{ runner.temp }}/bp-pages-baseline"

      - name: Restore production and fingerprint non-target files
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find "$RUNNER_TEMP/bp-pages-baseline" -type f -name artifact.tar -print -quit)"
          test -n "$ARCHIVE"
          SITE="$RUNNER_TEMP/bp-site"
          mkdir -p "$SITE"
          tar -xf "$ARCHIVE" -C "$SITE"
          test -s "$SITE/index.html"
          test -s "$SITE/app/index.html"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          site=Path(os.environ['RUNNER_TEMP'])/'bp-site'
          targets={'index.html','app/index.html','bridgepoint-water-flow-buoys-v1.js','bridgepoint-bottom-card-compact-v1.css'}
          def digest(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return h.hexdigest()
          before={}
          for path in sorted(site.rglob('*')):
              if not path.is_file(): continue
              rel=path.relative_to(site).as_posix()
              if rel not in targets: before[rel]=digest(path)
          tmp=Path(os.environ['RUNNER_TEMP'])
          (tmp/'bp-water-preservation-before.json').write_text(json.dumps(before,sort_keys=True))
          print('NON_TARGET_PRODUCTION_FILES_FINGERPRINTED',len(before))
          PY

      - name: Overlay water layer and compact card
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/bp-site"
          cp rebuild-v5000/bridgepoint-water-flow-buoys-v1.js "$SITE/bridgepoint-water-flow-buoys-v1.js"
          cp rebuild-v5000/bridgepoint-bottom-card-compact-v1.css "$SITE/bridgepoint-bottom-card-compact-v1.css"
          python3 - <<'PY'
          import re,os
          from pathlib import Path
          site=Path(os.environ['RUNNER_TEMP'])/'bp-site'
          tag='<script type="application/x-bridgepoint-deferred" data-bp-deferred-src="/bridgepoint-water-flow-buoys-v1.js?v=6521-water-surface-mask-ndbc-proxy" data-bp-deferred-kind="classic"></script>'
          priority="  'bridgepoint-water-flow-buoys-v1.js',\n"
          drone="  'bridgepoint-drone-awareness-v1.js',\n"
          css_tag='<link rel="stylesheet" href="/bridgepoint-bottom-card-compact-v1.css?v=6515-compact-button-card">'
          for rel in ('index.html','app/index.html'):
              path=site/rel
              html=path.read_text(encoding='utf-8')
              html=re.sub(r'<script type="application/x-bridgepoint-deferred" data-bp-deferred-src="/bridgepoint-water-flow-buoys-v1\.js[^"]*" data-bp-deferred-kind="classic"></script>','',html,flags=re.I)
              if rel=='index.html':
                  marker='<script id="bp-mobile-script-deferral-v6302">'
                  if marker not in html: raise SystemExit('Root deferred loader marker is missing')
                  html=html.replace(marker,tag+'\n'+marker,1)
              else:
                  drone_tag=re.search(r'<script type="application/x-bridgepoint-deferred" data-bp-deferred-src="/bridgepoint-drone-awareness-v1\.js[^"]*" data-bp-deferred-kind="classic"></script>',html,re.I)
                  if not drone_tag: raise SystemExit('App Aircraft deferred module marker is missing')
                  html=html[:drone_tag.end()]+'\n'+tag+html[drone_tag.end():]
              if priority not in html:
                  if drone not in html: raise SystemExit(rel+' priority list is missing Aircraft')
                  html=html.replace(drone,drone+priority,1)
              if html.count('bridgepoint-water-flow-buoys-v1.js')!=2:
                  raise SystemExit(rel+' must contain exactly one module placeholder and priority entry')
              html=re.sub(r'<link rel="stylesheet" href="/bridgepoint-bottom-card-compact-v1\.css[^"]*">','',html,flags=re.I)
              if not re.search(r'</head>',html,re.I): raise SystemExit(rel+' has no closing head tag')
              html=re.sub(r'</head>',css_tag+'\n</head>',html,flags=re.I,count=1)
              path.write_text(html,encoding='utf-8')
          root=(site/'index.html').read_text(encoding='utf-8')
          app=(site/'app/index.html').read_text(encoding='utf-8')
          for rel,html in [('root',root),('app',app)]:
              if html.count(tag)!=1 or html.count(css_tag)!=1: raise SystemExit(rel+' loader or card CSS is duplicated/missing')
          source_root=Path('rebuild-v5000/index.html').read_text(encoding='utf-8')
          source_app=Path('rebuild-v5000/app-index.html').read_text(encoding='utf-8')
          if tag not in source_root or priority not in source_root or tag not in source_app or priority not in source_app:
              raise SystemExit('Source root/app deferred water loader is incomplete')
          print('WATER_FLOW_BUOYS_AND_COMPACT_CARD_LOADERS_PASS')
          PY
          node --check rebuild-v5000/bridgepoint-water-flow-buoys-v1.js

      - name: Verify no non-target production files changed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          site=Path(os.environ['RUNNER_TEMP'])/'bp-site'
          tmp=Path(os.environ['RUNNER_TEMP'])
          before=json.loads((tmp/'bp-water-preservation-before.json').read_text())
          targets={'index.html','app/index.html','bridgepoint-water-flow-buoys-v1.js','bridgepoint-bottom-card-compact-v1.css'}
          def digest(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return h.hexdigest()
          after={}
          for path in sorted(site.rglob('*')):
              if not path.is_file(): continue
              rel=path.relative_to(site).as_posix()
              if rel not in targets: after[rel]=digest(path)
          if before != after:
              raise SystemExit('UNRELATED_PRODUCTION_FILE_CHANGE '+json.dumps({
                'missing':sorted(set(before)-set(after))[:20],
                'added':sorted(set(after)-set(before))[:20],
                'changed':sorted(k for k in before.keys() & after.keys() if before[k]!=after[k])[:20]}))
          print('NON_TARGET_PRODUCTION_FILES_BYTE_FOR_BYTE_PRESERVED',len(before))
          PY

      - uses: actions/configure-pages@v5

      - name: Upload preserved production snapshot with water overlay
        uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-v5000-${{ github.run_attempt }}
          path: "${{ runner.temp }}/bp-site"
          include-hidden-files: true

      - name: Publish the preserved production snapshot
        id: deployment
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: node scripts/deploy-pages-extended.mjs

      - name: Verify live water overlay and compact card
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://bridgepointintelligence.online'
          DIR="$RUNNER_TEMP/bp-water-live"
          mkdir -p "$DIR"
          curl --retry 7 --retry-all-errors --retry-delay 3 --max-time 35 -fsSL -H 'Cache-Control: no-cache' "$ORIGIN/?verify=$GITHUB_SHA-water-flow" -o "$DIR/root.html"
          curl --retry 7 --retry-all-errors --retry-delay 3 --max-time 35 -fsSL -H 'Cache-Control: no-cache' "$ORIGIN/app/?verify=$GITHUB_SHA-water-flow" -o "$DIR/app.html"
          curl --retry 7 --retry-all-errors --retry-delay 3 --max-time 35 -fsSL -H 'Cache-Control: no-cache' "$ORIGIN/bridgepoint-water-flow-buoys-v1.js?verify=$GITHUB_SHA-water-flow" -o "$DIR/water.js"
          curl --retry 7 --retry-all-errors --retry-delay 3 --max-time 35 -fsSL -H 'Cache-Control: no-cache' "$ORIGIN/bridgepoint-bottom-card-compact-v1.css?verify=$GITHUB_SHA-water-flow" -o "$DIR/layout.css"
          grep -Fq 'bridgepoint-water-flow-buoys-v1.js?v=6521-water-surface-mask-ndbc-proxy' "$DIR/root.html"
          grep -Fq 'bridgepoint-water-flow-buoys-v1.js?v=6521-water-surface-mask-ndbc-proxy' "$DIR/app.html"
          cmp -s "$DIR/layout.css" rebuild-v5000/bridgepoint-bottom-card-compact-v1.css
          grep -Fq '__BP_WATER_FLOW_BUOYS_V1__' "$DIR/water.js"
          echo 'WATER_FLOW_BUOYS_AND_COMPACT_CARD_LAYOUT_LIVE_ON_ROOT_AND_APP'

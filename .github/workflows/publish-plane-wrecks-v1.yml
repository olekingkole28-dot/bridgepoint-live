name: Publish BridgePoint Plane Wrecks — ten wreck cards
# Additive wreck catalogue: persistent icons, BridgePoint-hosted photogrammetry viewers and native globe meshes.

on:
  pull_request:
    paths:
      - '.github/workflows/publish-plane-wrecks-v1.yml'
      - 'rebuild-v5000/bridgepoint-plane-wrecks-v1.js'
      - 'rebuild-v5000/bridgepoint-drone-awareness-v1.js'
      - 'rebuild-v5000/landing.js'
      - 'rebuild-v5000/app.js'
      - 'tools/plane_wrecks/build_f4u1_corsair.py'
      - 'tools/plane_wrecks/build_additional_models.py'
      - 'tools/plane_wrecks/build_tokai_maru.py'
      - 'tools/plane_wrecks/build_noaa_p39q.py'
      - 'tools/plane_wrecks/build_messerschmitt_bf109.py'
      - 'rebuild-v5000/bridgepoint-plane-wrecks-extra-v1.js'
      - 'tests/plane-wrecks-v1.test.mjs'
      - 'tests/plane-wrecks-extra-v1.test.mjs'
  workflow_run:
    workflows: ["Publish BridgePoint Shipwrecks v11 — BridgePoint-hosted underwater wreck viewers"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-plane-wrecks-v1.yml'
      - 'tools/plane_wrecks/build_additional_models.py'
      - 'tools/plane_wrecks/build_tokai_maru.py'
      - 'tools/plane_wrecks/build_noaa_p39q.py'
      - 'tools/plane_wrecks/build_messerschmitt_bf109.py'
      - 'rebuild-v5000/bridgepoint-plane-wrecks-extra-v1.js'
      - 'tests/plane-wrecks-extra-v1.test.mjs'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Plane Wrecks renderer and shared visibility guard syntax and regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < rebuild-v5000/bridgepoint-plane-wrecks-v1.js
          node --input-type=module --check < rebuild-v5000/bridgepoint-plane-wrecks-extra-v1.js
          node --check rebuild-v5000/bridgepoint-drone-awareness-v1.js
          node --check rebuild-v5000/landing.js
          node --check rebuild-v5000/app.js
          python3 -m py_compile tools/plane_wrecks/build_f4u1_corsair.py tools/plane_wrecks/build_additional_models.py tools/plane_wrecks/build_tokai_maru.py tools/plane_wrecks/build_noaa_p39q.py tools/plane_wrecks/build_messerschmitt_bf109.py
          node tests/plane-wrecks-v1.test.mjs
          node tests/plane-wrecks-extra-v1.test.mjs
          node tests/shipwrecks-v1.test.mjs
          node tests/drone-awareness.test.mjs

      - name: Build and validate the public NOAA P-39Q Airacobra wing model
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input trimesh pillow
          OUT="$RUNNER_TEMP/p39q-pr-validation"
          python3 tools/plane_wrecks/build_noaa_p39q.py --output "$OUT"
          python3 - "$OUT/p39q-airacobra-wing-photogrammetry.glb.gz" "$OUT/p39q-airacobra-wing.json" <<'PY'
          import gzip,json,struct,sys
          from pathlib import Path
          asset=Path(sys.argv[1]);manifest=json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          raw=gzip.decompress(asset.read_bytes())
          assert raw[:4]==b'glTF' and struct.unpack_from('<I',raw,8)[0]==len(raw)
          json_len=struct.unpack_from('<I',raw,12)[0]
          doc=json.loads(raw[20:20+json_len].decode('utf-8').rstrip(' \\\\0'))
          primitives=[p for mesh in doc.get('meshes',[]) for p in mesh.get('primitives',[])]
          assert manifest['id']=='bell-p39q-airacobra-lake-huron'
          assert 'Public Domain' in manifest['license']
          assert manifest['sourcePhotos']==438 and manifest['imageAlignmentPercent']==100
          assert manifest['triangles']>=1000 or manifest['vertices']>=1000
          assert primitives
          assert asset.stat().st_size<180*1024*1024
          print('BRIDGEPOINT_P39Q_PR_ASSET_PASS',manifest['triangles'],'triangles',manifest['vertices'],'vertices',len(raw),'GLB bytes',asset.stat().st_size,'compressed bytes')
          PY

      - name: Build and validate the public Messerschmitt Bf 109 Planier point cloud
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input numpy
          OUT="$RUNNER_TEMP/messerschmitt-pr-validation"
          python3 tools/plane_wrecks/build_messerschmitt_bf109.py --output "$OUT"
          python3 - "$OUT/messerschmitt-bf109-g6-planier.glb.gz" "$OUT/catalog.json" <<'PY'
          import gzip,json,struct,sys
          from pathlib import Path
          asset=Path(sys.argv[1]);catalog=json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          item=next(m for m in catalog['models'] if m['id']=='messerschmitt-bf109-g6-planier')
          raw=gzip.decompress(asset.read_bytes())
          assert raw[:4]==b'glTF' and struct.unpack_from('<I',raw,8)[0]==len(raw)
          json_len=struct.unpack_from('<I',raw,12)[0]
          doc=json.loads(raw[20:20+json_len].decode('utf-8').rstrip(' '))
          assert item['license']=='CC BY 4.0'
          assert item['sourcePointCount']==278909422 and item['renderedPointCount']>=100000
          assert doc['meshes'][0]['primitives'][0]['mode']==0
          assert doc['accessors'][0]['count']==item['renderedPointCount']
          assert asset.stat().st_size<64*1024*1024
          print('BRIDGEPOINT_MESSERSCHMITT_PR_ASSET_PASS',item['renderedPointCount'],'points',len(raw),'GLB bytes')
          PY
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    concurrency:
      group: bridgepoint-v5000-production-authority
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Plane Wrecks renderer and existing overlays
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < rebuild-v5000/bridgepoint-plane-wrecks-v1.js
          node --input-type=module --check < rebuild-v5000/bridgepoint-plane-wrecks-extra-v1.js
          node --check rebuild-v5000/bridgepoint-drone-awareness-v1.js
          node --check rebuild-v5000/landing.js
          node --check rebuild-v5000/app.js
          node tests/plane-wrecks-v1.test.mjs
          node tests/plane-wrecks-extra-v1.test.mjs
          node tests/shipwrecks-v1.test.mjs
          node tests/drone-awareness.test.mjs
          python3 -m py_compile tools/plane_wrecks/build_f4u1_corsair.py tools/plane_wrecks/build_additional_models.py tools/plane_wrecks/build_tokai_maru.py tools/plane_wrecks/build_noaa_p39q.py tools/plane_wrecks/build_messerschmitt_bf109.py

      - name: Materialize the rights-checked F4U-1 Corsair underwater photogrammetry point cloud
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/plane_wrecks/build_f4u1_corsair.py --output assets/plane-wrecks
          python3 - <<'PY'
          import gzip,json,struct
          from pathlib import Path
          root=Path('assets/plane-wrecks')
          asset=root/'f4u1-corsair-kwajalein-photogrammetry.glb.gz'
          model=json.loads((root/'catalog.json').read_text(encoding='utf-8'))
          raw=gzip.decompress(asset.read_bytes())
          assert raw[:4]==b'glTF' and struct.unpack_from('<I',raw,8)[0]==len(raw)
          json_len=struct.unpack_from('<I',raw,12)[0]
          document=json.loads(raw[20:20+json_len].decode('utf-8').rstrip(' '))
          assert model['license']=='CC BY 4.0'
          assert model['renderedPointCount']>=400000
          assert document['meshes'][0]['primitives'][0]['mode']==0
          assert asset.stat().st_size<32*1024*1024
          print('BRIDGEPOINT_F4U1_CORSAIR_PUBLISH_ASSET_PASS',model['renderedPointCount'],'points',len(raw),'GLB bytes',asset.stat().st_size,'compressed bytes')
          PY

      - name: Materialize and validate the B-29, Mitsubishi Zero and Short Sunderland photogrammetry meshes
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/plane_wrecks/build_additional_models.py --output assets/plane-wrecks/extra
          python3 - <<'PY'
          import gzip,json,struct
          from pathlib import Path
          root=Path('assets/plane-wrecks/extra')
          catalog=json.loads((root/'catalog.json').read_text(encoding='utf-8'))
          assert len(catalog['models'])==3
          expected={'b29-over-exposed-bleaklow.glb.gz','zero-fighter-a6m3-iwm-london.glb.gz','short-sunderland-ej138-munkholmen.glb.gz'}
          assert expected.issubset({p.name for p in root.glob('*.glb.gz')})
          for name in sorted(expected):
              asset=root/name
              raw=gzip.decompress(asset.read_bytes())
              assert raw[:4]==b'glTF' and struct.unpack_from('<I',raw,8)[0]==len(raw)
              json_len=struct.unpack_from('<I',raw,12)[0]
              doc=json.loads(raw[20:20+json_len].decode('utf-8').rstrip(' '))
              assert any(p.get('mode',4)==4 for m in doc.get('meshes',[]) for p in m.get('primitives',[]))
              assert asset.stat().st_size<64*1024*1024
              print('BRIDGEPOINT_EXTRA_PLANE_MESH_BUILD_PASS',name,len(raw),'GLB bytes',asset.stat().st_size,'gzip bytes')
          assert {m['license'] for m in catalog['models']}.issubset({'CC BY 4.0','CC0 1.0'})
          PY

      - name: Materialize and validate the Tokai Maru underwater photogrammetry point cloud
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/plane_wrecks/build_tokai_maru.py --output assets/plane-wrecks/extra
          python3 - <<'PY'
          import gzip,json,struct
          from pathlib import Path
          root=Path('assets/plane-wrecks/extra')
          asset=root/'tokai-maru-apra-harbor-photogrammetry.glb.gz'
          manifest=json.loads((root/'tokai-maru-apra-harbor.json').read_text(encoding='utf-8'))
          raw=gzip.decompress(asset.read_bytes())
          assert raw[:4]==b'glTF' and struct.unpack_from('<I',raw,8)[0]==len(raw)
          json_len=struct.unpack_from('<I',raw,12)[0]
          doc=json.loads(raw[20:20+json_len].decode('utf-8').rstrip(' '))
          assert manifest['license']=='CC BY 4.0'
          assert manifest['sourcePhotos']>=2000 and manifest['depthMapCount']>=2000
          assert manifest['renderedPointCount']>=500000
          assert doc['meshes'][0]['primitives'][0]['mode']==0
          assert doc['accessors'][0]['count']==manifest['renderedPointCount']
          assert asset.stat().st_size<64*1024*1024
          print('BRIDGEPOINT_TOKAI_MARU_PUBLISH_ASSET_PASS',manifest['renderedPointCount'],'points',manifest['sourcePhotos'],'photos',manifest['depthMapCount'],'depth maps',len(raw),'GLB bytes',asset.stat().st_size,'compressed bytes')
          PY

      - name: Materialize and validate the NOAA P-39Q Airacobra wing photogrammetry mesh
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input trimesh pillow
          python3 tools/plane_wrecks/build_noaa_p39q.py --output assets/plane-wrecks/extra
          python3 - <<'PY'
          import gzip,json,struct
          from pathlib import Path
          root=Path('assets/plane-wrecks/extra')
          asset=root/'p39q-airacobra-wing-photogrammetry.glb.gz'
          manifest=json.loads((root/'p39q-airacobra-wing.json').read_text(encoding='utf-8'))
          raw=gzip.decompress(asset.read_bytes())
          assert raw[:4]==b'glTF' and struct.unpack_from('<I',raw,8)[0]==len(raw)
          json_len=struct.unpack_from('<I',raw,12)[0]
          doc=json.loads(raw[20:20+json_len].decode('utf-8').rstrip(' \\\\0'))
          primitives=[p for mesh in doc.get('meshes',[]) for p in mesh.get('primitives',[])]
          assert manifest['id']=='bell-p39q-airacobra-lake-huron'
          assert 'Public Domain' in manifest['license']
          assert manifest['sourcePhotos']==438 and manifest['imageAlignmentPercent']==100
          assert manifest['triangles']>=1000 or manifest['vertices']>=1000
          assert primitives and asset.stat().st_size<180*1024*1024
          print('BRIDGEPOINT_P39Q_PUBLISH_ASSET_PASS',manifest['triangles'],'triangles',manifest['vertices'],'vertices',len(raw),'GLB bytes',asset.stat().st_size,'compressed bytes')
          PY


      - name: Materialize and validate the Messerschmitt Bf 109 Planier photogrammetry point cloud
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input numpy
          python3 tools/plane_wrecks/build_messerschmitt_bf109.py --output assets/plane-wrecks/extra
          python3 - <<'PY'
          import gzip,json,struct
          from pathlib import Path
          root=Path('assets/plane-wrecks/extra')
          asset=root/'messerschmitt-bf109-g6-planier.glb.gz'
          catalog=json.loads((root/'catalog.json').read_text(encoding='utf-8'))
          item=next(m for m in catalog['models'] if m['id']=='messerschmitt-bf109-g6-planier')
          raw=gzip.decompress(asset.read_bytes())
          assert raw[:4]==b'glTF' and struct.unpack_from('<I',raw,8)[0]==len(raw)
          json_len=struct.unpack_from('<I',raw,12)[0]
          doc=json.loads(raw[20:20+json_len].decode('utf-8').rstrip(' '))
          assert item['license']=='CC BY 4.0'
          assert item['sourcePointCount']==278909422 and item['renderedPointCount']>=100000
          assert doc['meshes'][0]['primitives'][0]['mode']==0
          assert doc['accessors'][0]['count']==item['renderedPointCount']
          assert asset.stat().st_size<64*1024*1024
          print('BRIDGEPOINT_MESSERSCHMITT_PUBLISH_ASSET_PASS',item['renderedPointCount'],'points',len(raw),'GLB bytes',asset.stat().st_size,'compressed bytes')
          PY

      - name: Select latest successful deployed GitHub Pages artifact
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,time,urllib.request,urllib.error
          repo=os.environ["REPOSITORY"];token=os.environ["GH_TOKEN"]
          headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,"X-GitHub-Api-Version":"2022-11-28"}
          def api(path):
              last_error=None
              for attempt in range(6):
                  req=urllib.request.Request("https://api.github.com/repos/"+repo+path,headers=headers)
                  try:
                      with urllib.request.urlopen(req,timeout=45) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as error:
                      if error.code not in (429,500,502,503,504):raise
                      last_error=error
                      retry_after=error.headers.get("Retry-After")
                  except (urllib.error.URLError,TimeoutError,ConnectionError,OSError) as error:
                      last_error=error
                      retry_after=None
                  if attempt==5:raise last_error
                  delay=min(30,2**attempt*2)
                  if retry_after:
                      try:delay=max(delay,min(60,float(retry_after)))
                      except ValueError:pass
                  print("TRANSIENT_GITHUB_API_RETRY",attempt+1,"of 5",path,"after",delay,"seconds",flush=True)
                  time.sleep(delay)
              raise last_error
          selected=None
          for page in range(1,11):
              runs=api(f"/actions/runs?branch=main&status=completed&per_page=100&page={page}").get("workflow_runs",[])
              if not runs:break
              for run in runs:
                  if run.get("status")!="completed" or run.get("conclusion")!="success":continue
                  jobs=api(f"/actions/runs/{run['id']}/jobs?per_page=100").get("jobs",[])
                  steps=[step for job in jobs for step in (job.get("steps") or []) if step.get("conclusion")=="success"]
                  uploaded=any("upload" in str(s.get("name","")).lower() and ("page" in str(s.get("name","")).lower() or "site" in str(s.get("name","")).lower()) for s in steps)
                  deployed=any(("publish" in str(s.get("name","")).lower() or "deploy" in str(s.get("name","")).lower()) for s in steps)
                  if not uploaded or not deployed:continue
                  artifacts=api(f"/actions/runs/{run['id']}/artifacts?per_page=100").get("artifacts",[])
                  match=next((a for a in artifacts if not a.get("expired") and
                      (str(a.get("name","")).startswith("github-pages-") or str(a.get("name","")).startswith("bridgepoint-v5000-"))),None)
                  if match:
                      selected=(str(run["id"]),match["name"])
                      print("LATEST_SUCCESSFUL_PAGES_BASELINE",run["id"],run.get("name"),match["name"],match.get("size_in_bytes"))
                      break
              if selected:break
          if not selected:raise SystemExit("No successful, unexpired production Pages artifact found in the ten most recent completed-run pages; refusing to publish.")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write("run_id="+selected[0]+"\n")
              out.write("artifact_name="+selected[1]+"\n")
          PY

      - name: Download the preserved production Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.baseline.outputs.artifact_name }}
          run-id: ${{ steps.baseline.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/plane-wrecks-baseline

      - name: Restore production site and fingerprint all existing files
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find "$RUNNER_TEMP/plane-wrecks-baseline" -type f -name artifact.tar -print -quit)"
          test -n "$ARCHIVE"
          SITE="$RUNNER_TEMP/plane-wrecks-site"
          mkdir -p "$SITE"
          tar -xf "$ARCHIVE" -C "$SITE"
          for file in index.html app/index.html landing.js app.js vendor/three.module.js bridgepoint-drone-awareness-v1.js bridgepoint-shipwrecks-v1.js; do
            test -s "$SITE/$file" || { echo "Production baseline is missing $file; refusing to publish."; exit 1; }
          done
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          site=Path(os.environ["RUNNER_TEMP"])/"plane-wrecks-site"
          before={p.relative_to(site).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in site.rglob("*") if p.is_file()}
          (Path(os.environ["RUNNER_TEMP"])/"plane-wrecks-before.json").write_text(json.dumps(before,sort_keys=True))
          print("PLANE_WRECKS_BASELINE_FINGERPRINT_PASS",len(before),"files")
          PY

      - name: Ensure BridgePoint-hosted GLTFLoader is available
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/plane-wrecks-site"
          if [ ! -s "$SITE/vendor/GLTFLoader.bundle.js" ]; then
            R="$RUNNER_TEMP/plane-wrecks-loader-runtime"
            mkdir -p "$R" "$SITE/vendor"
            npm install --prefix "$R" --no-audit --no-fund --no-save three@0.169.0 esbuild@0.24.2
            "$R/node_modules/.bin/esbuild" "$R/node_modules/three/examples/jsm/loaders/GLTFLoader.js" --bundle --format=esm --minify --external:three --outfile="$SITE/vendor/GLTFLoader.bundle.js"
            python3 - "$SITE/vendor/GLTFLoader.bundle.js" <<'PY'
          import re,sys
          from pathlib import Path
          p=Path(sys.argv[1]);s=p.read_text(encoding="utf-8")
          s,n=re.subn(r'\bfrom\s*(["\'])three\1','from "/vendor/three.module.js?v=169-local"',s)
          if n<1 and 'from "/vendor/three.module.js?v=169-local"' not in s:raise SystemExit("GLTFLoader external Three import patch failed")
          if re.search(r'\bfrom\s*(["\'])three\1',s):raise SystemExit("GLTFLoader has unresolved Three import")
          p.write_text(s,encoding="utf-8")
          PY
          fi
          node --input-type=module --check < "$SITE/vendor/GLTFLoader.bundle.js"
          grep -Fq 'from "/vendor/three.module.js?v=169-local"' "$SITE/vendor/GLTFLoader.bundle.js"

      - name: Overlay the nine additional Plane Wrecks markers and cards
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/plane-wrecks-site"
          mkdir -p "$SITE/app" "$SITE/assets/plane-wrecks"
          cp rebuild-v5000/bridgepoint-plane-wrecks-v1.js "$SITE/bridgepoint-plane-wrecks-v1.js"
          cp rebuild-v5000/bridgepoint-plane-wrecks-v1.js "$SITE/app/bridgepoint-plane-wrecks-v1.js"
          cp rebuild-v5000/bridgepoint-plane-wrecks-extra-v1.js "$SITE/bridgepoint-plane-wrecks-extra-v1.js"
          cp rebuild-v5000/bridgepoint-plane-wrecks-extra-v1.js "$SITE/app/bridgepoint-plane-wrecks-extra-v1.js"
          cp rebuild-v5000/bridgepoint-drone-awareness-v1.js "$SITE/bridgepoint-drone-awareness-v1.js"
          cp -a assets/plane-wrecks/. "$SITE/assets/plane-wrecks/"
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          site=Path(os.environ["RUNNER_TEMP"])/"plane-wrecks-site"
          before=json.loads((Path(os.environ["RUNNER_TEMP"])/"plane-wrecks-before.json").read_text())
          expected_changed={"landing.js","app.js","index.html","app/index.html","bridgepoint-drone-awareness-v1.js"}
          overlay_files={"bridgepoint-plane-wrecks-v1.js","app/bridgepoint-plane-wrecks-v1.js",
             "bridgepoint-plane-wrecks-extra-v1.js","app/bridgepoint-plane-wrecks-extra-v1.js",
             "assets/plane-wrecks/f4u1-corsair-kwajalein-photogrammetry.glb.gz","assets/plane-wrecks/catalog.json",
             "assets/plane-wrecks/extra/b29-over-exposed-bleaklow.glb.gz",
             "assets/plane-wrecks/extra/zero-fighter-a6m3-iwm-london.glb.gz",
             "assets/plane-wrecks/extra/short-sunderland-ej138-munkholmen.glb.gz",
             "assets/plane-wrecks/extra/tokai-maru-apra-harbor-photogrammetry.glb.gz",
             "assets/plane-wrecks/extra/tokai-maru-apra-harbor.json",
             "assets/plane-wrecks/extra/p39q-airacobra-wing-photogrammetry.glb.gz",
             "assets/plane-wrecks/extra/p39q-airacobra-wing.json",
             "assets/plane-wrecks/extra/messerschmitt-bf109-g6-planier.glb.gz",
             "assets/plane-wrecks/extra/catalog.json"}
          plane_import="""void import('./bridgepoint-plane-wrecks-v1.js?v=2-f4u1-persistent-dom-marker')
           .then(m=>{window.__BP_PLANE_WRECKS_V1__=m.initPlaneWrecksRenderer(world)})
           .catch(e=>console.warn('BridgePoint Plane Wrecks layer unavailable',e));"""
          extra_import="""void import('./bridgepoint-plane-wrecks-extra-v1.js?v=8-b17f-black-jack')
           .then(m=>{window.__BP_PLANE_WRECKS_EXTRA_V1__=m.initPlaneWrecksExtraRenderer(world)})
           .catch(e=>console.warn('BridgePoint additional Plane Wrecks layer unavailable',e));"""
          shipwreck_anchor=".catch(e=>console.warn('BridgePoint shipwreck renderer unavailable',e));"
          base_anchor=".catch(e=>console.warn('BridgePoint Plane Wrecks layer unavailable',e));"
          for rel in ("landing.js","app.js"):
              p=site/rel
              data=p.read_text(encoding="utf-8")
              if "initPlaneWrecksRenderer(world)" not in data:
                  if data.count(shipwreck_anchor)!=1:
                      raise SystemExit(f"{rel}: cannot find the unique Shipwrecks import anchor for Plane Wrecks")
                  data=data.replace(shipwreck_anchor,shipwreck_anchor+chr(10)+plane_import,1)
              if "initPlaneWrecksRenderer(world)" not in data:
                  raise SystemExit(f"{rel}: base Plane Wrecks entry-point import was not installed")
              if "initPlaneWrecksExtraRenderer(world)" not in data:
                  if data.count(base_anchor)!=1:
                      raise SystemExit(f"{rel}: cannot find the unique base Plane Wrecks import anchor for extra meshes")
                  data=data.replace(base_anchor,base_anchor+chr(10)+extra_import,1)
              if "initPlaneWrecksExtraRenderer(world)" not in data:
                  raise SystemExit(f"{rel}: additional Plane Wrecks mesh import was not installed")
              extra_refs=list(re.finditer(r"bridgepoint-plane-wrecks-extra-v1\.js(?:\?v=[^'\"]*)?",data))
              if len(extra_refs)!=1:
                  raise SystemExit(f"{rel}: expected exactly one extra Plane Wrecks module import, got {len(extra_refs)}")
              data=re.sub(r"(bridgepoint-plane-wrecks-extra-v1\.js\?v=)[^'\"]+",r"\g<1>8-b17f-black-jack",data,count=1)
              if "bridgepoint-plane-wrecks-extra-v1.js?v=8-b17f-black-jack" not in data:
                  raise SystemExit(f"{rel}: failed to version-bust the extra Plane Wrecks module import")
              p.write_text(data,encoding="utf-8")
          for rel,script in (("index.html","landing.js"),("app/index.html","app.js")):
              p=site/rel;data=p.read_text(encoding="utf-8")
              hits=list(re.finditer(r'src="([^"]*'+re.escape(script)+r'(?:\?[^"]*)?)"',data))
              if len(hits)!=1:raise SystemExit(f"{rel}: expected one {script} script URL, got {len(hits)}")
              url=hits[0].group(1)
              if "planeWrecksExtra=b17f-black-jack-v1" not in url:
                  data=data.replace(url,url+("&" if "?" in url else "?")+"planeWrecksExtra=b17f-black-jack-v1",1)
              guard=list(re.finditer(r'src="([^"]*bridgepoint-drone-awareness-v1\.js(?:\?[^"]*)?)"',data))
              if len(guard)!=1:raise SystemExit(f"{rel}: expected one overlay-guard script URL")
              old=guard[0].group(1)
              updated=re.sub(r'([?&]v=)[^&"]+',r'\g<1>16-tokai-maru-apra-harbor',old,count=1) if re.search(r'[?&]v=',old) else old+("&" if "?" in old else "?")+"v=16-tokai-maru-apra-harbor"
              if old!=updated:data=data.replace(old,updated,1)
              p.write_text(data,encoding="utf-8")
          after={p.relative_to(site).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in site.rglob("*") if p.is_file()}
          removed=set(before)-set(after);added=set(after)-set(before)
          changed={p for p in before if p in after and before[p]!=after[p]}
          if removed or not changed.issubset(expected_changed|overlay_files|{"vendor/GLTFLoader.bundle.js"}) or not added.issubset(overlay_files|{"vendor/GLTFLoader.bundle.js"}):
              raise SystemExit("PLANE_WRECKS_EXTRA_OVERLAY_SCOPE_FAILURE "+json.dumps({"removed":sorted(removed),"changed":sorted(changed),"added":sorted(added)}))
          required={"bridgepoint-plane-wrecks-v1.js","app/bridgepoint-plane-wrecks-v1.js",
              "bridgepoint-plane-wrecks-extra-v1.js","app/bridgepoint-plane-wrecks-extra-v1.js",
              "assets/plane-wrecks/f4u1-corsair-kwajalein-photogrammetry.glb.gz","assets/plane-wrecks/catalog.json",
              "assets/plane-wrecks/extra/b29-over-exposed-bleaklow.glb.gz",
              "assets/plane-wrecks/extra/zero-fighter-a6m3-iwm-london.glb.gz",
              "assets/plane-wrecks/extra/short-sunderland-ej138-munkholmen.glb.gz",
              "assets/plane-wrecks/extra/tokai-maru-apra-harbor-photogrammetry.glb.gz",
              "assets/plane-wrecks/extra/tokai-maru-apra-harbor.json",
             "assets/plane-wrecks/extra/p39q-airacobra-wing-photogrammetry.glb.gz",
             "assets/plane-wrecks/extra/p39q-airacobra-wing.json",
             "assets/plane-wrecks/extra/messerschmitt-bf109-g6-planier.glb.gz",
              "assets/plane-wrecks/extra/catalog.json"}
          missing=required-set(after)
          if missing:raise SystemExit("PLANE_WRECKS_REQUIRED_FILE_MISSING "+json.dumps(sorted(missing)))
          assert (site/"bridgepoint-plane-wrecks-v1.js").read_bytes()==(site/"app/bridgepoint-plane-wrecks-v1.js").read_bytes()
          assert (site/"bridgepoint-plane-wrecks-extra-v1.js").read_bytes()==(site/"app/bridgepoint-plane-wrecks-extra-v1.js").read_bytes()
          print("PLANE_WRECKS_EXTRA_OVERLAY_SCOPE_PASS",len(changed),"existing files changed",len(added),"new files added; no removals")
          PY
          node --input-type=module --check < "$SITE/bridgepoint-plane-wrecks-v1.js"
          node --input-type=module --check < "$SITE/bridgepoint-plane-wrecks-extra-v1.js"
          node --check "$SITE/landing.js"
          node --check "$SITE/app.js"
          node --check "$SITE/bridgepoint-drone-awareness-v1.js"
          cmp -s "$SITE/bridgepoint-plane-wrecks-v1.js" "$SITE/app/bridgepoint-plane-wrecks-v1.js"
          cmp -s "$SITE/bridgepoint-plane-wrecks-extra-v1.js" "$SITE/app/bridgepoint-plane-wrecks-extra-v1.js"
          grep -Fq 'initPlaneWrecksRenderer(world)' "$SITE/landing.js"
          grep -Fq 'initPlaneWrecksRenderer(world)' "$SITE/app.js"
          grep -Fq 'initPlaneWrecksExtraRenderer(world)' "$SITE/landing.js"
          grep -Fq 'initPlaneWrecksExtraRenderer(world)' "$SITE/app.js"
          grep -Fq 'planewrecks:/plane[-_]?wreck|aircraft[-_]?wreck/i' "$SITE/bridgepoint-drone-awareness-v1.js"
          grep -Fq 'data-bp-local-plane-viewer' "$SITE/bridgepoint-plane-wrecks-v1.js"
          grep -Fq "new Marker({element,anchor:'center',offset:[0,0]})" "$SITE/bridgepoint-plane-wrecks-v1.js"
          grep -Fq 'EXTRA_PLANE_WRECKS' "$SITE/bridgepoint-plane-wrecks-extra-v1.js"
          grep -Fq 'new Marker({element,anchor:' "$SITE/bridgepoint-plane-wrecks-extra-v1.js"
          grep -Fq 'data-bp-plane-wreck-extra-viewer' "$SITE/bridgepoint-plane-wrecks-extra-v1.js"
          grep -Fq 'ensureWorldModel' "$SITE/bridgepoint-plane-wrecks-extra-v1.js"
          grep -Fq "renderingMode:'3d'" "$SITE/bridgepoint-plane-wrecks-extra-v1.js"
          test -s "$SITE/vendor/GLTFLoader.bundle.js"
          test -s "$SITE/vendor/three.module.js"
          echo "BRIDGEPOINT_PLANE_WRECKS_EXTRA_OVERLAY_PASS"
      - uses: actions/configure-pages@v5

      - name: Upload preserved production site with additive Plane Wrecks v1 overlay
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-plane-wrecks-v1
          path: ${{ runner.temp }}/plane-wrecks-site
          include-hidden-files: true

      - name: Publish BridgePoint Plane Wrecks — ten persistent wreck viewers
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-plane-wrecks-v1

      - name: Verify live root and app Plane Wrecks catalogue, including Jaluit H8K Emily
        shell: bash
        run: |
          set -euo pipefail
          O='https://bridgepointintelligence.online'
          Q="$GITHUB_SHA-plane-wrecks-v1"
          D="$RUNNER_TEMP/plane-wrecks-live"
          mkdir -p "$D"
          for item in             "root:$O/?planeWrecks=$Q"             "app:$O/app/?planeWrecks=$Q"             "landing:$O/landing.js?verify=$Q"             "appjs:$O/app.js?verify=$Q"             "module:$O/bridgepoint-plane-wrecks-v1.js?verify=$Q"             "appmodule:$O/app/bridgepoint-plane-wrecks-v1.js?verify=$Q"             "extra:$O/bridgepoint-plane-wrecks-extra-v1.js?verify=$Q"             "extraapp:$O/app/bridgepoint-plane-wrecks-extra-v1.js?verify=$Q"             "guard:$O/bridgepoint-drone-awareness-v1.js?verify=$Q"             "asset:$O/assets/plane-wrecks/f4u1-corsair-kwajalein-photogrammetry.glb.gz?verify=$Q"             "catalog:$O/assets/plane-wrecks/catalog.json?verify=$Q"             "b29:$O/assets/plane-wrecks/extra/b29-over-exposed-bleaklow.glb.gz?verify=$Q"             "zero:$O/assets/plane-wrecks/extra/zero-fighter-a6m3-iwm-london.glb.gz?verify=$Q"             "sunderland:$O/assets/plane-wrecks/extra/short-sunderland-ej138-munkholmen.glb.gz?verify=$Q"             "messerschmitt:$O/assets/plane-wrecks/extra/messerschmitt-bf109-g6-planier.glb.gz?verify=$Q"             "tokai:$O/assets/plane-wrecks/extra/tokai-maru-apra-harbor-photogrammetry.glb.gz?verify=$Q"             "tokaicatalog:$O/assets/plane-wrecks/extra/tokai-maru-apra-harbor.json?verify=$Q"             "p39q:$O/assets/plane-wrecks/extra/p39q-airacobra-wing-photogrammetry.glb.gz?verify=$Q"             "p39qmanifest:$O/assets/plane-wrecks/extra/p39q-airacobra-wing.json?verify=$Q"             "extracatalog:$O/assets/plane-wrecks/extra/catalog.json?verify=$Q"             "loader:$O/vendor/GLTFLoader.bundle.js?verify=$Q"; do
            name="${item%%:*}";url="${item#*:}"
            curl --retry 6 --retry-all-errors --retry-delay 2 --connect-timeout 20 --max-time 180 -fL               -H 'Cache-Control: no-cache' "$url" -o "$D/$name"
          done
          grep -Fq 'BP_FRONTEND_V5000' "$D/root" || { echo "LIVE_VERIFY_FAIL: root globe marker missing"; exit 1; }
          grep -Fq 'initPlaneWrecksRenderer(world)' "$D/landing" || { echo "LIVE_VERIFY_FAIL: landing entry does not load Plane Wrecks"; exit 1; }
          grep -Fq 'initPlaneWrecksRenderer(world)' "$D/appjs" || { echo "LIVE_VERIFY_FAIL: app entry does not load Plane Wrecks"; exit 1; }
          grep -Fq 'initPlaneWrecksExtraRenderer(world)' "$D/landing" || { echo "LIVE_VERIFY_FAIL: landing entry does not load extra plane meshes"; exit 1; }
          grep -Fq 'initPlaneWrecksExtraRenderer(world)' "$D/appjs" || { echo "LIVE_VERIFY_FAIL: app entry does not load extra plane meshes"; exit 1; }
          grep -Fq 'bridgepoint-plane-wrecks-extra-v1.js?v=8-b17f-black-jack' "$D/landing" || { echo "LIVE_VERIFY_FAIL: landing extra module cache-bust missing"; exit 1; }
          grep -Fq 'bridgepoint-plane-wrecks-extra-v1.js?v=8-b17f-black-jack' "$D/appjs" || { echo "LIVE_VERIFY_FAIL: app extra module cache-bust missing"; exit 1; }
          grep -Fq 'EXTRA_PLANE_WRECKS' "$D/extra" || { echo "LIVE_VERIFY_FAIL: extra aircraft mesh module missing"; exit 1; }
          grep -Fq 'short-sunderland-ej138-munkholmen' "$D/extra" || { echo "LIVE_VERIFY_FAIL: Sunderland wreck entry missing"; exit 1; }
          grep -Fq 'tokai-maru-apra-harbor' "$D/extra" || { echo "LIVE_VERIFY_FAIL: Tokai Maru wreck entry missing"; exit 1; }
          grep -Fq 'kawanishi-h8k-emily-jaluit' "$D/extra" || { echo "LIVE_VERIFY_FAIL: Jaluit H8K Emily entry missing"; exit 1; }
          grep -Fq 'construkted.com/embed/aekeemf4u6h' "$D/extra" || { echo "LIVE_VERIFY_FAIL: Jaluit H8K public viewer URL missing"; exit 1; }
          grep -Fq 'douglas-sbd-dauntless-kwajalein' "$D/extra" || { echo "LIVE_VERIFY_FAIL: Kwajalein SBD Dauntless entry missing"; exit 1; }
          grep -Fq 'construkted.com/embed/a1h0143huw3' "$D/extra" || { echo "LIVE_VERIFY_FAIL: Kwajalein SBD public viewer URL missing"; exit 1; }
          grep -Fq '40.31-million-polygon photogrammetry polygon mesh' "$D/extra" || { echo "LIVE_VERIFY_FAIL: Kwajalein SBD model metadata missing"; exit 1; }
          grep -Fq 'bell-p39q-airacobra-lake-huron' "$D/extra" || { echo "LIVE_VERIFY_FAIL: P-39Q wreck entry missing"; exit 1; }
          grep -Fq 'messerschmitt-bf109-g6-planier' "$D/extra" || { echo "LIVE_VERIFY_FAIL: Messerschmitt Bf 109 Planier wreck entry missing"; exit 1; }
          grep -Fq '10 persistent wreck icons' "$D/extra" || { echo "LIVE_VERIFY_FAIL: nine persistent wreck markers are not configured"; exit 1; }
          grep -Fq 'ensureWorldModel' "$D/extra" || { echo "LIVE_VERIFY_FAIL: native in-globe Sunderland model layer missing"; exit 1; }
          grep -Fq "renderingMode:'3d'" "$D/extra" || { echo "LIVE_VERIFY_FAIL: 3D globe rendering layer missing"; exit 1; }
          cmp -s "$D/extra" "$D/extraapp" || { echo "LIVE_VERIFY_FAIL: root/app extra mesh modules differ"; exit 1; }
          grep -Fq 'Plane Wrecks' "$D/module" || { echo "LIVE_VERIFY_FAIL: Plane Wrecks button module is missing"; exit 1; }
          grep -Fq 'data-bp-local-plane-viewer' "$D/module" || { echo "LIVE_VERIFY_FAIL: BridgePoint-hosted card viewer missing"; exit 1; }
          grep -Fq 'function ensurePersistentMarker(state,visible=state.enabled)' "$D/module" || { echo "LIVE_VERIFY_FAIL: style-independent persistent aircraft marker missing"; exit 1; }
          grep -Fq "new Marker({element,anchor:'center',offset:[0,0]})" "$D/module" || { echo "LIVE_VERIFY_FAIL: map-attached Corsair marker missing"; exit 1; }
          grep -Fq 'initPlaneWrecksRenderer' "$D/appmodule" || { echo "LIVE_VERIFY_FAIL: app module copy missing"; exit 1; }
          grep -Fq 'planewrecks:/plane[-_]?wreck|aircraft[-_]?wreck/i' "$D/guard" || { echo "LIVE_VERIFY_FAIL: dedicated Plane Wrecks visibility category missing"; exit 1; }
          cmp -s "$D/module" "$D/appmodule" || { echo "LIVE_VERIFY_FAIL: root/app Plane Wrecks modules differ"; exit 1; }
          python3 - "$D/asset" "$D/catalog" <<'PY'
          import gzip,json,struct,sys
          raw=gzip.decompress(open(sys.argv[1],'rb').read())
          catalog=json.load(open(sys.argv[2],encoding='utf-8'))
          assert raw[:4]==b'glTF' and struct.unpack_from('<I',raw,8)[0]==len(raw)
          json_len=struct.unpack_from('<I',raw,12)[0]
          doc=json.loads(raw[20:20+json_len].decode('utf-8').rstrip(' '))
          assert catalog['license']=='CC BY 4.0' and catalog['renderedPointCount']>=400000
          assert doc['meshes'][0]['primitives'][0]['mode']==0
          print('BRIDGEPOINT_PLANE_WRECKS_V1_LIVE_ASSET_PASS',catalog['renderedPointCount'],'points',len(raw),'GLB bytes')
          PY
          python3 - "$D/b29" "$D/zero" "$D/sunderland" "$D/extracatalog" <<'PY'
          import gzip,json,struct,sys
          catalog=json.load(open(sys.argv[4],encoding='utf-8'))
          assert len(catalog['models'])==4
          by_id={m['id']:m for m in catalog['models']}
          assert {'b29-over-exposed-bleaklow','mitsubishi-zero-a6m3-iwm-london','short-sunderland-ej138-munkholmen','messerschmitt-bf109-g6-planier'}==set(by_id)
          for path,model_id in ((sys.argv[1],'b29-over-exposed-bleaklow'),(sys.argv[2],'mitsubishi-zero-a6m3-iwm-london'),(sys.argv[3],'short-sunderland-ej138-munkholmen')):
              raw=gzip.decompress(open(path,'rb').read())
              assert raw[:4]==b'glTF' and struct.unpack_from('<I',raw,8)[0]==len(raw)
              json_len=struct.unpack_from('<I',raw,12)[0]
              doc=json.loads(raw[20:20+json_len].decode('utf-8').rstrip(' '))
              primitives=[p for mesh in doc.get('meshes',[]) for p in mesh.get('primitives',[])]
              assert primitives and all(p.get('mode',4)==4 for p in primitives)
              assert by_id[model_id]['license'] in ('CC BY 4.0','CC0 1.0')
              assert by_id[model_id]['triangles']>=1000
              print('BRIDGEPOINT_ADDITIONAL_PLANE_MESH_LIVE_PASS',model_id,by_id[model_id]['triangles'],'triangles',len(raw),'bytes')
          PY
          python3 - "$D/tokai" "$D/tokaicatalog" <<'PY'
          import gzip,json,struct,sys
          raw=gzip.decompress(open(sys.argv[1],'rb').read())
          manifest=json.load(open(sys.argv[2],encoding='utf-8'))
          assert raw[:4]==b'glTF' and struct.unpack_from('<I',raw,8)[0]==len(raw)
          json_len=struct.unpack_from('<I',raw,12)[0]
          doc=json.loads(raw[20:20+json_len].decode('utf-8').rstrip(' '))
          assert manifest['id']=='tokai-maru-apra-harbor'
          assert manifest['license']=='CC BY 4.0'
          assert manifest['renderedPointCount']>=500000
          assert manifest['depthMapCount']>=2000 and manifest['sourcePhotos']>=2000
          assert doc['meshes'][0]['primitives'][0]['mode']==0
          assert doc['accessors'][0]['count']==manifest['renderedPointCount']
          print('BRIDGEPOINT_TOKAI_MARU_LIVE_ASSET_PASS',manifest['renderedPointCount'],'points',len(raw),'GLB bytes')
          PY
          python3 - "$D/p39q" "$D/p39qmanifest" <<'PY'
          import gzip,json,struct,sys
          raw=gzip.decompress(open(sys.argv[1],'rb').read())
          manifest=json.load(open(sys.argv[2],encoding='utf-8'))
          assert raw[:4]==b'glTF' and struct.unpack_from('<I',raw,8)[0]==len(raw)
          json_len=struct.unpack_from('<I',raw,12)[0]
          doc=json.loads(raw[20:20+json_len].decode('utf-8').rstrip(' \\\\0'))
          assert manifest['id']=='bell-p39q-airacobra-lake-huron'
          assert 'Public Domain' in manifest['license']
          assert manifest['sourcePhotos']==438 and manifest['imageAlignmentPercent']==100
          assert manifest['triangles']>=1000 or manifest['vertices']>=1000
          primitives=[p for mesh in doc.get('meshes',[]) for p in mesh.get('primitives',[])]
          assert primitives
          print('BRIDGEPOINT_P39Q_LIVE_ASSET_PASS',manifest['triangles'],'triangles',manifest['vertices'],'vertices',len(raw),'GLB bytes')
          PY
          python3 - "$D/messerschmitt" "$D/extracatalog" <<'PY'
          import gzip,json,struct,sys
          raw=gzip.decompress(open(sys.argv[1],'rb').read())
          catalog=json.load(open(sys.argv[2],encoding='utf-8'))
          item=next(m for m in catalog['models'] if m['id']=='messerschmitt-bf109-g6-planier')
          assert raw[:4]==b'glTF' and struct.unpack_from('<I',raw,8)[0]==len(raw)
          json_len=struct.unpack_from('<I',raw,12)[0]
          doc=json.loads(raw[20:20+json_len].decode('utf-8').rstrip(' '))
          assert item['sourcePointCount']==278909422
          assert item['license']=='CC BY 4.0'
          assert item['renderedPointCount']==doc['accessors'][0]['count']
          assert doc['meshes'][0]['primitives'][0]['mode']==0
          print('BRIDGEPOINT_MESSERSCHMITT_LIVE_ASSET_PASS',item['renderedPointCount'],'points',len(raw),'GLB bytes')
          PY
          echo "BRIDGEPOINT_PLANE_WRECKS_EXTRA_LIVE_VERIFY_PASS"

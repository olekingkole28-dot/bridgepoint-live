name: Deploy BridgePoint Live

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download verified BridgePoint v229 production build
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-0430-822f-9d90-e4e6d2022448/raw?se=2026-08-17T17%3A49%3A32Z&sp=r&sv=2026-02-06&sr=b&scid=775ead29-ce6a-5058-b644-079a628dd4c2&skoid=bbd22fc4-f881-4ea4-b2f3-c12033cf6a8b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-17T02%3A07%3A20Z&ske=2026-08-18T02%3A07%3A20Z&sks=b&skv=2026-02-06&sig=xGaOqK1XTZYMALfUiWfqeH7kIKsK9qaDpomEavTa87k%3D' -o /tmp/bridgepoint-v229.zip
          echo 'ef44a97b77ea1f356b229b1baf5dfd9197657ebf25d63ea509e15aa35a46c06a  /tmp/bridgepoint-v229.zip' | sha256sum -c -
          rm -rf site
          mkdir -p site
          unzip -q /tmp/bridgepoint-v229.zip -d site
          test -s site/index.html
          test -s site/main.dart.js
          test -s site/bridgepoint-release.json
          grep -q '7856ce424502c2ac55b907761f8048faddcf90bb' site/bridgepoint-release.json
          grep -q 'BridgePoint could not reach the server several times in a row' site/main.dart.js
          grep -q 'bridgepoint-us-storm-clouds-v229' site/main.dart.js
          grep -q 'Nationwide alert feed checked' site/main.dart.js
          grep -q 'Automation Recovery' site/main.dart.js
          grep -q 'Test NOAA live' site/main.dart.js
          grep -q 'Open radar' site/main.dart.js
          grep -q 'IN-PROGRESS BUILDS' site/main.dart.js
          grep -q 'Build steps, percentages & approval gates' site/main.dart.js
          grep -q 'First-time invited owner / Forgot password' site/main.dart.js
          grep -q 'bridgepointintelligence@gmail.com' site/main.dart.js
          if grep -q 'Connection looks spotty' site/main.dart.js; then
            echo 'Old noisy connection warning unexpectedly remains user-visible.' >&2
            exit 1
          fi
          echo 'BridgePoint v229 production artifact verified for deployment.'
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish BridgePoint
        id: deployment
        uses: actions/deploy-pages@v4
name: Inspect Live FAA Loader URLs (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-live-faa-loader-v1.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read actual current production script attributes, no changes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          from hashlib import sha256
          import re
          old='bridgepoint-drone-awareness-v1.js?v=11-shipwrecks-v2-persistent-icons&aircraft=9-filters-ground-tethers'
          new=old+'&faa-gate=8-no-icon-sweep'
          for rel in ('index.html','app/index.html'):
            url='https://bridgepointintelligence.online/'+rel+'?inspect='+str(__import__('time').time_ns())
            with urlopen(Request(url,headers={'Cache-Control':'no-cache'}),timeout=30) as r:b=r.read()
            s=b.decode('utf-8')
            for token in ('bridgepoint-drone-awareness-v1.js','faa=7-faa-persistent-no-sweep','faa-gate=8-no-icon-sweep'):
              print('PRODUCTION_TOKEN',rel,token,'count=',s.count(token))
            print('PRODUCTION_URLS',rel, re.findall(r'[a-zA-Z0-9_./-]*bridgepoint-drone-awareness-v1\.js[^\x22\x27<> ]*',s))
            print('PRODUCTION_COUNTS',rel,'old',s.count(old),'new',s.count(new),'sha256',sha256(b).hexdigest(),'bytes',len(b))
            assert s.count('bridgepoint-drone-awareness-v1.js')>=1
            assert s.count('faa-gate=8-no-icon-sweep')==1, 'FAA gate marker missing on '+rel
            assert s.count('faa=7-faa-persistent-no-sweep')==1, 'FAA renderer cache marker missing on '+rel
          print('LIVE_FAA_BOTH_PAGES_FRESH_GATE_PASS')
          PY
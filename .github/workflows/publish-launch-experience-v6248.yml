name: Publish BridgePoint Launch Experience V6254

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-launch-experience-v6248.yml'
      - 'recovery/apply_launch_experience_v6248.py'
      - 'tests/test_launch_experience_v6248.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the isolated launch patch
        run: python3 -m unittest discover -s tests -p 'test_launch_experience_v6248.py' -v

      - name: Download the latest deployed V5000 production Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: bridgepoint-v5000-1
          run-id: 42407820738
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: /tmp/bridgepoint-pages-bundle

      - name: Extract the production Pages baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          ARTIFACT_TAR="$(find /tmp/bridgepoint-pages-bundle -type f -name 'artifact.tar' -print -quit)"
          test -n "$ARTIFACT_TAR"
          tar -xf "$ARTIFACT_TAR" -C site
          for p in index.html app/index.html landing.js app.js sw.js manifest.webmanifest app/intelligence-launch/index.html app/intelligence-launch/manifest.webmanifest; do
            test -s "site/$p" || { echo "Missing production entry file: $p"; exit 1; }
          done
          echo "Restored the exact deployed V5000 Pages artifact from run 42407820738."

      - name: Snapshot every production file before the launch-only patch
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('site')
          before={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in root.rglob('*') if p.is_file()}
          Path('/tmp/launch-experience-before.json').write_text(json.dumps(before,sort_keys=True))
          print('SNAPSHOT_PRODUCTION_FILES',len(before))
          PY

      - name: Apply only the V6254 launch and installed-app entry changes
        run: python3 recovery/apply_launch_experience_v6248.py site

      - name: Validate syntax and prove no unrelated production file changed
        shell: bash
        run: |
          set -euo pipefail
          node --check site/landing.js
          node --check site/app.js
          node --check site/sw.js
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          root=Path('site')
          html=(root/'index.html').read_text(encoding='utf-8')
          match=re.search(r'<script id="bpWelcomeGateScriptV1">([\s\S]*?)</script>',html)
          assert match, 'Welcome gate script was not found'
          Path('/tmp/bridgepoint-welcome-gate-v6254.js').write_text(match.group(1),encoding='utf-8')
          before=json.loads(Path('/tmp/launch-experience-before.json').read_text())
          after={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in root.rglob('*') if p.is_file()}
          removed=set(before)-set(after)
          added=set(after)-set(before)
          changed={p for p in before.keys() & after.keys() if before[p]!=after[p]}
          expected={
            'index.html','app/index.html','landing.js','app.js','sw.js','manifest.webmanifest',
            'app/intelligence-launch/index.html','app/intelligence-launch/manifest.webmanifest'
          }
          assert not removed, f'Unexpected removed production files: {sorted(removed)}'
          assert not added, f'Unexpected added production files: {sorted(added)}'
          assert changed==expected, f'Unexpected production file changes: {sorted(changed)}'
          print('PASS: exactly eight launch/PWA entry files changed; every globe, data, map and feature asset is byte-identical.')
          PY
          node --check /tmp/bridgepoint-welcome-gate-v6254.js
          grep -Fq 'bpw-celestial-system' site/index.html
          grep -Fq 'bpwCelestialCanvasV6254' site/index.html
          grep -Fq 'bpwCelestialFallbackCanvasV6254' site/index.html
          grep -Fq 'position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;z-index:9!important' site/index.html
          grep -Fq 'mix-blend-mode:screen' site/index.html
          grep -Fq 'function celestialAlignment(width,height)' site/index.html
          grep -Fq 'sunRadius=Math.min(earthRadius*.47' site/index.html
          grep -Fq 'sunlightDirection:[0,.92,.40]' site/index.html
          grep -Fq 'sunBehindEarth=u_earthR>0.0' site/index.html
          grep -Fq 'verticalHalf-sunRadius*.70' site/index.html
          grep -Fq 'moonRadius=earthRadius*.136' site/index.html
          grep -Fq 'orbitPhase=Date.now()*.000085' site/index.html
          grep -Fq 'orbitRadius=length(vec2(oq.x/.95,(oq.y+1.48)/.34))' site/index.html
          grep -Fq 'u_moonSpin' site/index.html
          grep -Fq 'cassini=1.0-smoothstep' site/index.html
          grep -Fq '__BP_CELESTIAL_ALIGNMENT_V6254__' site/index.html
          grep -Fq 'flareReach=1.20' site/index.html
          grep -Fq 'craterRelief(uv,rim,shadow)' site/index.html
          grep -Fq 'const galaxyProgram=program(' site/index.html
          grep -Fq 'const planetProgram=program(' site/index.html
          grep -Fq 'float laneA=1.0-smoothstep' site/index.html
          grep -Fq "name:'Neptune'" site/index.html
          grep -Fq 'ringR=length(vec2(q.x,(q.y-.045*q.x)/.46))' site/index.html
          grep -Fq 'const starCount=lowPower?4200:8200' site/index.html
          grep -Fq 'scale=u_bodyType>6.5?2.20:1.0' site/index.html
          grep -Fq 'galaxyOffset=.48-.46*galaxyBlend*galaxyBlend*(3-2*galaxyBlend)' site/index.html
          grep -Fq 'bandOffset=mix(.48,.02,smoothstep(1.05,1.85,aspect))' site/index.html
          grep -Fq 'bpw-wordmark-main' site/index.html
                    grep -Fq "vec3 lunar=mix" site/index.html
          ! grep -Fq 'class="bpw-globe-aura"' site/index.html
          grep -Fq 'INTELLIGENCE</span></div>' site/index.html
          grep -Fq 'data-mode="signup"' site/index.html
          grep -Fq 'data-mode="signin"' site/index.html
          grep -Fq 'start_url":"/"' site/manifest.webmanifest
          grep -Fq 'start_url":"/"' site/app/intelligence-launch/manifest.webmanifest
          grep -Fq "BRIDGEPOINT_LAUNCH_EXPERIENCE_BUILD='v6254-realistic-solar-scene'" site/sw.js

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          name: bridgepoint-launch-experience-v6254
          path: site
          include-hidden-files: true

      - name: Publish the isolated V6254 launch experience
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: bridgepoint-launch-experience-v6254

      - name: Verify website, app and legacy installed-app entry on the live domain
        shell: bash
        run: |
          set -euo pipefail
          O='https://bridgepointintelligence.online'
          ok=0
          fetch_live() {
            local path="$1" output="$2"
            curl --connect-timeout 3 --max-time 8 --retry 1 --retry-connrefused --retry-delay 1 -fsSL -H 'Cache-Control: no-cache' "${O}${path}?launch-v6254=${q}" -o "$output" || true
          }
          for i in $(seq 1 20); do
            q="${GITHUB_SHA}-${i}-$(date +%s)"
            rm -f /tmp/live-root.html /tmp/live-app.html /tmp/live-legacy-app.html /tmp/live-landing.js /tmp/live-app.js /tmp/live-sw.js /tmp/live-manifest.json /tmp/live-legacy-manifest.json
            fetch_live "/" /tmp/live-root.html & p1=$!
            fetch_live "/app/" /tmp/live-app.html & p2=$!
            fetch_live "/app/intelligence-launch/" /tmp/live-legacy-app.html & p3=$!
            fetch_live "/landing.js" /tmp/live-landing.js & p4=$!
            fetch_live "/app.js" /tmp/live-app.js & p5=$!
            fetch_live "/sw.js" /tmp/live-sw.js & p6=$!
            fetch_live "/manifest.webmanifest" /tmp/live-manifest.json & p7=$!
            fetch_live "/app/intelligence-launch/manifest.webmanifest" /tmp/live-legacy-manifest.json & p8=$!
            wait "$p1" || true; wait "$p2" || true; wait "$p3" || true; wait "$p4" || true
            wait "$p5" || true; wait "$p6" || true; wait "$p7" || true; wait "$p8" || true
            if grep -Fq 'bpWelcomeGateStylesV6254' /tmp/live-root.html 2>/dev/null &&
               grep -Fq 'INTELLIGENCE</span></div>' /tmp/live-root.html 2>/dev/null &&
               grep -Fq 'bpwCelestialCanvasV6254' /tmp/live-root.html 2>/dev/null &&
               grep -Fq 'bpwCelestialFallbackCanvasV6254' /tmp/live-root.html 2>/dev/null &&
               grep -Fq 'position:fixed!important;inset:0!important;width:100vw!important;height:100vh!important;height:100dvh!important;z-index:9!important' /tmp/live-root.html 2>/dev/null &&
               grep -Fq 'function celestialAlignment(width,height)' /tmp/live-root.html 2>/dev/null &&
               grep -Fq 'sunRadius=Math.min(earthRadius*.47' /tmp/live-root.html 2>/dev/null &&
               grep -Fq 'sunlightDirection:[0,.92,.40]' /tmp/live-root.html 2>/dev/null &&
               grep -Fq 'sunBehindEarth=u_earthR>0.0' /tmp/live-root.html 2>/dev/null &&
               grep -Fq 'moonRadius=earthRadius*.136' /tmp/live-root.html 2>/dev/null &&
               grep -Fq 'orbitPhase=Date.now()*.000085' /tmp/live-root.html 2>/dev/null &&
               grep -Fq 'orbitRadius=length(vec2(oq.x/.95,(oq.y+1.48)/.34))' /tmp/live-root.html 2>/dev/null &&
               grep -Fq 'u_moonSpin' /tmp/live-root.html 2>/dev/null &&
               grep -Fq 'cassini=1.0-smoothstep' /tmp/live-root.html 2>/dev/null &&
               grep -Fq '__BP_CELESTIAL_ALIGNMENT_V6254__' /tmp/live-root.html 2>/dev/null &&
               grep -Fq 'flareReach=1.20' /tmp/live-root.html 2>/dev/null &&
               grep -Fq 'craterRelief(uv,rim,shadow)' /tmp/live-root.html 2>/dev/null &&
               grep -Fq 'const galaxyProgram=program(' /tmp/live-root.html 2>/dev/null &&
               grep -Fq 'const planetProgram=program(' /tmp/live-root.html 2>/dev/null &&
               grep -Fq 'float laneA=1.0-smoothstep' /tmp/live-root.html 2>/dev/null &&
               grep -Fq 'ringR=length(vec2(q.x,(q.y-.045*q.x)/.46))' /tmp/live-root.html 2>/dev/null &&
               grep -Fq 'scale=u_bodyType>6.5?2.20:1.0' /tmp/live-root.html 2>/dev/null &&
               grep -Fq 'galaxyOffset=.48-.46*galaxyBlend*galaxyBlend*(3-2*galaxyBlend)' /tmp/live-root.html 2>/dev/null &&
               grep -Fq 'bandOffset=mix(.48,.02,smoothstep(1.05,1.85,aspect))' /tmp/live-root.html 2>/dev/null &&
               grep -Fq 'const starCount=lowPower?4200:8200' /tmp/live-root.html 2>/dev/null &&
               grep -Fq 'now-lastAlignment<110' /tmp/live-root.html 2>/dev/null &&
               grep -Fq '/?return=' /tmp/live-app.html 2>/dev/null &&
               ! grep -Fq '/?auth=signin&return=' /tmp/live-app.html 2>/dev/null &&
               grep -Fq 'content="0;url=/"' /tmp/live-legacy-app.html 2>/dev/null &&
               grep -Fq "location.replace('/')" /tmp/live-legacy-app.html 2>/dev/null &&
               grep -Fq 'sw.js?v=6254-realistic-solar-scene' /tmp/live-landing.js 2>/dev/null &&
               grep -Fq 'sw.js?v=6254-realistic-solar-scene' /tmp/live-app.js 2>/dev/null &&
               grep -Fq "BRIDGEPOINT_LAUNCH_EXPERIENCE_BUILD='v6254-realistic-solar-scene'" /tmp/live-sw.js 2>/dev/null &&
               grep -Fq '"start_url":"/"' /tmp/live-manifest.json 2>/dev/null &&
               grep -Fq '"start_url":"/"' /tmp/live-legacy-manifest.json 2>/dev/null; then
              ok=1
              break
            fi
            sleep 3
          done
          test "$ok" -eq 1
          echo 'LIVE V6254 PASS: fixed upper Sun, Earth-occluded solar disc, matching day/night terminator, rotating night-side Moon, crater relief, layered Milky Way dust lanes, detailed planets and Saturn ring divisions verified.'

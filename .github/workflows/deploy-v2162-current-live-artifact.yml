name: Publish Current BridgePoint Living World

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-v2162-current-live-artifact.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout rebuilt app artifact
        uses: actions/checkout@v4
        with:
          ref: live-artifact
          fetch-depth: 1

      - name: Verify current living-world runtime
        shell: bash
        run: |
          set -euo pipefail
          test -s app/index.html
          test -s app/map-v1997.js
          test -s app/map-v1997-weather-hotfix.js
          test -s app/map-v2060-immersive-world.js
          test -s app/map-v2081-gpu-weather-runtime.js
          test -s app/map-v2162-game-world.js
          test -s app/map-v2163-photorealistic-adapter.js
          test -s app/map-v2170-living-world.js
          test -s app/map-v2171-weather-observations.js
          test -s app/map-v2172-performance-world.js
          grep -Fq 'map-v2081-gpu-weather-runtime.js?v=2081' app/map-v1997-weather-hotfix.js
          grep -Fq 'map-v2170-living-world.js?v=2170' app/map-v1997-weather-hotfix.js
          grep -Fq 'map-v2171-weather-observations.js?v=2171' app/map-v1997-weather-hotfix.js
          grep -Fq 'map-v2172-performance-world.js?v=2172' app/map-v1997-weather-hotfix.js
          ! grep -Fq 'map-v2080-cinematic-weather.js?v=2080' app/map-v1997-weather-hotfix.js
          grep -Fq "type:'globe'" app/map-v2170-living-world.js
          grep -Fq 'bp2172-tree-crown' app/map-v2172-performance-world.js
          grep -Fq "makePattern('bp2172-grass','grass')" app/map-v2172-performance-world.js
          grep -Fq 'MAP_LOCK_CARDS_REQUESTABLE' app/map-v2172-performance-world.js
          grep -Fq 'bridgepoint_request_country_expansion_v2170' app/map-v2172-performance-world.js
          grep -Fq 'bp2171-wind-flow' app/map-v2171-weather-observations.js
          node --check app/map-v2081-gpu-weather-runtime.js
          node --check app/map-v2162-game-world.js
          node --check app/map-v2163-photorealistic-adapter.js
          node --check app/map-v2170-living-world.js
          node --check app/map-v2171-weather-observations.js
          node --check app/map-v2172-performance-world.js
          node --check app/map-v1997-weather-hotfix.js

      - name: Assemble exact rebuilt site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir site
          tar --exclude=.git --exclude=site -cf - . | tar -xf - -C site
          touch site/.nojekyll site/app/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-v2172
          path: site

      - name: Publish rebuilt app
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-v2172

      - name: Verify public app received Living World V2172
        shell: bash
        run: |
          set -euo pipefail
          origin='https://bridgepointintelligence.online'
          ok=0
          for attempt in $(seq 1 36); do
            salt="${GITHUB_SHA}-${attempt}-$(date +%s)"
            curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${origin}/app/map-v2172-performance-world.js?verify=${salt}" -o /tmp/v2172.js || true
            curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${origin}/app/map-v1997-weather-hotfix.js?verify=${salt}" -o /tmp/loader.js || true
            if grep -Fq 'bp2172-tree-crown' /tmp/v2172.js && grep -Fq 'MAP_LOCK_CARDS_REQUESTABLE' /tmp/v2172.js && grep -Fq 'map-v2172-performance-world.js?v=2172' /tmp/loader.js && ! grep -Fq 'map-v2080-cinematic-weather.js?v=2080' /tmp/loader.js; then ok=1; break; fi
            sleep 4
          done
          test "$ok" = 1
          echo V2172_PUBLIC_APP_PASS

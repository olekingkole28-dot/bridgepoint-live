          total=sum(len(g[0]) for g in groups.values());assert total<500000 and len(materials)>=12
          while len(buf)%4:buf.append(0)
          doc={'asset':{'version':'2.0','generator':'BridgePoint V4; Valdrada v0.7.1 source ODbL; original procedural material maps'},'scene':0,'scenes':[{'nodes':[0]}],'nodes':[{'mesh':0}],'meshes':[{'primitives':prims}],'materials':materials,'textures':textures,'images':images,'samplers':[{'magFilter':9729,'minFilter':9987,'wrapS':10497,'wrapT':10497}],'buffers':[{'byteLength':len(buf)}],'bufferViews':views,'accessors':acc}
          j=json.dumps(doc,separators=(',',':')).encode();j+=b' '*((-len(j))%4)
          new=struct.pack('<4sII',b'glTF',2,12+8+len(j)+8+len(buf))+struct.pack('<I4s',len(j),b'JSON')+j+struct.pack('<I4s',len(buf),b'BIN\0')+buf
          assert len(new)<55_000_000
          (site/asset).write_bytes(new)
          (site/info).write_text(json.dumps({'source':'Valdrada v0.7.1 / NYC Open Data / OpenStreetMap','license':'ODbL 1.0','originalSource':'source-architecture-v3.glb','sourceGeometryPreserved':True,'textureResolution':512,'materialCount':len(materials),'wallCount':wall_count,'roofTriangles':roof_count,'entranceWalls':door_count,'trimSurfaces':trim_count,'illustrativeRoofEquipmentCount':len(picked),'triangles':total//3,'bytes':len(new),'approximation':'Procedural textures and illustrative architectural equipment, not surveyed facade imagery.'},indent=2))
          print('TEXTURED_CITY_READY',wall_count,roof_count,door_count,trim_count,len(picked),len(materials),total//3,len(new))
          p=site/scan;s=p.read_text()
          a=s.index('function sourceCityMaterial(');b=s.index('async function loadSourceCity(',a)
          s=s[:a]+r'''function sourceCityMaterial(T,m,u){
           if(!m.map)throw Error('missing baked facade texture');
           const glass=/glass/.test(m.name||'');
           m.map.anisotropy=8;
           const out=new T.MeshBasicMaterial({map:m.map,vertexColors:true,side:T.DoubleSide});
           out.onBeforeCompile=shader=>{
            Object.assign(shader.uniforms,u);
            shader.vertexShader=shader.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 bpSurfacePosition;').replace('#include <project_vertex>','#include <project_vertex>\nbpSurfacePosition=(modelMatrix*vec4(transformed,1.0)).xyz;');
            shader.fragmentShader=shader.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 bpSurfacePosition;\nuniform vec3 bpCitySun;\nuniform vec3 bpCityView;\nuniform float bpCityDay;');
            shader.fragmentShader=shader.fragmentShader.replace('#include <color_fragment>','#include <color_fragment>\nvec3 cN=cross(dFdx(bpSurfacePosition),dFdy(bpSurfacePosition));vec3 N=normalize(cN+vec3(1e-12));if(!gl_FrontFacing)N=-N;float sun=max(dot(N,bpCitySun),0.0);float wall=1.0-smoothstep(0.2,0.8,abs(N.y));float shade=0.58+0.42*sun*bpCityDay;diffuseColor.rgb*=mix(shade,0.85+0.15*sun,1.0-wall);'+(glass?'vec3 v=normalize(bpCityView);vec3 H=normalize(bpCitySun+v+vec3(1e-6));float reflectivity=smoothstep(0.005,0.045,diffuseColor.b-diffuseColor.r);float shine=pow(max(dot(N,H),0.0),48.0)*sun*wall*bpCityDay;float fresnel=pow(1.0-clamp(dot(N,v),0.0,1.0),3.0);diffuseColor.rgb+=vec3(1.0,0.76,0.42)*shine*reflectivity*0.95+vec3(0.08,0.14,0.22)*fresnel*reflectivity*wall;':''));
           };
           out.customProgramCacheKey=()=>glass?'bp-textured-city-v4-glass':'bp-textured-city-v4-masonry';
           return out;
          }

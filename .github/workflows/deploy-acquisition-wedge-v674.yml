name: Deploy BridgePoint Single Publisher V683

on:
  push:
    branches: [main]
    paths:
      - sample/index.html
      - pilot/index.html
      - contact/index.html
      - owner/global/index.html
      - downloads/backup/**
      - enterprise/trust/index.html
      - .well-known/security.txt
      - .github/workflows/deploy-acquisition-wedge-v674.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble current durable BridgePoint release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site && mkdir site
          git archive --format=tar origin/live-artifact | tar -xf - -C site

          mkdir -p site/sample site/pilot site/contact site/owner/global site/downloads/backup site/enterprise/trust site/.well-known
          cp sample/index.html site/sample/index.html
          cp pilot/index.html site/pilot/index.html
          cp contact/index.html site/contact/index.html
          cp owner/global/index.html site/owner/global/index.html
          cp -a downloads/backup/. site/downloads/backup/
          cp enterprise/trust/index.html site/enterprise/trust/index.html
          cp .well-known/security.txt site/.well-known/security.txt

          python -m py_compile site/downloads/backup/bridgepoint_local_runner.py
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re

          release_path=Path('site/app/bridgepoint-release.json')
          promotion_path=Path('site/app/public-promotion-v682.json')
          app_js=Path('site/app/main.dart.js')
          if not (release_path.is_file() and promotion_path.is_file() and app_js.is_file()):
              raise SystemExit('Modern compiled-app promotion receipt is missing.')
          release=json.loads(release_path.read_text(encoding='utf-8'))
          promotion=json.loads(promotion_path.read_text(encoding='utf-8'))
          if release.get('version') != promotion.get('compiled_source_sha'):
              raise SystemExit('Compiled app source SHA does not match promotion receipt.')
          actual=hashlib.sha256(app_js.read_bytes()).hexdigest()
          if actual != promotion.get('main_js_sha256'):
              raise SystemExit('Compiled app digest does not match promotion receipt.')
          if release.get('version') in {653, '653'} or promotion.get('compiled_source_sha') in {444, '444'}:
              raise SystemExit('Obsolete V444/V653 app regression blocked.')
          if promotion.get('source_repo_private') is not True:
              raise SystemExit('Private-source provenance guard failed.')

          home=Path('site/index.html')
          s=home.read_text(encoding='utf-8')
          required=['Know where to work before you knock.','Show me my territory — free','bp-acquisition-wedge-v681']
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('Acquisition wedge missing: '+repr(missing))
          if 'href="/enterprise/trust/"' not in s:
              s=s.replace('<a href="/contact/">Contact</a>','<a href="/enterprise/trust/">Trust Center</a><a href="/contact/">Contact</a>',1)
          home.write_text(s,encoding='utf-8')

          authored=[Path('site/index.html'),Path('site/sample/index.html'),Path('site/pilot/index.html'),Path('site/contact/index.html'),Path('site/owner/global/index.html'),Path('site/enterprise/trust/index.html'),Path('site/.well-known/security.txt')]
          authored += [f for f in Path('site/downloads/backup').iterdir() if f.is_file() and f.suffix.lower() in {'.ps1','.py','.bat','.txt'}]
          pats=[
            re.compile(r'(?i)(SUPABASE_SERVICE_ROLE_KEY|STRIPE_SECRET_KEY|OPENAI_API_KEY)\s*=\s*["\']?[^\s"\']{12,}'),
            re.compile(r'(?i)sb_secret_[A-Za-z0-9_-]{20,}'),
            re.compile(r'(?i)sk_live_[A-Za-z0-9_-]{20,}'),
            re.compile(r'(?i)sk-proj-[A-Za-z0-9_-]{20,}')]
          for f in authored:
              text=f.read_text(encoding='utf-8',errors='ignore')
              if any(p.search(text) for p in pats):
                  raise SystemExit('Privileged secret-shaped value found in '+str(f))
          PY

          grep -q '<base href="/app/">' site/app/index.html
          grep -q 'Show my free opportunities' site/sample/index.html
          grep -q 'Buy this territory report — \$49 once' site/sample/index.html
          grep -q 'Prove BridgePoint beside the workflow you already use' site/pilot/index.html
          grep -q 'BridgePoint Intelligence is an independent Connecticut-based property-intelligence software platform' site/contact/index.html
          grep -q 'Start worldwide discovery' site/owner/global/index.html
          grep -q 'Public Trust Center' site/enterprise/trust/index.html
          grep -q 'Canonical: https://bridgepointintelligence.online/.well-known/security.txt' site/.well-known/security.txt
          grep -q 'BridgePoint State Export Wizard' site/downloads/backup/BridgePoint_State_Export_Wizard.bat
          grep -q 'BridgePoint Local' site/downloads/backup/BridgePoint_Local_Run.bat
          grep -q '127.0.0.1' site/downloads/backup/bridgepoint_local_runner.py
          grep -q 'BridgePoint Full Backup' site/downloads/backup/BridgePoint_Backup_Wizard.bat
          grep -q 'pg_dump' site/downloads/backup/bridgepoint_full_export_windows.ps1
          grep -q 'SHA-256' site/downloads/backup/bridgepoint_verify_backup_windows.ps1
          grep -q 'BridgePoint Restore Test' site/downloads/backup/BridgePoint_Restore_Test.bat
          grep -q 'Production BridgePoint database is blocked' site/downloads/backup/bridgepoint_restore_wizard.ps1
          touch site/.nojekyll site/app/.nojekyll

      - name: Persist exact V683 durable artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/final-live && mkdir /tmp/final-live
          cp -a site/. /tmp/final-live/
          cd /tmp/final-live
          git init -q
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m 'BridgePoint V683 guarded single-publisher release'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish V683
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live release
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 10 --retry-delay 3 'https://bridgepointintelligence.online/' -o /tmp/home
          curl -fsSL --retry 10 --retry-delay 3 'https://bridgepointintelligence.online/app/bridgepoint-release.json' -o /tmp/release.json
          curl -fsSL --retry 10 --retry-delay 3 'https://bridgepointintelligence.online/app/public-promotion-v682.json' -o /tmp/promotion.json
          curl -fsSL --retry 10 --retry-delay 3 'https://bridgepointintelligence.online/enterprise/trust/' -o /tmp/trust
          curl -fsSL --retry 10 --retry-delay 3 'https://bridgepointintelligence.online/contact/' -o /tmp/contact
          grep -q 'Know where to work before you knock' /tmp/home
          grep -q 'Trust Center' /tmp/home
          grep -q '9fd86839adbce02e48d36d893828b0e9cccd7987' /tmp/release.json
          grep -q '"public_release":682' /tmp/promotion.json
          grep -q 'Public Trust Center' /tmp/trust
          grep -q 'independent Connecticut-based property-intelligence software platform' /tmp/contact

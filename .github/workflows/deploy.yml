name: Deploy BridgePoint Live

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download audited BridgePoint Flutter release
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          curl -L --fail --retry 3 'https://sdmntpreastus.oaiusercontent.com/files/00000000-4cb4-81f9-b004-ffd52fb7838c/raw?se=2026-08-16T17%3A33%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=e56b2f8e-34e0-5915-83c8-97d77dc20237&skoid=de71a0d5-fb02-4fce-be69-9296aced242b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-15T22%3A38%3A49Z&ske=2026-08-16T22%3A38%3A49Z&sks=b&skv=2026-02-06&sig=t28DNe/OP%2B3gVUsZ9SqBW8qRtDiFETcfZen/vm64DNU%3D' -o /tmp/bridgepoint.zip
          unzip -q /tmp/bridgepoint.zip -d site
          touch site/.nojekyll
          sed -i 's#<base href="/">#<base href="./">#' site/index.html
          test -s site/index.html
          test -s site/main.dart.js
          test -s site/bridgepoint-release.json
          grep -q 'ba5643a8c129edbc49301651c3881a504d94eaf6' site/bridgepoint-release.json
          echo "BridgePoint v217 audited release staged successfully for public hosting."
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish BridgePoint
        id: deployment
        uses: actions/deploy-pages@v4
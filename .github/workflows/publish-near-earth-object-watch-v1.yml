name: Publish BridgePoint Near-Earth Object Watch over preserved production

on:
  workflow_dispatch:
  schedule:
    - cron: '24 8 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-near-earth-object-watch-v1.yml'
      - 'rebuild-v5000/bridgepoint-neo-watch-v1.js'
      - 'recovery/bridgepoint-welcome-space-v6260.js'
      - 'rebuild-v5000/bridgepoint-gaia-galaxy-v6270.js'
      - 'patches/earth-star-occlusion-v6294/bridgepoint-app-space-explorer-v1.js'

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-neo-watch-v1-preserved-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the latest successful production Pages snapshot
        id: baseline
        shell: bash
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?status=success&branch=main&per_page=100" --jq '.workflow_runs | map(select(.conclusion == "success")) | .[].id')"
          BASELINE_ID=""
          ARTIFACT=""
          for run_id in $RUNS; do
            candidate="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" --jq '.artifacts[]? | select((.expired|not) and (.name | startswith("bridgepoint-v5000-"))) | .name' | head -n 1 || true)"
            if [ -n "$candidate" ]; then
              BASELINE_ID="$run_id"
              ARTIFACT="$candidate"
              break
            fi
          done
          test -n "$BASELINE_ID"
          test -n "$ARTIFACT"
          echo "run_id=$BASELINE_ID" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "PRODUCTION_BASELINE run=$BASELINE_ID artifact=$ARTIFACT"

      - name: Download the production snapshot
        uses: actions/download-artifact@v4
        with:
          name: "${{ steps.baseline.outputs.artifact_name }}"
          run-id: "${{ steps.baseline.outputs.run_id }}"
          repository: "${{ github.repository }}"
          github-token: "${{ secrets.GITHUB_TOKEN }}"
          path: "${{ runner.temp }}/bp-pages-baseline"

      - name: Restore production and fingerprint every unrelated file
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find "$RUNNER_TEMP/bp-pages-baseline" -type f -name artifact.tar -print -quit)"
          test -n "$ARCHIVE"
          SITE="$RUNNER_TEMP/bp-site"
          mkdir -p "$SITE"
          tar -xf "$ARCHIVE" -C "$SITE"
          test -s "$SITE/index.html"
          test -s "$SITE/app/index.html"
          test -s "$SITE/vendor/three.module.js"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          site=Path(os.environ['RUNNER_TEMP'])/'bp-site'
          targets={'index.html','app/index.html','bridgepoint-neo-watch-v1.js','bridgepoint-welcome-space-v6260.js','bridgepoint-app-space-explorer-v1.js','bridgepoint-gaia-galaxy-v6270.js','nea_extended.json.gz'}
          def digest(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return h.hexdigest()
          before={}
          for path in sorted(site.rglob('*')):
              if path.is_file():
                  rel=path.relative_to(site).as_posix()
                  if rel not in targets: before[rel]=digest(path)
          tmp=Path(os.environ['RUNNER_TEMP'])
          (tmp/'bp-neo-preservation-before.json').write_text(json.dumps(before,sort_keys=True))
          for rel in ('index.html','app/index.html'):
              path=site/rel
              html=path.read_text(encoding='utf-8')
              if '</body>' not in html.lower(): raise SystemExit(rel+' has no closing body tag')
              if 'id="bpPublicScansImportMapV1"' not in html:
                  raise SystemExit(rel+' is missing the preserved Three.js import map for the existing 3D scan viewer')
              (tmp/(rel.replace('/','-')+'.before.html')).write_text(html,encoding='utf-8')
          print('UNRELATED_PRODUCTION_FILES_FINGERPRINTED',len(before))
          PY

      - name: Download the daily Minor Planet Center near-Earth orbit catalogue
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bp-neo-orbits"
          curl --retry 6 --retry-all-errors --retry-delay 3 --max-time 120 -fSL \
            -H 'User-Agent: BridgePoint Intelligence NEO Watch 1.5.1 (https://bridgepointintelligence.online)' \
            'https://minorplanetcenter.net/Extended_Files/nea_extended.json.gz' \
            -o "$RUNNER_TEMP/bp-neo-orbits/nea_extended.json.gz"
          gzip -t "$RUNNER_TEMP/bp-neo-orbits/nea_extended.json.gz"
          python3 - <<'PY'
          import gzip,json,os
          from pathlib import Path
          path=Path(os.environ['RUNNER_TEMP'])/'bp-neo-orbits'/'nea_extended.json.gz'
          with gzip.open(path,'rt',encoding='utf-8') as handle:
              rows=json.load(handle)
          if not isinstance(rows,list) or len(rows)<1000:
              raise SystemExit('MPC near-Earth orbit catalogue is empty or malformed')
          needed={'a','e','i','Node','Peri','M','Epoch'}
          if not any(needed.issubset(set(row)) for row in rows[:100]):
              raise SystemExit('MPC orbit catalogue fields were not recognized')
          if not any(any(row.get(key) for key in ('Principal_desig','Number','Name')) for row in rows[:100]):
              raise SystemExit('MPC object identifier fields were not recognized')
          print('MPC_NEA_ORBITS_READY',len(rows))
          PY

      - name: Add the near-Earth object overlay to production
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/bp-site"
          cp rebuild-v5000/bridgepoint-neo-watch-v1.js "$SITE/bridgepoint-neo-watch-v1.js"
          cp recovery/bridgepoint-welcome-space-v6260.js "$SITE/bridgepoint-welcome-space-v6260.js"
          cp rebuild-v5000/bridgepoint-gaia-galaxy-v6270.js "$SITE/bridgepoint-gaia-galaxy-v6270.js"
          cp patches/earth-star-occlusion-v6294/bridgepoint-app-space-explorer-v1.js "$SITE/bridgepoint-app-space-explorer-v1.js"
          cp "$RUNNER_TEMP/bp-neo-orbits/nea_extended.json.gz" "$SITE/nea_extended.json.gz"
          python3 - <<'PY'
          import re,os
          from pathlib import Path
          site=Path(os.environ['RUNNER_TEMP'])/'bp-site'
          script='<script type="module" src="/bridgepoint-neo-watch-v1.js?v=1.5.1"></script>'
          module=Path('rebuild-v5000/bridgepoint-neo-watch-v1.js').read_text(encoding='utf-8')
          welcome=Path('recovery/bridgepoint-welcome-space-v6260.js').read_text(encoding='utf-8')
          app=Path('patches/earth-star-occlusion-v6294/bridgepoint-app-space-explorer-v1.js').read_text(encoding='utf-8')
          gaia=Path('rebuild-v5000/bridgepoint-gaia-galaxy-v6270.js').read_text(encoding='utf-8')
          required=('#bpv-dock-actions','bpv-v2-tool-button','function openPanel()','function ensureSharedSpace()','function buildSpaceObjects()','function rawRelativePositionAU','function displayPosition','new THREE.CatmullRomCurve3(pathPoints, true','full 3D nominal orbits','DecompressionStream','MPC_FILE','Principal_desig','Other_desigs','SPACE OBJECT TRACKING','data-neo-icons','data-neo-action="playpause"','NASA_FEED','nea_extended.json.gz','import * as THREE from')
          if not all(token in module for token in required):
              raise SystemExit('Overlay is missing its NASA feed, shared-space orbit paths, or object controls')
          if 'gold rods' in module.lower() or 'missRod' in module or 'approachCurve' in module or 'new THREE.WebGLRenderer' in module:
              raise SystemExit('Overlay must use long shared-space orbits without a separate, misleading Earth-impact scene')
          for token in ('getScene(){return scene}','getCamera(){return camera}','loadSolarCosmos(){return ensureSolarCosmos()}','focusSpaceOverview','focusSpacePoint'):
              if token not in welcome: raise SystemExit('Welcome scene is missing shared-space camera access: '+token)
          if 'getFrame(){return applyFrame()}' not in gaia or 'eclipticJ2000ToGalactic' not in gaia: raise SystemExit('Gaia solar-system coordinate frame is not exposed to the orbital overlay')
          if 'const toGalactic = frame?.eclipticJ2000ToGalactic' not in module: raise SystemExit('MPC heliocentric positions are not converted into BridgePoint galactic coordinates')
          if 'v6308-neo-galactic-space' not in app or 'focusGlobalMapForSpace' not in app or 'focusSpaceOverview?.(32)' not in app:
              raise SystemExit('Signed-in space persistence is missing')
          for rel in ('index.html','app/index.html'):
              path=site/rel
              html=path.read_text(encoding='utf-8')
              html=re.sub(r'<script type="module" src="/bridgepoint-neo-watch-v1\.js[^\"]*"></script>\s*','',html,flags=re.I)
              if html.count('id="bpPublicScansImportMapV1"')!=1: raise SystemExit(rel+' must preserve one Three.js import map')
              welcome_pattern=r'(src=["\'][^"\']*bridgepoint-welcome-space-v6260\.js)(?:\?[^"\']*)?(["\'])'
              html,welcome_n=re.subn(welcome_pattern,r'\1?v=v6402-neo-galactic-frame\2',html,flags=re.I)
              if welcome_n>1: raise SystemExit(rel+' has duplicate shared-space renderer references')
              if rel=='index.html' and welcome_n!=1: raise SystemExit('index.html must keep its welcome space renderer')
              app_deferred_pattern=r'(data-bp-deferred-src=["\'][^"\']*bridgepoint-app-space-explorer-v1\.js)(?:\?[^"\']*)?(["\'])'
              html,app_deferred_n=re.subn(app_deferred_pattern,r'\1?v=v6308-neo-galactic-space\2',html,flags=re.I)
              if app_deferred_n>1: raise SystemExit(rel+' has duplicate deferred signed-in space loaders')
              if app_deferred_n==0:
                  app_script_pattern=re.compile(r'<script\b(?=[^>]*\bsrc=["\'][^"\']*bridgepoint-app-space-explorer-v1\.js)[^>]*>.*?</script>',re.I|re.S)
                  app_scripts=list(app_script_pattern.finditer(html))
                  if len(app_scripts)>1: raise SystemExit(rel+' has duplicate signed-in space scripts')
                  if app_scripts:
                      tag=app_scripts[0].group(0)
                      updated=re.sub(r'(src=["\'][^"\']*bridgepoint-app-space-explorer-v1\.js)(?:\?[^"\']*)?(["\'])',r'\1?v=v6308-neo-galactic-space\2',tag,flags=re.I)
                      html=html[:app_scripts[0].start()]+updated+html[app_scripts[0].end():]
                  else:
                      app_script='<script src="/bridgepoint-app-space-explorer-v1.js?v=v6308-neo-galactic-space"></script>'
                      html=re.sub(r'</body>',app_script+'\n</body>',html,flags=re.I,count=1)
              html=re.sub(r'</body>',script+'\n</body>',html,flags=re.I,count=1)
              if html.count(script)!=1: raise SystemExit(rel+' must load exactly one near-Earth object overlay')
              path.write_text(html,encoding='utf-8')
          print('NEAR_EARTH_OBJECT_OVERLAY_ADDED_AND_SIGNED_IN_SPACE_LOADER_PRESERVED')
          PY
          node --input-type=module --check < rebuild-v5000/bridgepoint-neo-watch-v1.js
          node --input-type=module --check < recovery/bridgepoint-welcome-space-v6260.js
          node --input-type=module --check < rebuild-v5000/bridgepoint-gaia-galaxy-v6270.js
          node --check < patches/earth-star-occlusion-v6294/bridgepoint-app-space-explorer-v1.js

      - name: Prove unrelated production files and entrypoint content are preserved
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          tmp=Path(os.environ['RUNNER_TEMP']); site=tmp/'bp-site'
          before=json.loads((tmp/'bp-neo-preservation-before.json').read_text())
          targets={'index.html','app/index.html','bridgepoint-neo-watch-v1.js','bridgepoint-welcome-space-v6260.js','bridgepoint-app-space-explorer-v1.js','bridgepoint-gaia-galaxy-v6270.js','nea_extended.json.gz'}
          def digest(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''): h.update(chunk)
              return h.hexdigest()
          after={}
          for path in site.rglob('*'):
              if path.is_file():
                  rel=path.relative_to(site).as_posix()
                  if rel not in targets: after[rel]=digest(path)
          if before!=after:
              raise SystemExit('UNRELATED_PRODUCTION_FILE_CHANGE '+json.dumps({'missing':sorted(set(before)-set(after))[:20],'added':sorted(set(after)-set(before))[:20],'changed':sorted(k for k in before.keys() & after.keys() if before[k]!=after[k])[:20]}))
          for rel in ('index.html','app/index.html'):
              prior=(tmp/(rel.replace('/','-')+'.before.html')).read_text(encoding='utf-8')
              current=(site/rel).read_text(encoding='utf-8')
              def normalize(s):
                  s=re.sub(r'<script type="module" src="/bridgepoint-neo-watch-v1\.js[^\"]*"></script>\s*','',s,flags=re.I)
                  s=re.sub(r'<script\b[^>]*\bsrc=["\'][^"\']*bridgepoint-welcome-space-v6260\.js[^"\']*["\'][^>]*>\s*</script>\s*','',s,flags=re.I)
                  s=re.sub(r'<script\b[^>]*\bsrc=["\'][^"\']*bridgepoint-app-space-explorer-v1\.js[^"\']*["\'][^>]*>\s*</script>\s*','',s,flags=re.I)
                  s=re.sub(r'(data-bp-deferred-src=["\'][^"\']*bridgepoint-app-space-explorer-v1\.js)(?:\?[^"\']*)?(["\'])',r'\1?APP\2',s,flags=re.I)
                  return s
              if normalize(prior)!=normalize(current): raise SystemExit(rel+' changed outside the NEO and shared-space module references')
              if current.count('bridgepoint-neo-watch-v1.js?v=1.5.1')!=1: raise SystemExit(rel+' does not load exactly one new overlay')
              if 'bridgepoint-app-space-explorer-v1.js?v=v6308-neo-galactic-space' not in current: raise SystemExit(rel+' does not load signed-in space persistence')
              if rel=='index.html' and 'bridgepoint-welcome-space-v6260.js?v=v6402-neo-galactic-frame' not in current: raise SystemExit('index.html does not load the updated shared-space renderer')
          print('NON_TARGET_PRODUCTION_FILES_BYTE_FOR_BYTE_PRESERVED',len(before))
          print('ENTRYPOINT_CHANGES_LIMITED_TO_NEO_AND_SHARED_SPACE_MODULE_REFERENCES')
          PY

      - uses: actions/configure-pages@v5

      - name: Upload preserved production with near-Earth object watch
        uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-v5000-${{ github.run_attempt }}
          path: "${{ runner.temp }}/bp-site"
          include-hidden-files: true

      - name: Publish the preserved production snapshot
        id: deployment
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: node scripts/deploy-pages-extended.mjs

      - name: Verify the overlay on the live site
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://bridgepointintelligence.online'
          DIR="$RUNNER_TEMP/bp-neo-live"
          mkdir -p "$DIR"
          curl --retry 7 --retry-all-errors --retry-delay 3 --max-time 35 -fsSL -H 'Cache-Control: no-cache' "$ORIGIN/?verify=$GITHUB_SHA-neo-watch" -o "$DIR/root.html"
          curl --retry 7 --retry-all-errors --retry-delay 3 --max-time 35 -fsSL -H 'Cache-Control: no-cache' "$ORIGIN/app/?verify=$GITHUB_SHA-neo-watch" -o "$DIR/app.html"
          curl --retry 7 --retry-all-errors --retry-delay 3 --max-time 35 -fsSL -H 'Cache-Control: no-cache' "$ORIGIN/bridgepoint-neo-watch-v1.js?verify=$GITHUB_SHA-neo-watch" -o "$DIR/neo.js"
          curl --retry 7 --retry-all-errors --retry-delay 3 --max-time 35 -fsSL -H 'Cache-Control: no-cache' "$ORIGIN/bridgepoint-welcome-space-v6260.js?verify=$GITHUB_SHA-space" -o "$DIR/welcome.js"
          curl --retry 7 --retry-all-errors --retry-delay 3 --max-time 35 -fsSL -H 'Cache-Control: no-cache' "$ORIGIN/bridgepoint-app-space-explorer-v1.js?verify=$GITHUB_SHA-app-space" -o "$DIR/app-space.js"
          curl --retry 7 --retry-all-errors --retry-delay 3 --max-time 35 -fsSL -H 'Cache-Control: no-cache' "$ORIGIN/bridgepoint-gaia-galaxy-v6270.js?verify=$GITHUB_SHA-gaia" -o "$DIR/gaia.js"
          curl --retry 7 --retry-all-errors --retry-delay 3 --max-time 60 -fsSL -H 'Cache-Control: no-cache' "$ORIGIN/nea_extended.json.gz?verify=$GITHUB_SHA-mpc" -o "$DIR/nea_extended.json.gz"
          gzip -t "$DIR/nea_extended.json.gz"
          cmp -s "$DIR/neo.js" rebuild-v5000/bridgepoint-neo-watch-v1.js
          cmp -s "$DIR/welcome.js" recovery/bridgepoint-welcome-space-v6260.js
          cmp -s "$DIR/app-space.js" patches/earth-star-occlusion-v6294/bridgepoint-app-space-explorer-v1.js
          cmp -s "$DIR/gaia.js" rebuild-v5000/bridgepoint-gaia-galaxy-v6270.js
          for route in root app; do
            grep -Fq 'bridgepoint-neo-watch-v1.js?v=1.5.1' "$DIR/$route.html"
            grep -Fq 'bridgepoint-app-space-explorer-v1.js?v=v6308-neo-galactic-space' "$DIR/$route.html"
            grep -Fq 'id="bpPublicScansImportMapV1"' "$DIR/$route.html"
          done
          grep -Fq 'bridgepoint-welcome-space-v6260.js?v=v6402-neo-galactic-frame' "$DIR/root.html"
          grep -Fq 'SPACE OBJECT TRACKING' "$DIR/neo.js"
          grep -Fq 'full 3D nominal orbits' "$DIR/neo.js"
          grep -Fq 'const toGalactic = frame?.eclipticJ2000ToGalactic' "$DIR/neo.js"
          grep -Fq 'getScene(){return scene}' "$DIR/welcome.js"
          grep -Fq 'eclipticJ2000ToGalactic' "$DIR/gaia.js"
          grep -Fq 'bridgepoint-welcome-space-v6260.js?v=6402-neo-galactic-frame' "$DIR/app-space.js"
          test -s "$DIR/nea_extended.json.gz"
          echo 'NEAR_EARTH_OBJECT_SPACE_VIEW_AND_DAILY_ORBIT_CATALOGUE_LIVE'

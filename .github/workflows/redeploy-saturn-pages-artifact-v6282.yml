name: Publish Saturn v6285 Lossless Planet Assets and Movement, Depth & Clickable Moons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redeploy-saturn-pages-artifact-v6282.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-welcome-space-v6285-lossless-saturn-pages
  cancel-in-progress: false

jobs:
  redeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download the already-built Saturn Pages artifact (no NASA rebuild)
        uses: actions/download-artifact@v4
        with:
          name: bridgepoint-welcome-space-v6257
          run-id: 42685752632
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          path: /tmp/bridgepoint-saturn-v6282-artifact

      - name: Extract and verify the existing production artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          ARTIFACT_TAR="$(find /tmp/bridgepoint-saturn-v6282-artifact -type f -name 'artifact.tar' -print -quit)"
          test -n "$ARTIFACT_TAR"
          tar -xf "$ARTIFACT_TAR" -C site

          test -s site/index.html
          test -s site/bridgepoint-welcome-space-v6260.js
          test -s site/bridgepoint-gaia-galaxy-v6270.js
          test -s site/bridgepoint-saturn-system-v6282.js
          test -s site/assets/stellar/gaia-dr3-v6270/manifest.json
          test -s site/assets/saturn/v1/manifest.json
          test -s site/assets/saturn/v1/ephemerides.json
          test -s site/assets/saturn/v1/meshes/mimas-cassini-shape-v1.bin.gz
          test -s site/assets/saturn/v1/meshes/enceladus-cassini-shape-v1.bin.gz
          test -s site/assets/saturn/v1/height/titan-cassini-topography-4ppd-u16.bin.gz
          grep -Fq 'src="/bridgepoint-welcome-space-v6260.js?v=6282-saturn-system"' site/index.html
          grep -Fq 'initBridgePointSaturnSystem' site/bridgepoint-gaia-galaxy-v6270.js
          grep -Fq 'Titan' site/bridgepoint-saturn-system-v6282.js
          node --input-type=module --check < site/bridgepoint-gaia-galaxy-v6270.js
          node --input-type=module --check < site/bridgepoint-saturn-system-v6282.js
          echo "REUSED VERIFIED PAGES ARTIFACT — ONLY SATURN SCENE JS OVERLAID; NO NASA BUILD OR PLANET REGENERATION"

      - name: Overlay Saturn and enable lossless compact delivery for large static assets
        shell: bash
        run: |
          set -euo pipefail
          # The broad welcome tests pin legacy 6282 cache strings; run Saturn-only regressions here.
          python3 -m unittest discover -s tests -p 'test_saturn_system_v6282.py' -v

          cp recovery/bridgepoint-welcome-space-v6260.js site/bridgepoint-welcome-space-v6260.js
          cp rebuild-v5000/bridgepoint-gaia-galaxy-v6270.js site/bridgepoint-gaia-galaxy-v6270.js
          cp recovery/bridgepoint-saturn-system-v6282.js site/bridgepoint-saturn-system-v6282.js
          cp rebuild-v5000/bridgepoint-blender-world-v1.js site/bridgepoint-blender-world-v1.js
          python3 recovery/apply_welcome_space_v6257.py site

          python3 -m pip install --disable-pip-version-check pillow numpy
          python3 tools/reality_assets/compress_moon_sldem_lossless_webp.py site
          python3 tools/reality_assets/defer_offline_global_max_pages.py site

          node --input-type=module --check < site/bridgepoint-welcome-space-v6260.js
          node --input-type=module --check < site/bridgepoint-gaia-galaxy-v6270.js
          node --input-type=module --check < site/bridgepoint-saturn-system-v6282.js
          node --input-type=module --check < site/bridgepoint-blender-world-v1.js
          node --check site/offline/offline-world.js

          grep -Fq 'src="/bridgepoint-welcome-space-v6260.js?v=6285-saturn-lossless-pages"' site/index.html
          grep -Fq 'scene.background=new THREE.Color(0x02050c)' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'function panSaturnSurface(dx,dy)' site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'function tiltSaturnCamera(deltaY)' site/bridgepoint-welcome-space-v6260.js
          grep -Fq "bodySelect.value=['titan','enceladus','mimas'].includes(selectedBody)?'saturn':selectedBody" site/bridgepoint-gaia-galaxy-v6270.js
          ! grep -Fq 'value="titan">Titan' site/bridgepoint-gaia-galaxy-v6270.js
          grep -Fq 'SaturnSystemGroup' site/bridgepoint-saturn-system-v6282.js
          grep -Fq 'uSaturnAtmosTime' site/bridgepoint-saturn-system-v6282.js
          grep -Fq 'loaded.saturn.offset.set(.175,.30)' site/bridgepoint-saturn-system-v6282.js
          grep -Fq 'Saturn volumetric Fresnel atmospheric rim' site/bridgepoint-saturn-system-v6282.js
          grep -Fq 'function buildRingAlphaProfile' site/bridgepoint-saturn-system-v6282.js
          grep -Fq 'const visualScale=Math.min(25' site/bridgepoint-saturn-system-v6282.js
          grep -Fq 'new THREE.BoxGeometry(visualRadius*2.65' site/bridgepoint-saturn-system-v6282.js
          grep -Fq 'const second=i+1,third=i+2' site/bridgepoint-saturn-system-v6282.js
          grep -Fq 'getSunPosition:()=>getSunPosition?getSunPosition():new THREE.Vector3()' site/bridgepoint-gaia-galaxy-v6270.js
          grep -Fq "url.toLowerCase().endsWith('.webp')" site/bridgepoint-welcome-space-v6260.js
          grep -Fq 'bridgepoint-blender-world-v1.js?v=3-lossless-gzip' site/index.html
          grep -Fq "const MANIFEST_URL = '/assets/blender-world/manifest.json?v=3-lossless-gzip'" site/bridgepoint-blender-world-v1.js
          grep -Fq 'bridgepoint-blender-world-v1.js?v=3-lossless-gzip' site/app/index.html
          test -s site/assets/moon/v1/sldem-128ppd/moon-sldem-128ppd-y05-x06.webp
          test ! -e site/assets/moon/v1/sldem-128ppd/moon-sldem-128ppd-y05-x06.png
          test -s site/assets/offline/protomaps-world-z6.pmtiles
          test ! -e site/assets/offline/protomaps-world-z7.pmtiles
          ! grep -Fq 'global-max-v1' site/offline-packs/catalog.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('site')
          moon=json.loads((root/'assets/moon/v1/manifest.json').read_text())
          assert moon['highResolutionTerrainEncoding']['quantization']=='none'
          assert moon['highResolutionTerrainEncoding']['roundTripVerified'] is True
          world=json.loads((root/'assets/blender-world/manifest.json').read_text())
          assert all(tile['url'].endswith('.glb') for tile in world['tiles'])
          assert all((root/'assets/blender-world'/tile['url']).is_file() for tile in world['tiles'])
          webps=list((root/'assets/moon/v1/sldem-128ppd').glob('*.webp'))
          assert len(webps)>=300, len(webps)
          assert not list((root/'assets/moon/v1/sldem-128ppd').glob('*.png'))
          print('LOSSLESS_ASSETS_OK',len(webps),'lunar height tiles;',len(world['tiles']),'original Manhattan GLBs preserved')
          PY
          echo "COMPACT PAGES BUNDLE READY — Saturn v6285; 16-bit lunar elevations and Manhattan GLBs preserved losslessly; standard offline z6 kept."

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload unchanged prebuilt Pages artifact under the standard name
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: site
          include-hidden-files: true

      - name: Verify uploaded Pages artifact is below GitHub's 1 GB limit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts"
          size="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$api" | jq -r '.artifacts[] | select(.name=="github-pages") | .size_in_bytes' | head -1)"
          test -n "$size"
          echo "GitHub Pages artifact bytes: $size"
          test "$size" -lt 1000000000

      - name: Publish Saturn v6285
        id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
          timeout: '600000'

      - name: Verify Saturn v6285 movement, depth and compact assets on the live domain
        if: steps.deploy.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          O='https://bridgepointintelligence.online'
          q="${GITHUB_SHA}-saturn-v6285-lossless-pages-live"
          curl --retry 5 --retry-all-errors --retry-delay 5 -fsSL -H 'Cache-Control: no-cache' "${O}/?saturn-v6282=${q}" -o /tmp/bp-live-root.html
          curl --retry 5 --retry-all-errors --retry-delay 5 -fsSL -H 'Cache-Control: no-cache' "${O}/bridgepoint-welcome-space-v6260.js?verify=${q}" -o /tmp/bp-live-welcome.js
          curl --retry 5 --retry-all-errors --retry-delay 5 -fsSL -H 'Cache-Control: no-cache' "${O}/bridgepoint-gaia-galaxy-v6270.js?verify=${q}" -o /tmp/bp-live-gaia.js
          curl --retry 5 --retry-all-errors --retry-delay 5 -fsSL -H 'Cache-Control: no-cache' "${O}/bridgepoint-saturn-system-v6282.js?verify=${q}" -o /tmp/bp-live-saturn.js
          curl --retry 5 --retry-all-errors --retry-delay 5 -fsSL -H 'Cache-Control: no-cache' "${O}/assets/saturn/v1/manifest.json?verify=${q}" -o /tmp/bp-live-saturn-manifest.json
          curl --retry 5 --retry-all-errors --retry-delay 5 -fsSL -H 'Cache-Control: no-cache' "${O}/assets/saturn/v1/ephemerides.json?verify=${q}" -o /tmp/bp-live-saturn-ephemerides.json
          curl --retry 5 --retry-all-errors --retry-delay 5 -fsSL -H 'Cache-Control: no-cache' "${O}/assets/saturn/v1/meshes/mimas-cassini-shape-v1.bin.gz?verify=${q}" -o /tmp/bp-live-mimas.bin.gz
          curl --retry 5 --retry-all-errors --retry-delay 5 -fsSL -H 'Cache-Control: no-cache' "${O}/assets/saturn/v1/meshes/enceladus-cassini-shape-v1.bin.gz?verify=${q}" -o /tmp/bp-live-enceladus.bin.gz
          curl --retry 5 --retry-all-errors --retry-delay 5 -fsSL -H 'Cache-Control: no-cache' "${O}/assets/saturn/v1/height/titan-cassini-topography-4ppd-u16.bin.gz?verify=${q}" -o /tmp/bp-live-titan-height.bin.gz
          grep -Fq 'src="/bridgepoint-welcome-space-v6260.js?v=6285-saturn-lossless-pages"' /tmp/bp-live-root.html
          grep -Fq 'initBridgePointSaturnSystem' /tmp/bp-live-gaia.js
          grep -Fq 'Titan' /tmp/bp-live-saturn.js
          grep -Fq 'SaturnSystemGroup' /tmp/bp-live-saturn.js
          grep -Fq 'uSaturnAtmosTime' /tmp/bp-live-saturn.js
          grep -Fq 'loaded.saturn.offset.set(.175,.30)' /tmp/bp-live-saturn.js
          grep -Fq 'Saturn volumetric Fresnel atmospheric rim' /tmp/bp-live-saturn.js
          grep -Fq 'function buildRingAlphaProfile' /tmp/bp-live-saturn.js
          grep -Fq 'const visualScale=Math.min(25' /tmp/bp-live-saturn.js
          grep -Fq 'new THREE.BoxGeometry(visualRadius*2.65' /tmp/bp-live-saturn.js
          grep -Fq 'const second=i+1,third=i+2' /tmp/bp-live-saturn.js
          grep -Fq 'scene.background=new THREE.Color(0x02050c)' /tmp/bp-live-welcome.js
          grep -Fq 'function panSaturnSurface(dx,dy)' /tmp/bp-live-welcome.js
          grep -Fq 'bodySelect.value=' /tmp/bp-live-gaia.js
          test -s /tmp/bp-live-saturn-manifest.json
          test -s /tmp/bp-live-saturn-ephemerides.json
          test -s /tmp/bp-live-mimas.bin.gz
          test -s /tmp/bp-live-enceladus.bin.gz
          test -s /tmp/bp-live-titan-height.bin.gz
          echo "LIVE SATURN V6285 PASS — ATMOSPHERIC MOVEMENT, DEPTH RINGS, EXACT 16-BIT MOON TERRAIN, GZIP MANHATTAN GLBs AND CLICKABLE MOONS SERVED"

name: Verify BridgePoint Global Utility Infrastructure V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'release-v2300/world-v2300-utility-infrastructure-v1.js'
      - 'rebuild-v5000/app.js'
      - 'rebuild-v5000/landing.js'
      - '.github/workflows/verify-utility-infrastructure-v1.yml'
      - '.github/workflows/publish-utility-close-zoom-poles-v8.yml'
      - 'tests/utility-infrastructure-renderer-v5.test.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < release-v2300/world-v2300-utility-infrastructure-v1.js
          node --check rebuild-v5000/app.js
          node --check rebuild-v5000/landing.js
      - name: Verify public data, automatic zoom behavior and globe anchoring
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'https://openinframap.org/map/power/{z}/{x}/{y}.pbf' release-v2300/world-v2300-utility-infrastructure-v1.js
          grep -Fq 'https://openinframap.org/map/telecoms/{z}/{x}/{y}.pbf' release-v2300/world-v2300-utility-infrastructure-v1.js
          grep -Fq '© OpenStreetMap contributors · OpenInfraMap' release-v2300/world-v2300-utility-infrastructure-v1.js
          grep -Fq 'map.transform.getMatrixForModel' release-v2300/world-v2300-utility-infrastructure-v1.js
          grep -Fq 'queryTerrainElevation' release-v2300/world-v2300-utility-infrastructure-v1.js
          grep -Fq 'featureCache' release-v2300/world-v2300-utility-infrastructure-v1.js
          grep -Fq 'bp-utility-poles-3d-v1' release-v2300/world-v2300-utility-infrastructure-v1.js
          grep -Fq 'const MIN_ZOOM = 13;' release-v2300/world-v2300-utility-infrastructure-v1.js
          grep -Fq 'const VERSION = 8;' release-v2300/world-v2300-utility-infrastructure-v1.js
          grep -Fq 'const PRECISE_POLE_MIN_ZOOM = 16;' release-v2300/world-v2300-utility-infrastructure-v1.js
          grep -Fq 'function buildPrecisePoleGroups(supports)' release-v2300/world-v2300-utility-infrastructure-v1.js
          grep -Fq 'wireTileAnchor(support.coordinate, 16)' release-v2300/world-v2300-utility-infrastructure-v1.js
          grep -Fq 'camera.projectionMatrix.copy(projection).multiply(anchorMatrix)' release-v2300/world-v2300-utility-infrastructure-v1.js
          grep -Fq 'new THREE.BoxGeometry(1, .18, .24)' release-v2300/world-v2300-utility-infrastructure-v1.js
          grep -Fq 'side: THREE.DoubleSide' release-v2300/world-v2300-utility-infrastructure-v1.js
          grep -Fq 'let catenaryA = distance * distance / Math.max(.1, 8 * sag)' release-v2300/world-v2300-utility-infrastructure-v1.js
          grep -Fq 'void loadUSGS3DEPGround(assets)' release-v2300/world-v2300-utility-infrastructure-v1.js
          node tests/utility-infrastructure-renderer-v5.test.mjs
          grep -Fq 'world-v2300-utility-infrastructure-v1.js?v=9-close-zoom-poles-v8' .github/workflows/publish-utility-close-zoom-poles-v8.yml
          ! grep -Fq 'setProjection' release-v2300/world-v2300-utility-infrastructure-v1.js

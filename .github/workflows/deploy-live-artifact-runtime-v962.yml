name: Deploy BridgePoint Live Artifact Runtime

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/deploy-live-artifact-runtime-v962.yml'
      - 'runtime-release/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble and verify canonical runtime with v979 background
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site && mkdir site
          git archive --format=tar origin/live-artifact | tar -xf - -C site
          test -s site/index.html
          test -s site/app/index.html
          test -s site/app/main.dart.js
          test -s site/app/flutter_bootstrap.js
          test -s site/app/flutter_service_worker.js
          test -s site/app/manifest.json
          test -s site/app/experience-v974.js
          test -s site/app/map-radar-v963.js
          test -s site/app/map-radar-v974.js
          test -s site/app/signup-confirmation-v946.js
          test ! -e site/app/experience-v974-fix.js

          node --check site/app/experience-v974.js
          node --check site/app/map-radar-v963.js
          node --check site/app/map-radar-v974.js
          node --check site/app/flutter_service_worker.js

          grep -q '<base href="/app/">' site/app/index.html
          grep -q 'data-bridgepoint-runtime="v978"' site/app/index.html
          grep -q '__bridgepointCanonicalRuntime=.v978' site/app/index.html
          grep -q 'experience-v974.js?v=979' site/app/index.html
          grep -q 'map-radar-v963.js?v=978' site/app/index.html
          grep -q 'map-radar-v974.js?v=978' site/app/index.html
          grep -q 'flutter_bootstrap.js?v=978' site/app/index.html
          grep -q 'getRegistrations' site/app/index.html
          grep -q 'caches.keys' site/app/index.html

          if grep -q 'id="bp-install"' site/app/index.html; then echo 'Legacy install button returned' >&2; exit 1; fi
          if grep -q 'live-system-v961.js' site/app/index.html; then echo 'Legacy Home overlay returned' >&2; exit 1; fi
          if grep -q 'packages-access-v962.js' site/app/index.html; then echo 'Legacy package overlay returned' >&2; exit 1; fi
          if grep -q 'podcast-entry-v941.js' site/app/index.html; then echo 'Legacy entry overlay returned' >&2; exit 1; fi
          if grep -q 'experience-v974-fix' site/app/index.html; then echo 'Stale black-hole override returned' >&2; exit 1; fi

          grep -q "BRIDGEPOINT_CACHE_RETIREMENT = 'v978'" site/app/flutter_service_worker.js
          grep -q 'caches.delete' site/app/flutter_service_worker.js
          grep -q 'registration.unregister' site/app/flutter_service_worker.js
          grep -q '"start_url": "./?bpv=v978"' site/app/manifest.json

          grep -q '__bridgepointExperienceV974' site/app/experience-v974.js
          grep -Fq "['home','72,225,255']" site/app/experience-v974.js
          grep -q 'drawIntakeIcon' site/app/experience-v974.js
          grep -Fq 'const cx=w*.5,cy=h*.50,r=Math.max(126,Math.min(w,h)*.285)' site/app/experience-v974.js
          grep -q 'looksLikeBottomSheet' site/app/experience-v974.js
          grep -q 'drawPlanet' site/app/experience-v974.js

          grep -q '__bridgepointMapRadarV974' site/app/map-radar-v974.js
          grep -q 'radar_base_reflectivity_time/ImageServer/WMSServer' site/app/map-radar-v974.js
          grep -q 'bridgepoint_flutter_geographic_catalog_v77' site/app/map-radar-v974.js
          grep -q 'bridgepoint_flutter_signal_map_v80' site/app/map-radar-v974.js
          grep -q 'Hurricane' site/app/map-radar-v974.js
          grep -q 'Wildfire' site/app/map-radar-v974.js
          grep -q 'Tornado' site/app/map-radar-v974.js
          grep -q 'Hail' site/app/map-radar-v974.js

          touch site/.nojekyll site/app/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy canonical runtime
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify canonical runtime and v979 background on public domain
        shell: bash
        run: |
          set -euo pipefail
          origin='https://bridgepointintelligence.online'
          for attempt in $(seq 1 24); do
            app="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${origin}/app/?runtime=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            experience="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${origin}/app/experience-v974.js?runtime=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            map="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${origin}/app/map-radar-v974.js?runtime=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            sw="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${origin}/app/flutter_service_worker.js?runtime=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            manifest="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${origin}/app/manifest.json?runtime=${GITHUB_SHA}-${attempt}" 2>/dev/null || true)"
            if printf '%s' "$app" | grep -q 'data-bridgepoint-runtime="v978"' \
              && printf '%s' "$app" | grep -q 'experience-v974.js?v=979' \
              && printf '%s' "$app" | grep -q 'map-radar-v974.js?v=978' \
              && printf '%s' "$app" | grep -q 'flutter_bootstrap.js?v=978' \
              && ! printf '%s' "$app" | grep -q 'id="bp-install"' \
              && ! printf '%s' "$app" | grep -q 'live-system-v961.js' \
              && ! printf '%s' "$app" | grep -q 'packages-access-v962.js' \
              && ! printf '%s' "$app" | grep -q 'podcast-entry-v941.js' \
              && printf '%s' "$experience" | grep -q 'drawIntakeIcon' \
              && printf '%s' "$experience" | grep -Fq 'const cx=w*.5,cy=h*.50,r=Math.max(126,Math.min(w,h)*.285)' \
              && printf '%s' "$experience" | grep -q 'looksLikeBottomSheet' \
              && printf '%s' "$experience" | grep -q 'drawPlanet' \
              && printf '%s' "$map" | grep -q 'radar_base_reflectivity_time/ImageServer/WMSServer' \
              && printf '%s' "$sw" | grep -q "BRIDGEPOINT_CACHE_RETIREMENT = 'v978'" \
              && printf '%s' "$manifest" | grep -q 'bpv=v978'; then
              echo 'BridgePoint canonical runtime with v979 background verified on the public domain.'
              exit 0
            fi
            sleep 10
          done
          echo 'Canonical runtime with v979 background did not converge on the public domain.' >&2
          exit 1

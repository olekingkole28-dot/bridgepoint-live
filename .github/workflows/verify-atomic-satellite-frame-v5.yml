name: Verify Atomic Satellite Frame Presentation V5
on:
  pull_request:
    branches: [main]
    paths:
      - 'release-v2300/world-v2300-map.js'
      - 'tests/atomic-satellite-frame-presentation-v5.test.mjs'
      - '.github/workflows/verify-atomic-satellite-frame-v5.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify globe source and frame-correction test
        run: |
          set -euo pipefail
          node --input-type=module --check < release-v2300/world-v2300-map.js
          node tests/atomic-satellite-frame-presentation-v5.test.mjs
          node tests/solar-terminator-nightshade-flash-v4.test.mjs

            }
            const cells=[];for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){
              if(!mask[(y-y0)*width+x-x0])continue;
              const yy=(y+.5)/size,xx=wrap((x+.5)/size),latitude=lat(yy),spacing=C*Math.cos(latitude*Math.PI/180)/size;
              cells.push({x,y,lng:lon(xx),lat:latitude,spacing,seed:hash(x,y)});
            }
            return{cells,step:1/size,gridWidth:width,gridHeight:height};
          }

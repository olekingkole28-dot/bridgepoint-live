              else:
                  rows=1 if entry else 4;cols=3 if entry else 4;bw=N/cols;bh=N/rows
                  for y in range(rows):
                      for x in range(cols):
                          cx=(x+.5)*bw;cy=(y+.5)*bh
                          ww=bw*(.45 if k=='glass' else .33);hh=bh*(.44 if k=='glass' or entry else .34)
                          l,t,r,b=cx-ww,cy-hh,cx+ww,cy+hh
                          if entry:t=bh*.12;b=bh*.99

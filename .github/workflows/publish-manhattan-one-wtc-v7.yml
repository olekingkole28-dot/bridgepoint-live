              'vec2 q=R.xz*3.2+vec2(R.y*2.6,R.y*.8);float cl=noise(q)*.55+noise(q*2.1)*.27+noise(q*4.3)*.13;cl=smoothstep(.46,.70,cl)*smoothstep(-.05,.35,R.y);',

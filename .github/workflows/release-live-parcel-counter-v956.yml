name: Release Live Parcel Counter V956

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-live-parcel-counter-v956.yml'
      - 'handoff/public-overlays/live-parcel-counter-v956.js'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Assemble durable live app
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          rm -rf site
          mkdir -p site
          git archive --format=tar origin/live-artifact | tar -xf - -C site
          test -s site/app/index.html
          test -s site/app/main.dart.js
          test -s handoff/public-overlays/live-parcel-counter-v956.js
          sha256sum site/app/main.dart.js | awk '{print $1}' > /tmp/before-main-sha

      - name: Install parcel counter overlay
        shell: bash
        run: |
          set -euo pipefail
          cp handoff/public-overlays/live-parcel-counter-v956.js site/app/live-parcel-counter-v956.js
          python - <<'PY'
          from pathlib import Path
          p=Path('site/app/index.html')
          s=p.read_text(encoding='utf-8')
          script='<script src="live-parcel-counter-v956.js?v=956"></script>'
          marker='<script src="flutter_bootstrap.js" async></script>'
          if script not in s:
              if marker not in s:
                  raise SystemExit('Flutter bootstrap marker missing')
              s=s.replace(marker,script+'\n  '+marker,1)
          if s.count(script)!=1:
              raise SystemExit('Expected exactly one V956 parcel counter script')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'bridgepoint_public_parcel_progress_v956' site/app/live-parcel-counter-v956.js
          grep -q 'LIVE U.S. PARCELS' site/app/live-parcel-counter-v956.js
          grep -q 'live-parcel-counter-v956.js?v=956' site/app/index.html
          after="$(sha256sum site/app/main.dart.js | awk '{print $1}')"
          before="$(cat /tmp/before-main-sha)"
          test "$after" = "$before"
          touch site/.nojekyll site/app/.nojekyll

      - name: Persist durable live artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/bridgepoint-v956-live
          mkdir -p /tmp/bridgepoint-v956-live
          cp -a site/. /tmp/bridgepoint-v956-live/
          cd /tmp/bridgepoint-v956-live
          git init -q
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m 'Publish live U.S. parcel counter V956'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live parcel counter
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://bridgepointintelligence.online'
          for attempt in $(seq 1 24); do
            app="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/?v=956-${attempt}" 2>/dev/null || true)"
            js="$(curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "${ORIGIN}/app/live-parcel-counter-v956.js?v=956-${attempt}" 2>/dev/null || true)"
            if printf '%s' "$app" | grep -q 'live-parcel-counter-v956.js?v=956' \
              && printf '%s' "$app" | grep -q 'flutter_bootstrap.js' \
              && printf '%s' "$js" | grep -q 'bridgepoint_public_parcel_progress_v956' \
              && printf '%s' "$js" | grep -q 'LIVE U.S. PARCELS'; then
              echo 'V956 verified live: public parcel counter overlay is installed without changing compiled Flutter.'
              exit 0
            fi
            sleep 8
          done
          echo 'V956 parcel counter did not converge on the live app.' >&2
          exit 1

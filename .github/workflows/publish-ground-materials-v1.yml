           const inv=new T.Matrix4().fromArray(raw).invert(),ev=new T.Matrix4().fromArray(east).premultiply(inv),nv=new T.Matrix4().fromArray(north).premultiply(inv),ee=new T.Vector3().setFromMatrixPosition(ev),nn=new T.Vector3().setFromMatrixPosition(nv);
           const area=mask.map(p=>({p,b:bbox(p)}));const spacing=step/Math.max(.1,scale);

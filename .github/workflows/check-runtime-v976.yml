name: Check BridgePoint Runtime V976

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/check-runtime-v976.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check deployed runtime JavaScript source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          git show origin/live-artifact:app/experience-v974.js > /tmp/experience-v974.js
          git show origin/live-artifact:app/map-radar-v974.js > /tmp/map-radar-v974.js
          node --check /tmp/experience-v974.js
          node --check /tmp/map-radar-v974.js
          grep -q 'drawIntakeIcon' /tmp/experience-v974.js
          grep -q 'modalLikeOpen' /tmp/experience-v974.js
          echo 'V976 runtime JavaScript syntax verified.'

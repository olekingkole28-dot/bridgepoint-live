name: Deploy BridgePoint Website + App

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-tracking-v421.yml
      - landing/**
      - articles/**
      - sample/**
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore immutable audited Flutter app
        run: |
          set -euo pipefail
          git fetch origin app-artifact-v422:refs/remotes/origin/app-artifact-v422
          rm -rf site /tmp/bridgepoint-app
          mkdir -p site /tmp/bridgepoint-app site/app
          git archive --format=tar origin/app-artifact-v422 | tar -xf - -C /tmp/bridgepoint-app
          test -s /tmp/bridgepoint-app/index.html
          test -s /tmp/bridgepoint-app/main.dart.js
          test -s /tmp/bridgepoint-app/acquisition_tracker.js
          test -s /tmp/bridgepoint-app/bridgepoint-release.json
          grep -q '2e111cc765d23533e2adf953b44a5578201a0790' /tmp/bridgepoint-app/bridgepoint-release.json
          grep -q 'https://bridgepointintelligence.online/' /tmp/bridgepoint-app/bridgepoint-release.json
          grep -q 'acquisition_tracker.js' /tmp/bridgepoint-app/index.html
          if grep -q 'service_role' /tmp/bridgepoint-app/acquisition_tracker.js; then
            echo 'Forbidden privileged credential marker found in browser tracker.' >&2
            exit 1
          fi
          cp -a /tmp/bridgepoint-app/. site/app/
          rm -rf site/app/articles site/app/sample site/app/landing
          cp /tmp/bridgepoint-app/acquisition_tracker.js site/acquisition_tracker.js
          touch site/.nojekyll site/app/.nojekyll
          echo 'Audited Flutter application preserved at /app/.'

      - name: Overlay public national website, research and territory request
        run: |
          set -euo pipefail
          test -s landing/index.html
          test -d articles
          test -d sample
          cp landing/index.html site/index.html
          cp -a articles site/articles
          cp -a sample site/sample
          python - <<'PY'
          from pathlib import Path
          p=Path('site/index.html')
          s=p.read_text(encoding='utf-8')
          guard="""<script>(function(){try{if(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true){window.location.replace('/app/'+window.location.search+window.location.hash)}}catch(e){}})();</script>"""
          s=s.replace('</head>',guard+'\n</head>')
          p.write_text(s,encoding='utf-8')
          PY
          test -s site/index.html
          test -s site/app/index.html
          test -s site/app/main.dart.js
          test -s site/articles/index.html
          test -s site/articles/feed.xml
          test -s site/sample/index.html
          grep -q 'U.S. property intelligence platform' site/index.html
          grep -q '/app/' site/index.html
          grep -q 'request_territory_sample_v425' site/sample/index.html
          echo 'National discovery homepage published at root; app preserved one click deeper.'

      - name: Refresh durable deployed website branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/live-artifact
          mkdir /tmp/live-artifact
          cp -a site/. /tmp/live-artifact/
          cd /tmp/live-artifact
          git init
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b live-artifact
          git add -A
          git commit -m 'BridgePoint national website with app, research and territory funnel'
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin live-artifact

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish BridgePoint
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record verified national website deployment
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          receipt={
            'status':'PUBLISHED',
            'base_release_sha':'2e111cc765d23533e2adf953b44a5578201a0790',
            'tracking_version':421,
            'owner_funnel_version':422,
            'sample_request_version':426,
            'public_landing_version':427,
            'capture':'FIRST_PARTY_BROWSER',
            'public_home':'/',
            'app_path':'/app/',
            'research_hub':'/articles/',
            'research_feed':'/articles/feed.xml',
            'territory_request':'/sample/',
            'deployed_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'public_origin':'https://bridgepointintelligence.online/',
            'pages_url':os.environ.get('PAGE_URL'),
            'immutable_app_branch':'app-artifact-v422',
            'durable_artifact_branch':'live-artifact',
            'contains_privileged_secret':False
          }
          open('tracking-release-status.json','w',encoding='utf-8').write(json.dumps(receipt,indent=2)+'\n')
          print(json.dumps(receipt,indent=2))
          PY
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tracking-release-status.json
          git commit -m 'Record national website deployment [skip ci]' || true
          git push origin HEAD:main

          function clipTile(x,y,grass,blocked,pave){const rect=square(x,y),box=[x,y,x+CELL,y+CELL];const inside=arr=>arr.filter(o=>overlaps(o.b,box)).flatMap(o=>{try{return clipping.intersection(o.p,rect)}catch(_){return []}});
           const greens=inside(grass),pavings=inside(pave),blocks=inside(blocked);if(!greens.length&&!pavings.length)return {grass:[],pave:[]};
           try{let g=greens.length?clipping.union(...greens):[];if(g.length&&(blocks.length||pavings.length))g=clipping.difference(g,...blocks,...pavings);let p=pavings.length?clipping.union(...pavings):[];return {grass:g,pave:p};}catch(_){return {grass:[],pave:[]}}
          }
          function ringContains(r,x,y){let inside=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const a=r[i],b=r[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])inside=!inside;}return inside;}
          const contains=(p,x,y)=>ringContains(p[0],x,y)&&!p.slice(1).some(r=>ringContains(r,x,y));
          export function maskFixture(grass,blocked,pave,x,y){return clipTile(x,y,records(grass),records(blocked),records(pave));}
          function hash(x,y){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296;}
          function makeGrassTexture(){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');g.fillStyle='#496b32';g.fillRect(0,0,256,256);for(let i=0;i<18000;i++){let x=hash(i,13)*256,y=hash(i,29)*256,v=hash(i,53);g.fillStyle=['#243d1c','#41652a','#597d36','#729148','#8a9c56'][Math.floor(v*5)];g.fillRect(x,y,1+hash(i,21)*2,1+hash(i,37)*3);}return g.getImageData(0,0,256,256);}
          export async function attachGroundMaterials(map){
           if(map.__BP_GROUND_MATERIALS_V1__)return;const d=map.__BP_GROUND_MATERIALS_V1__={status:'standby',tiles:0,blades:0,drawCalls:0,source:'mapped grass/sidewalk/landcover polygons; procedural blades; supplied paving texture'};window.__BP_GROUND_MATERIALS_V1__=d;
           let T=null,renderer=null,camera=null,scene=null,material=null,timer=0,dead=false,last='',running=false,dirty=true,cache=new Map(),meshes=new Map(),visibleKeys=new Set(),paver=null,loading=false;
           const mobile=innerWidth<=900||Number(navigator.deviceMemory||4)<=3;
           function source(id,sl){try{return map.getSource(id)?map.querySourceFeatures(id,sl?{sourceLayer:sl}:{}):[]}catch(_){return []}}
           function inputs(){const cover=source('ofm','landcover'),use=source('ofm','landuse'),side=source('bpSidewalk3D'),base=source('bpLivingWorld'),all=[...cover,...use,...side,...base],grass=[],pave=[],blocked=[];
           for(const f of all){if(isGrass(f))grass.push(...polys(f));else if(isPave(f)&&tag(f,'part')!=='sidewalk_slab')pave.push(...polys(f));else if(['sidewalk_slab','curb','parking','road','paved','asphalt','concrete'].includes(tag(f,'part'))||['parking','asphalt','concrete','paved'].includes(tag(f,'surface'))||tag(f,'class')==='parking')blocked.push(...polys(f));}
           for(const f of [...source('ofm','water'),...source('ofm','building'),...source('bpBuildings','buildings'),...source('bpCityStructures','buildings'),...source('exact'),...source('bpRoad3D')])blocked.push(...polys(f));

; BridgePoint Horizon AAA visual quality floor.
; Autopilot may scale down dynamically on constrained devices, but native desktop/high-end
; starts from these targets rather than prototype/mobile-looking defaults.

[ViewDistanceQuality@3]
r.ViewDistanceScale=1.35
r.SkeletalMeshLODBias=0
r.StaticMeshLODDistanceScale=0.75

[ViewDistanceQuality@Cine]
r.ViewDistanceScale=1.75
r.SkeletalMeshLODBias=0
r.StaticMeshLODDistanceScale=0.55

[AntiAliasingQuality@3]
r.TSR.History.ScreenPercentage=200
r.TSR.ShadingRejection.Flickering=1
r.TSR.Velocity.Extrapolation=1

[AntiAliasingQuality@Cine]
r.TSR.History.ScreenPercentage=200
r.TSR.ShadingRejection.Flickering=1
r.TSR.Velocity.Extrapolation=1

[ShadowQuality@3]
r.ShadowQuality=5
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.SMRT.RayCountDirectional=8
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=4
r.Shadow.Virtual.SMRT.RayCountLocal=8
r.Shadow.Virtual.SMRT.SamplesPerRayLocal=4
r.ContactShadows=1

[ShadowQuality@Cine]
r.ShadowQuality=5
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.SMRT.RayCountDirectional=16
r.Shadow.Virtual.SMRT.SamplesPerRayDirectional=8
r.Shadow.Virtual.SMRT.RayCountLocal=12
r.Shadow.Virtual.SMRT.SamplesPerRayLocal=8
r.ContactShadows=1

[GlobalIlluminationQuality@3]
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=32
r.Lumen.ScreenProbeGather.DownsampleFactor=16
r.LumenScene.Radiosity.ProbeSpacing=4

[GlobalIlluminationQuality@Cine]
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=48
r.Lumen.ScreenProbeGather.DownsampleFactor=8
r.LumenScene.Radiosity.ProbeSpacing=2

[ReflectionQuality@3]
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.Quality=1
r.Lumen.Reflections.MaxRoughnessToTrace=0.6
r.SSR.Quality=4

[ReflectionQuality@Cine]
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.Quality=2
r.Lumen.Reflections.MaxRoughnessToTrace=0.8
r.SSR.Quality=4

[PostProcessQuality@3]
r.BloomQuality=5
r.MotionBlurQuality=4
r.DepthOfFieldQuality=3
r.LensFlareQuality=2
r.Tonemapper.Quality=5
r.EyeAdaptationQuality=2
r.AmbientOcclusionLevels=3

[PostProcessQuality@Cine]
r.BloomQuality=5
r.MotionBlurQuality=4
r.DepthOfFieldQuality=4
r.LensFlareQuality=3
r.Tonemapper.Quality=5
r.EyeAdaptationQuality=2
r.AmbientOcclusionLevels=3

[TextureQuality@3]
r.Streaming.MipBias=0
r.MaxAnisotropy=16
r.Streaming.PoolSize=2500
r.Streaming.LimitPoolSizeToVRAM=1

[TextureQuality@Cine]
r.Streaming.MipBias=0
r.MaxAnisotropy=16
r.Streaming.PoolSize=4000
r.Streaming.LimitPoolSizeToVRAM=1

[EffectsQuality@3]
r.TranslucencyLightingVolumeDim=64
r.RefractionQuality=2
fx.Niagara.QualityLevel=3
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=8

[EffectsQuality@Cine]
r.TranslucencyLightingVolumeDim=96
r.RefractionQuality=2
fx.Niagara.QualityLevel=3
r.VolumetricFog=1
r.VolumetricFog.GridPixelSize=4

[FoliageQuality@3]
foliage.DensityScale=1.0
grass.DensityScale=1.0

[FoliageQuality@Cine]
foliage.DensityScale=1.35
grass.DensityScale=1.35

[ShadingQuality@3]
r.HairStrands.SkyLighting.IntegrationType=1
r.SSS.Quality=1
r.SSS.Scale=1.0
r.MaterialQualityLevel=1

[ShadingQuality@Cine]
r.HairStrands.SkyLighting.IntegrationType=1
r.SSS.Quality=1
r.SSS.Scale=1.0
r.MaterialQualityLevel=1

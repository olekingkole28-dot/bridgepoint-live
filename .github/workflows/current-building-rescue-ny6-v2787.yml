name: Current Building Rescue NY6 v2787

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/current-building-rescue-ny6-v2787.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: bridgepoint-current-building-rescue-ny6-v2787
  cancel-in-progress: false

env:
  SUPABASE_URL: https://xdfsjztwgsbmabshzsjw.supabase.co

jobs:
  split:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        sublane: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check duckdb==1.4.1 pyarrow==21.0.0 requests==2.32.5
      - name: Reconcile exact NY6 spatial quarter
        run: >
          python scripts/build-current-building-crosswalk-spatial-substripe-v2783.py
          --state NY
          --lane 6
          --lanes 8
          --sublane "${{ matrix.sublane }}"
          --sublanes 4
      - uses: actions/upload-artifact@v4
        with:
          name: rescue-NY-6-spatial-${{ matrix.sublane }}
          path: rescue-v2783/
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: split
    if: always() && needs.split.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check duckdb==1.4.1 pyarrow==21.0.0 requests==2.32.5
      - uses: actions/download-artifact@v4
        with:
          pattern: rescue-NY-6-spatial-*
          path: downloaded-rescue-v2780
          merge-multiple: true
      - name: Merge, collision-audit, upload and import NY lane 6
        run: >
          python scripts/merge-current-building-crosswalk-rescue-v2780.py
          --state NY
          --lane 6
          --lanes 8
          --sublanes 4

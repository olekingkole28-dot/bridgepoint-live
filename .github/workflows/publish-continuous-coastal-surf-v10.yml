name: Publish BridgePoint Continuous Coastal Surf V10

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-continuous-coastal-surf-v10.yml'
      - 'scripts/overlay_continuous_coastal_surf_v10.py'
      - 'scripts/build_coastal_data_v10.py'
      - 'scripts/bp-coastal-mesh-v10.mjs'
      - 'scripts/test-coastal-mesh-v10.mjs'


permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify real global shoreline geometry
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/overlay_continuous_coastal_surf_v10.py scripts/build_coastal_data_v10.py
          python3 -m venv "$RUNNER_TEMP/coastal-env"
          "$RUNNER_TEMP/coastal-env/bin/pip" install --quiet 'shapely==2.1.2' 'pyshp==2.3.1'
          mkdir -p "$RUNNER_TEMP/coastal"
          curl --retry 4 --retry-all-errors --max-time 60 -fsSL 'https://naturalearth.s3.amazonaws.com/10m_physical/ne_10m_ocean.zip' -o "$RUNNER_TEMP/ocean10.zip"
          "$RUNNER_TEMP/coastal-env/bin/python" scripts/build_coastal_data_v10.py "$RUNNER_TEMP/ocean10.zip" "$RUNNER_TEMP/coastal/bp-coastal-data-v10.mjs"
          cp scripts/bp-coastal-mesh-v10.mjs scripts/test-coastal-mesh-v10.mjs "$RUNNER_TEMP/coastal/"
          node "$RUNNER_TEMP/coastal/test-coastal-mesh-v10.mjs"

      - name: Download latest verified persistent globe release
        uses: actions/download-artifact@v4
        with:
          name: bridgepoint-v5000-1
          run-id: 45336832713
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline
      - name: Patch coastal coverage and animated surf only
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/bp-liquid-site"
          mkdir -p "$SITE"
          ARCHIVE="$(find "$RUNNER_TEMP/baseline" -type f -name artifact.tar -print -quit)"
          test -n "$ARCHIVE"
          tar -xf "$ARCHIVE" -C "$SITE"
          python3 scripts/overlay_continuous_coastal_surf_v10.py "$SITE" "$RUNNER_TEMP/coastal"
          node --check "$SITE/vendor/bp-coastal-mesh-v10.mjs"
          grep -Fq "shorePhase" "$SITE/world-v2300-water.js"
          grep -Fq "coastalSurfaceFrames" "$SITE/world-v2300-water.js"
          grep -Fq "GLOBAL_OCEAN_MESH_B64" "$SITE/world-v2300-water.js"
          grep -Fq "globalHorizonSurfaceFrames" "$SITE/world-v2300-water.js"
          grep -Fq "continuousOffshoreTilt" "$SITE/world-v2300-water.js"
          grep -Fq "denseMagneticShader" "$SITE/world-v2300-water.js"
          for f in world-v2300-water.js world-v2300-sensor-layers.js app/world-v2300-water.js app/world-v2300-sensor-layers.js world-v2300-map.js app/world-v2300-map.js landing.js app.js; do
            node --input-type=module --check < "$SITE/$f"
          done
          grep -Fq 'float whitecap' "$SITE/world-v2300-water.js"
          grep -Fq 'new T.InstancedMesh' "$SITE/world-v2300-sensor-layers.js"
          grep -Fq 'bp-liquid-ocean-cover-v2' "$SITE/world-v2300-water.js"
          grep -Fq 'targetAltitude=Math.min(-3,bed+clearance)' "$SITE/world-v2300-sensor-layers.js"
          grep -Fq 'restoreWaterGLState(gl, savedWaterState)' "$SITE/world-v2300-water.js"
          grep -Fq 'continuous-coastal-surf-v20261124-v10' "$SITE/landing.js"
          grep -Fq 'continuous-coastal-surf-v20261124-v10' "$SITE/app.js"
          grep -Fq 'buildOceanPolygonMesh' "$SITE/world-v2300-water.js"
          grep -Fq 'autoOceanDive' "$SITE/world-v2300-sensor-layers.js"
          grep -Fq 'bp-app-public-entry-v4' "$SITE/app/index.html"
          grep -Fq 'bp-public-home-v4' "$SITE/index.html"
          grep -Fq 'attachPublicGlobe(world)' "$SITE/app.js"
          grep -Fq 'showPublicOverview' "$SITE/bridgepoint-app-space-explorer-v1.js"
          grep -Fq 'verifiedOceanFallbackCells' "$SITE/world-v2300-water.js"
          node --check "$SITE/bridgepoint-app-space-explorer-v1.js"
          ! grep -Fq 'id="bp-app-entry-gate-v6247"' "$SITE/app/index.html"
          node --check "$SITE/vendor/bp-ocean-relief-v4.mjs"
          node --check "$SITE/vendor/bp-public-globe-v4.mjs"
          node --check "$SITE/vendor/bp-ocean-mesh-v3.mjs"
          for f in bridgepoint-earth-protection-v1.js bridgepoint-neo-watch-v1.js bridgepoint-conflict-zones-v1.js; do test -s "$SITE/$f"; done
          echo CONTINUOUS_COASTAL_SURF_BUILD_PASS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-v5000-${{ github.run_attempt }}
          path: ${{ runner.temp }}/bp-liquid-site
          include-hidden-files: true
      - name: Publish preserved site
        id: deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deploy-pages-extended.mjs
      - name: Verify public water modules and cache keys
        shell: bash
        run: |
          set -euo pipefail
          O=https://bridgepointintelligence.online
          SITE="$RUNNER_TEMP/bp-liquid-site"
          for p in world-v2300-water.js app/world-v2300-water.js world-v2300-sensor-layers.js app/world-v2300-sensor-layers.js world-v2300-map.js app/world-v2300-map.js vendor/bp-coastal-mesh-v10.mjs vendor/bp-coastal-data-v10.mjs vendor/bp-ocean-mesh-v3.mjs vendor/bp-ocean-relief-v4.mjs vendor/bp-public-globe-v4.mjs bridgepoint-app-space-explorer-v1.js landing.js app.js index.html app/index.html; do
            curl --retry 8 --retry-all-errors --retry-delay 4 --max-time 40 -fsSL -H 'Cache-Control: no-cache' "$O/$p?liquid=$GITHUB_SHA" -o "$RUNNER_TEMP/liquid-live"
            cmp "$SITE/$p" "$RUNNER_TEMP/liquid-live"
          done
          echo BRIDGEPOINT_CONTINUOUS_COASTAL_SURF_LIVE_PASS

                  render(gl,args){if(!mesh||!anchor||!renderer||map.getZoom()<6||(map.getZoom()>=17&&detailed()))return;const raw=map.transform?.getMatrixForModel?.(anchor.center,anchor.height);if(!raw)return;camera.projectionMatrix.fromArray(args.defaultProjectionData.mainMatrix).multiply(new T.Matrix4().fromArray(raw));const moving=!!map.isMoving?.();for(const part of mesh.children)part.count=moving?Math.min(state.instances,mobile?700:2200):state.instances;renderer.resetState();renderer.render(scene,camera);state.drawCalls=renderer.info.render.calls;state.cameraMoving=moving;state.frames=(state.frames||0)+1;},

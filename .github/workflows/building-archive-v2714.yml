name: Building Archive v2714

# Manual-only safety gate.
# Bulk archive generation must not use public GitHub Actions as a substitute
# for exhausted private Actions quota. BridgePoint's database-native FDW
# materialization path is the active ingestion path.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: bridgepoint-building-archive-v2714
  cancel-in-progress: true

env:
  SUPABASE_URL: https://xdfsjztwgsbmabshzsjw.supabase.co

jobs:
  archive:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        state: [AK, AL, AR, AS, AZ, CA, CO, CT, DC, DE, FL, GA, GU, HI, IA, ID, IL, IN, KS, KY, LA, MA, MD, ME, MI, MN, MO, MP, MS, MT, NC, ND, NE, NH, NJ, NM, NV, NY, OH, OK, OR, PA, PR, RI, SC, SD, TN, TX, UT, VA, VI, VT, WA, WI, WV, WY]
        kind: [building, building_part]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned archive dependencies
        run: python -m pip install --disable-pip-version-check duckdb==1.4.1 requests==2.32.5
      - name: Verify renewable GitHub OIDC endpoint
        shell: bash
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
      - name: Build validate and upload exact building archive
        run: python scripts/build-building-archive-v2714.py --state ${{ matrix.state }} --kind ${{ matrix.kind }}

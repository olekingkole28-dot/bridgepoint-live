name: Verify V6501 Cloud Density WebGL
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-volumetric-cloud-v6501.yml'
      - 'release-v2300/world-v2300-clouds.js'
permissions:
  contents: read
jobs:
  shader:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and WebGL1+WebGL2 shader-compile smoke
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < release-v2300/world-v2300-clouds.js
          test -n "$(command -v google-chrome || command -v chromium)"
          cd /tmp
          npm init -y >/dev/null 2>&1 || true
          npm install --no-audit --no-fund puppeteer-core@24 >/dev/null
          REPO_ROOT="$GITHUB_WORKSPACE" CHROME_PATH="$(command -v google-chrome || command -v chromium)" node <<'NODE'
          const fs=require('fs'),vm=require('vm'),puppeteer=require('puppeteer-core');
          const source=fs.readFileSync(process.env.REPO_ROOT+'/release-v2300/world-v2300-clouds.js','utf8');
          const start=source.indexOf('const STORM_VOLUME_FRAGMENT = String.raw');
          const end=source.indexOf('function compileShader(',start+1);
          if(start<0||end<0)throw Error('Cannot extract full live cloud shader functions');
          const context=vm.createContext({});
          const shaderFactory=vm.runInContext(source.slice(start,end)+'\nmakeShaders',context);
          if(typeof shaderFactory!=='function')throw Error('Invalid shader factory');
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_PATH,
              args:['--no-sandbox','--disable-dev-shm-usage','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
            try{
              const p=await browser.newPage();
              await p.goto('about:blank');
              for(const version of [1,2]){
                const shaders=shaderFactory(version===2);
                const output=await p.evaluate(({vs,fs,version})=>{
                  const c=document.createElement('canvas');c.width=512;c.height=320;
                  document.body.appendChild(c);
                  const gl=c.getContext(version===2?'webgl2':'webgl',{alpha:true,preserveDrawingBuffer:true,antialias:true});
                  if(!gl)return{version,error:'WebGL context unavailable'};
                  function compile(type,src){
                    const shader=gl.createShader(type);gl.shaderSource(shader,src);gl.compileShader(shader);
                    return{shader,ok:gl.getShaderParameter(shader,gl.COMPILE_STATUS),log:gl.getShaderInfoLog(shader)};
                  }
                  const a=compile(gl.VERTEX_SHADER,vs),b=compile(gl.FRAGMENT_SHADER,fs);
                  let linked=false,log='';
                  if(a.ok&&b.ok){const pr=gl.createProgram();gl.attachShader(pr,a.shader);gl.attachShader(pr,b.shader);gl.linkProgram(pr);
                    linked=gl.getProgramParameter(pr,gl.LINK_STATUS);log=gl.getProgramInfoLog(pr);}
                  return{version,vertex:a.ok,fragment:b.ok,linked,log:(a.log+' '+b.log+' '+log).slice(0,2000),
                    volumePresent:fs.includes('bpRaymarchCumulusV6500')};
                },{vs:shaders.vertex,fs:shaders.fragment,version});
                console.log('BRIDGEPOINT_CLOUD_WEBGL_V6501',JSON.stringify(output));
                if(!output.vertex||!output.fragment||!output.linked||!output.volumePresent)throw Error('V6501 shader compile failed '+JSON.stringify(output));
              }
              // Draw actual regular and storm cloud mesh fragments with the
              // production shader and inspect the pixel output. Compilation alone
              // is not sufficient for image-quality regression detection.
              const production=shaderFactory(false);
              for(const [tint,label] of [[.41,'cumulus'],[.96,'supercell']]){
                const diagnostic=await p.evaluate(({vs,fs,tint,label})=>{
                  const c=document.createElement('canvas');
                  c.width=340;c.height=340;c.style.cssText='display:inline-block;width:340px;height:340px';
                  const gl=c.getContext('webgl',{antialias:true,preserveDrawingBuffer:true,alpha:false});
                  if(!gl)throw Error('WebGL preview not available');
                  const mk=(kind,source)=>{const a=gl.createShader(kind);gl.shaderSource(a,source);gl.compileShader(a);if(!gl.getShaderParameter(a,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(a));return a};
                  const program=gl.createProgram();gl.attachShader(program,mk(gl.VERTEX_SHADER,vs));gl.attachShader(program,mk(gl.FRAGMENT_SHADER,fs));
                  gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));
                  gl.useProgram(program);
                  const vertices={a_pos:[],a_altitude:[],a_local:[],a_tint:[],a_wind:[],a_storm_motion:[],a_storm_epoch:[]};
                  const n=26,m=16,idx=[];
                  for(let j=0;j<=m;j++)for(let i=0;i<=n;i++){
                    const phi=Math.PI*j/m,theta=Math.PI*2*i/n;
                    const x=Math.cos(theta)*Math.sin(phi),y=Math.sin(theta)*Math.sin(phi),z=Math.cos(phi);
                    vertices.a_pos.push(.5+x*.34,.5+y*.32,z*.62);
                    vertices.a_altitude.push(0);vertices.a_local.push(x,y,z);vertices.a_tint.push(tint);
                    vertices.a_wind.push(0,0);vertices.a_storm_motion.push(0,0);vertices.a_storm_epoch.push(0);
                  }
                  for(let j=0;j<m;j++)for(let i=0;i<n;i++){const a=j*(n+1)+i,b=a+n+1;idx.push(a,b,a+1,b,b+1,a+1)}
                  const sizes={a_pos:3,a_altitude:1,a_local:3,a_tint:1,a_wind:2,a_storm_motion:2,a_storm_epoch:1};
                  for(const [name,data] of Object.entries(vertices)){
                    const loc=gl.getAttribLocation(program,name);if(loc<0)continue;
                    const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);
                    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(data),gl.STATIC_DRAW);
                    gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,sizes[name],gl.FLOAT,false,0,0);
                  }
                  const ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(idx),gl.STATIC_DRAW);
                  const uniform=(name)=>gl.getUniformLocation(program,name);
                  gl.uniformMatrix4fv(uniform('u_matrix'),false,new Float32Array([2,0,0,0,0,2,0,0,0,0,1,0,-1,-1,0,1]));
                  gl.uniform1f(uniform('u_time'),3);
                  gl.uniform1f(uniform('u_motion_time'),0);gl.uniform1f(uniform('u_storm_motion_time'),0);
                  gl.uniform1f(uniform('u_camera_altitude_m'),5000);gl.uniform1f(uniform('u_ray_steps'),12);
                  gl.uniform1f(uniform('u_cloud_view_pitch'),.22);
                  gl.uniform1f(uniform('u_cloud_view_bearing'),0);
                  gl.uniform1f(uniform('u_cloud_steps'),4);
                  gl.uniform2f(uniform('u_camera_center_mercator'),.5,.5);
                  gl.viewport(0,0,340,340);gl.clearColor(.035,.071,.12,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
                  gl.disable(gl.CULL_FACE);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
                  gl.drawElements(gl.TRIANGLES,idx.length,gl.UNSIGNED_SHORT,0);
                  const pixels=new Uint8Array(4);gl.readPixels(170,170,1,1,gl.RGBA,gl.UNSIGNED_BYTE,pixels);
                  c.setAttribute('data-cloud-preview',label);document.body.appendChild(c);
                  return{label,tint,centerRGBA:Array.from(pixels),gpuError:gl.getError(),meshTriangles:idx.length/3};
                },{vs:production.vertex,fs:production.fragment,tint,label});
                console.log('BRIDGEPOINT_VOLUME_PREVIEW_V6501',JSON.stringify(diagnostic));
                if(diagnostic.gpuError!==0)throw Error('3D cloud preview GPU draw error '+JSON.stringify(diagnostic));
              }
              await p.screenshot({path:'/tmp/bp-v6501-cloud-volume-preview.png',fullPage:true});
              console.log('BRIDGEPOINT_CLOUD_VOLUME_WEBGL1_WEBGL2_PASS');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE
      - name: Probe current PC-hosted source weather endpoints
        shell: bash
        run: |
          node <<'NODE'
          const origin='https://characterization-seas-total-adopt.trycloudflare.com';
          const checks=[
            ['/auth/v1/health',false],
            ['/rest/v1/rpc/bridgepoint_public_weather_bootstrap_v5823',true],
            ['/functions/v1/bridgepoint-world-effects-v2190',true]
          ];
          (async()=>{
            for(const [path,post] of checks){
              try{
                const ctrl=new AbortController(),tm=setTimeout(()=>ctrl.abort(),13000);
                let response;
                try{response=await fetch(origin+path,{
                  method:post?'POST':'GET',
                  headers:{'Content-Type':'application/json',
                    'apikey':'sb_publishable_lM9oWQeHjBmgOIiteeOicQ_PTyAeF25'},
                  body:post?JSON.stringify(path.includes('world-effects')?{west:-100,south:15,east:-40,north:55,zoom:1,modes:['all']}:{ }):undefined,
                  signal:ctrl.signal
                });}finally{clearTimeout(tm)}
                const txt=await response.text(),json=(()=>{try{return JSON.parse(txt)}catch{return null}})();
                const fields=json&&typeof json==='object'?Object.keys(json).slice(0,18):[];
                const size=(k)=>Array.isArray(json?.[k])?json[k].length:null;
                console.log('BRIDGEPOINT_PC_SOURCE_PROBE',JSON.stringify({path,status:response.status,type:response.headers.get('content-type'),fields,
                  storms:size('storms'),alerts:size('alerts'),observations:size('observations'),items:size('items'),
                  generation:json?.generated_at||null,hasHtml:txt.slice(0,200).toLowerCase().includes('<html')}));
              }catch(e){console.log('BRIDGEPOINT_PC_SOURCE_PROBE',JSON.stringify({path,error:String(e?.message||e)}))}
            }
          })();
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridgepoint-v6501-cloud-volume-preview
          path: /tmp/bp-v6501-cloud-volume-preview.png
          if-no-files-found: ignore
          retention-days: 3

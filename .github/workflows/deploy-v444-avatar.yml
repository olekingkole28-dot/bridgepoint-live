name: Deploy BridgePoint Live — Audited V444 Avatar

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-v444-avatar.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      AVATAR_ARTIFACT_URL: >-
        https://sdmntprwestcentralus.oaiusercontent.com/files/00000000-838c-81fb-b209-10fac34967dc/raw?se=2026-08-22T14%3A21%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=75dfaeef-fba2-4076-82e6-0b08c5609362&skoid=18c14e53-ea0c-429b-8d09-d22d66ca7169&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-22T13%3A58%3A24Z&ske=2026-08-23T13%3A58%3A24Z&sks=b&skv=2026-02-06&sig=MwyP5hcAieugMgRoOF5mtXj82i6CffzQY4SJDD72wSM%3D
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and verify audited avatar build
        run: |
          set -euo pipefail
          rm -rf /tmp/v444-app /tmp/v444-public site
          mkdir -p /tmp/v444-app /tmp/v444-public site
          curl -fsSL --retry 5 --retry-delay 2 "$AVATAR_ARTIFACT_URL" -o /tmp/v444-avatar.zip
          unzip -q /tmp/v444-avatar.zip -d /tmp/v444-app
          test -s /tmp/v444-app/index.html
          test -s /tmp/v444-app/main.dart.js
          test -s /tmp/v444-app/flutter_bootstrap.js
          grep -q 'Open Account & Settings for' /tmp/v444-app/main.dart.js
          grep -q 'Account & Settings' /tmp/v444-app/main.dart.js
          grep -q 'BridgePoint account' /tmp/v444-app/main.dart.js
          grep -q 'display_name' /tmp/v444-app/main.dart.js
          grep -q 'bridgepoint-v443-install-guide-runtime' /tmp/v444-app/index.html
          grep -q 'Continue to BridgePoint' /tmp/v444-app/index.html

      - name: Assemble V444 app with the current public site
        run: |
          set -euo pipefail
          git fetch origin live-artifact:refs/remotes/origin/live-artifact
          git archive --format=tar origin/live-artifact | tar -xf - -C /tmp/v444-public
          cp -a /tmp/v444-public/. site/
          rm -rf site/app
          mkdir -p site/app
          cp -a /tmp/v444-app/. site/app/
          rm -rf site/app/articles site/app/sample site/app/landing site/app/owner
          python - <<'PY'
          from pathlib import Path
          path=Path('site/app/index.html')
          body=path.read_text(encoding='utf-8')
          if '<base href="/">' not in body and '<base href="/app/">' not in body:
              raise SystemExit('Unexpected Flutter base href')
          path.write_text(body.replace('<base href="/">','<base href="/app/">',1),encoding='utf-8')
          PY
          BRIDGEPOINT_WEB_INDEX=site/app/index.html python tool/apply_install_guide_runtime_v443.py
          touch site/.nojekyll site/app/.nojekyll
          test -s site/index.html
          test -s site/app/main.dart.js
          grep -q '<base href="/app/">' site/app/index.html
          grep -q 'bridgepoint-v443-install-guide-runtime' site/app/index.html
          grep -q 'Open Account & Settings for' site/app/main.dart.js

      - name: Write exact V444 release receipts
        run: |
          set -euo pipefail
          APP_DIGEST="$(find site/app -type f ! -name bridgepoint-release.json -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')"
          export APP_DIGEST
          python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          now=datetime.now(timezone.utc).isoformat().replace('+00:00','Z')
          marker={
            'version':444,
            'release':'V444 Dynamic Account Avatar',
            'source_sha':'0db7bdb8480cd2ee1874089f0f14815f93b5d0b7',
            'source_pr':59,
            'audited_pr_head':'c44e5ed1400b84028239bea35a211163115c95a8',
            'source_workflow_run_id':32577988357,
            'source_artifact_id':9477073141,
            'artifact_sha256':os.environ['APP_DIGEST'],
            'artifact_digest_scope':'site/app excluding bridgepoint-release.json',
            'published_at':now,
            'customer_domain':'https://bridgepointintelligence.online/',
            'classifier_version':444,
            'deployment_contract':'Audited Flutter build with dynamic profile initials, 48px account target, Settings action, and retained V443 mobile runtime repair'
          }
          open('site/app/bridgepoint-release.json','w',encoding='utf-8').write(json.dumps(marker,indent=2)+'\n')
          tracking={
            'status':'PUBLISHED',
            'source_main_sha':marker['source_sha'],
            'assembled_artifact_sha256':marker['artifact_sha256'],
            'app_release_version':444,
            'mobile_install_open_version':443,
            'dynamic_account_avatar_version':444,
            'tracking_version':440,
            'public_home':'/',
            'app_path':'/app/',
            'public_origin':'https://bridgepointintelligence.online/',
            'durable_artifact_branch':'live-artifact',
            'immutable_app_branch':'app-artifact-v444',
            'deployed_at':now,
            'contains_privileged_secret':False
          }
          open('site/tracking-release-status.json','w',encoding='utf-8').write(json.dumps(tracking,indent=2)+'\n')
          PY
          grep -q '"version": 444' site/app/bridgepoint-release.json
          grep -q '"dynamic_account_avatar_version": 444' site/tracking-release-status.json

      - name: Persist V444 app and exact rollback site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf /tmp/v444-app-git /tmp/v444-live-git
          cp -a site/app /tmp/v444-app-git
          cp -a site /tmp/v444-live-git
          for spec in "/tmp/v444-app-git app-artifact-v444 BridgePoint audited V444 app artifact" "/tmp/v444-live-git live-artifact BridgePoint live artifact with V444 dynamic avatar"; do
            set -- $spec
            cd "$1"
            git init
            git config user.name 'BridgePoint Release Bot'
            git config user.email 'actions@users.noreply.github.com'
            git checkout -b "$2"
            git add -A
            git commit -m "$3 $4 $5 $6"
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push --force origin "$2"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish BridgePoint
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify V444 publicly and persist receipt
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl -fsSL --max-time 20 "https://bridgepointintelligence.online/app/bridgepoint-release.json?t=${GITHUB_RUN_ID}-${attempt}" -o /tmp/live-v444.json && grep -q '"version": 444' /tmp/live-v444.json; then
              break
            fi
            sleep 10
          done
          grep -q '"version": 444' /tmp/live-v444.json
          curl -fsSL --retry 4 --retry-delay 2 "https://bridgepointintelligence.online/app/main.dart.js?t=${GITHUB_RUN_ID}" -o /tmp/live-v444-main.dart.js
          grep -q 'Open Account & Settings for' /tmp/live-v444-main.dart.js
          grep -q 'Account & Settings' /tmp/live-v444-main.dart.js
          grep -q 'BridgePoint account' /tmp/live-v444-main.dart.js
          cp site/tracking-release-status.json tracking-release-status.json
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          release=json.load(open('/tmp/live-v444.json'))
          receipt={
            'status':'VERIFIED_LIVE',
            'checked_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'release':release,
            'checks':{
              'dynamic_profile_initials_compiled':True,
              'account_settings_action_compiled':True,
              'mobile_touch_target_48px_source_audited':True,
              'v443_mobile_install_runtime_retained':True,
              'public_release_marker_v444':True
            }
          }
          open('live-v444-avatar-verification.json','w',encoding='utf-8').write(json.dumps(receipt,indent=2)+'\n')
          PY
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add tracking-release-status.json live-v444-avatar-verification.json
          git commit -m 'Record V444 avatar deployment and verification [skip ci]' || true
          git pull --rebase origin main
          git push origin HEAD:main

name: Publish BridgePoint Jenolan Caves 3D Underground

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-jenolan-caves-v1.yml'
      - 'rebuild-v5000/bridgepoint-jenolan-caves-v1.js'
      - 'tools/underground/build_jenolan_cloud.py'
      - 'tests/jenolan-caves-v1.test.mjs'
      - 'docs/bridgepoint-jenolan-caves-v1.md'
  workflow_run:
    workflows: ["Publish BridgePoint 3D Underground — 11 Catacombs scans v7"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && 'bridgepoint-v5000-production-authority' || format('bridgepoint-v5000-noop-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the PLY reader and point-cloud build dependencies
        run: python -m pip install --disable-pip-version-check --no-input numpy plyfile

      - name: Validate the independent Jenolan renderer and converter
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < rebuild-v5000/bridgepoint-jenolan-caves-v1.js
          python -m py_compile tools/underground/build_jenolan_cloud.py
          node tests/jenolan-caves-v1.test.mjs

      - name: Select the latest successful Paris Catacombs Pages artifact as the unchanged baseline
        id: baseline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          repo=os.environ["REPOSITORY"]
          token=os.environ["GH_TOKEN"]
          event=os.environ["EVENT_NAME"]
          expected_path=".github/workflows/publish-underground-scan-scenes-v2.yml"
          artifact_name="github-pages-underground-scan-scenes-v2"
          headers={"Accept":"application/vnd.github+json",
                   "Authorization":"Bearer "+token,
                   "X-GitHub-Api-Version":"2022-11-28"}
          def get_json(url):
              request=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(request,timeout=45) as response:
                  return json.load(response)
          if event=="workflow_run":
              run_id=int(os.environ["UPSTREAM_RUN_ID"])
              upstream=get_json(f"https://api.github.com/repos/{repo}/actions/runs/{run_id}")
              if upstream.get("conclusion")!="success" or upstream.get("path")!=expected_path:
                  raise SystemExit("The triggering Catacombs publish did not complete successfully.")
          else:
              runs=get_json(f"https://api.github.com/repos/{repo}/actions/runs?branch=main&per_page=100").get("workflow_runs",[])
              candidates=[r for r in runs if r.get("path")==expected_path and r.get("conclusion")=="success"]
              if not candidates:
                  raise SystemExit("No successful Paris Catacombs Pages baseline was found.")
              run_id=candidates[0]["id"]
          artifacts=get_json(f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100").get("artifacts",[])
          match=next((a for a in artifacts if a.get("name")==artifact_name and not a.get("expired")),None)
          if not match:
              raise SystemExit("The selected Catacombs run has no unexpired production Pages artifact: "+artifact_name)
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write(f"run_id={run_id}\nartifact_name={artifact_name}\n")
          print("JENOLAN_BASELINE_SELECTED",run_id,artifact_name,match.get("size_in_bytes"))
          PY

      - name: Download the existing production site without rebuilding or replacing its layers
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.baseline.outputs.artifact_name }}
          run-id: ${{ steps.baseline.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/jenolan-baseline

      - name: Download the large public CSIRO Jenolan cave scan
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/jenolan_2010_2014_V.ply"
          curl --retry 8 --retry-all-errors --retry-delay 2 --connect-timeout 30 --max-time 1800 -fL \
            'https://data.csiro.au/dap/ws/v2/collections/13900/data/48134791' \
            -o "$SOURCE"
          test -s "$SOURCE"
          python - "$SOURCE" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1])
          with p.open("rb") as f:
              header=f.read(512)
          if not header.startswith(b"ply") or b"element vertex" not in header or b"end_header" not in header:
              raise SystemExit("The downloaded CSIRO file is not the expected PLY point cloud.")
          if p.stat().st_size < 100_000_000:
              raise SystemExit("The downloaded CSIRO composite PLY is unexpectedly small.")
          print("CSIRO_JENOLAN_SOURCE_DOWNLOAD_PASS",p.stat().st_size,"bytes")
          PY

      - name: Materialize a browser-ready sample across the complete Jenolan cave scan
        shell: bash
        run: |
          set -euo pipefail
          python tools/underground/build_jenolan_cloud.py \
            --source "$RUNNER_TEMP/jenolan_2010_2014_V.ply" \
            --output "$RUNNER_TEMP/jenolan-asset" \
            --max-points 2500000
          python - "$RUNNER_TEMP/jenolan-asset" <<'PY'
          import gzip,json,struct,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          manifest=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          assert manifest["siteId"]=="jenolan-caves-system"
          assert manifest["license"]=="CC BY-SA 3.0"
          assert manifest["materializedPointCount"]<=2_500_000
          with gzip.open(root/"pointcloud.bin.gz","rb") as f:
              header=f.read(16)
          magic,count,source_count,version=struct.unpack("<4sIII",header)
          assert (magic,count,source_count,version)==(b"BPC1",manifest["materializedPointCount"],manifest["sourcePointCount"],1)
          print("JENOLAN_MATERIALIZED_ASSET_VALIDATION_PASS",count,"points",source_count,"source vertices")
          PY

      - name: Restore the exact deployed Pages baseline and fingerprint it
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$(find "$RUNNER_TEMP/jenolan-baseline" -type f -name artifact.tar -print -quit)"
          test -n "$ARCHIVE"
          SITE="$RUNNER_TEMP/jenolan-site"
          mkdir -p "$SITE"
          tar -xf "$ARCHIVE" -C "$SITE"
          for file in index.html app/index.html landing.js app.js vendor/three.module.js; do
            test -s "$SITE/$file" || { echo "Production baseline missing $file"; exit 1; }
          done
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          site=Path(os.environ["RUNNER_TEMP"])/"jenolan-site"
          before={p.relative_to(site).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                  for p in site.rglob("*") if p.is_file()}
          (Path(os.environ["RUNNER_TEMP"])/"jenolan-before.json").write_text(json.dumps(before,sort_keys=True))
          print("JENOLAN_BASELINE_FINGERPRINT_PASS",len(before),"files")
          PY

      - name: Overlay only the Jenolan asset, renderer, imports and cache keys
        shell: bash
        run: |
          set -euo pipefail
          SITE="$RUNNER_TEMP/jenolan-site"
          mkdir -p "$SITE/app" "$SITE/assets/underground/jenolan-caves-v1"
          cp rebuild-v5000/bridgepoint-jenolan-caves-v1.js "$SITE/bridgepoint-jenolan-caves-v1.js"
          cp rebuild-v5000/bridgepoint-jenolan-caves-v1.js "$SITE/app/bridgepoint-jenolan-caves-v1.js"
          cp "$RUNNER_TEMP/jenolan-asset/manifest.json" "$SITE/assets/underground/jenolan-caves-v1/manifest.json"
          cp "$RUNNER_TEMP/jenolan-asset/pointcloud.bin.gz" "$SITE/assets/underground/jenolan-caves-v1/pointcloud.bin.gz"
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re
          site=Path(os.environ["RUNNER_TEMP"])/"jenolan-site"
          attach="""void import('./bridgepoint-jenolan-caves-v1.js?v=1-jenolan-large-system')
           .then(m=>{window.__BP_JENOLAN_CAVES_V1__=m.initJenolanCavesRenderer(world)})
           .catch(e=>console.warn('BridgePoint Jenolan Caves 3D layer unavailable',e));"""
          anchor=".catch(e=>console.warn('BridgePoint global subsurface wells renderer unavailable',e));"
          for rel in ("landing.js","app.js"):
              path=site/rel
              data=path.read_text(encoding="utf-8")
              if data.count(anchor)!=1:
                  raise SystemExit(f"{rel}: expected one existing subsurface-wells import anchor, found {data.count(anchor)}")
              if "bridgepoint-jenolan-caves-v1.js?v=1-jenolan-large-system" not in data:
                  pos=data.index(anchor)+len(anchor)
                  line_start=data.rfind("\n",0,pos)+1
                  line_prefix=data[line_start:pos]
                  indent=re.match(r"[ \t]*",line_prefix).group(0)
                  insertion="\n"+indent+attach.replace("\n","\n"+indent)
                  data=data[:pos]+insertion+data[pos:]
              path.write_text(data,encoding="utf-8")
              if "initJenolanCavesRenderer(world)" not in data:
                  raise SystemExit(f"{rel}: Jenolan renderer import is missing")

          for rel,needle in (("index.html","landing.js"),("app/index.html","app.js")):
              path=site/rel
              data=path.read_text(encoding="utf-8")
              matches=list(re.finditer(r'src="([^"]*'+re.escape(needle)+r'(?:\?[^"]*)?)"',data))
              if len(matches)!=1:
                  raise SystemExit(f"{rel}: expected one {needle} script URL, found {len(matches)}")
              url=matches[0].group(1)
              if "jenolan-caves=v1" not in url:
                  updated=url+("&" if "?" in url else "?")+"jenolan-caves=v1"
                  data=data.replace(url,updated,1)
              path.write_text(data,encoding="utf-8")

          before=json.loads((Path(os.environ["RUNNER_TEMP"])/"jenolan-before.json").read_text())
          after={p.relative_to(site).as_posix():hashlib.sha256(p.read_bytes()).hexdigest()
                 for p in site.rglob("*") if p.is_file()}
          removed=set(before)-set(after)
          added=set(after)-set(before)
          changed={p for p in before if p in after and before[p]!=after[p]}
          expected_changed={"landing.js","app.js","index.html","app/index.html"}
          expected_added={
            "bridgepoint-jenolan-caves-v1.js",
            "app/bridgepoint-jenolan-caves-v1.js",
            "assets/underground/jenolan-caves-v1/manifest.json",
            "assets/underground/jenolan-caves-v1/pointcloud.bin.gz",
          }
          if removed or changed!=expected_changed or added!=expected_added:
              raise SystemExit("JENOLAN_ONLY_PUBLISH_SCOPE_FAILURE "+json.dumps({
                "removed":sorted(removed),"changed":sorted(changed),"expected_changed":sorted(expected_changed),
                "added":sorted(added),"expected_added":sorted(expected_added)}))
          assert (site/"bridgepoint-jenolan-caves-v1.js").read_bytes()==(site/"app/bridgepoint-jenolan-caves-v1.js").read_bytes()
          print("JENOLAN_ONLY_OVERLAY_SCOPE_PASS",len(changed),"existing files changed;",len(added),"new files added; no files removed")
          PY
          node --check "$SITE/landing.js"
          node --check "$SITE/app.js"
          node --input-type=module --check < "$SITE/bridgepoint-jenolan-caves-v1.js"
          cmp -s "$SITE/bridgepoint-jenolan-caves-v1.js" "$SITE/app/bridgepoint-jenolan-caves-v1.js"
          grep -Fq 'initJenolanCavesRenderer(world)' "$SITE/landing.js"
          grep -Fq 'initJenolanCavesRenderer(world)' "$SITE/app.js"
          echo "BRIDGEPOINT_JENOLAN_CAVES_OVERLAY_PASS"

      - uses: actions/configure-pages@v5

      - name: Upload the preserved production site with the Jenolan 3D cloud
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-jenolan-caves-v1
          path: ${{ runner.temp }}/jenolan-site
          include-hidden-files: true

      - name: Publish BridgePoint Jenolan Caves 3D Underground v1
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-jenolan-caves-v1

      - name: Verify Jenolan marker, native viewer and materialized asset on both entry routes
        shell: bash
        run: |
          set -euo pipefail
          O='https://bridgepointintelligence.online'
          Q="$GITHUB_SHA-jenolan-v1"
          D="$RUNNER_TEMP/jenolan-live"
          mkdir -p "$D"
          for item in \
            "root.html:$O/?jenolan=$Q" \
            "app.html:$O/app/?jenolan=$Q" \
            "landing.js:$O/landing.js?jenolan=$Q" \
            "app.js:$O/app.js?jenolan=$Q" \
            "module.js:$O/bridgepoint-jenolan-caves-v1.js?verify=$Q" \
            "app-module.js:$O/app/bridgepoint-jenolan-caves-v1.js?verify=$Q" \
            "manifest.json:$O/assets/underground/jenolan-caves-v1/manifest.json?verify=$Q" \
            "pointcloud.bin.gz:$O/assets/underground/jenolan-caves-v1/pointcloud.bin.gz?verify=$Q"; do
            name="${item%%:*}"; url="${item#*:}"
            curl --retry 6 --retry-all-errors --retry-delay 2 --max-time 180 -fL -H 'Cache-Control: no-cache' "$url" -o "$D/$name"
          done
          grep -Fq 'BP_FRONTEND_V5000' "$D/root.html"
          grep -Fq 'BP_FRONTEND_V5000' "$D/app.html"
          grep -Fq 'jenolan-caves=v1' "$D/root.html"
          grep -Fq 'jenolan-caves=v1' "$D/app.html"
          grep -Fq 'bridgepoint-jenolan-caves-v1.js?v=1-jenolan-large-system' "$D/landing.js"
          grep -Fq 'bridgepoint-jenolan-caves-v1.js?v=1-jenolan-large-system' "$D/app.js"
          grep -Fq 'initJenolanCavesRenderer(world)' "$D/module.js"
          cmp -s "$D/module.js" "$D/app-module.js"
          gzip -t "$D/pointcloud.bin.gz"
          python - <<'PY'
          import gzip,json,os,struct
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])/"jenolan-live"
          m=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          assert m["siteId"]=="jenolan-caves-system"
          assert m["license"]=="CC BY-SA 3.0"
          assert m["caveTraverseKm"]==17.1
          assert m["materializedPointCount"]>1_000_000
          with gzip.open(root/"pointcloud.bin.gz","rb") as f:
              header=f.read(16)
          assert struct.unpack("<4sIII",header)==(b"BPC1",m["materializedPointCount"],m["sourcePointCount"],1)
          print("LIVE_JENOLAN_CAVES_ASSET_PASS",m["materializedPointCount"],"points")
          PY
          echo "BRIDGEPOINT_JENOLAN_CAVES_PUBLISH_PASS"

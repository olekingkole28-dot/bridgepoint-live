          # triangles. Actual roof shapes and heights are not altered. Avoid roof edges
          # and keep equipment out of courtyards.
          picked=[]
          for p,area in sorted(roof_centers,key=lambda x:-x[1]):
              if len(picked)>=450:break
              if any(np.linalg.norm((p-q)[[0,2]])<12 and abs(p[1]-q[1])<4 for q in picked):continue
              if area<45:continue
              picked.append(p)
              size=min(3.1,max(1.25,math.sqrt(area)*.19))
              box('equipment',(p[0],p[1]+.66,p[2]),(size,1.32,size*.85),(.82,.82,.82))
              # raised fan housings and vent grills
              box('vent',(p[0],p[1]+1.38,p[2]),(size*.76,.12,size*.66),(.78,.79,.80))
          assert wall_count>2000 and roof_count>500 and door_count==wall_count
          # Real baked 512px repeating textures; four bays/floors per tile, with
          # pre-baked reveal shadows, frames, spandrels, and fine material grain.
          # Texture maps remain visible even when shader detail or device tier is low.
          N=512
          pal={'glass':(77,103,124),'brick':(157,111,88),'stone':(190,180,158),'metal':(151,158,160),'loft':(158,148,130),'roof':(117,121,122),'trim':(159,154,145),'equipment':(162,169,171),'vent':(93,102,108)}
          def texture(kind):
              entry=kind.startswith('entry_');k=kind.replace('entry_','')
              base=np.array(pal[k],dtype=float)
              noise=rng.normal(0,3.8,(N,N,1))
              arr=np.clip(base+noise,0,255).astype(np.uint8);im=Image.fromarray(arr,'RGB');dr=ImageDraw.Draw(im)
              def rect(xy,col):dr.rectangle(tuple(int(v) for v in xy),fill=tuple(int(max(0,min(255,c))) for c in col))
              if k in ('brick','stone','loft','metal') and not entry:
                  step=13 if k=='brick' else 64
                  for y in range(0,N,step):
                      rect((0,y,N,y+1),base*.76)
                      for x in range(-40 if y//step%2 else 0,N,80 if k=='brick' else 128):rect((x,y,x+1,y+step),base*.77)
              if k=='roof':

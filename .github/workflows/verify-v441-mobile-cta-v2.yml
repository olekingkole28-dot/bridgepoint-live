name: Verify BridgePoint V441 Mobile CTA V2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-v441-mobile-cta-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bridgepoint-v441-mobile-cta-v2
  cancel-in-progress: true

jobs:
  verify-mobile-cta:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install browser controller
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save puppeteer-core@24 >/dev/null

      - name: Exercise live V441 gold CTA
        id: mobile
        continue-on-error: true
        env:
          ORIGIN: https://bridgepointintelligence.online
          EXPECTED_SOURCE_SHA: 5f4114197d834adbb368895238188b57940e279c
          EXPECTED_ARTIFACT_SHA256: 7e18e90df85526abc7ec001fbd506f72afd8e140b178282347b60e5643848d9c
        run: |
          set -uo pipefail
          mkdir -p /tmp/v441-mobile-v2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          export CHROME
          cat >/tmp/v441-mobile-v2/verify.cjs <<'JS'
          const puppeteer=require('puppeteer-core');
          const fs=require('fs');
          const path='/tmp/v441-mobile-v2/result.json';
          const result={status:'FAILED',checkedAt:new Date().toISOString(),publicOrigin:process.env.ORIGIN,sourceSha:process.env.EXPECTED_SOURCE_SHA,artifactSha256:process.env.EXPECTED_ARTIFACT_SHA256,checks:{},error:null};
          const save=()=>fs.writeFileSync(path,JSON.stringify(result,null,2)+'\n');
          const fail=m=>{throw new Error(m)};
          (async()=>{
            const releaseRes=await fetch(`${process.env.ORIGIN}/app/bridgepoint-release.json?t=${Date.now()}`);
            if(!releaseRes.ok)fail(`release marker HTTP ${releaseRes.status}`);
            const release=await releaseRes.json(); result.release=release;
            if(release.version!==441)fail(`expected release 441, got ${release.version}`);
            if(release.source_sha!==process.env.EXPECTED_SOURCE_SHA)fail(`source SHA mismatch: ${release.source_sha}`);
            if(release.artifact_sha256!==process.env.EXPECTED_ARTIFACT_SHA256)fail(`artifact SHA mismatch: ${release.artifact_sha256}`);
            result.checks.releaseReceipt=true;
            if(!process.env.CHROME)fail('Chrome/Chromium executable missing');

            const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,protocolTimeout:30000,args:[
              '--no-sandbox','--disable-dev-shm-usage','--disable-background-networking','--disable-sync',
              '--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-vulkan','--ignore-gpu-blocklist'
            ]});
            try{
              const page=await browser.newPage();
              page.setDefaultTimeout(15000);
              await page.setViewport({width:390,height:844,deviceScaleFactor:1,isMobile:true,hasTouch:true});
              await page.setUserAgent('Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1');
              const pageErrors=[]; page.on('pageerror',e=>pageErrors.push(String(e.message||e)));
              await page.goto(`${process.env.ORIGIN}/app/?mode=signin&verify_mobile_touch_v2=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:20000});
              await new Promise(r=>setTimeout(r,2500));
              await page.evaluate(()=>{
                const backdrop=document.getElementById('bp-install-backdrop');
                if(backdrop?.classList.contains('show'))document.getElementById('bp-install-later')?.click();
                window.bridgePointInstallPromptReadyV441=false;
                window.dispatchEvent(new Event('bridgepoint-install-capability-change'));
              });
              await new Promise(r=>setTimeout(r,300));
              const before=await page.evaluate(()=>{
                const b=document.getElementById('bp-install-fab-v439'); if(!b)return {missing:true};
                const r=b.getBoundingClientRect(),cs=getComputedStyle(b),top=document.elementFromPoint(r.left+r.width/2,r.top+r.height/2);
                return {missing:false,text:(b.innerText||'').replace(/\s+/g,' ').trim(),left:r.left,top:r.top,width:r.width,height:r.height,right:r.right,bottom:r.bottom,display:cs.display,visibility:cs.visibility,pointerEvents:cs.pointerEvents,centerInsideButton:Boolean(top===b||top?.closest?.('#bp-install-fab-v439')),viewportWidth:innerWidth,viewportHeight:innerHeight,scrollWidth:document.documentElement.scrollWidth};
              });
              result.before=before;
              if(before.missing)fail('gold CTA missing');
              if(before.display==='none'||before.visibility==='hidden'||before.pointerEvents==='none')fail(`gold CTA not interactive: ${JSON.stringify(before)}`);
              if(before.height<52)fail(`gold CTA touch target ${before.height}px is below 52px`);
              if(before.left<0||before.right>before.viewportWidth+1||before.top<0||before.bottom>before.viewportHeight+1)fail(`gold CTA outside viewport: ${JSON.stringify(before)}`);
              if(before.scrollWidth>before.viewportWidth+4)fail(`horizontal overflow before tap: ${before.scrollWidth} > ${before.viewportWidth}`);
              if(!before.centerInsideButton)fail(`another element intercepts CTA center: ${JSON.stringify(before)}`);
              if(!before.text.includes('DOWNLOAD / OPEN APP'))fail(`unexpected CTA copy: ${before.text}`);
              Object.assign(result.checks,{visibleTouchTarget:true,noPointerInterception:true,noHorizontalOverflowBeforeTap:true});

              await page.touchscreen.tap(before.left+before.width/2,before.top+before.height/2);
              await page.waitForFunction(()=>document.getElementById('bp-install-backdrop')?.classList.contains('show'),{timeout:5000});
              result.checks.realTouchTapOpenedGuide=true;
              const fallback=await page.evaluate(()=>{
                const a=document.getElementById('bp-install-fallback-v441'); if(!a)return {missing:true};
                const r=a.getBoundingClientRect(),cs=getComputedStyle(a);
                return {missing:false,text:(a.textContent||'').trim(),href:a.getAttribute('href'),left:r.left,top:r.top,width:r.width,height:r.height,display:cs.display,visibility:cs.visibility,pointerEvents:cs.pointerEvents};
              });
              result.fallback=fallback;
              if(fallback.missing||fallback.display==='none'||fallback.visibility==='hidden'||fallback.pointerEvents==='none')fail(`fallback not interactive: ${JSON.stringify(fallback)}`);
              if(fallback.height<44)fail(`fallback touch target ${fallback.height}px is below 44px`);
              if(!fallback.href?.includes('/app/?mode=signin')||!fallback.href.includes('utm_campaign=open_app'))fail(`fallback is not truthful sign-in navigation: ${fallback.href}`);
              Object.assign(result.checks,{directFallbackVisible:true,fallbackIsSigninNotSignup:true});
              await page.screenshot({path:'/tmp/v441-mobile-v2/guide.png',fullPage:false,captureBeyondViewport:false});

              await page.touchscreen.tap(fallback.left+fallback.width/2,fallback.top+fallback.height/2);
              await new Promise(r=>setTimeout(r,1400));
              const afterUrl=page.url(); result.afterUrl=afterUrl;
              const parsed=new URL(afterUrl);
              if(parsed.pathname!='/app/'||parsed.searchParams.get('mode')!=='signin'||parsed.searchParams.get('utm_campaign')!=='open_app')fail(`fallback navigation failed: ${afterUrl}`);
              const after=await page.evaluate(()=>({viewportWidth:innerWidth,scrollWidth:document.documentElement.scrollWidth,horizontalOverflow:document.documentElement.scrollWidth>innerWidth+4}));
              result.after=after;
              if(after.horizontalOverflow)fail(`horizontal overflow after fallback: ${JSON.stringify(after)}`);
              Object.assign(result.checks,{touchFallbackNavigation:true,noHorizontalOverflowAfterFallback:true});
              result.pageErrors=pageErrors.slice(0,10);
              result.status='VERIFIED_LIVE';
            } finally { await browser.close(); }
          })().catch(err=>{result.error=String(err?.stack||err);process.exitCode=1}).finally(()=>{save();console.log(JSON.stringify(result,null,2))});
          JS
          node /tmp/v441-mobile-v2/verify.cjs 2>&1 | tee /tmp/v441-mobile-v2/run.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Ensure diagnostic receipt exists
        if: always()
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          p='/tmp/v441-mobile-v2/result.json'
          if not os.path.exists(p):
              with open(p,'w') as f:
                  json.dump({'status':'FAILED','checkedAt':datetime.now(timezone.utc).isoformat(),'error':'Verifier exited before result.json was created','checks':{}},f,indent=2)
                  f.write('\n')
          PY

      - name: Upload V441 mobile proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bridgepoint-v441-mobile-cta-proof-v2
          path: |
            /tmp/v441-mobile-v2/result.json
            /tmp/v441-mobile-v2/run.log
            /tmp/v441-mobile-v2/guide.png
          if-no-files-found: warn
          retention-days: 14

      - name: Persist V441 mobile verification receipt
        if: always()
        run: |
          set -euo pipefail
          cp /tmp/v441-mobile-v2/result.json live-v441-mobile-verification.json
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add live-v441-mobile-verification.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record V441 mobile CTA verification [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Enforce hard V441 mobile gate
        if: always()
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/v441-mobile-v2/result.json'))
          if r.get('status')!='VERIFIED_LIVE':
              raise SystemExit(r.get('error') or 'V441 mobile CTA verification failed')
          print('V441 mobile CTA verified live with real touch interaction.')
          PY

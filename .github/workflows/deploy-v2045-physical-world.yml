name: Deploy V2070 Weather Earth onto V1997 Map

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'release-v1997/map-v2045-physical-world.js'
      - 'release-v1997/map-v2060-immersive-world.js'
      - 'release-v1997/map-v2070-weather-earth.js'
      - 'release-v1997/map-v1997-weather-hotfix.js'
      - '.github/workflows/deploy-v2045-physical-world.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Layer V2070 weather Earth onto existing V1997 world
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main live-artifact
          git checkout -B live-artifact origin/live-artifact
          test -s app/map-v1997.js
          test -s app/map-v2002-property-click.js
          test -s app/v1998-live-extras.js
          test -s app/owner-physical-world-v2020.js
          git show origin/main:release-v1997/map-v2045-physical-world.js > app/map-v2045-physical-world.js
          git show origin/main:release-v1997/map-v2060-immersive-world.js > app/map-v2060-immersive-world.js
          git show origin/main:release-v1997/map-v2070-weather-earth.js > app/map-v2070-weather-earth.js
          git show origin/main:release-v1997/map-v1997-weather-hotfix.js > app/map-v1997-weather-hotfix.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          world=Path('app/map-v2060-immersive-world.js')
          y=world.read_text()
          y=y.replace("cap=rh>0?rh:(hasRoof?.38:0)","cap=rh>0?rh:(hasRoof?0.38:0)")
          y=y.replace("V.last.boundaries=(V.exact.features?.length||0)}}}updateStatus()}catch","V.last.boundaries=(V.exact.features?.length||0)}}updateStatus();}catch")
          world.write_text(y)

          p=Path('app/index.html')
          s=p.read_text()
          s=re.sub(r'\s*<script[^>]+src=["\']\./map-v1997-weather-hotfix\.js[^"\']*["\'][^>]*></script>','',s,flags=re.I)
          s=s.replace('</body>','<script defer src="./map-v1997-weather-hotfix.js?v=2070"></script>\n</body>')
          p.write_text(s)

          sw=Path('app/flutter_service_worker.js')
          x=sw.read_text()
          x=re.sub(r"const CACHE='bridgepoint-universe-v\d+';","const CACHE='bridgepoint-universe-v2070';",x)
          for f in ['map-v1997-weather-hotfix','map-v2045-physical-world','map-v2060-immersive-world','map-v2070-weather-earth']:
              x=re.sub(r",?'\./"+re.escape(f)+r"\.js\?v=\d+'",'',x)
          x=x.replace("'./map-v1997.js?v=1997',","'./map-v1997.js?v=1997','./map-v1997-weather-hotfix.js?v=2070','./map-v2045-physical-world.js?v=2055','./map-v2060-immersive-world.js?v=2060','./map-v2070-weather-earth.js?v=2070',")
          sw.write_text(x)
          PY
          node --check app/map-v1997.js
          node --check app/map-v1997-weather-hotfix.js
          node --check app/map-v2045-physical-world.js
          node --check app/map-v2060-immersive-world.js
          node --check app/map-v2070-weather-earth.js
          node --check app/map-v2002-property-click.js
          node --check app/flutter_service_worker.js
          grep -Fq 'map-v2070-weather-earth.js?v=2070' app/map-v1997-weather-hotfix.js
          grep -Fq '__bridgepointWeatherEarthV2070' app/map-v2070-weather-earth.js
          grep -Fq 'bp2070-weather-fill' app/map-v2070-weather-earth.js
          grep -Fq 'bp2070-weather-line' app/map-v2070-weather-earth.js
          grep -Fq 'drawHurricane' app/map-v2070-weather-earth.js
          grep -Fq 'drawTornado' app/map-v2070-weather-earth.js
          grep -Fq 'drawHail' app/map-v2070-weather-earth.js
          grep -Fq 'drawRain' app/map-v2070-weather-earth.js
          grep -Fq 'drawFire' app/map-v2070-weather-earth.js
          grep -Fq 'point_markers:false' app/map-v2070-weather-earth.js
          grep -Fq 'map-v1997-weather-hotfix.js?v=2070' app/index.html
          grep -Fq 'bridgepoint-universe-v2070' app/flutter_service_worker.js
          grep -Fq 'map-v2070-weather-earth.js?v=2070' app/flutter_service_worker.js

      - name: Persist upgraded live artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BridgePoint Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app/index.html app/flutter_service_worker.js app/map-v1997-weather-hotfix.js app/map-v2045-physical-world.js app/map-v2060-immersive-world.js app/map-v2070-weather-earth.js
          if ! git diff --cached --quiet; then
            git commit -m 'Publish V2070 clean immersive weather Earth on V1997 map'
            git push origin HEAD:live-artifact
          fi
          rm -rf site && mkdir site
          git archive --format=tar HEAD | tar -xf - -C site
          touch site/.nojekyll site/app/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-v2070
          path: site
      - name: Deploy V1997 + V2070 current map
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-v2070

      - name: Verify production V2070 weather Earth
        shell: bash
        run: |
          set -euo pipefail
          origin='https://bridgepointintelligence.online'
          ok=0
          for attempt in $(seq 1 36); do
            salt="${GITHUB_SHA}-${attempt}-$(date +%s)"
            curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$origin/app/?bpv=2070&verify=$salt" -o /tmp/app.html || true
            curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$origin/app/map-v1997-weather-hotfix.js?verify=$salt" -o /tmp/hotfix.js || true
            curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$origin/app/map-v2070-weather-earth.js?verify=$salt" -o /tmp/weather.js || true
            curl -fsSL --max-time 15 -H 'Cache-Control: no-cache' "$origin/app/flutter_service_worker.js?verify=$salt" -o /tmp/sw.js || true
            if grep -Fq 'map-v1997-weather-hotfix.js?v=2070' /tmp/app.html \
              && grep -Fq 'map-v2070-weather-earth.js?v=2070' /tmp/hotfix.js \
              && grep -Fq '__bridgepointWeatherEarthV2070' /tmp/weather.js \
              && grep -Fq 'bp2070-weather-fill' /tmp/weather.js \
              && grep -Fq 'drawHurricane' /tmp/weather.js \
              && grep -Fq 'drawTornado' /tmp/weather.js \
              && grep -Fq 'drawHail' /tmp/weather.js \
              && grep -Fq 'drawRain' /tmp/weather.js \
              && grep -Fq 'drawFire' /tmp/weather.js \
              && grep -Fq 'point_markers:false' /tmp/weather.js \
              && grep -Fq 'bridgepoint-universe-v2070' /tmp/sw.js; then
              ok=1
              echo 'V1997_CORE_PLUS_V2070_WEATHER_EARTH_LIVE'
              break
            fi
            sleep 5
          done
          test "$ok" = 1

name: Building Archive v2714

# Safety gate: bulk archive generation is complete except the original TX/building
# job still running from the earlier matrix. This workflow now exists only to
# cancel the newer duplicate TX run through the same concurrency group.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/tx-building-archive-once-v2714.trigger'

permissions:
  contents: read

concurrency:
  group: bridgepoint-building-archive-v2714-tx
  cancel-in-progress: true

jobs:
  archive-safety-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "TX duplicate archive runner cancelled; original matrix TX job remains authoritative."

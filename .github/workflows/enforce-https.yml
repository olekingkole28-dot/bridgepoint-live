name: Enforce BridgePoint Pages HTTPS

on:
  push:
    paths:
      - .github/workflows/enforce-https.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Request HTTPS enforcement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -L -o /tmp/pages-response.txt -w '%{http_code}' \
            -X PUT \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/olekingkole28-dot/bridgepoint-live/pages \
            -d '{"https_enforced":true}')
          echo "GitHub Pages update HTTP ${code}"
          cat /tmp/pages-response.txt || true
          test "${code}" = '204'

<body data-bridgepoint-runtime="v985">
  <script>
    window.__bridgepointCanonicalRuntime='v985';
    window.__bridgepointLegacyOverlayDisabled=true;
    (()=>{
      const staleIds=['bp-install','bp-install-dialog','bp-pwa-update-v396','bp-live-home-v972','bp-live-home-v981','bp-live-system-v961','bp983-entry','bp983-home-mask'];

      const removeStale=()=>{
        for(const id of staleIds) document.getElementById(id)?.remove();
        for(const id of staleStyles) document.getElementById(id)?.remove();
      };
      removeStale();
      new MutationObserver(removeStale).observe(document.documentElement,{childList:true,subtree:true});
    })();
  </script>

                  holes={}
                  if 'bholes' in sections:
                      hr=section('bholes');assert len(hr)%12==0
                      for j in range(0,len(hr),12):
                          parent,start,n=struct.unpack_from('<IIH',hr,j);holes.setdefault(parent,[]).append((start,n))
                  def points(start,n):
                      a=xz[start:start+n].astype(float)
                      a[:,0]=((a[:,0]+ox)/SX+LON0-lon)*mx
                      a[:,1]=(lat-(LAT0-(a[:,1]+oz)/SY))*my
                      return a
                  for i in range(len(rec)//44):
                      o=i*44;start,n=struct.unpack_from('<IH',rec,o)
                      by,h=struct.unpack_from('<ff',rec,o+8)
                      floors,style,r,g,b,roofKind,flags,lit=struct.unpack_from('<8B',rec,o+16)
                      floor,win,store=struct.unpack_from('<fff',rec,o+24)
                      if not (3<=n<=1500 and math.isfinite(by) and -15<=by<=100 and math.isfinite(h) and 2<=h<=650):continue
                      pts=points(start,n)
                      if len(pts)!=n or not np.isfinite(pts).all():continue
                      poly=Polygon(pts,[points(a,b) for a,b in holes.get(i,[]) if b>=3])
                      if not poly.is_valid or poly.area<4 or not inside.covers(poly):continue
                      poly=orient(poly,sign=1.0)
                      floor=min(6,max(2.4,float(floor))) if math.isfinite(floor) else 3.2
                      win=min(5,max(.9,float(win))) if math.isfinite(win) else 2.2
                      store=min(h,max(0,float(store))) if math.isfinite(store) else 0
                      color=tuple(srgb(c) for c in (r,g,b))
                      for rr in [poly.exterior,*poly.interiors]:
                          coords=list(rr.coords)
                          for a,bp in zip(coords,coords[1:]):wall(a,bp,by,h,color,style,floor,win,store)
                      roof(poly,by,h,tuple(c*.73+.06 for c in color),style,floor,store)
                      count+=1;styles[style]=styles.get(style,0)+1;maxh=max(maxh,h)
                  used.append(key)
          assert count>=300 and maxh>=100 and len(styles)>=4,(count,maxh,styles)
          assert len(positions)<1_200_000 and len(indices)<3_600_000
          buf=bytearray();views=[];accessors=[]
          def accessor(arr,component,typ,target):
              arr=np.ascontiguousarray(arr)
              while len(buf)%4:buf.append(0)
              off=len(buf);buf.extend(arr.tobytes());view=len(views);views.append(dict(buffer=0,byteOffset=off,byteLength=arr.nbytes,target=target))
              d=dict(bufferView=view,componentType=component,count=len(arr),type=typ)
              if not accessors:d.update(min=arr.min(0).tolist(),max=arr.max(0).tolist())
              accessors.append(d);return len(accessors)-1
          pos=accessor(np.array(positions,dtype='<f4'),5126,'VEC3',34962)
          col=accessor(np.array(colors,dtype='<f4'),5126,'VEC3',34962)
          uv=accessor(np.array(uvs,dtype='<f4'),5126,'VEC2',34962)
          det=accessor(np.array(details,dtype='<f4'),5126,'VEC4',34962)
          idx=accessor(np.array(indices,dtype='<u4'),5125,'SCALAR',34963)
          doc={'asset':{'version':'2.0','generator':'BridgePoint reconstruction; Valdrada v0.7.1 ODbL'},'scene':0,'scenes':[{'nodes':[0]}],'nodes':[{'mesh':0}],'meshes':[{'primitives':[{'attributes':{'POSITION':pos,'COLOR_0':col,'TEXCOORD_0':uv,'_BPDETAIL':det},'indices':idx,'material':0}]}],'materials':[{'pbrMetallicRoughness':{'baseColorFactor':[1,1,1,1],'metallicFactor':0,'roughnessFactor':.7},'doubleSided':True}],'buffers':[{'byteLength':len(buf)}],'bufferViews':views,'accessors':accessors}
          j=json.dumps(doc,separators=(',',':')).encode();j+=b' '*((-len(j))%4)
          while len(buf)%4:buf.append(0)
          raw=struct.pack('<4sII',b'glTF',2,12+8+len(j)+8+len(buf))+struct.pack('<I4s',len(j),b'JSON')+j+struct.pack('<I4s',len(buf),b'BIN\0')+buf
          assert len(raw)<90_000_000
          (site/glb).write_bytes(raw)
          (site/meta).write_text(json.dumps({'source':'https://huggingface.co/datasets/mehmetkeremturkcan/valdrada/tree/v0.7.1','license':'ODbL 1.0; © OpenStreetMap contributors; Valdrada, Mehmet Kerem Turkcan','sourceTiles':used,'buildingCount':count,'vertices':len(positions),'maxHeightM':maxh,'styleCounts':styles,'origin':row['coordinates'],'verticalDatum':'source baseY metres above sea level','approximation':'Source footprints and heights; procedural facade and roof appearance; not photogrammetry or surveyed entrances.'},indent=2))
          print('SOURCE_GEOMETRY_READY',count,len(positions),len(raw),styles)
          p=site/scan;s=p.read_text()
          def one(a,b):
              global s
              assert s.count(a)==1,('SCAN_ANCHOR',a[:120],s.count(a));s=s.replace(a,b,1)
          one('async function load(state,row)',r'''function sourceCityMaterial(T,m,u){
           const out=cityArchitecturalMaterial(T,m,u);out.vertexColors=true;out.side=T.DoubleSide;
           const prior=out.onBeforeCompile;
           out.onBeforeCompile=shader=>{
            prior(shader);
            shader.vertexShader=shader.vertexShader.replace('#include <common>','#include <common>\nattribute vec4 _bpdetail;\nvarying vec4 bpSourceDetail;\nvarying vec2 bpSourceUV;').replace('#include <project_vertex>','#include <project_vertex>\nbpSourceDetail=_bpdetail;bpSourceUV=uv;');
            shader.fragmentShader=shader.fragmentShader.replace('#include <common>','#include <common>\nvarying vec4 bpSourceDetail;\nvarying vec2 bpSourceUV;');
            const f=shader.fragmentShader,a=f.indexOf('float glazed='),b=f.indexOf('vec2 fw=',a);

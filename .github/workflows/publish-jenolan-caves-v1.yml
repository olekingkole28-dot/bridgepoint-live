name: Build BridgePoint Jenolan Caves 3D Asset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-jenolan-caves-v1.yml'
      - 'rebuild-v5000/bridgepoint-jenolan-caves-v1.js'
      - 'tools/underground/build_jenolan_cloud.py'
      - 'tests/jenolan-caves-v1.test.mjs'

permissions:
  actions: read
  contents: read

concurrency:
  group: bridgepoint-jenolan-caves-asset-v1
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the PLY reader and point-cloud build dependencies
        run: python -m pip install --disable-pip-version-check --no-input numpy plyfile

      - name: Validate the independent Jenolan renderer and converter
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module --check < rebuild-v5000/bridgepoint-jenolan-caves-v1.js
          python -m py_compile tools/underground/build_jenolan_cloud.py
          grep -Fq 'initJenolanCavesRenderer(world)' .github/workflows/publish-jenolan-caves-v1.yml
          grep -Fq 'assets/underground/jenolan-caves-v1/pointcloud.bin.gz' .github/workflows/publish-jenolan-caves-v1.yml
          grep -Fq 'jenolan-caves=v1' .github/workflows/publish-jenolan-caves-v1.yml
          node tests/jenolan-caves-v1.test.mjs

      - name: Download the public CSIRO Jenolan Caves scan
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/jenolan_2010_2014_V.ply"
          curl --retry 8 --retry-all-errors --retry-delay 2 --connect-timeout 30 --max-time 1800 -fL \
            'https://data.csiro.au/dap/ws/v2/collections/13900/data/48134791' \
            -o "$SOURCE"
          test -s "$SOURCE"
          python - "$SOURCE" <<'PY'
          import sys
          from pathlib import Path
          source=Path(sys.argv[1])
          with source.open("rb") as stream:
              header=stream.read(512)
          if not header.startswith(b"ply") or b"element vertex" not in header or b"end_header" not in header:
              raise SystemExit("Downloaded CSIRO source is not the expected PLY point cloud.")
          if source.stat().st_size<100_000_000:
              raise SystemExit("Downloaded CSIRO point cloud is unexpectedly small.")
          print("CSIRO_JENOLAN_SOURCE_DOWNLOAD_PASS",source.stat().st_size,"bytes")
          PY

      - name: Build and validate the BridgePoint-hosted cave point cloud
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$RUNNER_TEMP/jenolan-asset"
          python tools/underground/build_jenolan_cloud.py \
            --source "$RUNNER_TEMP/jenolan_2010_2014_V.ply" \
            --output "$OUTPUT" \
            --max-points 2500000
          python - "$OUTPUT" <<'PY'
          import gzip,json,struct,sys
          from pathlib import Path
          root=Path(sys.argv[1])
          manifest=json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          assert manifest["siteId"]=="jenolan-caves-system"
          assert manifest["license"]=="CC BY-SA 3.0"
          assert manifest["materializedPointCount"]>1_000_000
          with gzip.open(root/"pointcloud.bin.gz","rb") as stream:
              header=stream.read(16)
          assert struct.unpack("<4sIII",header)==(b"BPC1",manifest["materializedPointCount"],manifest["sourcePointCount"],1)
          print("BRIDGEPOINT_JENOLAN_POINTCLOUD_PASS",manifest["materializedPointCount"],"points")
          PY

      - name: Package the cave renderer and hosted data for the V5000 build
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="$RUNNER_TEMP/jenolan-feature-package"
          mkdir -p "$PACKAGE/assets/underground/jenolan-caves-v1"
          cp rebuild-v5000/bridgepoint-jenolan-caves-v1.js "$PACKAGE/bridgepoint-jenolan-caves-v1.js"
          cp "$RUNNER_TEMP/jenolan-asset/manifest.json" "$PACKAGE/assets/underground/jenolan-caves-v1/manifest.json"
          cp "$RUNNER_TEMP/jenolan-asset/pointcloud.bin.gz" "$PACKAGE/assets/underground/jenolan-caves-v1/pointcloud.bin.gz"
          tar -cf "$PACKAGE/artifact.tar" -C "$PACKAGE" \
            bridgepoint-jenolan-caves-v1.js \
            assets/underground/jenolan-caves-v1/manifest.json \
            assets/underground/jenolan-caves-v1/pointcloud.bin.gz
          test -s "$PACKAGE/artifact.tar"
          tar -tf "$PACKAGE/artifact.tar"
          echo "BRIDGEPOINT_JENOLAN_FEATURE_PACKAGE_READY"

      - name: Upload the Jenolan asset package for the V5000 production build
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-jenolan-caves-v1
          path: ${{ runner.temp }}/jenolan-feature-package/artifact.tar
          if-no-files-found: error
          retention-days: 7

name: Deploy BridgePoint Live

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-live-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download verified BridgePoint v228 production build
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-9e44-822f-90cc-9a353138f744/raw?se=2026-08-17T03%3A33%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=42f71e96-ebb2-5813-a181-4604523f26f0&skoid=bbd22fc4-f881-4ea4-b2f3-c12033cf6a8b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-16T20%3A03%3A00Z&ske=2026-08-17T20%3A03%3A00Z&sks=b&skv=2026-02-06&sig=fo1WSTogXwWb1Imgub%2B5NGW8HbO7prZO/%2BqsO089cyI%3D' -o /tmp/bridgepoint-v228.zip
          echo '30d66c1d95ddb05e7ac928a9c5b261d94e90d6897eb300046fa396ba5db091b5  /tmp/bridgepoint-v228.zip' | sha256sum -c -
          rm -rf site
          mkdir -p site
          unzip -q /tmp/bridgepoint-v228.zip -d site
          test -s site/index.html
          test -s site/main.dart.js
          test -s site/bridgepoint-release.json
          grep -q '2899bd4ec92bca526b3adba99174ea4aebf30530' site/bridgepoint-release.json
          grep -q 'bridgepoint-v228-owner-map-weather-expansion' site/main.dart.js
          grep -q 'IN-PROGRESS BUILDS' site/main.dart.js
          grep -q 'Build steps, percentages & approval gates' site/main.dart.js
          grep -q 'Approve & continue' site/main.dart.js
          grep -q 'NOAA LIVE RAIN / PRECIPITATION RADAR' site/main.dart.js
          grep -q 'Open radar' site/main.dart.js
          grep -q 'Creates a unique BridgePoint link' site/main.dart.js
          grep -q 'Adds a company or person' site/main.dart.js
          grep -q 'Automation Recovery' site/main.dart.js
          grep -q 'First-time invited owner / Forgot password' site/main.dart.js
          grep -q 'bridgepointintelligence@gmail.com' site/main.dart.js
          if grep -q 'nowcoast.noaa.gov/geoserver/observations/satellite' site/main.dart.js; then
            echo 'Legacy satellite endpoint unexpectedly remains active in compiled release.' >&2
            exit 1
          fi
          echo 'BridgePoint v228 production artifact verified for deployment.'
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish BridgePoint
        id: deployment
        uses: actions/deploy-pages@v4
# V5374 fresh publish trigger: global roof shell verification
name: Publish BridgePoint V5374 Lightweight World

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v5371-lightweight-world.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: bridgepoint-v5000-production-authority
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: live-artifact
          fetch-depth: 1

      - name: Verify V5374 artifact contract
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s landing.js
          test -s landing.css
          test -s app/index.html
          test -s app.js
          test -s world-v2300-map.js
          cp world-v2300-map.js /tmp/world-v5374.mjs
          node --check /tmp/world-v5374.mjs
          node --check app.js
          grep -Fq 'LIVE PRODUCT PREVIEW' index.html
          grep -Fq 'landingProperties' index.html
          grep -Fq 'ABOUT THE FOUNDER' index.html
          grep -Fq 'id="previewMap"' index.html
          grep -Fq 'world-v2300-map.js?v=5374' landing.js
          grep -Fq '__BP_APP_BUILD_VERSION__=5374' app.js
          grep -Fq 'world-v2300-map.js?v=5374' app.js
          grep -Fq '__BP_WORLD_RENDER_VERSION__=5374' world-v2300-map.js
          grep -Fq 'bridgepoint-public-city-structures-v5371' world-v2300-map.js
          grep -Fq "source:'bpCityStructures','source-layer':'roofs'" world-v2300-map.js
          grep -Fq "id:'gta-city-building-roof-caps'" world-v2300-map.js
          ! grep -Fq "filter:['!=',['get','has_real_roof'],true]" world-v2300-map.js
          grep -Fq "GLOBAL_ROOF_MIN" world-v2300-map.js
          grep -Fq "GLOBAL_FLOOR_MIN" world-v2300-map.js
          ! grep -Fq "'fill-extrusion-pattern':roofPattern" world-v2300-map.js
          grep -Fq "'fill-extrusion-height':['+',bHeight,.9]" world-v2300-map.js
          grep -Fq "cancelPendingTileRequestsWhileZooming:true" world-v2300-map.js
          grep -Fq "fineDetailDisabled:true" world-v2300-map.js
          grep -Fq "buildingClickOverlook:true" world-v2300-map.js
          grep -Fq "canvas.addEventListener('click'" world-v2300-map.js
          grep -Fq "layerState={parcels:true,buildings:true}" world-v2300-map.js
          ! grep -Fq '__BP_WORLD_RENDER_VERSION__=5370' world-v2300-map.js
          ! grep -Fqi 'cesium' index.html
          ! grep -Fqi 'cesium' app/index.html
          echo V5374_ARTIFACT_CONTRACT_OK

      - name: Smoke-test source-backed city structure tile
        shell: bash
        run: |
          set -euo pipefail
          KEY=$(sed -n "s/^export const KEY='\([^']*\)'.*/\1/p" world-v2300-config.js)
          CODE=$(curl -sS --retry 3 --retry-all-errors --retry-delay 1             -H 'Origin: https://bridgepointintelligence.online'             -H "apikey: ${KEY}"             -o /tmp/city.mvt             -w '%{http_code}'             'https://xdfsjztwgsbmabshzsjw.supabase.co/functions/v1/bridgepoint-public-city-structures-v5371?z=11&x=602&y=770&limit=500&v=5374')
          BYTES=$(wc -c </tmp/city.mvt)
          echo "CITY_TILE_HTTP=${CODE} BYTES=${BYTES}"
          test "${CODE}" = 200
          test "${BYTES}" -gt 1000



      - name: Assemble Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir site
          tar --exclude=.git --exclude=.github --exclude=site -cf - . | tar -xf - -C site
          touch site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v4
        with:
          name: bridgepoint-v5374-lightweight
          path: site

      - name: Deploy V5374
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: bridgepoint-v5374-lightweight

      - name: Browser verify lightweight city, roofs, camera and homepage
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium-browser || command -v chromium)
          cd /tmp
          npm init -y >/dev/null 2>&1 || true
          npm install puppeteer-core@24 --no-audit --no-fund >/dev/null 2>&1
          CHROME_PATH="$CHROME" node <<'NODE'
          const puppeteer=require('puppeteer-core');
          const O='https://bridgepointintelligence.online';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          (async()=>{
            const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME_PATH,args:['--no-sandbox','--disable-dev-shm-usage','--enable-webgl','--ignore-gpu-blocklist','--enable-unsafe-swiftshader']});
            try{
              const app=await browser.newPage();
              await app.setUserAgent('Mozilla/5.0 (Linux; Android 16; Pixel 9a) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36');
              await app.setViewport({width:390,height:844,deviceScaleFactor:2,isMobile:true,hasTouch:true});
              await app.goto(O+'/app/?verify5374='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
              await app.waitForFunction(()=>window.__BP_WORLD_RENDER_VERSION__===5374&&window.__BP_V5000_WORLD?.map,{timeout:45000});
              await app.evaluate(()=>window.__BP_V5000_WORLD.map.jumpTo({center:[-74.006,40.7128],zoom:11.35,pitch:58,bearing:-18}));
              try{
                await app.waitForFunction(()=>{
                  const m=window.__BP_V5000_WORLD?.map;
                  if(!m||window.__BP_V5000_WORLD.state?.terrain!==true)return false;
                  try{return (m.querySourceFeatures('bpCityStructures',{sourceLayer:'buildings'})||[]).length>=150}catch{return false}
                },{timeout:35000});
              }catch(err){
                const diag=await app.evaluate(()=>{
                  const w=window.__BP_V5000_WORLD,m=w?.map;
                  let buildings=-1,loaded=null,cityVis=null,roofVis=null;
                  try{buildings=(m?.querySourceFeatures('bpCityStructures',{sourceLayer:'buildings'})||[]).length}catch{}
                  try{loaded=m?.isSourceLoaded?.('bpCityStructures')??null}catch{}
                  try{cityVis=m?.getLayoutProperty?.('gta-city-buildings','visibility')??null}catch{}
                  try{roofVis=m?.getLayoutProperty?.('gta-city-building-roof-caps','visibility')??null}catch{}
                  return{version:window.__BP_WORLD_RENDER_VERSION__,hasWorld:!!w,zoom:m?.getZoom?.(),terrain:w?.state?.terrain,terrainVisual:window.__BP_TERRAIN_VISUAL_STATE__,buildings,loaded,cityVis,roofVis,mode:window.__BP_BUILDING_SHELL_MODE__,status:document.getElementById('mapStatus')?.textContent||null};
                });
                throw new Error('CITY_WAIT_DIAG '+JSON.stringify(diag)+' :: '+String(err));
              }
              const city=await app.evaluate(()=>{
                const m=window.__BP_V5000_WORLD.map;
                const buildings=(m.querySourceFeatures('bpCityStructures',{sourceLayer:'buildings'})||[]).length;
                const exactRoofs=(m.querySourceFeatures('bpCityStructures',{sourceLayer:'roofs'})||[]).length;
                let roofCaps=0;try{roofCaps=(m.queryRenderedFeatures(undefined,{layers:['gta-city-building-roof-caps']})||[]).length}catch{}
                const fine=window.__BP_FINE_DETAIL_MODE__||{};
                return{
                  buildings,exactRoofs,roofCaps,
                  cityVis:m.getLayoutProperty('gta-city-buildings','visibility')||'visible',
                  roofCapVis:m.getLayoutProperty('gta-city-building-roof-caps','visibility')||'visible',
                  exactRoofVis:m.getLayoutProperty('gta-city-roofs','visibility')||'visible',
                  stateVis:m.getLayoutProperty('gta-state','visibility')||'visible',
                  parcelVis:m.getLayoutProperty('gta-parcel','visibility')||'visible',
                  terrain:window.__BP_V5000_WORLD.state.terrain,
                  fine
                };
              });
              if(city.buildings<150||city.cityVis==='none'||city.stateVis==='none'||city.parcelVis==='none'||!city.terrain||city.fine.enabled!==false)throw new Error('CITY '+JSON.stringify(city));

              await app.evaluate(()=>window.__BP_V5000_WORLD.map.jumpTo({center:[-74.006,40.7128],zoom:14.6,pitch:58,bearing:-18}));
              await sleep(4500);
              const hit=await app.evaluate(()=>{
                const m=window.__BP_V5000_WORLD.map,c=m.getCanvas(),w=c.clientWidth,h=c.clientHeight;
                const layers=['gta-city-buildings','gta-exact-building'];
                for(let y=80;y<h-40;y+=24)for(let x=20;x<w-20;x+=24){
                  try{if((m.queryRenderedFeatures({x,y},{layers})||[]).length)return{x,y}}catch{}
                }
                return null
              });
              if(!hit)throw new Error('NO_BUILDING_HIT');
              const selected=await app.evaluate(hit=>window.__BP_V5000_WORLD.selectBuildingAtPoint(hit),hit);
              if(!selected)throw new Error('BUILDING_SELECT_API_FALSE '+JSON.stringify(hit));
              await sleep(900);
              const cam=await app.evaluate(()=>{const m=window.__BP_V5000_WORLD.map;return{z:m.getZoom(),pitch:m.getPitch(),bearing:m.getBearing()}});
              if(cam.z<16.2||cam.pitch<60)throw new Error('CAMERA '+JSON.stringify(cam));
              await app.waitForFunction(()=>{
                const m=window.__BP_V5000_WORLD?.map;
                try{return (m?.querySourceFeatures('bpCityStructures',{sourceLayer:'roofs'})||[]).length>0}catch{return false}
              },{timeout:25000});
              const roofDetail=await app.evaluate(()=>{
                const m=window.__BP_V5000_WORLD.map;
                return (m.querySourceFeatures('bpCityStructures',{sourceLayer:'roofs'})||[]).length;
              });
              if(roofDetail<1)throw new Error('NYC_REAL_ROOFS '+roofDetail);
              await sleep(1800);
              const nyRoofCaps=await app.evaluate(()=>{
                const m=window.__BP_V5000_WORLD.map;
                try{return (m.queryRenderedFeatures(undefined,{layers:['gta-city-building-roof-caps']})||[]).length}catch{return 0}
              });

              // Global regression gate: source-backed OpenFreeMap buildings must stay 3D,
              // and the lightweight roof layer must restore after camera motion.
              await app.evaluate(()=>window.__BP_V5000_WORLD.map.jumpTo({center:[-0.1276,51.5072],zoom:14.2,pitch:58,bearing:-18}));
              await sleep(3200);
              const global3d=await app.evaluate(()=>{
                const m=window.__BP_V5000_WORLD.map;
                let bodies=0,roofs=0,sourceRows=0,withRenderHeight=0;
                try{bodies=(m.queryRenderedFeatures(undefined,{layers:['gta-context-buildings']})||[]).length}catch{}
                try{roofs=(m.queryRenderedFeatures(undefined,{layers:['gta-context-roofs']})||[]).length}catch{}
                try{
                  const rows=m.querySourceFeatures('ofm',{sourceLayer:'building'})||[];
                  sourceRows=rows.length;
                  withRenderHeight=rows.filter(f=>Number(f?.properties?.render_height||f?.properties?.height||0)>3).length;
                }catch{}
                return{
                  bodies,roofs,sourceRows,withRenderHeight,
                  bodyVis:m.getLayoutProperty('gta-context-buildings','visibility')||'visible',
                  roofVis:m.getLayoutProperty('gta-context-roofs','visibility')||'visible',
                  mode:window.__BP_BUILDING_SHELL_MODE__
                };
              });
              if(global3d.bodies<10||global3d.roofs<10||global3d.sourceRows<10||global3d.bodyVis==='none'||global3d.roofVis==='none'){
                const roofDiag=await app.evaluate(async()=>{
                  const m=window.__BP_V5000_WORLD.map;
                  let forced=0,err=null;
                  try{
                    m.setPaintProperty('gta-context-roofs','fill-extrusion-base',0);
                    m.setPaintProperty('gta-context-roofs','fill-extrusion-height',50);
                    m.setPaintProperty('gta-context-roofs','fill-extrusion-color','#ffffff');
                    m.setPaintProperty('gta-context-roofs','fill-extrusion-opacity',1);
                    m.triggerRepaint();
                    await new Promise(r=>setTimeout(r,900));
                    forced=(m.queryRenderedFeatures(undefined,{layers:['gta-context-roofs']})||[]).length;
                  }catch(e){err=String(e?.message||e)}
                  return{forced,err,runtimeErrors:window.__BP_MAP_RUNTIME_ERRORS__||[],layer:m.getStyle()?.layers?.find(x=>x.id==='gta-context-roofs')||null};
                });
                throw new Error('GLOBAL_3D '+JSON.stringify({global3d,roofDiag}));
              }

              await app.waitForFunction(()=>window.__BP_LIVE_WEATHER_STATE__||document.querySelector('#liveLegend'),{timeout:12000}).catch(()=>{});
              const startup=await app.evaluate(()=>{
                const m=window.__BP_V5000_WORLD.map;
                return{
                  radarA:!!m.getLayer('bp-radar-a'),
                  weatherPoints:!!m.getLayer('bp-v5004-weather-points'),
                  weatherVisible:!m.getLayer('bp-v5004-weather-points')||((m.getLayoutProperty('bp-v5004-weather-points','visibility')||'visible')!=='none'),
                  fine:window.__BP_FINE_DETAIL_MODE__
                }
              });
              if(!startup.radarA||!startup.weatherPoints||!startup.weatherVisible||startup.fine?.enabled!==false)throw new Error('STARTUP '+JSON.stringify(startup));
              await app.close();

              const root=await browser.newPage();
              await root.setViewport({width:390,height:844,deviceScaleFactor:2,isMobile:true,hasTouch:true});
              await root.goto(O+'/?verify5374='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
              await root.waitForSelector('#previewMap',{timeout:10000});
              await root.waitForFunction(()=>window.__BP_LANDING_WORLD__?.map&&window.__BP_WORLD_RENDER_VERSION__===5374,{timeout:45000});
              const home=await root.evaluate(()=>({
                preview:!!document.querySelector('#previewMap'),
                counts:['landingProperties','landingBuildings','landingAddresses','landingBoundaries'].every(id=>!!document.getElementById(id)),
                founder:document.body.textContent.includes('ABOUT THE FOUNDER')&&document.body.textContent.includes('Kole Johnson'),
                world:window.__BP_WORLD_RENDER_VERSION__
              }));
              if(!home.preview||!home.counts||!home.founder||home.world!==5374)throw new Error('HOME '+JSON.stringify(home));
              console.log('V5374_FINAL_PASS',JSON.stringify({city,cam,roofDetail,nyRoofCaps,global3d,startup,home}));
              await root.close();
            }finally{await browser.close()}
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          NODE

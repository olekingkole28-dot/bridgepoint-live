name: Verify BridgePoint V683 Live Domain

on:
  workflow_run:
    workflows:
      - "Deploy BridgePoint Single Publisher V683"
    types: [completed]
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-live.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bridgepoint-v683-live-verification
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live custom-domain surfaces
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            local url="$1" out="$2"
            code="$(curl --proto '=https' --tlsv1.2 -L -sS --retry 6 --retry-delay 3 --max-time 45 -o "$out" -w '%{http_code}' "$url")"
            echo "$url -> $code"
            test "$code" = "200"
            test -s "$out"
          }
          fetch 'https://bridgepointintelligence.online/' /tmp/home
          fetch 'https://bridgepointintelligence.online/app/' /tmp/app-index
          fetch 'https://bridgepointintelligence.online/app/bridgepoint-release.json' /tmp/release.json
          fetch 'https://bridgepointintelligence.online/app/public-promotion-v682.json' /tmp/promotion.json
          fetch 'https://bridgepointintelligence.online/app/main.dart.js' /tmp/main.dart.js
          fetch 'https://bridgepointintelligence.online/sample/' /tmp/sample
          fetch 'https://bridgepointintelligence.online/contact/' /tmp/contact
          fetch 'https://bridgepointintelligence.online/enterprise/trust/' /tmp/trust
          fetch 'https://bridgepointintelligence.online/capabilities/' /tmp/capabilities
          fetch 'https://bridgepointintelligence.online/free-tools/' /tmp/free-tools
          fetch 'https://bridgepointintelligence.online/.well-known/security.txt' /tmp/security.txt

      - name: Verify modern compiled app provenance and public contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          release=json.loads(Path('/tmp/release.json').read_text(encoding='utf-8'))
          promotion=json.loads(Path('/tmp/promotion.json').read_text(encoding='utf-8'))
          actual=hashlib.sha256(Path('/tmp/main.dart.js').read_bytes()).hexdigest()
          assert release.get('public_origin') == 'https://bridgepointintelligence.online/', release
          assert release.get('version') == promotion.get('compiled_source_sha'), (release,promotion)
          assert actual == promotion.get('main_js_sha256'), (actual,promotion.get('main_js_sha256'))
          assert promotion.get('source_repo_private') is True, promotion
          assert promotion.get('public_release') == 682, promotion
          assert release.get('version') not in {444,'444',653,'653'}, release
          print('Verified compiled app source:', release.get('version'))
          print('Verified main.dart.js SHA-256:', actual)
          PY
          grep -q '<base href="/app/">' /tmp/app-index
          grep -q 'Know where to work before you knock' /tmp/home
          grep -q 'Trust Center' /tmp/home
          grep -q 'Show my free opportunities' /tmp/sample
          grep -q 'independent Connecticut-based property-intelligence software platform' /tmp/contact
          grep -q 'Public Trust Center' /tmp/trust
          grep -q 'Everything BridgePoint Can Do' /tmp/capabilities
          grep -q 'Free Property Intelligence Snapshot' /tmp/free-tools
          grep -q 'Canonical: https://bridgepointintelligence.online/.well-known/security.txt' /tmp/security.txt
          if grep -E -i 'sb_secret_[A-Za-z0-9_-]{20,}|sk_live_[A-Za-z0-9_-]{20,}|sk-proj-[A-Za-z0-9_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' /tmp/home /tmp/app-index /tmp/sample /tmp/contact /tmp/trust /tmp/capabilities /tmp/free-tools /tmp/security.txt; then
            echo 'Privileged secret-shaped value found on a fetched public surface.' >&2
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Android mobile touch and layout smoke test
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/bp-mobile-v683
          mkdir -p "$ROOT"
          cd "$ROOT"
          npm init -y >/dev/null 2>&1
          npm install --no-save --ignore-scripts puppeteer-core@24.16.0 >/dev/null 2>&1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          export CHROME
          cat > verify.cjs <<'JS'
          const puppeteer=require('puppeteer-core');
          const ORIGIN='https://bridgepointintelligence.online';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const heroSelector='a[href*="utm_medium=hero"][href*="free_territory_preview"]';
          (async()=>{
            const browser=await puppeteer.launch({
              executablePath:process.env.CHROME,
              headless:true,
              protocolTimeout:45000,
              args:['--no-sandbox','--disable-dev-shm-usage','--disable-gpu','--disable-vulkan','--disable-background-networking','--disable-sync']
            });
            try{
              const page=await browser.newPage();
              page.setDefaultTimeout(22000);
              await page.setViewport({width:390,height:844,deviceScaleFactor:1,isMobile:true,hasTouch:true});
              await page.setUserAgent('Mozilla/5.0 (Linux; Android 16; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Mobile Safari/537.36');
              const consoleErrors=[];
              const pageErrors=[];
              page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});
              page.on('pageerror',e=>pageErrors.push(String(e.message||e)));

              await page.goto(`${ORIGIN}/?verify_mobile_v683=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:35000});
              await page.waitForSelector('h1',{visible:true,timeout:12000});
              await page.waitForSelector(heroSelector,{visible:true,timeout:12000});
              const home=await page.evaluate((sel)=>({
                url:location.href,
                title:document.title,
                h1:document.querySelector('h1')?.textContent||'',
                href:document.querySelector(sel)?.getAttribute('href')||'',
                overflow:document.documentElement.scrollWidth-window.innerWidth,
                body:(document.body.innerText||'').slice(0,500)
              }),heroSelector);
              console.log('HOME_DIAGNOSTIC',JSON.stringify(home));
              if(!home.h1.includes('Know where to work before you knock')) throw new Error(`Mobile homepage headline mismatch at ${home.url}: ${home.h1}`);
              if(!home.href.includes('/sample/')) throw new Error(`Mobile territory CTA missing or misrouted: ${home.href}`);
              if(home.overflow>8) throw new Error(`Mobile homepage horizontal overflow ${home.overflow}px`);

              await Promise.all([
                page.waitForNavigation({waitUntil:'domcontentloaded',timeout:20000}),
                page.tap(heroSelector)
              ]);
              if(!page.url().includes('/sample/')) throw new Error(`Territory CTA landed at ${page.url()}`);
              await page.waitForFunction(()=>document.body.innerText.includes('Show my free opportunities'),{timeout:15000});
              const sample=await page.evaluate(()=>({
                url:location.href,
                hasAction:document.body.innerText.includes('Show my free opportunities'),
                overflow:document.documentElement.scrollWidth-window.innerWidth,
                body:(document.body.innerText||'').slice(0,500)
              }));
              console.log('SAMPLE_DIAGNOSTIC',JSON.stringify(sample));
              if(!sample.hasAction) throw new Error('Sample mobile action missing');
              if(sample.overflow>8) throw new Error(`Sample page horizontal overflow ${sample.overflow}px`);

              await page.goto(`${ORIGIN}/app/?verify_mobile_v683=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForFunction(()=>!!document.querySelector('flutter-view,flt-glass-pane,canvas'),{timeout:22000});
              await sleep(1500);
              const app=await page.evaluate(()=>({
                url:location.href,
                mounted:!!document.querySelector('flutter-view,flt-glass-pane,canvas'),
                overflow:document.documentElement.scrollWidth-window.innerWidth,
                bodyLength:(document.body.innerText||'').length
              }));
              console.log('APP_DIAGNOSTIC',JSON.stringify({app,consoleErrors:consoleErrors.slice(0,10),pageErrors:pageErrors.slice(0,10)}));
              if(!app.mounted) throw new Error('Flutter runtime did not mount on Android mobile browser');
              if(app.overflow>20) throw new Error(`Flutter mobile shell horizontal overflow ${app.overflow}px`);
            } finally {
              await browser.close();
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          node verify.cjs

      - name: Verify NOAA radar transports remain reachable
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSL --retry 2 --retry-delay 2 --max-time 25 \
            'https://mapservices.weather.noaa.gov/eventdriven/services/radar/radar_base_reflectivity/MapServer/WMSServer?SERVICE=WMS&REQUEST=GetCapabilities&VERSION=1.3.0' \
            -o /tmp/noaa-now.xml
          curl --proto '=https' --tlsv1.2 -fsSL --retry 2 --retry-delay 2 --max-time 25 \
            'https://mapservices.weather.noaa.gov/eventdriven/services/radar/radar_base_reflectivity_time/ImageServer/WMSServer?SERVICE=WMS&REQUEST=GetCapabilities&VERSION=1.3.0' \
            -o /tmp/noaa-history.xml
          grep -qi 'WMS_Capabilities\|WMT_MS_Capabilities' /tmp/noaa-now.xml
          grep -qi 'WMS_Capabilities\|WMT_MS_Capabilities' /tmp/noaa-history.xml

      - name: Record V683 live verification receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path
          release=json.loads(Path('/tmp/release.json').read_text(encoding='utf-8'))
          promotion=json.loads(Path('/tmp/promotion.json').read_text(encoding='utf-8'))
          actual=hashlib.sha256(Path('/tmp/main.dart.js').read_bytes()).hexdigest()
          status={
            'status':'VERIFIED',
            'publisher_release':683,
            'compiled_public_release':promotion.get('public_release'),
            'compiled_source_sha':promotion.get('compiled_source_sha'),
            'main_js_sha256':actual,
            'verified_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
            'public_origin':'https://bridgepointintelligence.online/',
            'source_repo_private':promotion.get('source_repo_private') is True,
            'checks':{
              'custom_domain_https_200':True,
              'compiled_digest_matches_promotion_receipt':True,
              'release_source_matches_promotion_receipt':True,
              'obsolete_v444_v653_regression_blocked':True,
              'territory_first_homepage_live':True,
              'sample_surface_live':True,
              'contact_identity_surface_live':True,
              'trust_center_live':True,
              'capability_catalog_live':True,
              'free_tools_live':True,
              'security_txt_live':True,
              'android_390x844_real_touch_smoke_passed':True,
              'flutter_runtime_mounted_mobile':True,
              'no_privileged_secret_shape_on_checked_surfaces':True,
              'noaa_current_wms_reachable':True,
              'noaa_historical_wms_reachable':True
            }
          }
          Path('live-verification-status.json').write_text(json.dumps(status,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(status,indent=2))
          PY
          git config user.name 'BridgePoint Verification Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add live-verification-status.json
          if git diff --cached --quiet; then
            echo 'Verification receipt unchanged.'
          else
            git commit -m 'Record guarded V683 Android mobile/live verification [skip ci]'
            git push origin HEAD:main
          fi

name: Publish BridgePoint Open Python Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'bridgepoint-property-intelligence-v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build package
        working-directory: tools/bridgepoint-property-intelligence
        run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: bridgepoint-property-intelligence-dist
          path: tools/bridgepoint-property-intelligence/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bridgepoint-property-intelligence-dist
          path: dist
      - name: Publish through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1

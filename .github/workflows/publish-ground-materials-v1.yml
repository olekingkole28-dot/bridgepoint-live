           if(!map.getLayer(PAVE))map.addLayer({id:PAVE,type:'fill',source:SRC,minzoom:14,filter:['==',['get','kind'],'pave'],paint:{'fill-color':'#a79d88','fill-opacity':1,'fill-antialias':false}},before());
           if(!paver){paver=fetch('/assets/street-detail-v1/pavers.png').then(r=>{if(!r.ok)throw Error('PAVER_HTTP');return r.blob()}).then(createImageBitmap).then(img=>{if(dead){img.close();return}if(!map.hasImage('bp-ground-pavers-v1'))map.addImage('bp-ground-pavers-v1',img,{pixelRatio:2});img.close();if(map.getLayer(PAVE))map.setPaintProperty(PAVE,'fill-pattern','bp-ground-pavers-v1');d.pavingAsset=true;}).catch(e=>{d.pavingError=String(e);paver=null});}
           else if(map.hasImage('bp-ground-pavers-v1')&&map.getLayer(PAVE))map.setPaintProperty(PAVE,'fill-pattern','bp-ground-pavers-v1');

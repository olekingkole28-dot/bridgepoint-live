              if i+1>=len(I) or I[i+1,0]!=tri[0] or I[i+1,2]!=tri[1]:
                  emit(k,p,U[tri]/4.,[tint]*3);i+=1;continue
              a,b,c,e=P[[tri[0],tri[2],tri[1],I[i+1,1]]]
              length=float(np.linalg.norm(b-a));height=float(c[1]-b[1]);bays=float(U[tri[2],0]);floors=float(U[tri[1],1])
              if height<.2 or length<.15:i+=2;continue

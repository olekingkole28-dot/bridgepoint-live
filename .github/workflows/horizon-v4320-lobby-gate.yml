name: Horizon V4341 Lobby Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/horizon/**'
      - 'app/horizon-playable/assets/characters/**'
      - 'scripts/browser-horizon-v4320-lobby.mjs'
      - '.github/workflows/horizon-v4320-lobby-gate.yml'

permissions:
  contents: read

concurrency:
  group: horizon-v4341-lobby
  cancel-in-progress: true

jobs:
  lobby:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static Horizon lobby gates
        run: |
          set -euo pipefail
          node --check app/horizon/app.js
          node --check app/horizon/lobby-scene.js
          node --check app/horizon/model-preview.js
          node --check app/horizon/cosmetics-v4320.js
          grep -Fq 'BP_HORIZON_LOBBY_V4341' app/horizon/app.js
          grep -Fq 'bridgepoint_horizon_social_inbox_v4341' app/horizon/app.js
          grep -Fq 'bridgepoint_horizon_friend_request_v4341' app/horizon/app.js
          grep -Fq 'bridgepoint_horizon_lobby_invite_v4341' app/horizon/app.js
          grep -Fq 'bridgepoint_horizon_report_player_v4341' app/horizon/app.js
          grep -Fq 'bridgepoint_horizon_owner_reports_v4341' app/horizon/app.js
          grep -Fq 'bridgepoint_horizon_map_catalog_v4330' app/horizon/app.js
          grep -Fq "perspective:'FIRST_PERSON_ONLY'" app/horizon/app.js
          grep -Fq "authoritative_modes:['YEAR_ONE','TDM']" app/horizon/app.js
          grep -Fq "map_rotation:'VOTE_TWO_PLUS_RANDOM'" app/horizon/app.js
          grep -Fq 'map_count:state.maps.length' app/horizon/app.js
          ! grep -Fq 'bridgepoint_horizon_select_map_v4330' app/horizon/app.js
          grep -Fq 'PREVIEW READY · CHECKOUT OWNER-LOCKED' app/horizon/app.js
          grep -Fq 'bridgepoint_horizon_set_profile_v4320' app/horizon/app.js
          grep -Fq 'bridgepoint_horizon_year_one_enter_v4341' app/horizon/app.js
          grep -Fq 'bridgepoint_horizon_account_link_v4341' app/horizon/app.js
          grep -Fq 'bridgepoint_horizon_map_vote_v4341' app/horizon/app.js
          grep -Fq 'bridgepoint_horizon_weapon_catalog_v4341' app/horizon/app.js
          grep -Fq "tdm_target_players:100" app/horizon/app.js
          grep -Fq 'data-tab="ARMORY"' app/horizon/index.html
          grep -Fq 'data-tab="FRIENDS"' app/horizon/index.html
          grep -Fq 'id="friendsBadge"' app/horizon/index.html
          grep -Fq 'data-tab="RULES"' app/horizon/index.html
          grep -Fq 'data-tab="ABOUT"' app/horizon/index.html
          grep -Fq 'yearOneCountdown' app/horizon/index.html
          grep -Fq 'OCT 1 · 12:00 AM ET' app/horizon/index.html
          grep -Fq 'getPreciseLocation' app/horizon/app.js
          test -s app/horizon-playable/assets/characters/mesh2motion/models/swat_male.glb
      - name: Install browser driver
        run: npm install --no-save --no-audit --no-fund playwright-core@1.55.0
      - name: Start checked-out site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/horizon-lobby.log 2>&1 &
          sleep 1
      - name: Verify current Android lobby
        env:
          HORIZON_TEST_BASE: http://127.0.0.1:4173
        run: node scripts/browser-horizon-v4320-lobby.mjs

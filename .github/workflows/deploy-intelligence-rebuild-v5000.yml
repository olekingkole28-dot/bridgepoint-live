          grep -Fq 'rel="preload" as="image" href="/assets/molly-materson-bridgepoint.webp"' site/index.html
          grep -Fq 'rel="preload" as="image" href="/assets/molly-materson-bridgepoint.webp"' site/app/index.html
          grep -Fq 'demo3D' site/walkthrough-v5537.js

name: Stop Superseded Saturn v6285 Compression Attempts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stop-superseded-saturn-attempts.yml'

permissions:
  actions: write

jobs:
  stop-obsolete:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel only the two superseded slow-method compression runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 42720127468 42720200682; do
            code="$(curl -sS -o "/tmp/cancel-$run_id.json" -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/$run_id/cancel")"
            echo "cancel run $run_id -> HTTP $code"
            if [ "$code" != "202" ] && [ "$code" != "409" ]; then
              cat "/tmp/cancel-$run_id.json"
              exit 1
            fi
          done

name: Validate BridgePoint Restoration
on:
  push:
    branches: [ui-v1046, ui-v1047, ui-v1048, ui-v1049, ui-v1050, live-artifact]
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check restoration JavaScript syntax
        run: |
          node --check app/auth-restoration-v1046.js
          node --check app/property-360-v1046.js
          node --check app/workspace-restoration-v1046.js
          node --check app/home-widgets-v1046.js
          node --check app/capability-explorer-v1047.js
          node --check app/operations-restoration-v1048.js
          node --check app/advanced-workflows-v1049.js
          node --check app/owner-product-admin-v1050.js
      - name: Verify runtime loader references
        run: |
          grep -q 'auth-restoration-v1046.js' app/index.html
          grep -q 'property-360-v1046.js' app/index.html
          grep -q 'workspace-restoration-v1046.js' app/index.html
          grep -q 'home-widgets-v1046.js' app/index.html
          grep -q 'capability-explorer-v1047.js' app/index.html
          grep -q 'operations-restoration-v1048.js' app/index.html
          grep -q 'advanced-workflows-v1049.js' app/index.html
          grep -q 'owner-product-admin-v1050.js' app/index.html
          grep -q 'data-bridgepoint-runtime="v1050"' app/index.html
      - name: Verify no merge markers
        run: |
          ! grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' app/*.js app/index.html
